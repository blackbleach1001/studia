<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Studia · Semestr 3</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Studia">
<meta name="theme-color" content="#fffdf9">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="icon" href="assets/icon-180.png">
<link rel="stylesheet" href="assets/study.css">
<style>
:root{--st-h:28;--st-s:22%;--st-l:45%}
.page{max-width:980px}
.hero{border-bottom-color:var(--line)}
.subjects{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px;margin-top:24px}
.subject{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.subject>header{padding:16px 18px 12px;background:hsl(var(--sh),var(--ss),95%);border-bottom:3px solid hsl(var(--sh),var(--ss),var(--sl))}
.subject h2{font-size:1.2rem;margin:0;color:hsl(var(--sh),var(--ss),28%)}
.subject .kind{font-size:.85rem;color:var(--ink-soft);margin:2px 0 0}
.subject ul{list-style:none;margin:0;padding:6px 8px 10px}
.subject li{margin:0;padding:8px 10px;border-radius:10px}
.subject li+li{border-top:1px solid var(--line)}
.item-title{font-weight:700;margin:0 0 6px;line-height:1.35}
.item-meta{font-size:.85rem;color:var(--ink-soft);margin:-4px 0 8px}
.item-links{display:flex;flex-wrap:wrap;gap:8px}
.item-links a{
  display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:999px;font-weight:700;font-size:.95rem;text-decoration:none;
  border:1.5px solid hsl(var(--sh),var(--ss),var(--sl));color:hsl(var(--sh),var(--ss),28%);background:#fff;
}
.item-links a.main{background:hsl(var(--sh),var(--ss),30%);border-color:hsl(var(--sh),var(--ss),30%);color:#fff}
.item-links a:hover{filter:brightness(.96)}
.empty{padding:14px 18px 18px;color:var(--ink-soft);font-style:italic;margin:0}
.help{margin-top:40px;font-size:.92rem;color:var(--ink-soft);max-width:65ch}
</style>
</head>
<body>
<div class="page">
  <header class="hero">
    <div class="eyebrow">Psychologia SWPS · Semestr 3</div>
    <h1>Studia</h1>
    <p class="meta">Notatki i fiszki w jednym miejscu.</p>
  </header>

  <main class="subjects" id="subjects" aria-label="Przedmioty"></main>

  <p class="help">W każdym materiale na dole ekranu jest pasek: <strong>Skupienie</strong> wyróżnia dotknięty akapit, <strong>Lektor</strong> czyta rozwinięte sekcje polskim głosem iPada. Lepiej brzmi głos rozszerzony: Ustawienia → Dostępność → Treść mówiona → Głosy → Polski.</p>
</div>

<script>
/* ===== Spis materiałów — nowy materiał = nowa pozycja w "items" ===== */
var SUBJECTS = [
  { name: "Psychologia poznawcza", kind: "Wykład + Ćwiczenia", h: 209, s: "33%", l: "56%", items: [
    { title: "Literatura do wykładów i ćwiczeń", meta: "Rozdziały podręcznika, oś czasu, kto jest kim", notes: "poznawcza/literatura.html", cards: "poznawcza/literatura-fiszki.html" },
    { title: "Powtórka", meta: "Test jednokrotnego wyboru, fiszki, pytania otwarte", notes: "poznawcza/powtorka.html", label: "Otwórz" }
  ]},
  { name: "Podstawy metodologii i statystyki", kind: "Wykład + Ćwiczenia", h: 150, s: "26%", l: "44%", items: [
    { title: "Wykłady i ćwiczenia", meta: "Nauka, hipotezy, zmienne, Jamovi i SPSS", notes: "metodologia/notatki.html", cards: "metodologia/notatki-fiszki.html" },
    { title: "Trening", meta: "Test, pytania otwarte, fiszki", notes: "metodologia/trening.html", label: "Otwórz" }
  ]},
  { name: "Psychologia kliniczna i zdrowia", kind: "Wykład + Ćwiczenia", h: 12, s: "42%", l: "58%", items: [
    { title: "Wykłady 1–2", meta: "Patogeneza i salutogeneza, modele zdrowia, stres", notes: "kliniczna/notatki.html", cards: "kliniczna/notatki-fiszki.html" }
  ]},
  { name: "Rozmowa psychologiczna", kind: "Projekt + Ćwiczenia", h: 345, s: "32%", l: "60%", items: [
    { title: "Zajęcia 1 · Kontakt, kontrakt i etyka rozmowy", meta: "Geller i Król · Zalewski", notes: "rozmowa/zajecia-1.html", cards: "rozmowa/zajecia-1-fiszki.html" }
  ]},
  { name: "Psychologia edukacji", kind: "Wykład + Ćwiczenia", h: 36, s: "48%", l: "54%", items: [] },
  { name: "Psychologia pracy i organizacji", kind: "Wykład + Ćwiczenia", h: 300, s: "20%", l: "46%", items: [
    { title: "Wykłady 1–2", meta: "Organizacja, motywacja, środowisko pracy, CSR, etyka", notes: "praca/notatki.html" }
  ]}
];

var root = document.getElementById("subjects");
function esc(t) { var d = document.createElement("div"); d.textContent = t; return d.innerHTML; }
SUBJECTS.forEach(function (sub) {
  var el = document.createElement("section");
  el.className = "subject";
  el.style.setProperty("--sh", sub.h); el.style.setProperty("--ss", sub.s); el.style.setProperty("--sl", sub.l);
  var html = "<header><h2>" + esc(sub.name) + '</h2><p class="kind">' + esc(sub.kind) + "</p></header>";
  if (sub.items.length) {
    html += "<ul>" + sub.items.map(function (it) {
      return "<li>" +
        '<p class="item-title">' + esc(it.title) + "</p>" +
        (it.meta ? '<p class="item-meta">' + esc(it.meta) + "</p>" : "") +
        '<div class="item-links">' +
          '<a class="main" href="' + it.notes + '">' + (it.label || "Notatki") + '</a>' +
          (it.cards ? '<a href="' + it.cards + '">Fiszki</a>' : "") +
        "</div></li>";
    }).join("") + "</ul>";
  } else {
    html += '<p class="empty">Jeszcze nic tu nie ma.</p>';
  }
  el.innerHTML = html;
  root.appendChild(el);
});
</script>
</body>
</html>
