{
"q": "Czym jest psychoterapia i jakie ma formy?",
"a": "<p>Świadome i celowe stosowanie interwencji, strategii i procedur, by pomóc modyfikować zachowanie, procesy poznawcze, emocjonalne lub osobowość w kierunku pożądanym przez obie strony. Formy: <strong>indywidualna, terapia par i rodzin, grupowa<\/strong>. Leczy osoby z zaburzeniami rozpoznanymi wg ICD-10 lub DSM-5.<\/p>",
"src": "Cierpiałkowska i Sęk, 2016, cz. 6",
"k": [
"leczenie zaburzeń",
"indywidualna, grupowa, par i rodzin"
],
"id": "kliniczna/cwiczenia-fiszki:883c3f17",
"unit": "cwiczenia.html",
"sec": "s2"
},
{
"q": "Jak dzieli się szkoły psychoterapii?",
"a": "<p><strong>Paradygmatyczne<\/strong> (psychoanaliza i psychodynamiczna, poznawczo-behawioralna, humanistyczno-egzystencjalna, interpersonalna, systemowa rodzin) oraz <strong>integracyjne i asymilatywne<\/strong> (np. model transteoretyczny).<\/p>",
"src": "Cierpiałkowska i Sęk, 2016, cz. 6",
"k": [
"paradygmatyczne",
"integracyjne"
],
"id": "kliniczna/cwiczenia-fiszki:f265db71",
"unit": "cwiczenia.html",
"sec": "s2"
},
{
"q": "Czym różnią się czynniki specyficzne i wspólne?",
"a": "<p><strong>Specyficzne:<\/strong> mechanizmy danej szkoły (np. interpretacja i wgląd). <strong>Wspólne:<\/strong> relacja terapeutyczna i siła przymierza. Skuteczność wynika z obu, ale w podejściach integracyjnych podkreśla się wspólne.<\/p>",
"src": "Cierpiałkowska i Sęk, 2016, cz. 6",
"k": [
"specyficzne: szkoła",
"wspólne: relacja i przymierze"
],
"id": "kliniczna/cwiczenia-fiszki:b5eb1486",
"unit": "cwiczenia.html",
"sec": "s2"
},
{
"q": "Co to jest kontrakt terapeutyczny i setting?",
"a": "<p><strong>Kontrakt:<\/strong> umowa ustalająca cel i efekt zmiany (w integracyjnych także czy problem jest subiektywnie odczuwany, czy są konkurencyjne motywy, czy to właściwy czas i terapeuta). <strong>Setting:<\/strong> czas, miejsce, odpłatność i forma płatności.<\/p>",
"src": "Cierpiałkowska i Sęk, 2016, cz. 6",
"k": [
"kontrakt: cel zmiany",
"setting: czas, miejsce, płatność"
],
"id": "kliniczna/cwiczenia-fiszki:840b9df1",
"unit": "cwiczenia.html",
"sec": "s2"
},
{
"q": "Czym różni się poradnictwo od psychoterapii?",
"a": "<p>Głównie <strong>adresatami<\/strong>: poradnictwo jest dla osób zdrowych z problemami rozwojowymi i społecznymi (objawy poniżej kryteriów ICD/DSM), psychoterapia dla osób z rozpoznanym zaburzeniem. Poradnictwo jest <strong>krótkoterminowe<\/strong> i opiera się głównie na czynnikach wspólnych; metody są podobne.<\/p>",
"src": "Cierpiałkowska i Sęk, 2016, cz. 6",
"k": [
"osoby zdrowe",
"krótkoterminowe",
"czynniki wspólne"
],
"id": "kliniczna/cwiczenia-fiszki:80d65f06",
"unit": "cwiczenia.html",
"sec": "s3"
},
{
"q": "Jak Czabała i Kluczyńska definiują poradnictwo?",
"a": "<p>Jako pomoc ludziom zdrowym doświadczającym <strong>kryzysów w realizacji zadań rozwojowych<\/strong> i zaspokajaniu potrzeb albo potrzebującym doskonalenia umiejętności potrzebnych do realizacji tych zadań.<\/p>",
"src": "Cierpiałkowska i Sęk, 2016, cz. 6",
"k": [
"zadania rozwojowe"
],
"id": "kliniczna/cwiczenia-fiszki:4c70937e",
"unit": "cwiczenia.html",
"sec": "s3"
},
{
"q": "Na jakiej wiedzy opierają się cele poradnictwa zdrowotnego?",
"a": "<p>Na <strong>psychologii stresu<\/strong>, <strong>psychologii pozytywnej<\/strong> i <strong>koncepcjach zachowania zasobów<\/strong>.<\/p>",
"src": "Cierpiałkowska i Sęk, 2016, cz. 6",
"k": [
"stres",
"psychologia pozytywna",
"zasoby"
],
"id": "kliniczna/cwiczenia-fiszki:4572fed5",
"unit": "cwiczenia.html",
"sec": "s3"
},
{
"q": "Dlaczego poradnictwo ma znaczenie społeczno-kulturowe?",
"a": "<p>Pomaga osobom doświadczającym <strong>dyskryminacji płci<\/strong> i negatywnego naznaczenia z powodu przynależności do mniejszości narodowych i etnicznych (poradnictwo feministyczne, wielokulturowe).<\/p>",
"src": "Cierpiałkowska i Sęk, 2016, cz. 6",
"k": [
"dyskryminacja",
"mniejszości"
],
"id": "kliniczna/cwiczenia-fiszki:ffb7423a",
"unit": "cwiczenia.html",
"sec": "s3"
},
{
"q": "Kiedy poradnictwo bywa skuteczniejsze niż leki?",
"a": "<p>W podstawowej opiece zdrowotnej przy <strong>niepełnoobjawowych zaburzeniach lękowych i depresyjnych<\/strong>: krótkie oddziaływania CBT i terapii motywującej dają szybszy efekt, mniej nawrotów, lepsze radzenie sobie ze stresem i niższy koszt.<\/p>",
"src": "Cierpiałkowska i Sęk, 2016, cz. 6",
"k": [
"lęk i depresja",
"CBT, terapia motywująca"
],
"id": "kliniczna/cwiczenia-fiszki:f03689e9",
"unit": "cwiczenia.html",
"sec": "s3"
},
{
"q": "Co to jest kryzys emocjonalny?",
"a": "<p>Zaburzenie równowagi emocjonalnej: narastające napięcie (zasadniczo lękowe), gdy presja <strong>sytuacji krytycznej<\/strong> przekracza <strong>zasoby zmagania<\/strong> klienta.<\/p>",
"src": "Cierpiałkowska i Sęk, 2016, cz. 6",
"k": [
"napięcie",
"presja vs zasoby"
],
"id": "kliniczna/cwiczenia-fiszki:ab698b9d",
"unit": "cwiczenia.html",
"sec": "s4"
},
{
"q": "Jakie fazy kryzysu opisują Caplan i Sugerman?",
"a": "<p><strong>Caplan:<\/strong> cztery fazy rosnącego napięcia (blokada nawyków, strategii awaryjnych, środków wewnątrzpsychicznych, ostra faza). <strong>Sugerman:<\/strong> 7 faz: szok, reakcja (pobudzenie lub minimalizacja), zwątpienie w siebie, ujawnienie emocji, eksploracja, poszukiwanie sensu, integracja.<\/p>",
"src": "Cierpiałkowska i Sęk, 2016, cz. 6",
"k": [
"Caplan 4 fazy",
"Sugerman 7 faz"
],
"id": "kliniczna/cwiczenia-fiszki:ddce81bc",
"unit": "cwiczenia.html",
"sec": "s4"
},
{
"q": "Dlaczego kryzys jest zjawiskiem dwuwartościowym?",
"a": "<p>Niesie ryzyko zaburzeń (przy daremnym zmaganiu się) i <strong>szansę rozwoju<\/strong> („drugie narodziny”). Nierozwiązany kryzys obniża poczucie wartości i zwiastuje kolejne.<\/p>",
"src": "Cierpiałkowska i Sęk, 2016, cz. 6",
"k": [
"ryzyko",
"szansa rozwoju"
],
"id": "kliniczna/cwiczenia-fiszki:430df4ab",
"unit": "cwiczenia.html",
"sec": "s4"
},
{
"q": "Wymień rodzaje kryzysów.",
"a": "<p>Rozwojowe, małżeńskie i rodzinne; sytuacyjne (losowe) i utraty; suicydalne; katastroficzne (środowiskowe); związane z przemocą; traumatyczne.<\/p>",
"src": "Cierpiałkowska i Sęk, 2016, cz. 6",
"k": [
"rozwojowe",
"sytuacyjne",
"suicydalne",
"katastroficzne",
"przemoc"
],
"id": "kliniczna/cwiczenia-fiszki:265a3a47",
"unit": "cwiczenia.html",
"sec": "s4"
},
{
"q": "Jakie są założenia i cechy interwencji kryzysowej?",
"a": "<p>Klienci mają zasoby i <strong>sami odpowiadają<\/strong> za zakończenie kryzysu; cel: wzmocnić wiarę w siebie i kontrolę. Pomoc <strong>natychmiastowa<\/strong>, <strong>krótkoterminowa<\/strong> (1–10 sesji), skoncentrowana na centralnym problemie, aktywna, elastyczna.<\/p>",
"src": "Cierpiałkowska i Sęk, 2016, cz. 6",
"k": [
"natychmiastowa",
"1–10 sesji",
"skoncentrowana na problemie"
],
"id": "kliniczna/cwiczenia-fiszki:e3e0f370",
"unit": "cwiczenia.html",
"sec": "s4"
},
{
"q": "Z czego składa się diagnoza kryzysu?",
"a": "<p>Rozpoznanie stanu i rodzaju kryzysu, określenie fazy i ewentualnego zagrożenia życia, prognoza powrotu do równowagi. Prowadzona <strong>wspólnie z klientem i przez cały czas trwania kryzysu<\/strong>.<\/p>",
"src": "Cierpiałkowska i Sęk, 2016, cz. 6",
"k": [
"rodzaj",
"faza",
"prognoza"
],
"id": "kliniczna/cwiczenia-fiszki:2a96534c",
"unit": "cwiczenia.html",
"sec": "s4"
},
{
"q": "Jakie nurty interwencji kryzysowej wyróżnia rozdział?",
"a": "<p><strong>Indywidualna<\/strong>, <strong>wielostronna<\/strong> (wieloaspektowa) i <strong>środowiskowa<\/strong> (na rzecz społeczności).<\/p>",
"src": "Cierpiałkowska i Sęk, 2016, cz. 6",
"k": [
"indywidualna",
"wielostronna",
"środowiskowa"
],
"id": "kliniczna/cwiczenia-fiszki:9a0dd3cd",
"unit": "cwiczenia.html",
"sec": "s4"
},
{
"q": "Czym jest rehabilitacja zaburzeń psychicznych i jakie ma treningi?",
"a": "<p>Pomoc dla osób przewlekle chorych psychicznie, zapobiegająca pogłębianiu niepełnosprawności psychospołecznej. Treningi: <strong>neuropoznawczy<\/strong>, <strong>umiejętności społecznych<\/strong>, <strong>społecznego poznania<\/strong>.<\/p>",
"src": "Cierpiałkowska i Sęk, 2016, cz. 6",
"k": [
"trening neuropoznawczy",
"umiejętności społecznych",
"społecznego poznania"
],
"id": "kliniczna/cwiczenia-fiszki:08a97c6b",
"unit": "cwiczenia.html",
"sec": "s5"
},
{
"q": "Co oznaczają zdrowienie i umacnianie?",
"a": "<p><strong>Zdrowienie:<\/strong> dążenie do satysfakcjonującego życia mimo ograniczeń choroby. <strong>Umacnianie:<\/strong> działania promujące samodzielność i zdolność do podejmowania ważnych decyzji życiowych; podstawowa metoda wspierania zdrowienia.<\/p>",
"src": "Cierpiałkowska i Sęk, 2016, cz. 6",
"k": [
"zdrowienie",
"umacnianie (empowerment)"
],
"id": "kliniczna/cwiczenia-fiszki:71284990",
"unit": "cwiczenia.html",
"sec": "s5"
},
{
"q": "Jakie są główne przeszkody w zdrowieniu i czemu służą programy środowiskowe?",
"a": "<p>Przeszkody: <strong>osamotnienie<\/strong> i <strong>stygmatyzacja<\/strong>. Programy środowiskowe (zespoły leczenia środowiskowego, eksperci przez doświadczenie) kompensują sieci społeczne, zapobiegają hospitalizacjom i poprawiają jakość życia.<\/p>",
"src": "Cierpiałkowska i Sęk, 2016, cz. 6",
"k": [
"osamotnienie",
"stygmatyzacja",
"zapobiegają hospitalizacjom"
],
"id": "kliniczna/cwiczenia-fiszki:cd748015",
"unit": "cwiczenia.html",
"sec": "s5"
},
{
"q": "Czym różni się grupa samopomocowa od terapeutycznej i grupy wsparcia?",
"a": "<p>Samopomocowa opiera się na <strong>własnych doświadczeniach<\/strong> uczestników, bez kwalifikacji. Terapeutyczna ma <strong>teorię, metodologię i często kwalifikację<\/strong>. Grupa wsparcia jest animowana przez specjalistów, a gdy radzi sobie sama, staje się samopomocową.<\/p>",
"src": "Cierpiałkowska i Sęk, 2016, cz. 6",
"k": [
"doświadczenie",
"teoria i kwalifikacja",
"grupa wsparcia"
],
"id": "kliniczna/cwiczenia-fiszki:42fbdd01",
"unit": "cwiczenia.html",
"sec": "s6"
},
{
"q": "Co wiadomo o ruchu Anonimowych Alkoholików?",
"a": "<p>Powstał w <strong>Akron (1935)<\/strong> ze spotkania Billa W. i dr. Boba. Wielka Księga i <strong>12 Kroków<\/strong> (1939), <strong>12 Tradycji<\/strong> (1945). Wzór dla innych ruchów samopomocowych.<\/p>",
"src": "Cierpiałkowska i Sęk, 2016, cz. 6",
"k": [
"Akron 1935",
"12 Kroków",
"12 Tradycji"
],
"id": "kliniczna/cwiczenia-fiszki:cc3885da",
"unit": "cwiczenia.html",
"sec": "s6"
},
{
"q": "Wymień wspólne czynniki leczące grup samopomocowych i społeczności terapeutycznych.",
"a": "<p>Nadzieja, wsparcie społeczne (emocjonalne, informacyjne, instrumentalne), altruizm, wzbudzanie i rozładowanie emocji, uczenie się norm grupowych.<\/p>",
"src": "Cierpiałkowska i Sęk, 2016, cz. 6",
"k": [
"nadzieja",
"wsparcie",
"altruizm",
"emocje",
"normy grupowe"
],
"id": "kliniczna/cwiczenia-fiszki:8babc76d",
"unit": "cwiczenia.html",
"sec": "s6"
},
{
"q": "Co oznacza d Cohena w badaniach nad terapią?",
"a": "<p>Wielkość efektu: różnica między grupami (terapia vs kontrola). <strong>0,2 niski, 0,5 przeciętny, 0,8 wysoki.<\/strong> Dzięki niej porównano szkoły terapii.<\/p>",
"src": "Cierpiałkowska i Sęk, 2016, cz. 6",
"k": [
"0,2",
"0,5",
"0,8"
],
"id": "kliniczna/cwiczenia-fiszki:a005edee",
"unit": "cwiczenia.html",
"sec": "s7"
},
{
"q": "Czym różni się zmiana statystyczna od klinicznej?",
"a": "<p>Statystyczna to istotna różnica lub wielkość efektu w grupie; <strong>kliniczna i zdrowotna<\/strong> to realne wyzdrowienie, ograniczenie ryzyka i szkód zdrowotnych (zalecenie WHO).<\/p>",
"src": "Cierpiałkowska i Sęk, 2016, cz. 6",
"k": [
"statystyczna",
"kliniczna",
"ryzyko i szkody"
],
"id": "kliniczna/cwiczenia-fiszki:63bc2ffa",
"unit": "cwiczenia.html",
"sec": "s7"
},
{
"q": "Czym różnią się badania efficacy i effectiveness?",
"a": "<p><strong>Efficacy:<\/strong> laboratorium, eksperyment z grupą porównawczą, rygorystyczny dobór pacjentów, wysoka trafność <strong>wewnętrzna<\/strong>. <strong>Effectiveness:<\/strong> warunki naturalne, różni pacjenci i terapeuci, sprawdza generalizację, wysoka trafność <strong>zewnętrzna<\/strong>.<\/p>",
"src": "Cierpiałkowska i Sęk, 2016, cz. 6",
"k": [
"efficacy: wewnętrzna",
"effectiveness: zewnętrzna"
],
"id": "kliniczna/cwiczenia-fiszki:2cfa97a5",
"unit": "cwiczenia.html",
"sec": "s7"
},
{
"q": "Co to jest efekt ptaka Dodo?",
"a": "<p>Wniosek, że różne szkoły terapii (psychodynamiczna, poznawczo-behawioralna, humanistyczna) mają <strong>podobne efekty<\/strong>: „Wszyscy wygrali, wszystkim należy się nagroda”.<\/p>",
"src": "Cierpiałkowska i Sęk, 2016, cz. 6",
"k": [
"wszystkie szkoły podobnie skuteczne"
],
"id": "kliniczna/cwiczenia-fiszki:eea20efe",
"unit": "cwiczenia.html",
"sec": "s7"
},
{
"q": "Co wyjaśnia wariancję skuteczności w obrębie szkoły terapii?",
"a": "<p><strong>Wspólne czynniki leczące<\/strong>: relacja i sojusz (przymierze) terapeutyczne oraz czynniki po stronie terapeuty i pacjenta. Związek z efektami jest silniejszy w ocenie <strong>pacjentów<\/strong> niż terapeutów.<\/p>",
"src": "Cierpiałkowska i Sęk, 2016, cz. 6",
"k": [
"czynniki wspólne",
"przymierze",
"ocena pacjenta"
],
"id": "kliniczna/cwiczenia-fiszki:8508df0f",
"unit": "cwiczenia.html",
"sec": "s7"
}
