cznych (EZOP, 2015) najczęściej występują w Polsce","a":["zaburzenia związane z używaniem substancji","fobie specyficzne i fobie społeczne","depresja","zaburzenia eksternalizacyjne"],"c":0,"e":"W badaniu EZOP najczęstsze były zaburzenia związane z używaniem substancji, głównie nadużywanie alkoholu."},{"id":"7","n":7,"g":"g34","q":"Zgodnie z metapsychologią Z. Freuda model dynamiczny","a":["zakłada istnienie wrodzonych popędów","jest zbiorem założeń o id, ego i superego","zakłada, że energia psychiczna przemieszcza się w człowieku, gromadzi i rozładowuje","wprowadza pięć faz rozwoju libido"],"c":0,"e":"Model dynamiczny opisuje konflikt wrodzonych popędów. Id, ego i superego to model strukturalny, a przepływ energii to model ekonomiczny."},{"id":"8","n":8,"g":"g34","q":"Zgodnie z koncepcją zaproponowana przez Lazarusa i Folkman (1984, 1987) ocena pierwotna","a":["dotyczy obiektywnej oceny dostępnych w danej sytuacji możliwości radzenia sobie","ma na celu dokonanie intelektualnej analizy zaistniałych trudności i opracowanie planu działania","ma na celu uruchomienie mechanizmów obronnych i opanowanie emocji","dotyczy subiektywnego określenia sytuacji jako stresowej lub nie stresowej"],"c":3,"e":"Ocena pierwotna to subiektywne rozpoznanie, czy sytuacja jest stresowa (krzywda, zagrożenie, wyzwanie). Ocena możliwości to ocena wtórna."},{"id":"9","n":9,"g":"g34","q":"Zgodnie z koncepcją zachowania zasobów Hobfolla (2006) osoby o niewielkim poziomie zasobów są szczególnie","a":["narażone na wpadnięcie w spiralę strat","odporne na stres, ponieważ mają mało do stracenia","skłonne do inwestowania zasobów („Nie mam nic do stracenia”)","wrażliwe na zysk zasobów, ponieważ w tym wypadku zyskiem staje się każda, nawet niewielka pozytywna zmiana"],"c":0,"e":"Osoby z małymi zasobami łatwiej wpadają w spiralę strat, bo nie mają czym zrekompensować kolejnych strat."},{"id":"10","n":10,"g":"g34","q":"Zgodnie z Kartą Ottawską „Proces umożliwiający każdemu człowiekowi zwiększenie oddziaływania na własne zdrowie w sensie jego poprawy i utrzymywania” to","a":["promocja zdrowia","prewencja zagrożeń","leczenie zaburzeń","remisja objawów"],"c":0,"e":"To definicja promocji zdrowia z Karty Ottawskiej (1986)."},{"id":"11","n":11,"g":"g34","q":"Zdrowie to pozytywny stan fizyczny, psychiczny i społeczny, a nie tylko nieobecność choroby – to definicja zdrowia zaproponowana przez","a":["Amerykańskie Towarzystwo Psychologiczne","Amerykańskie Towarzystwo Psychologii Zdrowia","Polskie Towarzystwo Psychologiczne","światową Organizację Zdrowia (WHO)"],"c":3,"e":"To definicja WHO: zdrowie jako pełny dobrostan fizyczny, psychiczny i społeczny, a nie tylko brak choroby."},{"id":"12","n":12,"g":"g34","q":"Zdrowie rozumiane jako ciągły proces reagowania na wymagania środowiska, aby zachować dynamiczną równowagę - to ujęcie charakterystyczne dla modelu","a":["patogenetycznego","salutogenetycznego","pragmatycznego","paradygmatycznego"],"c":1,"e":"W ujęciu salutogenetycznym zdrowie to dynamiczna równowaga, stale odzyskiwana w odpowiedzi na wymagania."},{"id":"13","n":13,"g":"g34","q":"Zdrowie i choroba są kategoriami rozłącznymi w modelu","a":["biomedycznym","socjoekologicznym","holistyczno-funkcjonalnym","dobrostanu psychicznego"],"c":0,"e":"W modelu biomedycznym zdrowie i choroba wykluczają się: zdrowie to brak choroby.","u":1},{"id":"14","n":14,"g":"g34","q":"Zasada cyrkularności","a":["to podstawowa zasada w terapii poznawczej i oznacza cyrkularne rozumienie przyczynowości w opozycji do myślenia linearnego","to podstawowa zasada w terapii systemowej i oznacza cyrkularne rozumienie przyczynowości w opozycji do myślenia linearnego","to podstawowa zasada w terapii behawioralnej i oznacza cyrkularne rozumienie przyczynowości w opozycji do myślenia linearnego","to podstawowa zasada w terapii psychoanalitycznej i oznacza cyrkularne rozumienie przyczynowości w opozycji do myślenia linearnego"],"c":1,"e":"Przyczynowość cyrkularna (A wpływa na B, a B na A) to podstawa terapii systemowej."},{"id":"15","n":15,"g":"g34","q":"Zainteresowanie wpływem zachowań zdrowotnych na zdrowie - tzw. drugą rewolucję zdrowotną - wywołała rosnąca liczba zgonów spowodowanych","a":["chorobami zakaźnymi","wypadkami związanymi z zanieczyszczeniem środowiska","chorobami cywilizacyjnymi","chorobami natury psychicznej"],"c":2,"e":"Drugą rewolucję zdrowotną wywołał wzrost zgonów z powodu chorób cywilizacyjnych, związanych ze stylem życia."},{"id":"16","n":16,"g":"g34","q":"Zaburzeniem psychicznym o najwyższej śmiertelności jest","a":["żadna odpowiedź nie jest prawidłowa","jadłowstręt psychiczny","schizofrenia paranoidalna","depresja"],"c":1,"e":"Jadłowstręt psychiczny ma najwyższą śmiertelność spośród zaburzeń psychicznych."},{"id":"17","n":17,"g":"g34","q":"Wśród uwarunkowań zdrowia Antonovsky (1995) NIE wymienia","a":["zachowania i stylu życia","uogólnionych zasobów odpornościowych","stresorów","spostrzeganej kontroli zdrowia"],"c":3,"e":"Antonovsky wymienia uogólnione zasoby odpornościowe, stresory i styl życia. Spostrzegana kontrola zdrowia to inna koncepcja."},{"id":"18","n":18,"g":"g34","q":"Wśród komponentów koherencji zmienną poznawczą jest","a":["poczucie sensowności","poczucie zaradności","poczucie zrozumiałości","poczucie zadaniowości"],"c":2,"e":"Zrozumiałość to poznawczy komponent SOC. Zaradność jest instrumentalna, sensowność motywacyjna."},{"id":"19","n":19,"g":"g34","q":"Wyuczona bezradność","a":["to brak zależności między wzmocnieniami a zachowaniem","to brak umiejętności radzenia sobie z problemami w życiu","to syndrom, który charakteryzuje się brakiem motywacji i zainteresowania życiem","to brak umiejętności przeżywania emocji i radzenia sobie z nimi"],"c":0,"e":"Wyuczona bezradność (Seligman) powstaje, gdy wzmocnienia nie zależą od zachowania."},{"id":"20","n":20,"g":"g34","q":"Wyróżnia się wsparcie społeczne w ujęciu","a":["strukturalnym i funkcjonalnym","funkcjonalnym i obiektywnym","praktycznym i duchowym","strukturalnym i subiektywnym"],"c":0,"e":"Wsparcie ujmuje się strukturalnie (sieć kontaktów) i funkcjonalnie (rodzaje udzielanej pomocy)."},{"id":"21","n":21,"g":"g34","q":"Wyniki przeprowadzonych przez Sagy i Antonovsky (1999) badań retrospektywnych nad uwarunkowaniami socjalizacyjnymi poczucia koherencji w dorosłym życiu wskazują na największą rolę","a":["płci","równoważenia obciążeń i wymagań w okresie dorastania","stałości i uczestnictwa w podejmowaniu decyzji","cech więzi rodzinnych"],"c":1,"e":"Według badań retrospektywnych dla SOC najważniejsza była równowaga obciążeń w okresie dorastania.","f":"niepewne"},{"id":"22","n":22,"g":"g34","q":"Wykrywanie choroby i powstrzymywanie jej rozwoju jest charakterystyczne dla","a":["prewencji pierwotnej","prewencji wtórnej","prewencji trzeciąrzędowej","promocji zdrowia"],"c":1,"e":"Prewencja wtórna to wczesne wykrywanie choroby i powstrzymywanie jej rozwoju."},{"id":"23","n":23,"g":"g34","q":"Wybierz twierdzenie, które NIE jest założeniem psychologii zdrowia","a":["przekraczanie obszaru patologii i zwrócenie uwagi w kierunku zasobów człowieka","pojęcie zdrowia i choroby nie wykluczają się","zdrowie traktowane jest jako społecznie uznawana wartość","jest ograniczone do systemu opieki zdrowotnej"],"c":3,"e":"Psychologia zdrowia wychodzi poza system opieki zdrowotnej: zajmuje się też zdrowymi i promocją zdrowia."},{"id":"24","n":24,"g":"g34","q":"Wsparcie wzajemne NIE jest jednym z najważniejszych elementów w","a":["pomocy w profesjonalnej pomocy psychologicznej","pomocy w grupach samopomocowych","pomocy w grupach wsparcia","wszystkie odpowiedzi są prawidłowe"],"c":0,"e":"Wsparcie wzajemne to istota grup samopomocy i wsparcia. W pomocy profesjonalnej relacja jest asymetryczna."},{"id":"25","n":25,"g":"g34","q":"Wsparcie emocjonalne polega na","a":["pokazaniu dużego zaangażowania emocjonalnego","przekazaniu emocji odzwierciedlających troskę","pocieszaniu","udzielaniu rad"],"c":1,"e":"Wsparcie emocjonalne to przekazywanie emocji wyrażających troskę, akceptację i otuchę."},{"id":"26","n":26,"g":"g34","q":"Wskaż zdanie prawdziwe. W klasycznym ujęciu stresu Lazarusa i Folkman (1984)","a":["ocena pierwotna i wtórna przebiegają równocześnie i wzajemnie na siebie wpływają","emocje pozytywne nie występują","radzenie sobie ze stresem zapoczątkowane jest przez uznanie sytuacji jako stresowej","emocje pozytywne i negatywne odgrywają równorzędną rolę"],"c":0,"e":"Ocena pierwotna i wtórna przebiegają równocześnie i wpływają na siebie. Emocje pozytywne do modelu dodała później Folkman.","f":"niepewne"},{"id":"27","n":27,"g":"g34","q":"Wskaż zachowanie zdrowotne, które możemy nazwać nawykiem","a":["zachowywanie higieny snu","regularne mycie rąk","zdrowa dieta","wszystkie odpowiedzi są poprawne"],"c":3,"e":"Higiena snu, mycie rąk i dieta mogą stać się automatycznymi nawykami."},{"id":"28","n":28,"g":"g34","q":"Wskaż stwierdzenie zgodne z teoria stresu przedstawioną przez Lazarusa i Folkman (1984, 1987)","a":["w procesie radzenia sobie ze stresem nie występują emocje pozytywne","strategiami radzenia sobie ze stresem mogą być mechanizmy obronne","strategiami radzenia sobie ze stresem mogą być zachowania nawykowe","jedynym źródłem emocji jest proces radzenia sobie ze stresem"],"c":1,"e":"Lazarus zaliczał do radzenia sobie także mechanizmy obronne, jako formy radzenia skoncentrowanego na emocjach."},{"id":"29","n":29,"g":"g34","q":"Wskaż stwierdzenie niezgodne z teorią zachowania zasobów zaproponowaną przez Hobfoll (2006)","a":["podstawowym celem ludzkiej aktywności jest gromadzenie, utrzymywanie i ochrona zasobów","jedynym kryterium wystąpienia stresu jest subiektywna percepcja relacji podmiot - środowisko","stres pojawia się tylko wtedy, gdy występują obiektywne okoliczności określonego rodzaju","sam stres jest wewnętrznym stanem człowieka zdeterminowanym przez jego percepcję okoliczności"],"c":1,"e":"Hobfoll podkreśla obiektywne okoliczności utraty zasobów, a nie tylko subiektywną percepcję jak Lazarus."},{"id":"30","n":30,"g":"g34","q":"W
