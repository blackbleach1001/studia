EPRAWDZIWE stwierdzenie dotyczące pierwszych klinik psychologicznych:","a":["zostały stworzone na wzór pierwszej kliniki założonej przez Zygmunta Freuda","próbowano w nich zastosować psychologię empiryczną w praktyce","tworzyły wzór współpracy interdyscyplinarnej","oferowały pomoc dzieciom opóźnionym umysłowo i z zaburzeniami zachowania"],"c":0},{"id":"187","n":49,"g":"k2","q":"Jakie są funkcje radzenia sobie ze stresem wyróżnione przez Lazarusa, Folkman i Moskowitz?","a":["instrumentalna, unikająca, samoregulacyjna","zorientowana na problem, samoregulacja emocji, skoncentrowana na znaczeniu","zadaniowa, instrumentalna, samoregulacja emocji","skoncentrowana na znaczeniu, emocjonalna, samoregulacyjna"],"c":1,"e":"Funkcje radzenia sobie: zadaniowa (problem), regulacja emocji i skoncentrowana na znaczeniu.","u":1},{"id":"18","n":50,"g":"k2","q":"Wśród komponentów koherencji zmienną poznawczą jest","a":["poczucie sensowności","poczucie zaradności","poczucie zrozumiałości","poczucie zadaniowości"],"c":2,"e":"Zrozumiałość to poznawczy komponent SOC. Zaradność jest instrumentalna, sensowność motywacyjna."},{"id":"54","n":51,"g":"k2","q":"W ujęciu S.E. Hobfolla","a":["utrata określonych zasobów nie ma znaczenia dla jednostki, jeżeli w tym samym czasie jednostka uzyskuje inne zasoby","potencjalna utrata zasobów nigdy nie stanowi źródła stresu","stres oceniany jest w odniesieniu do posiadanych zasobów i możliwości ich inwestowania","nie istnieją żadne stresory obiektywne"],"c":2,"e":"Hobfoll ocenia stres w odniesieniu do zasobów: ich utraty, zagrożenia utratą i braku zysku po inwestycji."},{"id":"131","n":52,"g":"k2","q":"Ocena poznawcza wtórna","a":["przyjmuje postać wyzwania lub krzywdy/straty","dotyczy własnych możliwości poradzenia sobie ze stresem","dotyczy odroczonych skutków sytuacji stresowej","określa wyłącznie, w jakim stopniu sytuacja jest zagrażająca"],"c":1,"e":"Ocena wtórna dotyczy własnych możliwości poradzenia sobie z sytuacją.","u":1},{"id":"1","n":53,"g":"k2","q":"Zrozumiałość to komponent poczucia koherencji, który definiujemy jako","a":["przekonanie o posiadaniu wystarczających zasobów","poczucie, że napotykane wyzwania i wymagania warte są naszego zaangażowania","zdolność do postrzegania świata jako ustrukturalizowanego, spójnego i przewidywalnego","równowagę pomiędzy stawianymi wymaganiami i możliwościami jednostki"],"c":2,"e":"Zrozumiałość to poznawczy komponent SOC: świat jest uporządkowany, spójny i przewidywalny. Zaradność dotyczy zasobów, sensowność zaangażowania."},{"id":"117","n":54,"g":"k2","q":"Powtarzający się wzór doświadczeń o właściwościach równowagi przeciążenie/niedociążenie sprzyja kształtowaniu się następującego komponentu poczucia koherencji","a":["zrozumiałość","sensowność","funkcjonalność","zaradność"],"c":3,"e":"Doświadczenie równowagi między przeciążeniem a niedociążeniem buduje zaradność."},{"id":"56","n":55,"g":"k2","q":"W ujęciu R. Lazarusa stres definiujemy jako","a":["intensywną reakcję emocjonalną","bodziec wywołujący określone skutki psychofizyczne u jednostki","relację między jednostką a otoczeniem, którą jednostka ocenia jako przekraczającą jej możliwości zaradcze","sytuację szczególnie obciążającą, powodującą utratę zasobów osobistych"],"c":2,"e":"Lazarus definiuje stres jako relację człowiek–otoczenie, ocenianą jako obciążającą lub przekraczającą zasoby."},{"id":"74","n":56,"g":"k2","q":"Tzw. bounce-back","a":["określa umiejętność dynamicznego oderwania się od szczególnie negatywnych doświadczeń","stanowi komponent poczucia koherencji","określa brak kompetencji radzenia sobie z trudnymi sytuacjami i wysokie koszty jakie ponosi jednostka w takich sytuacjach","to jeden z wymiarów stylu wyjaśniania wydarzeń niepomyślnych"],"c":0,"e":"Bounce-back to umiejętność „odbicia się” po negatywnych doświadczeniach, czyli istota prężności."},{"id":"100","n":57,"g":"k2","q":"Radzenie sobie skoncentrowane na znaczeniu","a":["ujęte jest w konceptualizacji stresu S.E. Hobfolla","związane jest z doświadczaniem pozytywnych emocji w przebiegu procesu radzenia sobie","zawsze związane jest z wysokim poziomem kosztów psychologicznych dla jednostki","zawsze związane jest z doświadczeniem silnie negatywnych emocji w przebiegu procesu radzenia sobie"],"c":1,"e":"Radzenie skoncentrowane na znaczeniu (Folkman) wiąże się z doświadczaniem emocji pozytywnych w stresie."},{"id":"170","n":58,"g":"k2","q":"Koncepcja przystosowania do wydarzeń życiowych jest przykładem definiowania stresu jako","a":["reakcji","relacji","zjawiska fizjologicznego","bodźca"],"c":3,"e":"Lista wydarzeń życiowych wymagających przystosowania (Holmes i Rahe) ujmuje stres jako bodziec.","u":1},{"id":"101","n":59,"g":"k2","q":"Radzenie sobie jako styl to","a":["reakcja emocjonalna w określonym momencie procesu radzenia sobie","całokształt podejmowanej aktywności w sytuacji stresowej","ogniwo procesu radzenia sobie","indywidualne tendencje do radzenia sobie w określony sposób"],"c":3,"e":"Styl radzenia sobie to względnie stała, indywidualna tendencja do radzenia sobie w określony sposób."},{"id":"k60","n":60,"g":"k2","q":"Jak opisywany jest stres w literaturze psychologicznej?","a":["Stres jako sytuacja, wydarzenie zewnętrzne lub bodziec o określonych właściwościach","Stres jako reakcja wewnętrzna człowieka","Stres jako wzajemna relacja czynników zewnętrznych i właściwości człowieka","Wszystkie powyższe odpowiedzi są prawidłowe"],"c":3},{"id":"k61","n":61,"g":"k2","q":"Na czym polega spirala zysków w teorii zachowania zasobów Hobfolla?","a":["Początkowa strata rodzi przyszłą stratę","Początkowa strata rodzi przyszły przyrost zasobów","Początkowy przyrost zasobów powoduje dalszy przyrost zasobów","Początkowy przyrost zasobów powoduje przyszłą stratę"],"c":2},{"id":"k62","n":62,"g":"k2","q":"W czyim ujęciu stres rozumiany jest jako: „określona relacja osoby z otoczeniem, oceniana przez osobę jako obciążająca lub przekraczająca jej zasoby i zagrażająca jej dobrostanowi”, a o uznaniu relacji za stresową rozstrzyga tu subiektywna ocena jej znaczenia dla osoby w niej uczestniczącej?","a":["Selyego","Hobfolla","Lazarusa i Folkman","Endlera i Parkera"],"c":2},{"id":"k63","n":63,"g":"k2","q":"Do jakiej kategorii zasobów wg teorii Hobfolla zaliczymy wiedzę, pieniądze czy zdolność kredytową?","a":["Zasoby materialne","Zasoby stanu","Zasoby osobiste","Zasoby energii"],"c":3},{"id":"k64","n":64,"g":"k2","q":"Endler i Parker wprowadzili pojęcie radzenia sobie:","a":["Skoncentrowanego na zadaniu","Skoncentrowanego na emocjach","Skoncentrowanego na unikaniu","Skoncentrowanego na znaczeniu"],"c":2},{"id":"k65","n":65,"g":"k2","q":"Strategia antycypacyjnego radzenia sobie ze stresem odnosi się do:","a":["Radzenie sobie z już zaistniałą, a więc pewną sytuacją stresową","Ukierunkowana jest na nieuchronne wydarzenie mające z pewnością nastąpić w niedalekiej przyszłości, związane z ryzykiem krzywdy lub straty","Odnosi się do wydarzeń stresowych w bardziej odległej przyszłości, które nie są pewne, ale mogą nastąpić z jakimś prawdopodobieństwem","Wiąże się z przyszłymi wyzwaniami i polega na gromadzeniu zasobów ułatwiających wykorzystanie przyszłych szans"],"c":1},{"id":"146","n":66,"g":"k2","q":"Model podatność - stres wskazuje","a":["właściwości danej osoby, które powodują, że przeżywa ona stres częściej","właściwości danej osoby, które sprawiają, że przeżywa ona stres bardziej intensywnie","na interakcję między predyspozycjami danej osoby a stresem jako przyczynę zaburzeń psychicznych","na działanie silnego stresu jako przyczynę zaburzeń psychicznych"],"c":2,"e":"Zaburzenie wynika z interakcji predyspozycji osoby i stresu.","u":1},{"id":"k67","n":67,"g":"k2","q":"Ocena możliwości poradzenia sobie z sytuacją stresową to:","a":["ocena pierwotna","ocena wtórna","ocena sprzyjająco-pozytywna","pozytywne przewartościowanie"],"c":1},{"id":"k68","n":68,"g":"k2","q":"W ujęciu Schwarzera i Knoll (2003) poddawanie się badaniom profilaktycznym lub szczepieniom to przejaw następującego radzenia sobie ze stresem:","a":["antycypacyjnego","reaktywnego","prewencyjnego","proaktywnego"],"c":2},{"id":"94","n":69,"g":"k2","q":"Selye w ogólnym zespole adaptacyjnym (general adaptation syndrom - GAS) nie uwzględnił","a":["reakcji alarmowej","stadium odporności","stadium wyczerpania","stadium stresu"],"c":3,"e":"GAS ma trzy stadia: reakcję alarmową, odporność i wyczerpanie. „Stadium stresu” nie istnieje."},{"id":"k70","n":70,"g":"k2","q":"Spirala zysków w teorii zachowania zasobów Hobfolla oznacza, że:","a":["ludzie muszą inwestować zasoby, aby zapobiegać ich utracie","osoby posiadające zasoby są bardziej zdolne do osiągania zysków, a zysk początkowy pociąga za sobą dalsze zyski","ci, którym brakuje zasobów są bardziej narażeni na skrajne konsekwencje straty, dlatego je inwestują, a w efekcie pomnażają","wpływ zysku jest silniejszy niż straty"],"c":1},{"id":"48","n":71,"g":"k2","q":"Według Fredrickson procesy poznawcze","a":["są mechanizmami oceny pierwotnej w radzeniu sobie ze stresem","ulegają poszerzeniu na skutek pozytywnych emocji","ulegają zawężeniu na skutek pozytywnych emocji","są mechanizmami oceny wtórnej w radzeniu sobie ze stresem"],"c":1,"e":"Według Fredrickson emocje pozytywne poszerzają repertuar myśli i działań."},{"id":"199","n":72,"g":"k2","q":"Funkcja radzenia sobie skoncentrowanego na znaczeniu została wprowadzona przez","a":["Richarda S. Lazarusa i Susan K. Folkman","Susan K. Folkman","Normana S. Endlera i Jamesa D. Parkera","Stevena E. Hobfolla"],"c":1,"e":"Funkcję skoncentrowaną na znaczeniu wprowadziła Susan Folkman.","u":1},{"id":"140","n":73,"g":"k2","q":"Na koherencję składają się","a":["poczucie zrozumiałości, poczucie zaradności i poczucie sensowności","poczucie sprawstwa, poczucie własnej wartości i pozytywne emocje","wewnętrzne umiejscowienie poczucia kontroli i współprzeżywanie emocji","poczucie sensowności i poczucie wspólnoty wynikające ze współprzeżywania emocji"],"c":0,"e":"SOC tworzą zrozumiałość, zaradność i sensowność.","u":1},{"id":"52","n":74,"g":"k2","q":"Według Antonovsky'ego (1979) stres pojawia się","a":["w wyniku działania patogenów","jako efekt oceny poznawczej relacji człowiek - sytuacja","jako niespecyficzna reakcja na działanie bodźców szkodliwych","gdy człowiek nie radzi sobie skutecznie ze stanem napięcia"],"c":3,"e":"Według Antonovsky’ego stresor wywołuje napięcie, a stres pojawia się, gdy napięcia nie udaje się skutecznie opanować."},{"id":"51","n":75,"g":"k2","q":"Według Antonovsky'ego (1995) na rozwój poczucia koherencji nie wpływają","a":["poziom spójności (powtarzalność doświadczenia)","równowaga pomiędzy przeciążeniem a niedociążeniem w relacji podmiot - środowisko","udział w podejmowaniu decyzji","rodzicielskie zachowania zdrowotne"],"c":3,"e":"SOC kształtują spójność doświadczeń, równowaga obciążeń i udział w decyzjach. Zachowania zdrowotne rodziców nie należą do tej listy."},{"id":"29","n":76,"g":"k2","q":"Wskaż stwierdzenie niezgodne z teorią zachowania zasobów zaproponowaną przez Hobfoll (2006)","a":["podstawowym celem ludzkiej aktywności jest gromadzenie, utrzymywanie i ochrona zasobów","jedynym kryterium wystąpienia stresu jest subiektywna percepcja relacji podmiot - środowisko","stres pojawia się tylko wtedy, gdy występują obiektywne okoliczności określonego rodzaju","sam stres jest wewnętrznym stanem człowieka zdeterminowanym przez jego percepcję okoliczności"],"c":1,"e":"Hobfoll podkreśla obiektywne okoliczności utraty zasobów, a nie tylko subiektywną percepcję jak Lazarus."},{"id":"28","n":77,"g":"k2","q":"Wskaż stwierdzenie zgodne z teoria stresu przedstawioną przez Lazarusa i Folkman (1984, 1987)","a":["w procesie radzenia sobie ze stresem nie występują emocje pozytywne","strategiami radzenia sobie ze stresem mogą być mechanizmy obronne","strategiami radzenia sobie ze stresem mogą być zachowania nawykowe","jedynym źródłem emocji jest proces radzenia sobie ze stresem"],"c":1,"e":"Lazarus zaliczał do radzenia sobie także mechanizmy obronne, jako formy radzenia skoncentrowanego na emocjach."},{"id":"k78","n":78,"g":"k2","q":"Ocena pierwotna w koncepcji Lazarusa i Folkman:","a":["dotyczy oceny obiektywnie dostępnych w danej sytuacji sposobów radzenia sobie","ma na celu intelektualną analizę zaistniałych trudności i opracowanie planu działania","ma na celu uruchomienie mechanizmów obronnych i opanowanie emocji","dotyczy subiektywnego określenia sytuacji jako stresowej lub niestresowej"],"c":3},{"id":"k79","n":79,"g":"k2","q":"Według koncepcji S. Hobfolla:","a":["zysk i strata zasobów mają taką samą siłę oddziaływania","zysk zasobów nabiera szczególnego znaczenia dopiero w kontekście ich straty","zysk zawsze działa silniej niż strata","strata zasobów nabiera szczególnego znaczenia dopiero w kontekście ich zysku"],"c":1},{"id":"k80","n":80,"g":"k2","q":"Klasyfikacja strategii radzenia sobie według modalności obejmuje podział na:","a":["paliatywne i salutarne","strategie zorientowane na emocje i na problem","konfrontacyjne i unikowe","poznawcze i behawioralne"],"c":3},{"id":"k81","n":81,"g":"k2","q":"Selye definiuje stres jako:","a":["automatyczną odpowiedź na działanie bodźców szkodliwych","istnienie obiektywnych właściwości bodźców, które typowo, u przeciętnej osoby powodują stres","zakłócenia równowagi pomiędzy wymaganiami a możliwościami ich spełnienia","żadna z wymienionych odpowiedzi"],"c":0},{"id":"165","n":82,"g":"k2","q":"Kto jest autorem Teorii zachowania zasobów","a":["Lawrence Calhoun","Steven Hobfoll","Endler i Parker","Susan Folkman"],"c":1,"e":"Teorię zachowania zasobów (COR) stworzył Stevan Hobfoll.","u":1},{"id":"k83","n":83,"g":"k2","q":"Osoby z niskim poczuciem koherencji:","a":["najczęściej radzą sobie z sytuacjami trudnymi przez konfrontowanie stresora","mają trudność w nawiązaniu relacji wymiany w procesie wsparcia społecznego","mają niskie poczucie zrozumiałości, sensowności i funkcjonalności","charakteryzuje mechanizm elastycznej regulacji granic"],"c":1},{"id":"k84","n":84,"g":"k2","q":"Stres jako bodziec w i z obiektem","Błędnego koła ABC (Sytuacja – Przekonania – Konsekwencje) A. Ellisa","Dwuczynnikowego modelu Mowerera","Teorii organizmicznej C. Rogersa"],"c":0},{"id":"k327","n":327,"g":"k5","q":"Antypsychologizm w podejściu behawioralnym oznacza:","a":["uznanie przekonań za podlegające regułom warunkowania","uznanie przez naukę tylko tych zachowań, które można zaobserwować i poddać pomiarowi","uznanie eksperymentu jako właściwej metody badawczej","wpływ środowiska na zachowanie człowieka poprzez system nagród i kar"],"c":1},{"id":"k328","n":328,"g":"k5","q":"Psychoterapia różni się od innych form pomocy psychologicznej tym, że:","a":["opiera się na wzajemnej pomocy w rozwiązywaniu wspólnych problemów osobistych","dotyczy sytuacji kryzysowych","prowadzi do obniżenia prawdopodobieństwa wystąpienia zaburzeń w funkcjonowaniu somatycznym, psychologicznym i społecznym","jest celowym oddziaływaniem służącym usunięciu lub zmniejszeniu zaburzeń funkcjonowania somatycznego, psychologicznego i społecznego"],"c":3},{"id":"k329","n":329,"g":"k5","q":"Teoria racjonalno-emotywna A. Ellisa wywodzi się z podejścia:","a":["humanistycznego","psychodynamicznego","behawioralno-poznawczego","systemowego"],"c":2},{"id":"84","n":330,"g":"k5","q":"Teoria atrybucji i teoria umysłu to, w modelach zdrowia psychicznego, teorie opisujące","a":["działanie warunkowania sprawczego","działanie substancji farmakologicznych","działanie społecznego poznania","działanie nieuświadomionych konfliktów i deficytów"],"c":2,"e":"Teoria atrybucji i teoria umysłu opisują poznanie społeczne."},{"id":"k331","n":331,"g":"k5","q":"Osoba w depresji nie reaguje na otoczenie, ponieważ usunięto z niego pozytywne wzmocnienia. Jest to opis depresji w ujęciu:","a":["Behawioralnym","Psychodynamicznym","Poznawczym","Humanistycznym"],"c":0},{"id":"k332","n":332,"g":"k5","q":"Słuchanie opowieści innych o kompromitacji i zawstydzeniu w sytuacjach popełnienia faux pas, staje się źródłem reakcji fobicznych. Opisana zasada nabywania zachowań nieprzystosowawczych nawiązuje do modelu warunkowania (opartego na wzorcach kojarzeniowych):","a":["Uczenie się przez obserwację","Uczenie się na bazie transmisji informacji werbalnej","Uczenie się zastępcze","Warunkowanie instrumentalne"],"c":1},{"id":"k333","n":333,"g":"k5","q":"W procesie przetwarzania informacji u osób zależnych występują formalne błędy w myśleniu, które podtrzymują i utrwalają przekonania kluczowe i warunkowe, głównie w obszarze wizji siebie i świata. Zniekształcenia poznawcze stosowane przez tę grupę pacjentów to przede wszystkim dychotomizacja i katastrofizacja oraz błędy atrybucji. Powyższy opis nawiązuje do ujęcia:","a":["Behawioralnego","Psychodynamicznego","Poznawczego","Humanistycznego"],"c":2},{"id":"k334","n":334,"g":"k5","q":"W przypadku osobowości zależnej, założenia: „mogę funkcjonować tylko wtedy, gdy ktoś (kompetentny) jest obok mnie”, „jeśli jestem sama, nie poradzę sobie”, „mogę być szczęśliwy tylko wtedy, gdy ona jest przy mnie”, są przykładem:","a":["Myśli automatycznych","Przekonań kluczowych","Przekonań pośredniczących","Mechanizmu obronnego"],"c":2},{"id":"k335","n":335,"g":"k5","q":"Występujące w zaburzeniu lękowym przekonanie: „Jestem słaba” – jest przykładem:","a":["Mechanizmu obronnego","Przekonania kluczowego","Przekonania pośredniczącego","Nieadaptacyjnego schematu"],"c":1},{"id":"k336","n":336,"g":"k5","q":"Zdrowie, jako dążenie do poznania własnych potencjałów i realizowaniu ich, najlepiej charakteryzuje ujęcie:","a":["Behawioralna","Humanistyczna","Poznawcza","Psychodynamiczna"],"c":1},{"id":"k337","n":337,"g":"k5","q":"Zdrowie psychiczne interpretowane jako posiadanie racjonalnych przekonań, związane jest z ujęciem:","a":["Poznawczym","Psychodynamicznym","Behawioralnym","Humanistycznym"],"c":0},{"id":"k338","n":338,"g":"k5","q":"Środowiskowość charakterystyczna dla założeń behawioryzmu wiąże się z przekonaniem, że:","a":["wadliwe reakcje i nawyki są wrodzone","zachowanie człowieka jest determinowane przez pierwotną siłę","poznanie praw związanych ze zjawiskami patologicznymi pozwoli na opracowanie technik przeciwdziałania im","człowiek kształtuje się pod wpływem oddziaływań zewnętrznych"],"c":3},{"id":"k339","n":339,"g":"k5","q":"Jednym z czynników wspólnych psychoterapii jest:","a":["dyrektywność terapeuty","uczenie się","stosowanie strategii pośrednich","częstotliwość sesji terapeutycznych"],"c":1},{"id":"k340","n":340,"g":"k5","q":"Ćwiczenie nowych, adaptacyjnych zachowań podczas psychoterapii odbywa się na etapie:","a":["początkowym","wglądu","przygotowywania się do zmiany","utrwalania zmiany"],"c":3},{"id":"k341","n":341,"g":"k5","q":"Realizm empiryczny charakteryzuje następujące podejście psychoterapeutyczne:","a":["psychoterapię egzystencjalną","terapię narracyjną","terapię skoncentrowaną na rozwiązaniu problemów","terapię strategiczną"],"c":2,"f":"niepewne"},{"id":"k342","n":342,"g":"k5","q":"Metafora gier rodzinnych jest pojęciem zaczerpniętym z modelu terapii:","a":["mediolańskiej","linearnej","humanistycznej","analitycznej"],"c":0},{"id":"k343","n":343,"g":"k5","q":"Poziom współpracy osoby z terapeutą, siła więzi między nimi oraz udział osoby w uzgodnieniu celu terapii i zadań realizowanych, aby uzyskać zmiany – to elementy składające się na:","a":["kontrakt według Johna Enrighta","przymierze terapeutyczne według Edwarda S. Bordina","specyficzne czynniki leczące według Jana Czesława Czabały","kontekst systemowy według Kurta Ludewiga"],"c":1},{"id":"215","n":344,"g":"k6","q":"Czym zajmuje się prewencja pierwotna?","a":["przeciwdziałaniu czynnikom ryzyka zanim dojdzie do zmian chorobowych","zapobieganiu zaawansowania i postępu choroby","udzielaniu terapii bólu","zapobieganiu skutkom przebytej choroby"],"c":0,"e":"Prewencja pierwotna przeciwdziała czynnikom ryzyka, zanim pojawi się choroba.","u":1},{"id":"192","n":345,"g":"k6","q":"Jaki jest cel oceny zachowań zdrowotnych?","a":["przeprowadzanie badań naukowych w celu ustalenia predyktorów awansów w pracy","diagnoza potrzeb zdrowotnych danej grupy ludzi w celu zaplanowania programów promocji zdrowia","ocena efektywności programów antymobbingowych","promocja dobrostanu psychicznego i redukcja zaburzeń nerwowych"],"c":1,"e":"Ocena zachowań zdrowotnych służy rozpoznaniu potrzeb grupy i zaplanowaniu promocji zdrowia.","u":1},{"id":"222","n":346,"g":"k6","q":"Co kształtuje przekonania zdrowotne na temat zdrowia i choroby?","a":["system przekonań współistniejących: medycyna pierwotna, ludowa i naukowa","osobiste doświadczenie ze zdrowiem i chorobą","własna aktywność poznawcza (np. poczucie kontroli, poczucie skuteczności)","wszystkie pozostałe odpowiedzi"],"c":3,"e":"Przekonania zdrowotne kształtują systemy medycyny, osobiste doświadczenia i własna aktywność poznawcza.","u":1},{"id":"164","n":347,"g":"k6","q":"Która odpowiedź opisuje przekonanie zdrowotne, według teorii poczucia własnej skuteczności?","a":["Zamierzam zacząć jeść więcej warzyw, bo nie stać mnie na mięso","Zamierzam zacząć jeść więcej warzyw, bo wiem że jestem w stanie to zrobić","Zamierzam regularnie chodzić na basen, bo nie trzeba płacić za wstęp","Zamierzam regularnie chodzić na basen, bo mam już dość mojej nadwagi"],"c":1,"e":"Przekonanie o własnej skuteczności to „wiem, że jestem w stanie to zrobić”.","u":1},{"id":"k348","n":348,"g":"k6","q":"Które zachowanie zdrowotne można nazwać nawykiem?","a":["przestrzeganie higieny snu","regularne mycie rąk","zdrowa dieta","wszystkie pozostałe odpowiedzi"],"c":3},{"id":"162","n":349,"g":"k6","q":"Które czynniki obniżają dokładność i wiarygodność oceny zachowań zdrowotnych?","a":["luki i zniekształcenia pamięciowe","zawyżanie udziału w zachowaniach prozdrowotnych","zaniżanie udziału w zachowaniach antyzdrowotnych","wszystkie pozostałe odpowiedzi"],"c":3,"e":"Dokładność obniżają luki pamięci, zawyżanie zachowań prozdrowotnych i zaniżanie antyzdrowotnych.","u":1},{"id":"184","n":350,"g":"k6","q":"Jakie zachowania korelują z aktualnym i przyszłym stanem zdrowia według badań projektu Alameda (Alameda Study) (1965-1983) w Kalifornii?","a":["odpowiednia waga ciała i ruch fizyczny","zdrowy sen (7-8 godzin)","umiarkowane spożycie alkoholu i niepalenie tytoniu","wszystkie pozostałe odpowiedzi"],"c":3,"e":"Badanie Alameda: sen 7–8 h, śniadanie, brak podjadania, prawidłowa waga, ruch, umiarkowany alkohol i niepalenie.","u":1},{"id":"163","n":351,"g":"k6","q":"Która ze społecznych teorii poznawczych zajmuje kluczowe miejsce we współczesnych modelach wyjaśniających zachowania zdrowotne?","a":["teoria lokalizacji kontroli","teoria poczucia własnej skuteczności","teoria dysonansu poznawczego","teoria wsparcia społecznego"],"c":1,"e":"Poczucie własnej skuteczności (Bandura) jest kluczowe w większości modeli zachowań zdrowotnych.","u":1},{"id":"43","n":352,"g":"k6","q":"Według modelu HAPA (Health Action Process Approach), jaki proces umożliwia kontynuację zachowania już PO jego podjęciu?","a":["planowanie działania (np. miejsce lub czas wykonywania zachowania)","planowanie radzenia sobie z przeszkodami (np. jeśli będzie zimno, to ubiorę ciepłą bluzę do biegania)","oczekiwanie pozytywnych efektów","poczucie kontroli"],"c":1,"e":"W fazie wolicjonalnej HAPA utrzymanie zachowania wspiera planowanie radzenia sobie z przeszkodami."},{"id":"37","n":353,"g":"k6","q":"Według teorii autodeterminacji autorstwa Ryan i Deci (2000), który rodzaj motywacji najbardziej sprzyja podjęciu się lub utrzymaniu zachowań zdrowotnych?","a":["motywacja wewnętrzna","motywacja zewnętrzna","równy poziom obu typów motywacji","żadna z pozostałych odpowiedzi"],"c":0,"e":"Według teorii autodeterminacji zachowania zdrowotne najlepiej podtrzymuje motywacja wewnętrzna (autonomiczna)."},{"id":"61","n":354,"g":"k6","q":"W odniesieniu do zachowań zdrowotnych, do czego służą modele teoretyczne?","a":["pomagają w systemowym zrozumieniu zachowań zdrowotnych, między innymi co wpływa na ich kształtowanie, utrzymanie lub zmianę","modele teoretyczne nie są przydatne w psychologii zdrowia, bo wiele z nich pochodzi z innych dziedzin psychologii, np. poznawczej","modele teoretyczne są przydatne w psychologii zdrowia w celu zrozumienia ludzkiego zachowania, o ile zostały stworzone przez wybitnych psychologów zdrowia","żadna z pozostałych odpowiedzi"],"c":0,"e":"Modele teoretyczne porządkują wiedzę o tym, co kształtuje, podtrzymuje i zmienia zachowania zdrowotne."},{"id":"41","n":355,"g":"k6","q":"Według przeglądów literatury (np. Godin i Kok, 1996), jaka jest użyteczność teorii uzasadnionego działania i teorii planowanego zachowania w wyjaśnianiu zachowań zdrowotnych?","a":["teorie wyjaśniają większy zakres intencji niż rzeczywistych zachowań zdrowotnych","teorie trafnie wyjaśniają wysoki odsetek zachowań zdrowotnych","teorie trafnie wyjaśniają wysoki odsetek zachowań zdrowotnych, zwłaszcza u kobiet","żadna z pozostałych odpowiedzi"],"c":0,"e":"Te teorie dobrze wyjaśniają intencje, ale słabiej rzeczywiste zachowania (luka intencja–zachowanie)."},{"id":"125","n":356,"g":"k6","q":"Poczucie własnej skuteczności","a":["wzmacnia się, gdy jednostka doświadcza wielu porażek w działaniu","związane jest z realistyczną oceną własnych możliwości działania","kształtuje się wyłącznie w oparciu o styl wychowania","zdecydowanie wzrasta w sytuacji silnego pobudzenia psychofizycznego"],"c":1,"e":"Poczucie własnej skuteczności wiąże się z realistyczną oceną własnych możliwości działania."},{"id":"114","n":357,"g":"k6","q":"Prewencja zaburzeń","a":["skierowana jest przede wszystkim do zdrowej populacji i ma na celu podnoszenie świadomości dotyczącej własnego zdrowia","skierowana jest do grup ryzyka","może być realizowana wyłącznie przez psychologa klinicznego","w innym nazewnictwie może być określana jako profilaktyka uniwersalna"],"c":1,"e":"Prewencja zaburzeń jest kierowana do grup ryzyka. Promocja zdrowia dotyczy całej populacji."},{"id":"180","n":358,"g":"k6","q":"Jednym z obszarów działań na rzecz promocji zdrowia jest tzw. reorientacja służby zdrowia, która pole
