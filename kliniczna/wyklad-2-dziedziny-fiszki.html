"unit": "wyklad-2-dziedziny.html",
"sec": "s4"
},
{
"q": "Czym jest ableizm (przeszacowywanie sprawności) i jakie niesie ryzyko?",
"a": "<p>Zacieraniem różnic („sprawni inaczej”). Ryzyko: frustracja, zachowania niebezpieczne dla zdrowia, przemęczenie, postawa roszczeniowa, a po utracie nadziei desperacja.<\/p>",
"src": "Psychologia kliniczna, r. 25",
"id": "kliniczna/wyklad-2-dziedziny-fiszki:560f426b",
"k": [
"zacieranie różnic („sprawni inaczej”)",
"frustracja, przemęczenie",
"zachowania ryzykowne, desperacja"
],
"unit": "wyklad-2-dziedziny.html",
"sec": "s4"
},
{
"q": "Dlaczego grupa może wykluczać osobę niepełnosprawną mimo formalnej integracji?",
"a": "<p>Osoba ta obniża <strong>homogeniczność<\/strong> grupy, a grupa przywraca spójność przez wykluczenie. Formalnie osoba jest członkiem grupy, faktycznie nie uczestniczy w jej życiu.<\/p>",
"src": "Psychologia kliniczna, r. 25",
"id": "kliniczna/wyklad-2-dziedziny-fiszki:8a430dca",
"k": [
"obniża homogeniczność grupy",
"wykluczenie przywraca spójność",
"formalnie członek, faktycznie nie"
],
"unit": "wyklad-2-dziedziny.html",
"sec": "s4"
},
{
"q": "Na jakich trzech poziomach działa psycholog rehabilitacji?",
"a": "<p>Jako ekspert dla polityków i władz, w pracy z grupami (rodzina, wolontariusze, grupy samopomocowe) i jako osobisty doradca osoby niepełnosprawnej.<\/p>",
"src": "Psychologia kliniczna, r. 25",
"id": "kliniczna/wyklad-2-dziedziny-fiszki:abae7c08",
"k": [
"ekspert dla władz",
"praca z grupami",
"osobisty doradca"
],
"unit": "wyklad-2-dziedziny.html",
"sec": "s4"
},
{
"q": "Na czym polega teoria selektywnej optymalizacji z kompensacją?",
"a": "<p>Baltesowie: <strong>selekcja<\/strong> to wybór ważnych celów, <strong>optymalizacja<\/strong> to kształtowanie korzystnych warunków, <strong>kompensacja<\/strong> to zastępowanie utraconych środków dostępnymi zasobami.<\/p>",
"src": "Psychologia kliniczna, r. 26",
"id": "kliniczna/wyklad-2-dziedziny-fiszki:9564e5fb",
"k": [
"selekcja: wybór celów",
"optymalizacja: korzystne warunki",
"kompensacja: zastępowanie utraconych środków"
],
"unit": "wyklad-2-dziedziny.html",
"sec": "s5"
},
{
"q": "Co głosi teoria selektywności społeczno-emocjonalnej?",
"a": "<p>Carstensen: przy krótszej perspektywie przyszłości ludzie wybierają <strong>mniej, ale głębszych<\/strong> relacji.<\/p>",
"src": "Psychologia kliniczna, r. 26",
"id": "kliniczna/wyklad-2-dziedziny-fiszki:166f1f6f",
"k": [
"krótsza perspektywa przyszłości",
"mniej, ale głębszych relacji"
],
"unit": "wyklad-2-dziedziny.html",
"sec": "s5"
},
{
"q": "Które rodzaje pamięci i inteligencji słabną w starości, a które są stabilne?",
"a": "<p>Słabnie pamięć epizodyczna i autobiograficzna oraz inteligencja <strong>płynna<\/strong>. Stabilna pozostaje pamięć proceduralna i semantyczna oraz inteligencja <strong>skrystalizowana<\/strong>.<\/p>",
"src": "Psychologia kliniczna, r. 26",
"id": "kliniczna/wyklad-2-dziedziny-fiszki:ac550852",
"k": [
"słabnie: epizodyczna i autobiograficzna",
"słabnie: inteligencja płynna",
"stabilne: proceduralna i semantyczna",
"stabilna: skrystalizowana"
],
"unit": "wyklad-2-dziedziny.html",
"sec": "s5"
},
{
"q": "Jakie postawy wobec własnej starości opisał Bromley?",
"a": "<p>Konstruktywną, zależności, obronną, wrogości wobec innych i autodestrukcji.<\/p>",
"src": "Psychologia kliniczna, r. 26",
"id": "kliniczna/wyklad-2-dziedziny-fiszki:0ce42796",
"k": [
"konstruktywna",
"zależności",
"obronna",
"wrogości",
"autodestrukcji"
],

"sec": "s5"
},
{
"q": "Jak ICD-10 definiuje otępienie i jaki jest w nim stan świadomości?",
"a": "<p>Jako przewlekły lub postępujący zespół spowodowany chorobą mózgu, z zaburzeniem pamięci, myślenia, orientacji, języka i oceny. <strong>Świadomość nie jest zaburzona<\/strong>.<\/p>",
"src": "Psychologia kliniczna, r. 26",
"id": "kliniczna/wyklad-2-dziedziny-fiszki:9658e02c",
"k": [
"przewlekły lub postępujący zespół",
"choroba mózgu",
"pamięć, myślenie, orientacja, język",
"świadomość niezaburzona"
],
"unit": "wyklad-2-dziedziny.html",
"sec": "s5"
},
{
"q": "Jak odróżnić depresję od otępienia u osoby starszej?",
"a": "<p>Deficyty uwagi i pamięci bywają podobne. Wyraźne różnice dotyczą funkcji <strong>językowych i wzrokowo-przestrzennych<\/strong>, które są zaburzone w otępieniu.<\/p>",
"src": "Psychologia kliniczna, r. 26",
"id": "kliniczna/wyklad-2-dziedziny-fiszki:fd293671",
"k": [
"uwaga i pamięć podobne",
"funkcje językowe zaburzone w otępieniu",
"funkcje wzrokowo-przestrzenne"
],
"unit": "wyklad-2-dziedziny.html",
"sec": "s5"
},
{
"q": "Czym jest reminiscencja i jakie ma typy?",
"a": "<p>Przypominaniem wydarzeń z własnego życia (Butler) dla wzmocnienia tożsamości i integracji Ja. Typy: przegląd życia, integrująca, transmisyjna, zmniejszająca znudzenie, przygotowująca do śmierci.<\/p>",
"src": "Psychologia kliniczna, r. 26",
"id": "kliniczna/wyklad-2-dziedziny-fiszki:64a8d42a",
"k": [
"przypominanie własnego życia (Butler)",
"tożsamość i integracja Ja",
"przegląd życia, integrująca, transmisyjna"
],
"unit": "wyklad-2-dziedziny.html",
"sec": "s5"
},
{
"q": "Czym jest ageizm i stereotyp infantylizacji?",
"a": "<p><strong>Ageizm<\/strong> (Butler, 1969) to przedstawianie starszych jako słabych i niedołężnych. <strong>Infantylizacja<\/strong> to traktowanie ich jak dzieci, co sprzyja nadopiekuńczości, poczuciu bezradności i niskiej wartości.<\/p>",
"src": "Psychologia kliniczna, r. 26",
"id": "kliniczna/wyklad-2-dziedziny-fiszki:bf94eff9",
"k": [
"ageizm: starsi jako słabi",
"infantylizacja: jak dzieci",
"nadopiekuńczość, bezradność"
],
"unit": "wyklad-2-dziedziny.html",
"sec": "s5"
},
{
"q": "Jak art. 31 § 1 k.k. definiuje niepoczytalność i jaką metodą?",
"a": "<p>Sprawca z powodu choroby psychicznej, upośledzenia umysłowego lub innego zakłócenia czynności psychicznych nie mógł w czasie czynu rozpoznać jego znaczenia lub pokierować swoim postępowaniem. To <strong>metoda mieszana<\/strong>: przyczyna psychiatryczna musi dawać skutek psychologiczny.<\/p>",
"src": "Psychologia kliniczna, r. 27",
"id": "kliniczna/wyklad-2-dziedziny-fiszki:6b5fab54",
"k": [
"choroba, upośledzenie lub zakłócenie czynności",
"nie mógł rozpoznać znaczenia czynu",
"lub pokierować postępowaniem",
"metoda mieszana"
],
"unit": "wyklad-2-dziedziny.html",
"sec": "s6"
},
{
"q": "Czym różni się silne wzburzenie z art. 148 § 4 k.k. od afektu z art. 31 § 2 k.k.?",
"a": "<p>Art. 148 § 4: wzburzenie <strong>usprawiedliwione okolicznościami<\/strong>, wywołane czynnikami zewnętrznymi, o charakterze sytuacyjnym. Art. 31 § 2: ograniczona poczytalność, w której ważniejsze są czynniki wewnętrzne sprawcy.<\/p>",
"src": "Psychologia kliniczna, r. 27",
"id": "kliniczna/wyklad-2-dziedziny-fiszki:d02a0da8",
"k": [
"148 § 4: wzburzenie usprawiedliwione okolicznościami",
"czynniki zewnętrzne, sytuacyjne",
"31 § 2: ograniczona poczytalność, czynniki wewnętrzne"
],
"unit": "wyklad-2-dziedziny.html",
"sec": "s6"
},
{
"q": "Jakie trzy warianty biegłych przewiduje prawo?",
"a": "<p>Biegły <strong>z listy<\/strong> (prezes sądu okręgowego, kadencja 5 lat), biegły <strong>ad hoc<\/strong> (do konkretnej sprawy) i biegły <strong>instytucjonalny<\/strong> (opinia instytucji naukowej lub specjalistycznej).<\/p>",
"src": "Psychologia kliniczna, r. 27",
"id": "kliniczna/wyklad-2-dziedziny-fiszki:6119f3ed",
"k": [
"z listy (5 lat)",
"ad hoc",
"instytucjonalny"
],

"sec": "s6"

{
"q": "Jak psychologia ujmuje prawne pojęcie demoralizacji nieletnich?",
"a": "<p>Ustawa go nie definiuje, tylko wymienia przejawy. Odpowiednikami psychologicznymi są <strong>niedostosowanie społeczne<\/strong> i <strong>asocjalność<\/strong> (Stanik).<\/p>",
"src": "Psychologia kliniczna, r. 27",

"niedostosowanie społeczne",
"asocjalność"
],
"unit": "wyklad-2-dziedziny.html",
"sec": "s6"
},
{
"q": "Co głosi ogólna teoria napięcia Agnew?",
"a": "<p>Niepowodzenie w osiąganiu celów, utrata bodźców pozytywnych i narażenie na negatywne wzbudzają afekt negatywny. Przestępstwo jest sposobem zlikwidowania napięcia. Teoria wyjaśnia zarówno pojedynczy czyn (czynnik spustowy), jak i przestępczość (predyspozycja).<\/p>",
"src": "Psychologia kliniczna, r. 27",
"id": "kliniczna/wyklad-2-dziedziny-fiszki:c0c23581",
"k": [
"niepowodzenie w celach, utrata pozytywnych, negatywne bodźce",
"afekt negatywny",
"przestępstwo likwiduje napięcie"
],
"unit": "wyklad-2-dziedziny.html",
"sec": "s6"
},
{
"q": "Na jakim założeniu opiera się profilowanie i która hipoteza ma najlepsze poparcie?",
"a": "<p>Na <strong>stałości transsytuacyjnej<\/strong> zachowania. Najlepiej popartą hipotezą jest <strong>stałość przestępcy<\/strong> (Canter). Homologia (podobne zachowania oznaczają podobnych sprawców) ma słabsze poparcie.<\/p>",
"src": "Psychologia kliniczna, r. 27",
"id": "kliniczna/wyklad-2-dziedziny-fiszki:3bba1dc7",
"k": [
"stałość transsytuacyjna zachowania",
"najlepiej poparta: stałość przestępcy",
"homologia słabiej"
],
"unit": "wyklad-2-dziedziny.html",
"sec": "s6"
},
{
"q": "Co mówi zasada dostatecznej racji i zasada selektywności informacji w psychologii sądowej?",
"a": "<p><strong>Dostateczna racja<\/strong>: dystans poznawczy i sądy opisowe zamiast oceniających. <strong>Selektywność<\/strong>: w opinii tylko informacje niezbędne dla organu procesowego.<\/p>",
"src": "Psychologia kliniczna, r. 27",
"id": "kliniczna/wyklad-2-dziedziny-fiszki:719ffc5f",
"k": [
"dystans poznawczy, sądy opisowe",
"tylko informacje niezbędne dla organu"
],
"unit": "wyklad-2-dziedziny.html",
"sec": "s6"
},
{
"q": "Czym różni się relacja biegłego z badanym od relacji terapeuty z pacjentem?",
"a": "<p>Klientem biegłego jest sąd lub strona, nie badany. Postawa biegłego jest neutralna i oceniająca, dane weryfikuje się z wielu źródeł, strukturę narzuca biegły, a antagonizm jest częsty. Celem jest ocena, nie pomoc.<\/p>",
"src": "Psychologia kliniczna, r. 27",
"id": "kliniczna/wyklad-2-dziedziny-fiszki:efe5cdb1",
"k": [
"klientem sąd lub strona",
"postawa neutralna i oceniająca",
"weryfikacja z wielu źródeł",
"cel: ocena, nie pomoc"
],
"unit": "wyklad-2-dziedziny.html",
"sec": "s6"
},
{
"q": "Jakie trzy rodzaje diagnoz wyróżnia się w psychologii penitencjarnej?",
"a": "<p><strong>Resocjalizacyjną<\/strong> (nieprzystosowanie i podatność na oddziaływania), <strong>terapeutyczną<\/strong> (zaburzenia w trakcie kary) i <strong>ryzyka recydywy<\/strong> (Niewiadomska).<\/p>",
