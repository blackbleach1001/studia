"src": "Heszen i Sęk (2007)",
"q": "Jak Heszen-Celińska i Sęk ujmują zdrowie w rozdziale o zasobach i deficytach?",
"a": "<p>Jako dynamiczne równoważenie wymagań (stresorów, patogenów) z potrzebami i możliwościami człowieka. Równowaga na poziomie biologicznym, psychologicznym i społecznym utrzymuje się dzięki procesom regulacji (adaptacji lub dezadaptacji). Zasoby i deficyty działają jako predyktory – moderatory lub mediatory adaptacji.<\/p>",
"k": [
"równoważenie wymagań i możliwości",
"adaptacja vs dezadaptacja",
"zasoby i deficyty jako predyktory"
],

"q": "Czym są zasoby i do czego służą?",

"k": [
"potencjały zdrowia",

"usprawnienie radzenia sobie",
"bezpośredni wpływ na zdrowie"
],

"sec": "s1"

"uniwersalna: różne obciążenia",

"k": [
"konfiguracja cech",
"interakcja z czynnikami",
"zależność od kontekstu"

"q": "Jakie obszary inteligencji emocjonalnej wyróżniają Salovey i współpracownicy i co oznacza jej deficyt?",
"a": "<p>Spostrzeganie, ocenianie i wyrażanie emocji; ułatwianie myślenia emocjami; rozumienie informacji emocjonalnej; regulacja emocji. Deficyt (brak optymizmu, wrogość, depresyjność, brak empatii, aleksytymia) należy do głównych predyktorów zaburzeń psychosomatycznych.<\/p>",

"sec": "s2"
},
{

"q": "Dlaczego kompetencje społeczne są zasobem zdrowotnym?",

"k": [
"niewerbalne i werbalne",

"brak = czynnik ryzyka",

"sec": "s2"
},
{

"q": "Czym różnią się naturalne i sformalizowane źródła wsparcia?",
"a": "<p>Naturalne (partner, rodzina, przyjaciele) działają spontanicznie, wzajemnie, są łatwo dostępne i nie stygmatyzują – najkorzystniej dla zdrowia. Sformalizowane (instytucje, służba zdrowia) działają według reguł, rzadziej wzajemnie, bywają trudno dostępne i stygmatyzujące.<\/p>",
"k": [
"naturalne: spontaniczne, wzajemne",
"sformalizowane: reguły, stygmatyzacja"

"sec": "s3"
},
{

"q": "Wymień rodzaje wsparcia społecznego i ich ryzyka.",
"a": "<p>Emocjonalne (najpowszechniejsze), informacyjne (podtrzymuje poczucie kontroli), instrumentalne (instruktaż; może ograniczać rozwój zasobów – stosować przejściowo), rzeczowe (materialne; dbać o godność), duchowe (kryzys egzystencjalny, sytuacje terminalne).<\/p>",
"k": [
"emocjonalne",
"informacyjne",

{

"q": "Czym różni się wsparcie spostrzegane od otrzymywanego i czym jest mobilizacja wsparcia?",
"a": "<p>Spostrzegane – przekonanie, na kogo można liczyć (jego brak to samotność). Otrzymywane – faktycznie uzyskana pomoc w danym czasie; ważna jej trafność wobec potrzeby. Mobilizacja – poszukiwanie wsparcia (wprost lub pośrednio) i zdolność uruchamiania sieci, zależna od kompetencji społecznych i stylu przywiązania.<\/p>",

"trafność i potrzeba",
"mobilizacja"

"unit": "wyklad-4.html",
"sec": "s3"
},
{
"src": "Heszen i Sęk (2007)",
"q": "Na czym polegają bezpośrednie i buforowe działanie wsparcia?",
"a": "<p>Bezpośrednie: wsparcie zmniejsza narażenie na stresory lub ich spostrzeganie oraz wprost poprawia dobrostan i zdrowie. Buforowe (najczęściej weryfikowane): w silnym stresie obniża napięcie i osłabia negatywne skutki stresu – ścieżkami fizjologiczną, psychologiczną i behawioralną.<\/p>",
"k": [
"efekt na stresory",
"efekt na zdrowie",
"bufor w silnym stresie",
"trzy ścieżki"
],
"id": "kliniczna/wyklad-4-fiszki:64221507",
"unit": "wyklad-4.html",
"sec": "s3"
},
{

"q": "Czym jest deterioracja wsparcia społecznego?",
"a": "<p>Pogorszenie wsparcia w stresie katastroficznym: społeczności tracą potencjał altruizmu, sieci się rozpadają, pojawiają się konflikty (Kaniasty i Norris, badania klęsk żywiołowych). Może też wystąpić przy długiej hospitalizacji i przesiedleniach.<\/p>",
"k": [
"Kaniasty i Norris",
"klęski żywiołowe",
"rozpad sieci"
],
"id": "kliniczna/wyklad-4-fiszki:eecea0c8",
"unit": "wyklad-4.html",
"sec": "s3"
},
{

"q": "Jak status społeczno-ekonomiczny wpływa na zdrowie i zasoby?",
"a": "<p>Niższy SES oznacza mniej pozytywnych i więcej negatywnych doświadczeń, a więc mniejsze szanse gromadzenia zasobów osobistych i społecznych. Według Hobfolla utrata zasobów podstawowych uruchamia spiralę strat, której zyski nie równoważą.<\/p>",
"k": [
"niski SES – mniej zasobów",

],

"unit": "wyklad-4.html",
"sec": "s4"
},
{

"q": "Czym jest resilience według Heszen-Celińskiej i Sęk?",
"a": "<p>Zespół umiejętności skutecznego, elastycznego i twórczego radzenia sobie ze stresem o dużym nasileniu: zdolność do „odbicia się” od negatywnych doświadczeń, wzbudzania pozytywnych emocji i utrzymywania więzi. Nie jest wrodzona, nie oznacza braku ryzyka, jest dynamiczna i można ją rozwijać.<\/p>",
"k": [
"bounce-back",

"nie wrodzona",
"można rozwijać"
],
"id": "kliniczna/wyklad-4-fiszki:39a6f6c7",
"unit": "wyklad-4.html",
"sec": "s5"
},
{
"src": "Heszen i Sęk (2007)",
"q": "Jak model integrujący (rys. 10.1) łączy podejście patogenetyczne i salutogenetyczne?",
"a": "<p>Patogenetyczne szuka czynników ryzyka i deficytów (model podatność–stres), salutogenetyczne – zasobów i czynników ochronnych, traktując wymagania jako wyzwania. Czynniki ryzyka i ochronne współdziałają, tworząc różne wzory równoważenia; resilience powstaje właśnie w tej konfrontacji.<\/p>",
"k": [
"podatność–stres",
"zasoby i ochrona",
"współdziałanie ryzyka i zasobów"
],
"id": "kliniczna/wyklad-4-fiszki:4e4069e9",
"unit": "wyklad-4.html",
"sec": "s5"
},
{
"src": "Heszen i Sęk (2007)",
"q": "Na czym polega reakcja zaprzeczania chorobie i jakie ma koszty?",
"a": "<p>Nieświadome nieprzyjmowanie do wiadomości choroby lub jej skutków mimo informacji; chroni przed lękiem (mechanizm pokrewny wyparciu). Jest antagonistyczna wobec instrumentalnego radzenia sobie: chory nie leczy się, a nawet podejmuje wyczerpującą aktywność.<\/p>",
"k": [
"nieświadome",
"obrona przed lękiem",
"blokuje leczenie"
],

"unit": "wyklad-4.html",
"sec": "s6"
},
{
"src": "Heszen i Sęk (2007)",
"q": "Opisz trzy fazy adaptacji poznawczej według Taylor.",
"a": "<p>1) Poszukiwanie znaczenia (atrybucja przyczyn, przewartościowanie życia); 2) uzyskanie kontroli nad zagrożeniem lub jego przyczyną; 3) odzyskanie poczucia własnej wartości, głównie przez porównania „w dół”. Według Taylor wiele osób osiąga przystosowanie lepsze niż przed zagrożeniem.<\/p>",
"k": [
"znaczenie",
"kontrola",
"samoocena: porównania w dół"
],
"id": "kliniczna/wyklad-4-fiszki:bd1444ab",
"unit": "wyklad-4.html",
"sec": "s6"
},
{
"src": "Heszen i Sęk (2007)",
"q": "Czy ekspresja emocji jest formą radzenia sobie?",
"a": "<p>Dyskusyjnie: definicja Lazarusa i Folkman wymaga wysiłku, a ekspresja bywa automatyczna. Ale część ekspresji jest kontrolowana, a celowe czynności emocjonalne (Reykowski) spełniają definicję. Daje ulgę, lecz gwałtowne wybuchy mogą wywołać wstyd, poczucie winy i niekorzystne zmiany fizjologiczne.<\/p>",
"k": [
"wysiłek w definicji",
"czynności emocjonalne",
"ulga vs koszty"
],
"id": "kliniczna/wyklad-4-fiszki:760a386f",
"unit": "wyklad-4.html",
"sec": "s6"
},
{
"src": "Heszen i Sęk (2007)",
"q": "Jakie strategie wzbudzania emocji pozytywnych opisały Folkman i Moskowitz?",
"a": "<p>Nasycanie zwykłych zdarzeń pozytywnym znaczeniem (99% wywiadów), wzmacnianie pozytywnego afektu (tworzenie pozytywnych wydarzeń), znajdowanie korzyści w stresie, urealnienie priorytetów i przeformułowanie celów. Wszystkie wynikają z radzenia sobie skoncentrowanego na znaczeniu.<\/p>",
"k": [
"pozytywne znaczenie zwykłych zdarzeń",
"wzmacnianie afektu",
"znajdowanie korzyści",
"urealnienie priorytetów"
],

"unit": "wyklad-4.html",
"sec": "s6"
},

"q": "Co znaczy potraktować chorobę jako zadanie (Tomaszewski)?",
"a": "<p>Sytuacja choroby to układ wartości (choroba – negatywna, zdrowie – pozytywna) i możliwości (pozytywnych i negatywnych). Zadanie polega na przekształceniu stanu choroby w stan zdrowia; warunkiem jest adekwatny obraz własnej choroby. O zaliczeniu działania do tego nurtu decyduje intencja chorego.<\/p>",

"sec": "s7"
},

"q": "Jak pacjenci łączą wykonywanie zaleceń z własnymi inicjatywami?",
"a": "<p>W badaniach Heszen-Niejodek własne działania zdrowotne podejmowało 93% pacjentów z chorobą wrzodową, ale tylko ok. 10% zamiast zaleceń; 82% łączyło je z zaleceniami jako leczenie uzupełniające – przejaw zaangażowania, nie sprzeciwu. Odsetek rośnie z czasem choroby (do ok. 90%).<\/p>",

],

"sec": "s7"
},
{
"src": "Heszen i Sęk (2007)",
"q": "Czym różni się ból ostry od przewlekłego?",
"a": "<p>Ostry: jednoprzyczynowy, skutecznie leczony farmakologicznie, pełni funkcję ostrzegawczą, częściej towarzyszy mu lęk. Przewlekły: wieloprzyczynowy, słabo reaguje na leki, leczenie niefarmakologiczne jest pierwszoplanowe, traci funkcję ostrzegawczą, częściej towarzyszy mu depresja.<\/p>",

"sec": "s7"
},
{
"src": "Heszen i Sęk (2007)",
"q": "Jakie psychologiczne metody stosuje się w leczeniu bólu i na czym polega samokontrola bólu?",
"a": "<p>Hipnoza, psychoterapia zorientowana na wgląd, relaksacja, biofeedback, terapia poznawczo-behawioralna. Samokontrola bólu (self-management) to program kompleksowy: odpowiedzialność za wyniki przechodzi na pacjenta, cele ustala się wspólnie (odwracanie uwagi, radzenie sobie z epizodami bólu i emocjami, poprawa aktywności).<\/p>",

"hipnoza, wgląd, relaksacja",
"biofeedback, CBT",
"self-management"
],
"id": "kliniczna/wyklad-4-fiszki:d3c9731a",
"unit": "wyklad-4.html",
"sec": "s7"
},
{
"src": "Heszen i Sęk (2007)",
"q": "Jak postawa wobec informacji wpływa na radzenie sobie z chorobą?",
"a": "<p>Poszukiwanie informacji umożliwia instrumentalne radzenie sobie, ale grozi koncentracją na drobiazgach; unikanie (skrajnie – zaprzeczanie) bywa korzystne wobec przejściowych dolegliwości i zabiegów poza kontrolą. Najlepsza jest elastyczność, a klinicznie – dopasowanie interwencji do indywidualnego stylu (Miller i Mangan).<\/p>",
"k": [
"poszukiwanie vs unikanie",

"dopasowanie do stylu"
],
"id": "kliniczna/wyklad-4-fiszki:871e98c9",
"unit": "wyklad-4.html",
"sec": "s8"
},
{
"src": "Heszen i Sęk (2007)",
"q": "Jaki jest związek poziomu lęku z działaniami na rzecz zdrowia?",
"a": "<p>Krzywoliniowy: średni poziom lęku najbardziej sprzyja aktywności zdrowotnej; niski nie angażuje, wysoki dezorganizuje (Heszen-Niejodek). Stres, choroba i radzenie sobie łączy pętla sprzężeń zwrotnych.<\/p>",

"krzywoliniowy",
"średni lęk",
"pętla stres–choroba–radzenie"
],

"sec": "s8"

"a": "<p>Czynnik zwiększający <strong>prawdopodobieństwo<\/strong> straty lub zaburzenia. Nie jest <strong>ani wystarczający, ani niezbędny<\/strong>: część osób zachowujących się ryzykownie nie zachoruje, a część zachoruje bez takich zachowań.<\/p>",

"zwiększa prawdopodobieństwo",

],

"sec": "s9"
},
{
"q": "Czym różni się ryzyko bezwzględne od względnego i przypisanej różnicy w ryzyku?",
"a": "<p><strong>Bezwzględne:<\/strong> ogólna zapadalność w populacji. <strong>Względne:<\/strong> ile razy rośnie prawdopodobieństwo u narażonych (narażeni / nienarażeni). <strong>Przypisana różnica:<\/strong> o ile % spadłaby zapadalność po wyeliminowaniu czynnika ((ogólne − nienarażeni) / ogólne).<\/p>",
"src": "Cierpiałkowska i Sęk, 2016",
"k": [
"bezwzględne",
"względne",
"przypisana różnica"
],
"id": "kliniczna/wyklad-4-fiszki:a1b6839d",
"unit": "wyklad-4.html",
"sec": "s9"
},
{
"q": "Dlaczego podaje się ryzyko względne i bezwzględne razem?",
"a": "<p>Niosą różne informacje: mały procentowy wzrost ryzyka choroby <strong>częstej<\/strong> może oznaczać większe zagrożenie niż duży wzrost ryzyka choroby <strong>bardzo rzadkiej<\/strong>.<\/p>",

"częsta vs rzadka choroba"
],

"src": "Cierpiałkowska i Sęk, 2016",

"rozwojowe"
],

"unit": "wyklad-4.html",

},
{
"q": "Czym różnią się sytuacyjne od środowiskowych czynników ryzyka?",
"a": "<p>Środowiskowe (ubóstwo, toksyczność, konfliktowość, stresowość środowiska) działają <strong>podstępnie i długotrwale<\/strong>, a część jest poza kontrolą człowieka. Sytuacyjne to sytuacje zagrożenia i krytyczne wydarzenia.<\/p>",

],

{
"q": "Dlaczego kryzys rozwojowy to „układ ryzykownych szans”?",
"a": "<p>Nasilenie konfliktu zwiększa prawdopodobieństwo nierozwiązania kryzysu lub patologicznych strategii, ale żeby go rozwiązać, trzeba podjąć <strong>ryzykowne, nowe zadania<\/strong>. Stąd „ryzyko rozwojowe”.<\/p>",

],

},
{
"q": "Jak ryzyko współdziała z zasobami (Caplan, Albee)?",
"a": "<p>Ryzyko <strong>nie musi prowadzić do patologii<\/strong>, bo zasoby jednostki i środowiska mogą je kompensować. Patologia jest tym bardziej prawdopodobna, im więcej różnorodnych czynników ryzyka (B, P, S, E) przy <strong>słabych zasobach<\/strong>. Diagnoza tej relacji to podstawa interwencji prewencyjnych.<\/p>",
"src": "Cierpiałkowska i Sęk, 2016",
"k": [
"ryzyko vs zasoby",

],

"unit": "wyklad-4.html",
"sec": "s9"
},
{

"a": "<p><strong>Pierwotna<\/strong> (przed wystąpieniem zaburzeń), <strong>wtórna<\/strong> (wczesne sygnały, powstrzymanie rozwoju patologii) i <strong>trzeciego stopnia<\/strong> (zapobieganie skutkom choroby i nawrotom, rehabilitacja).<\/p>",

],

"sec": "s10"
},
{
"q": "Co to jest prewencja pierwotna według Cowena i kogo dotyczy?",
"a": "<p>Wzmacnianie zasobów psychologicznych i przeciwdziałanie psychologicznym i społecznym czynnikom ryzyka. Dotyczy osób, które <strong>czują się zdrowe, ale należą do grup ryzyka<\/strong>.<\/p>",

"unit": "wyklad-4.html",

},
{
"q": "Czym różni się strategia negatywna od pozytywnej w prewencji?",
"a": "<p><strong>Negatywna<\/strong> działa na czynniki ryzyka (apele, perswazja; może wywołać reaktancję, skuteczna przy bardzo wysokim ryzyku). <strong>Pozytywna<\/strong> wzmacnia zasoby odpornościowe i kompetencje; jest podstawowa w promocji zdrowia.<\/p>",

"unit": "wyklad-4.html",
"sec": "s10"
},
{
"q": "Czym różni się prewencja od promocji zdrowia?",
"a": "<p>Prewencja jest zorientowana na <strong>grupy ryzyka<\/strong> i zachowanie status quo oraz zmniejszanie ryzyka patologii. Promocja dotyczy <strong>całej populacji<\/strong> i procesów rozwojowych (zasoby, dobrostan, jakość życia).<\/p>",
"src": "Cierpiałkowska i Sęk, 2016",

"sec": "s10"
},
{
"q": "Co to jest temperamentalny czynnik ryzyka (Strelau)?",
"a": "<p>Każda cecha lub konfiguracja cech temperamentu, która w <strong>interakcji z innymi czynnikami<\/strong> (środowisko, wychowanie, cecha osobowości) zwiększa ryzyko zaburzeń zachowania lub patologii.<\/p>",

{

"a": "<p>Oznacza stymulację niewystarczającą lub nadmierną, czyli brak równowagi między możliwościami a wymaganiami. To <strong>stałe wewnętrzne źródło stresu<\/strong>.<\/p>",

"brak równowagi",
"źródło stresu"
],

{

"a": "<p>Dodatnio: <strong>perseweratywność<\/strong> i <strong>reaktywność emocjonalna<\/strong>. Ujemnie: wytrzymałość, aktywność, żwawość (cechy chroniące).<\/p>",

{

},
{
"q": "Dlaczego związek WZA z chorobą serca jest niejednoznaczny?",
"a": "<p>Część badań go nie potwierdza. Hipotezy: WZA jest ryzykiem tylko <strong>w interakcji z temperamentem<\/strong> (przy aktywności nie; przy wysokiej reaktywności emocjonalnej tak) albo szkodzą tylko komponenty (<strong>wrogość<\/strong>, egocentryzm, antagonizm). Dane wskazują też, że to <strong>ogólny<\/strong> czynnik ryzyka zdrowotnego.<\/p>",

],

},
{

},
{

"a": "<p>„Skłonna do raka” (Temoshok, 1987): reakcja <strong>beznadziejności i bezradności<\/strong> wobec stresu i <strong>wypieranie negatywnych emocji<\/strong>; bierność, uprzejmość, pogoda ducha. W badaniach podłużnych słabo potwierdzona; może być <strong>skutkiem<\/strong> choroby.<\/p>",
"src": "Cierpiałkowska i Sęk, 2016",

"a": "<p>Denollet (1998), „osobowość stresowa”. Dwie składowe: <strong>negatywna emocjonalność<\/strong> (dysforia, zamartwianie, irytacja) i <strong>zahamowanie społeczne<\/strong>. Ogólny czynnik ryzyka: choroby układu krążenia (progresja, ryzyko zgonu), nerek, nowotwory; współwystępuje ze szkodliwymi zachowaniami zdrowotnymi.<\/p>",

"a": "<p>Pierwotna <strong>I<\/strong> (czy bodziec jest stresorem), <strong>II<\/strong> (zagrażający, pozytywny, nieszkodliwy, obojętny), <strong>III<\/strong> (problemy instrumentalne i regulacja emocji), a ponadto wtórna (wymagania a zasoby) i <strong>trzeciorzędowa<\/strong> (informacja zwrotna i korekta).<\/p>",
"src": "Cierpiałkowska i Sęk, 2016",

"pierwotna I, II, III",

],

{
"q": "Jak poczucie koherencji chroni przed skutkami stresu?",
"a": "<p>Jest <strong>mediatorem<\/strong> między bodźcem a oceną pierwotną: mniej bodźców oceniamy jako stresory, częściej jako <strong>wyzwanie<\/strong> (z pozytywnymi emocjami), dobieramy strategie do stresora i korygujemy je dzięki informacji zwrotnej.<\/p>",
"src": "Cierpiałkowska i Sęk, 2016",
"k": [
"mediator",
"wyzwanie",
"dobór strategii"
],

"unit": "wyklad-4.html",
"sec": "s12"
},
{
"q": "Co pokazały badania nad poczuciem koherencji?",
"a": "<p>Związek z lepszą subiektywną i obiektywną oceną zdrowia i <strong>zachowaniami prozdrowotnymi<\/strong>; fińskie badania podłużne (prawie 2 tys. osób): SOC <strong>przewidywał subiektywny stan zdrowia po 4 latach<\/strong>; potwierdzono <strong>rolę buforową<\/strong> wobec stresu traumatycznego.<\/p>",
"src": "Cierpiałkowska i Sęk, 2016",
"k": [
"zdrowie subiektywne",

"bufor"
],

},
{

"a": "<p>Optymizm życiowy, odporność psychiczna, poczucie własnej skuteczności, poczucie umiejscowienia kontroli zdrowia, inteligencja emocjonalna (obok poczucia koherencji).<\/p>",
"src": "Cierpiałkowska i Sęk, 2016",
"k": [
"optymizm",
"odporność",
"skuteczność",
"umiejscowienie kontroli"
],

"sec": "s12"
},

"a": "<p><strong>Przedtraumatyczny<\/strong> (cechy jednostki i jej stan), <strong>traumy<\/strong> (ocena zdarzenia i emocji) oraz <strong>potraumatyczny<\/strong> (natrętne wspomnienia, unikanie, asymilacja informacji).<\/p>",
"src": "Cierpiałkowska i Sęk, 2016",
"k": [
"przed",
"w trakcie",
"po"
],
"id": "kliniczna/wyklad-4-fiszki:5313990d",

"sec": "s13"
},
{
"q": "Jakie czynniki podmiotowe zwiększają ryzyko PTSD?",
"a": "<p>Płeć żeńska; temperament (reaktywność emocjonalna, perseweratywność); osobowość: unikanie szkody, poszukiwanie nowości, wrogość, neurotyczność, introwersja, aleksytymia, <strong>typ D<\/strong> (negatywna emocjonalność).<\/p>",

"płeć",
"temperament",
"typ D"
],

"unit": "wyklad-4.html",
"sec": "s13"
},
{
"q": "Jaką rolę w PTSD mają wsparcie społeczne i radzenie sobie?",
"a": "<p>Brak wsparcia sprzyja PTSD, ale wyniki są niejednoznaczne (typy, rodzaje, źródła wsparcia). Styl skoncentrowany na emocjach wiąże się z cięższymi objawami; osoby z PTSD częściej stosują <strong>pasywne<\/strong> strategie (zaprzeczanie, alkohol), rzadziej <strong>aktywne<\/strong> (szukanie wsparcia).<\/p>",
"src": "Cierpiałkowska i Sęk, 2016",
"k": [
"wsparcie",
"pasywne strategie",
"aktywne strategie"
],

"unit": "wyklad-4.html",
"sec": "s13"
},
{
"q": "Co to jest wzrost potraumatyczny?",
"a": "<p>Pozytywne zmiany psychologiczne będące wynikiem prób poradzenia sobie z następstwami traumy (Tedeschi i Calhoun). Według Nolen-Hoeksema i Davis jest to <strong>sposób lub proces<\/strong> radzenia sobie, a nie tylko jego efekt.<\/p>",

],

"unit": "wyklad-4.html",
"sec": "s13"
},
{
"q": "Kiedy czynnik uznajemy za źródło ryzyka w rozwoju dziecka?",
"a": "<p>Gdy pojawia się <strong>przed<\/strong> negatywnymi efektami rozwojowymi. Prawdopodobieństwo psychopatologii rośnie przy długim narażeniu, braku czynników ochronnych i <strong>kumulacji<\/strong> czynników ryzyka.<\/p>",

"sec": "s14"
},
{

"a": "<p><strong>Buforowanie, równoważenie i redukowanie ryzyka<\/strong> (Fergus i Zimmerman). Poziomy: <strong>intrapersonalny<\/strong>, <strong>środowiskowy rodzinny<\/strong>, <strong>środowiskowy pozarodzinny<\/strong>; osobno zdarzenia stresowe.<\/p>",

"unit": "wyklad-4.html",
"sec": "s14"
},
{

"a": "<p><strong>Proces utrzymania zdrowia psychicznego mimo niekorzystnych sytuacji życiowych.<\/strong> Psychopatologia rozwojowa odróżnia też czynniki wywołujące objawy od podtrzymujących lub pogarszających.<\/p>",

},
{

"a": "<p>Płeć (dziewczynki), genetyka, osobowość (wrażliwość, wycofanie), zachowania wyuczone, relacje rodzinne (niestabilność, nadopiekuńczość, brak wsparcia), izolacja społeczna, ostry krytycyzm (bullying), strach przed porażką. Etiologia jest <strong>wieloczynnikowa<\/strong>.<\/p>",

},
{
"src": "Slajdy W4 (Mościcka-Teske)",
"q": "Jak zdefiniowano stres na wykładzie 4?",
"a": "Jako reakcję mobilizacyjną organizmu na sytuacje zagrożenia, ograniczenia lub wyzwania, która rozwija się na bazie indywidualnych właściwości człowieka i zasobów środowiska, wtórnie na nie wpływa i zależy od kultury oraz jej wartości.",

{
"src": "Slajdy W4 (Mościcka-Teske)",
"q": "Czym są zasoby i jakie są ich rodzaje?",
"a": "Czynniki fizyczne, biologiczne, społeczne i psychologiczne, które wpływają na ocenę sytuacji, można je wykorzystać w radzeniu sobie i stanowią przeciwwagę dla stresu. Zewnętrzne pochodzą ze środowiska, wewnętrzne to cechy i umiejętności jednostki.",
"id": "kliniczna/wyklad-4-fiszki:b755dba2",
"unit": "wyklad-4.html",
"sec": "s15"
},
{
"src": "Slajdy W4 (Mościcka-Teske)",
"q": "Jak Sęk i Cieślak definiują wsparcie społeczne?",
"a": "Jako rodzaj interakcji społecznej: powiązania jednostki z otoczeniem, które mają pomóc w sytuacjach trudnych, oraz trwałą tendencję do spostrzegania pomocy innych i korzystania z niej.",
"id": "kliniczna/wyklad-4-fiszki:5bc1a853",
"unit": "wyklad-4.html",
"sec": "s16"
},
{
"src": "Slajdy W4 (Mościcka-Teske)",
"q": "Wymień pięć rodzajów wsparcia społecznego z wykładu.",
"a": "Emocjonalne (emocje podtrzymujące, troska), instrumentalne (instruktaż, jak postępować), informacyjne (informacje pomagające zrozumieć sytuację), rzeczowe (pomoc materialna i finansowa), duchowe (w kryzysach egzystencjalnych).",
"id": "kliniczna/wyklad-4-fiszki:38a5e423",
"unit": "wyklad-4.html",
"sec": "s16"
},
{
"src": "Slajdy W4 (Mościcka-Teske)",
"q": "Dzięki jakim procesom wsparcie społeczne chroni przed stresem?",
"a": "Emocjonalnym (redukcja lęku, motywacja, wyższa samoocena, poczucie ważności) i poznawczym (zmiana znaczenia sytuacji na mniej zagrażającą, nadanie sensu problemom).",
"id": "kliniczna/wyklad-4-fiszki:80386b97",
"unit": "wyklad-4.html",
"sec": "s16"
},
{
"src": "Slajdy W4 (Mościcka-Teske)",
"q": "Co wykazali Heinrichs i in. (2003) o wsparciu i oksytocynie?",
"a": "W stresie psychospołecznym najniższy poziom kortyzolu mieli badani, którzy dostali wsparcie społeczne i oksytocynę; wsparcie i oksytocyna razem tłumią reakcję stresową.",
"id": "kliniczna/wyklad-4-fiszki:8c4fb4cb",
"unit": "wyklad-4.html",
"sec": "s16"
},
{
"src": "Slajdy W4 (Mościcka-Teske)",
"q": "Co pokazali Kahneman i Deaton (2010) o dochodzie i dobrostanie?",
"a": "Ocena życia rośnie wraz z dochodem, ale dobrostan emocjonalny (afekt pozytywny, brak smutku i stresu) przestaje rosnąć powyżej ok. 75 tys. dolarów rocznie.",
"id": "kliniczna/wyklad-4-fiszki:1bb9eb60",
"unit": "wyklad-4.html",
"sec": "s17"
},
{
"src": "Slajdy W4 (Mościcka-Teske)",
"q": "Jakie skutki ma koncentracja na celach zewnętrznych (sukces finansowy)?",
"a": "Niższa samorealizacja i witalność, więcej depresyjności i niepokoju, mniejsza satysfakcja i szczęście, więcej objawów fizycznych i emocji negatywnych, więcej alkoholu i narkotyków, wyższy narcyzm i więcej zaburzeń zachowania (Kasser i Ryan).",
"id": "kliniczna/wyklad-4-fiszki:46b234c0",
"unit": "wyklad-4.html",
"sec": "s17"
},
{
"src": "Slajdy W4 (Mościcka-Teske)",
"q": "Jakie trzy komponenty ma poczucie koherencji i z jakich doświadczeń wyrastają?",
"a": "Zrozumiałość – ze spójności i powtarzalności wydarzeń; zaradność – z równowagi między przeciążeniem a niedociążeniem; sensowność – z udziału w podejmowaniu decyzji.",
"id": "kliniczna/wyklad-4-fiszki:b1e4353e",
"unit": "wyklad-4.html",
"sec": "s18"
},
{
"src": "Slajdy W4 (Mościcka-Teske)",
"q": "Co wykazali Schmuck i in. (2021) o poczuciu koherencji?",
"a": "Poczucie koherencji silnie i ujemnie wiąże się z depresją i lękiem, znacznie silniej niż wsparcie społeczne i religijność.",
"id": "kliniczna/wyklad-4-fiszki:7014ddd6",
"unit": "wyklad-4.html",
"sec": "s18"
},
{
"src": "Slajdy W4 (Mościcka-Teske)",
"q": "Czym jest optymizm życiowy i jak radzą sobie optymiści?",
"a": "To uogólnione oczekiwanie, że będzie się doświadczać raczej dobrych rzeczy niż złych. Optymiści wybierają aktywne strategie, traktują trudności jako wyzwanie, są wytrwali, uczą się z porażek i częściej szukają wsparcia.",
"id": "kliniczna/wyklad-4-fiszki:2a45a6a9",
"unit": "wyklad-4.html",
"sec": "s19"
},
{
"src": "Slajdy W4 (Mościcka-Teske)",
"q": "Jakie trzy wymiary wyjaśniania zdarzeń wyróżnia Seligman i jaki układ prowadzi do wyuczonej bezradności?",
"a": "Stałe vs chwilowe, globalne vs o wąskim zasięgu, wewnętrzne (osobiste) vs sytuacyjne. Wyuczona bezradność wynika z wyjaśniania porażek przyczynami stabilnymi, wewnętrznymi i globalnymi.",
"id": "kliniczna/wyklad-4-fiszki:84a3ec4f",
"unit": "wyklad-4.html",
"sec": "s19"
},
{
"src": "Slajdy W4 (Mościcka-Teske)",
"q": "Czym różni się optymizm funkcjonalny od defensywnego?",
"a": "Funkcjonalny to oczekiwanie pozytywnych zdarzeń połączone z wysoką oceną własnych możliwości i sprzyja zdrowiu. Defensywny to nierealistyczne oczekiwanie, że złe zdarzenia nas ominą; może szkodzić, bo zaniża spostrzegane ryzyko (Weinstein).",
"id": "kliniczna/wyklad-4-fiszki:046f4e06",
"unit": "wyklad-4.html",
"sec": "s19"
},
{
"src": "Slajdy W4 (Mościcka-Teske)",
"q": "Jakie trzy składniki ma nadzieja według Snydera?",
"a": "Cele (jak bardzo cenimy cel), strategie (myśli o drogach do celu) i motywację (myśli o osobistym sprawstwie).",
"id": "kliniczna/wyklad-4-fiszki:6189689a",
"unit": "wyklad-4.html",
"sec": "s20"
},
{
"src": "Slajdy W4 (Mościcka-Teske)",
"q": "Czym jest nadzieja podstawowa?",
"a": "Według Eriksona oraz Trzebińskiego i Zięby to głęboko zakorzenione przekonanie, że świat jest uporządkowany i sensowny oraz przychylny ludziom; podstawowa siła ego.",
"id": "kliniczna/wyklad-4-fiszki:235b99e3",
"unit": "wyklad-4.html",
"sec": "s20"
},
{
"src": "Slajdy W4 (Mościcka-Teske)",
"q": "Co charakteryzuje dzieci, które mimo stresującego domu zachowują nadzieję (Mahoney)?",
"a": "Przypisują trudności roli rodzica, nie osobie; znajdują innych dorosłych jako wsparcie; wcześnie rozpoznają swoje talenty; są wytrwałe; traktują przeciwności jako wyzwanie lub szansę.",
"id": "kliniczna/wyklad-4-fiszki:19bed658",
"unit": "wyklad-4.html",
"sec": "s20"
},
{
"src": "Slajdy W4 (Mościcka-Teske)",
"q": "Jak poczucie własnej skuteczności wpływa na radzenie sobie ze stresem?",
"a": "Wpływa na dobór strategii, wytrwałość i zaangażowanie; zwiększa poczucie kontroli i zmniejsza napięcie, prowadzi do stawiania wyższych celów. Musi uwzględniać rzeczywiste możliwości.",
"id": "kliniczna/wyklad-4-fiszki:370b522c",
"unit": "wyklad-4.html",
"sec": "s21"
},
{
"src": "Slajdy W4 (Mościcka-Teske)",
"q": "Jak działają osoby z niskim poczuciem własnej skuteczności?",
"a": "Nieefektywnie nawet wtedy, gdy wiedzą, jak postępować: unikają trudnych sytuacji, rezygnują przy przeszkodach, wzbudzają silne napięcie, wyolbrzymiają trudności i koncentrują się na brakach.",
"id": "kliniczna/wyklad-4-fiszki:2d2fc5f5",
"unit": "wyklad-4.html",
"sec": "s21"
},
{
"src": "Slajdy W4 (Mościcka-Teske)",
"q": "Kiedy według Csikszentmihalyiego pojawia się flow?",
"a": "Przy zadaniach stanowiących wyzwanie, wymagających znacznych umiejętności, poddających się kontroli i motywujących wewnętrznie – gdy wysokie wyzwanie spotyka się z wysokimi umiejętnościami.",
"id": "kliniczna/wyklad-4-fiszki:fb3a06f9",
"unit": "wyklad-4.html",
"sec": "s22"
},
{
"src": "Slajdy W4 (Mościcka-Teske)",
"q": "Co przeżywamy, gdy wyzwanie i umiejętności są niedopasowane?",
"a": "Wysokie wyzwanie i niskie umiejętności – lęk; niskie wyzwanie i wysokie umiejętności – nuda; oba niskie – apatia.",
"id": "kliniczna/wyklad-4-fiszki:5f7f6811",
"unit": "wyklad-4.html",
"sec": "s22"
},
{
"src": "Slajdy W4 (Mościcka-Teske)",
"q": "Przy jakich czynnościach flow pojawia się najczęściej, a przy jakich najrzadziej?",
"a": "Najczęściej przy hobby, sporcie i kinie; najrzadziej przy próżnowaniu i biernym wypoczynku, rzadko przy pracach domowych i telewizji.",
"id": "kliniczna/wyklad-4-fiszki:713f0286",
"unit": "wyklad-4.html",
"sec": "s22"
},
{
"src": "Slajdy W4 (Mościcka-Teske)",
"q": "Czym są siły sygnaturowe i jakie sześć cnót wyróżnia klasyfikacja VIA?",
"a": "To cechy osobowe (siły charakteru) definiujące cnoty. Cnoty: mądrość, odwaga, człowieczeństwo, sprawiedliwość, powściągliwość i transcendencja (Peterson i Seligman).",
"id": "kliniczna/wyklad-4-fiszki:6b0f2687",
"unit": "wyklad-4.html",
"sec": "s23"
},
{
"src": "Slajdy W4 (Mościcka-Teske)",
"q": "Jakimi sposobami radzą sobie osoby z osobowością prężną (Hall i in.)?",
"a": "Afiliacją, altruizmem, antycypacją, humorem, samostanowieniem (bezpośrednim wyrażaniem uczuć), samoobserwacją i sublimacją.",
"id": "kliniczna/wyklad-4-fiszki:2725f0de",
"unit": "wyklad-4.html",
"sec": "s24"
},
{
"src": "Slajdy W4 (Mościcka-Teske)",
"q": "Na czym polega teoria „poszerzaj i buduj” Fredrickson?",
"a": "Emocje pozytywne poszerzają zakres uwagi, myślenia i działań oraz budują trwałe zasoby fizyczne, psychiczne, intelektualne i społeczne, co prowadzi do spirali wznoszących.",
"id": "kliniczna/wyklad-4-fiszki:2ff4a574",
"unit": "wyklad-4.html",
"sec": "s24"
},
{
"src": "Slajdy W4 (Mościcka-Teske)",
"q": "Czym jest kapitalizacja emocji pozytywnych i jaka reakcja otoczenia jest najlepsza?",
"a": "To dzielenie się dobrym przeżyciem z innymi. Najlepsza jest reakcja aktywna konstruktywna; reakcje destrukcyjne (pasywne i aktywne) szkodzą.",
"id": "kliniczna/wyklad-4-fiszki:08242f8d",
"unit": "wyklad-4.html",
"sec": "s24"
},
{
"src": "Slajdy W4 (Mościcka-Teske)",
"q": "Jakimi narzędziami mierzy się poczucie koherencji, optymizm i poczucie skuteczności?",
"a": "SOC-29 Antonovsky’ego, LOT-R (Scheier, Carver, Bridges) i GSES Schwarzera.",
"id": "kliniczna/wyklad-4-fiszki:1ef6ead5",
"unit": "wyklad-4.html",
"sec": "s25"
},
{
"src": "Slajdy W4 (Mościcka-Teske)",
"q": "Jakie trzy wymiary mierzy Wielowymiarowa Skala Umiejscowienia Kontroli Zdrowia?",
"a": "Kontrolę wewnętrzną, wpływ innych i przypadek (Wallston; polska adaptacja Juczyński).",
"id": "kliniczna/wyklad-4-fiszki:aab6e3d4",
"unit": "wyklad-4.html",
"sec": "s25"
}
]
