{
"q": "Czym różni się model nominalny od modelu realnego?",
"a": "<p>Model nominalny to teoretyczny sposób rozumienia zjawiska, niekoniecznie zweryfikowany empirycznie; model realny został sprawdzony (w całości lub części) w badaniach empirycznych — przykładem jest model salutogenezy Antonovsky'ego.<\/p>",
"src": "Podstawy teoretyczne i patogeneza/salutogeneza",
"id": "kliniczna/fiszki:5180c328",
"unit": "wyklad-1.html",
"sec": "podstawy"
},
{
"q": "Jakie cztery kategorie czynników patogennych wyodrębnia się w psychopatologii?",
"a": "<p>Psychogenne, egzogenne, somatogenne, endogenne (Sęk, 2008b).<\/p>",
"src": "Podstawy teoretyczne i patogeneza/salutogeneza",
"id": "kliniczna/fiszki:67586125",
"unit": "wyklad-1.html",
"sec": null
},
{
"q": "Jakie pytanie postawił Aaron Antonovsky, które dało początek modelowi salutogenezy?",
"a": "<p>„Dlaczego ludzie, mimo oddziaływania wielu stresorów (patogenów), zachowują zdrowie lub w razie choroby szybko do niego powracają?” — sformułowane po zaobserwowaniu, że 29% kobiet, które przeżyły ekstremalny stres (np. obóz koncentracyjny), zachowało dobry stan zdrowia.<\/p>",
"src": "Podstawy teoretyczne i patogeneza/salutogeneza",
"id": "kliniczna/fiszki:514622f8",
"unit": "wyklad-1.html",
"sec": null
},
{
"q": "Z jakich trzech komponentów składa się poczucie koherencji (SOC)?",
"a": "<p>Poczucie zrozumiałości (komponent poznawczy), poczucie zaradności/sterowalności (komponent instrumentalny) i poczucie sensowności (komponent motywacyjno-emocjonalny — uznawany za najważniejszy).<\/p>",
"src": "Podstawy teoretyczne i patogeneza/salutogeneza",
"id": "kliniczna/fiszki:1860e234",
"unit": "wyklad-1.html",
"sec": null
},
{
"q": "Na czym polega komplementarność podejścia patogenetycznego i salutogenetycznego?",
"a": "<p>Oba podejścia nie są konkurencyjne — patogeneza wyjaśnia przyczyny choroby (patogeny, stresory, podatność), salutogeneza wyjaśnia utrzymanie i odzyskiwanie zdrowia (zasoby, SOC). Łączne stosowanie obu perspektyw daje pełniejszy obraz zdrowia i choroby jako interakcji czynników ryzyka i zasobów.<\/p>",
"src": "Podstawy teoretyczne i patogeneza/salutogeneza",
"id": "kliniczna/fiszki:ddcdfd1e",
"unit": "wyklad-1.html",
"sec": null
},
{
"q": "Jak WHO zdefiniowała zdrowie w 1946 r.?",
"a": "<p>Jako pełny dobrostan fizyczny (well-being), psychiczny i społeczny, a nie tylko brak choroby lub niepełnosprawności.<\/p>",
"src": "Pojęcie zdrowia",
"id": "kliniczna/fiszki:50fd285f",
"unit": "wyklad-1.html",
"sec": null
},
{
"q": "Jaki jest związek między zdrowiem duchowym a zdrowiem somatycznym?",
"a": "<p>Duchowość jako dyspozycja może rozwijać się w ciągu całego życia, także w podeszłym wieku; poważna choroba somatyczna (zwłaszcza zagrażająca życiu) i związane z nią doświadczenia mogą przyspieszać rozwój duchowy (potraumatyczny wzrost).<\/p>",
"src": "Pojęcie zdrowia",
"id": "kliniczna/fiszki:a8c63171",
"unit": "wyklad-1.html",
"sec": null
},
{
"q": "Jaka jest relacja między pojęciem zdrowia a pojęciem szczęścia wg Władysława Tatarkiewicza?",
"a": "<p>Zdrowie i szczęście nie są tożsame, ale są bardzo podobne w formalnej strukturze — oba wielowymiarowe, oba pojmowane jako stan przejściowy lub stały układ czynności. Zdrowie to jedno z dóbr człowieka, ale nie jedyne.<\/p>",
"src": "Pojęcie zdrowia",
"id": "kliniczna/fiszki:c2b3ef93",
"unit": "wyklad-1.html",
"sec": "pojecie-zdrowia"
},
{
"q": "Jaka jest relacja między pojęciem zdrowia a pojęciem jakości życia?",
"a": "<p>Jakość życia ma szerszy zakres pojęciowy niż zdrowie — obejmuje warunki ekonomiczne, społeczne i medyczne. Zdrowie jest jednym z wyznaczników (obiektywnych i subiektywnych) jakości życia, a nie pojęciem tożsamym.<\/p>",
"src": "Pojęcie zdrowia",
"id": "kliniczna/fiszki:adf82a44",
"unit": "wyklad-1.html",
"sec": null
},
{
"q": "Na czym polega dualistyczne podejście do ciała i psychiki w modelu biomedycznym?",
"a": "<p>Wywodzi się z założenia kartezjańskiego — ciało i psychika są odrębnymi bytami; ciało traktowane jest jak maszyna, a zdrowie i choroba są kategoriami rozłącznymi.<\/p>",
"src": "Modele zdrowia",
"id": "kliniczna/fiszki:d83b41dc",
"unit": "wyklad-1.html",
"sec": null
},
{
"q": "Dlaczego model biomedyczny okazał się niewystarczający do zrozumienia zdrowia i choroby?",
"a": "<p>Jest redukcjonistyczny — koncentruje się wyłącznie na czynnikach biologicznych, pomija rolę psychiki, kontekstu społecznego i aktywności własnej pacjenta; dowody kliniczne pokazały, że objawy cielesne mogą wynikać z nierozwiązanych konfliktów psychologicznych.<\/p>",
"src": "Modele zdrowia",
"id": "kliniczna/fiszki:08a92b7a",
"unit": "wyklad-1.html",
"sec": null
},
{
"q": "Jakie są główne założenia modelu biopsychospołecznego G. Engla?",
"a": "<p>Zdrowie i choroba to system interakcji czynników biologicznych, psychologicznych i społecznych; przyjmuje stanowisko holistyczne — ciało i psychika stanowią integralną całość; pełne zrozumienie choroby wymaga uwzględnienia kontekstu życia pacjenta.<\/p>",
"src": "Modele zdrowia",
"id": "kliniczna/fiszki:4b61f72a",
"unit": "wyklad-1.html",
"sec": null
},
{
"q": "Co nowego wprowadził model socjoekologiczny w porównaniu z wcześniejszymi modelami?",
"a": "<p>Wprowadził bardziej złożony, hierarchiczny układ systemów („pola zdrowia” wg Lalonde'a) oraz metaforę mandali — z człowiekiem w centrum, otoczonym coraz szerszymi kręgami wpływu (styl życia, środowisko, kultura, biosfera), z rodziną jako ogniwem pośredniczącym.<\/p>",
"src": "Modele zdrowia",
"id": "kliniczna/fiszki:9f4272c8",
"unit": "wyklad-1.html",
"sec": null
},
{
"q": "Na czym polega zdrowie psychiczne w modelu dobrostanu psychicznego Ryff?",
"a": "<p>To sześć komponentów: samoakceptacja, pozytywne relacje z ludźmi, autonomia, radzenie sobie z otoczeniem, cel życiowy, osobisty rozwój — wywodzących się z filozoficznej tradycji eudajmonii Arystotelesa i klasycznych koncepcji osobowości (Allport, Jung, Jahoda, Frankl, Maslow, Erikson, Rogers).<\/p>",
"src": "Modele zdrowia",
"id": "kliniczna/fiszki:7e76301c",
"unit": "wyklad-1.html",
"sec": "modele-zdrowia"
},
{
"q": "Ile procent współprzyczyn chorób chronicznych i zgonów przypisuje się czynnikom psychologicznym?",
"a": "<p>Ok. 50% (Sęk, Heszen, 2020).<\/p>",
"src": "Treści z wykładu",
"id": "kliniczna/fiszki:84b98625",
"unit": "wyklad-1.html",
"sec": null
},
{
"q": "Wymień sześć tez modelu biomedycznego (BMM).",
"a": "<p>1) Choroby mają źródło w nieprawidłowościach struktur ciała. 2) Choroba powoduje symptomy, niezwiązane z czynnikami zewnętrznymi. 3) Zdrowie = brak choroby. 4) Zjawiska psychiczne nie są związane z funkcjami ciała. 5) Pacjent jest „ofiarą nieszczęśliwego trafu”. 6) Pacjent ma być w pełni gotowy do wypełniania zaleceń profesjonalistów.<\/p>",
"src": "Treści z wykładu",
"id": "kliniczna/fiszki:ae493b3a",
"unit": "wyklad-1.html",
"sec": "modele-zdrowia"
},
{
"q": "Na czym opiera się model biopsychospołeczny pod względem metodologicznym?",
"a": "<p>Na ogólnej teorii systemów Bertalanffy'ego (1968) — zjawiska naturalne tworzą hierarchię systemów, z których każdy jest jednocześnie częścią systemu większego i zbiorem systemów podrzędnych (od cząsteczki po biosferę), a osoba/pacjent zajmuje w tej hierarchii centralne miejsce.<\/p>",
"src": "Treści z wykładu",
"id": "kliniczna/fiszki:5431f56a",
"unit": "wyklad-1.html",
"sec": "modele-zdrowia"
},
{
"q": "Czym różni się rozumienie „patologii” od „choroby” w ujęciu BPSM?",
"a": "<p>Patologia („proces chorobowy”) wymaga diagnozy biomedycznej i dotyczy narządu lub układu. Choroba dotyka całego człowieka, jego najbliższe otoczenie i grupę społeczną.<\/p>",
"src": "Treści z wykładu",
"id": "kliniczna/fiszki:121c7d8b",
"unit": "wyklad-1.html",
"sec": null
},
{
"q": "Jakie są trzy cechy modelu konsumeryckiego w opiece zdrowotnej?",
"a": "<p>Pacjent jako klient odpowiedzialny za własne zdrowie; podkreślenie znaczenia jego wyborów; opieka zdrowotna traktowana jak usługa rynkowa, z naciskiem na satysfakcję klienta.<\/p>",
"src": "Treści z wykładu",
"id": "kliniczna/fiszki:3027dfa4",
"unit": "wyklad-1.html",
"sec": null
},
{
"q": "Jaki jest paradoks w tym, jak podejście patogenetyczne i salutogenetyczne definiują „normalny stan organizmu”?",
"a": "<p>Podejście patogenetyczne zakłada, że normalnym stanem jest homeostaza (zakłócana przez stresory), natomiast podejście salutogenetyczne zakłada, że normalnym stanem organizmu jest nieporządek/zakłócenie homeostazy, a zdrowie to nieustanny, dynamiczny proces radzenia sobie z tym stanem.<\/p>",
"src": "Treści z wykładu",
"id": "kliniczna/fiszki:95e9b623",
"unit": "wyklad-1.html",
"sec": null
},
{
"q": "Jakie trzy elementy mają kluczowe znaczenie w procesie osiągania zdrowia wg Antonovsky'ego?",
"a": "<p>Rodzaje i poziom stresów, uogólnione zasoby odpornościowe oraz poczucie koherencji.<\/p>",
"src": "Treści z wykładu",
"id": "kliniczna/fiszki:70e84311",
"unit": "wyklad-1.html",
"sec": null
},
{
"q": "Wymień trzy cele strategii WHO „Health for all”.",
"a": "<p>Dodanie lat do życia, dodanie zdrowia do życia (wellbeing), dodanie życia do lat (sens życia, productive life).<\/p>",
"src": "Treści z wykładu",
"id": "kliniczna/fiszki:6300a409",
"unit": "wyklad-2.html",
"sec": "pojecia"
},
{
"q": "Jaki wymiar zdrowia dodaje wykład do klasycznych czterech dziedzin (fizyczne, psychiczne, społeczne, duchowe)?",
"a": "<p>Zdrowie seksualne — zespół biologicznych, emocjonalnych, intelektualnych i społecznych aspektów życia seksualnego (WHO, 2001). Wykład dzieli też zdrowie psychiczne na składową umysłową i emocjonalną.<\/p>",
"src": "Treści z wykładu",
"id": "kliniczna/fiszki:d83c2fc0",
"unit": "wyklad-1.html",
"sec": null
},
{
"q": "Wymień pięć obszarów zainteresowań psychologii zdrowia wg wykładu.",
"a": "<p>Promowanie zdrowego stylu życia; metody leczenia chorób i zapobieganie chorobom; badania nad czynnikami ryzyka i czynnikami chroniącymi; analiza systemów opieki zdrowotnej; formułowanie polityki zdrowotnej.<\/p>",
"src": "Zastosowania, prewencja i relacja pacjent–system (treści z wykładu)",
"id": "kliniczna/fiszki:171d1f90",
"unit": "wyklad-2.html",
"sec": "zakres-zastosowan"
},
{
"q": "Czym różnią się dwie definicje stylu życia przytoczone na wykładzie?",
"a": "<p>Pierwsza (Sęk, Heszen, 2020) akcentuje wymiar społeczno-strukturalny — styl życia jako odzwierciedlenie przynależności do warstwy społecznej i wzorów kulturowych. Druga (Sęk, 2000) akcentuje wymiar indywidualno-psychologiczny — system zachowań zdrowotnych uwarunkowany temperamentem, wiedzą, przekonaniami, kompetencjami i wartościami jednostki.<\/p>",
"src": "Zastosowania, prewencja i relacja pacjent–system (treści z wykładu)",
"id": "kliniczna/fiszki:97f7b30f",
"unit": "wyklad-2.html",
"sec": "styl-zycia"
},
{
"q": "Jakie są dwa rodzaje zachowań zdrowotnych?",
"a": "<p>Nawykowe, stabilne wzory zachowań (np. higiena, nawyki żywieniowe) oraz celowe czynności zdrowotne (np. przygotowanie do ciąży, podejmowanie leczenia).<\/p>",
"src": "Zastosowania, prewencja i relacja pacjent–system (treści z wykładu)",
"id": "kliniczna/fiszki:26578156",
"unit": "wyklad-2.html",
"sec": "zachowania-zdrowotne"
},
{
"q": "O ile lat dłużej żyją osoby stosujące pięć zdrowych nawyków, wg badań Harvardu?",
"a": "<p>Średnio 14 lat dłużej (Li i in., 2018).<\/p>",
"src": "Zastosowania, prewencja i relacja pacjent–system (treści z wykładu)",
"id": "kliniczna/fiszki:c8808cef",
"unit": "wyklad-2.html",
"sec": "zachowania-zdrowotne"
},
{
"q": "Jakie dwie klasyfikacje prewencji omówiono na wykładzie?",
"a": "<p>Klasyfikacja wg poziomów (WHO: pierwszorzędowa, drugorzędowa, trzeciorzędowa) oraz wg odbiorców (uniwersalna, selektywna, wskazująca).<\/p>",
"src": "Zastosowania, prewencja i relacja pacjent–system (treści z wykładu)",
"id": "kliniczna/fiszki:eba74334",
"unit": "wyklad-2.html",
"sec": "prewencja"
},
{
"q": "Jakie wyzwania stoją przed pacjentem w okresie hospitalizacji?",
"a": "<p>Problemy domowe, lęk przed poważną chorobą/obawa związana z operacją, nieznane otoczenie, utrata godności, utrata kontroli, brak wsparcia.<\/p>",
"src": "Zastosowania, prewencja i relacja pacjent–system (treści z wykładu)",
"id": "kliniczna/fiszki:ed24160d",
"unit": "wyklad-2.html",
"sec": "relacja"
},
{
"q": "Czym różni się oddziaływanie instrumentalne od ekspresywnego w relacji terapeutycznej?",
"a": "<p>Oddziaływanie instrumentalne to czynności ściśle związane z leczeniem; oddziaływanie ekspresywne to czynności zaspokajające potrzeby psychologiczne pacjenta.<\/p>",
"src": "Zastosowania, prewencja i relacja pacjent–system (treści z wykładu)",
"id": "kliniczna/fiszki:d5eca8a8",
"unit": "wyklad-2.html",
"sec": "relacja"
},
{
"q": "Co wynika z badania Browna i in. (2009) nad lekarzami przekazującymi trudne informacje?",
"a": "<p>Wyższy fizjologiczny poziom stresu występował u lekarzy z mniejszym doświadczeniem zawodowym i wyższym poziomem zmęczenia; słabsza efektywność komunikacji wiązała się z wyższym wypaleniem zawodowym i zmęczeniem.<\/p>",
"src": "Zastosowania, prewencja i relacja pacjent–system (treści z wykładu)",

"unit": "wyklad-2.html",
"sec": "relacja"
},
{
"q": "Z jakich trzech poziomów składa się reakcja na stres?",
"a": "<p>Poziom fizjologiczny, poziom psychologiczny (emocje i procesy poznawcze) oraz poziom zachowania.<\/p>",
"src": "Zastosowania, prewencja i relacja pacjent–system (treści z wykładu)",
"id": "kliniczna/fiszki:5192a541",
"unit": "wyklad-2.html",
"sec": null
},
{
"q": "Czym różni się ocena pierwotna od oceny wtórnej w modelu Lazarusa i Folkman?",
"a": "<p>Ocena pierwotna to rozpoznanie znaczenia sytuacji (krzywda/strata, zagrożenie, wyzwanie); ocena wtórna to ocena własnych możliwości działania i potencjalnego efektu dla źródła stresu. Oba procesy są ze sobą sprzężone.<\/p>",
"src": "Zastosowania, prewencja i relacja pacjent–system (treści z wykładu)",
"id": "kliniczna/fiszki:dc1141eb",
"unit": "wyklad-2.html",
"sec": "stres-wstep"
},
{
"q": "Jakie trzy sposoby definiowania zachowań zdrowotnych wyróżnia się w literaturze?",
"a": "<p>Definicję skutkową/funkcjonalną (funkcja zachowania względem zdrowia), definicję celowościową (czynności celowo ukierunkowane na zdrowie) oraz definicję celowościowo-funkcjonalną, łączącą oba podejścia (Puchalski, 1990).<\/p>",
"src": "Treści z literatury (Heszen, Sęk, 2007)",
"id": "kliniczna/fiszki:0fe5536a",
"unit": "wyklad-2.html",
"sec": null
},
{
"q": "Co wykazały badania Alameda Study (1965–1983) i dlaczego nazywa się je „drugą rewolucją zdrowotną”?",
"a": "<p>Wykazały, że niepalenie, umiarkowane picie alkoholu, utrzymywanie właściwej masy ciała, aktywność ruchowa i 7–8 godzin snu pozytywnie korelują ze stanem zdrowia aktualnym i przewidywanym. Nazwę „druga rewolucja zdrowotna” nadał temu etapowi Gniazdowski (1990), bo przesunął on uwagę badaczy z czynników biomedycznych na behawioralne.<\/p>",
"src": "Treści z literatury (Heszen, Sęk, 2007)",
"id": "kliniczna/fiszki:266d78d4",
"unit": "wyklad-2.html",
"sec": "zachowania-zdrowotne"
},
{
"q": "Jaka jest różnica między behawioralno-epidemiologicznym a socjologicznym ujęciem stylu życia?",
"a": "<p>Ujęcie behawioralno-epidemiologiczne traktuje styl życia czysto behawioralnie — jako zespół zachowań ustalany na podstawie obiektywnych badań prospektywnych (np. raport Lalonde'a). Ujęcie socjologiczne traktuje styl życia jako znacznie bardziej złożony — odzwierciedlenie przynależności do warstwy społecznej i wzorów kulturowych, z coraz większym naciskiem na indywidualne wybory.<\/p>",
"src": "Treści z literatury (Heszen, Sęk, 2007)",
"id": "kliniczna/fiszki:bfce8315",
"unit": "wyklad-2.html",
"sec": "styl-zycia"
},
{
"q": "Jakie trzy czynniki wyłoniła analiza czynnikowa kwestionariusza zachowań zdrowotnych Beckera (1992)?",
"a": "<p>Zachowania prewencyjne (dostosowane do norm i oczekiwań), zdrową dietę i ruch, oraz relaks/odpoczynek/higienę psychiczną.<\/p>",
"src": "Treści z literatury (Heszen, Sęk, 2007)",
"id": "kliniczna/fiszki:417c57b3",
"unit": "wyklad-2.html",
"sec": null
},
{
"q": "Na czym polegał ogólny zespół adaptacyjny (GAS) opisany przez Hansa Selyego i jakie ma trzy stadia?",
"a": "<p>To niespecyficzna reakcja organizmu na działanie stresorów, obejmująca: stadium reakcji alarmowej (mobilizacja sił obronnych), stadium odporności (pełne przystosowanie) i stadium wyczerpania (gdy stresor działa odpowiednio długo i intensywnie).<\/p>",
"src": "Treści z literatury (Heszen, Sęk, 2007)",
"id": "kliniczna/fiszki:8cab74c3",
"unit": "wyklad-2.html",
"sec": "stres-wstep"
},
{
"q": "Jakie emocje towarzyszą ocenie pierwotnej typu „wyzwanie” w modelu Lazarusa i Folkman, i czym różnią się od emocji przy „zagrożeniu”?",
"a": "<p>Przy wyzwaniu obraz emocjonalny jest najbardziej złożony — obejmuje zarówno emocje negatywne (podobne jak przy zagrożeniu: lęk, obawa), jak i pozytywne: nadzieję, zapał, podniecenie. Przy samym zagrożeniu dominują wyłącznie emocje negatywne: strach, lęk, martwienie się.<\/p>",
"src": "Treści z literatury (Heszen, Sęk, 2007)",
"id": "kliniczna/fiszki:3a37ddf1",
"unit": "wyklad-2.html",
"sec": "stres-wstep"
},
{
"q": "Kto jest autorem pierwszej definicji psychologii zdrowia i co ona obejmuje?",
"a": "<p><strong>Joseph Matarazzo<\/strong> (1980): oświatowy, naukowy i profesjonalny wkład psychologii do promocji i utrzymywania zdrowia, zapobiegania chorobom i ich leczenia, rozpoznawania etiologicznych i diagnostycznych korelatów zdrowia i choroby; w 1982 r. dodał analizę i ulepszanie systemu opieki zdrowotnej oraz kształtowanie polityki zdrowotnej.<\/p>",
"src": "Zastosowania · Heszen-Celińska, Sęk (2020), r. 2",
"id": "kliniczna/fiszki:74b5a1a8",
"unit": "wyklad-2.html",
"sec": "dziedzina-stosowana"
},
{
"q": "Co odróżnia psychologię zdrowia od medycyny psychosomatycznej, behawioralnej i psychologii medycznej?",
"a": "<p>W centrum jest <strong>zdrowie<\/strong>, nie choroba, a zakres wykracza poza medycynę na wszystkie dziedziny życia i systemy społeczne (rodzina, szkoła, praca). Wcześniejsze kierunki skupiały się na zdrowiu fizycznym i chorobie somatycznej.<\/p>",
"src": "Zastosowania · Heszen-Celińska, Sęk (2020), r. 2",
"id": "kliniczna/fiszki:c74e3509",
"unit": "wyklad-2.html",
"sec": "dziedzina-stosowana"
},
{
"q": "Dlaczego laboratoryjne badania podstawowe słabo nadają się do zastosowań w zdrowiu i chorobie?",
"a": "<p>Nie da się odtworzyć ważnych zdarzeń życiowych; ograniczenia etyczne (zwłaszcza u chorych); czynnik czasu (skutki zdrowotne pojawiają się późno); czynnik kontroli: eliminacja zmiennych zakłócających obniża <strong>trafność zewnętrzną (ekologiczną)<\/strong>.<\/p>",
"src": "Zastosowania · Heszen-Celińska, Sęk (2020), r. 2",
"id": "kliniczna/fiszki:b4d5421c",
"unit": "wyklad-2.html",
"sec": "dziedzina-stosowana"
},
{
"q": "Jaki jest obszar zainteresowania klinicznej psychologii zdrowia?",
"a": "<p>Psychologiczne aspekty chorób; centrum działań to <strong>człowiek chory<\/strong>. Dwa nurty: <strong>psychosomatyczny<\/strong> (rola czynników psychicznych w chorobie) i <strong>somatopsychiczny<\/strong> (psychologiczne następstwa choroby).<\/p>",
"src": "Zastosowania · Heszen-Celińska, Sęk (2020), r. 2",
"id": "kliniczna/fiszki:e9c4ace9",
"unit": "wyklad-2.html",
"sec": "dziedzina-stosowana"
},
{
"q": "Jaki jest obszar zainteresowania pozytywnej psychologii zdrowia?",
"a": "<p>Psychologiczne uwarunkowania i korelaty zdrowia oraz oddziaływania na <strong>ludzi zdrowych<\/strong>; obiecujące jest podejście <strong>salutogenetyczne<\/strong>. Jej główne zadanie praktyczne to <strong>promocja zdrowia<\/strong>.<\/p>",
"src": "Zastosowania · Heszen-Celińska, Sęk (2020), r. 2",
"id": "kliniczna/fiszki:ea8d3c23",
"unit": "wyklad-2.html",
"sec": null
},
{
"q": "Czym różni się podejście psychologa i lekarza do pacjenta według Heszen-Celińskiej i Sęk?",
"a": "<p>Psycholog traktuje człowieka jako <strong>podmiot<\/strong> z prawem do decyzji i odpowiedzialnością za ich skutki; lekarze oczekują raczej <strong>podporządkowania<\/strong>, a odpowiedzialność deleguje się na lekarza.<\/p>",
"src": "Zastosowania · Heszen-Celińska, Sęk (2020), r. 2",
"id": "kliniczna/fiszki:b84aa6b8",
"unit": "wyklad-2.html",
"sec": null
},
{
"q": "Jakie okoliczności zadecydowały o uznaniu psychologii zdrowia za odrębną dziedzinę?",
"a": "<p>Sekcja Psychologii Zdrowia APA (1978), czasopismo <em>Health Psychology<\/em> (1982), sekcja w IAAP (1984), EHPS i <em>Psychology and Health<\/em> (1986), programy akademickie i jednostki na uczelniach.<\/p>",
"src": "Zastosowania · Heszen-Celińska, Sęk (2020), r. 2",
"id": "kliniczna/fiszki:f29d016c",
"unit": "wyklad-2.html",
"sec": "dziedzina-stosowana"
},
{
"q": "Czy psychologia zdrowia to dział psychologii stosowanej, czy odrębna dziedzina? Jakie są stanowiska?",
"a": "<p>Matarazzo (1987): obszar zastosowań podstawowej dyscypliny. Taylor (1990): odrębna dziedzina nauki, bo włącza wiedzę interdyscyplinarną. Autorki podręcznika: spełnia kryteria <strong>odrębnej dziedziny stosowanej<\/strong>.<\/p>",
"src": "Zastosowania · Heszen-Celińska, Sęk (2020), r. 2",
"id": "kliniczna/fiszki:05013c1f",
"unit": "wyklad-2.html",
"sec": "dziedzina-stosowana"
},
{
"q": "Jakie trzy typy diagnozy klinicznej wyróżniają Cierpiałkowska, Soroko i Sęk?",
"a": "<p><strong>Różnicową<\/strong> (opisową, nozologiczną), <strong>strukturalno-funkcjonalną<\/strong> i <strong>genetyczną<\/strong> (statyczną i rozwojową). Pierwsza ma charakter opisowy, dwie pozostałe wyjaśniający.<\/p>",
"src": "Zastosowania · Cierpiałkowska, Sęk (2016), r. 10",
"id": "kliniczna/fiszki:626eb2ed",
"unit": "wyklad-2.html",
"sec": "diagnoza-kliniczna"
},
{
"q": "Jakie są cztery funkcje diagnozowania?",
"a": "<p><strong>Opisująca i oceniająca<\/strong> (jaka jest rzeczywistość), <strong>eksplanacyjna<\/strong> (dlaczego taka jest), <strong>predykcyjna<\/strong> (jaka będzie), <strong>korekcyjna/terapeutyczna<\/strong> (co zrobić, by osiągnąć pożądany stan).<\/p>",
"src": "Zastosowania · Cierpiałkowska, Sęk (2016), r. 10",
"id": "kliniczna/fiszki:bbf94844",
"unit": "wyklad-2.html",
"sec": "diagnoza-kliniczna"
},
{
"q": "Czym jest kontrakt diagnostyczny?",
"a": "<p>Umową między psychologiem a osobą lub grupą, która zgadza się wykonać zadania będące podstawą oceny jej funkcjonowania; poprzedza działania diagnostyczne.<\/p>",
"src": "Zastosowania · Cierpiałkowska, Sęk (2016), r. 10",
"id": "kliniczna/fiszki:733bbadc",
"unit": "wyklad-2.html",
"sec": null
},
{
"q": "Na czym polega diagnoza różnicowa (nozologiczna)?",
"a": "<p>Na rozpoznaniu symptomów (znaczących klinicznie doświadczeń i zachowań) i odniesieniu ich do jednostek z ICD-10 lub DSM-5; o hipotezie decyduje stopień podobieństwa objawów, ich liczba i czas trwania.<\/p>",
"src": "Zastosowania · Cierpiałkowska, Sęk (2016), r. 10",
"id": "kliniczna/fiszki:9954a5f8",
"unit": "wyklad-2.html",
"sec": "diagnoza-kliniczna"
},
{
"q": "Czym jest podwójna diagnoza?",
"a": "<p>Rozpoznaniem więcej niż jednego zaburzenia u osoby, np. osobowości zależnej i lęku uogólnionego u pani Marty. Współwystępowanie zaburzeń osi I z zaburzeniami osobowości wymaga leczenia skojarzonego.<\/p>",
"src": "Zastosowania · Cierpiałkowska, Sęk (2016), r. 10",
"id": "kliniczna/fiszki:3ae413a4",
"unit": "wyklad-2.html",
"sec": "diagnoza-kliniczna"
},
{
"q": "Czego dotyczy diagnoza strukturalno-funkcjonalna?",
"a": "<p>Wyjaśnienia, jaki <strong>patomechanizm<\/strong> leży u podłoża symptomów, jakie czynniki go aktywują oraz jakie <strong>mechanizmy salutogenetyczne<\/strong> są obecne; odwołuje się do konkretnej koncepcji psychologicznej.<\/p>",
"src": "Zastosowania · Cierpiałkowska, Sęk (2016), r. 10",
"id": "kliniczna/fiszki:00876685",
"unit": "wyklad-2.html",
"sec": null
},
{
"q": "Jakie aspekty osobowości ocenia psychodynamiczna diagnoza strukturalno-funkcjonalna?",
"a": "<p>Poczucie tożsamości, mechanizmy obronne, testowanie rzeczywistości, relacje z obiektem, funkcjonowanie moralne; na tej podstawie ocenia się poziom organizacji osobowości: psychotyczny, borderline lub neurotyczny.<\/p>",
"src": "Zastosowania · Cierpiałkowska, Sęk (2016), r. 10",
"id": "kliniczna/fiszki:a3f988a8",
"unit": "wyklad-2.html",
"sec": "diagnoza-kliniczna"
},
{
"q": "Jakie elementy obejmuje poznawczo-behawioralna konceptualizacja przypadku?",
"a": "<p>Przekonania kluczowe (schematy), przekonania pośredniczące (założenia, postawy, zasady), myśli automatyczne, sytuacje aktywujące i zniekształcenia poznawcze podtrzymujące schemat.<\/p>",
"src": "Zastosowania · Cierpiałkowska, Sęk (2016), r. 10",
"id": "kliniczna/fiszki:08b03820",
"unit": "wyklad-2.html",
"sec": null
},
{
"q": "Dlaczego Rogers krytykował formułowanie diagnozy i kiedy dopuszcza się ją w podejściu skoncentrowanym na osobie?",
"a": "<p>Bo stwarza <strong>nierównowagę władzy<\/strong> i niezdrową zależność od terapeuty-eksperta. Dopuszcza się ją, gdy klient sobie tego życzy, gdy wymaga tego instytucja lub gdy potrzebne są obiektywne pomiary; ma być wspólną aktywnością terapeuty i klienta.<\/p>",
"src": "Zastosowania · Cierpiałkowska, Sęk (2016), r. 10",
"id": "kliniczna/fiszki:3035d5a5",
"unit": "wyklad-2.html",
"sec": "diagnoza-kliniczna"
},
{
"q": "Czym różni się diagnoza epigenetyczna aktualnej struktury od rozwojowej?",
"a": "<p><strong>Aktualna<\/strong>: udział czynników konstytucyjnych, sytuacyjnych i psychicznych w chwili zgłoszenia. <strong>Rozwojowa<\/strong>: udział tych czynników w zaburzeniu na kolejnych etapach życia.<\/p>",
"src": "Zastosowania · Cierpiałkowska, Sęk (2016), r. 10",
"id": "kliniczna/fiszki:34b691e1",
"unit": "wyklad-2.html",
"sec": "diagnoza-kliniczna"
},
{
"q": "Jakie założenia przyjmuje model wielościeżkowy (Sue, Sue i Sue)?",
"a": "<p>Żadna perspektywa nie wystarcza; istnieją różne drogi do zaburzeń; czynniki przyczyniają się w różnym stopniu; wiedza opiera się na badaniach; czynniki są w ciągłej interakcji, więc te same mogą prowadzić do różnych zaburzeń, a różne do podobnych.<\/p>",
"src": "Zastosowania · Cierpiałkowska, Sęk (2016), r. 10",
"id": "kliniczna/fiszki:958d51a1",
"unit": "wyklad-2.html",
"sec": "diagnoza-kliniczna"
},
{
"q": "Czym jest diagnoza prospektywna w psychoterapii?",
"a": "<p>Diagnozowaniem w trakcie terapii tego, jakie procedury i strategie zastosować; obok niej diagnozuje się mechanizm zmiany (jak działają) i jej skutki (diagnoza strukturalno-funkcjonalna).<\/p>",
"src": "Zastosowania · Cierpiałkowska, Sęk (2016), r. 10",
"id": "kliniczna/fiszki:2acb6721",
"unit": "wyklad-2.html",
"sec": null
}
