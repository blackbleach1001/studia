"src": "Heszen i Sęk (2007), r. 17",
"q": "Dlaczego w psychologii zdrowia mówi się o „interwencji psychologicznej”, a nie tylko o terapii?",
"a": "Bo adresatami są nie tylko chorzy, ale też osoby zdrowe, zagrożone i zdrowiejące, a także grupy, społeczności i środowiska. Część pomocy jest pośrednia, np. celowe zmiany w środowisku (sala porodów rodzinnych, recepcja, portal edukacyjny).",
"id": "kliniczna/wyklad-5-fiszki:f725a218",
"unit": "wyklad-5.html",
"sec": "s1"
},
{
"src": "Heszen i Sęk (2007), r. 17",
"q": "Na czym opiera się relacja pomocna i co jest podstawowym wyznacznikiem zachowań pomocnych psychologa?",
"a": "Relacja pomocna opiera się na zaufaniu interpersonalnym i umożliwia trafne profesjonalne wsparcie. Podstawowym wyznacznikiem są uwewnętrznione normy powinnościowe (standardy etyki zawodowej) połączone z kompetencjami komunikacyjnymi i empatią.",
"id": "kliniczna/wyklad-5-fiszki:4d059893",
"unit": "wyklad-5.html",
"sec": "s1"
},
{
"src": "Heszen i Sęk (2007), r. 17",
"q": "Jak Karta Ottawska (1986) definiuje promocję zdrowia?",
"a": "Jako proces umożliwiający każdemu człowiekowi zwiększenie oddziaływania na własne zdrowie w sensie jego poprawy i utrzymywania. Akcentuje podmiotowy, socjoekologiczny aspekt zdrowia; Karta jest uznawana za „konstytucję promocji zdrowia”.",
"id": "kliniczna/wyklad-5-fiszki:db11ab19",
"unit": "wyklad-5.html",
"sec": "s2"
},
{
"src": "Heszen i Sęk (2007), r. 17",
"q": "Wymień pięć obszarów zadaniowych promocji zdrowia z Karty Ottawskiej.",
"a": "1) prozdrowotna polityka państwa; 2) środowiska sprzyjające zdrowiu; 3) wzmacnianie działań społeczeństwa na rzecz zdrowia; 4) rozwijanie indywidualnych umiejętności; 5) reorientacja służby zdrowia.",
"id": "kliniczna/wyklad-5-fiszki:7500b640",
"unit": "wyklad-5.html",
"sec": "s2"
},
{
"src": "Heszen i Sęk (2007), r. 17",
"q": "Jak rozumie się zdrowie w promocji zdrowia i do kogo jest ona kierowana?",
"a": "Zdrowie to pozytywnie pojmowany zasób, pozwalający realizować aspiracje, zaspokajać potrzeby i kontrolować środowisko; człowiek musi aktywnie uczestniczyć. Promocja jest kierowana do całej populacji w kontekście codziennego życia i powinna przenikać wszystkie sektory życia społecznego.",
"id": "kliniczna/wyklad-5-fiszki:11d3a0f2",
"unit": "wyklad-5.html",
"sec": "s2"
},
{
"src": "Heszen i Sęk (2007), r. 17",
"q": "Jakie dwa główne zadania wyznacza deklaracja WHO „Zdrowie 21”?",
"a": "Promocję i ochronę zdrowia ludzi w ciągu całego życia oraz zmniejszenie występowania chorób i urazów i złagodzenie cierpień z ich powodu.",
"id": "kliniczna/wyklad-5-fiszki:d533ec54",
"unit": "wyklad-5.html",
"sec": "s2"
},
{
"src": "Heszen i Sęk (2007), r. 17",
"q": "Jakie trzy psychologiczne cele promocji zdrowia wymieniają Heszen i Sęk?",
"a": "1) zwiększanie świadomości zdrowia (jednostkowej i społecznej) i znaczenia zachowań zdrowotnych; 2) umożliwienie kontroli nad procesami zdrowia; 3) rozwój i wzmacnianie zasobów zdrowotnych w jednostce i środowisku.",
"id": "kliniczna/wyklad-5-fiszki:70067453",
"unit": "wyklad-5.html",
"sec": "s3"
},
{
"src": "Heszen i Sęk (2007), r. 17",
"q": "Na czym polega dylemat etyczny promocji zdrowia i jak go rozwiązuje Heszen-Niejodek?",
"a": "Techniki wpływu społecznego (modelowanie, indoktrynacja, przymus) pomijają świadomą aktywność człowieka i niszczą ideę autonomii i partycypacji. Heszen-Niejodek: promocja powinna przedstawić ofertę i zostawić adresatowi decyzję oraz odpowiedzialność za jej skutki zdrowotne.",
"id": "kliniczna/wyklad-5-fiszki:2990787c",
"unit": "wyklad-5.html",
"sec": "s3"
},
{
"src": "Heszen i Sęk (2007), r. 17",
"q": "Kiedy w promocji zdrowia wolno stosować perswazję i modelowanie, a kiedy ich udział powinien być najmniejszy?",
"a": "Można je stosować w pierwotnej socjalizacji, by wytworzyć nawyki (higiena, unikanie wysoce ryzykownych zachowań, badania kontrolne). Najmniejszy udział – przy intencjonalnych czynnościach zdrowotnych i stylu życia, który jest zindywidualizowany i oparty na wartościach.",
"id": "kliniczna/wyklad-5-fiszki:0973785c",
"unit": "wyklad-5.html",
"sec": "s3"
},
{
"src": "Heszen i Sęk (2007), r. 17",
"q": "Do jakich dwóch form działalności w promocji zdrowia psycholog jest najlepiej przygotowany?",
"a": "1) upowszechniania wiedzy psychologicznej (psychoedukacji) wśród profesjonalistów i nieprofesjonalistów, np. lekarzy, nauczycieli, decydentów, rodziców; 2) kształtowania kompetencji, zasobów i zachowań prozdrowotnych (treningi, warsztaty).",
"id": "kliniczna/wyklad-5-fiszki:592253fd",
"unit": "wyklad-5.html",
"sec": "s3"
},
{
"src": "Heszen i Sęk (2007), r. 17",
"q": "Czym jest psychologiczna prewencja (psychoprofilaktyka)?",
"a": "Zespołem działań wykorzystujących metody psychologiczne, by zmniejszyć prawdopodobieństwo zaburzeń funkcjonowania somatycznego, psychologicznego i społecznego przez przeciwdziałanie czynnikom ryzyka i wzmacnianie zasobów (Sęk).",
"id": "kliniczna/wyklad-5-fiszki:7ff7b39a",
"unit": "wyklad-5.html",
"sec": "s4"
},
{
"src": "Heszen i Sęk (2007), r. 17",
"q": "Czym różnią się prewencja pierwotna, wtórna i trzeciego stopnia (Caplan)?",
"a": "Pierwotna (właściwa) obniża zachorowalność, działając na czynniki ryzyka, zanim wywołają zaburzenie. Wtórna działa przy wczesnych sygnałach, by powstrzymać rozwój patologii. Trzeciego stopnia zapobiega skutkom przebytej choroby i hospitalizacji oraz nawrotom.",
"id": "kliniczna/wyklad-5-fiszki:cd35d68b",
"unit": "wyklad-5.html",
"sec": "s4"
},
{
"src": "Heszen i Sęk (2007), r. 17",
"q": "Czym różni się ryzyko w sensie epidemiologicznym od ryzyka w sensie decyzyjnym?",
"a": "Epidemiologiczne: działanie czynników zwiększających prawdopodobieństwo choroby, określane obiektywnie (liczba chorych do populacji). Decyzyjne: niepewność osiągnięcia pozytywnych wyników i narażenie na koszty; zapobiega się mu, optymalizując racjonalne decyzje i rozwijając kompetencje.",
"id": "kliniczna/wyklad-5-fiszki:c606de42",
"unit": "wyklad-5.html",
"sec": "s4"
},
{
"src": "Heszen i Sęk (2007), r. 17",
"q": "Czym środowiskowe czynniki ryzyka różnią się od sytuacyjnych?",
"a": "Działają przez dłuższy czas i wynikają ze współdziałania wielu elementów środowiska (np. ubóstwo, toksyczność, konfliktowość). Sytuacyjne to konkretne sytuacje zagrożenia (słońce, sporty ekstremalne, krytyczne wydarzenia).",
"id": "kliniczna/wyklad-5-fiszki:66a92021",
"unit": "wyklad-5.html",
"sec": "s4"
},
{
"src": "Heszen i Sęk (2007), r. 17",
"q": "Dlaczego kryzysy rozwojowe nazywa się „ryzykownymi szansami”?",
"a": "Nasilony konflikt zwiększa prawdopodobieństwo nierozwiązania kryzysu, a jednocześnie jego rozwiązanie wymaga podjęcia ryzykownych nowych zadań – kryzys może więc prowadzić do zaburzeń albo rozwoju.",
"id": "kliniczna/wyklad-5-fiszki:86f02bfc",
"unit": "wyklad-5.html",
"sec": "s4"
},
{
"src": "Heszen i Sęk (2007), r. 17",
"q": "Od czego zależy prawdopodobieństwo załamania zdrowia i co jest podstawą każdej interwencji prewencyjnej?",
"a": "Od bilansu: ryzyko rośnie z liczbą i nasileniem czynników ryzyka i maleje z ilością zasobów w osobie i środowisku. Podstawą interwencji jest diagnoza relacji czynników ryzyka z zasobami (Albee; Sęk).",
"id": "kliniczna/wyklad-5-fiszki:0cb280b9",
"unit": "wyklad-5.html",
"sec": "s4"
},
{
"src": "Heszen i Sęk (2007), r. 17",
"q": "Czym różni się strategia negatywna od pozytywnej w prewencji?",
"a": "Negatywna zmniejsza lub usuwa czynniki ryzyka (apele, perswazja, uświadamianie szkód); wywołuje reaktancję, ale działa przy bardzo dużym ryzyku. Pozytywna wzmacnia zasoby jednostki i środowiska oraz kompetencje; jest podstawowa w promocji zdrowia.",
"id": "kliniczna/wyklad-5-fiszki:fe0f4ea6",
"unit": "wyklad-5.html",
"sec": "s5"
},
{
"src": "Heszen i Sęk (2007), r. 17",
"q": "Czym prewencja różni się od promocji zdrowia?",
"a": "Prewencja jest kierowana do grup ryzyka i nastawiona na zachowanie status quo (utrzymanie zdrowia, przeciwdziałanie zaburzeniom); szuka zależności przyczynowych ryzyko–choroba. Promocja obejmuje całą populację i ma na celu rozwój zdrowia.",
"id": "kliniczna/wyklad-5-fiszki:87514594",
"unit": "wyklad-5.html",
"sec": "s5"
},
{
"src": "Heszen i Sęk (2007), r. 17",
"q": "Jakie warunki działalności prewencyjnej sformułował Cowen (1983)?",
"a": "Każda działalność prewencyjna powinna być intencjonalna i świadoma, oparta na wiedzy o czynnikach ryzyka, mechanizmach ich ujawniania się, czynnikach chroniących i sposobach realizacji celów prewencyjnych.",
"id": "kliniczna/wyklad-5-fiszki:645ff95c",
"unit": "wyklad-5.html",
"sec": "s5"
},
{
"src": "Heszen i Sęk (2007), r. 17",
"q": "Jaka jest skuteczność metod informacyjno-edukacyjnych z elementem wywoływania strachu?",
"a": "Ograniczona – tak wynika z badań ewaluacyjnych (Ostaszewski, 2003).",
"id": "kliniczna/wyklad-5-fiszki:32aaeec1",
"unit": "wyklad-5.html",
"sec": "s5"
},
{
"src": "Heszen i Sęk (2007), r. 17",
"q": "Na czym polega model działań alternatywnych i z jaką metodą jest związany?",
"a": "Na rozwijaniu zainteresowań i angażującej, atrakcyjnej aktywności zamiast zachowań antyzdrowotnych. Wiąże się z edukacją afektywną i jest skuteczny u młodzieży zagrożonej uzależnieniami.",
"id": "kliniczna/wyklad-5-fiszki:98a872d1",
"unit": "wyklad-5.html",
"sec": "s5"
},
{
"src": "Heszen i Sęk (2007), r. 17",
"q": "Z jakiej teorii wywodzi się trening umiejętności życiowych i czego uczy?",
"a": "Z teorii społecznego uczenia się. Uczy podejmowania decyzji, pozytywnego obrazu siebie i samokontroli, komunikowania się, rozwiązywania problemów, asertywności, współdziałania i radzenia sobie ze stresem; łączy strategię negatywną i pozytywną.",
"id": "kliniczna/wyklad-5-fiszki:e73d1e45",
"unit": "wyklad-5.html",
"sec": "s5"
},
{
"src": "Heszen i Sęk (2007), r. 17",
"q": "Na czym opiera się model wpływów społecznych w profilaktyce?",
"a": "Na kształtowaniu normatywnych przekonań o szkodliwości ryzyka i tworzeniu norm osobistych przez akceptowane autorytety – u młodzieży są to rówieśnicy pełniący rolę liderów zdrowia.",
"id": "kliniczna/wyklad-5-fiszki:1dce7101",
"unit": "wyklad-5.html",
"sec": "s5"
},
{
"src": "Heszen i Sęk (2007), r. 17",
"q": "Jaka jest najbardziej podstawowa zasada tworzenia programów profilaktycznych i dlaczego?",
"a": "Pogłębiona diagnoza potrzeb, czynników ryzyka i zasobów (systemowa ekspertyza w rodzinie, szkole, gminie). Dzięki niej program jest adekwatny do realnych zagrożeń, zasobów, zapotrzebowania i możliwości adresatów; dlatego gotowe, sztywne scenariusze się nie sprawdzają.",
"id": "kliniczna/wyklad-5-fiszki:ef41cd7d",
"unit": "wyklad-5.html",
"sec": "s6"
},
{
"src": "Heszen i Sęk (2007), r. 17",
"q": "Dlaczego program profilaktyczny musi być przede wszystkim bezpieczny?",
"a": "Bo skuteczność programów jest ograniczona, a niekiedy pojawiają się szkodliwe efekty uboczne; trzeba zagwarantować minimalizację efektów niekorzystnych, co zależy od przygotowania twórców i realizatorów.",
"id": "kliniczna/wyklad-5-fiszki:40dc03dc",
"unit": "wyklad-5.html",
"sec": "s6"
},
{
"src": "Heszen i Sęk (2007), r. 17",
"q": "Podaj kilka czynników skuteczności programów profilaktyki uzależnień według Ostaszewskiego.",
"a": "Naukowo uzasadnione podstawy; sprawdzone strategie redukcji ryzyka i wzmacniania zasobów; różne kanały wpływu i współpraca ze środowiskiem; interaktywne techniki; uwzględnienie zróżnicowania grupy; pilotaż, szkolenie kadry, ewaluacja; zaplanowany czas i działania uzupełniające; sieć wsparcia.",
"id": "kliniczna/wyklad-5-fiszki:e258539b",
"unit": "wyklad-5.html",
"sec": "s6"
},
{
"src": "Heszen i Sęk (2007), r. 17",
"q": "Jak Kubacka-Jasiecka opisuje kryzys?",
"a": "Jako stan zwrotny z bardzo dużym napięciem emocjonalnym, obawą przed utratą kontroli, przerażeniem, bezradnością, dezorganizacją zachowania i objawami somatycznymi; osoba czuje, że wyczerpała zasoby, i potrzebuje pomocy z zewnątrz.",
"id": "kliniczna/wyklad-5-fiszki:e461141c",
"unit": "wyklad-5.html",
"sec": "s7"
},
{
"src": "Heszen i Sęk (2007), r. 17",
"q": "Jaki jest cel interwencji kryzysowej z perspektywy psychologicznej i jakie techniki są w niej główne?",
"a": "Odzyskanie zdolności do samodzielnego rozwiązania kryzysu i poradzenia sobie z sytuacją. Główne są techniki wsparcia społecznego, przede wszystkim emocjonalnego, a także informacyjnego, materialnego i instrumentalnego.",
"id": "kliniczna/wyklad-5-fiszki:6376ae5a",
"unit": "wyklad-5.html",
"sec": "s7"
},
{
"src": "Heszen i Sęk (2007), r. 17",
"q": "Co rozstrzyga szybka diagnoza w interwencji kryzysowej?",
"a": "Poziom zagrożenia życia i zdrowia; czy reakcja wynika z ostrego stresu u osoby bez zaburzeń, czy z dezorganizacji przy przewlekłym stresie traumatycznym; jakie są zasoby własne osoby i wsparcie naturalnych grup. Prowadzi się ją równolegle z pomocą.",
"id": "kliniczna/wyklad-5-fiszki:a7a8055b",
"unit": "wyklad-5.html",
"sec": "s7"
},
{
"src": "Heszen i Sęk (2007), r. 17",
"q": "Kiedy interwencja kryzysowa przybiera formę psychoterapii?",
"a": "Gdy kryzys jest konsekwencją przewlekłego stresu i traumy, które zaburzyły funkcjonowanie. Bez patologii osobowości wystarczą krótkie formy pomocy i wsparcia.",
"id": "kliniczna/wyklad-5-fiszki:b76a8a7c",
"unit": "wyklad-5.html",
"sec": "s7"
},
{
"src": "Heszen i Sęk (2007), r. 17",
"q": "Czym ASD różni się od PTSD?",
"a": "ASD (wprowadzone do DSM-IV w 1994 r.) występuje zaraz po urazie, do 1 miesiąca, i wyróżniają je objawy dysocjacyjne: odrętwienie, zawężona świadomość, depersonalizacja, derealizacja, amnezja. Poza tym struktura diagnozy jest bardzo podobna.",
"id": "kliniczna/wyklad-5-fiszki:923d77ca",
"unit": "wyklad-5.html",
"sec": "s8"
},
{
"src": "Heszen i Sęk (2007), r. 17",
"q": "Jakie techniki stosuje się w terapii potraumatycznej w modelu poznawczo-behawioralnym?",
"a": "Techniki opanowywania lęku, ekspozycję (konfrontację z wydarzeniem) i restrukturyzację poznawczą; łączy się techniki poznawcze (kontrola myśli automatycznych, podważanie irracjonalnych przekonań) z behawioralnymi.",
"id": "kliniczna/wyklad-5-fiszki:1785b9af",
"unit": "wyklad-5.html",
"sec": "s8"
},
{
"src": "Heszen i Sęk (2007), r. 17",
"q": "Czym jest debriefing (CISD)?",
"a": "Critical Incident Stress Debriefing: system zapobiegania ASD i PTSD u zawodów narażonych na traumę (żołnierze, policjanci, strażacy, ratownicy). Spotkania przed, w trakcie i po akcji.",
"id": "kliniczna/wyklad-5-fiszki:770fed80",
"unit": "wyklad-5.html",
"sec": "s8"
},
{
"src": "Heszen i Sęk (2007), r. 17",
"q": "Jakie cztery wspólne cechy psychoterapii wskazują Cierpiałkowska i Czabała?",
"a": "Działania 1) zamierzone i planowane, 2) prowadzone przez wyszkolonych profesjonalistów, 3) wobec osób z zaburzeniami psychicznymi, zaburzeniami zachowania lub problemami zdrowotnymi, 4) mające zmienić wzorce zachowania albo struktury lub procesy intrapsychiczne.",
"id": "kliniczna/wyklad-5-fiszki:6e6fcbe9",
"unit": "wyklad-5.html",
"sec": "s9"
},
{
"src": "Heszen i Sęk (2007), r. 17",
"q": "Co oznacza zasada trafności paradygmatycznej?",
"a": "Metody terapii wyrastają z koncepcji natury człowieka, zdrowia i zaburzeń, więc strategie leczenia muszą być niesprzeczne z założeniami danego systemu psychoterapii; każdy system określa swoje czynniki leczące i warunki konieczne zmiany.",
"id": "kliniczna/wyklad-5-fiszki:93bd73f0",
"unit": "wyklad-5.html",
"sec": "s9"
},
{
"src": "Heszen i Sęk (2007), r. 17",
"q": "Czego dotyczy zmiana w psychoterapii w różnych koncepcjach?",
"a": "Behawioralne – objawów i zachowania; poznawcze – dysfunkcjonalnych schematów i procesów poznawczych; dynamiczne i humanistyczne – konfliktów i deficytów intrapsychicznych; systemowe – dysfunkcji interpersonalnych i rodzinnych.",
"id": "kliniczna/wyklad-5-fiszki:b9d7c554",
"unit": "wyklad-5.html",
"sec": "s9"
},
{
"src": "Heszen i Sęk (2007), r. 17",
"q": "Jakie właściwości grupy działają leczniczo w terapii grupowej?",
"a": "Poczucie przynależności i oparcia, tworzenie norm, informacje zwrotne wspierające doświadczenia korekcyjne, modelowanie oraz ćwiczenie ról i zachowań społecznych.",
"id": "kliniczna/wyklad-5-fiszki:b55eac00",
"unit": "wyklad-5.html",
"sec": "s9"
},
{
"src": "Heszen i Sęk (2007), r. 17",
"q": "Jakie czynniki psychiczne obniżają próg bólu?",
"a": "Napięcie mięśniowe, lęk i depresja, brak poczucia bezpieczeństwa, złość, poczucie pokrzywdzenia i wadliwe przekonania o przyczynach bólu.",
"id": "kliniczna/wyklad-5-fiszki:1d60c5c3",
"unit": "wyklad-5.html",
"sec": "s10"
},
{
"src": "Heszen i Sęk (2007), r. 17",
"q": "Które techniki są skuteczniejsze przy bólu ostrym, a które przy przewlekłym?",
"a": "Przy ostrym – odwracanie uwagi od doznań bólowych; przy przewlekłym – koncentracja i wizualizacja neutralnych lub pozytywnych wyobrażeń (Skevington, 2004).",
"id": "kliniczna/wyklad-5-fiszki:2d74cc76",
"unit": "wyklad-5.html",
"sec": "s10"
},
{
"src": "Heszen i Sęk (2007), r. 17",
"q": "Jakie podejścia stosuje się najczęściej w psychoterapii bólu?",
"a": "Najczęściej poznawczo-behawioralne, a także hipnoterapię i biofeedback (wspomaga poczucie kontroli nad bólem).",
"id": "kliniczna/wyklad-5-fiszki:049cafb3",
"unit": "wyklad-5.html",
"sec": "s10"
},
{
"src": "Heszen i Sęk (2007), r. 17",
"q": "Czym jest psychoterapia elementarna (Motyka)?",
"a": "Formą pośrednią między psychoterapią podtrzymującą a poradnictwem psychologicznym, stosowaną wobec pacjentów chorych somatycznie i hospitalizowanych; przygotowuje się do niej cały personel leczniczy.",
"id": "kliniczna/wyklad-5-fiszki:c794a830",
"unit": "wyklad-5.html",
"sec": "s11"
},
{
"src": "Heszen i Sęk (2007), r. 17",
"q": "Jakie są trzy cele psychoterapii elementarnej?",
"a": "1) łagodzenie emocjonalnych skutków choroby i leczenia; 2) wzmocnienie psychicznych sił i zasobów pacjenta w radzeniu sobie z chorobą; 3) dobra współpraca z personelem i unikanie jatrogenii.",
"id": "kliniczna/wyklad-5-fiszki:1603248d",
"unit": "wyklad-5.html",
"sec": "s11"
},
{
"src": "Heszen i Sęk (2007), r. 17",
"q": "Na jakiej drodze działa psychoterapia elementarna?",
"a": "Motywacyjno-emocjonalnej: mobilizuje pozytywne emocje, zmniejsza negatywne, budzi optymizm, nadzieję i zaangażowanie w leczenie; drugi wymiar to lepsze rozumienie sytuacji i uczenie się radzenia sobie z chorobą.",
"id": "kliniczna/wyklad-5-fiszki:5a2a1425",
"unit": "wyklad-5.html",
"sec": "s11"
},
{
"src": "Heszen i Sęk (2007), r. 17",
"q": "Czym są grupy samopomocy i jaką rolę pełni wobec nich psycholog zdrowia?",
"a": "To dobrowolne grupy osób o podobnych doświadczeniach (np. stomia, mastektomia, SM), nastawione na wzajemną pomoc. Psycholog jest konsultantem i ekspertem: uczy trafnego wsparcia, zmniejszania lęku i apatii, pomaga przeżywać żałobę; przygotowuje też wolontariuszy.",
"id": "kliniczna/wyklad-5-fiszki:08d513dc",
"unit": "wyklad-5.html",
"sec": "s12"
},
{
"src": "Heszen i Sęk (2007), r. 17",
"q": "W jakiej roli psycholog pracuje z zespołami opieki paliatywnej?",
"a": "Jako konsultant i superwizor, który pomaga odblokować przeciążenia emocjonalne wynikające z opieki nad chorymi terminalnymi i trudności w komunikacji z ich rodzinami.",
"id": "kliniczna/wyklad-5-fiszki:68fd91af",
"unit": "wyklad-5.html",
"sec": "s12"
}
]
