[
{
"q": "Jak Holmes i Rahe (1967) ujmują stres?",
"a": "<p>Jako <strong>wydarzenia życiowe<\/strong> wymagające zmiany. Każde wydarzenie ma liczbę punktów, a ich suma to <strong>współczynnik zmiany życiowej<\/strong>.<\/p>",
"src": "Model sytuacji stresowych",
"id": "kliniczna/wyklad-3-fiszki:c6e984c5",
"unit": "wyklad-3.html",
"sec": "s2"
},
{
"q": "Które wydarzenie ma najwyższą punktację na liście Holmesa i Rahe’a i ile punktów ma rozwód?",
"a": "<p><strong>Śmierć współmałżonka<\/strong>: 100 pkt. Rozwód: 73 pkt.<\/p>",
"src": "Model sytuacji stresowych",
"id": "kliniczna/wyklad-3-fiszki:f29052b3",
"unit": "wyklad-3.html",
"sec": "s2"
},
{
"q": "Czy na liście Holmesa i Rahe’a są wydarzenia przyjemne? Podaj przykłady.",
"a": "<p>Tak, bo stres wywołuje sama zmiana: ślub (50), szczególne osiągnięcia osobiste (28), wakacje (13), Boże Narodzenie (12).<\/p>",
"src": "Model sytuacji stresowych",
"id": "kliniczna/wyklad-3-fiszki:8e8e0cb3",
"unit": "wyklad-3.html",
"sec": "s2"
},
{
"q": "Co według slajdów zwiększa ryzyko wtórnej traumatyzacji u terapeutów i jaki jest najsilniejszy predyktor?",
"a": "<p>Młodszy wiek, mniejsze doświadczenie kliniczne, negatywne doświadczenia pracy online. Najsilniejszy predyktor: <strong>satysfakcja z pracy<\/strong>.<\/p>",
"src": "Model sytuacji stresowych",
"id": "kliniczna/wyklad-3-fiszki:9373deb0",
"unit": "wyklad-3.html",
"sec": "s2"
},
{
"q": "Jak Lazarus i Folkman (1984) definiują stres?",
"a": "<p>Jako określoną <strong>relację osoby z otoczeniem<\/strong>, ocenianą przez osobę jako obciążająca lub przekraczająca jej zasoby i zagrażająca jej dobrostanowi.<\/p>",
"src": "Model transakcyjny",
"id": "kliniczna/wyklad-3-fiszki:d33e1f2e",
"unit": "wyklad-3.html",
"sec": "s3"
},
{
"q": "Gdzie model transakcyjny „lokalizuje” stres?",
"a": "<p>Ani w człowieku, ani w otoczeniu: stres to <strong>relacja (transakcja)<\/strong> między nimi.<\/p>",
"src": "Model transakcyjny",
"id": "kliniczna/wyklad-3-fiszki:df8283b7",
"unit": "wyklad-3.html",
"sec": "s3"
},
{
"q": "Na czym polega ocena pierwotna, a na czym wtórna?",
"a": "<p><strong>Pierwotna<\/strong>: rozpoznanie znaczenia sytuacji jako krzywdy/straty, zagrożenia lub wyzwania. <strong>Wtórna<\/strong>: ocena możliwości działania (skutku dla stresora i własnych możliwości).<\/p>",
"src": "Model transakcyjny",
"id": "kliniczna/wyklad-3-fiszki:bbe90053",
"unit": "wyklad-3.html",
"sec": "s3"
},
{
"q": "Jakie cechy środowiska i jednostki wpływają na przebieg stresu w modelu transakcyjnym?",
"a": "<p><strong>Środowisko<\/strong>: wsparcie społeczne emocjonalne i instrumentalne. <strong>Jednostka<\/strong>: cecha lęku, wzór zachowania, czynniki społeczno-demograficzne, stan zdrowia.<\/p>",
"src": "Model transakcyjny",
"id": "kliniczna/wyklad-3-fiszki:2f643b17",
"unit": "wyklad-3.html",
"sec": "s3"
},
{
"q": "Jak Hobfoll definiuje stres w teorii COR?",
"a": "<p>Jako wewnętrzny stan jednostki zdeterminowany percepcją <strong>zagrażającego lub zaistniałego zakłócenia równowagi<\/strong> w wymianie zasobów między człowiekiem a otoczeniem.<\/p>",
"src": "Model zachowania zasobów",
"id": "kliniczna/wyklad-3-fiszki:3e6889e5",
"unit": "wyklad-3.html",
"sec": "s4"
},
{
"q": "Czym są zasoby w teorii COR?",
"a": "<p>Przedmioty, warunki, własności osobiste i formy energii, które są <strong>wartościowe dla przeżycia<\/strong> lub służą jako <strong>środek<\/strong> do osiągnięcia innych wartościowych celów. Celem aktywności jest ich uzyskiwanie, utrzymywanie i ochrona.<\/p>",
"src": "Model zachowania zasobów",
"id": "kliniczna/wyklad-3-fiszki:09f20792",
"unit": "wyklad-3.html",
"sec": "s4"
},
{
"q": "Który model wnosi do definicji stresu zależność od kultury?",
"a": "<p>Model Hobfolla (1989): stres zależy od kultury, w której człowiek żyje, i od wyznawanych w niej wartości.<\/p>",
"src": "Stres: definicja łącząca modele",
"id": "kliniczna/wyklad-3-fiszki:d3aa4dee",
"unit": "wyklad-3.html",
"sec": "s1"
},
{
"q": "Czym różni się radzenie sobie ze stresem od radzenia sobie z napięciem?",
"a": "<p><strong>Ze stresem (coping)<\/strong>: aktywność wobec sytuacji stresowej. <strong>Z napięciem<\/strong>: techniki obniżania pobudzenia, np. oddechowe i relaksacyjne.<\/p>",
"src": "Radzenie sobie ze stresem",
"id": "kliniczna/wyklad-3-fiszki:1620f14e",
"unit": "wyklad-3.html",
"sec": "s6"
},
{
"q": "Czym różnią się proces, strategia i styl radzenia sobie?",
"a": "<p><strong>Proces<\/strong>: całość aktywności w sytuacji stresowej, dynamiczna i rozciągnięta w czasie. <strong>Strategia<\/strong>: ogniwo procesu. <strong>Styl<\/strong>: względnie stała indywidualna dyspozycja do reagowania na stres.<\/p>",
"src": "Radzenie sobie ze stresem",
"id": "kliniczna/wyklad-3-fiszki:88bc88fd",
"unit": "wyklad-3.html",
"sec": "s6"
},
{
"q": "Jakie style radzenia sobie wyróżniają Endler i Parker (1990)?",
"a": "<p>Skoncentrowany na <strong>problemie<\/strong> (zmiana sytuacji), na <strong>emocjach<\/strong> (zmiana własnego stanu) i na <strong>unikaniu<\/strong> (unikanie myślenia, zaprzeczanie; skuteczny dla problemów krótkotrwałych).<\/p>",
"src": "Radzenie sobie ze stresem",
"id": "kliniczna/wyklad-3-fiszki:b24425c0",
"unit": "wyklad-3.html",
"sec": "s7"
},
{
"q": "Jakie style wyróżnia Miller (1987)?",
"a": "<p>Styl <strong>konfrontacyjny<\/strong> (tendencja do poszukiwania informacji) i <strong>unikowy<\/strong> (tendencja do unikania informacji).<\/p>",
"src": "Radzenie sobie ze stresem",
"id": "kliniczna/wyklad-3-fiszki:442c626b",
"unit": "wyklad-3.html",
"sec": "s7"
},
{
"q": "Wymień cztery rodzaje radzenia sobie według Schwarzera i Tauberta (1999).",
"a": "<p><strong>Reaktywne<\/strong> (kompensacja krzywdy lub straty), <strong>antycypacyjne<\/strong> (przyszłe wydarzenie), <strong>prewencyjne<\/strong> (gromadzenie zasobów), <strong>proaktywne<\/strong> (zdobywanie zasobów i poszukiwanie wyzwań, moderowane poczuciem własnej skuteczności).<\/p>",
"src": "Radzenie sobie ze stresem",
"id": "kliniczna/wyklad-3-fiszki:361563a9",
"unit": "wyklad-3.html",
"sec": "s7"
},
{
"q": "Kiedy według Folkman i Moskowitz pojawia się radzenie sobie oparte na znaczeniu i co daje?",
"a": "<p>Gdy rezultat jest niekorzystny i pojawia się dystres. Wywołuje emocje pozytywne, które przywracają zasoby i podtrzymują proces radzenia sobie.<\/p>",
"src": "Radzenie sobie ze stresem",
"id": "kliniczna/wyklad-3-fiszki:9ef8eed0",
"unit": "wyklad-3.html",
"sec": "s7"
},
{
"q": "Czym jest wizualizacja jako technika radzenia sobie z napięciem?",
"a": "<p>Wyobrażaniem sobie miejsca lub sytuacji i jej <strong>pomyślnego zakończenia<\/strong>; mobilizuje organizm i nastawia możliwości psychiczne i fizyczne na realizację celu.<\/p>",
"src": "Radzenie sobie z napięciem",
"id": "kliniczna/wyklad-3-fiszki:63a9e179",
"unit": "wyklad-3.html",
"sec": "s9"
},
{
"q": "Jakie trzy nurty w opisie stresu wyróżniają Heszen-Celińska i Sęk i który dominuje?",
"a": "<p>Stres jako <strong>sytuacja<\/strong> (bodziec), jako <strong>reakcja<\/strong> (stan stresu) i <strong>relacyjnie<\/strong> (zakłócenie lub zapowiedź zakłócenia równowagi między wymaganiami a możliwościami). Współcześnie dominuje nurt <strong>relacyjny<\/strong>.<\/p>",
"src": "Psychologia zdrowia, r. 9",
"id": "kliniczna/wyklad-3-fiszki:ec16cfb3",
"unit": "wyklad-3.html",
"sec": "s1"
},
{
"q": "Jakie są trzy stadia ogólnego zespołu adaptacyjnego (GAS) Selyego?",
"a": "<p>(1) <strong>reakcja alarmowa<\/strong> (mobilizacja sił obronnych), (2) <strong>stadium odporności<\/strong> (pełne przystosowanie), (3) <strong>stadium wyczerpania<\/strong> (gdy stresor jest silny i działa długo).<\/p>",
"src": "Psychologia zdrowia, r. 9",
"id": "kliniczna/wyklad-3-fiszki:da4fedc9",
"unit": "wyklad-3.html",
"sec": "s1"
},
{
"q": "Za co krytykowano koncepcję stresu Selyego?",
"a": "<p>(1) reakcje organizmu są <strong>swoiste<\/strong> dla czynnika szkodliwego; (2) nawet stres biologiczny zależy od <strong>czynników psychologicznych<\/strong>: oceny stresora, jego znaczenia i własnych możliwości.<\/p>",
"src": "Psychologia zdrowia, r. 9",
"id": "kliniczna/wyklad-3-fiszki:6f4cff0b",
"unit": "wyklad-3.html",
"sec": "s1"
},
{
"q": "Na czym może polegać brak równowagi w ujęciu relacyjnym stresu?",
"a": "<p>Na zbyt małych możliwościach wobec wymagań, ale też na <strong>zbyt małych wymaganiach<\/strong> wobec możliwości. Wymagania mogą być zewnętrzne lub wynikać z wewnętrznych standardów jednostki.<\/p>",
"src": "Psychologia zdrowia, r. 9",
"id": "kliniczna/wyklad-3-fiszki:56a42aaa",
"unit": "wyklad-3.html",
"sec": "s1"
},
{
"q": "Jak w ocenie pierwotnej może być oceniona relacja z otoczeniem?",
"a": "<p>Jako <strong>niemająca znaczenia<\/strong>, <strong>sprzyjająco-pozytywna<\/strong> albo <strong>stresująca<\/strong>; stresująca jako krzywda/strata, zagrożenie lub wyzwanie.<\/p>",
"src": "Psychologia zdrowia, r. 9",
"id": "kliniczna/wyklad-3-fiszki:fc78f0d8",
"unit": "wyklad-3.html",
"sec": "s3"
},
{
"q": "Jakie emocje towarzyszą ocenie krzywdy/straty, zagrożenia i wyzwania?",
"a": "<p><strong>Krzywda/strata<\/strong>: złość, żal, smutek. <strong>Zagrożenie<\/strong>: strach, lęk, martwienie się. <strong>Wyzwanie<\/strong>: negatywne jak przy zagrożeniu oraz pozytywne: nadzieja, zapał, podekscytowanie.<\/p>",
"src": "Psychologia zdrowia, r. 9",
"id": "kliniczna/wyklad-3-fiszki:9ff9ec5e",
"unit": "wyklad-3.html",
"sec": "s3"
},
{
"q": "Jak ocena wtórna może wpłynąć na ocenę pierwotną?",
"a": "<p>Obie oceny przebiegają równocześnie i są sprzężone: optymistyczna ocena własnych możliwości może zmienić ocenę z „zagrożenia” na „wyzwanie”, pesymistyczna odwrotnie.<\/p>",
"src": "Psychologia zdrowia, r. 9",
"id": "kliniczna/wyklad-3-fiszki:5c747beb",
"unit": "wyklad-3.html",
"sec": "s3"
},
{
"q": "Jaka jest główna różnica między ujęciem stresu Lazarusa i Folkman a ujęciem Hobfolla?",
"a": "<p>Lazarus: perspektywa <strong>indywidualistyczna<\/strong>, psychologia poznawcza, kryterium to <strong>subiektywna ocena<\/strong>. Hobfoll: perspektywa <strong>kolektywistyczna<\/strong>, podstawy ewolucyjne i kulturowe, kryterium to <strong>obiektywne<\/strong> zmiany zasobów.<\/p>",
"src": "Psychologia zdrowia, r. 9",
"id": "kliniczna/wyklad-3-fiszki:814714b8",
"unit": "wyklad-3.html",
"sec": "s4"
},
{
"q": "Jakie trzy okoliczności wywołują stres według Hobfolla?",
"a": "<p>(1) zagrożenie utratą zasobów, (2) faktyczna utrata zasobów, (3) brak zysków po zainwestowaniu zasobów.<\/p>",
"src": "Psychologia zdrowia, r. 9",
"id": "kliniczna/wyklad-3-fiszki:67775e62",
"unit": "wyklad-3.html",
"sec": "s4"
},
{
"q": "Co to jest spirala strat i spirala zysków w teorii zachowania zasobów?",
"a": "<p>Straty i zyski mają tendencję do narastania w kolejnych cyklach. <strong>Spirala strat<\/strong> ma większą dynamikę niż spirala zysków, a strata jest dotkliwsza niż zysk. Osoby z małymi zasobami po początkowej stracie wpadają w spiralę strat, bo nie mają czego zainwestować.<\/p>",
"src": "Psychologia zdrowia, r. 9",
"id": "kliniczna/wyklad-3-fiszki:f4a109fa",
"unit": "wyklad-3.html",
"sec": "s4"
},
{
"q": "Jakie poziomy stresu wyróżnia Lazarus (1980) i co jest nowością tej koncepcji?",
"a": "<p>Poziom <strong>społeczny<\/strong> (role, relacje), <strong>psychologiczny<\/strong> (ocena, emocje, zachowanie) i <strong>biologiczny<\/strong> (skutki dla organizmu). Nowość: poziomy są <strong>w dużym stopniu niezależne<\/strong>.<\/p>",
"src": "Psychologia zdrowia, r. 9",
"id": "kliniczna/wyklad-3-fiszki:1974efc6",
"unit": "wyklad-3.html",
"sec": "s5"
},
{
"q": "Jak Lazarus i Folkman definiują radzenie sobie?",
"a": "<p>„Stale zmieniające się poznawcze i behawioralne wysiłki mające na celu uporanie się z określonymi zewnętrznymi i wewnętrznymi wymaganiami, ocenianymi przez osobę jako obciążające lub przekraczające jej zasoby” (1984, s. 141).<\/p>",
"src": "Psychologia zdrowia, r. 9",
"id": "kliniczna/wyklad-3-fiszki:233270e4",
"unit": "wyklad-3.html",
"sec": "s6"
},
{
"q": "Czy mechanizmy obronne są radzeniem sobie według Lazarusa i Folkman?",
"a": "<p><strong>Tak<\/strong>: cel nie musi być uświadomiony, a ocena realistyczna. Wykluczone są tylko formy automatyczne bez oceny poznawczej (mechanizmy biologiczne, odruchy). Mechanizmy obronne są adaptacyjne w sytuacjach niekontrolowalnych i na początku stresu.<\/p>",
"src": "Psychologia zdrowia, r. 9",
"id": "kliniczna/wyklad-3-fiszki:4c73c706",
"unit": "wyklad-3.html",
"sec": "s6"
},
{
"q": "Jakie funkcje spełnia radzenie sobie ze stresem?",
"a": "<p><strong>Instrumentalna<\/strong> (zadaniowa, zorientowana na problem), <strong>samoregulacji emocji<\/strong> i, od badań Folkman, <strong>ukierunkowana na znaczenie<\/strong>.<\/p>",
"src": "Psychologia zdrowia, r. 9",
"id": "kliniczna/wyklad-3-fiszki:d17bdb76",
"unit": "wyklad-3.html",
"sec": "s6"
},
{
"q": "Czym różnią się radzenie antycypacyjne, prewencyjne i proaktywne?",
"a": "<p><strong>Antycypacyjne<\/strong>: bliskie, pewne zdarzenie z ryzykiem straty (egzamin). <strong>Prewencyjne<\/strong>: odległe, niepewne zagrożenia, gromadzenie zasobów (ubezpieczenie, szczepienie). <strong>Proaktywne<\/strong>: przyszłe wyzwania, gromadzenie zasobów na szanse (wykształcenie, zdrowy styl życia).<\/p>",
"src": "Psychologia zdrowia, r. 9",
"id": "kliniczna/wyklad-3-fiszki:1703e74e",
"unit": "wyklad-3.html",
"sec": "s7"
},
{
"q": "Na czym polega teoria poszerzającej i budującej roli emocji pozytywnych (Fredrickson)?",
"a": "<p>Emocje pozytywne <strong>poszerzają<\/strong> repertuar uwagi, myślenia i działania oraz <strong>budują<\/strong> zasoby intelektualne i społeczne. Odwracają też fizjologiczne skutki emocji negatywnych (<em>undoing<\/em>).<\/p>",
"src": "Psychologia zdrowia, r. 9",
"id": "kliniczna/wyklad-3-fiszki:847e9d22",
"unit": "wyklad-3.html",
"sec": "s7"
},
{
"q": "Co wykazało badanie Gruszczyńskiej (2012) pacjentów po zawale?",
"a": "<p>Strategie <strong>salutarne<\/strong> (wzrost emocji pozytywnych) faktycznie tłumaczyły przyrost tych emocji, a <strong>paliatywne<\/strong> (obniżanie negatywnych) nie redukowały afektu negatywnego, tylko mu towarzyszyły.<\/p>",
"src": "Psychologia zdrowia, r. 9",
"id": "kliniczna/wyklad-3-fiszki:9bfba8e9",
"unit": "wyklad-3.html",
"sec": "s7"
},
{
"q": "Czym jest zaprzeczanie chorobie i jakie ma skutki?",
"a": "<p>Nieprzyjmowaniem faktu zachorowania mimo dostępnych informacji; <strong>strategia unikowa<\/strong>. Doraźnie chroni przed lękiem, ale na dłuższą metę bywa groźna dla życia (np. w nowotworach). Zaprzeczanie częściowe to forma radzenia opartego na znaczeniu.<\/p>",
"src": "Psychologia zdrowia, r. 9",
"id": "kliniczna/wyklad-3-fiszki:84911151",
"unit": "wyklad-3.html",
"sec": "s8"
}
]
