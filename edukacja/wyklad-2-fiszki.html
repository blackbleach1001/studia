"a": "<p>Kagan: indywidualna tendencja w sytuacjach z kilkoma możliwymi rozwiązaniami. <strong>Impulsywni<\/strong> odpowiadają szybko, popełniają więcej błędów (losowych), lepiej zapamiętują mimowolnie i radzą sobie w zadaniach na czas i dywergencyjnych. <strong>Refleksyjni<\/strong> działają wolniej, popełniają mniej błędów, mają lepszą koncentrację, transfer i wyniki w zadaniach konwergencyjnych (początek nauki, przedmioty ścisłe). Wpływ jest silniejszy u młodszych; nauczyciele wyżej oceniają uczniów o podobnym stylu.<\/p>",

"q": "Jak ekstrawertycy i introwertycy różnią się w uczeniu się według Eysencka?",

"a": "<p>Argumenty: rozwój potencjału każdego ucznia; różnice w zdolnościach, stylach, osobowości, tempie, wiedzy wyjściowej, wsparciu domu i motywacji; bez indywidualizacji słabsi nie nadążają, a zdolni tracą motywację. Formy: <strong>grupy mieszane<\/strong> z różnicowaniem treści i tempa (diagnoza, monitorowanie) oraz <strong>grupy jednorodne<\/strong> (selekcja) – łatwiejsze dla nauczyciela, ale słabsi tracą wzorce. Dawanie najsłabszym tylko prostych zadań utrwala niskie osiągnięcia.<\/p>",

{
"src": "Budziszewska",
"q": "Czym jest funkcja promocyjna psychologa szkolnego i czym różni się od profilaktyki i interwencji?",
"a": "<p>W modelu Katry psycholog pełni funkcje monitoringu, psychoprofilaktyki, interwencji i <strong>promocji<\/strong>. Profilaktyka i interwencja działają „poniżej zera” – usuwają problemy i doprowadzają do normy. Promocja (Jurkowski; łac. <em>promovere<\/em>) wspiera rozwój <strong>powyżej zera<\/strong>: to, co dobre, ma stać się lepsze; obejmuje całą osobę i cały bieg życia, twórczość, transgresję (Kozielecki), także u uczniów zdolnych i „trudnych”.<\/p>",

{
"src": "Budziszewska",
"q": "Jakie kryteria dojrzałej osobowości mogą wyznaczać cele promocyjne?",
"a": "<p><strong>Allport<\/strong>: samowiedza i refleksja, zainteresowania poza „ja”, dystans i poczucie humoru, własny system wartości, głęboki kontakt z innymi, praktyczne umiejętności, zaangażowanie w dobro wspólne. <strong>Adler<\/strong>: poczucie wspólnoty. <strong>Maslow<\/strong>: adekwatna percepcja, szacunek, autentyczność, krytycyzm wobec kultury. Współcześnie: <strong>podmiotowość<\/strong> (wolność od i do), kreatywność, samoregulacja, aktywność prospektywna.<\/p>",

{
