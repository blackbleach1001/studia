"src": "Bednarek, rozdz. 6",
"q": "Kto jest klientem w usługach psychologa edukacyjnego, a kto nie?",
"a": "<p>Kontrakt, świadomą zgodę i tajemnicę można zawrzeć tylko z <strong>osobą<\/strong>. Klientami są dziecko (podmiot oddziaływania) i rodzice (zlecają i przyjmują wyniki), przy wsparciu rodzica – sam rodzic, przy konsultacji – nauczyciel. <strong>Nie są<\/strong> klientami: dyrektor, szkoła, kuratorium ani system; szkolenie i ekspertyza dla dyrektora to nie usługa psychologiczna.<\/p>",
"k": [
"tylko osoba",
"dziecko + rodzice",
"nauczyciel przy konsultacji",
"nie dyrektor ani system"

},

"q": "Jak psycholog ma formułować zalecenia dla szkoły, której możliwości są ograniczone?",

"k": [
"uwzględnia możliwości szkoły",
"nie rezygnuje z optimum",

"wyjaśnia ryzyko"

"sec": "k1"

{

"q": "Czym różni się zgoda rodziców od przyzwolenia dziecka i co, gdy dziecko odmawia?",
"a": "<p>Rodzice wyrażają <strong>pisemną, świadomą zgodę<\/strong> po zawarciu kontraktu. Dziecko, zwłaszcza młodsze, wyraża <strong>przyzwolenie<\/strong> po zrozumiałym wyjaśnieniu – podmiotowość przysługuje mu niezależnie od wieku. Przy sprzeciwie: bez presji, ocenić, czy wynika z lęku (wtedy pracować nad zaufaniem), a świadomą odmowę po zrozumieniu celu <strong>uwzględnić<\/strong>.<\/p>",

"q": "Czym różni się społeczny od prawnego obowiązku denuncjacji?",
"a": "<p><strong>Społeczny<\/strong> (art. 304 kpk): dotyczy przestępstw ściganych z urzędu, bez kary za niezgłoszenie – psycholog kieruje się dobrem dziecka i zwykle nie łamie tajemnicy. <strong>Prawny<\/strong> (art. 240 kk): zagrożony karą, dotyczy zamkniętego katalogu najcięższych czynów (np. zabójstwo, ciężki uszczerbek, zgwałcenie dziecka poniżej 15 lat). Przy zgłoszeniu psycholog informuje klienta i ogranicza szkody dla relacji.<\/p>",

"q": "Kiedy psycholog może ujawnić dokumentację lub zeznawać na wezwanie sądu?",
"a": "<p>Tylko w <strong>postępowaniu karnym<\/strong> i po <strong>pisemnym zwolnieniu<\/strong> z tajemnicy (art. 180 kpk), ujawniając minimum; do dokumentacji dołącza oświadczenie o tajemnicy. W postępowaniu <strong>cywilnym<\/strong> zwolnienie nie jest możliwe – psycholog odmawia (art. 261 § 2 kpc). Bezprawne udostępnienie (np. kserokopie w aktach) grozi odpowiedzialnością karną i cywilną.<\/p>",
