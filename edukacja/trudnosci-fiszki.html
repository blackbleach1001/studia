"q": "Jak WHO definiuje zdrowie psychiczne i jakie zarzuty stawia się tej definicji?",

{
"src": "Trzebińska i Kuźmicz, rozdz. 7",
"q": "Czym różni się podejście transdiagnostyczne od sieciowego modelu zdrowia psychicznego?",
"a": "<p><strong>Transdiagnostyczne<\/strong>: diagnozuje się i leczy nieprawidłowe <strong>procesy<\/strong>, a nie zaburzenia (urojenia, nie schizofrenię; anhedonię, nie depresję); wymiary transdiagnostyczne, np. samoocena, mają formy korzystne i niekorzystne. <strong>Sieciowe<\/strong>: zaburzenie to sieć wzajemnie napędzających się objawów (bezsenność → wyczerpanie → koncentracja → bezradność → smutek); wpływ na objaw centralny lub początkowy może rozbić sieć.<\/p>",

"a": "<p>Utożsamiają problem z osobą (model wewnętrzny/medyczny): to osoba jest „słaba”, a nie jej wyniki w danym kontekście, więc nauczyciel nie szuka zmian w metodach. Badania (Granello): etykiety identyfikujące osobę z chorobą („chory psychicznie”, „schizofrenik”) wiążą się z mniejszą tolerancją i postawami autorytarnymi. Lepiej: „uczeń z dysleksją”.<\/p>",

{
"src": "Bednarek, rozdz. 9",
"q": "Na czym polega model rozbieżności IQ–osiągnięcia (AAD)?",
"a": "<p>Zakłada, że inteligencja koreluje z umiejętnościami szkolnymi; trudność w uczeniu się stwierdza się, gdy wynik ucznia w wystandaryzowanym teście (np. czytania) jest istotnie <strong>niższy niż oczekiwany<\/strong> dla jego wieku i IQ. Kryterium stosują ICD i DSM. W Polsce brakuje norm uwzględniających przedział IQ, a model nie uwzględnia zasobów.<\/p>",
"k": [
"IQ koreluje z osiągnięciami",
"wynik niższy od oczekiwanego",
"ICD/DSM",
"bez zasobów"
],
"id": "edukacja/trudnosci-fiszki:9ae3f5bc",

"sec": "d3"
},
{
"src": "Bednarek, rozdz. 9",
"q": "Jakie są zalety i wady modelu odpowiedzi na interwencję (RtI) jako modelu diagnozy?",
"a": "<p>Trzy poziomy pomocy o rosnącej intensywności; kto nie reaguje, zostaje uznany za mającego specyficzne trudności. <strong>Zalety<\/strong>: tani, monitoruje wszystkich, przenosi akcent na metody nauczania. <strong>Wady<\/strong>: wiadomo tylko, że uczeń „nie reaguje” (<em>non-responder<\/em>), nic o przyczynach; te same strategie dla wszystkich; nie uwzględnia zasobów. Standardy zalecają gruntowną diagnozę niereagujących.<\/p>",
"k": [
"trzy poziomy",
"tani, monitoruje wszystkich",
"non-responders",
"brak przyczyn i zasobów"
],
"id": "edukacja/trudnosci-fiszki:78f0b89f",
"unit": "trudnosci.html",
"sec": "d3"
},
{
"src": "Bednarek, rozdz. 9",
"q": "Dlaczego sztywna diagnoza nozologiczna może być szkodliwa w edukacji?",
"a": "<p>Nastawienie na „wyleczenie” frustruje, bo osoby o atypowym rozwoju realizują cele w swój sposób („miałem jeszcze na to papier”). Gdy dziecko nie spełnia kryteriów konkretnego zaburzenia, diagnoza bywa fiaskiem i nie daje pomocy – jakby pomoc należała się tylko osobom „posiadającym” zaburzenie. Wiele dostosowań zależy od symptomu, a nie od przyczyny.<\/p>",
"k": [
"frustracja „wyleczeniem”",
"brak etykiety = brak pomocy",
"dostosowania do symptomu"
],
"id": "edukacja/trudnosci-fiszki:fd526a82",
"unit": "trudnosci.html",
"sec": "d3"
},
{
"src": "Bednarek, rozdz. 9",
"q": "Czym jest diagnoza funkcjonalna i gdzie ją zakotwiczono w polskim prawie?",
"a": "<p>Wielowymiarowe, wielokontekstowe rozpoznanie funkcjonowania osoby w środowisku (zasoby i deficyty) oraz możliwości rozwoju i <strong>modyfikacji środowiska<\/strong>; opiera się na modelu biopsychospołecznym i teorii Bronfenbrennera. W Polsce: § 2 rozporządzenia MEN z 9.08.2017 – rozpoznawanie potrzeb, możliwości i czynników środowiskowych, by umożliwić pełne uczestnictwo.<\/p>",
"k": [
"zasoby i deficyty w środowisku",
"modyfikacja środowiska",
"Bronfenbrenner",
"rozporządzenie 2017 § 2"
],
"id": "edukacja/trudnosci-fiszki:aa36a0ca",
"unit": "trudnosci.html",
"sec": "d4"
},
{
"src": "Bednarek, rozdz. 9",
"q": "Czym model PSW i diagnoza neuropsychologiczna różnią się od AAD i RtI?",
"a": "<p>Tworzą <strong>profil zasobów i ograniczeń<\/strong> w procesach poznawczych, służący szczegółowym zaleceniom dla nauczycieli; celem jest zrozumienie i jakość życia, a nie stwierdzenie syndromu. AAD i RtI służą głównie kwalifikacji do świadczeń i nie uwzględniają zasobów. Modele neuropsychologiczne (CHT, SNP/CHC, NDM) zakładają hierarchię procesów i brak „czystych” testów.<\/p>",
"k": [
"profil zasobów i ograniczeń",
"zalecenia dla nauczycieli",
"AAD/RtI = kwalifikacja",
"hierarchia procesów"
],
"id": "edukacja/trudnosci-fiszki:33fa713f",
"unit": "trudnosci.html",
"sec": "d4"
},
{
"src": "Bednarek, rozdz. 9",
"q": "Dlaczego w diagnozie neuropsychologicznej nie można traktować wyniku jednego testu jako miary jednej funkcji?",
"a": "<p>Nie ma testów „czystych”: wynik testu pamięci obciążają uwaga i percepcja w danej modalności. Procesy są zorganizowane hierarchicznie, więc o zaburzeniu na danym piętrze wnioskuje się po ocenie pięter niższych. Funkcje są też złożone (uwaga słuchowa ≠ wzrokowa, odporność na dystraktory ≠ przerzutność), więc nie wolno uogólniać wyniku na „uwagę w ogóle”.<\/p>",
"k": [
"brak czystych testów",
"hierarchia pięter",
"nie uogólniać"
],
"id": "edukacja/trudnosci-fiszki:dbd6b49e",
"unit": "trudnosci.html",
"sec": "d4"
},
{
"src": "Bednarek, rozdz. 9",
"q": "Jakie nawyki polskiej diagnozy dysleksji krytykuje Bednarek?",
"a": "<p>(1) Przekonanie, że „nie można” diagnozować przed klasą III – niezgodne z klasyfikacjami i wiedzą o biologicznym podłożu; (2) „ryzyko dysleksji” jako quasi-diagnoza bez dostosowań i monitorowania; (3) zdublowana rediagnoza z rutynowym powtarzaniem IQ; (4) zdawkowe zalecenia mimo badania funkcji poznawczych; (5) wykluczanie dzieci z zaburzeniami współwystępującymi.<\/p>",
"k": [
"„nie przed klasą III”",
"ryzyko bez dostosowań",
"powtarzanie IQ",
"zdawkowe zalecenia",
"współwystępowanie"
],
"id": "edukacja/trudnosci-fiszki:8d232a37",
"unit": "trudnosci.html",
"sec": "d5"
},
{
"src": "Bednarek, rozdz. 9",
"q": "Kiedy powtórne badanie inteligencji w rediagnozie dysleksji jest uzasadnione?",
"a": "<p>Inteligencja w wieku szkolnym jest względnie stała, a w modelu AAD bada się ją tylko, by wykluczyć niepełnosprawność intelektualną. Powtórka jest uzasadniona, gdy poprzedni wynik był <strong>graniczny<\/strong>, dziecko doznało <strong>urazu OUN<\/strong>, jego funkcjonowanie istotnie się <strong>pogorszyło<\/strong> albo poprzednie badanie było wadliwe (np. test werbalny u dziecka z zaburzeniami językowymi).<\/p>",
"k": [
"IQ względnie stałe",
"wynik graniczny",
"uraz OUN / pogorszenie",
"błędne badanie"
],
"id": "edukacja/trudnosci-fiszki:3e03b1c5",
"unit": "trudnosci.html",
"sec": "d5"
}
