"q": "Dlaczego psycholog szkolny nie powinien działać jak „pogotowie ratunkowe”?",
"a": "<p>Model „pogotowia” (sama interwencja kryzysowa) ogranicza skuteczną pomoc i sprowadza się do wyręczania wychowawców („zarzucanie przypadkami”). Psycholog powinien być <strong>widoczny<\/strong> w szkole zanim pojawi się problem: monitoring, profilaktyka, promocja, dzielenie się wiedzą. Narzędziem jest np. <strong>monografia klasy<\/strong> (struktura nieformalna, cechy grupy, pozycje uczniów), przerywająca błędne koło kontaktu tylko w kryzysie.<\/p>",

"q": "Na czym polega rola psychologa jako eksperta od wychowania i nauczania?",

"q": "Jak WHO definiuje zdrowie psychiczne i jakie zarzuty stawia się tej definicji?",

"q": "Czym różni się podejście transdiagnostyczne od sieciowego modelu zdrowia psychicznego?",

"q": "Dlaczego określenia typu „słaby uczeń” czy „dyslektyk” są szkodliwe?",
"a": "<p>Utożsamiają problem z osobą (model wewnętrzny/medyczny): to osoba jest „słaba”, a nie jej wyniki w danym kontekście, więc nauczyciel nie szuka zmian w metodach. Badania (Granello): etykiety identyfikujące osobę z chorobą („chory psychicznie”, „schizofrenik”) wiążą się z mniejszą tolerancją i postawami autorytarnymi. Lepiej: „uczeń z dysleksją”.<\/p>",

],

"sec": "n3"
},
{
"src": "Bednarek, rozdz. 8",
"q": "Dlaczego nie należy nazywać dostosowań „ułatwieniami”?",
"a": "<p>„Ułatwienie” sugeruje nieuczciwą przewagę, więc „sprawiedliwy nauczyciel” czuje moralny opór przed jego wprowadzeniem. Tymczasem dostosowania są prawnie wymagane i merytorycznie uzasadnione – pozwalają uczniowi ze SPE uczyć się i być ocenianym na równych prawach.<\/p>",

],

"unit": "trudnosci.html",
"sec": "n3"
},
{

"q": "Skąd biorą się psychopedagogiczne mity i neuromity w edukacji?",
"a": "<p>Nauczyciele dostrzegają różnice między uczniami i szukają wyjaśnień, ale sięgają po uproszczone, publicystyczne źródła; mity powstają z błędnie uproszczonych badań lub badań na zwierzętach (OECD). Przykład: style uczenia się. Według Bednarek to sygnał, że psychologowie nie nadążają za potrzebami nauczycieli i powinni lepiej przekładać naukę na praktykę.<\/p>",

"uproszczone źródła",
"style uczenia się",
"zadanie dla psychologów"
],

{

"q": "Kto ponosi odpowiedzialność za diagnozę psychologiczną w poradni i czym jest „użytkownik testu” według APA?",
"a": "<p>Wyłącznie <strong>psycholog<\/strong> – za plan, realizację i interpretację, nawet gdy opinię wystawia placówka i gdy część badań prowadzi pedagog. „Użytkownik testu” to osoba odpowiedzialna za wybór narzędzi, przeprowadzenie, obliczenie, analizę, interpretację i opinię; osoba, która tylko przeprowadza test i liczy wynik, nim nie jest.<\/p>",
"k": [
"tylko psycholog",
"także gdy opinię wystawia placówka",
"użytkownik testu = wybór + interpretacja"
],

},
{

"a": "<p>Wskazówki PTP pod patronatem Rzecznika Praw Dziecka dla psychologów w poradniach i szkołach: od zasad etycznych przez hipotezy i ich weryfikację po przekazanie wyników odbiorcy. Nowatorski jest nacisk na <strong>konsekwencje diagnozy<\/strong> – planowanie interwencji i dostosowań oraz monitorowanie efektów. Według APA to raczej „wskazówki” niż „standardy”, bo nie ma sankcji.<\/p>",

"PTP + RPD 2018",
"nacisk na konsekwencje",
"interwencje i monitorowanie",
"„wskazówki”, nie standardy"
],

"q": "Jakie są trzy wersje rozdziału V ICD-10 i której nie wolno używać w diagnozie indywidualnej?",
"a": "<p>(1) <strong>Granatowa<\/strong> – opisy kliniczne i wskazówki diagnostyczne dla praktyków; (2) <strong>zielona<\/strong> – badawcze kryteria diagnostyczne dla naukowców; (3) wersja dla lekarzy pierwszego kontaktu. Kryteriów <strong>badawczych<\/strong> nie wolno używać w praktyce: zawierają kryteria wykluczające, by wybrać „czyste przypadki”, a współwystępowanie zaburzeń jest powszechne.<\/p>",

"q": "Czym jest klasyfikacja ICF i jak ma się do ICD?",
"a": "<p>Międzynarodowa klasyfikacja funkcjonowania, niepełnosprawności i zdrowia WHO (2001; ICF-CY dla dzieci, 2007), oparta na modelu biopsychospołecznym: niepełnosprawność to wynik związków stanu zdrowia z czynnikami osobowymi i środowiskowymi. Opisuje funkcjonowanie <strong>każdego<\/strong> człowieka. WHO zaleca używać jej <strong>komplementarnie<\/strong> z ICD: ICD opisuje zaburzenie, ICF jego wpływ na życie w danym kontekście.<\/p>",

"src": "Bednarek, rozdz. 9",
"q": "Na czym polega model rozbieżności IQ–osiągnięcia (AAD)?",
"a": "<p>Zakłada, że inteligencja koreluje z umiejętnościami szkolnymi; trudność w uczeniu się stwierdza się, gdy wynik ucznia w wystandaryzowanym teście (np. czytania) jest istotnie <strong>niższy niż oczekiwany<\/strong> dla jego wieku i IQ. Kryterium stosują ICD i DSM. W Polsce brakuje norm uwzględniających przedział IQ, a model nie uwzględnia zasobów.<\/p>",
"k": [

{
"src": "Bednarek, rozdz. 9",
"q": "Jakie są zalety i wady modelu odpowiedzi na interwencję (RtI) jako modelu diagnozy?",
"a": "<p>Trzy poziomy pomocy o rosnącej intensywności; kto nie reaguje, zostaje uznany za mającego specyficzne trudności. <strong>Zalety<\/strong>: tani, monitoruje wszystkich, przenosi akcent na metody nauczania. <strong>Wady<\/strong>: wiadomo tylko, że uczeń „nie reaguje” (<em>non-responder<\/em>), nic o przyczynach; te same strategie dla wszystkich; nie uwzględnia zasobów. Standardy zalecają gruntowną diagnozę niereagujących.<\/p>",
"k": [
"trzy poziomy",
"tani, monitoruje wszystkich",
"non-responders",
"brak przyczyn i zasobów"
],
"id": "edukacja/wyklad-3-fiszki:78f0b89f",
"unit": "trudnosci.html",
"sec": "d3"
},
{
"src": "Bednarek, rozdz. 9",
"q": "Dlaczego sztywna diagnoza nozologiczna może być szkodliwa w edukacji?",
"a": "<p>Nastawienie na „wyleczenie” frustruje, bo osoby o atypowym rozwoju realizują cele w swój sposób („miałem jeszcze na to papier”). Gdy dziecko nie spełnia kryteriów konkretnego zaburzenia, diagnoza bywa fiaskiem i nie daje pomocy – jakby pomoc należała się tylko osobom „posiadającym” zaburzenie. Wiele dostosowań zależy od symptomu, a nie od przyczyny.<\/p>",
"k": [
"frustracja „wyleczeniem”",
"brak etykiety = brak pomocy",
"dostosowania do symptomu"
],
"id": "edukacja/wyklad-3-fiszki:fd526a82",

"sec": "d3"
},
{

"q": "Czym jest diagnoza funkcjonalna i gdzie ją zakotwiczono w polskim prawie?",
"a": "<p>Wielowymiarowe, wielokontekstowe rozpoznanie funkcjonowania osoby w środowisku (zasoby i deficyty) oraz możliwości rozwoju i <strong>modyfikacji środowiska<\/strong>; opiera się na modelu biopsychospołecznym i teorii Bronfenbrennera. W Polsce: § 2 rozporządzenia MEN z 9.08.2017 – rozpoznawanie potrzeb, możliwości i czynników środowiskowych, by umożliwić pełne uczestnictwo.<\/p>",

"q": "Czym model PSW i diagnoza neuropsychologiczna różnią się od AAD i RtI?",
"a": "<p>Tworzą <strong>profil zasobów i ograniczeń<\/strong> w procesach poznawczych, służący szczegółowym zaleceniom dla nauczycieli; celem jest zrozumienie i jakość życia, a nie stwierdzenie syndromu. AAD i RtI służą głównie kwalifikacji do świadczeń i nie uwzględniają zasobów. Modele neuropsychologiczne (CHT, SNP/CHC, NDM) zakładają hierarchię procesów i brak „czystych” testów.<\/p>",
"k": [
"profil zasobów i ograniczeń",

{
"src": "Bednarek, rozdz. 9",
"q": "Dlaczego w diagnozie neuropsychologicznej nie można traktować wyniku jednego testu jako miary jednej funkcji?",
"a": "<p>Nie ma testów „czystych”: wynik testu pamięci obciążają uwaga i percepcja w danej modalności. Procesy są zorganizowane hierarchicznie, więc o zaburzeniu na danym piętrze wnioskuje się po ocenie pięter niższych. Funkcje są też złożone (uwaga słuchowa ≠ wzrokowa, odporność na dystraktory ≠ przerzutność), więc nie wolno uogólniać wyniku na „uwagę w ogóle”.<\/p>",
"k": [
"brak czystych testów",

"nie uogólniać"
],
