"src": "Trusz (2011)",
"q": "Czym jest samospełniające się proroctwo w edukacji i dlaczego jest groźne?",
"a": "<p>To sytuacja, w której pierwotnie <strong>nietrafne<\/strong> oczekiwania (za niskie lub za wysokie) rodziców czy nauczycieli, przez ich mniej lub bardziej intencjonalne zachowania, z czasem <strong>stają się rzeczywistością<\/strong>. Szczególnie groźne u dzieci rzekomo zaburzonych – oczekiwane ograniczenia mogą przejść w realną niepełnosprawność. Nawet mały efekt (r ≈ 0,2) oznacza zmianę u ok. 10% dzieci.<\/p>",
"k": [
"nietrafne oczekiwania",
"zachowania dorosłych",
"stają się rzeczywistością",
"r ≈ 0,2 → ok. 10% dzieci"
],
"id": "edukacja/wyklad-1-trusz-fiszki:cccb0cdd",
"unit": "wyklad-1-trusz.html",
"sec": "s1"
},
{
"src": "Trusz (2011)",
"q": "Opisz eksperyment Pigmaliona i jego wyniki.",
"a": "<p>Rosenthal i Jacobson (Oak School): wszystkich uczniów zbadano testem TOGA, nauczycielom powiedziano, że przewiduje on „rozkwit” intelektualny, i podano nazwiska <strong>losowo wybranych<\/strong> ok. 20% dzieci. Po 8 miesiącach dzieci z listy miały wyższy przyrost IQ (średnio +3,8 pkt), najsilniej w klasie I (+27,4 vs +12). Nauczyciele oceniali je też jako ciekawsze i szczęśliwsze; paradoksalnie dzieci z grupy kontrolnej, które zyskały na IQ, oceniano gorzej.<\/p>",
"k": [
"losowy wybór „rozkwitających”",
"manipulacja oczekiwaniami nauczycieli",
"wyższy przyrost IQ, najsilniej w klasie I",
"lepsza ocena zachowania; paradoks grupy kontrolnej"
],
"id": "edukacja/wyklad-1-trusz-fiszki:01392418",
"unit": "wyklad-1-trusz.html",
"sec": "s2"
},
{

"q": "Jak oceniano wyniki replikacji eksperymentu Pigmaliona?",
"a": "<p>Przeprowadzono ok. 500 replikacji. Spitz: na 19 eksperymentów do 1974 r. tylko 3 wykazały wpływ na IQ. Harris i Rosenthal: metaanalizy ponad 400 badań pokazują efekt o znaczeniu praktycznym – przeciętny w warunkach naturalnych, duży w eksperymentach. Brophy: oczekiwania wyjaśniają 3–10% wariancji osiągnięć, a wpływ może trwać latami.<\/p>",
"k": [
"ok. 500 replikacji",
"Spitz: mało udanych",
"metaanalizy: realny efekt",
"3–10% wariancji (Brophy)"
],
"id": "edukacja/wyklad-1-trusz-fiszki:0ab79ccd",
"unit": "wyklad-1-trusz.html",
"sec": "s2"
},
{
"src": "Trusz (2011)",
"q": "Czym jest efekt Golema? Omów badanie Rista.",
"a": "<p><strong>Efekt Golema<\/strong> to negatywna odmiana samospełniającego się proroctwa. Rist obserwował klasę, w której nauczycielka po 8 dniach podzieliła dzieci przy stolikach rzekomo według zdolności, a faktycznie według <strong>statusu społeczno-ekonomicznego<\/strong>. Faworyzowała stolik 1; dzieci z niego kpiły z innych, a dzieci ze stolików 2 i 3 zaczęły nazywać siebie „głupkami”. IQ się nie różniło, ale ucierpiały motywacja i relacje.<\/p>",
"k": [
"negatywna odmiana proroctwa",
"podział według SES",
"faworyzowanie i wrogość stolika 1",
"przejęcie hierarchii przez klasę"
],
"id": "edukacja/wyklad-1-trusz-fiszki:8081f584",
"unit": "wyklad-1-trusz.html",
"sec": "s3"
},
{
"src": "Trusz (2011)",
"q": "Jaką rolę w efekcie oczekiwań odgrywają autooczekiwania dziecka?",
"a": "<p>Dziecko dąży do <strong>spójności<\/strong> zachowania ze schematem „ja”: przy niskiej ocenie siebie działa poniżej możliwości i unika kontaktów (chłopiec z IQ 115–125, przekonany o niskich zdolnościach, osiągnął potem 85–100). Weinstein: osiągnięcia lepiej przewidują oczekiwania nauczyciela razem z autooczekiwaniami i <strong>dostrzeganym faworyzowaniem<\/strong>. Negatywne oczekiwania mogą prowadzić do wyuczonej bezradności.<\/p>",
"k": [
"spójność z obrazem „ja”",
"działanie poniżej możliwości",
"dostrzegane faworyzowanie",
"wyuczona bezradność"
],
"id": "edukacja/wyklad-1-trusz-fiszki:bb2dc0d5",
"unit": "wyklad-1-trusz.html",
"sec": "s3"
},
{
"src": "Trusz (2011)",
"q": "Na czym polega efekt akumulacji oczekiwań? Podaj przykłady badań nad rodzicami.",
"a": "<p>Gdy dziecko jest faworyzowane lub defaworyzowane w kilku środowiskach (szkoła i dom), łączna siła efektu rośnie (Jussim i Harber); etykiety mogą się sumować (piętna wielorakie). Englund i in.: oczekiwania matek zwiększały ich zaangażowanie w edukację, ale raczej wyniki dziecka wpływały na oczekiwania. Madon i in.: picie alkoholu przez dzieci najlepiej przewidywało przeszacowanie przez <strong>oboje<\/strong> rodziców – akumulacja dotyczyła tylko oczekiwań negatywnych.<\/p>",

"kumulacja wpływów z kilku środowisk",
"piętna wielorakie",
"Englund – zaangażowanie matek",
"Madon – alkohol, tylko negatywne"
],

"unit": "wyklad-1-trusz.html",

},

"q": "Jakie reguły pomagają ograniczyć negatywny efekt oczekiwań?",
"a": "<p>Szukać informacji o <strong>zachowaniach<\/strong> dziecka w różnych sytuacjach; <strong>zawieszać ocenę<\/strong>; informacje wieloznaczne interpretować na korzyść dziecka; pokazywać, że zdolności zależą od <strong>wysiłku<\/strong>; porażki przypisywać chwilowemu brakowi zaangażowania, a sukcesy zdolnościom; angażować wszystkie dzieci; dawać konstruktywne informacje zwrotne.<\/p>",

"src": "Slajdy W2",
"q": "Czym różni się efekt autooczekiwań od efektu oczekiwań interpersonalnych?",
"a": "<p><strong>Autooczekiwania<\/strong> to oczekiwania wobec siebie, które utrudniają lub ułatwiają osiągnięcie celu (samoutrudnianie, placebo). <strong>Oczekiwania interpersonalne<\/strong> to oczekiwania jednej osoby wobec zachowania innej, które doprowadzają do pojawienia się tego zachowania – działają jak samospełniające się proroctwo.<\/p>",
"k": [
"autooczekiwania: wobec siebie",
"samoutrudnianie, placebo",
"interpersonalne: wobec innej osoby",
"samospełniające się proroctwo"
],
"id": "edukacja/wyklad-1-trusz-fiszki:73fb25b0",
"unit": "wyklad-1-trusz.html",
"sec": "p1"
},
{
"src": "Slajdy W2",
"q": "Jakie są trzy etapy samospełniającego się proroctwa i dwa poziomy potwierdzenia oczekiwań?",
"a": "<p>Etapy: <strong>indukcja<\/strong> oczekiwań, <strong>mediacja (komunikacja)<\/strong> oczekiwań, <strong>behawioralne potwierdzenie<\/strong>. Potwierdzenie może być <strong>rzeczywiste<\/strong> (osoba naprawdę zmienia zachowanie) albo <strong>percepcyjne<\/strong> (obserwator widzi to, czego oczekiwał).<\/p>",
"k": [
"indukcja",
"komunikacja",
"potwierdzenie",
"rzeczywiste vs percepcyjne"
],
"id": "edukacja/wyklad-1-trusz-fiszki:a868514d",
"unit": "wyklad-1-trusz.html",
"sec": "p1"
},

"q": "Czym różni się efekt Galatei od efektu Golema?",
"a": "<p>Oba są odmianami efektu Pigmaliona. <strong>Galatea<\/strong>: wysokie oczekiwania nauczyciela bezpośrednio podnoszą kompetencje intelektualne i motywację ucznia. <strong>Golem<\/strong>: niskie oczekiwania obniżają kompetencje i motywację.<\/p>",
"k": [
"Galatea: wysokie oczekiwania → wzrost",
"Golem: niskie oczekiwania → spadek",
"kompetencje i motywacja"
],
"id": "edukacja/wyklad-1-trusz-fiszki:122e2bc8",
"unit": "wyklad-1-trusz.html",
"sec": "p2"
},

"src": "Slajdy W2",
"q": "Co pokazały badania Trouilloud i in. (2006) oraz Szumskiego i Karwowskiego (2019)?",
"a": "<p><strong>Trouilloud<\/strong> (WF, 421 uczniów): wczesne oczekiwania nauczycieli wiązały się z późniejszą postrzeganą kompetencją, zwłaszcza pozytywne, i silniej przy niskim wspieraniu autonomii. <strong>Szumski i Karwowski<\/strong> (matematyka, 1488 uczniów 13–15 lat): efekt działa też u starszych uczniów, indywidualnie i grupowo; niski SES klasy i liczba uczniów z problemami wiążą się z negatywnymi oczekiwaniami.<\/p>",
"k": [
"efekt poza poznaniem (WF)",
"silniej przy niskiej autonomii",
"także u nastolatków",
"poziom indywidualny i grupowy"
],

"unit": "wyklad-1-trusz.html",
"sec": "p2"
},

"src": "Slajdy W2",
"q": "Na czym polega pryzmat starszego rodzeństwa (Seaver, 1973)?",
"a": "<p>Oczekiwania nauczyciela wobec młodszego dziecka powstają na podstawie doświadczeń ze starszym rodzeństwem. Gdy uczy <strong>ten sam nauczyciel<\/strong>: dobre starsze rodzeństwo → efekt Galatei, słabe → efekt Golema. Przy <strong>innym nauczycielu<\/strong> efektu brak.<\/p>",
"k": [
"oczekiwania przez starsze rodzeństwo",
"ten sam nauczyciel: Galatea lub Golem",
"inny nauczyciel: brak efektu"
],
"id": "edukacja/wyklad-1-trusz-fiszki:93f45055",
"unit": "wyklad-1-trusz.html",
"sec": "p2"
},
{
"src": "Slajdy W2",
"q": "Jakie klasy zmiennych wyróżnia model Rosenthala?",
"a": "<p><strong>A<\/strong> – dalsze (moderator) i <strong>B<\/strong> – bliższe (oczekiwania): zmienne niezależne. <strong>C<\/strong> – zachowania osoby mającej oczekiwania: proces pośredniczenia. <strong>D<\/strong> – bliższe (bezpośrednie) i <strong>E<\/strong> – dalsze (długoterminowe) wyniki: zmienne zależne.<\/p>",
"k": [
"A moderator, B oczekiwania",
"C zachowanie nauczyciela",
"D skutki bezpośrednie",
"E skutki długoterminowe"
],
"id": "edukacja/wyklad-1-trusz-fiszki:21621120",
"unit": "wyklad-1-trusz.html",
"sec": "p3"
},

"unit": "wyklad-1-trusz.html",
"sec": "p3"
},
{

"q": "Czym są moderatory edukacyjnego proroctwa i jakie omówiono?",
"a": "<p>To czynniki decydujące o <strong>kierunku i sile<\/strong> wpływu oczekiwań na zachowania i osiągnięcia; działają na etapie indukcji, komunikowania i potwierdzania. Omówiono: prywatne teorie inteligencji, schematy „ja” i poczucie wartości uczniów, atrybucje nauczycieli i uczniów, spostrzegane podobieństwo nauczyciela do ucznia, cechy nauczycieli.<\/p>",

],
"id": "edukacja/wyklad-1-trusz-fiszki:af2f11b2",
"unit": "wyklad-1-trusz.html",
"sec": "p4"
},
{
"src": "Slajdy W2",
"q": "Jak prywatne teorie inteligencji nauczycieli wpływają na ich oczekiwania?",
"a": "<p>Nauczyciel, który uważa inteligencję za <strong>cechę stabilną<\/strong>, ma <strong>sztywne<\/strong> oczekiwania. Ten, który uważa zdolności za <strong>zmienne<\/strong>, ma oczekiwania <strong>elastyczne<\/strong>. Prywatne teorie inteligencji uczniów też wpływają na ich zachowanie.<\/p>",

"teorie uczniów też działają"

"src": "Slajdy W2",
"q": "Jak różnią się sprzężenia zwrotne wobec uczniów z wysokimi i niskimi oczekiwaniami?",
"a": "<p>Uczniowie z <strong>wysokimi<\/strong> oczekiwaniami dostają więcej pozytywnych i <strong>adekwatnych<\/strong> informacji zwrotnych, ale są też częściej karani za zachowania niezgodne z oczekiwaniami. Uczniowie z <strong>niskimi<\/strong> dostają więcej negatywnych i <strong>nieadekwatnych<\/strong> (pozytywnych i negatywnych).<\/p>",

"q": "Jakie wnioski dla praktyki płyną z badań nad efektem oczekiwań?",
"a": "<p>Efekt słabo wpływa na samo IQ, ale nie wolno go ignorować. Nauczyciel powinien znać wpływ swoich oczekiwań, budować je na <strong>różnych źródłach<\/strong>, być <strong>otwarty<\/strong> na informacje sprzeczne i szukać <strong>pozytywnych<\/strong> oczekiwań wobec każdego ucznia.<\/p>",
