"sec": "s5"
},
{
"q": "Jak zmienia się uwaga u dziecka w wieku szkolnym (Wygotski)?",
"a": "<p>Uwaga <strong>mimowolna<\/strong> przedszkolaka (nietrwała, przyciągana wyrazistymi bodźcami) staje się <strong>dowolna<\/strong>: rośnie udział woli, maleje impulsywność. Za Wygotskim proces regulowany z zewnątrz przez dorosłych staje się <strong>samoregulowany<\/strong>. Zależy też od temperamentu (ruchliwe: uwaga przerzutna i podzielna, flegmatyczne: długa koncentracja).<\/p>",
"src": "Wczesny wiek szkolny: od spostrzegania do myślenia pojęciowego",
"k": [
"mimowolna → dowolna",
"zewnętrzna → samoregulacja",
"rola temperamentu"
],
"id": "edukacja/cwiczenia-2-fiszki:f5dbcae1",
"unit": "cwiczenia-2.html",
"sec": "s5"
},
{
"q": "Jak rozwija się pamięć we wczesnym wieku szkolnym?",
"a": "<p>Od <strong>mechanicznej<\/strong> (nieintencjonalnej, bez rozumienia) do <strong>logicznej<\/strong> (ze zrozumieniem) i pierwszych strategii (powtarzanie, grupowanie, wskazówki, elaboracja). Pamięć bezpośrednia rośnie z 3–4 elementów u przedszkolaka do 6–7 pod koniec III klasy dzięki zmianie kodu z obrazowego na słowny.<\/p>",
"src": "Wczesny wiek szkolny: od spostrzegania do myślenia pojęciowego",
"k": [
"mechaniczna → logiczna",
"strategie niekonsekwentne",
"3–4 → 6–7 elementów",
"kod słowny"
],
"id": "edukacja/cwiczenia-2-fiszki:f956f7bd",
"unit": "cwiczenia-2.html",
"sec": "s5"
},
{
"q": "Jaką rolę ma język w gotowości szkolnej według Brzezińskiej i Bernsteina?",
"a": "<p>Wejście do szkoły to spotkanie rzeczywistości językowej domu i szkoły (Bernstein); różnice dotyczą sposobu postrzegania i interpretacji świata. Kompetencja językowa wiąże się z czytaniem, osiągnięciami matematycznymi i rozwojem emocjonalnym; rośnie <strong>metakomunikacja<\/strong> (refleksja nad własną wypowiedzią).<\/p>",
"src": "Wczesny wiek szkolny: od spostrzegania do myślenia pojęciowego",
"k": [
"Bernstein: dom a szkoła",
"język a czytanie i matematyka",
"metakomunikacja"
],
"id": "edukacja/cwiczenia-2-fiszki:9af070b0",
"unit": "cwiczenia-2.html",
"sec": "s5"
},
{
"q": "Czym jest odwracalność operacji umysłowych?",
"a": "<p>Przeprowadzanie operacji na reprezentacjach w <strong>dwóch kierunkach<\/strong> (jeśli A &gt; B, to B &lt; A; dodawanie i odejmowanie jako przeciwne), kluczowe ok. 7–10 r.ż. Umożliwia symulowanie manipulacji w głowie i zwiększa <strong>elastyczność poznawczą<\/strong> oraz refleksyjność.<\/p>",
"src": "Środkowy wiek szkolny: elastyczność myślenia i metapamięć",
"k": [
"operacje w obu kierunkach",
"7–10 r.ż.",
"niezależność od manipulacji",
"elastyczność"
],
"id": "edukacja/cwiczenia-2-fiszki:41518b15",
"unit": "cwiczenia-2.html",
"sec": "s6"
},
{
"q": "W jakiej kolejności dziecko opanowuje zasadę zachowania stałości?",
"a": "<p>Zachowanie <strong>liczby<\/strong> (ok. 5–6 r.ż.), <strong>ilości<\/strong> (ok. 8–9 r.ż.), <strong>objętości<\/strong> (ok. 11 r.ż.). Tempo zależy od środowiska i kultury.<\/p>",
"src": "Środkowy wiek szkolny: elastyczność myślenia i metapamięć",
"k": [
"liczba 5–6",
"ilość 8–9",
"objętość 11",
"wpływ kultury"
],
"id": "edukacja/cwiczenia-2-fiszki:43193cf6",
"unit": "cwiczenia-2.html",
"sec": "s6"
},
{
"q": "Co to zasada pojemności kategorii i czym różni się logika indukcyjna od dedukcyjnej w tym wieku?",
"a": "<p>Ok. 8 r.ż. dziecko rozumie, że podkategorie zawierają się w szerszej (żaby to płazy, płazy to zwierzęta). <strong>Indukcja<\/strong> (od przypadków do ogólnych zasad) jest dostępna; <strong>dedukcja<\/strong> (od ogółu do szczegółu, stawianie hipotez) pozostaje w sferze przyszłości.<\/p>",
"src": "Środkowy wiek szkolny: elastyczność myślenia i metapamięć",
"k": [
"hierarchia kategorii",
"indukcja tak",
"dedukcja jeszcze nie"
],
"id": "edukacja/cwiczenia-2-fiszki:f58e8ca1",
"unit": "cwiczenia-2.html",
"sec": "s6"
},
{
"q": "Co pokazało porównanie wyników 1976 z 2000 i 2003 (Shayer i in.)?",
"a": "<p>Dzieci <strong>później<\/strong> nabywają zasadę stałości: stałość wagi miało ok. 50% siedmiolatków w 1976, a ok. 30% w 2003 (efekt anty-Flynna).<\/p>",
"src": "Środkowy wiek szkolny: elastyczność myślenia i metapamięć",
"k": [
"1976: ok. 50%",
"2003: ok. 30%",
"późniejsze nabywanie stałości"
],
"id": "edukacja/cwiczenia-2-fiszki:27aad322",
"unit": "cwiczenia-2.html",
"sec": "s6"
},
{
"q": "Czym jest metapamięć i jak zmienia się stosowanie strategii pamięciowych?",
"a": "<p><strong>Metapamięć<\/strong> to wiedza i przekonania o własnej pamięci oraz kontrola zapamiętywania. U przedszkolaków to raczej życzenia (przeceniają się), w środkowym wieku szkolnym służy doborowi strategii. Strategii nie ma przed 5 r.ż., ok. 5 r.ż. dzieci używają ich po przypomnieniu dorosłego, między 8 a 10 r.ż. spontanicznie, a ok. 10 r.ż. systematycznie kategoryzują.<\/p>",
"src": "Środkowy wiek szkolny: elastyczność myślenia i metapamięć",
"k": [
"wiedza o własnej pamięci",
"przedszkolak: życzenia",
"8–10 r.ż. strategie spontaniczne",
"10 r.ż. kategoryzacja"
],
"id": "edukacja/cwiczenia-2-fiszki:c14c8239",
"unit": "cwiczenia-2.html",
"sec": "s6"
},
{
"q": "Co ustalono w badaniu dzieci z trudnościami w matematyce (Passolunghi)?",
"a": "<p>Dzieci około 9 r.ż. z trudnościami miały <strong>wyższy lęk (tylko w odniesieniu do matematyki)<\/strong> i <strong>mniejszą pojemność pamięci roboczej<\/strong>. Lęk mógł prowadzić do słabszego wykorzystania możliwości poznawczych.<\/p>",
"src": "Środkowy wiek szkolny: elastyczność myślenia i metapamięć",
"k": [
"lęk matematyczny",
"mniejsza pamięć robocza",
"słabsze wykorzystanie możliwości"
],
"id": "edukacja/cwiczenia-2-fiszki:2cbf50ac",
"unit": "cwiczenia-2.html",
"sec": "s6"
},
{
"q": "Jak zmienia się komunikacja dziecka ok. 6–9 r.ż.?",
"a": "<p>Ok. 6–7 r.ż. dziecko tłumaczy tak, jakby opisywało własne spostrzeżenia; ok. 9 r.ż. <strong>odróżnia swoją wiedzę od wiedzy innych<\/strong>, co umożliwia prawdziwą współpracę, spory i przekonywanie argumentami. Rosną słowotwórstwo i słownik (ok. 3000 słów rocznie).<\/p>",
"src": "Środkowy wiek szkolny: elastyczność myślenia i metapamięć",
"k": [
"6–7: własna perspektywa",
"9: perspektywa innych",
"współpraca i argumentowanie",
"słownik +3000 rocznie"
],
"id": "edukacja/cwiczenia-2-fiszki:78c65087",
"unit": "cwiczenia-2.html",
"sec": "s6"
},
{
"q": "Co to myślenie formalne (hipotetyczno-dedukcyjne) i jakie ma ograniczenia u nastolatków?",
"a": "<p>Operowanie <strong>pojęciami abstrakcyjnymi<\/strong> i hipotezami („co by było, gdyby…?”), analiza z wielu punktów widzenia. To dojrzewanie mózgu, ale także umiejętność, którą trzeba ćwiczyć. Nastolatki mają jednak <strong>gorszą pamięć wizualną i werbalną<\/strong> oraz wolniejszy czas reakcji niż dorośli.<\/p>",
"src": "Dorastanie: operacje formalne, idealizm i moralność",
"k": [
"pojęcia abstrakcyjne",
"hipotezy, dedukcja",
"trzeba ćwiczyć",
"słabsza pamięć niż u dorosłych"
],
"id": "edukacja/cwiczenia-2-fiszki:a77b8bf8",
"unit": "cwiczenia-2.html",
"sec": "s7"
},
{
"q": "Czym jest egocentryzm poznawczy nastolatka według Piageta?",
"a": "<p>Każde nowe osiągnięcie poznawcze widzi się najpierw z własnej perspektywy. Nastolatek traktuje <strong>logikę jako jedyne kryterium poprawności<\/strong>, więc gdy coś „nie zgadza się w równaniach”, chce zmieniać świat, a nie sposób myślenia. Słabnie przez praktyczne zaangażowanie (praca, relacje, grupa).<\/p>",
"src": "Dorastanie: operacje formalne, idealizm i moralność",
"k": [
"logika jedynym kryterium",
"zmieniać świat, nie myślenie",
"osłabia praktyczne zaangażowanie"
],
"id": "edukacja/cwiczenia-2-fiszki:14c77d6e",
"unit": "cwiczenia-2.html",
"sec": "s7"
},
{
"q": "Czym jest pryncypializm moralny i jak różnią się idealista i realista?",
"a": "<p><strong>Pryncypializm<\/strong> (sumienie irracjonalne): logika zastosowana do dobra i zła, nieprzejednane, surowe oceny. <strong>Idealista<\/strong> ocenia idee i osoby logiką i chce reformować świat; <strong>realista<\/strong> kieruje się dobrem i pożytecznością społeczną, logika służy mu do rozumienia i planowania, a praktyczne zaangażowanie przeważa nad deliberowaniem.<\/p>",
"src": "Dorastanie: operacje formalne, idealizm i moralność",
"k": [
"logika do oceny dobra i zła",
"idealista: logika, reformy",
"realista: dobro, praktyka"
],
"id": "edukacja/cwiczenia-2-fiszki:342c02a4",
"unit": "cwiczenia-2.html",
"sec": "s7"
},
{
"q": "Jak Kohlberg opisuje rozwój moralny we wczesnym i późnym dorastaniu?",
"a": "<p><strong>Wczesne:<\/strong> słuszne jest wypełnianie obowiązków i uczestnictwo w życiu grupy, perspektywa systemu, pod koniec pryncypializm. <strong>Późne:<\/strong> świadomość różnych i względnych wartości, łączenie perspektyw przez umowy, <strong>realizm moralny<\/strong>.<\/p>",
"src": "Dorastanie: operacje formalne, idealizm i moralność",
"k": [
"wczesne: obowiązki i system",
"późne: względność wartości",
"realizm moralny"
],
"id": "edukacja/cwiczenia-2-fiszki:895275c9",
"unit": "cwiczenia-2.html",
"sec": "s7"
},
{
"q": "Czym jest pragmatyzacja świadomości (Ziółkowski) i czym grozi?",
"a": "<p>Spostrzeganie rzeczywistości przez <strong>korzyść<\/strong>, celów przez <strong>rywalizację z rówieśnikami<\/strong> i ograniczanie ich do własnej sytuacji materialnej. Młodzi nie rozwijają myślenia systemowego (postformalnego) potrzebnego w dorosłości, a to ono jest podstawą solidarności społecznej.<\/p>",
"src": "Dorastanie: operacje formalne, idealizm i moralność",
"k": [
"korzyść i rywalizacja",
"cele materialne",
"brak myślenia systemowego"
],
"id": "edukacja/cwiczenia-2-fiszki:d085aad2",
"unit": "cwiczenia-2.html",
"sec": "s7"
},
{
"q": "Jak Kruszewski definiuje problem i dlaczego jest on „dla kogoś”?",
"a": "<p>Problem to np. struktura o niepełnych danych, konflikt między stanem istniejącym a pożądanym albo zadanie wymagające myślenia produktywnego. Jest <strong>podmiotowy<\/strong>: ta sama trudność bywa dla jednego zwykłym pytaniem (rozwiązanie w pamięci), dla innego problemem, dla innego nonsensem, zależnie od wiedzy i reprezentacji ucznia.<\/p>",
"src": "Kruszewski: uczenie się rozwiązywania problemów i praca z uczniami",
"k": [
"niepełne dane, konflikt, myślenie produktywne",
"zależy od wiedzy ucznia",
"zadanie vs problem vs nonsens"
],
"id": "edukacja/cwiczenia-2-fiszki:9e022bb9",
"unit": "cwiczenia-2.html",
"sec": "s8"
},
{
"q": "Czym różni się reprezentacja problemu u znawcy i nowicjusza?",
"a": "<p>Znawca opiera reprezentację na <strong>zasadniczych cechach i prawach<\/strong> (w fizyce: dynamika), a jego wiedza jest zorganizowana w zasady i pojęcia abstrakcyjne. Nowicjusz skupia się na <strong>cechach powierzchownych<\/strong> (blok, tarcie). Im lepsza reprezentacja, tym większa szansa rozwiązania.<\/p>",
"src": "Kruszewski: uczenie się rozwiązywania problemów i praca z uczniami",
"k": [
"znawca: zasady i prawa",
"nowicjusz: powierzchowne cechy",
"reprezentacja decyduje o rozwiązaniu"
],
"id": "edukacja/cwiczenia-2-fiszki:1ef37209",
"unit": "cwiczenia-2.html",
"sec": "s8"
},
{
"q": "Dlaczego rozwiązywanie problemu jest wynikiem i sposobem uczenia się, i jaką rolę ma transfer?",
"a": "<p>Rozwiązując problem uczymy się faktów, nazw, pojęć i zasad z jego przestrzeni, a zarazem wytwarzamy nowe reguły. Efektem powinien być <strong>transfer<\/strong> reguł i umiejętności na nowe sytuacje. Według Glasera myślenie to <strong>interakcja struktury wiedzy z procesem<\/strong>, więc umiejętność uogólnia się w ograniczonym zakresie i zależy od zorganizowanej wiedzy.<\/p>",
"src": "Kruszewski: uczenie się rozwiązywania problemów i praca z uczniami",
"k": [
"wynik i sposób uczenia",
"transfer",
"wiedza + proces (Glaser)",
"uogólnianie ograniczone"
],
"id": "edukacja/cwiczenia-2-fiszki:ee76e50b",
"unit": "cwiczenia-2.html",
"sec": "s8"
},
{
"q": "Jakie rodzaje problemów wyróżnia Kruszewski (odkryj/wynajdź, otwarte/zamknięte)?",
"a": "<p><strong>Odkryj<\/strong> (prawo, przyczyny), <strong>wynajdź<\/strong> (sposób, urządzenie), <strong>przenieś ze stanu w stan<\/strong> (zorganizuj obóz; wymaga planowania). <strong>Zamknięte<\/strong> mają zestaw rozwiązań i przepis, <strong>otwarte<\/strong> nie; otwarte są często źle określone. Najlepiej ćwiczyć na problemach źle określonych.<\/p>",
"src": "Kruszewski: uczenie się rozwiązywania problemów i praca z uczniami",
"k": [
"odkryj, wynajdź, ze stanu w stan",
"zamknięte vs otwarte",
"dobrze vs źle określone"
],
"id": "edukacja/cwiczenia-2-fiszki:f976f963",
"unit": "cwiczenia-2.html",
"sec": "s8"
},
{
"q": "Czym różnią się problemy konwergencyjne i dywergencyjne?",
"a": "<p><strong>Konwergencyjne<\/strong> mają jedno poprawne rozwiązanie (większość zadań z matematyki); błędna droga oznacza fałszywy wynik. <strong>Dywergencyjne<\/strong> mają wiele rozwiązań o różnej wartości (konkurs architektoniczny, przyczyny zdarzenia historycznego). Nauczyciel może „przerobić” konwergencyjny w dywergencyjny, podsuwając hipotezy do obalenia.<\/p>",
"src": "Kruszewski: uczenie się rozwiązywania problemów i praca z uczniami",
"k": [
"konwergencyjne: jedno rozwiązanie",
"dywergencyjne: wiele, różnej wartości",
"nauczyciel może zmienić charakter"
],
"id": "edukacja/cwiczenia-2-fiszki:d54289b4",
"unit": "cwiczenia-2.html",
"sec": "s8"
},
{
"q": "Jakie role pełni nauczyciel na lekcji problemowej i po co oddzielać generowanie hipotez od oceny?",
"a": "<p>Role: <strong>inspirator<\/strong>, <strong>organizator<\/strong> czynności i sytuacji, <strong>źródło informacji<\/strong> i <strong>sędzia<\/strong>. Faza <strong>generowania hipotez<\/strong> (np. burza mózgów) powinna być oddzielona od fazy <strong>oceny<\/strong>, żeby krytyka nie hamowała pomysłów. Lekcje problemowe są czasochłonne, a uczniowie pracują jak badacze.<\/p>",
"src": "Kruszewski: uczenie się rozwiązywania problemów i praca z uczniami",
"k": [
"inspirator, organizator, źródło informacji, sędzia",
"generowanie ≠ ocena (burza mózgów)",
"czasochłonne"
],
"id": "edukacja/cwiczenia-2-fiszki:8c4458d9",
"unit": "cwiczenia-2.html",
"sec": "s8"
},
{
"q": "Jak organizować pracę grupową według Kruszewskiego (wielkość, skład, ocena)?",
"a": "<p>Grupy po <strong>4–6 uczniów<\/strong> (3 osoby: szukanie sojusznika; 7+: trudna wymiana informacji). <strong>Heterogeniczne<\/strong> pomagają słabszym i uczą lepszych (transfer), homogeniczne pogłębiają różnice. Potrzebny lider (stały lub zmienny); ocena grupowa albo indywidualna zależnie od stylu wychowawczego. Podział zadań ma odpowiadać strukturze problemu.<\/p>",
"src": "Kruszewski: uczenie się rozwiązywania problemów i praca z uczniami",
"k": [
"4–6 osób",
"grupy heterogeniczne",
"lider",
"podział zgodny ze strukturą problemu"
],
"id": "edukacja/cwiczenia-2-fiszki:d55015a2",
"unit": "cwiczenia-2.html",
"sec": "s8"
},
{
"q": "Na czym polega pogadanka i dialog sokratejski?",
"a": "<p>Pogadanka to <strong>dialog nierównoprawnych stron<\/strong>: nauczyciel zna cel i ciąg logiczny, uczeń nie; obiektem jest <strong>uczeń zbiorowy<\/strong>. Wzorem jest dialog Sokratesa z Glaukonem: <strong>łańcuch krótkich pytań<\/strong>, dzięki któremu uczeń z posiadanej wiedzy buduje nowe struktury i sam dochodzi do wniosku. Przygotowanie: cel metodyczny, analiza merytoryczno-logiczna, nawiązanie do doświadczeń uczniów.<\/p>",
"src": "Kruszewski: uczenie się rozwiązywania problemów i praca z uczniami",
"k": [
"dialog nierównoprawny",
"uczeń zbiorowy",
"łańcuch krótkich pytań",
"nawiązanie do doświadczeń"
],
"id": "edukacja/cwiczenia-2-fiszki:8f7c47ee",
"unit": "cwiczenia-2.html",
"sec": "s8"
}
]
