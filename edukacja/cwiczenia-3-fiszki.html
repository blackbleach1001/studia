"src": "Olechowska",
"q": "Jak DSM-5 definiuje niepełnosprawność intelektualną i co zmienił względem wcześniejszych ujęć?",
"a": "<p>Zaburzenie neurorozwojowe zaczynające się w okresie rozwojowym, obejmujące deficyty w funkcjonowaniu intelektualnym i adaptacyjnym w obszarze koncepcyjnym, społecznym i praktycznym. Zmieniono nazwę (zamiast „upośledzenie umysłowe”) i zrezygnowano z granicy IQ 70 — liczy się też jakościowa ocena funkcjonowania.<\/p>",

"sec": "s1"
},
{

"a": "<p>Przy lekkim stopniu najtrudniej wskazać przyczynę, a nawet 1/3 przypadków ma przyczyny rodzinno-kulturowe: dziecko z dobrymi zadatkami może przez niekorzystne środowisko funkcjonować na poziomie lekkiej NI. Wczesna diagnoza i stymulacja mogą ten stan poprawić.<\/p>",

"wczesna stymulacja"

"sec": "s2"
},
{

"II słuchowo-językowa",
"III wzrokowa",
"IV rozumowanie"
],

"unit": "cwiczenia-3.html",
"sec": "s2"
},

"q": "Czym jest Syndrom Nieadekwatnych Osiągnięć Szkolnych?",

"q": "Jak wspierać ucznia zdolnego w szkole?",

{

"q": "Jak definiuje się dysleksję rozwojową i jakie trudności obejmuje?",
"a": "<p>Specyficzne trudności w czytaniu i pisaniu u dzieci o prawidłowym rozwoju umysłowym, spowodowane zaburzeniami funkcji poznawczych, motorycznych i ich integracji, uwarunkowanymi nieprawidłowym funkcjonowaniem układu nerwowego. Obejmuje dysleksję, dysortografię i dysgrafię.<\/p>",

"dysleksja, dysortografia, dysgrafia"

"unit": "cwiczenia-3.html",
"sec": "s6"
},
{

"q": "Co zmienił DSM-5 w ujęciu specyficznych zaburzeń uczenia się?",
"a": "<p>Połączył zaburzenia czytania, pisania i matematyki w jedną kategorię z trzema rodzajami objawów, wprowadził stopnie nasilenia (łagodne, umiarkowane, poważne) i uniezależnił rozpoznanie od IQ i rozbieżności IQ–wyniki.<\/p>",

"sec": "s6"
},
{
"src": "Olechowska",
"q": "Czym jest dyskalkulia rozwojowa i czym różni się od akalkulii i pseudodyskalkulii?",
"a": "<p>Dyskalkulia rozwojowa (Kosc): strukturalne zaburzenie zdolności matematycznych o podłożu genetycznym lub wrodzonym, bez zaburzenia ogólnych funkcji umysłowych. Akalkulia — utrata umiejętności po uszkodzeniu mózgu. Pseudodyskalkulia — trudności psychogenne.<\/p>",
"k": [
"Kosc 1974",
"akalkulia: uszkodzenie mózgu",

],

"unit": "cwiczenia-3.html",
"sec": "s6"
},

"q": "Czym różni się medyczny i społeczny model trudności w uczeniu się?",

"sec": "s6"
},
{

"q": "Jakie są główne teorie przyczyn dysleksji?",
"a": "<p>Neurogenne: genetyczna, nieprawidłowa budowa kory (bruzda Sylwiusza, planum temporale, wzgórze), atypowa lateralizacja, hipoteza hormonalna, deficyt wielkokomórkowy, deficyt fonologiczny i słuchowy, teoria móżdżkowa. Psychogenne — zaburzenia emocjonalne, dziś słabiej wspierane.<\/p>",

"teoria móżdżkowa",
"psychogenne"

"unit": "cwiczenia-3.html",
"sec": "s7"
},

"q": "Czy zaburzenia emocjonalne są przyczyną dysleksji?",
"a": "<p>Zwykle nie — są wtórne. Długotrwałe trudności o podłożu neurogennym prowadzą do utraty motywacji, spadku samooceny, unikania, a nawet fobii i lęków (Jaklewicz i Bogdanowicz, 1982).<\/p>",

"sec": "s7"
},
{
"src": "Olechowska",
"q": "Dlaczego diagnoza specyficznych trudności ma charakter eliminacyjny?",
"a": "<p>Trzeba wykluczyć inne przyczyny: wady wzroku i słuchu, choroby narządu ruchu, niepełnosprawność intelektualną, zaburzenia emocjonalne, zaniedbanie środowiskowe i złe nauczanie. Gdy któraś występuje, mówimy o trudnościach niespecyficznych.<\/p>",
"k": [
"wykluczenie innych przyczyn",
"trudności niespecyficzne"
],
"id": "edukacja/cwiczenia-3-fiszki:d5ca9799",
"unit": "cwiczenia-3.html",
"sec": "s8"
},
{
"src": "Olechowska",
"q": "Na czym polega reguła pierwiastka kwadratowego (Nicolson i Fawcett)?",
"a": "<p>Czas potrzebny dziecku z dysleksją na opanowanie umiejętności rośnie znacznie szybciej niż u rówieśników: zadanie wymagające 4 powtórzeń wymaga 8, a wymagające 400 — aż 8000. Dzieci te później widzą efekty, wolniej automatyzują i szybciej zapominają.<\/p>",
"k": [

"szybsze zapominanie"

"sec": "s8"
},

"q": "Co odróżnia specyficzne trudności w uczeniu się od zwykłych?",
"a": "<p>Występują u dzieci prawidłowo się rozwijających i dobrze uczonych, wymagają nieporównywalnie większego wysiłku i czasu, dają niższy poziom opanowania, nie poddają się łatwo usprawnianiu, a umiejętności szybko się zapomina.<\/p>",

"sec": "s8"
},

"a": "<p>Predyktory dają fałszywe alarmy: u Puolakanaho i in. dysleksja pojawiła się u 60% dzieci z grupy ryzyka i u 8% spoza niej. Etykieta może naznaczyć dziecko na całe życie, choć wczesna pomoc jest bardzo cenna.<\/p>",

"sec": "s8"
},

"sec": "s9"

{

"q": "Czym różni się ujęcie nadpobudliwości w ICD-10 i DSM-IV?",
"a": "<p>ICD-10 (F90, zaburzenia hiperkinetyczne): trzy grupy objawów (uwaga, nadruchliwość, impulsywność), bez podtypów. DSM-IV (ADHD): dwie grupy objawów i trzy podtypy — z przewagą zaburzeń uwagi, z przewagą nadpobudliwości i mieszany (najczęstszy).<\/p>",

"trzy podtypy",
"typ mieszany najczęstszy"
],
"id": "edukacja/cwiczenia-3-fiszki:a950718d",
"unit": "cwiczenia-3.html",
"sec": "s10"
},
{
"src": "Bogdanowicz",
"q": "Jak przebieg i obraz ADHD zależą od wieku i płci?",
"a": "<p>Młodsze dzieci: głównie nadruchliwość i impulsywność; starsze: problemy z uwagą. Objawy trwają w dorastaniu u 70%, w dorosłości u 30–50%. Chłopcy częściej typ mieszany lub z nadruchliwością, drażliwość i agresja; dziewczynki częściej typ z zaburzeniami uwagi, lękliwość i płaczliwość.<\/p>",
"k": [
"wiek: ruch → uwaga",
"70% w dorastaniu",
"chłopcy: nadruchliwość",
"dziewczynki: uwaga"
],
"id": "edukacja/cwiczenia-3-fiszki:c3761757",
"unit": "cwiczenia-3.html",
"sec": "s10"
},
{
"src": "Bogdanowicz",
"q": "Czym jest zahamowanie psychoruchowe?",
"a": "<p>Mało zbadane zaburzenie neurodynamiczne (ok. 5% populacji): trwałe wycofywanie się i niepodejmowanie aktywności, ograniczona spontaniczność ruchowa, zawężona aktywność poznawcza, silne emocje bez umiejętności ich wyrażania (pozorna obojętność).<\/p>",
"k": [
"wycofanie",
"silne emocje niewyrażane",
"ok. 5%"
],
"id": "edukacja/cwiczenia-3-fiszki:fd4e5d47",
"unit": "cwiczenia-3.html",
"sec": "s10"
},
{
"src": "Bogdanowicz",
"q": "Jak interpretować wynik IQ w granicach 70–84 w diagnozie trudności?",
"a": "<p>To inteligencja niższa od przeciętnej, ale wynik ten uzyskują też dzieci w normie, słabo stymulowane lub z dysharmonijnym rozwojem, u których wybiórcze deficyty zaniżają wynik. Diagnoza jest kliniczna, nie statystyczna: wynik testu to tylko jeden ze składników.<\/p>",
"k": [
"inteligencja niższa od przeciętnej",
"dysharmonijny rozwój",
"diagnoza kliniczna"
],
"id": "edukacja/cwiczenia-3-fiszki:75dc9597",
"unit": "cwiczenia-3.html",
"sec": "s11"
},
{
"src": "Bogdanowicz",
"q": "Jakie próby proponowała Nartowska do diagnozy nadpobudliwości?",
"a": "<p>Próbę bezruchu (dziecko ma minutę siedzieć bez ruchu) i próbę czekania (obserwacja przez minutę po prośbie o chwilę czekania). Większość dzieci nadpobudliwych nie potrafi ich wykonać.<\/p>",
"k": [
"próba bezruchu",
"próba czekania"
],
"id": "edukacja/cwiczenia-3-fiszki:b01cf429",
"unit": "cwiczenia-3.html",
"sec": "s11"
},
{

"q": "Czym jest terapia pedagogiczna i czym różni się od reedukacji?",
"a": "<p>Terapia pedagogiczna to uczenie czytania i pisania specjalistycznymi metodami połączone z korekcją zaburzonych funkcji i kompensacją (wspieraniem funkcji sprawnych). Reedukacja dotyczy przywracania utraconych umiejętności, np. po uszkodzeniu mózgu; w dysleksji nic nie zostało utracone.<\/p>",
"k": [

"kompensacja",
"reedukacja: utracone umiejętności",
"nauczyciel-terapeuta"
],
"id": "edukacja/cwiczenia-3-fiszki:6628ec51",
"unit": "cwiczenia-3.html",
"sec": "s12"
},

"q": "Opisz pięciopoziomowy system pomocy uczniom z dysleksją.",
"a": "<p>1) pomoc rodziców pod kierunkiem nauczyciela; 2) zespół korekcyjno-kompensacyjny; 3) terapia indywidualna; 4) klasy terapeutyczne; 5) stacjonarne oddziały terapeutyczne.<\/p>",
