{
"q": "Dlaczego autorka wybiera termin „psychologia edukacyjna”, a nie „wychowawcza” czy „wychowania”?",
"a": "<p>Z dwóch powodów: potrzeby nawiązania do głównego nurtu refleksji i badań międzynarodowych (ang. <em>educational psychology<\/em>) oraz instytucjonalnego charakteru procesu edukacji. Ani „wychowawcza”, ani „wychowania” nie mają jednoznacznego odpowiednika w języku angielskim.<\/p>",
"src": "Dlaczego „psychologia edukacyjna”?",
"id": "edukacja/fiszki:967ffdf1",
"unit": "wyklad-1.html",
"sec": "s1"
},
{
"q": "Czym w rozdziale różni się wychowanie od edukacji (kształcenia)?",
"a": "<p>Wychowanie odbywa się głównie (choć nie tylko) w kontekście <strong>domowym<\/strong> i dotyczy kształtowania zachowania. Edukacja (kształcenie) odbywa się głównie (choć nie tylko) w kontekście <strong>instytucjonalnym<\/strong> i dotyczy umiejętności szkolnych i akademickich. Dawniej „wychowanie” obejmowało jedno i drugie; z czasem pole znaczeniowe się rozszczepiło.<\/p>",
"src": "Dlaczego „psychologia edukacyjna”?",
"id": "edukacja/fiszki:8c0f5e98",
"unit": "wyklad-1.html",
"sec": "s1"
},
{
"q": "Czym psychologia kształcenia różni się od psychologii edukacyjnej?",
"a": "<p>Psychologia kształcenia obejmuje część teoretyczno-koncepcyjną i badania podstawowe nad nabywaniem umiejętności szkolnych i akademickich, a aspekty praktyczne w znacznie mniejszym stopniu. Psychologię edukacyjną wyróżnia <strong>aplikacyjny kontekst<\/strong>: jest dyscypliną stosowaną.<\/p>",
"src": "Dlaczego „psychologia edukacyjna”?",
"id": "edukacja/fiszki:d386a5fd",
"unit": "wyklad-1.html",
"sec": "s1"
},
{
"q": "Jakim celom służy psychologia edukacyjna jako dyscyplina stosowana?",
"a": "<p>Podnoszeniu dobrostanu uczniów w ogóle, rozwiązywaniu problemów behawioralnych w placówkach edukacyjnych i optymalizowaniu efektów uczenia się u wszystkich kształcących się, szczególnie w grupach doświadczających trudności i barier. W wielu krajach wymaga odrębnego kształcenia podyplomowego.<\/p>",
"src": "Dlaczego „psychologia edukacyjna”?",
"id": "edukacja/fiszki:e57d99b8",
"unit": "wyklad-1.html",
"sec": "s1"
},
{
"q": "Czy psychologia szkolna to to samo co psychologia edukacyjna?",
"a": "<p>Nie. Psychologia szkolna <strong>nie wyczerpuje<\/strong> zakresu psychologii edukacyjnej, ale nie ma powodu unikać tego terminu: jest częstym tytułem podręczników anglojęzycznych (Song i in., 2019; Lee, 2005). W Polsce bywa unikany, choć tłumaczenie podręcznika Greena wydano już 50 lat temu.<\/p>",
"src": "Psychologia edukacyjna, szkolna i dziecka",
"id": "edukacja/fiszki:d1d3b36d",
"unit": "wyklad-1.html",
"sec": "s2"
},
{
"q": "Czym psycholog edukacyjny różni się od psychologa klinicznego dziecka, skoro mają tych samych klientów?",
"a": "<p>Kontekstem instytucjonalnym i zadaniami. <strong>Edukacyjny:<\/strong> placówki edukacyjne (szkoła, poradnia psychologiczno-pedagogiczna), zmiany nieco bardziej zewnętrzne, w strategiach wychowawczych. <strong>Kliniczny:<\/strong> opieka zdrowotna, zdrowie psychiczne, sytuacja rodzinna; głębsze zmiany emocjonalne i w relacjach w rodzinie. Gdy potrzeby dziecka wykraczają poza kompetencje, psycholog edukacyjny po wstępnym rozpoznaniu <strong>przekierowuje<\/strong> klienta do klinicznego.<\/p>",
"src": "Psychologia edukacyjna, szkolna i dziecka",
"id": "edukacja/fiszki:456c49b5",
"unit": "wyklad-1.html",
"sec": "s2"
},
{
"q": "Jaką tezę o relacji do psychologii dziecięcej ryzykuje autorka?",
"a": "<p>Że psychologia edukacyjna jest <strong>subdyscypliną psychologii dziecięcej<\/strong>, bo ma znacznie węższy zakres pracy. W diagnozie dodatkowo specjalizuje się w specjalnych potrzebach edukacyjnych i współpracuje z pedagogami przeprowadzającymi diagnozę.<\/p>",
"src": "Psychologia edukacyjna, szkolna i dziecka",
"id": "edukacja/fiszki:7235cee6",
"unit": "wyklad-1.html",
"sec": "s2"
},
{
"q": "Jak nazywa się psycholog w Wielkiej Brytanii i USA i jak ma się to do Polski?",
"a": "<p><strong>Wielka Brytania:<\/strong> psycholog edukacyjny, specjalista spoza szkoły, opiekujący się rejonem i kilkoma szkołami, działający po „zgłoszeniu”. <strong>USA:<\/strong> psycholog szkolny, związany z lokalizacją w szkole, mniej reagujący na zgłoszenia, bardziej proaktywnie współpracujący z placówką. <strong>Polska:<\/strong> połączenie obu: psycholog rejonowy w poradni (jak w UK) i psycholog szkolny (jak w USA).<\/p>",
"src": "Psychologia edukacyjna, szkolna i dziecka",
"id": "edukacja/fiszki:bf88b999",
"unit": "wyklad-1.html",
"sec": "s2"
},
{
"q": "Czym pedagogika różni się od psychologii edukacyjnej i gdzie się spotykają?",
"a": "<p>Pedagogika to dyscyplina akademicka o odrębnej tradycji: kształtuje wizje edukacji, odpowiada, czym edukacja ma być, określa jej cele i analizuje wyzwania. Stawia podobne pytania o proces edukacji, ale inne metody i narzędzia. W praktyce psycholog współpracuje z pedagogiem szkolnym, terapeutą pedagogicznym, pedagogiem specjalnym i nauczycielem przedmiotowym. Obszar spotkania: <strong>polityka edukacyjna<\/strong>.<\/p>",
"src": "Dyscypliny pokrewne",
"id": "edukacja/fiszki:5e3420c4",
"unit": "wyklad-1.html",
"sec": "s3"
},
{
"q": "Czym są studia edukacyjne i jaką analogię stawia autorka?",
"a": "<p>Interdyscyplinarne podejście empiryczne, odrębne teoretycznie i metodologicznie od pedagogiki osadzonej w myśli filozoficznej. Analogia: <strong>psychologia edukacyjna ma się do psychologii kształcenia i wychowawczej tak, jak edukacja do studiów edukacyjnych i pedagogiki<\/strong>; obie są praktycznym zastosowaniem wiedzy z dziedzin podstawowych.<\/p>",
"src": "Dyscypliny pokrewne",
"id": "edukacja/fiszki:a07a98d6",
"unit": "wyklad-1.html",
"sec": "s3"
},
{
"q": "Dlaczego zdrowie publiczne jest dyscypliną pokrewną psychologii edukacyjnej?",
"a": "<p>Zdrowie publiczne to zarazem nauka i działalność publiczna z wyraźnym systemem wartości; zapobiega chorobom i poprawia jakość życia w wymiarze społecznym i środowiskowym, a nie leczy pojedynczych osób. Psychologia edukacyjna podejmuje podobne wyzwania w węższym zakresie: tragiczny stan zdrowia psychicznego dzieci (Sajkowska, 2017; Krokstad, 2021) wymaga intensyfikacji opieki psychologicznej w populacji szkolnej i rozwiązań systemowych.<\/p>",
"src": "Dyscypliny pokrewne",
"id": "edukacja/fiszki:8d323404",
"unit": "wyklad-1.html",
"sec": "s3"
},
{
"q": "Dlaczego psychologia edukacyjna jest „hybrydą” i co znaczy cytat o „najokrutniejszym froncie”?",
"a": "<p>Jako dyscyplina aplikacyjna łączy interdyscyplinarnie wiele podejść, teorii i ram konceptualnych, odpowiadając na pilne potrzeby społeczne. Szulevicz i Tanggaard (2017) nazywają ją „jednym z najokrutniejszych frontów współczesnej psychologii”. Ich podręcznik jest ceniony m.in. dlatego, że opisuje stan faktyczny praktyki zamiast narzucać oderwane od realiów teorie.<\/p>",
"src": "Czym jest psychologia edukacyjna",
"id": "edukacja/fiszki:94c55298",
"unit": "wyklad-1.html",
"sec": "s4"
},
{
"q": "Jak Reynolds i Miller (2003) określają zakres psychologii edukacyjnej i jakie wyróżniają działy?",
"a": "<p>Zakres: zastosowanie zasad psychologii do badania procesów uczenia się i rozwoju w kontekście systemu edukacji. Pięć działów: (1) poznawcze wyznaczniki uczenia się i rozwoju, (2) procesy socjokulturowe i relacyjne w nauczaniu, (3) realizacja podstawy programowej, (4) nietypowi uczniowie, (5) programy i polityka edukacyjna.<\/p>",
"src": "Czym jest psychologia edukacyjna",
"id": "edukacja/fiszki:de62b986",
"unit": "wyklad-1.html",
"sec": "s4"
},
{
"q": "Czym różnią się model teoretyczny, ramy konceptualne i ramy praktyczne?",
"a": "<p><strong>Model / ramy teoretyczne:<\/strong> teorie ekspertów jako baza do interpretacji danych empirycznych. <strong>Ramy konceptualne:<\/strong> termin szerszy, czyli konceptualizacja całości projektu badawczego (temat, problem, pytania, literatura, metodologia, analiza, wnioski), bardziej indywidualna. <strong>Ramy praktyczne (wykonawcze):<\/strong> seria kroków i etapów stosowania modelu teoretycznego; dotyczą dyscypliny stosowanej i <strong>wypełniają lukę<\/strong> między modelami a ich skutecznym zastosowaniem.<\/p>",
"src": "Modele teoretyczne i ramy praktyczne",
"id": "edukacja/fiszki:ecb314b7",
"unit": "wyklad-1.html",
"sec": "s5"
},
{
"q": "Jakie korzyści dają ramy praktyczne i jakie cechy postulują ich twórcy?",
"a": "<p><strong>Korzyści:<\/strong> przejrzysta struktura złożonych problemów, jednoznaczne związki wyników diagnozy z planem interwencji, mniej niepotrzebnych działań diagnostycznych i arbitralnych zaleceń, lepsza jakość usług i satysfakcja praktyków. <strong>Cechy:<\/strong> transparentność i odpowiedzialność: rama jest znana i akceptowana przez wszystkich uczestników (psychologów, rodziców, ucznia, nauczycieli, placówkę), co służy szacunkowi, podmiotowemu traktowaniu i współpracy.<\/p>",
"src": "Modele teoretyczne i ramy praktyczne",
"id": "edukacja/fiszki:c0640471",
"unit": "wyklad-1.html",
"sec": "s5"
},
{
"q": "Na czym polega podejście pragmatyczne w psychologii edukacyjnej?",
"a": "<p>Model, który w interpretacji problemu i szukaniu rozwiązań kieruje się <strong>przewidywaną w danym kontekście skutecznością<\/strong> zastosowania teorii lub ram. Problem można konceptualizować na wiele sposobów, a więcej niż jedno rozwiązanie może być skuteczne; wybór ma być elastyczny, nie arbitralny, i odwoływać się do zasobów w kontekście. W praktyce po wstępnej konsultacji psycholog decyduje o potrzebach klienta i ścieżce postępowania.<\/p>",
"src": "Podejście pragmatyczne",
"id": "edukacja/fiszki:7799f905",
"unit": "wyklad-1.html",
"sec": "s6"
},
{
"q": "Co oznacza metafora bricoleura (majsterkowicza) i jaką cechę psychologa podkreślają badania SWPS?",
"a": "<p>Majsterkowicz rozwiązuje różne problemy praktyczne dostępnymi środkami, niekoniecznie do tego przeznaczonymi ani doskonałymi, żeby rozwiązać problem skutecznie. Wymaga to kreatywności i otwartości na niestandardowe rozwiązania (Burnham, 2013; Szulevicz i Tanggaard, 2017). W badaniach SWPS (Czeranowska, 2022a) doświadczeni psychologowie wskazują <strong>kreatywność<\/strong> jako kluczowy przymiot.<\/p>",
"src": "Podejście pragmatyczne",
"id": "edukacja/fiszki:537016f0",
"unit": "wyklad-1.html",
"sec": "s6"
},
{
"q": "Jakie obszary działania psychologa wymienia rozdział i dlaczego „zgłoszenie” to nie jedyny wariant pracy?",
"a": "<p><strong>Diagnoza<\/strong> dziecka i środowiska (określenie barier, modyfikacja kontekstu), <strong>wsparcie<\/strong> (psychoedukacja, negocjacje, poradnictwo, elementy terapii, interwencja w kryzysie), <strong>przekierowanie lub współpraca<\/strong> z innymi specjalistami. Często „sprawą” jest sytuacja (np. przemoc rówieśnicza w klasie), a psycholog może i powinien <strong>proaktywnie<\/strong> tworzyć optymalne środowisko i prewencję.<\/p>",
"src": "Podejście pragmatyczne",
"id": "edukacja/fiszki:ae065c2a",
"unit": "wyklad-1.html",
"sec": "s6"
},
{
"q": "Do jakiej refleksji zachęcają Katra i Sokołowska (2010) oraz Wicks (2013)?",
"a": "<p><strong>Katra i Sokołowska:<\/strong> psychologowie szkolni mają się zastanowić, jakie modele i ramy pracy wybierają w realnych sytuacjach i czym się kierują: naturą wyzwania czy własnymi preferencjami. <strong>Wicks:<\/strong> z pozycji konstruktywizmu społecznego psychologowie mają osobiste opinie o tym, z jakich podejść korzystać, więc powinni zastanowić się, jak ich przekonania, doświadczenia, postawy i przygotowanie zawodowe wpływają na wybory; ramy w praktyce są bardzo zróżnicowane.<\/p>",
"src": "Podejście pragmatyczne",
"id": "edukacja/fiszki:1b058ff0",
"unit": "wyklad-1.html",
"sec": "s6"
}
]
