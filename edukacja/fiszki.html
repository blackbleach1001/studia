"src": "Slajdy W1",
"q": "Kto był pionierem psychologii edukacji na świecie i w Polsce?",
"a": "<p>Świat: <strong>William James, John Dewey, Edward L. Thorndike<\/strong>; badania etniczne – <strong>Mamie Phipps Clark i Kenneth Clark<\/strong>. Polska: <strong>Aniela Szycówna<\/strong> i <strong>Jan Władysław Dawid<\/strong>; „Przegląd Pedagogiczny” (1882), „Polskie Archiwum Psychologii” (1926), Zakład Psychologii Wychowawczej UW (1927/28), Katedra Psychologii Pedagogicznej UJ (1928), „Psychologia Wychowawcza” (1938).<\/p>",
"k": [
"James, Dewey, Thorndike",
"Clarkowie – badania etniczne",
"Szycówna, Dawid",
"Przegląd Pedagogiczny 1882"
],
"id": "edukacja/fiszki:79cbaea2",
"unit": "wyklad-1.html",
"sec": "p3"
},
{
"src": "Slajdy W1",
"q": "Na czym opiera się behawioralne podejście do edukacji i wychowania?",
"a": "<p>Stosowana analiza zachowania: dziecko zachowuje się tak, bo ten sposób okazał się w przeszłości <strong>korzystny<\/strong>. Zachowania niepożądane są <strong>wyuczone<\/strong>, więc można ich oduczyć. Przyczyny leżą w <strong>środowisku<\/strong>, które trzeba uwzględnić w modyfikacji. Zachowania kształtuje się przez <strong>wzmocnienia<\/strong>.<\/p>",
"k": [
"zachowanie było korzystne",
"wyuczone → można oduczyć",
"przyczyny w środowisku",
"wzmocnienia"
],
"id": "edukacja/fiszki:3d61cc0f",
"unit": "wyklad-1.html",
"sec": "p4"
},
{
"src": "Slajdy W1",
"q": "Jakie trzy elementy wiążą teorie społeczno-poznawcze i co zalicza się do czynników wewnętrznych?",
"a": "<p><strong>Środowisko, zachowanie i czynniki wewnętrzne<\/strong> wpływają na siebie nawzajem. Czynniki wewnętrzne to przekonania, oczekiwania, motywacja, cele, wartości i emocje.<\/p>",
"k": [
"środowisko",
"zachowanie",
"czynniki wewnętrzne",
"wzajemny wpływ"
],
"id": "edukacja/fiszki:a96c1598",
"unit": "wyklad-1.html",
"sec": "p4"
},
{
"src": "Slajdy W1",
"q": "Jakie dwie koncepcje konstruktywistyczne omówiono na wykładzie?",
"a": "<p><strong>Poznawczo-rozwojowa<\/strong>: struktura poznawcza zmienia się dzięki procesom regulacyjnym, zaburzenie równowagi napędza rozwój, a edukacja go stymuluje. <strong>Przetwarzania informacji<\/strong>: psychika jako układ przetwarzający informacje o ograniczonej pojemności i wydajności; stąd m.in. technologie w nauczaniu.<\/p>",
"k": [
"poznawczo-rozwojowa: zaburzenie równowagi",
"edukacja stymuluje rozwój",
"przetwarzanie informacji",
"pojemność i wydajność"
],
"id": "edukacja/fiszki:1900d830",
"unit": "wyklad-1.html",
"sec": "p4"
},
{
"src": "Slajdy W1",
"q": "Czym różnią się badania opisowe, korelacyjne, eksperymentalne i ewaluacyjne w psychologii edukacji?",
"a": "<p><strong>Opisowe<\/strong> rejestrują zachowania i postawy, ale nie mówią o przyczynach. <strong>Korelacyjne<\/strong> pokazują związek i pozwalają przewidywać, ale nie przyczynowość (permisywność a niska samokontrola). <strong>Eksperymentalne<\/strong>: losowy przydział do grup, manipulacja zmienną niezależną (np. program zarządzania czasem), pomiar zależnej (oceny). <strong>Ewaluacyjne<\/strong>: skuteczność programów i ocenianie efektów uczenia się (sprawdzające, różnicujące).<\/p>",
"k": [
"opisowe: bez przyczyn",
"korelacyjne: związek, nie przyczyna",
"eksperyment: losowy przydział",
"ewaluacyjne: skuteczność programów"
],
"id": "edukacja/fiszki:18a5fe2d",
"unit": "wyklad-1.html",
"sec": "p5"
},
{
"src": "Slajdy W1",
"q": "Jakie są rodzaje obserwacji i inne metody opisowe w psychologii edukacji?",
"a": "<p>Obserwacja <strong>laboratoryjna, w naturalnym środowisku, uczestnicząca<\/strong> (np. Crowley i in., 2001: rodzice częściej wyjaśniali zjawiska naukowe chłopcom). Inne: wywiady i kwestionariusze, testy, badania psychofizjologiczne, studia przypadków, badania etnograficzne, grupy fokusowe, dzienniki.<\/p>",
"k": [
"laboratoryjna, naturalna, uczestnicząca",
"wywiady, kwestionariusze, testy",
"studia przypadków, etnografia",
"fokusy, dzienniki"
],
"id": "edukacja/fiszki:329c0757",
"unit": "wyklad-1.html",
"sec": "p5"
},
{
"src": "Slajdy W1",
"q": "Jaki jest zakres, cel i kluczowe obszary badań psychologii edukacji?",
"a": "<p><strong>Zakres<\/strong>: strona ucznia (uczeń, proces, strategie i sytuacja uczenia się) i nauczyciela (nauczyciel, treść, sposób i sytuacja nauczania, ewaluacja). <strong>Cel<\/strong>: fakty i metody do rozwiązywania problemów dydaktycznych, postawa naukowa, wykorzystanie psychologii w wychowaniu i edukacji. <strong>Obszary<\/strong>: procesy poznawcze, emocjonalno-społeczne, różnice indywidualne, uwarunkowania rozwoju i wychowania.<\/p>",
"k": [
"strona ucznia i nauczyciela",
"fakty i metody, postawa naukowa",
"poznawcze, emocjonalno-społeczne",
"różnice indywidualne, uwarunkowania"
],
"id": "edukacja/fiszki:287af86d",
"unit": "wyklad-1.html",
"sec": "p6"
},
{
"src": "Bednarek, rozdz. 5",
"q": "Czym jest praktyka oparta na dowodach i skąd się wywodzi?",
"a": "<p>To podejmowanie decyzji o konkretnym kliencie na podstawie <strong>najlepszych dostępnych dowodów<\/strong> z badań, zintegrowanych z <strong>doświadczeniem praktyka<\/strong> i <strong>preferencjami klienta<\/strong>. Wywodzi się z <strong>medycyny opartej na dowodach<\/strong> (lata 80. XX w.): diagnoza → wybór metody na podstawie danych o skuteczności i skutkach ubocznych → monitorowanie i modyfikacja (Sackett i in.).<\/p>",
"k": [
"najlepsze dowody + doświadczenie + preferencje",
"medycyna, lata 80.",
"diagnoza, wybór, monitorowanie"
],
"id": "edukacja/fiszki:cc2aa11c",
"unit": "wyklad-1.html",
"sec": "e1"
},
{
"src": "Bednarek, rozdz. 5",
"q": "Ile czasu mija między wykazaniem skuteczności metody a jej stosowaniem w praktyce?",
"a": "<p>W medycynie średnio około <strong>17 lat<\/strong> (od 10 do 25; Balas i Boren): ok. 10 lat do podręczników i kolejne ok. 9 lat do upowszechnienia. Przy nowych technologiach nawet do 50 lat. W psychologii brak danych, ale nie ma powodu sądzić, że jest lepiej.<\/p>",
"k": [
"ok. 17 lat",
"10–25 lat",
"najpierw podręczniki, potem praktyka"
],
"id": "edukacja/fiszki:9251ff74",
"unit": "wyklad-1.html",
"sec": "e1"
},
{
"src": "Bednarek, rozdz. 5",
"q": "Co bierze pod uwagę psycholog, wybierając strategię działania według APA?",
"a": "<p>(1) <strong>Wiarygodność dowodów<\/strong>, (2) <strong>indywidualne cechy klienta<\/strong> (w tym preferencje i wartości), (3) <strong>własne doświadczenie zawodowe<\/strong>. Kodeks APA wymaga też informowania klienta, na ile metody są zweryfikowane empirycznie (standardy 2.04, 2.01e, 10.01b).<\/p>",
"k": [
"wiarygodność dowodów",
"cechy klienta",
"własne doświadczenie",
"informowanie klienta"
],
"id": "edukacja/fiszki:cab2f808",
"unit": "wyklad-1.html",
"sec": "e2"
},
{
"src": "Bednarek, rozdz. 5",
"q": "Wymień poziomy hierarchii wiarygodności dowodów od najsłabszego.",
"a": "<p>Brak badań (konsensus ekspertów) → badania opisowe (obserwacja, studia przypadków) → wstępne testowanie skuteczności (np. eksperymenty jednoprzypadkowe) → zagregowane dane z sytuacji naturalnej (np. PISA) → badania procesu i wyniku → skuteczność w warunkach naturalnych (<em>effectiveness<\/em>) → testowanie skuteczności (<em>efficacy<\/em>: quasi-eksperyment, RCT) → synteza wielu badań (przegląd, systematyczny przegląd, <strong>metaanaliza<\/strong>).<\/p>",
"k": [
"brak badań, opisowe",
"wstępne testowanie, dane naturalne",
"process–outcome, effectiveness",
"efficacy: RCT; metaanaliza"
],
"id": "edukacja/fiszki:0f0c1cee",
"unit": "wyklad-1.html",
"sec": "e2"
},
{
"src": "Bednarek, rozdz. 5",
"q": "Czym różni się efficacy od effectiveness?",
"a": "<p><strong>Efficacy<\/strong> to skuteczność w optymalnych, kontrolowanych („laboratoryjnych”) warunkach, z wykazanym związkiem przyczynowym. <strong>Effectiveness<\/strong> to skuteczność w warunkach realnego życia (np. w poradni), z wieloma niekontrolowanymi zmiennymi – pokazuje wartość ekologiczną metody.<\/p>",
"k": [
"efficacy: warunki kontrolowane",
"effectiveness: realne życie",
"wartość ekologiczna"
],
"id": "edukacja/fiszki:346c9566",
"unit": "wyklad-1.html",
"sec": "e2"
},
{
"src": "Bednarek, rozdz. 5",
"q": "Czym różni się quasi-eksperyment od RCT i czym jest metaanaliza?",
"a": "<p><strong>RCT<\/strong>: losowy przydział do grup, manipulacja, grupa kontrolna, pomiar przed i po. <strong>Quasi-eksperyment<\/strong>: bez losowego przydziału (np. jedna metoda w klasie A, druga w klasie B), nieznacznie mniej wiarygodny. <strong>Metaanaliza<\/strong>: statystyczna synteza wyników wielu badań – jej wartość zależy od jakości badań źródłowych.<\/p>",
"k": [
"RCT: losowość, grupa kontrolna",
"quasi: bez losowania",
"metaanaliza: synteza statystyczna",
"jakość badań źródłowych"
],
"id": "edukacja/fiszki:a9f19a32",
"unit": "wyklad-1.html",
"sec": "e2"
},
{
"src": "Bednarek, rozdz. 5",
"q": "Jakie zarzuty stawia się praktyce opartej na dowodach w edukacji i jak odpowiada na nie Bednarek?",
"a": "<p><strong>Epistemologiczny<\/strong>: wąskie rozumienie dowodu, tylko RCT – fałsz, APA uznaje całą hierarchię. <strong>Standaryzacja<\/strong>: utożsamianie z testami zewnętrznymi – testy nie wynikają z EBP, a badania pokazują ich szkody. <strong>Autonomia<\/strong>: „książka kucharska” – autonomia praktyka jest podstawą EBP. <strong>Redukcjonizm<\/strong>: „ta sama pigułka” – EBP wymaga indywidualizacji i monitorowania. <strong>Prakseologiczny<\/strong>: model medyczny nie pasuje – EBP szuka skutecznej drogi od stanu wyjściowego do docelowego.<\/p>",
"k": [
"epistemologiczny",
"standaryzacja i testy",
"autonomia nauczyciela",
"redukcjonizm, wykonalność"
],
"id": "edukacja/fiszki:da6790f2",
"unit": "wyklad-1.html",
"sec": "e3"
},
{
"src": "Bednarek, rozdz. 5",
"q": "Jakie skutki mają standardowe testy zewnętrzne według badań (Harlen i Deakin-Crick)?",
"a": "<p>Zawężenie nauczania do prostych, łatwo mierzalnych umiejętności kosztem myślenia twórczego i krytycznego; przesunięcie celu edukacji na wynik testu; spadek <strong>motywacji wewnętrznej<\/strong>; negatywny obraz siebie i lęk u uczniów z niskimi wynikami. W nauce języków: <strong>efekt wymywania<\/strong> (<em>washback<\/em>) – koncentracja na tym, co sprawdza test.<\/p>",
"k": [
"zawężenie nauczania",
"spadek motywacji wewnętrznej",
"lęk, niski obraz siebie",
"efekt wymywania"
],
"id": "edukacja/fiszki:4358e397",
"unit": "wyklad-1.html",
"sec": "e3"
},
{
"src": "Bednarek, rozdz. 5",
"q": "Czego uczy przykład upuszczania krwi w teście na praktykę opartą na dowodach?",
"a": "<p>Upuszczanie krwi wynikało z przyjętej teorii (humoralnej), było rekomendowane przez autorytety i powszechnie akceptowane, a niektórym pacjentom się poprawiało – ale teoria i skuteczność nie były zweryfikowane empirycznie. Wniosek: zgodność z teorią, autorytety i powszechność <strong>nie czynią praktyki opartej na dowodach<\/strong>.<\/p>",
"k": [
"teoria + autorytety + powszechność",
"brak weryfikacji empirycznej",
"to nie jest EBP"
],
"id": "edukacja/fiszki:07d4ee99",

"sec": "e4"
}
