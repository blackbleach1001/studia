cy systematycznej oceny osiągnięć ucznia, dostarczający jednocześnie informacji na temat poprawy tych osiągnięć, według koncepcji Blooma dokonuje oceny:","a":["formatywnej","sumarycznej","podsumowującej","diagnostycznej"],"c":0},{"id":"e6","n":6,"g":"e1","q":"Badania pokazują, że głównym źródłem lęku u dzieci w wieku szkolnym jest:","a":["sytuacja oceniania w szkole","porównanie zasobów finansowych rodzin uczniów","brak posiadania najnowszych telefonów","żadna z pozostałych odpowiedzi nie jest poprawna"],"c":0},{"id":"e7","n":7,"g":"e1","q":"Współcześnie język opisu używany w literaturze edukacyjnej:","a":["Zawsze odzwierciedla szacunek dla indywidualności uczniów","Operuje czasem takimi etykietującymi terminami jak \"uczeń inteligentny\", \"przeciętny\", \"słaby\"","Żadna z pozostałych odpowiedzi nie jest prawidłowa","Operuje czasem takimi etykietującymi terminami jak \"debil\", \"kretyn\", \"idiota\""],"c":1},{"id":"e8","n":8,"g":"e1","q":"Proces określania umiejętności uczniów na początku jakiegoś etapu nauczania w celu zdecydowania, od jakiego punktu należy zacząć nazywamy:","a":["oceną rozpoznawczą","oceną diagnostyczną","oceną końcową","oceną bieżącą"],"c":1},{"id":"e9","n":9,"g":"e1","q":"Procedura testowania porównująca osiągnięcia jednostki z obiektywnymi celami, które miały być osiągnięte, to:","a":["pomiar zorientowany na normy","pomiar zorientowany na kryterium","pomiar zorientowany na klienta","pomiar zorientowany na cel"],"c":1},{"id":"e10","n":10,"g":"e1","q":"Cele kształcenia wskazujące kierunki dążenia ucznia to:","a":["cele operacyjne","cele ogólne","cele kierunkowe","cele szczegółowe"],"c":2,"f":"niepewne"},{"id":"e11","n":11,"g":"e1","q":"Dokonanie oceny kilku osób lub prac po sobie, która sprawia że pierwsza dobra ocena spowoduje obniżenie kolejnych, to:","a":["efekt halo","efekt kontrastu","efekt kolejności","zjawisko upodobnienia"],"c":1},{"id":"e12","n":12,"g":"e1","q":"Przyczyną zaburzenia zachowania ujawniające się w relacjach dzieci z rówieśnikami, są:","a":["relacje dzieci - dorośli","relacje dzieci - dorośli i starsze rodzeństwo","przeświadczenie o braku uzdolnień","słabe ukształtowanie obrazu własnej osoby"],"c":0,"f":"niepewne"},{"id":"e13","n":13,"g":"e1","q":"Psychologia edukacji zajmuje się:","a":["zastosowaniem psychologii rozwoju do wyjaśniania i wspomagania procesów edukacyjnych","zastosowaniem psychologii w kształceniu pedagogów","zastosowaniem wiedzy o procesach poznawczych w procesie uczenia się","zastosowaniem wiedzy o emocjach w czasie uczenia się"],"c":0,"f":"niepewne"},{"id":"e14","n":14,"g":"e1","q":"Ogólne cele kształcenia:","a":["wskazują kierunki dążenia ucznia","wskazują kierunki dążenia nauczyciela","nie mają znaczenia dla celów operacyjnych","wyznaczane są przez podstawę programową każdego przedmiotu"],"c":0},{"id":"e15","n":15,"g":"e1","q":"W trakcie oceniania osiągnięć szkolnych może wystąpić pułapka oceniania w postaci efektu kontrastu / aureoli. Polega on na tym, że:","a":["Mężczyźni mają tendencję do wyższego oceniania uczennic, a kobiety mają tendencję do wyższego oceniania uczniów","To, co silnie odróżnia się od otoczenia (odmienny wygląd, swoisty akcent, rażący błąd w tekście) mocno wpływa na ogólne wrażenie","Dodatnia ocena przenosi się niepostrzeżenie z jednej właściwości człowieka (wyglądu, zachowania, osiągnięć w jednym przedmiocie szkolnym) na inne właściwości (moralność, motywacja, osiągnięcia w innym przedmiocie)","Potępia się osobę, która ma inne zdanie"],"c":2,"e":"Odpowiedź dla efektu aureoli. Gdyby pytanie dotyczyło efektu kontrastu – odpowiedź b."},{"id":"e16","n":16,"g":"e1","q":"W badaniach naukowych ważne jest, żeby wyniki tych badań były:","a":["replikowane i poddawane dyskusji","publikowane tylko te, których hipotezy podstawowe są odrzucone","publikowane tylko te, których hipotez podstawowych nie ma podstaw do odrzucenia","w ciekawy sposób opisane dla potencjalnego czytelnika"],"c":0},{"id":"e17","n":17,"g":"e1","q":"Zgodnie z konstruktywistycznym podejściem w psychologii edukacji","a":["nauczanie powinno wyprzedzać rozwój","wychowanie powinno wspierać rozwój potencjału","wychowanie ma usprawniać proces adaptacji do środowiska","oddziaływania wychowawcze i edukacyjne stymulują proces rozwoju"],"c":3},{"id":"e18","n":18,"g":"e1","q":"Ujemna korelacja między permisywnym sposobem nauczania i poziomem samokontroli uczniów oznacza, że","a":["permisywny sposób nauczania obniża poziom samokontroli uczniów","uczniowie z niskim poziomem samokontroli sprawiają, że nauczyciel staje się bardziej pobłażliwy","znając poziom samokontroli uczniów możemy przewidzieć sposób nauczania","permisywny sposób nauczania i niski poziom samokontroli uczniów obniżają ich osiągnięcia"],"c":2},{"id":"e19-A","n":19,"g":"e1","q":"Badania ewaluacyjne w psychologii edukacji dotyczą","a":["rozwijania postawy naukowej opartej na rozwiązywaniu problemów","skuteczności sposobów weryfikacji efektów uczenia się","interpretacji zachowań kulturowych mających wpływ na proces edukacji","unikalnych przypadków"],"c":1},{"id":"e19-B","n":19,"g":"e1","q":"Badania ewaluacyjne w psychologii edukacji dotyczą","a":["ewolucji systemów oświatowych","skuteczności sposobów weryfikacji efektów uczenia się","interpretacji zachowań kulturowych mających wpływ na proces edukacji","ewaluacji psychologów szkolnych"],"c":1},{"id":"e20","n":20,"g":"e1","q":"Jeśli młodszy brat trafia do tego samego nauczyciela, który uczył starszego brata o niskich osiągnięciach, może wystąpić efekt","a":["Rosenthala","Golema","Galatei","poprawne są odpowiedzi a i b"],"c":1},{"id":"e21","n":21,"g":"e1","q":"W badaniach dotyczących roli efektu Pigmaliona w stymulowaniu entuzjazmu uczniów do gry na fortepianie stwierdzono","a":["dodatnią korelację między poziomem zachęcania do gry przez nauczyciela i entuzjazmem uczniów do gry na fortepianie","ujemną korelację między poziomem zachęcania do gry przez nauczyciela i entuzjazmem uczniów do gry na fortepianie","że zachęcanie do gry przez nauczyciela zwiększa entuzjazm uczniów do gry na fortepianie","że zachęcanie do gry przez nauczyciela nie ma związku z entuzjazmem uczniów do gry na fortepianie"],"c":0},{"id":"e22","n":22,"g":"e1","q":"Co to jest program ukryty w edukacji?","a":["propaganda polityczna ukryta np. w podręcznikach od historii","przekazywanie postaw, wartości i oczekiwań przez szkołę w pośredni sposób poprzez standardową edukację","ocenianie uczniów przez pryzmat ich środowiska społecznego","edukacja odbywająca się poza szkołą, np. w grupie rówieśniczej czy w domu"],"c":1},{"id":"e23","n":23,"g":"e1","q":"Prawidłowo zaprojektowane cele edukacyjne będą","a":["mierzalne i trudne do osiągnięcia","zrozumiałe, angażujące i atrakcyjne","pozwalały przyswajać wiedzę bez żadnego wysiłku","stawiać niezrozumiałe wymagania dla polegowania wysiłku intelektualnego"],"c":1},{"id":"e24","n":24,"g":"e1","q":"Zaznacz prawidłowo zdefiniowane zachowanie","a":["dziecko nie słucha rodziców ani nauczycieli","dziecko zachowuje się agresywnie względem rówieśników","dziecko rozrzuca jedzenie, a następnie zrzuca talerz ze stołu w trakcie posiłków","wszystkie odpowiedzi są prawidłowe"],"c":2},{"id":"e25","n":25,"g":"e1","q":"Do pionierów psychologii edukacji zalicza się","a":["W. Wundta","W. Jamesa","J. B. Watsona","wszystkich wymienionych"],"c":3,"f":"niepewne"},{"id":"e26","n":26,"g":"e1","q":"Zgodnie z humanistycznym podejściem w psychologii edukacji","a":["nauczanie powinno wyprzedzać rozwój","wychowanie powinno wspierać rozwój potencjału","wychowanie traktowane jest jako adaptacja do środowiska","oddziaływania wychowawcze i edukacyjne stymulują proces rozwoju"],"c":1},{"id":"e27","n":27,"g":"e1","q":"Celem psychologii edukacji jest","a":["wykorzystywanie wiedzy psychologicznej w rozwiązywaniu problemów wychowawczych i edukacyjnych","prowadzenie badań, których wyniki można wykorzystać w edukacji","wyjaśnianie i opisywanie mechanizmów osobowości","prawidłowe są odpowiedzi a i b"],"c":3},{"id":"e28","n":28,"g":"e1","q":"W klasycznym eksperymencie Rosenthala i Jacobsona (1968) zaobserwowano","a":["słaby efekt Galatei w szóstych klasach i brak efektu w klasach pierwszych","silny efekt Galatei w pierwszych klasach i brak efektu w klasach szóstych","słaby efekt Golema w szóstych klasach i brak efektu w klasach pierwszych","silny efekt Golema w pierwszych klasach i brak efektu w klasach szóstych"],"c":1},{"id":"e29","n":29,"g":"e1","q":"Z polskich badań (Szumski i in., 2019) dotyczących efektu oczekiwań interpersonalnych w kontekście edukacji wynika, że","a":["efekt występuje wyłącznie u uczniów szkół podstawowych","efekt występuje w zakresie nauczania historii, ale nie występuje w nauczaniu matematyki","efekt występuje zarówno na poziomie indywidualnym, jak i grupowym","wszystkie wymienione odpowiedzi są prawidłowe"],"c":2},{"id":"e30","n":30,"g":"e1","q":"Różnice międzypłciowe w zakresie umiejętności wzrokowo-przestrzennych (wyższe u chłopców) mogą być wynikiem","a":["biologicznych predyspozycji","czynników genetycznych","wpływu społeczno-kulturowego na nauczanie od dzieciństwa umiejętności","Żadne z powyższych"],"c":2,"f":"niepewne"},{"id":"e31","n":31,"g":"e1","q":"Badania międzykulturowe nad edukacją pokazują, że","a":["Lęk przed matematyką występuje tylko u osób z krajów o niskim PKB","Lęk przed matematyką występuje tylko u osób z krajów o wysokim PKB","Lęk przed matematyką występuje u osób z krajów o różnym poziomie rozwoju gospodarczego","Nie badano zjawiska lęku przed matematyką w badaniach międzykulturowych"],"c":2},{"id":"e32","n":32,"g":"e2","q":"Skuteczność modyfikacji zachowania poprzez warunkowanie sprawcze zależna jest od tego, czy nauczyciel ma możliwość oferowania uczniom aktywności wysoce przez nich preferowanych, jako konsekwencji wykonywania czynności nisko preferowanych. Zjawisko to opisywane jest przez:","a":["Zasadę Watsona","Zasadę Skinnera","Zasadę Pawłowa","Zasadę Premacka"],"c":3},{"id":"e33","n":33,"g":"e2","q":"Przedszkolak, który po raz pierwszy znajduje się w nowym środowisku, wykonuje szereg różnorodnych zachowań. Nauczycielka uśmiecha się lub chwali niektóre z nich, a na inne reaguje z dezaprobatą. Po pewnym czasie przedszkolak część zachowań wykonuje częściej, a z innych całkowicie rezygnuje. Proces ten nazywamy:","a":["Analizą zachowania","Warunkowaniem klasycznym","Warunkowaniem reaktywnym","Warunkowaniem sprawczym"],"c":3},{"id":"e34","n":34,"g":"e2","q":"Jest rok 1979. Jesteś uczestnikiem badania, w którym uczysz się słów z języka hiszpańskiego. Trafiasz do grupy eksperymentalnej, której zadaniem jest nauczyć się zestawu słów w trakcie sześciu sesji treningowych wykonywanych jednego dnia. Pozostałe dwie grupy eksperymentalne również mają sześć sesji treningowych, ale odbywają się one albo w kolejnych dniach, albo co 30 dni. W trakcie sesji treningowej masz wrażenie, że dość szybko uczysz się zadanego materiału, jednak w momencie testu kryterialnego, który odbywa się 30 dni po sesji treningowej, Twoje prawidłowe odpowiedzi spadają do poziomu:","a":["ok 80%","ok 65%","ok 50%","ok 30%"],"c":2,"f":"niepewne"},{"id":"e35","n":35,"g":"e2","q":"Behawiorystyczne podejście do uczenia się, którego kulminacją jest zindywidualizowany, kierowany przez ucznia program uczenia się sprawnościowego najlepiej nadaje się do:","a":["Uczenia zwierząt innych niż ludzie","Nauki przedmiotów każdego rodzaju","Nauki przedmiotów o niskim poziomie organizacji treści, jak historia, literatura, filozofia, z uwagi na jego zindywidualizowany charakter","Nauki przedmiotów o wysokim poziomie organizacji treści i standaryzacji procedur oraz zadań konwergencyjnych, jak chemia, podstawowa matematyka, nauki techniczne"],"c":3},{"id":"e36","n":36,"g":"e2","q":"Badanie Riener i Wagner (2021) pokazało, że (a) uczniowie z ocenami od 1 do 3 (w systemie niemieckim) preferują niespodziankę jako nagrodę za poprawę wyników na egzaminie, (b) uczniowie z ocenami od 4 do 5 preferują list do rodziców, (c) uczniowie o wyższym statusie socjoekonomicznym preferują list do rodziców jako nagrodę.","a":["Zdanie \"b\" jest poprawne","Zdania \"a\" i \"c\" są poprawne","Zdania \"a\", \"b\" oraz \"c\" są poprawne","Zdania \"a\" i \"b\" są poprawne"],"c":3,"f":"niepewne"},{"id":"e37","n":37,"g":"e2","q":"Badania Zaromb i wsp. (2010) dotyczące skuteczności zapamiętywania wieloznacznego tekstu (trudnego do odgadnięcia bez znajomości kontekstu) pokazały, że (a) swobodne odpamiętywanie jest dwa razy lepsze wtedy, gdy uczeń podejmuje samodzielnie próbę zrozumienia takiego tekstu, niż gdy od razu otrzymuje jego wyjaśnienie, (b) swobodne odpamiętywanie tekstów trudnych jest lepsze wtedy, gdy uczeń otrzymuje informację zwrotną o sensie tekstu, niż wtedy, gdy nie otrzymuje w ogóle takiej informacji.","a":["Zdania \"a\" i \"b\" NIE są poprawne","Zdanie \"b\" jest poprawne","Zdanie \"a\" jest poprawne","Zdania \"a\" i \"b\" są poprawne"],"c":3,"f":"niepewne"},{"id":"e38","n":38,"g":"e2","q":"Badania neurobiologiczne nad mechanizmami motywacyjnymi, które współdzielimy z innymi gatunkami sugerują, że dotychczas w zbyt dużym stopniu pomijano motywacje związane z (a) potrzebami estetycznymi, (b) potrzebą transcendencji, (c) mechanizmami poszukiwania partnerów seksualnych, (d) mechanizmami opieki rodzicielskiej.","a":["Prawidłowe jest zdanie \"d\"","Prawidłowe są zdania \"b\" i \"c\"","Prawidłowe są zdania \"a\", \"c\" i \"d\"","Prawidłowe są zdania \"c\" i \"d\""],"c":3},{"id":"e39","n":39,"g":"e2","q":"Uczeń X ma wysoką skłonność do ryzyka, co przewiduje podchodzenie do egzaminów również w sytuacji nieprzygotowania, natomiast uczeń Y charakteryzuje się wysoką sumiennością, która przewiduje wysiłek. Biorąc pod uwagę, że uczniowie potocznie wnioskują, że na sukces akademicki składają się dwa komponenty \"talent\" i \"wysiłek\", bardzo prawdopodobny jest proces w którym:","a":["Uczeń X zacznie dokonywać atrybucji zewnętrznych i zmiennych swoich sukcesów, a uczeń Y będzie dokonywać atrybucji zewnętrznych i stałych swoich sukcesów","Uczeń X zacznie dokonywać atrybucji wewnętrznych i zmiennych swoich sukcesów, a uczeń Y będzie dokonywać atrybucji wewnętrznych i stałych swoich sukcesów","Uczeń X zacznie dokonywać atrybucji zewnętrznych i stałych swoich sukcesów, a uczeń Y będzie dokonywać atrybucji zewnętrznych i zmiennych swoich sukcesów","Uczeń X zacznie dokonywać atrybucji wewnętrznych i stałych swoich sukcesów, a uczeń Y będzie dokonywać atrybucji wewnętrznych i zmiennych swoich sukcesów"],"c":3},{"id":"e40","n":40,"g":"e2","q":"Wykonana przez Freemana i zespół metaanaliza badań dotyczących efektywności \"pasywnego słuchania wykładów\" vs \"aktywnego uczenia się w obszarze STEM\" pokazała, że aktywne uczenie się zmniejsza średnią liczbę studentów, którzy nie zaliczają danego przedmiotu:","a":["Z ok 20% do ok 10%","Z ok 50% do ok 35%","Z ok 35% do ok 20%","Z ok 60% do ok 50%"],"c":2},{"id":"e41","n":41,"g":"e2","q":"Teoria autodeterminacji (Ryan i Deci), w wersji z 2000 roku, zawiera następujące style regulacji: (a) regulacja zewnętrzna, (b) regulacja introjekcyjna, (c) regulacja zintegrowana, (d) regulacja wewnętrzna.","a":["Prawidłowe są odpowiedzi \"c\" i \"d\"","Prawidłowe są odpowiedzi \"a\" i \"d\"","Prawidłowe są odpowiedzi \"a\", \"b\" i \"d\"","Prawidłowe są wszystkie odpowiedzi od \"a\" do \"d\""],"c":3},{"id":"e42","n":42,"g":"e2","q":"Teoria oczekiwań-wartości uwzględnia następujące komponenty: (a) oczekiwanie sukcesu, (b) subiektywną wartość zadania, (c) wspomnienia afektywne, (d) stereotypy dotyczące ról płciowych, (e) zaspokojenie potrzeb fizjologicznych.","a":["Teoria oczekiwań-wartości uwzględnia komponenty \"a\", \"b\" i \"e\"","Teoria oczekiwań-wartości uwzględnia komponenty \"a\", \"b\" i \"d\"","Teoria oczekiwań-wartości uwzględnia komponenty \"a\", \"b\", \"c\" i \"d\"","Teoria oczekiwań-wartości uwzględnia wszystkie komponenty od \"a\" do \"e\""],"c":2},{"id":"e43","n":43,"g":"e2","q":"Zgodnie z badaniami Tay i Dienera (2011), w perspektywie globalnej, częstotliwość doznawania emocji pozytywnych i negatywnych jest istotnie zależna od zaspokojenia potrzeb:","a":["Fizjologicznych, bezpieczeństwa, afiliacji, statusu, poznawczych i samo-aktualizacji","Fizjologicznych, bezpieczeństwa, afiliacji, statusu i poznawczych","Fizjologicznych, bezpieczeństwa, afiliacji i statusu","Fizjologicznych, bezpieczeństwa i afiliacji"],"c":0,"f":"niepewne"},{"id":"e44","n":44,"g":"e2","q":"Cel sprawnościowy to nastawienie na osiągnięcie sprawności w danej dziedzinie. Cel wykonaniowy to nastawienie na porównanie z innymi, osiągnięcie pozycji w hierarchii. Oceń następujące warunki zadania względem ich wpływu na obydwa rodzaje celów: (a) zadania są zróżnicowane dla różnych osób, (b) uznanie jest prywatne, (c) dostosowanie się do harmonogramu jest warunkiem zaliczenia, (d) ocena dokonywana jest względem poprzednich wykonań.","a":["Warunki \"c\" i \"d\" nastawiają uczniów na cel wykonaniowy","Warunki \"a\" i \"c\" nastawiają uczniów na cel wykonaniowy","Warunki \"a\" i \"d\" nastawiają uczniów na cel sprawnościowy","Warunki \"a\", \"b\", \"d\" nastawiają uczniów na cel sprawnościowy"],"c":3},{"id":"e45","n":45,"g":"e2","q":"Przeprowadzone w roku 2020 w USA tzw. \"megastudy\" dotyczące interwencji mających na celu poprawę częstotliwości korzystania z siłowni pokazało, że: (a) badania psychologiczne słabo się replikują, (b) ok 50% krótkoterminowych interwencji psychologicznych przyniosło istotne, pozytywne efekty, (c) specjaliści przewidujący wyniki tego typu badań znacznie przeceniają skuteczność interwencji, (d) najbardziej skuteczne okazało się nagradzanie uczestników za powrót do ćwiczeń po przerwie.","a":["Zdania \"c\" i \"d\" są poprawne","Wszystkie zdania są poprawne","Zdania \"b\", \"c\" i \"d\" są poprawne","Zdania \"a\", \"b\" i \"c\" są poprawne"],"c":2,"f":"niepewne"},{"id":"e46","n":46,"g":"e2","q":"Profesor X i Profesor Y uczą tego samego przedmiotu, stosują dokładnie te same zadania i materiały, ale uczą inną metodą. Studenci Profesora X byli bardzo wzburzeni bezpośrednio po zajęciach, ponieważ ich zdaniem prezentowany materiał był trudniejszy, mniej się nauczyli i odpowiedzieli poprawnie na mniejszą liczbę pytań, niż studenci Profesora Y. Gdy miesiąc później studenci musieli zaliczyć niezapowiedziany, trudny i realistyczny test z tego przedmiotu, studenci Profesora X wypadli jednak istotnie lepiej niż studenci Profesora Y.","a":["Opisana sytuacja sugeruje, że Profesor X mógł być bardziej sympatyczny (ang. friendly) od Profesora Y","Opisana sytuacja sugeruje, że Profesor X mógł być bardziej wymagający (ang. demanding) od Profesora Y","Opisana sytuacja sugeruje, że Profesor Y mógł zastosować metodę polegającą na ćwiczeniach przeplatanych (ang. interleaved)","Opisana sytuacja sugeruje, że Profesor X mógł zastosować metodę polegającą na ćwiczeniach przeplatanych (ang. interleaved)"],"c":3},{"id":"e47","n":47,"g":"e2","q":"Stosowanie \"notatek macierzowych\" jest skuteczne ponieważ:","a":["Wymusza myślenie macierzowe, które jest przejawem myślenia systemowego","Jest metodą rozłożoną w czasie, wymagającą wielu powtórzeń","Nawiązuje do mnemotechnik, takich jak metoda loci","Nawiązuje do strategii elaboracji polegającej na generowaniu wyjaśnień przyczynowych, w szczególności na porównywaniu i przeciwstawianiu sobie informacji"],"c":3},{"id":"e48","n":48,"g":"e2","q":"Maria obserwuje niezrozumiałe zachowanie grupy ludzi i stara się wywnioskować ich intencje, Stefan obserwuje tą samą grupę ludzi, ale wcześniej dowiaduje się od swojej koleżanki jakie są ich zamiary.","a":["Stefan z łatwością rozumie sytuację, zatem zapewne dobrze ją zapamięta","Maria ma trudności ze zrozumieniem intencji tej grupy ludzi, zatem zapewne szybko zapomni o tym wydarzeniu","Stefan musi korzystać ze strategii elaboracji i generowania wyjaśnień przyczynowych, zatem zapewne na dłużej niż Maria zapamięta zachowanie tej grupy ludzi","Maria musi korzystać ze strategii elaboracji i generowania wyjaśnień przyczynowych, zatem zapewne na dłużej niż Stefan zapamięta zachowanie tej grupy ludzi"],"c":3},{"id":"e49","n":49,"g":"e2","q":"Strategie mnemotechniczne, wyobrażeniowe takie jak \"metoda loci\", \"akronimy\", \"słowa-klucze\" to: (a) strategie uczenia się o niskiej użyteczności, (b) strategie uczenia się mające pewne zastosowanie przy zadaniach prostych (np. zapamiętanie słów), (c) strategie bardziej skuteczne przy uczeniu się materiału konkretnego, a nie abstrakcyjnego.","a":["Zdanie \"c\" jest poprawne","Zdania \"a\" i \"b\" są poprawne","Zdanie \"b\" jest poprawne","Zdania \"a\", \"b\" oraz \"c\" są poprawne"],"c":3},{"id":"e50","n":50,"g":"e2","q":"Strategie powtarzania, takie jak \"podkreślanie\" lub \"wielokrotne czytanie\": (a) Nie są w ogóle skuteczne w zakresie zapamiętywania, (b) Wpływają na egzogenne procesy uwagowe, (c) Pomagają w rozumieniu znaczenia i wiązaniu nowych informacji z istniejącą wiedzą.","a":["Zdanie \"c\" jest poprawne","Zdania \"b\" i \"c\" są poprawne","Zdanie \"b\" jest poprawne","Zdania \"a\", \"b\" oraz \"c\" są poprawne"],"c":2,"f":"niepewne"},{"id":"e51","n":51,"g":"e2","q":"Biorąc pod uwagę, że powtarzanie skomasowane jest mniej efektywne od powtarzania rozłożonego w czasie:","a":["Uczenie się poprzez realizację intensywnych modułów, organizowanych w 1-2 dni szkoleniowe, jest najbardziej skuteczną metodą kształcenia","Studia zaoczne mogą być tak samo, lub bardziej skuteczne od studiów dziennych, pod warunkiem zaplanowania sobie dodatkowych sesji \"powtórzeniowych\" w trakcie tygodnia","Studia zaoczne będą zawsze bardziej skuteczne od studiów dziennych","Studia dzienne (poniedziałek-piątek) będą zawsze bardziej skuteczne od studiowania zaocznego (w weekendy)"],"c":1},{"id":"e52","n":52,"g":"e2","q":"Uczenie się sprawnościowe (ang. mastery learning) przeciwstawia się tradycyjnemu poglądowi, zgodnie z którym zdolności ucznia determinują to, ile jest w stanie się nauczyć. W modelu uczenia sprawnościowego zdolności ucznia:","a":["Są zmienne","Są różnorodne i treści należy prezentować w odpowiedniej dla danego ucznia modalności","Nie mają znaczenia w procesie uczenia się","Determinują tempo uczenia się"],"c":3},{"id":"e53","n":53,"g":"e2","q":"Nauczanie programowane, wspomagane komputerowo, samokształceniowe, gdzie materiał podzielony jest na niewielkie jednostki to:","a":["metoda nauczania zdalnego wprowadzona w sytuacji pandemii COVID","tak zwany e-learning, który powstał ok 2000 roku","pomysł edukacyjny, który powstał z inspiracji prac Skinnera z lat 60 XX wieku","względna nowość edukacyjna, związana z \"nauczaniem XXI wieku\""],"c":2},{"id":"e54","n":54,"g":"e2","q":"Uczeń mówi do siebie, na głos: \"Dobrze, nawet, gdy popełnię błąd powinienem pracować powoli i starannie. Najpierw obliczam sumę wyrazów po prawej i lewej stronie, a potem mnożę wynik przez pięć. Na końcu powinienem sprawdzić czy wynik jest poprawny wykonując to jeszcze raz.\"","a":["Uczeń stosuje modelowanie sprawcze Bandury","Uczeń prawdopodobnie ma dysleksję","Uczeń ma trudności z cichym myśleniem","Uczeń stosuje strategię samokontroli własnego zachowania odnoszącą się do prac Łurii i Wygotskiego "],"c":3},{"id":"e55","n":55,"g":"e2","q":"Uczniowie typowej szkoły często są krytykowani za nieprawidłowe odpowiedzi, przez co uczą się unikać zachowań polegających na zgłaszaniu się do odpowiedzi. W kolejnych latach edukacji coraz rzadziej samodzielnie generują odpowiedzi na pytania nauczyciela. Jeśli nauczyciel-behawiorysta chce rozpocząć procedurę formowania prawidłowych reakcji, stosując wzmocnienia i zasadę kolejnych, stopniowych przybliżeń, często w pierwszej kolejności musi:","a":["Zastosować rozkład o zmiennych odstępach czasowych","Doprowadzić do samoistnego odnowienia się reakcji","Porozmawiać z rodzicami uczniów","Doprowadzić do wzbudzenia pierwszej reakcji (prompting)"],"c":3},{"id":"e56","n":56,"g":"e2","q":"Uczeń wykonuje zachowania niepożądane (agresja w stosunku do innego ucznia), a nauczyciel zwraca na to uwagę i głośno krytykuje agresywnego ucznia. Oprócz tych sytuacji nauczyci
