cyjne w ciągu życia","będzie preferowało język polski, gdyż język jest dziedziczony genetycznie"],"c":0},{"id":"e142","n":142,"g":"e4","q":"Co to jest świadomość fonologiczna?","a":["rozumienie, że dźwięki (słowa) mają znaczenie","rozumienie, że słowa dzielą się na fonemy","rozumienie, że zdania składają się ze słów","rozumienie, że mowę można zapisać za pomocą alfabetu pisanego"],"c":1},{"id":"e143","n":143,"g":"e4","q":"Czym jest założenie rezydualnej normalności?","a":["By móc rzetelnie porównać ze sobą dwie grupy, spełnione musi być założenie o rezydualnym podobieństwie rozkładów istotnych cech, poza mierzoną zmienną","Pomijając zdiagnozowane deficyty poznawcze wynikające z uszkodzenia mózgu, pozostała część mózgu funkcjonuje normalnie u pacjenta po uszkodzeniu mózgu","W testach na inteligencję, wariancja ma również rozkład normalny","Aby terapia zaburzeń rozwoju była skuteczna, musi być spełnione założenie rezydualnej normalności, to znaczy, np. jego środowisko rodzinne musi być prawidłowe"],"c":1},{"id":"e144","n":144,"g":"e4","q":"Dlaczego Michael Thomas i Anette Karmiloff-Smith uważają, że pojmowanie zaburzeń rozwoju jako analogicznych do uszkodzeń mózgu ma poważne ograniczenia? (wskaż FAŁSZYWĄ odpowiedź)","a":["W przypadku zaburzeń rozwoju, deficyty częściowo wynikają z niemożności odbycia typowego procesu rozwojowego, np. występowanie deficytu we wczesnym rozwoju powoduje zmniejszony pobór stymulacji ze środowiska - ta sytuacja nie ma miejsca w przypadku uszkodzeń mózgu","Jednym z powodów występowania deficytów powstałych w wyniku zaburzeń rozwoju są tzw. kaskady rozwojowe, które nie występują w przypadku uszkodzeń mózgu","Oprócz zlokalizowanych dysfunkcji, które mogą przypominać uszkodzenia mózgu, w przypadku zaburzeń rozwoju występuje szereg innych problemów z funkcjonowaniem mózgu np. na poziomie gospodarki neuroprzekaźników, efektywności przetwarzania informacji czy problemów na poziomie neuronalnym, a do tych problemów analogia uszkodzenia mózgu nie znajduje zastosowania","Neuroplastyczność, która pozwala na pewną kompensację deficytów poznawczych przy uszkodzeniach mózgu, ma inne mechanizmy i inne efekty niż proces dojrzewania, który występuje w przypadku zaburzeń rozwoju"],"c":3,"f":"niepewne"},{"id":"e145","n":145,"g":"e4","q":"Jak można zinterpretować słowa Lorny Wing \"Natura rzadko kiedy rysuje linię bez zamazania jej\"?","a":["Diagnoza zaburzeń rozwoju jest utrudniona z uwagi na ich dynamiczny charakter i niestabilność","Zaburzenia rozwoju nie są jednorodnymi zjawiskami, które w każdym przypadku daje się z łatwością zaklasyfikować","Mózg z zasady pracuje jako sieć, której działanie trudno jest odkodować","Rozwój poszczególnych funkcji poznawczych jest w wysokim stopniu ze sobą powiązany, dlatego opisywanie ich jako niezależnych procesów prowadzi do błędnego myślenia"],"c":1},{"id":"e146-A","n":146,"g":"e4","q":"Która z poniższych umiejętności jest powiązana ze świadomością fonologiczną?","a":["Ocena poprawności gramatycznej zdania","Powtarzanie nonsensownych słów","Rozumienie metafor","Rozumienie implikatury konwersacyjnej"],"c":1},{"id":"e146-B","n":146,"g":"e4","q":"Która z poniższych umiejętności jest powiązana ze świadomością fonologiczną?","a":["Powtarzanie nonsensownych słów","Rozumienie metafor","Ocena poprawności gramatycznej zdania","Rozumienie zasad pragmatyki językowej"],"c":0},{"id":"e147","n":147,"g":"e4","q":"Które z poniższych nie należy do kategorii Specyficzne rozwojowe zaburzenia umiejętności szkolnych (ICD- 10, kod F81)?","a":["Dysortografia","Dysleksja","Dyspraksja","Dyskalkulia"],"c":2},{"id":"e148","n":148,"g":"e4","q":"Lokalizacjonizm jako koncepcja pracy mózgu to pogląd stanowiący, że:","a":["Anatomia mózgu ma podłoże biologiczne, ale jego funkcjonowanie jest wynikiem doświadczenia","Mózg składa się z modułów pełniących różne funkcje poznawcze","Mózg działa jako całość przy wykonywaniu wyższych funkcji poznawczych","Nie można zrozumieć funkcjonowania poznawczego człowieka bez rozumienia pracy mózgu"],"c":1},{"id":"e149","n":149,"g":"e4","q":"O czym mówi oświadczenie o konsensusie w sprawie ADHD (Barkley et al., 2002)?","a":["w tej chwili diagnoza ADHD jest stawiana zbyt często","ADHD to kontrowersyjna diagnoza i potrzeba więcej badań, żeby ustalić jej sensowność","zebrane dane empiryczne wskazują, że nie ma wątpliwości, że diagnoza ADHD jest potrzebna i odpowiada problemom wielu osób w populacji","problemy z uwagą i hiperaktywnością często współwystępują"],"c":2},{"id":"e150","n":150,"g":"e4","q":"Obszar Broki to część mózgu powiązana z:","a":["funkcjami wykonawczymi","rozumieniem mowy","produkcją mowy","teorią umysłu"],"c":2},{"id":"e151","n":151,"g":"e4","q":"Osoby z dysleksją fonologiczną mają problem z:","a":["czytaniem długich i trudnych słów, ale dobrze rozpoznają rymy","czytaniem nonsensownych słów, ale potrafią dobrze czytać znane im słowa","czytaniem wyjątków, ale dobrze czytają nonsensowne słowa","rozpoznawaniem rymów, ale dobrze czytają długie i trudne słowa"],"c":1},{"id":"e152","n":152,"g":"e4","q":"W której fazie nauki czytania, wg modelu Uty Frith, dziecko uzyskuje świadomość językową, tj. że słowa dzielą się na fonemy, którym odpowiadają konkretne litery?","a":["W fazie ortograficznej","W fazie logograficznej","W fazie alfabetycznej","W fazie fonologicznej"],"c":2},{"id":"e153-A","n":153,"g":"e4","q":"Z którą z poniższych funkcji poznawczych powiązana jest dyspraksja?","a":["Świadomość fonologiczna","Ocena odległości i rozmiaru","Funkcje wykonawcze","Odraczanie gratyfikacji"],"c":1},{"id":"e153-B","n":153,"g":"e4","q":"Z którą z poniższych funkcji poznawczych powiązana jest dyspraksja?","a":["Świadomość fonologiczna","Funkcje wykonawcze","percepcja odległości i rozmiaru","Odraczanie gratyfikacji"],"c":2},{"id":"e154","n":154,"g":"e4","q":"Ćwiczenie strategii zapamiętywania zasad ortograficznych:","a":["jest skutecznym sposobem wspomagania rozwoju kompetencji językowych","jest jedynym sposobem nabycia wiedzy ortograficznej","zwiększa świadomość fonologiczną i fonemową","nie wpływa na poprawę pisowni"],"c":3,"e":"Metaanaliza Galuschka i in. (2020) nie potwierdziła skuteczności uczenia strategii zapamiętywania."},{"id":"e155-A","n":155,"g":"e4","q":"Dysleksja może się wiązać z zaburzeniami w:","a":["pisaniu i czytaniu","słuchu fonemowym, świadomości fonologicznej","wzrokowym przetwarzaniu bodźców werbalnych, pamięci wzrokowej","wszystkie z powyższych"],"c":3},{"id":"e155-B","n":155,"g":"e4","q":"Dysleksja może się wiązać z zaburzeniami w:","a":["pisaniu i czytaniu","rozróżnianiu kolorów","różnicowaniu zapachów","wszystkie z powyższych"],"c":0},{"id":"e156","n":156,"g":"e4","q":"Mechanizm, który rozpoznaje się dość często u uczniów ze specyficznymi trudnościami w uczeniu się to:","a":["wyższa od przeciętnej potrzeba domknięcia poznawczego","wyuczona bezradność","zagrożenie niedostosowaniem społecznym / dysocjacja","brak poczucia odpowiedzialności za swój los"],"c":1},{"id":"e157","n":157,"g":"e4","q":"Z badań wynika, że u dorosłych osób z dysleksją mogą się utrzymywać problemy z:","a":["pamięcią i świadomością fonologiczną","percepcją wzrokową","koordynacją wzrokowo-ruchową","wszystkie odpowiedzi są prawidłowe"],"c":0},{"id":"e158-A","n":158,"g":"e4","q":"Specyficzne zaburzenia rozwoju umiejętności szkolnych wynikają z:","a":["obniżonej motywacji do nauki","obniżonego ilorazu inteligencji","nietypowego rozwoju układu nerwowego","zaburzeń nastroju"],"c":2},{"id":"e158-B","n":158,"g":"e4","q":"Specyficzne zaburzenia rozwoju umiejętności szkolnych wynikają z:","a":["problemów rodzinnych ucznia","niskich ogólnych zdolności poznawczych","nietypowego rozwoju układu nerwowego","niskiej motywacji osiągnięć"],"c":2},{"id":"e159-A","n":159,"g":"e4","q":"Dysleksja:","a":["pojawia się w pierwszym roku edukacji szkolnej","jest wrodzona","zanika po odbyciu terapii poznawczo-behawioralnej","może się nie rozwinąć przy odpowiedniej motywacji"],"c":1},{"id":"e159-B","n":159,"g":"e4","q":"Dysleksja:","a":["rozwija się nie wcześniej niż przed rozpoczęciem drugiego etapu edukacyjnego","jest wrodzona","znika po odbyciu terapii poznawczo-behawioralnej","może się nie rozwinąć przy odpowiedniej motywacji"],"c":1},{"id":"e160","n":160,"g":"e4","q":"Dyskalkulia:","a":["nie może być diagnozowana u osób z padaczką","nie może być diagnozowana u osób ze stwardnieniem rozsianym","nie może być diagnozowana u osób z gruźlicą","może być diagnozowana w każdym z powyższych przypadków"],"c":3},{"id":"e161","n":161,"g":"e4","q":"Dysleksja i zespół Aspergera:","a":["mogą ze sobą współwystępować","zawsze ze sobą współwystępują","wykluczają się wzajemnie","żadna odpowiedź nie jest poprawna"],"c":0},{"id":"e162-A","n":162,"g":"e4","q":"Specyficzne zaburzenia czytania (F81.0) przejawiają się:","a":["zarówno trudnościami w czytaniu jak i pisaniu","tylko trudnościami w sferze czytania","tylko trudnościami w sferze pisania","trudnościami w liczeniu, czytaniu i pisaniu"],"c":0},{"id":"e162-B","n":162,"g":"e4","q":"Specyficzne zaburzenia czytania (F81.0) przejawiają się:","a":["zawsze bardzo znacznymi deficytami czytania","trudnościami w sferze czytania bez trudności w pisaniu","trudnościami w sferze pisania, zaś trudności w sferze czytania jakkolwiek występują na pierwszym etapie edukacyjnym, z wiekiem mogą się stawać coraz mniej wyraźne","trudnościami w liczeniu, czytaniu i pisaniu"],"c":2},{"id":"e163-A","n":163,"g":"e4","q":"Specyficzne zaburzenia opanowania poprawnej pisowni (F81.1) przejawiają się:","a":["zarówno trudnościami w czytaniu jak i pisaniu","tylko trudnościami w sferze czytania","tylko trudnościami w sferze pisania","trudnościami w liczeniu, czytaniu i pisaniu"],"c":2},{"id":"e163-B","n":163,"g":"e4","q":"Specyficzne zaburzenia opanowania poprawnej pisowni (F81.1) przejawiają się:","a":["zarówno trudnościami w czytaniu, jak i pisaniu","trudnościami w sferze czytania","trudnościami w sferze pisania bez trudności w czytaniu","trudnościami w sferze pisania, zaś wiadomo, że na wcześniejszym etapie edukacyjnym wyraźne były trudności w czytaniu"],"c":2},{"id":"e163-C","n":163,"g":"e4","q":"Specyficzne zaburzenia opanowania poprawnej pisowni (F81.1) przejawiają się:","a":["zarówno trudnościami w czytaniu, jak i pisaniu","trudnościami w jakości pisma odręcznego","trudnościami w sferze pisania, zaś wiadomo, że na wcześniejszym etapie edukacyjnym nie występowały trudności w czytaniu","trudnościami w sferze pisania, zaś wiadomo, że na wcześniejszym etapie edukacyjnym wyraźne były trudności w czytaniu"],"c":2},{"id":"e164","n":164,"g":"e4","q":"Mieszane zaburzenia umiejętności szkolnych (F81.3) przejawiają się:","a":["zarówno trudnościami w czytaniu jak i pisaniu","trudnościami w sferze czytania i zaburzeniami obowiązkowości","trudnościami w sferze pisania i snu","trudnościami w liczeniu, pisaniu i/lub czytaniu"],"c":3},{"id":"e165","n":165,"g":"e4","q":"Wskaż fałszywe zdanie odnośnie modelu ESSENCE Ch. Gillberga:","a":["Zdaniem Gillberga, w przypadku dzieci poniżej 5 roku życia, które wykazują trudności rozwojowe, lepiej jest objąć je wieloaspektową terapią, ponieważ profil trudności w tym wieku może się dynamicznie zmieniać","Zaburzenia Essence zaczynają się przed 3 rokiem życia i dotyczą ogólnego rozwoju, rozwoju języka i komunikacji, rozwoju społecznego i emocjonalnego, koordynacji motorycznej, zachowania i snu","Zdaniem Gillberga, częste współwystępowanie różnych rodzajów trudności rozwojowych jest normą, a nie wyjątkiem","Zdaniem Gillberga, u dzieci poniżej 3 roku życia, bardzo ważna jest jak najszybsza i najbardziej precyzyjna diagnoza trudności rozwojowych, po to by jak najszybciej wdrożyć możliwie najbardziej precyzyjną terapię"],"c":3},{"id":"e166","n":166,"g":"e4","q":"Zadanie Stop-Signal (Sygnał Stop) sprawdza:","a":["zdolność hamowania reakcji","zdolność odraczania gratyfikacji","teorię umysłu","świadomość fonologiczną"],"c":0},{"id":"e167","n":167,"g":"e4","q":"Która z funkcji poznawczych poniżej jest przykładem funkcji wykonawczej?","a":["samoregulacja","teoria umysłu","integracja danych zmysłowych","wyobraźnia"],"c":0},{"id":"e168","n":168,"g":"e4","q":"Która kategoria symptomów NIE należy do kryteriów diagnostycznych ADHD?","a":["hiperaktywność","niesubordynacja","impulsywność","trudności z uwagą"],"c":1},{"id":"e169","n":169,"g":"e4","q":"Które narzędzie będzie najbardziej wskazane przy diagnozie ADHD u dziecka?","a":["CONNERS 3","DIVA","ADOS 2","test Ravena"],"c":0},{"id":"e170","n":170,"g":"e4","q":"Która z poniższych jednostek nie jest częścią kategorii zaburzeń rozwoju uczenia się:","a":["Zaburzenie czytania","Zaburzenie pisania","Zaburzenia umiejętności arytmetycznych","zaburzenia rozwoju intelektualnego / spektrum autyzmu"],"c":3},{"id":"e171","n":171,"g":"e4","q":"Która z poniższych umiejętności nie jest powiązana ze świadomością fonologiczną?","a":["Szukanie rymów","Sylabizowanie","Powtarzanie nonsensownych słów","Rozumienie metafor"],"c":3},{"id":"e172","n":172,"g":"e4","q":"Jaka cecha języka czyni go trudniejszym dla osób z dysleksją?","a":["nieprzejrzystość ortografii","nieprzejrzystość gramatyki","występowanie metafor","wszystkie języki są tak samo trudne dla osób z dysleksją"],"c":0},{"id":"e173","n":173,"g":"e4","q":"Co nie wpływa istotnie na poziom umiejętności czytania u dziecka?","a":["inteligencja","poziom świadomości fonologicznej","edukacja","poziom teorii umysłu"],"c":3},{"id":"e174-A","n":174,"g":"e4","q":"Wskaż fałszywe zdanie odnośnie ICD:","a":["został opracowany przez Światową Organizację Zdrowia (WHO)","jest darmowy i powszechnie dostępny","zawiera wyłącznie klasyfikację zaburzeń psychicznych","jego misją jest poprawa zdrowia publicznego"],"c":2},{"id":"e174-B","n":174,"g":"e4","q":"Wskaż fałszywe zdanie odnośnie DSM","a":["został opracowany przez American Psychiatric Association","nie jest narzędziem darmowym","zawiera klasyfikację chorób i zaburzeń psychicznych","najnowsza wersja to wersja piąta (5)"],"c":2},{"id":"e175","n":175,"g":"e4","q":"Wskaż poprawny zestaw najnowszych wersji systemów klasyfikacji ICD i DSM:","a":["ICD 10, DSM 5","ICD 11, DSM 4","ICD 11, DSM 5","ICD 10, DSM 4"],"c":2},{"id":"e176","n":176,"g":"e4","q":"Który z podanych argumentów za uznaniem przedłużonej reakcji żałoby za zaburzenie jest najlepszy?","a":["przedłużona reakcja żałoby wiąże się z istotnymi trudnościami w funkcjonowaniu, które przekraczają zdolności adaptacyjne danej osoby i dlatego wymagane jest wsparcie","przedłużona reakcja żałoby to nietypowy statystycznie sposób przeżywania żałoby","przedłużona reakcja żałoby wiąże się z dystresem","cierpienie jest zawsze zaburzeniem"],"c":0},{"id":"e177","n":177,"g":"e4","q":"Dlaczego same trudności w funkcjonowaniu nie są wystarczającym kryterium rozpoznania zaburzenia psychicznego?","a":["ponieważ trudności muszą być jeszcze istotne klinicznie i być istotnym obciążeniem w funkcjonowaniu","ponieważ niektóre osoby po leczeniu mogą ich nie wykazywać, diagnozuje się tylko trudności niepoddające się terapii","ponieważ niektóre osoby bez zaburzeń psychicznych mają trudności w funkcjonowaniu, a niektóre osoby z zaburzeniami trudności nie mają","ponieważ dana osoba może nie być świadoma swoich trudności"],"c":2},{"id":"e178","n":178,"g":"e4","q":"Co jest cechą charakterystyczną zaburzeń neurorozwojowych?","a":["powiązane są z procesem rozwojowym, więc mają początek w dzieciństwie","nie poddają się zmianom rozwojowym i mają podobną prezentację w cyklu życia","nie poddają się terapii","zdeterminowane są wyłącznie czynnikami genetycznymi, a nie środowiskowymi"],"c":0},{"id":"e179","n":179,"g":"e4","q":"Współwystępowanie diagnoz zaburzeń neurorozwojowych:","a":["jest bardzo częste, to 'norma', a nie wyjątek","ICD (ale nie DSM) wyklucza możliwość więcej niż jednej diagnozy zaburzeń neurorozwojowych","zdarza się bardzo rzadko","zarówno DSM jak i ICD wykluczają taką możliwość"],"c":0},{"id":"e180","n":180,"g":"e4","q":"Rozwojowe zaburzenia koordynacji ruchowej wg ICD 11:","a":["to znaczne opóźnienie w nabywaniu dużej i małej motoryki oraz zaburzenia związane z wykonywaniem skoordynowanych czynności motorycznych","charakteryzują się utrzymującym się wzorcem trudności z uwagą i/lub hiperaktywnością/impulsywnością, który ma bezpośredni negatywny wpływ na szkolne, zawodowe lub społeczne funkcjonowanie","charakteryzują się istotnymi i utrzymującymi się trudnościami w nabywaniu umiejętności szkolnych związanymi z czytaniem","charakteryzują się utrzymującymi się deficytami zdolności inicjowania i podtrzymywania interakcji społecznych i komunikacji społecznej oraz szeregiem ograniczonych, powtarzalnych i nieelastycznych wzorców zachowań, zainteresowań lub czynności"],"c":0},{"id":"e181","n":181,"g":"e4","q":"Który z aspektów uwagi jest uznawany za najsilniej pogarszający się w okresie starości:","a":["podzielność uwagi","przedłużona koncentracja","selektywność uwagi","wszystkie wymienione aspekty pogarszają się w tym samym tempie i stopniu"],"c":0},{"id":"e182","n":182,"g":"e4","q":"O zjawisku transferu dalekiego jako efekcie treningu poznawczego możemy mówić, gdy:","a":["Osoba poprawia swoje wyniki w treningu, tzn. coraz lepiej wykonuje trenowane zadanie","Osoba utrzymuje zdolność wykonywania trenowanego zadania nawet po dłuższej przerwie","Obserwuje się poprawę funkcjonowania w życiu codziennym osoby, która ukończyła trening poznawczy","Obserwuje się, że po treningu osoba pamięta, jakie zadania w nim realizowała"],"c":2},{"id":"e183","n":183,"g":"e4","q":"Traktując mądrość jako \"wiedzę o podstawowej pragmatyce życia\", rozpatrujemy ją w aspekcie:","a":["poznawczym","osobowościowym","zarówno poznawczym, jak i osobowościowym","ani poznawczym, ani osobowościowym"],"c":0,"f":"niepewne"},{"id":"e184-A","n":184,"g":"e4","q":"Wskaż prawdziwe zdanie odnośnie DSM:","a":["został opracowany przez Światową Organizację Zdrowia (WHO)","jest darmowy i powszechnie dostępny","zawiera wyłącznie klasyfikację zaburzeń psychicznych","zawiera klasyfikację chorób i zaburzeń psychicznych"],"c":3},{"id":"e184-B","n":184,"g":"e4","q":"Wskaż prawdziwe zdanie odnośnie ICD","a":["został opracowany przez American Psychiatric Association","nie jest narzędziem darmowym","zawiera klasyfikację chorób i zaburzeń psychicznych","najnowsza wersja to wersja piąta (5)"],"c":2},{"id":"e185","n":185,"g":"e4","q":"Co jest celem wprowadzenia pojęcia normy w funkcjonowaniu psychicznym?","a":["identyfikacja osób, u których pewien element ich funkcjonowania przekracza ich zdolności adaptacyjne, po to, by umożliwić im dostęp do odpowiedniego wsparcia","identyfikacja osób, których zachowanie wykracza poza normy społeczne i jest społecznie uciążliwe","identyfikacja nietypowych wzorców funkcjonowania","określenie, które zachowania i rodzaje funkcjonowania są nieprawidłowe i zaburzone"],"c":0},{"id":"e186","n":186,"g":"e4","q":"Jakie rozumienie zaburzeń psychicznych proponuje Richard Bentall?","a":["jako indywidualnego dla jednostki zespołu symptomów, wynikających z określonych mechanizmów poznawczych","jako osobnych i niezależnych od siebie kategorii (jednostek diagnostycznych), o różnej etiologii, symptomach i przebiegu","jako konflikt pomiędzy jednostką a społeczeństwem, stąd też Bentall proponuje rezygnację z pojęcia normy w odniesieniu do funkcjonowania psychicznego","jako niezmiennych, uwarunkowanych biologicznie wzorcach funkcjonowania mózgu, które można usprawniać farmakologicznie"],"c":0},{"id":"e187","n":187,"g":"e4","q":"Zaburzenia z deficytem uwagi i nadaktywnością wg ICD 11:","a":["to znaczne opóźnienie w nabywaniu dużej i małej motoryki oraz zaburzenia związane z wykonywaniem skoordynowanych czynności motorycznych","charakteryzują się utrzymującym się wzorcem trudności z uwagą i/lub hiperaktywnością/impulsywnością, który ma bezpośredni negatywny wpływ na szkolne, zawodowe lub społeczne funkcjonowanie","charakteryzują się istotnymi i utrzymującymi się trudnościami w nabywaniu umiejętności szkolnych związanymi z czytaniem","charakteryzują się utrzymującymi się deficytami zdolności inicjowania i podtrzymywania interakcji społecznych i komunikacji społecznej oraz szeregiem ograniczonych, powtarzalnych i nieelastycznych wzorców zachowań, zainteresowań lub czynności"],"c":1},{"id":"e188","n":188,"g":"e4","q":"Która z poniższych funkcji poznawczych jest najsilniej powiązana ze sprawnością nabywania umiejętności czytania u dzieci?","a":["świadomość fonologiczna","teoria umysłu","funkcje wykonawcze","przetwarzanie wzrokowe"],"c":0},{"id":"e189","n":189,"g":"e4","q":"Który z poniższych symptomów NIE NALEŻY do kategorii trudności z uwagą w ADHD?","a":["Trudności w utrzymaniu uwagi na zadaniach, które nie zapewniają wysokiego poziomu stymulacji","Łatwo rozprasza się przez bodźce lub myśli niezwiązane z wykonywanym zadaniem","Jest zapominalski w codziennych czynnościach","Skłonność do działania w odpowiedzi na natychmiastowe bodźce bez namysłu lub rozważenia ryzyka i konsekwencji"],"c":3},{"id":"e190","n":190,"g":"e4","q":"Na czym polega efekt miesiąca urodzin w przypadku diagnozy ADHD?","a":["Zachowanie młodszych dzieci w klasie oceniane jest jako mniej dojrzałe w porównaniu do dzieci urodzonych we wcześniejszych miesiącach roku, przez co nieco częściej otrzymują diagnozę ADHD","dzieci w miesiącu swoich urodzin są tak podekscytowane przyjęciem i prezentami, że wydaje się jakby miały ADHD","zachowanie dzieci na przyjęciach urodzinowych bardzo często spełnia kryteria diagnostyczne ADHD, ale po powrocie do domu im przechodzi","rodzice częściej udają się po diagnozę ADHD do specjalisty po urodzinach dziecka, bo wydaje im się nagle, że dziecko powinno się zachować dojrzalej"],"c":0},{"id":"e191","n":191,"g":"e4","q":"Oprócz problemów motorycznych, z czym dzieci z dyspraksją mają często problemy?","a":["postrzeganie przestrzenne (szczególnie ocena odległości i rozmiaru)","inteligencja werbalna","świadomość fonologiczna","teoria umysłu"],"c":0},{"id":"e192","n":192,"g":"e4","q":"Czemu służy IDS-2?","a":["diagnozie autyzmu","diagnozie ADHD","pomiarowi inteligencji i rozwoju u dzieci i młodzieży","pomiarowi funkcji wykonawczych"],"c":2},{"id":"e193","n":193,"g":"e4","q":"Która z poniższych teorii w tej chwili uważana jest za najlepsze poznawcze wyjaśnienie autyzmu:","a":["deficyt teorii umysłu","słaba centralna koherencja","dysfunkcja wykonawcza","obecnie uważa się, że autyzm jest zbyt złożony by wyjaśnić go za pomocą jednej teorii"],"c":3},{"id":"e194","n":194,"g":"e4","q":"Jakie dwa kwalifikatory stosuje się w diagnozie autyzmu w ICD 11 (w celu określenia podtypu):","a":["funkcjonowanie językowe i intelektualne","funkcjonowanie językowe i obecność zaburzeń zachowania","funkcjonowanie intelektualne i obecność trudności z uwagą","funkcjonowanie językowe i obecność trudności z uwagą"],"c":0},{"id":"e195","n":195,"g":"e4","q":"Dysleksja i spektrum autyzmu","a":["mogą ze sobą współwystępować","zawsze ze sobą współwystępują","wykluczają się wzajemnie","żadna odpowiedź nie jest poprawna"],"c":0},{"id":"e196","n":196,"g":"e4","q":"Diagnoza dysleksji nie obejmuje","a":["badania funkcji wykonawczych","badania inteligencji","badania funkcji wzrokowo-przestrzennych","badania funkcji słuchowo-językowych"],"c":0},{"id":"e197","n":197,"g":"e4","q":"U dzieci z upośledzeniem w stopniu lekkim","a":["pamięć mechaniczna może być bardzo dobra","nie wykształca się myślenie abstrakcyjne","występuje opóźnienie rozwoju mowy","wszystkie odpowiedzi są prawidłowe"],"c":3},{"id":"e198","n":198,"g":"e4","q":"Spośród procesów pamięciowych najmniejsze pogorszenie w procesie starzenia się wykazuje","a":["pamięć prospektywna","pamięć operacyjna","kodowanie nowych informacji w pamięci długotrwałej","wydobywanie informacji przechowywanych w pamięci długotrwałej"],"c":3},{"id":"e199","n":199,"g":"e4","q":"Największe szanse na uzyskanie transferu dają treningi","a":["zdolności poznawczych","oparte na uczeniu strategii","rdzennych/podstawowych procesów poznawczych","wszystkie wymienione w tym samym stopniu"],"c":1},{"id":"e200","n":200,"g":"e4","q":"W świetle wyników badań i metaanaliz dotyczących treningów poznawczych u osób starszych","a":["treningi skomputeryzowane dają gorsze rezultaty u zdrowych osób starszych niż treningi tradycyjne","treningi skomputeryzowane są najbardziej zalecane dla osób starszych cierpiących na otępienie","treningi skomputeryzowane dają pozytywne rezultaty u osób starszych w normie poznawczej","treningi skomputeryzowane nie powinny być stosowane u osób starszych z łagodnymi zaburzeniami funkcji poznawczych"],"c":2},{"id":"e201","n":201,"g":"e4","q":"Wskaż fałszywe zdanie odnośnie modelu psychiatrii Kraepelina","a":["model Kraepelina to model kategorialny, zakładający istnienie osobnych, niezależnych od siebie zaburzeń – jednostek diagnostycznych","model Kraepelina jest historycznym fundamentem podejścia do psychiatrii w DSM i ICD","model Kraepelina charakteryzuje podejście dymensjonalne do zaburzeń psychicznych","model Kraepelina to pierwsza klasyfikacja zaburzeń psychicznych"],"c":2},{"id":"e202","n":202,"g":"e4","q":"Dlaczego pacjent Paula Broki, znany pod pseudonimem „Tan”, jest tak ważnym przypadkiem w historii neuropsychologii?","a":["Ponieważ jest to pierwszy przypadek zlokalizowania konkretnej funkcji mózgu","Ponieważ po jego autopsji po raz pierwszy powiązano konkretny region mózgu z niezdolnością do rozumienia mowy","Ponieważ studium jego przypadku wykazało, że mózg działa jako sieć neuronowa","Jest pierwszym udokumentowanym przypadkiem powrotu funkcji poznawczej po uszkodzeniu, tj. neuroplastyczności"],"c":0},{"id":"e203","n":203,"g":"e4","q":"Na jakiej podstawie Brodmann dokonał podziału kory mózgowej na pola?","a":["Na podstawie ich cytoarchitektoniki","Na podstawie ich funkcji","Na podstawie ich anatomii","Na podstawie ich umiejscowienia"],"c":0},{"id":"e204","n":204,"g":"e4","q":"Zaburzenia ze spektrum autyzmu wg ICD-11","a":["to znaczne opóźnienie w nabywaniu dużej i małej motoryki oraz zaburzenia związane z wykonywaniem skoordynowanych czynności motorycznych","charakteryzują się utrzymującym się wzorcem trudności z uwagą i/lub hiperaktywnością/impulsywnością, który ma bezpośredni negatywny wpływ na szkolne, zawodowe lub społeczne funkcjonowanie","charakteryzują się istotnymi i utrzymującymi się trudnościami w nabywaniu umiejętności szkolnych związanymi z czytaniem","charakteryzują się utrzymującymi się deficytami zdolności inicjowania i podtrzymywania interakcji społecznych i komunikacji społecznej oraz szeregiem ograniczonych, powtarzalnych i nieelastycznych wzorców zachowań, zainteresowań lub czynności"],"c":3},{"id":"e205","n":205,"g":"e4","q":"Co nie jest kryterium diagnostycznym dysleksji wg ICD-11?","a":["Wykonanie na poziomie istotnie niższym niż oczekiwany względem wieku i IQ","Trudności skutkują istotnym zaburzeniem funkcjonowania w szkole lub pracy","Wykluczone są inne przyczyny trudności, takie jak poziom IQ czy trudne warunki socjoekonomiczne","wykluczona jest świadomość fonologiczna jako możliwa przyczyna trudności"],"c":3},{"id":"e206","n":206,"g":"e4","q":"Świadomość fonologiczna to","a":["zdolność dzielenia słów na fonemy","rozumienie stanów umysłowych innych ludzi","zdolność samoregulacji","szybkość pisania"],"c":0},{"id":"e207-A","n":207,"g":"e4","q":"Które z poniższych nie jest kryterium diagnostycznym ADHD wg ICD-11?","a":["wykluczone są zaburzenia spektrum autyzmu","potwierdzone występowanie trudności przed 12 rokiem życia","Poziom trudności wychodzi poza normalną wariancję tych zachowań oczekiwaną dla tej grupy wiekowej i poziomu intelektualnego","Trudności muszą być widoczne w różnych środowiskach i sytuacjach"],"c":0},{"id":"e207-B","n":207,"g":"e4","q":"Które z poniższych nie jest kryterium diagnostycznym ADHD wg ICD-11?","a":["trudności mają bezpośredni negatywny wpływ na funkcjonowanie szkolne, zawodowe lub społeczne","potwierdzone występowanie trudności przed 3 rokiem życia","Poziom trudności wychodzi poza normalną wariancję tych zachowań oczekiwaną dla tej grupy wiekowej i poziomu intelektualnego","Trudności muszą być widoczne w różnych środowiskach i sytuacjach"],"c":1},{"id":"e208","n":208,"g":"e4","q":"Diagnoza ADHD w dorosłości powiązana jest z podwyższonym ryzykiem","a":["nadużywania substancji uzależniających","zaburzeń zachowania","trudności ze spełnieniem potencjału edukacyjnego i zawodowego","wszystkie wymienione"],"c":3},{"id":"e209","n":209,"g":"e4","q":"Wyjaśnienie którego zaburzenia neurorozwojowego oferuje teoria pierwotnego deficytu hamowania R. Barkleya?","a":["ADHD","autyzmu","dysleksji","dyspraksji"],"c":0},{"id":"e210","n":210,"g":"e4","q":"Która z poniższych umiejętności nie należy do kategorii motoryki dużej?","a":["wiązanie butów","taniec","wchodzenie po schodach","skakanie"],"c":0},{"id":"e211","n":211,"g":"e4","q":"Kto wprowadził pojęcia „spektrum autyzmu” i „triady autystycznej”?","a":["Leo Kanner","Hans Asperger","Lorna Wing","Simon Baron-Cohen"],"c":2},{"id":"e212","n":212,"g":"e4","q":"Co to jest sawantyzm?","a":["Rozdźwięk między skalami inteligencji, charakterystyczny dla zaburzeń rozwoju","rozdźwięk między skalami inteligencji, charakterystyczny dla zaburzeń spektrum autyzmu","wybitne zdolności w specyficznej dziedzinie","tempo przetwarzania informacji w mózgu"],"c":2},{"id":"e213","n":213,"g":"e4","q":"Jeśli dziecko przejawia trudności w opanowaniu poprawnej pisowni ortograficznej i uczy się w 5 klasie szkoły podstawowej, możemy podejrzewać","a":["dyskalkulię","ryzyko dysleksji","dysortografię","dysgrafię"],"c":2},{"id":"e214","n":214,"g":"e4","q":"Z badań na temat wspomagania rozwoju kompetencji językowych (Galuschka i in., 2020) wynika, że największy wpływ na rozwój kompetencji poprawnej pisowni ma stosowanie","a":["zadań fonologicznych","zadań morfologicznych","strategii zapamiętywania zasad ortograficznych","poprawne są odpowiedzi a i b"],"c":1,"e":"Galuschka i in. (2020): największy efekt dla interwencji morfologicznych (g = 0,80)."},{"id":"e215","n":215,"g":"e4","q":"Z jakiego powodu niektórzy badacze uważają, że dyspraksję można rozumieć jako sygnaturę nietypowego rozwoju mózgu?","a":["Z uwagi na bardzo częste współwystępowanie dyspraksji przy innych diagnozach zaburzeń rozwojowych","Z uwagi na to, że rozwój motoryczny poprzedza inne aspekty rozwoju","Inne zaburzenia, za wyjątkiem dyspraksji, nigdy nie współwystępują ze sobą","Terapia dyspraksji prowadzi do zaniku innych deficytów, nie związanych bezpośrednio z motoryką"],"c":0},{"id":"e216","n":216,"g":"e4","q":"Co to jest endofenotyp?","a":["typ czy skłonność, która stanowi predyspozycję do wykształcenia danego zaburzenia","deficyt poznawczy stojący za mechanizmem danego zaburzenia","podtyp danego zaburzenia, powiązany z określonym przebiegiem i skutecznością terapii","czynniki środowiskowe powiązane z wystąpieniem danego zaburzenia"],"c":1},{"id":"e217","n":217,"g":"e4","q":"Jakie dwa zadania pozwalały najlepiej odróżnić dzieci z ADHD od dzieci bez tego zaburzenia?","a":["odraczanie gratyfikacji i zadanie sygnał stop","grafomotoryka i świadomość motoryczna","uczenie się proceduralne i odraczanie gratyfikacji","siedzenie na miejscu i milczenie przez określony czas"],"c":0},{"id":"e218","n":218,"g":"e4","q":"Który z poniższych deficytów występuje w istotnym stopniu zarówno w przypadku spektrum autyzmu, jak i ADHD?","a":["deficyt teorii umysłu","deficyt funkcji wykonawczych","słaba centralna koherencja","problemy z odraczaniem gratyfikacji"],"c":1},{"id":"e219","n":219,"g":"e4","q":"Czy ADHD jest zbyt często diagnozowane?","a":["ADHD to ogólnie rzetelna diagnoza, ale są dowody zarówno na przediagnozowanie, jak i zbyt rzadkie diagnozowanie w niektórych sytuacjach","ADHD w zdecydowanej większości przypadków to rzetelna i stabilna diagnoza i bardzo rzadko następuje jej utrata w toku życia osoby","ADHD jest zbyt rzadko diagnozowane u chłopców, a za często u dziewczynek","ADHD jest za rzadko diagnozowane u najmłodszych dzieci w klasie, tj. tych, które urodziły się w późniejszych miesiącach roku"],"c":0},{"id":"e220","n":220,"g":"e4","q":"Co się dzieje z osobami z dysleksją, kiedy są dorosłe?","a":["Dysleksja dotyczy okresu rozwoju i choć osoby z dysleksją uczą się czytać dłużej i przychodzi im to z większą trudnością, ostatecznie w dorosłości ich umiejętność czytania jest na tym samym poziomie, co rówieśników","Z dysleksji się nie wyrasta i trudności osób z dysleksją charakterystyczne dla wieku szkolnego pozostają u nich na całe życie","W dorosłości osoby z dysleksją rzadziej popełniają błędy, ale trudniej jest wyrównać płynność i szybkość czytania, pozostają pod tym względem poniżej poziomu swojej grupy rówieśniczej","Po zakończeniu edukacji osoby z dysleksją z reguły przestają czytać książki, bo wiąże się to u nich ze zbyt dużym wysiłkiem, przez co z czasem ich umiejętność czytania się pogarsza"],"c":2},{"id":"e221","n":221,"g":"e4","q":"Model czytania Uty Frith zakłada, że","a":["dzieci najpierw uczą się czytania litera za literą, a potem wyjątków","dzieci najpierw uczą się wyjątków, a potem czytania litera za literą","dzieci najpierw uczą się czytania po cichu, a potem na głos","kolejne etapy nauki czytania różnią się kolejnością u każdego dziecka"],"c":1,"f":"niepewne"},{"id":"e222","n":222,"g":"e4","q":"Jakiego rodzaju trudności mają często dzieci z późniejszą diagnozą dysleksji, zanim jeszcze podejmą naukę czytania?","a":["żadne – dysleksja dotyczy umiejętności czytania","często są trudności w rozwoju mowy","często są trudności z teorią umysłu","częsty jest obniżony poziom funkcjonowania intelektualnego"],"c":1},{"id":"e223","n":223,"g":"e4","q":"Wzorce zachowania, przekonania i wartości przyjmowane w danym społeczeństwie/kulturze to","a":["norma statystyczna","norma teoretyczna","norma kliniczna","norma społeczno-kulturowa"],"c":3},{"id":"e224","n":224,"g":"e4","q":"Co NIE JEST przykładem kryterium zaburzenia psychicznego?","a":["funkcjonowanie jest bardzo nietypowe w danej populacji/kulturze","funkcjonowanie powoduje subiektywne cierpienie/dystres","funkcjonowanie powoduje niemożność samorealizacji","funkcjonowanie powoduje niezdolność przystosowania się do warunków życia"],"c":2},{"id":"e225","n":225,"g":"e4","q":"Czym jest modularna koncepcja mózgu?","a":["Każda funkcja poznawcza zlokalizowana jest w osobnej części mózgu","Konkretne funkcje poznawcze wykonywane są przez cały mózg jako sieć","Neurony, które są jednocześnie aktywne, wiążą się ze sobą silniejszymi połączeniami","Mózg jest plastyczny i większość uszkodzeń będzie z czasem skompensowana"],"c":0},{"id":"e226","n":226,"g":"e4","q":"Jednym z kryteriów diagnostycznych zaburzenia z deficytem uwagi i nadaktywnością jest/są","a":["zachowania dyssocjalne","zaburzenia wykorzystania komunikacji werbalnej i niewerbalnej w czasie interakcji społecznych","wysoka kreatywność","impulsywność"],"c":3},{"id":"e227","n":227,"g":"e4","q":"Proszę wskazać prawdziwą/e informację nt. dyskalkulii","a":["dotyczy trudności w obliczeniach arytmetycznych","ujawnia się u uczniów zazwyczaj na etapie wprowadzenia trygonometrii","często współwystępuje u dzieci z ADHD","Odpowiedzi a i c są prawidłowe"],"c":3},{"id":"e228","n":228,"g":"e4","q":"Najczęściej u podstaw dysleksji leży deficyt przetwarzania fonologicznego, czyli","a":["rozróżnienia części mowy","rozróżnianie części zdania","przetwarzania dźwięków mowy","niemożność rozumienia mowy przy zachowanej zdolności jej nadawania"],"c":2},{"id":"e229","n":229,"g":"e4","q":"Zgodnie z definicją Światowej Organizacji Zdrowia (WHO) niepełnosprawność intelektualna obejmuje","a":["niepełnosprawność w zakresie funkcjonowania intelektualnego, która ma początek w dzieciństwie i wpływa na rozwój jednostki w ciągu całego życia","niepełnosprawność w zakresie funkcjonowania intelektualnego i społecznego, która ma początek w dzieciństwie i wpływa na rozwój jednostki w ciągu całego życia","niepełnosprawność w zakresie funkcjonowania społecznego, która ma początek w dzieciństwie i wpływa na rozwój jednostki w ciągu całego życia","niepełnosprawność w zakresie funkcjonowania intelektualnego i społecznego, która ma początek w adolescencji i wpływa na rozwój jednostki w ciągu całego życia"],"c":1},{"id":"e230","n":230,"g":"e4","q":"Niepełnosprawność intelektualna w stopniu lekkim charakteryzuje się","a":["Niedojrzałością w zakresie interakcji społecznych","Ograniczonymi umiejętnościami samoobsługi","Upośledzone myślenie abstrakcyjne","Wszystkie odpowiedzi są prawidłowe"],"c":3,"f":"niepewne"},{"id":"e231","n":231,"g":"e4","q":"Skala Stanford-Binet 5","a":["służy do oceny rozumienia mowy u dzieci od 24 miesiąca życia","to narzędzie obserwacyjne do diagnozy zaburzeń ze spektrum autyzmu","to test inteligencji dla dzieci od 24 miesiąca życia (2 roku życia)","to wypełniany przez rodziców dziecka kwestionariusz dotyczący przetwarzania informacji sensorycznych"],"c":2},{"id":"e232","n":232,"g":"e4","q":"Dzieci z diagnozą zaburzenia hiperkinetycznego, zgodnie z kryteriami diagnostycznymi ICD-10, charakteryzuje/ą się m.in.","a":["zaburzeniami wykorzystania komunikacji werbalnej i niewerbalnej w czasie interakcji społecznych","dyspraksją","niedostatecznie używaną komunikacją niewerbalną, m.in. gesty i wyrazy twarzy","trudnością w koncentracji uwagi przez dłuższy czas na jednym zadaniu"],"c":3},{"id":"e233","n":233,"g":"e4","q":"Do wsparcia w procesie diagnozy ADHD, które poda informacje o nasileniu objawów specyficznych dla zaburzenia, użyłbyś wystandaryzowanego narzędzia","a":["Test Matryc Ravena","EPQ-R","Conners-3","ADOS-2"],"c":2},{"id":"e234","n":234,"g":"e4","q":"Poza trudnościami szkolnymi u dzieci ze specyficznymi zaburzeniami umiejętności szkolnych, jakie kryteria musi spełnić dziecko, aby otrzymać taką diagnozę?","a":["obecne od początku edukacji","inteligencja w normie","brak poważnych zaburzeń neurologicznych, sensorycznych lub motorycznych, które mogłyby mieć wpływ na trudności szkolne","Wszystkie wymienione odpowiedzi są prawidłowe"],"c":3},{"id":"e235","n":235,"g":"e4","q":"Iloraz inteligencji 65 to wg klasyfikacji ICD-10 to inteligencja","a":["Przeciętna","Upośledzenie umysłowe umiarkowane","Upośledzenie umysłowe w stopniu lekkim","Pogranicze normy"],"c":2},{"id":"e236","n":236,"g":"e4","q":"Trudności w czytaniu u dzieci zazwyczaj spowodowane są","a":["deficytem w zakresie analizy wzrokowej","deficytem związanym z funkcjonowaniem móżdżku","deficytem przetwarzania fonologicznego","złymi metodami nauczania"],"c":2},{"id":"e237","n":237,"g":"e4","q":"W procesie diagnozy specyficznych zaburzeń umiejętności czytania (dysleksji) należy uwzględnić","a":["Wyniki ze SCID-5-PD","Iloraz inteligencji zbadany wystandaryzowaną skalą do diagnozy inteligencji, np. IDS-2","Wyniki z wystandaryzowanej baterii testów do diagnozy dysleksji","Odpowiedź B i C są prawidłowe"],"c":3},{"id":"e238","n":238,"g":"e4","q":"W badaniach Spricha (2016) wykazano, że u nastolatków z ADHD, u których zawiodła farmakoterapia, była skuteczna/y","a":["Tutoring edukacyjny","Terapia CBT","Terapia psychodynamiczna","Arteterapia"],"c":1},{"id":"e239","n":239,"g":"e4","q":"Wskaż objaw zaburzeń uwagi","a":["dziecko porzuca jedno zadanie na rzecz drugiego, nie kończąc żadnego; trudności w postępowaniu zgodnie z instrukcją lub w kończeniu prac","niezwracanie uwagi na szczegóły, częste błędy w pracach szkolnych","nie potrafi stać w kolejce lub doczekać swojej kolejki","Odpowiedzi A i B są prawidłowe"],"c":3},{"id":"e240","n":240,"g":"e4","q":"Zaznacz NIEPRAWDZIWE zdanie nt. diagnozy ADHD/zaburzenia hiperkinetycznego","a":["Zachowania niszczycielskie w ADHD są robione z premedytacją","Początek objawów jest widoczny w dzieciństwie, czyli przed ukończeniem 12 lat","Objawy z różnym natężeniem i postacią utrzymują się w okresie dorosłości","Objawy występują w więcej niż jednej sytuacji i miejscu"],"c":0},{"id":"e241","n":241,"g":"e4","q":"Błędami w czytaniu są","a":["Nieznajomość liter","Monotonny głos podczas czytania","„Falstarty”, długie wahania przed odczytaniem tekstu","Żadna z odpowiedzi nie jest prawidłowa"],"c":2},{"id":"e242","n":242,"g":"e4","q":"Który z procesów poznawczych jest zaangażowany podczas czytania, zgodnie z modelem Vellutino (1977)?","a":["Pamięć długotrwała","Pamięć robocza","Procesy metajęzykowe (np. rozumienie metafory)","Wszystkie odpowiedzi są prawidłowe"],"c":3,"f":"niepewne"},{"id":"e243","n":243,"g":"e4","q":"Jaka jest różnica w trudnościach w pisaniu u dzieci z dyspraksją a u dzieci ze specyficznymi trudnościami opanowania poprawnej pisowni (dysortografią)?","a":["Nie ma żadnej różnicy, są to zamienne pojęcia","U dzieci z dyspraksją zaburzona jest graficzna strona pisma. Może być nieczytelne dla wielu osób","U dzieci z dysortografią występują błędy związane z zasadami ortografii lub związane z trudnością ze strony poprawności fonetycznej","Odpowiedź B i C są prawidłowe"],"c":3},{"id":"e244","n":244,"g":"e4","q":"Wskaż fałszywą informację nt. dyskalkulii","a":["dotyczy trudności w obliczeniach arytmetycznych","u dzieci z dyskalkulią może występować „wyuczona bezradność”","często współwystępuje u dzieci z ADHD","Można zdiagnozować ją od 12 roku życia"],"c":3},{"id":"e245","n":245,"g":"e4","q":"Wskaż zachowania, które są objawem stereotypowych zachowań i sztywnych zainteresowań u dziecka z autyzmem","a":["bardzo nasilona fascynacja dinozaurami","znajomość i przymus powtarzania nazw stolic krajów europejskich pomimo, że wszystkich już to nudzi","uderzanie głową o ścianę pomimo wyraźnych siniaków","wszystkie odpowiedzi są prawidłowe"],"c":3},{"id":"e246","n":246,"g":"e5","q":"Diagnosta ryzykant:","a":["unika stosowania metod psychometrycznych","wczuwa się w motywy zachowań ucznia","analizuje w ujęciach alternatywnych","traktuje diagnozę przygodowo"],"c":3},{"id":"e247","n":247,"g":"e5","q":"Ewaluacja w edukacji dokonywana na podstawie przebiegu kształcenia to ewaluacja:","a":["konkluzywna","systemowa","formatywna","demokratyczna"],"c":2},{"id":"e248","n":248,"g":"e5","q":"Kształtująca, sumująca, demokratyczna, dialogowa - to cztery najważniejsze rodzaje ewaluacji w edukacji. Piąty rodzaj to:","a":["systemowa","dialogowa","konkluzywna","\"bez względu na cele\""],"c":3,"f":"niepewne"},{"id":"e249","n":249,"g":"e5","q":"Obronna komunikacja nauczyciel - uczniowie ma miejsce gdy:","a":["w zachowaniu nauczyciela występuje zachęta, u uczniów natomiast poszukiwanie pomocy","w zachowaniu nauczyciela występuje nietolerancja i dominacja, u uczniów natomiast skrytość i dwulicowość","w zachowaniu nauczyciela występuje otwartość, u uczniów natomiast skrytość i dwulicowość","w zachowaniu nauczyciela występuje poszanowanie praw ucznia, u uczniów natomiast skrytość i dwulicowość"],"c":1},{"id":"e250","n":250,"g":"e5","q":"Poczucie niemożności zapanowania nad materiałem jednego lub więcej przedmiotów szkolnych, upadek wiary w skuteczność uczenia się to cechy:","a":["zaburzeń zachowania","bezradności intelektualnej","braku sprawczości","braku kompetencji poznawczych"],"c":1},{"id":"e251","n":251,"g":"e5","q":"Z badań z dziedziny psychologii edukacji wynika, że korzystnie na klimat szkoły wpływa przede wszystkim:","a":["wywieszenie regulaminu w każdej sali","pozytywna ocena nauczycieli przez uczniów","egzekwowanie regulaminu szkolnego","brak dzwonków"],"c":1},{"id":"e252","n":252,"g":"e5","q":"Za pomocą techniki socjometrycznej \"zgadnij kto\" polegającej na wskazywaniu najbardziej podobnych do bohaterów fikcyjnych historii osób w klasie można zbadać:","a":["kreatywność","wyobraźnię","style uczenia się","role pełnione przez uczniów w klasie (np. lider, ekspert, błazen)"],"c":3},{"id":"e253-A","n":253,"g":"e5","q":"Troszczący się o szkolny klimat psycholog powinien:","a":["być niewidocznym dla społeczności szkolnej, żeby zachować obiektywizm","pracować w kilku miejscach równocześnie, co sprzyja obiektywizmowi","pracować tylko i wyłącznie w szkole, co sprzyja zaangażowaniu w sprawy uczniów","czynnie uczestniczyć w życiu szkolnym, co sprzyja otrzymywaniu orientacji w \"ważnych sprawach\" szkoły"],"c":3},{"id":"e253-B","n":253,"g":"e5","q":"Troszczący się o szkolny klimat psycholog powinien:","a":["być niewidocznym dla społeczności szkolnej, żeby zachować obiektywizm","raportować każdą interwencję do dyrektora szkoły","nie nawiązywać kontaktów z rodzicami uczniów, gdyż zaburzyłoby to jego obiektywizm","czynnie uczestniczyć w życiu szkolnym, prowadzić zajęcia i warsztaty na godzinach wychowawczych "],"c":3},{"id":"e254-A","n":254,"g":"e5","q":"Zadania i obowiązki psychologa w placówce oświatowej:","a":["ograniczają się jedynie do interwencji oraz podejmowania problemów wychowawczych i edukacyjnych","wszystkie zadania psychologa szkolnego są podporządkowane naczelnemu celowi - dobru dziecka w wymiarze indywidualnym i społecznym","jedynym zadaniem psychologa szkolnego jest diagnozowanie sytuacji wychowawczych pod kątem ich roli w rozwoju dziecka","zadania psychologa szkolnego są podporządkowane wymaganiom Poradni Psychologiczno Pedagogicznej"],"c":1},{"id":"e254-B","n":254,"g":"e5","q":"Zadania i obowiązki psychologa w placówce oświatowej:","a":["ograniczają się jedynie do interwencji oraz podejmowania problemów wychowawczych i edukacyjnych","wszystkie zadania psychologa szkolnego są podporządkowane naczelnemu celowi: dobru dziecka w wymiarze indywidualnym i społecznym","jedynym zadaniem psychologa szkolnego jest diagnozowanie sytuacji wychowawczych pod kątem ich roli w rozwoju dziecka","wszystkie zadania psychologa szkolnego są podporządkowane naczelnemu celowi: zapewnieniu sprawnego funkcjonowania placówki edukacyjnej"],"c":1},{"id":"e255-A","n":255,"g":"e5","q":"Do zadań psychologa edukacyjnego należy:","a":["działania mediacyjne","współpraca z nauczycielami, wychowawcami i rodzicami dziecka dla wyrównania szans edukacyjnych ucznia","doradztwo zawodowe","wszystkie odpowiedzi są prawidłowe"],"c":3},{"id":"e255-B","n":255,"g":"e5","q":"Do zadań psychologa edukacyjnego należy:","a":["działania mediacyjne","współpraca z nauczycielami, wychowawcami i rodzicami dziecka","konsultacje indywidualne z uczniami","wszystkie odpowiedzi są prawidłowe"],"c":3},{"id":"e255-C","n":255,"g":"e5","q":"Do zadań psychologa edukacyjnego należy:","a":["zdobywanie od rodziców uczniów wrażliwych informacji, tak aby dyrektor mógł lepiej kontrolować sytuację w placówce","korygowanie zachowań nauczycieli nieprzestrzegających regulaminu szkoły","dbanie o zachowanie dyscypliny w szkole","żadna z odpowiedzi nie jest prawidłowa"],"c":3},{"id":"e256","n":256,"g":"e5","q":"Szkoła jest systemem otwartym, który jako integralna całość kontaktuje się z otoczeniem. Na którym z poziomów tego systemu psycholog szkolny powinien wykonywać swoją pracę?","a":["poziom całej szkoły","grupy (klasa, grono pedagogiczne itd.)","osób (uczeń, nauczyciel itd.)","na każdym z poziomów"],"c":3},{"id":"e257-A","n":257,"g":"e5","q":"Co powinien zrobić psycholog z publicznej Poradni Psychologiczno-Pedagogicznej po realizacji diagnozy ucznia:","a":["Opracować opinię psychologiczną i wysłać ją pocztą do szkoły ucznia. Osobiście nie przekazywać rodzicom ani uczniowi wyników (chyba że rodzice złożą podanie o wyjaśnienie niejasności)","Opracować opinię psychologiczną i wysłać ją pocztą do szkoły ucznia. Osobiście nie przekazywać rodzicom ani uczniowi wyników (chyba że zażąda tego dyrektor placówki)","Wyjaśnić wyniki diagnozy rodzicom i jeśli będą tego oczekiwali opracować opinię psychologiczną, którą prześle pocztą do szkoły","Wyjaśnić wyniki diagnozy rodzicom i jeśli będą tego oczekiwali opracować opinię psychologiczną, którą wedle swojego uznania mogą dostarczyć do szkoły lub też tego nie robić"],"c":3},{"id":"e257-B","n":257,"g":"e5","q":"Co powinien zrobić psycholog z publicznej Poradni Psychologiczno-Pedagogicznej po realizacji diagnozy ucznia:","a":["Opracować opinię psychologiczną i wysłać ją listem poleconym do szkoły ucznia","Opracować opinię psychologiczną i wysłać ją równocześnie do szkoły i do rodziców","Wyjaśnić wyniki diagnozy rodzicom i jeśli będą tego oczekiwali, opracować opinię psychologiczną, którą prześle pocztą do szkoły","Wyjaśnić wyniki diagnozy rodzicom i jeśli będą tego oczekiwali, opracować opinię psychologiczną, którą wedle swojego uznania mogą dostarczyć do szkoły lub też tego nie robić"],"c":3},{"id":"e258-A","n":258,"g":"e5","q":"Praca psychologa edukacyjnego może się wiązać ze złożonością ról i konfliktem interesów ponieważ:","a":["Dzieci mogą być ofiarami przemocy","Jest jednocześnie w relacji z kilkoma klientami: dzieckiem, rodzicem i placówką edukacyjną","Rodzice unikają odpowiedzialności","Rodzice bywają roszczeniowi"],"c":1},{"id":"e258-B","n":258,"g":"e5","q":"Praca psychologa edukacyjnego może się wiązać ze złożonością ról i konfliktem interesów ponieważ:","a":["Dzieci mogą próbować przekonać psychologa, aby stanął po ich stronie","Jest jednocześnie w relacji z kilkoma klientami: dzieckiem, rodzicem i placówką edukacyjną","Nauczyciele bywają opresyjni","Rodzice bywają roszczeniowi"],"c":1},{"id":"e259","n":259,"g":"e5","q":"Model uczenia się od umiejętności teoretycznych do wiadomości praktycznych to model:","a":["alfa","beta","gamma","delta"],"c":3,"f":"niepewne"},{"id":"e260","n":260,"g":"e5","q":"Model uczenia się alfa zakłada między innym, że uczeń lub uczennica:","a":["samodzielnie odkrywa prawidłowości","poznaje świat przez działanie","ceni pracę indywidualną i długotrwały namysł","przedmioty szkolne uważa za nudne i ma do nich stosunek lekceważący"],"c":2,"f":"niepewne","e":"Żadna odpowiedź nie opisuje modelu alfa wprost; c jest najbliższa (alfa = przyswajanie, praca indywidualna)."},{"id":"e261","n":261,"g":"e5","q":"\"Uczeń lub uczennica samodzielnie odkrywa prawidłowości. Żywo interesuje się teorią naukową i prowadzeniem badań. Ceni pracę indywidualną i długotrwały namysł. Czyta książki popularnonaukowe i dyskutuje na ich temat. Znacznie słabiej orientuje się w najbliższym otoczeniu i w życiu społecznym\" - to opis modelu uczenia się:","a":["alfa","beta","gamma","delta"],"c":2},{"id":"e262","n":262,"g":"e5","q":"Diagnoza genetyczna / Diagnoza fazy:","a":["to synonim diagnozy pełnej","jest to diagnoza alternatywna w stosunku do diagnozy pełnej","jest częścią diagnozy pełnej","polega na zastosowaniu wybranego modelu rozwojowego w identyfikowaniu okoliczności i zachowań mających wpływ na proces uczenia się"],"c":2},{"id":"e263","n":263,"g":"e5","q":"Wrażliwy emocjonalnie, impulsywny, chętnie podejmuje ryzyko i eksperymentuje - ten opis pasuje do typu umysłu:","a":["globalno-obiektywnego","konkretno-subiektywnego","konkretno-obiektywnego","globalno-subiektywnego"],"c":1},{"id":"e264","n":264,"g":"e5","q":"Który opis pasuje do intuicjonisty:","a":["uparte poszukiwanie i chłodne rejestrowane faktów, logiczne rozumowanie, ostrożne wnioskowanie, skłonność do stosowania sprawdzonych schematów działania, pilna obserwacja skutków podjętych decyzji","wrażliwość na emocje przejawiane przez uczniów, wczuwanie się w motywy zachowań, osobiste wartościowanie faktów, żywość argumentacji, skłonność do przewodzenia zespołom oceniającym","analiza przypadku w ujęciach alternatywnych, fakty jako dowody prawdziwości twierdzeń ogólnych, pogłębione wyjaśnienia teoretyczne, odwlekanie decyzji, tymczasowość i dyskusyjność rozstrzygnięć","przygodowe traktowanie diagnozy, podejmowanie ryzyka, śmiałość działań w zmiennej sytuacji, pomysłowość, sprawne podejmowanie decyzji, impulsywność, emocjonalna argumentacja za przyjętym rozstrzygnięciem"],"c":1},{"id":"e265","n":265,"g":"e5","q":"Dokończ zdanie: \"Emocjonalne obciążenia funkcji diagnosty edukacyjnego uwidaczniają się:","a":["zawsze w rezygnacji z pracy","między innymi w nadmiernym poczuciu odpowiedzialności oraz nawyk oceniania i wartościowania","w nastawieniu zadaniowym","w zobojętnieniu na sytuacje zadaniową"],"c":1},{"id":"e266","n":266,"g":"e5","q":"Rodzaje ewaluacji w edukacji to:","a":["ewaluacja zsumowana, dyrektywna, opisowa, podsumowująca, kształtująca","ewaluacja konkluzywna, dialogowa, formatywna, \"bez względu na cele\", systemowa","przede wszystkim ewaluacja sprawiedliwa vs niesprawiedliwa","ewaluacja semestralna, początkowa i końcowa"],"c":1},{"id":"e267","n":267,"g":"e5","q":"Ewaluacja ukrywająca braki, promująca zalety to ewaluacja:","a":["niedopuszczalna","wybielająca","towarzyska","rytualna"],"c":1},{"id":"e268","n":268,"g":"e5","q":"W systemie demokratycznym wyróżniamy typy ewaluacji:","a":["wydumana, wybielająca, towarzyska","masywna, torpedująca, pod dyktando","rytualna, spychająca, przelotna","przelotna, towarzyska, masywna"],"c":0},{"id":"e269","n":269,"g":"e5","q":"Krótkotrwała, pomocnicza obserwacja zachowań podczas diagnozy:","a":["jest charakterystyczna dla psychologa","jest charakterystyczna dla pedagoga","jest charakterystyczna dla psychologa i pedagoga","nie jest charakterystyczna ani dla psychologa, ani dla pedagoga"],"c":0,"f":"niepewne"},{"id":"e270","n":270,"g":"e5","q":"Moralizowanie, grożenie, pouczanie, osądzanie, krzyżowy ogień pytań to niektóre z:","a":["blokad w kontakcie w czasie rozmowy diagnostycznej","cech rodzica nastolatka","cech nastolatka","cech wychowawcy rygorystycznego"],"c":0},{"id":"e271","n":271,"g":"e5","q":"Do cech bezradności intelektualnej można zaliczyć:","a":["poczucie niemożności zapanowania nad materiałem jednego lub więcej przedmiotów szkolnych, upadek wiary w skuteczność uczenia się","poczucie bycia gorszym, mniej uzdolnionym niż rodzeństwo, przypisywanie stanu lenistwu","chęć pokazywania siebie w jak najlepszym świetle, brak dostrzegania własnych braków","jedynie braku kompetencji poznawczych"],"c":0},{"id":"e272","n":272,"g":"e5","q":"Model uczenia się od wiadomości praktycznych do umiejętności teoretycznych to model:","a":["alfa","beta","gamma","delta"],"c":2,"f":"niepewne"},{"id":"e273","n":273,"g":"e5","q":"\"Uczeń lub uczennica głęboko przeżywa swoje doświadczanie świata. Interesuje się szczególnie sprawami społecznymi. Bardzo chętnie pracuje w grupie, wyżywa się w dyskusjach. Działa w organizacjach szkolnych, wykazując inicjatywę. Przedmioty szkolne uważa za nudne i ma do nich stosunek lekceważący\" - to opis modelu uczenia się:","a":["alfa","beta","gamma","delta"],"c":3},{"id":"e274","n":274,"g":"e5","q":"\"Dąży do głębokiego rozumienia i przeżycia problemów, duchowego przywództwa i wpływu\" - ten opis pasuje do typu umysłu:","a":["globalno-obiektywnego","konkretno-subiektywnego","konkretno-obiektywnego","globalno-subiektywnego"],"c":3},{"id":"e275","n":275,"g":"e5","q":"Jednym z podstawowych praw dziecka w diagnozie psychologicznej jest:","a":["prawo do poznania wyników diagnozy","prawo do przekazania opinii publicznej wyników badań","prawo do obecności nauczyciela podczas diagnozy","prawo do otrzymania ekwiwalentu za udział w badaniu"],"c":0},{"id":"e276","n":276,"g":"e5","q":"Przekonanie, że samo zdiagnozowanie problemu może go rozwiązać, jest przejawem","a":["zasady Rumpelstilzchena","efektu Barnuma","efektu Rosenthala","efektu placebo"],"c":0},{"id":"e277","n":277,"g":"e5","q":"Kultura szkoły to między innymi:","a":["sposób, w jaki ułożone są ławki w klasie","przekonania kadry o tym, kim jest dziecko i jaką rolę ma szkoła","język, jakim posługujemy się w szkole, np. zwracanie się do nauczycieli „Profesorze”","wszystkie odpowiedzi są prawidłowe"],"c":3},{"id":"e278","n":278,"g":"e5","q":"Diagnoza edukacyjna to","a":["uściślone rozpoznanie warunków, przebiegu i wyników uczenia się","rozpoznanie występowania dysleksji rozwojowej","diagnoza trudności szkolnych","ocena okresowa nauczyciela"],"c":0},{"id":"e279","n":279,"g":"e5","q":"W modelu uczenia się alfa brak jest założenia, że uczeń lub uczennica","a":["pilnie przyswaja wiedzę podręcznikową","poznaje świat przez działanie","stara się podczas przyswajania wiedzy niczego nie pominąć","dokładność i systematyczność uważa za najważniejsze"],"c":1},{"id":"e280","n":280,"g":"e5","q":"„Najchętniej uczę się tego, co jest przydatne w życiu” – tak powie uczeń w modelu uczenia się","a":["alfa","beta","gamma","delta"],"c":1},{"id":"e281","n":281,"g":"e5","q":"Diagnoza całkowita","a":["to synonim diagnozy pełnej","jest to diagnoza alternatywna w stosunku do diagnozy pełnej","taki typ diagnozy nie jest wyróżniany","polega na zastosowaniu wybranego modelu rozwojowego w identyfikowaniu okoliczności i zachowań mających wpływ na proces uczenia się"],"c":2,"f":"niepewne"},{"id":"e282","n":282,"g":"e5","q":"Który opis typu umysłu prezentuje typ globalno-obiektywny?","a":["Wrażliwy emocjonalnie, impulsywny, chętnie podejmuje ryzyko i eksperymentuje","Poszukuje szczegółowych faktów, jest logiczny, ostrożny, przestrzega reguł zewnętrznych","Wykorzystuje modele i prawa ogólne, poszukuje wyjaśnień deterministycznych, tworzy teorie","Dąży do głębokiego rozumienia i przeżycia problemów, duchowego przywództwa i wpływu"],"c":2},{"id":"e283","n":283,"g":"e5","q":"Poszukuje szczegółowych faktów, jest logiczny, ostrożny, przestrzega reguł zewnętrznych – ten opis pasuje do typu umysłu","a":["globalno-obiektywnego","konkretno-subiektywnego","konkretno-obiektywnego","globalno-subiektywnego"],"c":2},{"id":"e284","n":284,"g":"e5","q":"Które przyporządkowanie nie jest poprawne?","a":["typ konkretno-subiektywny – model beta, typ globalno-subiektywny – model delta","typ konkretno-obiektywny – model alfa, typ globalno-obiektywny – model beta","typ konkretno-obiektywny – model alfa, typ globalno-obiektywny – model gamma","typ globalno-obiektywny – model gamma, typ konkretno-subiektywny – model beta"],"c":1},{"id":"e285","n":285,"g":"e5","q":"Który opis pasuje do proceduralisty?","a":["uparte poszukiwanie i chłodne rejestrowanie faktów, logiczne rozumowanie, ostrożne wnioskowanie, skłonność do stosowania sprawdzonych schematów działania, pilna obserwacja skutków podjętych decyzji","wrażliwość na emocje przejawiane przez uczniów, wczuwanie się w motywy zachowań, osobiste wartościowanie faktów, żywość argumentacji, skłonność do przewodzenia zespołom oceniającym","analiza przypadku w ujęciach alternatywnych, fakty jako dowody prawdziwości twierdzeń ogólnych, pogłębione wyjaśnienia teoretyczne, odwlekanie decyzji, tymczasowość i dyskusyjność rozstrzygnięć","przygodowe traktowanie diagnozy, podejmowanie ryzyka, śmiałość działań w zmiennej sytuacji, pomysłowość, sprawne podejmowanie decyzji, impulsywność, emocjonalna argumentacja za przyjętym rozstrzygnięciem"],"c":0},{"id":"e286","n":286,"g":"e5","q":"Diagnosta teoretyk","a":["wczuwa się w motywy zachowań ucznia","analizuje w ujęciach alternatywnych","traktuje diagnozę przygodowo","unika stosowania metod psychometrycznych"],"c":1},{"id":"e287","n":287,"g":"e5","q":"Które z poniższych nie opisują rodzajów ewaluacji w edukacji?","a":["ewaluacja konkluzywna, dialogowa","ewaluacja „bez względu na cele”, systemowa","ewaluacja konkluzywna, formatywna","ewaluacja semestralna, początkowa i końcowa"],"c":3},{"id":"e288","n":288,"g":"e5","q":"Dokończ zdanie: „Trafność prognostyczna …”","a":["jest oparta na analizie treści narzędzia","to proces formułowania pytań i odpowiedzi dotyczących trafności pomiaru i diagnozy","związana jest ze zgodnością przebiegu i wyników pomiaru z wybranymi założeniami teorii psychologicznej i pedagogicznej","jest oparta na kryterium odroczonym w czasie"],"c":3},{"id":"e289","n":289,"g":"e5","q":"Ewaluacja wykonywana z obowiązku, szablonowo, to ewaluacja","a":["niedopuszczalna","konstruktywna","towarzyska","rytualna"],"c":3},{"id":"e290","n":290,"g":"e5","q":"Do metod badań edukacyjnych w działaniu nie zaliczymy","a":["obserwacji uczestniczącej","rozmowy diagnostycznej","protodiagnozy rodzicielskiej","eksperymentu naturalnego"],"c":2,"f":"niepewne"},{"id":"e291","n":291,"g":"e5","q":"Które z poniższych nie należą do blokad w czasie rozmowy diagnostycznej?","a":["moralizowanie i grożenie","pouczanie i osądzanie","osądzanie i krzyżowy ogień pytań","zrozumienie dla uczuć i unikanie walki"],"c":3},{"id":"e292","n":292,"g":"e5","q":"Zaufanie do siebie i świata, poczucie własnej wartości, skłonność do zachowań prospołecznych itp. to niektóre z elementów wskazanych","a":["jako elementy dojrzałości emocjonalnej","jako czynniki dostosowania społecznego","w opisie cech nastolatka z mniejszości społecznych","jako typowe cechy nastolatka wychowywanego w stylu permisywnym"],"c":1,"f":"niepewne"},{"id":"e293","n":293,"g":"e5","q":"Który z opisów przedstawia zjawisko bezradności intelektualnej?","a":["poczucie niemożności zapanowania nad materiałem jednego lub więcej przedmiotów szkolnych, upadek wiary w skuteczność uczenia się to cechy","braku sprawczości","poczucie niemożności zapanowania nad materiałem jednego lub więcej przedmiotów szkolnych, upadek wiary w skuteczność uczenia się to cechy","braku kompetencji poznawczych"],"c":0,"f":"niepewne","e":"W oryginale odpowiedzi są rozbite w połowie zdania („…to cechy” + „braku sprawczości”). Zaznaczono opis zjawiska."},{"id":"e294","n":294,"g":"e5","q":"Który opis pasuje do diagnosty ryzykanta?","a":["uparte poszukiwanie i chłodne rejestrowanie faktów, logiczne rozumowanie, ostrożne wnioskowanie, skłonność do stosowania sprawdzonych schematów działania, pilna obserwacja skutków podjętych decyzji","wrażliwość na emocje przejawiane przez uczniów, wczuwanie się w motywy zachowań, osobiste wartościowanie faktów, żywość argumentacji, skłonność do przewodzenia zespołom oceniającym","analiza przypadku w ujęciach alternatywnych, fakty jako dowody prawdziwości twierdzeń ogólnych, pogłębione wyjaśnienia teoretyczne, odwlekanie decyzji, tymczasowość i dyskusyjność rozstrzygnięć","przygodowe traktowanie diagnozy, podejmowanie ryzyka, śmiałość działań w zmiennej sytuacji, pomysłowość, sprawne podejmowanie decyzji, impulsywność, emocjonalna argumentacja za przyjętym rozstrzygnięciem"],"c":3},{"id":"e295","n":295,"g":"e5","q":"Uczeń jako podmiot w kontekście oczekiwanych ról społecznych jest ujmowany w diagnozie","a":["holistycznej","socjologicznej","fazy","edukacyjnej"],"c":1,"f":"niepewne"},{"id":"e296","n":296,"g":"e5","q":"Dokończ zdanie: „Trafność argumentacyjna …”","a":["jest oparta na analizie treści narzędzia","to proces formułowania pytań i odpowiedzi dotyczących trafności pomiaru i diagnozy","związana jest ze zgodnością przebiegu i wyników pomiaru z wybranymi założeniami teorii psychologicznej i pedagogicznej","jest oparta na kryterium odroczonym w czasie"],"c":1},{"id":"e297","n":297,"g":"e5","q":"Na kulturę szkoły składają się","a":["wytwory materialne i symboliczne (np. symbole, architektura)","pożądane wartości, normy, standardy i cele","podstawowe przekonania, sposoby myślenia i przyjęte ideologie","wszystkie wymienione"],"c":3},{"id":"e298","n":298,"g":"e5","q":"Traktowanie przekonania o trafności diagnozy jako dowodu jej trafności jest określane","a":["zasadą Rumpelstilzchena","efektem Barnuma","efektem Rosenthala","efektem Pigmaliona"],"c":1},{"id":"e299-A","n":299,"g":"e5","q":"Do zadań psychologa szkolnego należy","a":["działalność diagnostyczna","udzielanie uczniom pomocy w formach odpowiednich do rozpoznanych potrzeb","profilaktyka uzależnień","wszystkie z powyższych odpowiedzi są prawidłowe"],"c":3},{"id":"e299-B","n":299,"g":"e5","q":"Do zadań psychologa szkolnego należy","a":["inicjowanie i prowadzenie działań interwencyjnych w sytuacjach kryzysowych","wspieranie nauczycieli w udzielaniu pomocy psychologiczno-pedagogicznej","profilaktyka uzależnień","wszystkie powyższe odpowiedzi są prawidłowe"],"c":3},{"id":"e300-A","n":300,"g":"e5","q":"Pomoc psychologiczna udzielana w poradniach psychologiczno-pedagogicznych może mieć formę","a":["interwencji kryzysowej","warsztatów","porad i konsultacji","wszystkie powyższe odpowiedzi są prawidłowe"],"c":3},{"id":"e300-B","n":300,"g":"e5","q":"Pomoc psychologiczna udzielana w poradniach psychologiczno-pedagogicznych może mieć formę","a":["indywidualnych lub grupowych zajęć terapeutycznych dla dzieci i młodzieży","terapii rodziny","grup wsparcia","wszystkie powyższe odpowiedzi są prawidłowe"],"c":3},{"id":"e301","n":301,"g":"e5","q":"Dziecko jako pacjent w poradni psychologiczno-pedagogicznej","a":["zawsze wykonuje komplet badań diagnostycznych prowadzonych przez psychiatrę, psychologa, logopedę i pedagoga","musi wykonać testy diagnostyczne ze względu na wymogi oświatowe","ma prawo do autonomii i ochrony prywatności","odpowiedzi b i c są poprawne"],"c":2},{"id":"e302","n":302,"g":"e5","q":"Kiedy na diagnozę do poradni psychologiczno-pedagogicznej w kierunku specyficznych trudności w uczeniu się zgłasza się 16-latek, diagnosta powinien","a":["pozyskać zgodę szkoły na badanie, gdyż uczniów z trudnościami w uczeniu nadzoruje kuratorium oświaty","uzyskać wyłącznie pisemną zgodę rodziców","uzyskać podwójną zgodę: rodziców i samego dziecka","pozyskać podwójną zgodę: rodziców i placówki oświatowej"],"c":2},{"id":"e303","n":303,"g":"e5","q":"Publiczna poradnia psychologiczno-pedagogiczna udziela pomocy","a":["dzieciom, które mieszkają w rejonie pracy poradni i uczęszczają do przedszkola poza rejonem poradni","dzieciom, które są zameldowane w rejonie poradni i uczęszczają do przedszkola poza rejonem pracy poradni","dzieciom, które uczęszczają do przedszkola w rejonie pracy poradni","żadne z powyższych"],"c":2},{"id":"e304","n":304,"g":"e5","q":"W poradniach psychologiczno-pedagogicznych zatrudnieni są","a":["psychologowie","pedagodzy","logopedzi","wszyscy wymienieni wyżej specjaliści"],"c":3},{"id":"e305","n":305,"g":"e5","q":"Z diagnozą nozologiczną na potrzeby edukacji związane są ryzyka","a":["braku etykiety diagnostycznej, która nie pozwoli na wdrożenie odpowiednich procedur postępowania terapeutycznego w placówce oświatowej","reifikacji i samospełniającego się proroctwa","tłumaczenia niepowodzeń edukacyjnych dziecka określonym przypisanym mu zaburzeniem / chorobą","odpowiedzi b i c są poprawne"],"c":3},{"id":"e306","n":306,"g":"e5","q":"Zespoły orzekające działające w publicznych poradniach psychologiczno-pedagogicznych NIE wydają","a":["orzeczenia o potrzebie kształcenia specjalnego","orzeczenia o potrzebie zajęć rewalidacyjno-wychowawczych","opinii o potrzebie wczesnego wspomagania rozwoju","orzeczenia o niepełnosprawności"],"c":3},{"id":"e307","n":307,"g":"e5","q":"Zakres obowiązków psychologa pracującego w szkole i poradni regulują rozporządzenia wydane przez","a":["Ministra polityki społecznej","Ministra edukacji i nauki","Ministra zdrowia","Ministra rozwoju i technologii"],"c":1},{"id":"e308","n":308,"g":"e5","q":"Praktyka oparta na dowodach empirycznych wg APA (2006)","a":["nie ma zastosowania w diagnozie osób niepełnoletnich","wymaga przede wszystkim stosowania prób klinicznych i testów projekcyjnych","nie ma zastosowania w Polsce","postuluje stosowanie wiarygodnych narzędzi diagnostycznych"],"c":3},{"id":"e309","n":309,"g":"e5","q":"W wypadku osób w wieku od 16 lat do 18 lat psycholog-diagnosta na wykonanie badania diagnostycznego","a":["pozyskuje tzw. podwójną zgodę (dziecka oraz rodziców/opiekunów)","pozyskuje wyłącznie zgodę rodziców, jako prawnych opiekunów podejmujących decyzje w imieniu nieletniego","poza zgodą rodziców pozyskuje także zgodę placówki oświatowej, do której uczęszcza nieletni","obie odpowiedzi a i c są poprawne"],"c":0},{"id":"e310","n":310,"g":"e5","q":"Psycholog rozpoczynając proces diagnostyczny osoby nieletniej, zawiera z rodzicami kontrakt diagnostyczny, który powinien uwzględniać uzgodnienia dotyczące","a":["celu i rodzaju diagnozy, liczby planowanych spotkań z rodzicem i dzieckiem, formy informacji zwrotnej po badaniu","warunków przeprowadzenia badania, czasu oczekiwania na opinię psychologiczną, informację o możliwości modyfikacji kontraktu w trakcie procesu diagnostycznego","warunków przekazania rodzicowi wyników liczbowych i arkuszy testowych, konieczności przekazania wyników diagnozy do placówki oświatowej, zaleceń dotyczących innych odbiorców opinii","odpowiedzi a i b są poprawne"],"c":3},{"id":"e311","n":311,"g":"e5","q":"W procesie diagnostycznym na potrzeby edukacyjne dziecko jako pacjent ma prawo do autonomii, co oznacza, że","a":["cele procesu diagnostycznego są określane przez dorosłego opiekuna oraz diagnostę","może podejmować decyzje dotyczące swojej osoby i np. odmówić uczestniczenia w danym badaniu","przysługuje mu wprawdzie prawo do ochrony prywatności, ale wyniki diagnozy muszą być przekazane do placówki oświatowej","może kształtować cele diagnozy, ale wyniki diagnozy przekazywane są jedynie rodzicom i placówce oświatowej"],"c":1},{"id":"e312","n":312,"g":"e5","q":"Diagnozę w poradniach psychologiczno-pedagogicznych prowadzi się między innymi w celu","a":["określenia indywidualnych możliwości i potrzeb rozwojowych oraz edukacyjnych ucznia","wyjaśnienia funkcjonowania rodziny ucznia i naprawienia jej sytuacji","przekazania placówce oświatowej dokumentacji stanowiącej uzasadnienie prawne do wprowadzenia przez nauczycieli dostosowań procesu dydaktycznego","wystawienia orzeczenia o niepełnosprawności"],"c":0},{"id":"e313","n":313,"g":"e5","q":"Kontrakt między diagnostą a pacjentem poradni psychologiczno-pedagogicznej","a":["psycholog zawiera wyłącznie z dzieckiem / nastolatkiem, gdyż to ono jest pacjentem poradni","psycholog zawiera z dzieckiem i opiekunem prawnym","nie dotyczy poradni psychologiczno-pedagogicznej, bo kontrakt zawiera się jedynie z pacjentem w terapii","jest zawierany tylko z osobami, które mają skierowanie na badanie wystawione przez placówkę oświatową"],"c":1},{"id":"e314","n":314,"g":"e5","q":"Do zadań publicznych poradni psychologiczno-pedagogicznych należy","a":["diagnozowanie dzieci i młodzieży","udzielanie dzieciom i młodzieży oraz rodzicom bezpośredniej pomocy psychologiczno-pedagogicznej","realizowanie zadań profilaktycznych oraz wspierających wychowawczą i edukacyjną funkcję przedszkola, szkoły i placówki, w tym wspieranie nauczycieli w rozwiązywaniu problemów dydaktycznych i wychowawczych","wszystkie powyższe odpowiedzi są prawidłowe"],"c":3},{"id":"e315","n":315,"g":"e5","q":"Poradnie psychologiczno-pedagogiczne nie wydają orzeczeń o","a":["potrzebie kształcenia specjalnego","niepełnosprawności","potrzebie indywidualnego nauczania","potrzebie zajęć rewalidacyjno-wychowawczych"],"c":1},{"id":"e316","n":316,"g":"e6","q":"Integracja edukacyjna uczniów z niepełnosprawnością powinna rozpoczynać się:","a":["w grupach rówieśniczych poza terenem szkoły","w integracyjnych drużynach sportowych","kółka zainteresowań działające przy świetlicach osiedlowych","wszystkie odpowiedzi są poprawne"],"c":3,"f":"niepewne"},{"id":"e317","n":317,"g":"e6","q":"Zgodnie z prawem do równego dostępu do edukacji zaplanowanie weryfikacji efektów uczenia się za pomocą różnych metod u różnych uczniów w tej samej klasie:","a":["jest przejawem uniwersalnego projektowania","jest przejawem racjonalnego dostosowania i modyfikacji","jest przejawem niesprawiedliwości","jest przejawem dyskryminacji"],"c":1},{"id":"e318","n":318,"g":"e6","q":"Projektowanie uniwersalne w uczeniu się to:","a":["forma doradztwa zawodowego związana z wyborem kierunku studiów","metoda nauczania projektowego","metoda ewaluacji efektów uczenia się za pomocą projektów grupowych","Żadna z pozostałych odpowiedzi nie jest prawidłowa"],"c":3},{"id":"e319","n":319,"g":"e6","q":"Zdaniem Żytko, standaryzacja praktyk edukacyjnych prowadzi do:","a":["Żadna z pozostałych odpowiedzi nie jest prawidłowa","podniesienia wartości indywidualnych strategii uczenia się","wsparcia kreatywnych rozwiązań edukacyjnych","podniesienia jakości kształcenia"],"c":0},{"id":"e320","n":320,"g":"e6","q":"Badania pokazują, że integracja i włączanie uczniów z niepełnosprawnościami do szkoły masowej:","a":["Żadna z pozostałych odpowiedzi nie jest prawidłowa","prowadzi do obniżenia wyników testów uczniów bez niepełnosprawności","wymaga wsparcia ze strony psychologów i innych wyspecjalizowanych profesjonalistów","przynosi więcej szkody niż pożytku"],"c":2},{"id":"e321","n":321,"g":"e6","q":"Badania pokazują, że uczniowie z niepełnosprawnościami w szkole powszechnej:","a":["Żadna z pozostałych odpowiedzi nie jest prawidłowa","cieszą się uznaniem i sympatią ze strony nauczycieli","cieszą się uznaniem i sympatią ze strony rodziców dzieci bez niepełnosprawności","cieszą się uznaniem i sympatią ze strony dzieci bez niepełnosprawności"],"c":0},{"id":"e322-A","n":322,"g":"e6","q":"Racjonalne dostosowania w edukacji to:","a":["wprowadzenie logiki do pracy nauczycieli wszystkich przedmiotów","wprowadzenie zasad indywidualizacji w pracy dydaktycznej i ewaluacji uczniów ze specjalnymi potrzebami edukacyjnymi","wprowadzenie systemu wejściówek weryfikujących poziom racjonalności uczniów","wprowadzenie racjonalnych standardów wynagradzania pracy nauczycieli"],"c":1},{"id":"e322-B","n":322,"g":"e6","q":"Racjonalne dostosowania w edukacji to:","a":["obowiązkowy kurs logiki formalnej dla nauczycieli wszystkich przedmiotów","wprowadzenie zasad indywidualizacji w pracy dydaktycznej i ewaluacji uczniów ze specjalnymi potrzebami edukacyjnymi","wprowadzenie systemu wejściówek weryfikujących poziom racjonalności uczniów","wprowadzenie racjonalnych standardów wynagradzania pracy nauczycieli"],"c":1},{"id":"e322-C","n":322,"g":"e6","q":"Racjonalne dostosowania w edukacji to:","a":["obowiązkowy kurs racjonalizmu dla dyrektorów szkół","wprowadzenie zasad indywidualizacji w pracy dydaktycznej i ewaluacji uczniów ze specjalnymi potrzebami edukacyjnymi","racjonalizacja przepływu informacji między kuratorium a ministerstwem","wprowadzenie racjonalnych standardów wynagradzania pracy nauczycieli"],"c":1},{"id":"e323-A","n":323,"g":"e6","q":"SPE to:","a":["Sensytyzacja Pedagogiczno-Edukacyjna","Społeczna Pedagogika Eksperymentalna","Symboliczna Pedagogika Ekologiczna","Żadna z odpowiedzi nie jest prawidłowa"],"c":3},{"id":"e323-B","n":323,"g":"e6","q":"SPE to:","a":["Suplementacja Pedagogiczno-Edukacyjna","Społeczna Pedagogika Empiryczna","Specyficzna Pedagogika Ekologiczna","Żadna z odpowiedzi nie jest prawidłowa"],"c":3},{"id":"e323-C","n":323,"g":"e6","q":"SPE to:","a":["Specjalny Program Edukacyjny","Społeczna Pedagogika Empiryczna","Specyficzna Pedagogika Ekologiczna","Żadna z odpowiedzi nie jest prawidłowa"],"c":3},{"id":"e32 kie odpowiedzi są nieprawdziwe"],"c":1},{"id":"e330","n":330,"g":"e6","q":"Jakie są trzy obszary relacji mentoringowej wg Maryann Jacobi (1991)?","a":["emocjonalne i psychologiczne wsparcie, bezpośrednia pomoc w rozwoju zawodowym i karierze, promowanie w sieci własnych kontaktów","bezpośrednia pomoc w rozwoju zawodowym i karierze, pomoc finansowa, dostępność","emocjonalne i psychologiczne wsparcie, bezpośrednia pomoc w rozwoju zawodowym i karierze, modelowanie ról","wszystkie odpowiedzi są prawidłowe"],"c":2},{"id":"e331","n":331,"g":"e6","q":"„Integracja głównego nurtu” osób niepełnosprawnych to (Kowalik, 2011)","a":["Umieszczenie osób różniących się od większości w miejscu, gdzie będą czuli się dobrze, np. w klasach specjalnych","Umieszczenie w tej samej przestrzeni osób niepełnosprawnych i sprawnych oraz dostosowanie wymagań edukacyjnych i organizacyjnych do ich możliwości","Umieszczenie uczniów pełnosprawnych w ośrodkach kształcenia specjalnego","Zachęcanie uczniów pełnosprawnych do edukacji w szkołach kształcenia specjalnego"],"c":1},{"id":"e332","n":332,"g":"e6","q":"Przykładem racjonalnego dostosowania i modyfikacji (RDM) w stosunku do ucznia z ADHD jest","a":["Umieszczanie w klasie specjalnej","Pozwoleniu mu na wstawanie z ławki i chodzenie w wyznaczonym miejscu, tak aby nie przeszkadzał innym","Poświęcanie mu podczas lekcji całej uwagi, a zadanie klasie zadań w podgrupach","Zorganizowania nauczania indywidualnego w domu, tak aby nie przeszkadzał w edukacji nauczycielowi i klasie"],"c":1},{"id":"e333","n":333,"g":"e6","q":"Rolą psychologa w procesie integracji dziecka NIE jest","a":["Dobór odpowiednich metod nauczania podczas matematyki lub języka polskiego","Diagnoza grupy rówieśniczej dla dziecka","Zaznajomienie nauczycieli ze specyfiką trudności u dziecka","Wsparcie rodziców począwszy od momentu podjęcia decyzji o integracji"],"c":0},{"id":"e334","n":334,"g":"e6","q":"Jakie są kluczowe elementy relacji mentoringowej wg Eby i in. (2013)?","a":["wsparcie in
