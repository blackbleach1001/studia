pozytywna koncentruje się na:","a":["wzmacnianiu czynników chroniących","redukowaniu czynników ryzyka","przekazywaniu odbiorcom tylko pozytywnych informacji","ukazywaniu pozytywnych konsekwencji zachowań ryzykownych"],"c":0},{"id":"e341","n":341,"g":"e7","q":"Podstawowymi podejściami w zakresie psychoprofilaktyki przemocy są:","a":["Podejście niesystemowe, oparte na indywidualnej wizji szkoły","Podejście intuicyjne, oparte na tym, co czuje prowadzący program przeciw przemocy","Podejście systemowe i zintegrowane, praktykujące szeroką gamę oddziaływań interwencyjnych, profilaktycznych i edukacyjnych","Podejście oparte na prywatnym doświadczeniu psychologa szkolnego"],"c":2},{"id":"e342","n":342,"g":"e7","q":"Najczęściej przyczyną mobbingu rówieśniczego jest:","a":["Konflikt między uczniami","Nienawiść sprawcy mobbingu do jego ofiary","Prowokacyjne zachowanie ofiary","Najczęściej mobbing pojawia się bez powodu, konfliktu czy jakiejkolwiek prowokacji"],"c":3},{"id":"e343","n":343,"g":"e7","q":"Nauczyciel spostrzegający symptomy zaburzeń u ucznia, może uruchomić - zgodnie z modelem pobudzenia bilansu - następujące działania pomocowe:","a":["Sygnalizować problem (informowanie rodziców, specjalistów itp.)","Być gotowym do działania pod warunkiem współpracy ze strony otoczenia (rodzice, specjaliści, inni nauczyciele)","Podejmować indywidualne działania, niezależnie od gotowości otoczenia do współpracy","Wszystkie odpowiedzi są prawidłowe"],"c":3},{"id":"e344","n":344,"g":"e7","q":"Programy antymobbingowe cechujące się największą skutecznością:","a":["Skupiają się na rozwoju ogólnych umiejętności społecznych uczniów","Rozwijają u sprawców mobbingu zdolności do empatii","Skupiają się na uczeniu sprawców mobbingu radzenia sobie z trudnymi emocjami","żadna odpowiedź nie jest prawidłowa"],"c":3},{"id":"e345","n":345,"g":"e7","q":"Które z poniższych nie należy do przejawów niedostosowania społecznego według Pytki to:","a":["niska samoocena","brak kontroli emocjonalnej i poznawczej","zachowania agresywne","obniżenie nastroju"],"c":3,"f":"niepewne"},{"id":"e346","n":346,"g":"e7","q":"Do czynników ryzyka zachowań samobójczych dzieci i młodzieży zalicza się","a":["depresję","negatywny klimat społeczny","przyjmowanie substancji psychoaktywnych","wszystkie wymienione"],"c":3},{"id":"e347","n":347,"g":"e7","q":"Z badań (Cole i in., 2021) na temat skutków bullyingu obserwowanych u ofiar i sprawców bullyingu wynika, że","a":["zarówno ofiary, jak i sprawcy bullyingu doświadczają negatywnych konsekwencji","ofiary doświadczają zupełnie innych konsekwencji niż sprawcy","ofiary i sprawcy bullyingu stanowią odmienne, homogeniczne grupy","wszystkie odpowiedzi są prawidłowe"],"c":0},{"id":"e348","n":348,"g":"e7","q":"Które z poniższych czynników mogą wzmacniać proces „resilience”?","a":["dobre relacje z rodzicami","samoświadomość","angażowanie się w działalność wolontariacką","wszystkie wymienione odpowiedzi są poprawne"],"c":3},{"id":"e349","n":349,"g":"e7","q":"Chcąc pracować z grupą młodzieży, która wagaruje oraz eksperymentuje z różnymi używkami, należy podjąć działania z obszaru","a":["profilaktyki selektywnej","profilaktyki uniwersalnej","profilaktyki wskazującej","profilaktyki dominującej"],"c":2},{"id":"e350","n":350,"g":"e7","q":"Chcąc zapobiegać występowaniu u uczniów zachowań ryzykownych, należy","a":["wprowadzić w szkole monitoring","ustanowić regulamin postępowania wraz z karami za łamanie zasad","kształtować u uczniów i nauczycieli postawy troski i zaangażowania","wprowadzić instytucję sądu koleżeńskiego"],"c":2},{"id":"e351","n":351,"g":"e7","q":"Profilaktyka pierwszorzędowa jest kierowana do","a":["wszystkich ludzi","grupy wysokiego ryzyka","osób z zaburzeniami","osób podlegających resocjalizacji"],"c":0},{"id":"e352","n":352,"g":"e7","q":"Koncepcja resilience","a":["wyjaśnia fenomen dobrego funkcjonowania człowieka, mimo niekorzystnych warunków rozwoju, wzmacnia w profilaktyce podejście pozytywne","pomaga człowiekowi trafnie rozpoznawać i regulować swoje emocje, skutecznie rozwiązywać codzienne problemy oraz nawiązywać i utrzymywać pozytywne relacje z innymi","zakłada wewnętrzny mechanizm regulacyjny, który dostraja reakcje jednostki do ciągle zmieniających się, często konfliktowych i trudnych warunków życia","najczęściej oznacza dialog i współpracę pomiędzy głównymi aktorami życia szkolnego, dobre relacje nauczyciel–uczeń, pozytywne więzi ze szkołą oraz poczucie bezpieczeństwa w szkole"],"c":0},{"id":"e353","n":353,"g":"e7","q":"Jaka strategia szkoły będzie najskuteczniejsza w zapobieganiu zachowaniom niepożądanym wśród młodzieży?","a":["strategia nastawiona na zmianę istotnych elementów całego środowiska szkolnego, w tym kultury szkoły","strategia ukierunkowana na zmianę indywidualnych zachowań uczniów","strategia koncentracji na osiąganiu najwyższych wyników w państwowych rankingach szkół","strategia skoncentrowana na zmianie metod wychowawczych rodziców"],"c":0},{"id":"e354","n":354,"g":"e7","q":"Patryk zaczaił się na Karola wychodzącego z toalety i wyrwał mu plecak. Mick przechwycił plecak i wysypał z niego rzeczy na schody. Podbiegł Seba i kopał książki oraz zeszyty, aż wszystkie spadły na parter. Magda, która pilnowała, czy nie idzie nauczyciel, krzyknęła: „Uwaga, pani idzie!” i wtedy wszyscy zniknęli z miejsca akcji. Potem w klasie głośno opowiadali, jak „rozprawili się z tym pedziem”. Przy schodach w trakcie całego zajścia stali też Iga, Kuba, Radek i Piotr. Śmiali się głośno, bili brawo i dopingowali. W tej sytuacji","a":["Iga, Kuba, Radek i Piotr przyjmują rolę aktywnych kibiców","Iga, Kuba, Radek i Piotr przyjmują rolę biernych kibiców","Iga, Kuba, Radek i Piotr przyjmują rolę obserwatorów","Iga, Kuba, Radek i Piotr przyjmują rolę niezaangażowanych świadków"],"c":0},{"id":"e355","n":355,"g":"e7","q":"„Bullying” to powtarzające się agresywne zachowanie z intencją wyrządzenia krzywdy jednostce, która jest w słabszej pozycji. W tej definicji bullyingu według Dana Olweusa nie odnajdziemy jednego istotnego elementu, który został wprowadzony podczas Światowego Forum Zapobiegania Bullyingowi (World Anti Bullying Forum – WABF) w 2021. Jest to","a":["Rozróżnienie na typy bullyingu ze względu na doświadczenie chłopców i dziewcząt","Dodanie definicji cyberbullyingu","Wskazanie, że bullying jest związany bezpośrednio z kontekstem i normami panującymi w danej szkole oraz całym systemem edukacyjnym w danym państwie","Rozróżnienie na bullying bezpośredni i pośredni"],"c":2},{"id":"e356","n":356,"g":"e7","q":"Uczniowie podejmujący rolę obrońcy wobec ofiary bullyingu charakteryzują się","a":["Wyższym statusem w klasie","Mają wyższe poczucie skuteczności w obszarze interweniowania w sytuacjach przemocy","Wiedzą, gdzie i w jaki sposób można uzyskać pomoc w sytuacji przemocy","Wszystkie odpowiedzi są prawidłowe"],"c":3},{"id":"e357","n":357,"g":"e7","q":"W sytuacji bullyingu bardzo istotne jest to, w jaki sposób na zachowanie uczniów reagują nauczyciele. W literaturze wskazuje się, że nauczyciele","a":["Najczęściej reagują w przypadku zaobserwowania przemocy relacyjnej","W przypadku przemocy fizycznej są przekonani o konieczności interweniowania i reagują znacznie częściej","Są szczególnie wrażliwi na przejawy przemocy werbalnej, w tym ośmieszanie i obgadywanie","Znacznie częściej dostrzegają zachowania uczniów w postaci wyzywania, obrażania czy ośmieszania, które odbywają się przy pomocy mediów społecznościowych"],"c":1},{"id":"e358","n":358,"g":"e7","q":"Wskaż opis zachowania wskazujący najtrafniej na ryzyko zaburzenia zachowania u dziecka","a":["Celowe zniszczenie nowej kurtki kolegi z klasy, pomimo wcześniej nałożonych nagan w szkole za podobne zachowania związane z niszczeniem cudzego mienia","Pomalowanie farbą kurtki kolegi na Prima Aprilis, a następnie przekazanie ze skruchą środków finansowych na zakup nowej kurtki","Zniszczenie kurtki kolegi pod wpływem złości na niego po tym, jak ten wyśmiewał się z jego znoszonej kurtki","Wszystkie wymienione przykłady są tylko trudnościami wychowawczymi"],"c":0},{"id":"e359","n":359,"g":"e7","q":"Program Treatment Foster Care Oregon (TFCO) jest skierowany","a":["dla uczniów z ADHD i ich rodziców","dla osób z zaburzeniami zachowania i ich rodziców","dla wszystkich uczniów i ich rodziców w stanie Oregon w USA","dla uczniów z ASD i ich rodziców"],"c":1},{"id":"e360","n":360,"g":"e7","q":"Zgodnie z ustaleniami badaczy cyberbullyingu obie formy zachowań bullyingowych – on-line jak i offline","a":["Są ze sobą skorelowane: uczeń wykluczany ze wspólnych aktywności w klasie częściej doświadcza bullyingu także za pomocą narzędzi cyfrowych","Są to odrębne formy bullyingu, a działania profilaktyczne powinny być podejmowane odrębnie i dla jednego bądź drugiego typu bullyingu","Są to odrębne formy bullyingu, a ofiary bullyingu bardzo rzadko są również jednocześnie ofiarami cyberbullyingu","Są ze sobą skorelowane, ale negatywne skutki cyberbullyingu są dużo mniejsze niż tradycyjnego bullyingu"],"c":0},{"id":"e361","n":361,"g":"e7","q":"Zgodnie z przyjętą i zaprezentowaną na wykładzie i w literaturze definicją bullying","a":["To intencjonalne zachowanie agresywne zmierzające do wyrządzenia komuś krzywdy","Zachowania mające miejsce w sytuacji nierównowagi sił, to znaczy jedna strona ma wyraźną przewagę fizyczną, psychiczną bądź społeczną nad drugą","Zachowania te powtarzają się przez pewien czas i nie można ich sprowadzić do pojedynczego incydentu","Wszystkie odpowiedzi są prawidłowe"],"c":3},{"id":"e362","n":362,"g":"e7","q":"Zdarzenie na schodach widziała spora grupa kolegów z klasy Karola. Olaf, Mirek, Paulina i Agata obserwowali scenę od początku aż do pojawienia się nauczyciela. Zaprezentowali zachowanie charakterystyczne dla","a":["biernych świadków","aktywnych kibiców","niezaangażowanych świadków","pomocników"],"c":0},{"id":"e363","n":363,"g":"e7","q":"Instytut Badań Edukacyjnych przeprowadził badania wśród dzieci i młodzieży szkolnej, w których pytano m.in., jaki rodzaj przemocy boli najbardziej. Na podstawie tych badań ustalono, że","a":["48% badanych wskazało dotkliwe pobicie jako bardzo przykre i jednocześnie 46% badanych wskazało nastawianie klasy przeciwko jako bardzo przykre","Większość badanych (ponad 50%) wskazywała na przemoc fizyczną jako najbardziej przykre doświadczenie","Większość badanych (ponad 50%) wskazywała na przemoc fizyczną jako najbardziej przykre doświadczenie, a jednocześnie przemoc relacyjną jako najmniej dotkliwą","Większość badanych (ponad 50%) wskazywała na przemoc relacyjną jako najbardziej przykre doświadczenie, a pozostałe formy przemocy były odczuwane przez uczniów jako mniej dotkliwe"],"c":0,"f":"niepewne"},{"id":"e364","n":364,"g":"e7","q":"Wskaż opis zachowań wskazujące na zaburzenia zachowania","a":["niszczenie cudzego mienia","jawne lekceważenie polecenia nauczyciela","w odpowiedzi na pochwałę swojego zachowania reaguje lekceważąco","wszystkie odpowiedzi są prawidłowe"],"c":3}],"dir":"edukacja"}</script>
