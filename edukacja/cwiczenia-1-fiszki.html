{
"q": "Jakie dwie funkcje wychowania wyróżnia Katra i jak je ujmuje?",
"a": "<p><strong>Socjalizacyjna:<\/strong> dziecko ma stać się członkiem wspólnoty przez wpajanie norm społeczno-kulturowych. <strong>Emancypacyjna:<\/strong> przygotowanie do autonomii i samoregulacji, związanych z poczuciem podmiotowości i odpowiedzialności. Autorka traktuje je jako <strong>komplementarne<\/strong>.",
"src": "Wychowanie, podmiotowość i rola eksperta",
"id": "edukacja/cwiczenia-1-fiszki:c4cf459d",
"unit": "cwiczenia-1.html",
"sec": "s1"
},
{
"q": "Czym jest podmiotowość według Katry (za Guryckę i Obuchowskim)?",
"a": "<p>Atrybutem osoby i stanem jej umysłu: poczuciem, że potrafi projektować własną osobę i postrzegać świat na swój sposób. Oznacza <strong>motywację wewnętrzną<\/strong>, dojrzałość myślenia, dystans do siebie, refleksję nad zmianami i aktywny stosunek do własnej koncepcji siebie; wiąże się z samowychowaniem, autokracją i planowaniem celów osobistych.<\/p>",
"src": "Wychowanie, podmiotowość i rola eksperta",
"id": "edukacja/cwiczenia-1-fiszki:8d36018e",
"unit": "cwiczenia-1.html",
"sec": "s1"
},
{
"q": "Jakie kompetencje podstawowe wskazuje UE (program „Kreator”) i dlaczego to nie wystarcza?",
"a": "<p>Organizowanie własnego uczenia się, skuteczne komunikowanie się, współdziałanie w zespole, twórcze rozwiązywanie problemów, posługiwanie się techniką informacyjną. Sprzyjają funkcjonowaniu we współczesnym świecie, ale <strong>nie wyczerpują<\/strong> warunków kształtowania podmiotowości, dlatego całość procesu wychowawczego ma ogarniać psycholog jako główny ekspert.<\/p>",
"src": "Wychowanie, podmiotowość i rola eksperta",
"id": "edukacja/cwiczenia-1-fiszki:3ea4a78c",
"unit": "cwiczenia-1.html",
"sec": "s1"
},
{
"q": "Czym różni się perspektywa wewnątrz- od zewnątrzsystemowej (Jurkowski)?",
"a": "<p><strong>Wewnątrzsystemowa:<\/strong> szkoła patrzy na siebie od środka i sprawdza, czy realizowane są jej deklarowane cele wychowawcze. <strong>Zewnątrzsystemowa:<\/strong> spojrzenie z zewnątrz na rzeczywiste rezultaty zjawisk w szkole, czyli faktyczne skutki dla rozwoju osobowego dziecka i jego podmiotowości.<\/p>",
"src": "Perspektywa zewnątrzsystemowa i zadania psychologa",
"id": "edukacja/cwiczenia-1-fiszki:08f083cd",
"unit": "cwiczenia-1.html",
"sec": "s2"
},
{
"q": "Jaki jest podstawowy atrybut roli psychologa szkolnego i jego główne zadanie?",
"a": "<p><strong>Atrybut:<\/strong> autonomia wobec formalnych celów szkoły. <strong>Zadanie:<\/strong> śledzenie wszystkich skutków oddziaływań wychowawczych w rzeczywistości szkolnej. Psycholog jest ekspertem od wychowania i inicjatorem działań wychowawczo-korekcyjnych, który jednocześnie należy i nie należy do środowiska szkolnego.<\/p>",
"src": "Perspektywa zewnątrzsystemowa i zadania psychologa",
"id": "edukacja/cwiczenia-1-fiszki:16946cc9",
"unit": "cwiczenia-1.html",
"sec": "s2"
},
{
"q": "Do czego służy ekspertyza psychologa i co wychwytuje?",
"a": "<p>Wychwytuje <strong>niezamierzone rezultaty<\/strong> ważne psychologicznie i społecznie. Jest punktem wyjścia dla działań korekcyjnych i profilaktycznych oraz podstawą postulatów wobec systemu oświaty (np. stwarzanie warunków do rozwoju samoregulacji), co czyni psychologa inicjatorem pożądanych oddziaływań.<\/p>",
"src": "Perspektywa zewnątrzsystemowa i zadania psychologa",
"id": "edukacja/cwiczenia-1-fiszki:813b31f7",
"unit": "cwiczenia-1.html",
"sec": "s2"
},
{
"q": "Jakie rozbieżności wskazuje psycholog, optymalizując proces wychowania szkolnego?",
"a": "<p>Między <strong>deklarowanymi a rzeczywistymi wymaganiami<\/strong> nauczycieli oraz między <strong>zamierzonymi a rzeczywistymi efektami<\/strong> pracy dydaktyczno-wychowawczej. Formułuje zalecenia je likwidujące lub zmniejszające i kreuje optymalne sytuacje wychowawcze.<\/p>",
"src": "Perspektywa zewnątrzsystemowa i zadania psychologa",
"id": "edukacja/cwiczenia-1-fiszki:7c9d44d1",
"unit": "cwiczenia-1.html",
"sec": "s2"
},
{
"q": "Dlaczego rola eksperta jest w praktyce niedoceniana i jak psycholog może zyskać autonomię?",
"a": "<p>Wymaga wyjścia poza system szkoły i oświaty, a psycholog jest podporządkowany dyrektorowi, więc trudno mu wyjść z roli usługodawcy. Może dążyć do indywidualnej autonomii: oferować potrzebne jego zdaniem działania <strong>bez oczekiwania na zapotrzebowanie zewnętrzne<\/strong>.<\/p>",
"src": "Perspektywa zewnątrzsystemowa i zadania psychologa",
"id": "edukacja/cwiczenia-1-fiszki:8a4a86ae",
"unit": "cwiczenia-1.html",
"sec": "s2"
},
{
"q": "Jakie cztery rodzaje działań wyróżnia Katra i jak są powiązane?",
"a": "<p>Monitoring, psychoprofilaktyka, interwencja i promocja. <strong>Monitoring jest bazą<\/strong> dla pozostałych. Profilaktyka, interwencja i promocja mogą być prowadzone równocześnie albo chronologicznie (np. przy agresji: interwencja, profilaktyka trzeciorzędowa, promocja).<\/p>",
"src": "Cztery rodzaje działań psychologa szkolnego",
"id": "edukacja/cwiczenia-1-fiszki:7867e3a3",
"unit": "cwiczenia-1.html",
"sec": "s3"
},
{
"q": "Jakie standardy weryfikacji przyjmuje psycholog w monitoringu i do jakich koncepcji się odwołuje?",
"a": "<p><strong>Spójność<\/strong> założonych celów i rzeczywistych konsekwencji oddziaływań oraz <strong>odpowiedniość<\/strong> tych konsekwencji wobec nadrzędnego celu (rozwój i samoregulacja dla satysfakcjonującej jakości życia, z prawem do godności i szacunku). Koncepcje: doświadczenia Guryckiej (1979) i interakcji wychowawczych Dryll (2001).<\/p>",
"src": "Cztery rodzaje działań psychologa szkolnego",
"id": "edukacja/cwiczenia-1-fiszki:45a13768",
"unit": "cwiczenia-1.html",
"sec": "s3"
},
{
"q": "Czym różnią się trzy poziomy psychoprofilaktyki i który nie jest zadaniem psychologa szkolnego?",
"a": "<p><strong>Pierwszorzędowa:<\/strong> szeroki krąg, niskie ryzyko, promocja zdrowego stylu życia. <strong>Drugorzędowa:<\/strong> zachowania ryzykowne już się pojawiły, ale nie chronicznie (agresywni, nieśmiali, odrzuceni). <strong>Trzeciorzędowa:<\/strong> permanentne zachowania ryzykowne, powrót po leczeniu; <strong>nie należy<\/strong> do zadań psychologa szkolnego.<\/p>",
"src": "Cztery rodzaje działań psychologa szkolnego",
"id": "edukacja/cwiczenia-1-fiszki:41bfdd43",
"unit": "cwiczenia-1.html",
"sec": "s3"
},
{
"q": "Na czym polega interwencja i promocja w pracy psychologa szkolnego?",
"a": "<p><strong>Interwencja:<\/strong> przy wyraźnych problemach; porady, zalecenia, modyfikacja postaw rodziców i nauczycieli, naprawa błędów wychowawczych, rozwiązywanie konfliktów i mediacje. <strong>Promocja:<\/strong> tworzenie warunków do wykorzystania potencjału ucznia; kompetencje komunikacyjne, przewidywanie konsekwencji, samoregulacja, podnoszenie samooceny.<\/p>",
"src": "Cztery rodzaje działań psychologa szkolnego",
"id": "edukacja/cwiczenia-1-fiszki:15dabe9d",
"unit": "cwiczenia-1.html",
"sec": "s3"
},
{
"q": "Jakie zasady etyczne obowiązują psychologa (także szkolnego)?",
"a": "<p>Tajemnica zawodowa, bezstronność, przejrzystość i rzetelna informacja o zamierzeniach, efektach i celu interakcji, zawieranie jasnej umowy dotyczącej tej interakcji.<\/p>",
"src": "Cztery rodzaje działań psychologa szkolnego",
"id": "edukacja/cwiczenia-1-fiszki:3aac06a2",
"unit": "cwiczenia-1.html",
"sec": "s3"
},
{
"q": "Jakie formy i kompetencje obejmuje monitoring w Tabeli 2?",
"a": "<p><strong>Formy:<\/strong> obserwacja i analiza, ekspertyza, monografia klasy, rozmowa lub wywiad, spotkania z klasą, rodzicami i nauczycielami. <strong>Kompetencje:<\/strong> obserwacja uczestnicząca, monografia klasy, metody socjometryczne, nawiązywanie kontaktu i współpracy ze środowiskiem szkolnym, prowadzenie wywiadu.<\/p>",
"src": "Tabela 2: charakterystyka działań",
"id": "edukacja/cwiczenia-1-fiszki:e43804e7",
"unit": "cwiczenia-1.html",
"sec": "s4"
},
{
"q": "Jakie są formy, funkcje i mechanizmy psychoprofilaktyki w Tabeli 2?",
"a": "<p><strong>Formy:<\/strong> szerzenie wiedzy, perswazja, praca z grupą (warsztaty, treningi). <strong>Funkcje:<\/strong> podnoszenie kompetencji wychowawczych wychowawców i interpersonalnych wychowanków, odporność na niekorzystne wpływy, samoregulacja. <strong>Mechanizmy:<\/strong> kształtowanie środowiska przez zmiany w elementach systemu, niwelowanie rozbieżności między wzorcem a stanem faktycznym, samokontrola.<\/p>",
"src": "Tabela 2: charakterystyka działań",
"id": "edukacja/cwiczenia-1-fiszki:19acf0bb",
"unit": "cwiczenia-1.html",
"sec": "s4"
},
{
"q": "Czym według Tabeli 2 charakteryzuje się interwencja, a czym promocja?",
"a": "<p><strong>Interwencja:<\/strong> cel to przywracanie korzystnych warunków wychowawczych; formy to porada, indywidualna pomoc, praca systemowa; mechanizmy to zasoby i strategie radzenia sobie ze stresem, kompensacja, nowe schematy; kompetencje obejmują mediację i arbitraż. <strong>Promocja:<\/strong> cel to formowanie osobowości zgodnie z potencjałem; formy to kształtowanie środowiska, treningi, warsztaty, wzorce; mechanizmy to nowe schematy i <strong>modelowanie<\/strong>.<\/p>",
"src": "Tabela 2: charakterystyka działań",
"id": "edukacja/cwiczenia-1-fiszki:c63c5f1f",
"unit": "cwiczenia-1.html",
"sec": "s4"
},
{
"q": "Czym są umiejętności społeczno-emocjonalne według Eliasa i dlaczego warto je rozwijać razem z poznawczymi?",
"a": "<p>Zwane też inteligencją emocjonalną; pozwalają współpracować, skutecznie się uczyć i pełnić role w rodzinie, społeczeństwie i pracy. <strong>Można ich nauczyć<\/strong> i wpływają pozytywnie na uczenie się. Gdy rozwój poznawczy i społeczno-emocjonalny idą razem, uczniowie lepiej zapamiętują materiał, czują odpowiedzialność i są bardziej zmotywowani.<\/p>",
"src": "Uczenie się poznawcze i społeczno-emocjonalne",
"id": "edukacja/cwiczenia-1-fiszki:fea4d487",
"unit": "cwiczenia-1.html",
"sec": "s5"
},
{
"q": "Dlaczego inteligencja społeczno-emocjonalna jest „brakującym ogniwem”?",
"a": "<p>Łączy zdobywanie wiedzy z umiejętnościami potrzebnymi do sukcesu w szkole, domu, społeczeństwie, pracy i życiu. W szkołach z dobrze realizowanymi programami uczniowie osiągają lepsze wyniki, jest mniej problemów z zachowaniem i lepsze relacje ze środowiskiem.<\/p>",
"src": "Uczenie się poznawcze i społeczno-emocjonalne",
"id": "edukacja/cwiczenia-1-fiszki:bf5d2a2d",
"unit": "cwiczenia-1.html",
"sec": "s5"
},
{
"q": "Czym jest CASEL i jakie cztery grupy umiejętności wyodrębnił?",
"a": "<p>Organizacja non-profit badająca edukację w nurcie SEL, założona w 1994 r. przez Golemana i Growald. Cztery grupy (16 umiejętności): <strong>poznaj siebie i innych<\/strong>, <strong>podejmuj odpowiedzialne decyzje<\/strong>, <strong>dbaj o innych<\/strong>, <strong>wiedz, jak trzeba postępować<\/strong>.<\/p>",
"src": "Umiejętności społeczno-emocjonalne według CASEL",
"id": "edukacja/cwiczenia-1-fiszki:82ea7084",
"unit": "cwiczenia-1.html",
"sec": "s6"
},
{
"q": "Co mówią zasady 1–2 Eliasa (życzliwość, umiejętności życiowe)?",
"a": "<p><strong>1:<\/strong> podstawą rozwoju są serdeczne relacje w życzliwym, ale wymagającym otoczeniu (bez strachu, z wyzwaniami; jasne, sprawiedliwe, konsekwentne reguły). <strong>2:<\/strong> na każdym etapie uczyć praktycznych umiejętności życiowych (lista CASEL), np. włączać jedną umiejętność tygodniowo do rutyny.<\/p>",
"src": "Dziesięć zasad Eliasa: zasady 1–5",
"id": "edukacja/cwiczenia-1-fiszki:ef5700b7",
"unit": "cwiczenia-1.html",
"sec": "s7"
},
{
"q": "Co mówią zasady 3–4 Eliasa (spójna polityka szkoły, cele)?",
"a": "<p><strong>3:<\/strong> spójna polityka szkoły (programy prewencji, zdrowy styl życia, wsparcie dzieci w trudnych sytuacjach); pomoc zwykle pojawia się za późno. <strong>4:<\/strong> wyznaczanie celów i rozwiązywanie problemów nadaje kierunek uczeniu się; uczniowie bardziej zaangażowani, gdy rozumieją cele i znają strategie rozwiązywania problemów (schemat analizy wydarzeń historycznych).<\/p>",
"src": "Dziesięć zasad Eliasa: zasady 1–5",
"id": "edukacja/cwiczenia-1-fiszki:bb4a5322",
"unit": "cwiczenia-1.html",
"sec": "s7"
},
{
"q": "Co mówi zasada 5 Eliasa o procedurach nauczania?",
"a": "<p>Należy stosować <strong>zróżnicowane procedury<\/strong> odwołujące się do różnych zmysłów i zainteresowań (role, sztuka, taniec, teatr, media cyfrowe), zmieniać formy pracy, dawać regularną konstruktywną informację zwrotną i zadawać pytania otwarte, bo rozwój poznawczy i społeczno-emocjonalny przebiega u uczniów różnie.<\/p>",
"src": "Dziesięć zasad Eliasa: zasady 1–5",
"id": "edukacja/cwiczenia-1-fiszki:60a13d4e",
"unit": "cwiczenia-1.html",
"sec": "s7"
},
{
"q": "Co mówią zasady 6–7 Eliasa (społeczność lokalna, rodzice)?",
"a": "<p><strong>6:<\/strong> praca na rzecz społeczności rozwija empatię; fazy: przygotowanie, działanie, refleksja, prezentacja. <strong>7:<\/strong> współpraca szkoły i domu daje trwalsze efekty; regularnie informować rodziców, umożliwiać spotkania i udział w życiu szkoły.<\/p>",
"src": "Dziesięć zasad Eliasa: zasady 6–10",
"id": "edukacja/cwiczenia-1-fiszki:1407f899",
"unit": "cwiczenia-1.html",
"sec": "s8"
},
{
"q": "Co mówią zasady 8–9 Eliasa (wdrażanie, nauczyciele)?",
"a": "<p><strong>8:<\/strong> programy wprowadza się stopniowo, jako projekty pilotażowe, a kompetentnie czuje się wdrażający dopiero po 2–3 latach; SEL nie jest osobnym przedmiotem. <strong>9:<\/strong> skuteczność zależy od ciągłego doskonalenia zawodowego i wsparcia całego personelu, zwłaszcza w pierwszych latach wdrażania.<\/p>",
"src": "Dziesięć zasad Eliasa: zasady 6–10",
"id": "edukacja/cwiczenia-1-fiszki:9102f74f",
"unit": "cwiczenia-1.html",
"sec": "s8"
},
{
"q": "Dlaczego zasada 10 Eliasa traktuje ewaluację jako zadanie etyczne?",
"a": "<p>Szkoła, przyjmując ucznia, zobowiązuje się przygotować go do przyszłości, ale nie gwarantuje rezultatów, więc ma <strong>etyczny obowiązek monitorowania<\/strong> i ciągłego udoskonalania pracy. Informacje zbiera z wielu źródeł: opinie szkolonych i szkolących, dokumentacja wdrażania, wyniki różnych grup uczniów, bieżące wydarzenia.<\/p>",
"src": "Dziesięć zasad Eliasa: zasady 6–10",
"id": "edukacja/cwiczenia-1-fiszki:23c0d649",
"unit": "cwiczenia-1.html",
"sec": "s8"
},
{
"q": "Jakie główne wnioski formułuje Elias na zakończenie?",
"a": "<p>Kształcenie poznawcze i społeczno-emocjonalne staje się nowym standardem podstaw szkolnych. Celem jest szkoła, w której nauka jest doceniana, a talenty rozwijają się swobodnie; każdy uczeń ma inny potencjał. Zadanie wymaga cierpliwości i wielkiego wysiłku.<\/p>",
"src": "Zakończenie",
"id": "edukacja/cwiczenia-1-fiszki:e2e6847c",
"unit": "cwiczenia-1.html",
"sec": "s9"
}
]
