żeń psychologii poznawczej dotyczące możliwości ludzkiego umysłu?","a":["Umysł ma nieograniczone zasoby i potrafi przetwarzać każdą ilość informacji jednocześnie.","Umysł działa w sposób całkowicie bierny i jedynie odtwarza rzeczywistość.","Umysł ma ograniczone możliwości przetwarzania i pojemność, dlatego określany jest mianem „skąpca poznawczego”.","Procesy poznawcze są niezależne od kontekstu i zawsze przebiegają tak samo."],"c":2,"e":"Umysł ma ograniczoną pojemność, więc oszczędza wysiłek („skąpiec poznawczy”)."},{"id":"t1-305","n":5,"g":"t1","q":"Która z poniższych metod badawczych jest wymieniana jako stosowana w psychologii poznawczej?","a":["Badania internetowe","Symulacje komputerowe i sztuczna inteligencja oraz kontrolowane eksperymenty laboratoryjne","Wyłącznie luźne obserwacje potoczne bez żadnej struktury","Wyłącznie wywiady pogłębione"],"c":1,"e":"Psychologia poznawcza stosuje eksperymenty laboratoryjne oraz symulacje komputerowe i AI."},{"id":"t1-306","n":6,"g":"t1","q":"Zgodnie z badaniem Strayera i Johnstona (2001) prawdopodobieństwo przeoczenia czerwonego światła wzrasta, gdy kierowca:","a":["Słucha muzyki.","Rozmawia z pasażerem.","Słucha audiobooka.","Rozmawia przez telefon."],"c":3,"e":"Strayer i Johnston: rozmowa przez telefon zwiększa ryzyko przeoczenia czerwonego światła, a słuchanie radia nie."},{"id":"t2-307","n":1,"g":"t2","q":"Bodziec proksymalny definiujemy jako:","a":["Fizyczną formę energii istniejącą w otoczeniu poza podmiotem, zanim zostanie ona odebrana przez zmysły.","Umysłowy odpowiednik obiektów realnie istniejących, fikcyjnych lub hipotetycznych.","Bodziec bezpośrednio odebrany przez receptor, np. pomniejszony i odwrócony obraz przedmiotu na siatkówce oka.","Proces nadawania znaczenia i kategoryzacji danych zmysłowych w oparciu o informacje zawarte w pamięci."],"c":2,"e":"Bodziec proksymalny powstaje na receptorze, np. pomniejszony i odwrócony obraz na siatkówce."},{"id":"t2-308","n":2,"g":"t2","q":"Czym jest priming nadprogowy?","a":["zjawisko polegające na wpływie wcześniej świadomie odebranego bodźca na późniejszą aktywność osoby","bodziec, który znajduje się w polu uwagi i jest aktualnie przetwarzany przez system poznawczy","proces automatycznego torowania zachodzący wyłącznie poza świadomością","technika eksperymentalna polegająca na badaniu wpływu bodźca prezentowanego wcześniej (prymy) na przetwarzanie bodźca pojawiającego się później"],"c":0,"e":"Priming nadprogowy: wpływ świadomie odebranego bodźca na późniejsze przetwarzanie."},{"id":"t2-309","n":3,"g":"t2","q":"Stałość wielkości oznacza, że:","a":["Obiekty się nie poruszają","Widzenie nie zmienia się","Obiekt jest oceniany jako taki sam mimo zmiany odległości","Wielkość zależy od oświetlenia"],"c":2,"e":"Stałość wielkości: obiekt wydaje się tej samej wielkości mimo zmiany odległości."},{"id":"t2-310","n":4,"g":"t2","q":"Droga „co” w układzie wzrokowym służy do:","a":["Lokalizacji bodźca","Określania koloru i kształtu","Przetwarzania emocji","Orientacji w przestrzeni"],"c":1,"e":"Droga brzuszna („co”) rozpoznaje kształt i kolor obiektu."},{"id":"x-trw","n":5,"g":"t2","q":"Które z poniższych stwierdzeń najlepiej opisuje pojęcie trwałości wizualnej w kontekście pamięci krótkotrwałej?","a":["Jest to zdolność pamięci do przechowywania informacji wizualnych przez kilka dni lub tygodni.","Oznacza, że obraz pozostaje w polu widzenia nawet po jego zniknięciu, zwykle przez kilka setnych sekundy.","Odnosi się do zdolności szybkiego przypominania sobie szczegółów wzrokowych sprzed wielu miesięcy.","Opisuje proces zamiany informacji wzrokowej w trwałą pamięć długotrwałą."],"c":1,"e":"Trwałość wizualna to utrzymywanie się obrazu przez ułamek sekundy po zniknięciu bodźca (pamięć ikoniczna).","u":1},{"id":"t2-311","n":6,"g":"t2","q":"Osoba patrząc na niewyraźny obiekt rozpoznaje go poprawnie, ponieważ zna kontekst sytuacji i wcześniej już widziała podobne obiekty. Mechanizmem, który najlepiej wyjaśnia tę sytuację jest:","a":["przetwarzanie oddolne - bottom-up","przetwarzanie odgórne - top-down","adaptacja sensoryczna","habituacja percepcyjna"],"c":1,"e":"Rozpoznanie dzięki kontekstowi i wiedzy to przetwarzanie odgórne."},{"id":"t3-312","n":1,"g":"t3","q":"Mrugnięcie uwagowe (attentional blink) odnosi się do zjawiska polegającego na tym, że:","a":["Bodźce wizualne prezentowane jednocześnie w różnych modalnościach sensorycznych są przetwarzane z różną dokładnością.","Wykrywanie drugiego bodźca docelowego jest czasowo upośledzone, gdy pojawia się on krótko po pierwszym bodźcu wymagającym uwagi.","Uwaga selektywna umożliwia równoczesne przetwarzanie wielu bodźców bez spadku efektywności.","Reakcja na bodziec wzrokowy ulega habituacji w wyniku jego wielokrotnej ekspozycji."],"c":1,"e":"Mrugnięcie uwagowe: drugi cel tuż po pierwszym często umyka."},{"id":"t3-313","n":2,"g":"t3","q":"Pamięć tunelowa odnosi się do:","a":["Zjawiska polegającego na trwałym zapamiętywaniu informacji zgodnych z posiadanymi schematami poznawczymi","Selektywnego zapamiętywania informacji w warunkach silnego stresu lub pobudzenia emocjonalnego","Zdolności do jednoczesnego przechowywania dużej liczby informacji w pamięci roboczej","Mechanizmu odpowiedzialnego za nieświadome wydobywanie wspomnień z pamięci długotrwałej"],"c":1,"e":"Pamięć tunelowa: w silnym pobudzeniu pamiętamy centralne szczegóły kosztem tła."},{"id":"x-kon","n":3,"g":"t3","q":"Przeszukiwanie koniunkcyjne w porównaniu z przeszukiwaniem prostym (równoległym):","a":["zachodzi szybciej i nie zależy od liczby elementów w polu","opiera się na jednej cesze priorytetowej bodźca","wymaga sekwencyjnej integracji cech i zależy od liczby elementów","nie angażuje mechanizmów uwagi selektywnej"],"c":2,"e":"Przeszukiwanie koniunkcyjne wymaga szeregowej integracji cech, więc jego czas rośnie z liczbą elementów.","u":1},{"id":"t3-314","n":4,"g":"t3","q":"Zgodnie z teorią filtra uwagowego D.Broadbenta, konieczność selekcji informacji wynika przede wszystkim z","a":["ograniczeń pamięci długotrwałej w przetwarzaniu znaczenia bodźców","istnienia kanału o ograniczonej przepustowości między pamięcią krótkotrwałą a trwałą","automatyzacji analizy semantycznej bodźców","rywalizacji bodźców o zasoby motoryczne"],"c":1,"e":"U Broadbenta selekcja jest konieczna, bo kanał przetwarzania ma ograniczoną przepustowość."},{"id":"t3-315","n":5,"g":"t3","q":"Dlaczego percepcja nie jest prostym „odzwierciedleniem” rzeczywistości?","a":["Ponieważ bodźce sensoryczne są zbyt ubogie, by mogły być przetwarzane poznawczo.","Ponieważ proces percepcji obejmuje zarówno analizę danych zmysłowych, jak i interpretację opartą na wiedzy.","Ponieważ percepcja zachodzi wyłącznie na poziomie fizjologicznym.","Ponieważ percepcja jest całkowicie zależna od uwagi."],"c":1,"e":"Percepcja łączy analizę danych zmysłowych z interpretacją opartą na wiedzy."},{"id":"t3-316","n":6,"g":"t3","q":"Efekt wydłużenia czasu reakcji w zadaniu Stroopa w warunku niespójnym świadczy głównie o:","a":["deficytach pamięci semantycznej","automatyzacji czynności percepcyjnych","konieczności zahamowania reakcji dominującej","spadku poziomu czujności"],"c":2,"e":"Wydłużenie czasu w warunku niespójnym pokazuje koszt hamowania dominującej reakcji (czytania)."},{"id":"t4-317","n":1,"g":"t4","q":"Wskaż, które zdanie jest prawdziwe:","a":["Amnezja dziecięca dotyczy wspomnień sprzed 7 roku życia.","Amnezja dziecięca wynika z braku dojrzałych zasobów poznawczych koniecznych do analitycznego przetwarzania informacji.","Amnezja dziecięca dotyczy pamięci proceduralnej, a nie deklaratywnej.","Amnezja dziecięca jest wynikiem dojrzałości OUN oraz utworzonym przez dziecko pojęciem własnej podmiotowości."],"c":1,"e":"W ujęciu przyjętym w bazie amnezja dziecięca wynika z niedojrzałości zasobów poznawczych potrzebnych do analitycznego przetwarzania.","f":"niepewne"},{"id":"t4-318","n":2,"g":"t4","q":"Z jakich podzespołów składa się model pamięci roboczej Baddeleya:","a":["Pętla fonologiczna, bufor epizodyczny, notes wzrokowo przestrzenny","Magazyn fonologiczny, bufor epizodyczny","Pętla fonologiczna, magazyn fonologiczny, wewnętrzny system piszący","Pętla artykulacyjna, bufor epizodyczny"],"c":0,"e":"Model Baddeleya: pętla fonologiczna, szkicownik (notes) wzrokowo-przestrzenny, bufor epizodyczny i centralny system wykonawczy."},{"id":"t4-319","n":3,"g":"t4","q":"W jaki sposób, zgodnie z wynikami eksperymentu Saula Sternberga (1966), odbywa się przeszukiwanie pamięci krótkotrwałej?","a":["Jest to proces równoległy, w którym dostęp do wszystkich zapamiętanych elementów uzyskujemy w tym samym momencie.","Jest to proces seryjny i samokończący, mózg sprawdza elementy po kolei i przerywa szukanie natychmiast po znalezieniu dopasowania.","Jest to proces seryjny i wyczerpujący, mózg sprawdza wszystkie elementy po kolei do samego końca listy, nawet jeśli znajdzie dopasowanie wcześniej.","Jest to proces losowy, w którym czas reakcji nie zależy od liczby elementów w pamięci, lecz od skupienia uwagi."],"c":2,"e":"S. Sternberg: przeszukiwanie STM jest szeregowe i wyczerpujące."},{"id":"t4-320","n":4,"g":"t4","q":"W modelu organizacji pamięci autobiograficznej Martina Conwaya (1996), który poziom wiedzy zawiera informacje o osobach znaczących, typowych celach i planach życiowych (np. okres studiów)?","a":["Wiedza na temat okresów życia","Umysłowy tezaurus pojęć","Wiedza o zdarzeniach specyficznych","Wiedza o zdarzeniach ogólnych"],"c":0,"e":"U Conwaya poziom okresów życia zawiera wiedzę o ważnych osobach, celach i planach danego okresu."},{"id":"t4-321","n":5,"g":"t4","q":"Co w paradygmacie Sternberga oznacza fakt, że nachylenie linii czasu reakcji dla odpowiedzi „TAK” i „NIE” jest identyczne oraz rośnie liniowo?","a":["Oznacza to, że każdy dodatkowy element w pamięci wydłuża czas reakcji o stałą wartość (ok. 38 ms), a proces skanowania nie kończy się po znalezieniu elementu.","Oznacza to, że odpowiedzi „TAK” są zawsze szybsze od odpowiedzi „NIE”, ponieważ badany przerywa szukanie po sukcesie.","Oznacza to, że przeszukiwanie pamięci jest niezależne od procesów sensoryczno - motorycznych, a czas reakcji jest stały dla list od 1 do 6 elementów.","Oznacza to, że mózg przetwarza informacje z prędkością światła, a opóźnienia wynikają jedynie z kodowania bodźca."],"c":0,"e":"Te same nachylenia dla „tak” i „nie” oznaczają przeszukiwanie wyczerpujące: każdy element dodaje około 38 ms."},{"id":"t4-322","n":6,"g":"t4","q":"Pamięć utajona charakteryzuje się tym, że:","a":["Jest świadoma","Łatwo ją opisać","Wpływa na zachowanie bez uświadamiania","Dotyczy tylko faktów"],"c":2,"e":"Pamięć utajona wpływa na zachowanie bez udziału świadomości."},{"id":"t5-323","n":1,"g":"t5","q":"Czym są halucynacje wg Maruszewskiego?","a":["wyobrażenia, które są traktowane jako rzeczywistość","charakteryzują się brakiem poczucia, że pochodzą „ze środka”","związane z mimowolnym aktywizowaniem się niektórych elementów pamięci roboczej (pętla fonologiczna lub szkicownik wzrokowo-przestrzenny)","wszystkie odpowiedzi są prawidłowe"],"c":3,"e":"Wszystkie trzy opisy pasują do halucynacji według Maruszewskiego."},{"id":"t5-324","n":2,"g":"t5","q":"Jakie jest praktyczne znaczenie funkcjonalnej ekwiwalencji percepcji i wyobraźnI:","a":["wzbogacanie, koloryzowanie i upiększanie codzienności życia","umożliwia myślenie o przeszłości i przyszłości","selekcja informacji i zapobieganie negatywnym skutkom przeładowania systemu poznawczego","odpowiedzi a i b"],"c":3,"e":"Ekwiwalencja percepcji i wyobraźni pozwala wzbogacać codzienność i myśleć o przeszłości i przyszłości."},{"id":"t5-325","n":3,"g":"t5","q":"Zgodnie z teorią podwójnego kodowania Paivio człowiek reprezentuje rzeczywistość w dwóch systemach:","a":["semantycznym i epizodycznym","symbolicznym i mentalnym","werbalnym i niewerbalnym","proksymalnym i dystalnym"],"c":2,"e":"Paivio: system werbalny i niewerbalny."},{"id":"t5-326","n":4,"g":"t5","q":"Czym są wyobrażenia surogatowe?","a":["zastępcze treści tych obrazów rzeczywistości, które są niedostępne dla osób niewidomych","obrazy powstające w wyniku bezpośredniej stymulacji receptorów wzrokowych u osób słabowidzących pod wpływem silnych bodźców świetlnych","zniekształcone wyobrażenia o świecie zewnętrznym, wynikające z błędnej interpretacji bodźców dotykowych i słuchowych przez dziecko niewidome od urodzenia","proces polegający na automatycznym przywoływaniu wspomnień wzrokowych przez osoby, które straciły wzrok w późniejszym okresie życia."],"c":0,"e":"Wyobrażenia surogatowe to zastępcze treści obrazów niedostępnych osobom niewidomym."},{"id":"t5-327","n":5,"g":"t5","q":"Efekt rotacji mentalnych (zależność RT/kąt) jest niezależny od:","a":["kierunku i płaszczyzny rotacji","rodzaju symboli (litery, cyfry, figury)","rodzaju wykonywanego zadania (ocena formy, identyfikacja, porównanie)","wszystkie odpowiedzi są poprawne"],"c":3,"e":"Zależność czasu od kąta utrzymuje się niezależnie od kierunku, rodzaju symboli i zadania."},{"id":"t5-328","n":6,"g":"t5","q":"Wskaż nieprawdziwe zdanie dotyczące skanningu umysłowego:","a":["To przeszukiwanie pola świadomości w poszukiwaniu pewnych informacji.","W badaniach nad skanningiem umysłowym badanym najpierw pokazuje się pewien obiekt.","Przeszukiwanie informacji jest prowadzone w sposób uporządkowany i systematyczny.","Jednym z efektów wykrytych podczas eksperymentów nad scanningiem umysłowym jest efekt złożoności."],"c":2,"e":"Skaning umysłowy nie zawsze przebiega w sposób uporządkowany i systematyczny."},{"id":"t6-329","n":1,"g":"t6","q":"Które z poniższych stwierdzeń najlepiej opisuje pojęcie jako reprezentację umysłową?","a":["Pojęcie to przypadkowy zbiór obiektów bez wspólnych cech","Pojęcie odnosi się do zbioru obiektów i zawiera ich istotne właściwości","Pojęcie to wyłącznie reprezentacja obiektów materialnych","Egzemplarz pojęcia to jego definicja słownikowa"],"c":1,"e":"Pojęcie to reprezentacja zbioru obiektów z ich istotnymi właściwościami."},{"id":"t6-330","n":2,"g":"t6","q":"Wskaż, które zdanie jest prawdziwe:","a":["Struktura pojęć jest wyłącznie wrodzona","Struktura pojęć jest wyłącznie nabyta","Struktura pojęć jest zależna głównie od języka","Struktura pojęć jest wynikiem interakcji biologicznych predyspozycji i wpływów kulturowych"],"c":3,"e":"Struktura pojęć wynika z interakcji predyspozycji biologicznych i wpływów kultury."},{"id":"t6-331","n":3,"g":"t6","q":"Zgodnie z poglądem egzemplarzowym pojęć identyfikacja nowego obiektu polega na:","a":["odniesieniu go do prototypu kategorii","porównaniu z uśrednioną reprezentacją pojęcia","ocenie podobieństwa do egzemplarza spotkanego po raz pierwszy lub ostatnio spotkanego","przypisaniu do kategorii nadrzędnej"],"c":2,"e":"Pogląd egzemplarzowy: porównujemy nowy obiekt z zapamiętanymi egzemplarzami."},{"id":"t6-332","n":4,"g":"t6","q":"Cechy definicyjne (istotne) charakteryzują się tym, że:","a":["występują najczęściej w danej kategorii","są subiektywnie oceniane jako ważne","są wspólne dla wszystkich obiektów należących do danej klasy","zależą od kontekstu użycia pojęcia"],"c":2,"e":"Cechy definicyjne są wspólne dla wszystkich obiektów danej klasy."},{"id":"t6-333","n":5,"g":"t6","q":"Jaką strukturę mają pojęcia?","a":["losową, bez wewnętrznej organizacji","definicyjną, opartą wyłącznie na cechach koniecznych","egzemplarzową, opartą wyłącznie na pojedynczych przykładach","prototypową, z egzemplarzami bardziej i mniej typowymi"],"c":3,"e":"Pojęcia naturalne mają strukturę prototypową: egzemplarze bardziej i mniej typowe."},{"id":"t6-334","n":6,"g":"t6","q":"Dziecko słyszy, że coś jest „grzybem” i unika dotykania, mimo że go wcześniej nie widziało. Która funkcja pojęć jest tu kluczowa?","a":["klasyfikacyjna","predykcyjna","definicyjna","estetyczna"],"c":1,"e":"Przypisanie do kategorii pozwala przewidywać właściwości obiektu: to funkcja predykcyjna."},{"id":"t7-335","n":1,"g":"t7","q":"Zgodnie z klasyfikacją rodzajów myślenia według D. Berlyne’a, myślenie, które jest ukierunkowane na osiągnięcie konkretnego celu i uwzględnia uwarunkowania zewnętrzne, to myślenie:","a":["autystyczne","realistyczne","sensoryczne","reproduktywne"],"c":1,"e":"Myślenie ukierunkowane na cel i realia to myślenie realistyczne."},{"id":"t7-336","n":2,"g":"t7","q":"Myślenie polegające na tworzeniu luźnych skojarzeń i oderwanych od rzeczywistości spekulacji to:","a":["myślenie realistycznie","myślenie produktywne","myślenie autystyczne","myślenie krytyczne"],"c":2,"e":"Luźne skojarzenia oderwane od rzeczywistości to myślenie autystyczne."},{"id":"t7-337","n":3,"g":"t7","q":"Wskaż zdanie najlepiej określające transfer pozytywny","a":["Występuje wtedy, gdy problemy są dobrze określone i mają jedno poprawne rozwiązanie.","To przenoszenie wiedzy albo umiejętności z jednego problemu na inny, kiedy ich struktura jest głęboka.","To przenoszenie rozwiązania w sytuacji, gdy powierzchowne struktury problemów są do siebie podobne.","Polega na mechanicznym wykorzystaniu wcześniej wyuczonego algorytmu do nowej sytuacji."],"c":1,"e":"Transfer pozytywny to przeniesienie rozwiązania na problem o podobnej strukturze głębokiej."},{"id":"t7-338","n":4,"g":"t7","q":"Istotą złudzenia gracza, znanego również jako złudzenie Monte Carlo, jest","a":["Przekonanie, że wcześniejsze wyniki losowania zwiększają obiektywne prawdopodobieństwo wystąpienia wyniku przeciwnego.","Skłonność do oceniania prawdopodobieństwa zdarzeń na podstawie ich podobieństwa do prototypu.","Błędne przekonanie, że w serii losowych, niezależnych zdarzeń przyszły wynik powinien zrekompensować wcześniejsze wyniki.","Systematyczne przeszacowywanie prawdopodobieństwa zdarzeń łatwo dostępnych w pamięci."],"c":2,"e":"Złudzenie gracza: przekonanie, że przyszły wynik „wyrówna” wcześniejsze, choć zdarzenia są niezależne.","u":1},{"id":"t7-339","n":5,"g":"t7","q":"Myślenie ukierunkowane w sytuacjach źle określonych różni się od myślenia w sytuacjach dobrze określonych przede wszystkim tym, że:","a":["wymaga stosowania algorytmów i jasno zdefiniowanych operacji symbolicznych","charakteryzuje się dużą liczbą jednoznacznych kryteriów poprawności rozwiązania","dotyczy problemów, w których nie jest jasne ani rozwiązanie, ani pełna reprezentacja problemu","prowadzi zawsze do działań praktycznych, a nie symbolicznych"],"c":2,"e":"W sytuacjach źle określonych nie jest jasne ani rozwiązanie, ani pełna reprezentacja problemu.","u":1},{"id":"t7-340","n":6,"g":"t7","q":"Która z poniższych sytuacji najlepiej ilustruje działanie heurystyki dostępności?","a":["Osoba ocenia prawdopodobieństwo zdarzenia na podstawie tego, jak bardzo jest ono podobne do znanego schematu","Osoba opiera ocenę sytuacji na pierwszej podanej informacji, nawet jeśli jest ona przypadkowa","Osoba uznaje zdarzenie za bardziej prawdopodobne, ponieważ łatwo przywołuje je z pamięci","Osoba symuluje w myślach alternatywny przebieg wydarzeń, aby ocenić ich możliwe skutki"],"c":2,"e":"Heurystyka dostępności: zdarzenie łatwo przywoływane z pamięci wydaje się bardziej prawdopodobne.","u":1},{"id":"t8-341","n":1,"g":"t8","q":"W procesie myślenia, według koncepcji Kowalczyka (1995), poszczególne instancje pełnią określone role. Wskaż zdanie prawdziwe:","a":["Świadomość jest głównym generatorem pomysłów i intuicji","Nieświadomość pełni funkcję selekcji pomysłów w pamięci roboczej.","Świadomość jest mechanizmem selekcji pomysłów, a nieświadomość ich generatorem.","Procesy świadome i nieświadome działają w pełnej izolacji (tzw. otorbienie)."],"c":2,"e":"Według Kowalczyka nieświadomość generuje pomysły, a świadomość je selekcjonuje."},{"id":"t8-343","n":2,"g":"t8","q":"Błędne założenie, że skoro między dwoma zdarzeniami istnieje związek, to pierwsze zdarzenie musiało spowodować drugie to:","a":["heurystyka reprezentatywności;","błąd wynikania","błąd konfirmacji","heurystyka wglądu wstecznego"],"c":1,"e":"Uznanie, że związek dwóch zdarzeń oznacza przyczynę, to błąd wynikania (post hoc)."},{"id":"t8-344","n":3,"g":"t8","q":"Które zdanie opisujące metodę rozwiązywania problemów jest fałszywe:","a":["Przeformułowanie poznawcze problemu przełamuje fiksację funkcjonalną","Przykładem przezwyciężania ukrytych fałszywych założeń jest problem 9 kropek (Scheerer, 1963)","Jedną z metod jest efekt potwierdzenia - tendencja do poszukiwania informacji, które potwierdzają nasze wcześniejsze przekonania na jakiś temat i do odrzucania informacji, które są sprzeczne z naszymi przekonaniami","przeniesienie wiedzy lub umiejętności z jednego problemu na inny problem o podobnej strukturze to transfer pozytywny"],"c":2,"e":"Efekt potwierdzenia to błąd myślenia, a nie metoda rozwiązywania problemów.","u":1},{"id":"t8-345","n":4,"g":"t8","q":"Sytuacja, w której zdarzenia łatwiej dostępne poznawczo są oceniane jako bardziej prawdopodobne to:","a":["heurystyka dostępności","heurystyka zakotwiczenia","myślenie indukcyjne","myślenie dedukcyjne"],"c":0,"e":"Zdarzenia łatwo dostępne w pamięci oceniamy jako bardziej prawdopodobne: heurystyka dostępności."},{"id":"t8-346","n":5,"g":"t8","q":"Dlaczego w sytuacjach stresowych strategie rozwiązywania problemów mogą być mniej złożone?","a":["Ponieważ stres zwiększa pojemność pamięci roboczej","Ponieważ stres sprzyja stosowaniu heurystyk","Ponieważ stres dezorganizuje procesy poznawcze","Ponieważ stres eliminuje potrzebę planowania"],"c":2,"e":"Stres dezorganizuje procesy poznawcze, więc strategie upraszczają się."}],"dir":"poznawcza"}</script>
