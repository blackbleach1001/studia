niż obiekty (mniejsze znaczenie stałości spostrzegania); trudniej sprawdzić trafność wniosków; silniejsza schematyzacja, choć możliwe przejście do przetwarzania analitycznego."}, {"t": "w1", "s": "Pytanie kontrolne, rozdz. 1", "q": "Co rozumiemy przez paradygmat poznawczy?", "a": "Paradygmat wg Kuhna: fundamentalne osiągnięcie wyznaczające sposób uprawiania nauki normalnej — oryginalne i atrakcyjne, a zarazem otwarte na nowe problemy. Psychologia poznawcza raczej nie ma jednego paradygmatu (brak „Newtona”), lecz zbiór mikroparadygmatów (Nowakowska, 1980) z jądrami: pamięć operacyjna, uwaga, wiedza. Wspólne założenia wymieniają Reynolds i Flagg (1983)."}, {"t": "w1", "s": "Pytanie kontrolne, rozdz. 1", "q": "Jak można odróżnić procesy poznawcze człowieka od procesów przetwarzania informacji w komputerach?", "a": "Test Turinga i jego trudności (Penrose). Metafora komputerowa ma ograniczenia: mózg i komputer się uzupełniają (Bolter, 1990). Człowiek stawia cele, realizuje pragnienia, szuka ideałów; procesy poznawcze są służebne wobec podmiotu (Ja robocze). Umysł nie działa sekwencyjnie jak klasyczny komputer — przetwarzanie równoległe i rozproszone; sieć neuronalna działa mimo uszkodzeń, komputer sekwencyjny nie. Neisser: świadomość nie jest oknem na fazę przetwarzania. Procesy ludzkie są aktywne, zależne od kontekstu, emocji i interpretacji."}, {"t": "w1", "s": "Pytanie kontrolne, rozdz. 1", "q": "Jakie elementy stanowią wrodzony składnik procesów poznawczych, a jakie można uznać za efekt uczenia się?", "a": "Wrodzone: mechanizm nabywania języka (LAD) i uniwersalne reguły gramatyczne (Chomsky); systemy bezpośredniej percepcji wg Neissera — np. wykrywanie ruchu u noworodków, najmniej plastyczne. Wyuczone: mapy poznawcze (Tolman); systemy rozpoznawania i reprezentacji (najbardziej plastyczne, np. rozpoznanie „kursora”); stabilne struktury z wielokrotnego użycia strategii (ruchy oczu przy czytaniu). Język jako całość — interakcja wrodzonego mechanizmu i uczenia się."}, {"t": "w1", "s": "Pytanie kontrolne, rozdz. 1", "q": "Wymień i scharakteryzuj kluczowe dylematy psychologii poznawczej.", "a": "Wrodzone vs wyuczone; szerokie vs wąskie ujęcie; umysł jako komputer; przetwarzanie sekwencyjne vs równoległe; umysł reaktywny vs aktywny; laboratorium vs trafność ekologiczna; poznanie vs emocje; kontrola świadoma vs automatyzm; umysł a mózg (redukcjonizm); jedna dyscyplina vs mikroparadygmaty; procesy uniwersalne vs zależne od przedmiotu. Szczegóły w sekcji Kluczowe dylematy."}, {"t": "w2", "s": "Pytanie kontrolne, rozdz. 2", "q": "Co różni bodźce dystalne od proksymalnych?", "a": "Bodziec dystalny to obiekt poza organizmem, działający na zmysły z odległości (kartka, muzyka z głośnika). Bodziec proksymalny powstaje w bezpośrednim kontakcie bodźca dystalnego z narządem zmysłu (obraz siatkówkowy — odwrócony i pomniejszony; drgania błony bębenkowej). Stałość spostrzegania pokazuje, że spostrzeżenie zmienia się mniej niż bodziec proksymalny."}, {"t": "w2", "s": "Pytanie kontrolne, rozdz. 2", "q": "W procesie spostrzegania dochodzi do konfrontacji dwojakiego rodzaju danych. O jakie dane chodzi?", "a": "Dane sensoryczne (dynamiczne, zmienne, bogate, standaryzowane przez detektory cech) i dane pamięciowe (schematy — uporządkowane, względnie stabilne, zwykle w postaci abstrakcyjnej, werbalnej). Idea pochodzi od Brunera (1978); proces dopasowania wymaga przeszukiwania pamięci i przekładu między kodami (Posner)."}, {"t": "w2", "s": "Pytanie kontrolne, rozdz. 2", "q": "Na czym polega gotowość i obronność percepcyjna?", "a": "Gotowość percepcyjna to łatwość użycia danej kategorii pamięciowej do materiału percepcyjnego. Zależy od czynników zewnętrznych (częstość doświadczeń, konsekwencje społeczne; torowanie) i wewnętrznych (monopol, integracja poznawcza, konsekwencje motywacyjne). Obronność percepcyjna to obniżona gotowość: podwyższony próg rozpoznawania materiału zagrażającego (Bruner i Postman, 1947). Pokazuje, że ocena emocjonalna poprzedza rozpoznanie treści; funkcja adaptacyjna — szybka, choć nieprecyzyjna orientacja emocjonalna."}, {"t": "w2", "s": "Pytanie kontrolne, rozdz. 2", "q": "Jakiego rodzaju kody wykorzystywano w eksperymentach Posnera i współpracowników?", "a": "Kod fizyczny (wzrokowy — wygląd litery, np. AA) i kod nominalny (werbalny — nazwa litery, np. Aa); dodatkowo kryterium oparte na regule (np. obie samogłoski). Przy ekspozycji równoczesnej porównanie fizyczne jest szybsze o ok. 80 ms; przy sekwencyjnej (≥ 2 s) przewaga się odwraca, bo pierwsza litera zostaje przekodowana na kod werbalny."}, {"t": "w2", "s": "Pytanie kontrolne, rozdz. 2", "q": "Jakie elementy wchodzą w skład cyklu percepcyjnego Neissera?", "a": "Schemat pamięciowy (kieruje eksploracją), eksploracja (pobiera próbki z otoczenia) i dostępna informacja w otoczeniu (modyfikuje schemat). Cykl nie ma wyraźnego początku ani końca; może zacząć się od odbioru informacji, od schematu albo od eksploracji. U niemowląt wrodzone są schematy eksploracyjne."}, {"t": "w2", "s": "Pytanie kontrolne, rozdz. 2", "q": "Czym są niezmienniki percepcyjne i w jakiej koncepcji spostrzegania wykorzystywane jest to pojęcie?", "a": "To specyficzne układy cech, które pozostają stałe mimo zmiennych warunków spostrzegania (np. stosunek wielkości do odległości; układ światła i cienia wyznaczający wklęsłość/wypukłość; melodia w innej tonacji). Pojęcie należy do ekologicznej koncepcji percepcji bezpośredniej Gibsona."}, {"t": "w2", "s": "Pytanie kontrolne, rozdz. 2", "q": "Jakie znaczenie w wyjaśnianiu relacji między wrażeniami i spostrzeżeniami mają zasady Wertheimera?", "a": "Pokazują, że całości wyodrębniamy według wrodzonych zasad organizacji (bliskość, podobieństwo, wspólna droga, dobra kontynuacja, niewielkie rozmiary, symetria, nastawienie; doświadczenie drugoplanowe), a nie przez kojarzenie wrażeń. To argument psychologii postaci za prymatem całości i pierwotnością spostrzeżeń — przeciw asocjacjonizmowi, który łączenie elementów tłumaczył prawami kojarzenia i uczeniem się."}, {"t": "w2", "s": "Pytanie kontrolne, rozdz. 2", "q": "Dlaczego zasada figury i tła jest traktowana jako dowód przemawiający na rzecz jednej z klasycznych teorii spostrzegania?", "a": "Przemawia za psychologią postaci. Asocjacjonizm zakładał, że wszystkie elementy pola są jednakowo ważne, bo spostrzeżenie powstaje z kojarzenia równorzędnych wrażeń. Tymczasem pole percepcyjne od razu dzieli się na figurę (ważniejszą, ukształtowaną, wysuniętą, łatwiej zapamiętywaną) i tło — zróżnicowanie wagi elementów jest możliwe tylko wtedy, gdy spostrzeżenie jest pierwotne. Figury odwracalne (waza Rubina) pokazują też, że te same elementy dają różne całości."}, {"t": "w2", "s": "Pytanie kontrolne, rozdz. 2", "q": "Scharakteryzuj fazy procesu spostrzegania i podaj dowody na ich niezależność.", "a": "(1) rejestracja sensoryczna — detektory cech, pamięć sensoryczna, dane niedostępne świadomości; (2) ocena emocjonalna — kolaterale do wzgórza i ciała migdałowatego, ocena przyjemny/nieprzyjemny; (3) rozpoznanie treści — kategoryzacja przez dopasowanie do schematów; (4) ocena znaczenia metaforycznego. Dowody niezależności: obronność percepcyjna, subcepcja (Lazarus i McCleary), pacjenci po komisurotomii oceniający znak słów, których nie potrafią odczytać."}, {"t": "w3", "s": "Pytanie kontrolne, rozdz. 3", "q": "Co różni teorie ścisłej selekcji od teorii osłabiania?", "a": "Ścisła selekcja (Broadbent, 1958): filtr wczesny, działający na zasadzie „wszystko albo nic” według cech fizycznych; komunikat nieśledzony jest blokowany (zostaje tylko ok. 20 s w STM i analiza fizyczna). Osłabianie (Treisman): komunikat nieśledzony jest osłabiany, a nie blokowany; selekcja jest wieloetapowa i oparta na priorytetach (stałych i bieżących), więc ważne treści — imię, sens zdania — mogą przejść dalej (cocktail party, „Dear Aunt Jane”, dwujęzyczni). Nazwa „teoria osłabiania” pochodzi spoza rozdziału."}, {"t": "w3", "s": "Pytanie kontrolne, rozdz. 3", "q": "Jakie czynniki wpływają na zachowanie w sytuacji detekcji sygnałów?", "a": "(1) Stosunek siły sygnału do siły szumu — łatwość różnicowania, silne sygnały przyciągają uwagę; (2) macierz wypłat — motywacyjne konsekwencje decyzji (czerniak: lepiej fałszywy alarm niż pominięcie); (3) oczekiwania — częstość sygnałów w danych warunkach albo same przekonania (psychoza strachu, lustracja). Czujność obniża też monotonia i duża częstość bodźców (ponad 24 na minutę) w zadaniach percepcyjnych."}, {"t": "w3", "s": "Pytanie kontrolne, rozdz. 3", "q": "Kiedy kontrola sprawowana nad procesami psychicznymi prowadzi do paradoksalnych skutków?", "a": "Gdy próbujemy tłumić myśli: efekt rykoszetu (Wegner) — „nie myśl o białych niedźwiedziach” zwiększa częstość tych myśli. Proces wykonawczy (szuka treści zastępczych) wymaga zasobów, a monitorujący (szuka zakazanej treści) nie. Przy niedoborze zasobów (stres, zmęczenie) wygrywa monitorujący. Pomaga autodystrakcja („czerwony volkswagen”). Także uświadamianie sobie procesów zmienia ich przebieg (Ericsson i Simon)."}, {"t": "w3", "s": "Pytanie kontrolne, rozdz. 3", "q": "W jakich sytuacjach zachowanie wyznaczają procesy kontrolowane, w jakich automatyczne, a w jakich ich kombinacja?", "a": "Kontrolowane: zadania nowe, trudne, złożone, wymagające świadomości i sekwencyjnego przetwarzania. Automatyczne: zadania przeuczone, łatwe, dobrze znane, przetwarzanie przeduwagowe i torowanie. Kombinacja: większość czynności, bo podział jest ciągły (Logan, Nęcka) — np. wiązanie krawata czy prowadzenie auta przebiegają automatycznie, ale można je uświadomić i skorygować; w zadaniu Stroopa trzeba kontrolą hamować automatyczne czytanie."}, {"t": "w3", "s": "Pytanie kontrolne, rozdz. 3", "q": "Czym są dystraktory i czy możliwe jest minimalizowanie ich oddziaływania?", "a": "Bodźce odwracające uwagę — zewnętrzne lub wewnętrzne, działające na czynność zewnętrzną lub wewnętrzną (tab. 3.2). Ograniczanie: przeuczenie zadania (mniej zasobów), zadania angażujące różne modalności (Gopher i Navon), autodystrakcja wobec myśli intruzywnych (muzyka, „czerwony volkswagen”), skupienie uwagi intensywnej. Pełne wyeliminowanie bywa niemożliwe, a tłumienie może dać efekt rykoszetu."}, {"t": "w3", "s": "Pytanie kontrolne, rozdz. 3", "q": "Jakie czynniki sprawiają, że bezrefleksyjność zaczyna ulegać refleksyjności?", "a": "Zaangażowanie osobistych interesów i wyższa stawka (prośba o skopiowanie 20, a nie 5 stron); zachęta do zastanowienia się (grupa „myślenie” u Chanowitza i Langer); nowe rozróżnienia i kategorie, możliwe na każdym etapie opanowania czynności; ćwiczenie uważności (pensjonariusze domu opieki). W przeciwną stronę działa huśtawka emocjonalna (Doliński)."}, {"t": "w3", "s": "Pytanie kontrolne, rozdz. 3", "q": "Jak reklamodawcy manipulują uwagą odbiorców?", "a": "Rozdział podaje przykłady manipulacji wieloznacznymi komunikatami społecznymi: eufemizmy i przeramowania (Reagan: „margines bezpieczeństwa” zamiast „wyścigu zbrojeń”), propaganda sukcesu, przekonanie, że „krowa jest koniem”. Wykorzystuje się też bodźce nowe i wyraziste (odruch orientacyjny), silne dystraktory oraz bezrefleksyjne reagowanie na samo „bo” (ksero). Z rozdziału 2: prawy górny róg strony, kierunek wzroku, pionowy napis „piwo bezalkoholowe” (2.4.4)."}, {"t": "w3", "s": "Pytanie kontrolne, rozdz. 3", "q": "Jakie elementy wchodzą w skład świadomości rozumianej jako teatr umysłu?", "a": "Scena — globalna przestrzeń robocza o ograniczonej pojemności, ze świadomością w centrum i peryferiami. Wejścia: zmysły zewnętrzne, zmysły wewnętrzne (wyobraźnia, mowa wewnętrzna, sny), idee. Konteksty za kulisami: reżyser (sterowanie wrażeniem), operator światła (sterowanie uwagą — wąski lub szeroki snop), konteksty lokalne. Widownia: wyspecjalizowane, nieświadome systemy eksperckie tworzące koalicje. Do tego pamięć operacyjna pod kontrolą wolicjonalną."}, {"t": "w3", "s": "Pytanie kontrolne, rozdz. 3", "q": "Opisz funkcje uwagi i poziomy selekcji.", "a": "Cztery funkcje: selekcja, ukierunkowanie, określanie wielkości zasobów, podtrzymywanie zaangażowania. Selekcja zachodzi w narządach zmysłów (126 mln fotoreceptorów → ok. 1 mln włókien), w procesach pamięciowych (STM → LTM: habituacja, informacje niezgodne z wiedzą, szybkość kodowania) i przy wyborze informacji z LTM do pamięci operacyjnej na potrzeby działania."}, {"t": "w3", "s": "Pytanie kontrolne, rozdz. 3", "q": "Na czym polega paradygmat podwójnego zadania i co z niego wynika?", "a": "Badany wykonuje dwa zadania naraz; spadek sprawności względem zadań wykonywanych osobno pokazuje konkurencję o zasoby. Spelke, Hirst i Neisser (1976): po 6 tygodniach ćwiczeń czytanie ze zrozumieniem i dyktando bez błędów — ćwiczenie zmniejsza zapotrzebowanie na zasoby. Kahneman: jedna pula zasobów; Gopher i Navon: pule specyficzne dla modalności (prasowanie i radio)."}, {"t": "c1", "s": "Pytanie kontrolne, ćw. 1", "q": "Jakie są cele badań psychologii poznawczej?", "a": "Zbieranie danych, ich analiza, budowanie teorii, formułowanie i sprawdzanie hipotez, czasem stosowanie wyników poza sytuacją badania. Teoria to zorganizowany zbiór twierdzeń wyjaśniających; hipoteza — wstępne twierdzenie o oczekiwanych konsekwencjach empirycznych („jeśli X, to Y”). Wyniki uruchamiają kolejny cykl."}, {"t": "c1", "s": "Pytanie kontrolne, ćw. 1", "q": "Wymień metody badawcze psychologii poznawczej według Sternberga.", "a": "Kontrolowane eksperymenty laboratoryjne, badania psychobiologiczne, techniki samoopisowe, studia przypadków, obserwacje naturalistyczne, symulacje komputerowe i sztuczna inteligencja."}, {"t": "c1", "s": "Pytanie kontrolne, ćw. 1", "q": "Jakie są mocne i słabe strony eksperymentu laboratoryjnego?", "a": "Mocne: kontrola zmiennych, losowy przydział do grup, wnioskowanie przyczynowe, łatwość rejestracji i analizy statystycznej, możliwość reprezentatywnych prób, precyzyjny pomiar czasu reakcji. Słabe: sztuczne warunki i uproszczone zadania, ograniczone uogólnianie na inne zadania, czas i miejsce, rozbieżność między zachowaniem w laboratorium i w życiu, lekceważenie różnic indywidualnych."}, {"t": "c1", "s": "Pytanie kontrolne, ćw. 1", "q": "Czym różnią się badania eksperymentalne od korelacyjnych?", "a": "W eksperymencie badacz manipuluje zmienną niezależną i losowo przydziela badanych do grup, więc może wnosić o przyczynowości. Badania korelacyjne mierzą statystyczny związek cech (od −1 przez 0 do +1), stosuje się je, gdy właściwości nie można losowo przydzielić (np. wiek). Nie pozwalają wnioskować o przyczynach."}, {"t": "c1", "s": "Pytanie kontrolne, ćw. 1", "q": "Do czego najlepiej służą samoopisy, studia przypadków i obserwacja naturalistyczna, a do czego eksperyment?", "a": "Samoopisy, studia przypadków i obserwacja — do formułowania hipotez, mają też większą trafność ekologiczną. Eksperymenty — do weryfikowania hipotez. Samoopisy z przypomnień są mniej rzetelne niż relacje w trakcie, a samo relacjonowanie może zmieniać proces."}, {"t": "c1", "s": "Pytanie kontrolne, ćw. 1", "q": "Jakie są kluczowe problemy psychologii poznawczej według Sternberga?", "a": "Dziedziczność czy wychowanie; racjonalizm czy empiryzm; struktury czy procesy; ogólność czy specyficzność; trafność wnioskowania przyczynowego czy trafność ekologiczna; badania stosowane czy podstawowe. Często najbardziej użyteczna jest synteza stanowisk."}, {"t": "c1", "s": "Pytanie kontrolne, ćw. 1", "q": "Wymień cztery grupy metod według Allporta (1996) i metodę, którą dodają Nęcka i współautorzy.", "a": "Obserwacja (z samoopisem i studium przypadku), eksperyment laboratoryjny, badania kliniczne, symulacja komputerowa. Uzupełnienie: obrazowanie pracy mózgu (PET, fMRI)."}, {"t": "c1", "s": "Pytanie kontrolne, ćw. 1", "q": "Jakie wskaźniki sprawności przetwarzania informacji stosuje się w eksperymencie?", "a": "Średni czas reakcji; inne wskaźniki chronometryczne (minimalny, maksymalny czas reakcji, indywidualna zmienność); poprawność odpowiedzi, zwykle w procentach maksymalnego wyniku (lub liczba i rodzaj błędów); coraz częściej dane neurobiologiczne, np. EEG."}, {"t": "c1", "s": "Pytanie kontrolne, ćw. 1", "q": "Czym jest kognitywistyka i z jakich dyscyplin się składa?", "a": "Interdyscyplinarna dziedzina badań nad poznaniem; według raportu Sloan’a (1978) synteza sześciu dyscyplin: filozofii, psychologii, językoznawstwa, informatyki, antropologii i neuronauki. Rozwija obszary na ich styku (np. psycholingwistyka, neuropsychologia, cybernetyka), choć każda dyscyplina wciąż ma swoją metodologię i język."}, {"t": "c1", "s": "Pytanie kontrolne, ćw. 1", "q": "Dlaczego wyniki symulacji komputerowej przyjmuje się tylko z pewnym prawdopodobieństwem?", "a": "Bo podobieństwo dwóch systemów na wyjściu (poziom wykonania, błędy) nie musi oznaczać podobieństwa sposobu działania — ten sam wynik można uzyskać na wiele sposobów. Mimo to prawdopodobna teoria jest lepsza niż żadna, a klasyczne badania empiryczne też dają wiedzę prawdopodobną."}, {"t": "c1", "s": "Pytanie kontrolne, ćw. 1", "q": "Jakie zalety i wady mają badania kliniczne i obrazowanie mózgu?", "a": "Badania kliniczne: „eksperyment natury” pokazuje rolę obszarów mózgu (np. hipokamp a przekazywanie z STM do LTM), ale grupy są małe i trudno dobrać grupę kontrolną. Obrazowanie: lokalizacja funkcji, porównania osób, weryfikacja modeli (pamięć nie jest jednolita), ale słaba rozdzielczość czasowa (sekundy w fMRI, ok. pół minuty w PET) przy procesach trwających poniżej sekundy."}, {"t": "c1", "s": "Pytanie kontrolne, ćw. 1", "q": "Jakie idee Piageta uczyniły go prekursorem podejścia poznawczego?", "a": "Schemat poznawczy i rozwój jako ciąg asymilacji i akomodacji; aktywność podmiotu (człowiek jak badacz, por. Kelly); konstruktywistyczna natura poznania — reprezentacja świata jest samodzielną budowlą, zwykle tylko częściowo trafną."}, {"t": "w4", "s": "Pytanie kontrolne, rozdz. 4", "q": "Czy fazy procesu pamięciowego mają charakter liniowy, czy cykliczny?", "a": "Cykliczny. Tulving opisał dziewięć faz w porządku liniowym, ale Maruszewski wyróżnia dwa cykle. Mały cykl: wielokrotne odbieranie informacji powiązanych z wiedzą — rekodowanie, asymilacja lub akomodacja, zmiana walencji (efekt czystej ekspozycji); informacje zdobyte własną eksploracją zapamiętujemy szybciej i trwalej. Duży cykl: zachowanie ujawniające zawartość pamięci samo staje się przedmiotem spostrzegania i kodowania — to sytuacja powtarzania (prawo częstości, prawo Foucault t = k·l²); utrwala też błędy; może uruchamiać się automatycznie (myśli intruzywne, ruminacje)."}, {"t": "w4", "s": "Pytanie kontrolne, rozdz. 4", "q": "Jak zmienia się pojemność różnych rodzajów pamięci wyróżnionych ze względu na czas przechowania?", "a": "Sensoryczna: duża, ok. 18 elementów (więcej niż STM), zależnie od procedury (Sperling ok. 12 liter, Averbach i Coriell więcej); czas ok. 0,5 s. Krótkotrwała: mała — 7 ± 2 kęsy (Miller) lub 80 bitów (Lehrl i Fischer); kilkanaście sekund (15–18 s Petersonowie, 5,4 s Lehrl i Fischer), dłużej dzięki powtórkom. Trwała: praktycznie nieograniczona (185 mld informacji wg Csikszentmihalyiego), czas praktycznie nieograniczony; ograniczeniem jest dostęp i tempo kodowania (0,1–1 bit/s)."}, {"t": "w4", "s": "Pytanie kontrolne, rozdz. 4", "q": "Jakim rodzajem pamięci posługuje się świadek zeznający przed sądem?", "a": "Pamięcią epizodyczną — świadek relacjonuje zdarzenia, z którymi miał bezpośredni kontakt, umiejscowione w czasie i przestrzeni (Tulving: świadectwo w sądzie dopuszczalne). Wiedza semantyczna jest w sądzie dopuszczalna tylko jako orzeczenie biegłego. Pamięć epizodyczna jest zależna od kontekstu, nasycona afektem i podatna na zmiany (rekodowanie, synergia z pytaniami, strategiczna kontrola — Koriat i Goldsmith; pamięć tunelowa przy silnym pobudzeniu)."}, {"t": "w4", "s": "Pytanie kontrolne, rozdz. 4", "q": "W jaki sposób można pokonać ograniczenia pojemności pamięci?", "a": "Grupowanie elementów w kęsy — najlepiej po trzy (Wicklegren, 1964); wykorzystanie posiadanej wiedzy (PIN jako data; biegacz Ericssona kodujący cyfry jako czasy biegów — 80 cyfr, choć kosztem długiego treningu); powtórki wewnętrzne przedłużające życie informacji w STM; organizowanie materiału kategorialnie i hierarchicznie (Bousfield; Bower i in. — 73 vs 21 nazw minerałów); pamięć zewnętrzna (notatki, organizery)."}, {"t": "w4", "s": "Pytanie kontrolne, rozdz. 4", "q": "Do jakiego rodzaju pamięci odnoszą się poradniki typu „Nauka tenisa w weekend” i co można powiedzieć o ich skuteczności?", "a": "Do pamięci proceduralnej (niedeklaratywnej) — umiejętności sensomotorycznych. Poradnik dostarcza wiedzy deklaratywnej; według teorii ACT Andersona musi ona dopiero zautomatyzować się w ćwiczeniu i przejść do pamięci proceduralnej, co wymaga długiego treningu. Ponadto pamięć proceduralna jest sztywna i zależna od kontekstu (mały transfer), a jej treści są niedostępne werbalnie — więc weekend z książką raczej nie wystarczy."}, {"t": "w4", "s": "Pytanie kontrolne, rozdz. 4", "q": "Jakie dane uzasadniają wyodrębnienie pamięci krótkotrwałej i trwałej?", "a": "(1) Krzywa pozycyjna: efekt pierwszeństwa (pamięć trwała) i efekt świeżości (pamięć krótkotrwała), wybiórczo wrażliwe na różne czynniki — zadanie angażujące uwagę po liście usuwa efekt świeżości, szybsze tempo osłabia pierwszeństwo (Glanzer). Zastrzeżenie: Bernbach — gdy badani znali długość listy, krzywa U znikała. (2) Badania neuropsychologiczne: wybiórcze zaburzenia STM przy zachowanej LTM (Shallice i Warrington — okolica ciemieniowa/potyliczna) i odwrotnie (uszkodzenia skroniowe, Clive Wearing); rola hipokampa w utrwalaniu."}, {"t": "w4", "s": "Pytanie kontrolne, rozdz. 4", "q": "Na podstawie czego można wnioskować o pamięci ukrytej?", "a": "Na podstawie zachowania w zadaniach, w których badany nie wie, że korzysta z pamięci: torowanie (dokańczanie „pa…”, także po ekspozycji podprogowej), metoda zaoszczędzenia przy ponownym uczeniu się (Ebbinghaus), lepsze wyniki z podpowiedzią u pacjenta z amnezją (Warrington i McCarthy), nieświadomy plagiat (Harrison), wykonywanie wyuczonych umiejętności."}, {"t": "w4", "s": "Pytanie kontrolne, rozdz. 5", "q": "Na czym polega efekt torowania? Podaj przykłady z życia codziennego.", "a": "Bodziec wcześniejszy modyfikuje (ułatwia lub utrudnia) rozpoznawanie i przetwarzanie bodźca późniejszego; efekt jest niedostępny świadomości. Torowanie automatyczne — bodźce niezwiązane, odstęp kilku sekund; strategiczne — bodźce związane, oparte na oczekiwaniach, efekt nawet po roku. Przykłady: „chleb” ułatwia rozpoznanie „bułka”; zmywanie naczyń przywołuje emocję złej wiadomości usłyszanej przy zmywaniu; projekcja w testach projekcyjnych; reklama."}, {"t": "w4", "s": "Pytanie kontrolne, rozdz. 5", "q": "Jak powstają i automatyzują się zdolności proceduralne?", "a": "Według teorii ACT Andersona najpierw przyswajamy wiedzę deklaratywną (gdzie jest litera „b”, metoda „biblijna”), a w miarę treningu wiedza ta automatyzuje się i przechodzi do pamięci proceduralnej (palce „wiedzą” same, piszemy całymi słowami). Umiejętności proceduralne są sztywne, zależne od kontekstu, mają mały transfer i są bardzo odporne na amnezję (Clive Wearing grał na pianinie)."}, {"t": "w4", "s": "Pytanie kontrolne, rozdz. 5", "q": "Jak analiza czasu decyzji przy weryfikowaniu twierdzeń doprowadziła do modelu pamięci jako sieci semantycznej?", "a": "Collins i Quillian mierzyli czas weryfikacji zdań: „kanarek je” (1460 ms) > „kanarek lata” (1385 ms) > „kanarek jest żółty” (1310 ms). Każdy poziom hierarchii dodawał ok. 75 ms, co sugerowało hierarchiczną sieć węzłów (pojęć) i połączeń (przynależność, cechy) z ekonomicznym zapisem cech na najwyższym pasującym poziomie. Anomalie („pudel jest zwierzęciem” szybciej niż „pies jest ssakiem”) wyjaśnił model rozprzestrzeniającego się pobudzenia Collinsa i Loftus; alternatywa — porównywanie cech Smitha, Shobena i Ripsa."}, {"t": "w4", "s": "Pytanie kontrolne, rozdz. 5", "q": "W jaki sposób buduje się sieci pamięciowe stanowiące reprezentację zdarzeń?", "a": "Centralnym elementem jest czynność łącząca sprawcę i adresata (Janek — pocałował — Marysię), czasem z obiektem (kwiaty). Elementy są zmienne. Reprezentacje są uporządkowane w czasie, zawierają relacje przyczynowo-skutkowe i mają strukturę hierarchiczną (epizody → „Randka” → „Chodzenie ze sobą” → „Relacje interpersonalne”); te same epizody mogą u różnych ludzi trafiać do różnych struktur. Szczególny przypadek: czynność psychiczna, w której sprawca jest adresatem („Grzegorz bił się z myślami”)."}, {"t": "w4", "s": "Pytanie kontrolne, rozdz. 5", "q": "Czym różni się zapamiętywanie w pamięci krótkotrwałej (operacyjnej) od zapamiętywania w pamięci trwałej?", "a": "Kodowanie w STM jest automatyczne, głównie akustyczne (też wzrokowo-przestrzenne, presemantyczne); w pamięci operacyjnej zapamiętywanie ogranicza pojemność i krótki czas, a zależy od centralnego systemu wykonawczego i powtórek. W pamięci trwałej zapamiętywanie opiera się na analizie znaczenia, kontrola jest dużo większa (strategie, czas), a wynik zależy od organizacji, sensowności, objętości i tempa materiału oraz od pobudzenia emocjonalnego i zgodności ze schematami."}, {"t": "w4", "s": "Pytanie kontrolne, rozdz. 5", "q": "Jakie są główne funkcje pamięci operacyjnej i co odróżnia jej podstawowe modele?", "a": "Pamięć operacyjna to system, w którym wykonuje się bieżące operacje umysłowe — uczenie się, myślenie, rozumowanie („kuźnia myśli”). Model Baddeleya: odrębne komponenty — centralny system wykonawczy, pętla fonologiczna, szkicownik wzrokowo-przestrzenny, bufor epizodyczny; bliski pamięci krótkotrwałej. Model Cowana: pamięć operacyjna to aktywna część pamięci trwałej, bez modułów; ognisko uwagi (ok. 4 elementy) wybiera centralny system, a decyduje nowość i ważność bodźca. Kryterium: relacja do pamięci trwałej i istnienie odrębnych modułów."}, {"t": "w4", "s": "Pytanie kontrolne, rozdz. 5", "q": "W jaki sposób schematy poznawcze wpływają na pamięć trwałą?", "a": "Nowe informacje są asymilowane do schematów, a schematy akomodowane; system ma stabilizatory. Najlepiej zapamiętujemy informacje umiarkowanie niezgodne ze schematem (Maruszewski — po dwóch tygodniach); całkowicie zgodne nudzą, całkowicie sprzeczne w życiu wywołują silny konflikt afektywny. Hastie: sprzeczne i wyraziste zapamiętujemy najlepiej przy selektywnym zapamiętywaniu. W przekazie seryjnym (Bartlett) treść upraszcza się i dopasowuje do schematów kultury."}, {"t": "w4", "s": "Pytanie kontrolne, rozdz. 5", "q": "Dlaczego przypominanie i rozpoznawanie są niejednakowo trudne?", "a": "Według Loftusów przypominanie jest dwufazowe (przeszukanie + rozpoznanie), wymaga więcej operacji i pełniejszej informacji, a przy rozpoznawaniu odpowiedzi są dane z góry — dlatego zwykle rozpoznanie jest łatwiejsze (Haber i Standing, Shepard). Procesy różnie reagują na częstość słów, uczenie zamierzone i strategie. Jednak rozpoznanie bywa trudniejsze (Watkins; Watkins i Tulving), więc Tulving uznaje oba procesy za jednofazowe; różnica leży we wskazówkach (synergistyczne uświadamianie) i w metodach badania."}, {"t": "w4", "s": "Pytanie kontrolne, rozdz. 4", "q": "Opisz cztery teorie zapominania.", "a": "Rozpad śladu — ślad słabnie z czasem (Waugh i Norman; Baddeley i Scott; Schacter). Interferencja — retroaktywna (nowy materiał zakłóca stary) i proaktywna (stary utrudnia nowy; uwolnienie przy zmianie kategorii — Wickens, Loess). Utrata dostępu — informacja jest w pamięci, ale brak wskazówki („na końcu języka”, specyficzność kodowania). Wyparcie — obrona przed informacjami przykrymi (psychoanaliza; Waldfogel), choć Wagenaar sugeruje raczej wolne kodowanie. Zapominanie jest adaptacyjne (Szereszewski)."}, {"t": "w4", "s": "Pytanie kontrolne, rozdz. 4", "q": "Opisz badanie Sperlinga i jego wnioski.", "a": "Tachistoskopowa ekspozycja liter (ok. 50–100 ms). W odtwarzaniu całościowym badani podawali 4–5 liter. W technice odtworzenia częściowego ton (wysoki, średni, niski) po ekspozycji wskazywał wiersz do odtworzenia; badani odtwarzali go niemal bezbłędnie, jeśli ton pojawił się do 500 ms po planszy. Wniosek: istnieje pamięć ikoniczna o dużej pojemności i czasie przechowania do ok. 0,5 s; przechowuje cechy fizyczne (położenie, wielkość, barwę)."}];
var TOPICS = [
  {id:'c1', name:'Ćwiczenia 1', sub:'Sternberg, Nęcka — metody'},
  {id:'w1', name:'Wykład 1', sub:'Czym jest psych. poznawcza'},
  {id:'w2', name:'Wykład 2', sub:'Spostrzeganie'},
  {id:'w3', name:'Wykład 3', sub:'Uwaga'},
  {id:'w4', name:'Wykład 4', sub:'Pamięć'}
];
var TNAME = {}; TOPICS.forEach(function(t){TNAME[t.id]=t.name});

function hash(str){var h=5381;for(var i=0;i<str.length;i++)h=((h<<5)+h+str.charCodeAt(i))|0;return 'q'+(h>>>0).toString(36)}
BANK.forEach(function(x){x.id=hash('mc|'+x.q)});
OPEN.forEach(function(x){x.id=hash('op|'+x.q)});

var K='pp-rev-v1';
var state=(function(){try{return JSON.parse(localStorage.getItem(K))||{}}catch(e){return {}}})();
state.p=state.p||{}; state.topics=state.topics||['c1']; state.mode=state.mode||'test';
function save(){try{localStorage.setItem(K,JSON.stringify(state))}catch(e){}}
function mark(id,ok){var r=state.p[id]||{c:0,w:0};if(ok)r.c++;else r.w++;r.last=ok?1:0;state.p[id]=r;save()}
function weak(id){var r=state.p[id];return !r||r.last===0}

function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

var stage=document.getElementById('stage');
var sizeSel=document.getElementById('size'), onlyWeak=document.getElementById('onlyWeak');

/* ---------- tematy ---------- */
function renderTopics(){
  var box=document.getElementById('topics'); box.innerHTML='';
  TOPICS.forEach(function(t){
    var items=BANK.filter(function(x){return x.t===t.id}).concat(OPEN.filter(function(x){return x.t===t.id}));
    var known=items.filter(function(x){var r=state.p[x.id];return r&&r.last===1}).length;
    var pct=items.length?Math.round(known/items.length*100):0;
    var b=document.createElement('button');
    b.type='button';b.className='topic';b.setAttribute('aria-pressed',state.topics.indexOf(t.id)>-1);
    b.innerHTML='<b>'+t.name+'</b><small>'+t.sub+' · '+known+'/'+items.length+'</small><span class="bar"><i style="width:'+pct+'%"></i></span>';
    b.onclick=function(){
      var i=state.topics.indexOf(t.id);
      if(i>-1){ if(state.topics.length>1) state.topics.splice(i,1); } else state.topics.push(t.id);
      save(); renderTopics(); start();
    };
    box.appendChild(b);
  });
}

/* ---------- tryby ---------- */
var modeBtns=[].slice.call(document.querySelectorAll('.modes button'));
function setMode(m){state.mode=m;save();modeBtns.forEach(function(b){b.setAttribute('aria-selected',b.dataset.mode===m)});start()}
modeBtns.forEach(function(b){b.onclick=function(){setMode(b.dataset.mode)}});
sizeSel.onchange=start; onlyWeak.onchange=start;

function pool(src){
  var p=src.filter(function(x){return state.topics.indexOf(x.t)>-1});
  if(onlyWeak.checked)p=p.filter(function(x){return weak(x.id)});
  p=shuffle(p); var n=+sizeSel.value; if(n)p=p.slice(0,n); return p;
}

var run=null;
function start(retry){
  if(state.mode==='test'){var p=retry||pool(BANK);run={mode:'test',items:p,i:0,ok:0,miss:[]};}
  else if(state.mode==='cards'){var c=retry||pool(BANK);run={mode:'cards',items:c,i:0,known:0,total:c.length,again:[]};}
  else {var o=retry||pool(OPEN);run={mode:'open',items:o,i:0,ok:0,miss:[]};}
  render();
}
function emptyMsg(){
  stage.innerHTML='<div class="empty">'+(onlyWeak.checked?'Nie ma nic do powtórki w wybranych tematach. Odznacz filtr „tylko do powtórki” albo wybierz inny temat.':'Brak pytań w wybranych tematach.')+'</div>';
}
function head(x,i,n){
  return '<div class="meta"><span class="tag">'+TNAME[x.t]+'</span><span>'+esc(x.s||'')+' · '+(i+1)+'/'+n+'</span></div><div class="progress"><i style="width:'+(i/n*100)+'%"></i></div>';
}

function render(){
  if(!run.items.length)return emptyMsg();
  if(run.i>=run.items.length)return summary();
  var x=run.items[run.i];
  if(run.mode==='test')renderTest(x);
  else if(run.mode==='cards')renderCard(x);
  else renderOpen(x);
}

/* ---------- test ---------- */
function renderTest(x){
  var opts=shuffle(x.a.map(function(t,k){return{t:t,ok:k===0}}));
  var h=head(x,run.i,run.items.length)+'<p class="question">'+esc(x.q)+'</p><div class="answers">';
  opts.forEach(function(o,k){h+='<button type="button" class="ans" data-k="'+k+'"><span class="k">'+'ABCD'[k]+'</span><span>'+esc(o.t)+'</span></button>'});
  h+='</div><div id="fb"></div>';
  stage.innerHTML=h;
  var answered=false;
  [].forEach.call(stage.querySelectorAll('.ans'),function(btn){
    btn.onclick=function(){
      if(answered)return; answered=true;
      var o=opts[+btn.dataset.k];
      [].forEach.call(stage.querySelectorAll('.ans'),function(b2,k){b2.disabled=true;if(opts[k].ok)b2.classList.add('correct');else if(b2===btn)b2.classList.add('wrong');else b2.classList.add('dim')});
      mark(x.id,o.ok);
      if(o.ok)run.ok++;else run.miss.push(x);
      document.getElementById('fb').innerHTML='<div class="feedback'+(o.ok?'':' bad')+'"><b>'+(o.ok?'Dobrze.':'Poprawna odpowiedź: '+esc(x.a[0]))+'</b>'+esc(x.e||'')+'</div><div class="row"><button type="button" class="btn primary" id="next">Dalej</button></div>';
      var n=document.getElementById('next');n.onclick=function(){run.i++;render();stage.scrollIntoView({block:'nearest'})};n.focus({preventScroll:true});
      renderTopics();
    };
  });
}

/* ---------- fiszki ---------- */
function renderCard(x){
  var h='<div class="meta"><span class="tag">'+TNAME[x.t]+'</span><span>'+esc(x.s||'')+' · zostało '+(run.items.length-run.i)+'</span></div><div class="progress"><i style="width:'+(run.known/run.total*100)+'%"></i></div>';
  h+='<div class="card" id="card" tabindex="0" role="button" aria-label="Odwróć fiszkę"><div class="card-inner">';
  h+='<div class="face front"><div class="q2">'+esc(x.q)+'</div><div class="tap">Dotknij, żeby odwrócić</div></div>';
  h+='<div class="face back"><div class="ans-text">'+esc(x.a[0])+'</div><div class="ex">'+esc(x.e||'')+'</div></div>';
  h+='</div></div><div class="row" id="rate" hidden><button type="button" class="btn bad" id="no">Jeszcze nie</button><button type="button" class="btn good primary" id="yes">Umiem</button></div>';
  stage.innerHTML=h;
  var card=document.getElementById('card'),rate=document.getElementById('rate');
  function flip(){card.classList.toggle('flipped');rate.hidden=false}
  card.onclick=flip; card.onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();flip()}};
  document.getElementById('yes').onclick=function(){mark(x.id,true);run.known++;run.i++;renderTopics();render()};
  document.getElementById('no').onclick=function(){
    mark(x.id,false);
    var pos=Math.min(run.items.length,run.i+3+Math.floor(Math.random()*3));
    run.items.splice(pos,0,x); run.i++; if(run.again.indexOf(x)<0)run.again.push(x); renderTopics(); render();
  };
}

/* ---------- pytania otwarte ---------- */
function renderOpen(x){
  var h=head(x,run.i,run.items.length)+'<p class="question">'+esc(x.q)+'</p>';
  h+='<textarea id="mine" placeholder="Twoja odpowiedź (opcjonalnie) — albo odpowiedz na głos"></textarea>';
  h+='<div id="reveal" class="row"><button type="button" class="btn primary" id="show">Pokaż wzorcową odpowiedź</button></div>';
  stage.innerHTML=h;
  document.getElementById('show').onclick=function(){
    var r=document.getElementById('reveal');
    r.outerHTML='<div class="open-a">'+esc(x.a)+'</div><div class="row"><button type="button" class="btn bad" data-v="0">Nie umiałam</button><button type="button" class="btn" data-v="h">Częściowo</button><button type="button" class="btn good primary" data-v="1">Umiałam</button></div>';
    [].forEach.call(stage.querySelectorAll('[data-v]'),function(b){b.onclick=function(){
      var ok=b.dataset.v==='1'; mark(x.id,ok); if(ok)run.ok++;else run.miss.push(x); run.i++; renderTopics(); render();
    }});
  };
}

/* ---------- podsumowanie ---------- */
function summary(){
  var h='<div class="summary">';
  if(run.mode==='cards'){
    h+='<h2>Koniec talii</h2><p>Fiszki, które wracały jako „jeszcze nie”: '+run.again.length+'.</p>';
    h+='<div class="row">'+(run.again.length?'<button type="button" class="btn" id="again">Powtórz tylko te</button>':'')+'<button type="button" class="btn primary" id="new">Nowa talia</button></div>';
  } else {
    var n=run.items.length,pct=Math.round(run.ok/n*100);
    h+='<p class="big">'+pct+'%</p><h2>'+run.ok+' z '+n+'</h2>';
    if(run.mode==='test'&&n>=10)h+='<p>'+(pct>=50.5?'To wynik powyżej progu zaliczenia testu (29/56 pkt ≈ 52%).':'Próg zaliczenia testu to 29/56 pkt (ok. 52%). Warto powtórzyć błędne.')+'</p>';
    if(run.miss.length){
      h+='<p class="label" style="margin-top:1.2rem">Do powtórki</p>';
      run.miss.forEach(function(x){h+='<div class="miss"><p>'+esc(x.q)+'</p><p class="c">'+esc(run.mode==='test'?x.a[0]:'')+'</p></div>'});
    }
    h+='<div class="row">'+(run.miss.length?'<button type="button" class="btn" id="again">Powtórz błędne</button>':'')+'<button type="button" class="btn primary" id="new">Nowa runda</button></div>';
  }
  stage.innerHTML=h+'</div>';
  var a=document.getElementById('again'); if(a)a.onclick=function(){start(shuffle(run.mode==='cards'?run.again:run.miss))};
  document.getElementById('new').onclick=function(){start()};
}

/* ---------- klawiatura ---------- */
document.addEventListener('keydown',function(e){
  if(e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT')return;
  if(run&&run.mode==='test'){
    var m={'1':0,'2':1,'3':2,'4':3,'a':0,'b':1,'c':2,'d':3}[e.key.toLowerCase()];
    if(m!==undefined){var b=stage.querySelectorAll('.ans')[m];if(b&&!b.disabled)b.click()}
  }
  if(e.key===' '&&run&&run.mode==='cards'){var c=document.getElementById('card');if(c){e.preventDefault();c.click()}}
  if(e.key==='Enter'){var n=document.getElementById('next');if(n&&document.activeElement!==n){e.preventDefault();n.click()}}
});

document.getElementById('reset').onclick=function(){
  if(confirm('Wyzerować cały zapisany postęp?')){state.p={};save();renderTopics();start()}
};

renderTopics();
setMode(state.mode);
</script>
