<html lang="pl">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport"/>
<title>Powtórka — psychologia poznawcza</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&amp;family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&amp;display=swap" rel="stylesheet"/>
<style>
:root{
  --paper:#fffdf9;--ink:#2b2118;--ink-soft:#5c4f43;--rule:#e9e0d3;--parchment:#f7f1e7;
  --accent:hsl(209 33% 56%);--accent-deep:hsl(209 36% 36%);--accent-tint:hsl(209 40% 95%);--accent-line:hsl(209 33% 80%);
  --ok:hsl(150 32% 30%);--ok-tint:hsl(150 32% 94%);--bad:#9a4a1c;--bad-tint:#fbefe5;
  --display:"Playfair Display",Georgia,serif;--body:"Source Serif 4",Georgia,serif;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:1.0625rem;line-height:1.6;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--accent-deep);outline-offset:3px}
.wrap{max-width:46rem;margin:0 auto;padding:2rem 1rem 5rem}
header h1{font-family:var(--display);font-weight:700;font-size:clamp(1.8rem,5vw,2.5rem);line-height:1.1;margin:0 0 .4rem}
header p{margin:0 0 1.4rem;color:var(--ink-soft)}
.label{font-size:.85rem;color:var(--ink-soft);margin:0 0 .45rem}

.topics{display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5rem,1fr));gap:.55rem;margin:0 0 1.3rem}
.topic{text-align:left;border:1px solid var(--rule);background:var(--paper);border-radius:12px;padding:.65rem .8rem .7rem;transition:background .15s,border-color .15s}
.topic[aria-pressed=true]{border-color:var(--accent);background:var(--accent-tint)}
.topic b{display:block;font-family:var(--display);font-weight:500;font-size:1.05rem;line-height:1.2}
.topic small{display:block;color:var(--ink-soft);font-size:.8rem;margin:.1rem 0 .45rem}
.bar{display:block;height:6px;background:var(--rule);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .3s}

.modes{display:flex;gap:.35rem;background:var(--parchment);padding:.3rem;border-radius:999px;margin:0 0 1rem}
.modes button{flex:1;border:0;background:transparent;border-radius:999px;padding:.55rem .4rem;font-family:var(--display);font-size:1rem;color:var(--ink-soft)}
.modes button[aria-selected=true]{background:var(--paper);color:var(--accent-deep);box-shadow:0 1px 2px rgba(43,33,24,.12)}
.opts{display:flex;flex-wrap:wrap;gap:.6rem 1.2rem;align-items:center;font-size:.92rem;color:var(--ink-soft);margin:0 0 1.2rem}
.opts select{font:inherit;font-size:.92rem;padding:.25rem .4rem;border:1px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--ink)}
.opts label{display:flex;align-items:center;gap:.4rem}

.stage{border:1px solid var(--rule);border-radius:16px;background:var(--paper);padding:1.4rem 1.3rem 1.3rem;min-height:18rem}
.meta{display:flex;justify-content:space-between;gap:1rem;font-size:.82rem;color:var(--ink-soft);margin-bottom:.7rem}
.meta .tag{color:var(--accent-deep)}
.progress{height:4px;background:var(--rule);border-radius:2px;margin:0 0 1.1rem;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .25s}
.question{font-family:var(--display);font-weight:500;font-size:clamp(1.2rem,3.4vw,1.45rem);line-height:1.3;margin:0 0 1.1rem}
.answers{display:grid;gap:.55rem}
.ans{display:grid;grid-template-columns:1.9rem 1fr;gap:.6rem;align-items:start;text-align:left;border:1px solid var(--rule);background:var(--paper);border-radius:12px;padding:.7rem .8rem;line-height:1.45}
.ans:hover:not(:disabled){border-color:var(--accent);background:var(--accent-tint)}
.ans .k{display:grid;place-items:center;width:1.7rem;height:1.7rem;border-radius:50%;border:1px solid var(--accent-line);font-size:.85rem;color:var(--accent-deep)}
.ans:disabled{cursor:default}
.ans.correct{border-color:var(--ok);background:var(--ok-tint)}
.ans.correct .k{background:var(--ok);border-color:var(--ok);color:#fff}
.ans.wrong{border-color:var(--bad);background:var(--bad-tint)}
.ans.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}
.ans.dim{opacity:.55}
.feedback{margin-top:1rem;padding:.8rem 1rem;border-radius:10px;border-left:4px solid var(--ok);background:var(--ok-tint);font-size:.97rem}
.feedback.bad{border-left-color:var(--bad);background:var(--bad-tint)}
.feedback b{display:block;margin-bottom:.15rem}
.row{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:flex-end;margin-top:1.1rem}
.btn{border:1px solid var(--accent-line);background:var(--paper);color:var(--accent-deep);border-radius:999px;padding:.55rem 1.2rem;font-size:.97rem}
.btn:hover{background:var(--accent-tint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-deep)}
.btn.good{border-color:var(--ok);color:var(--ok)}
.btn.bad{border-color:var(--bad);color:var(--bad)}
.btn.good.primary{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.good.primary:hover{background:hsl(150 34% 24%)}
@media (max-width:520px){.modes button{font-size:.9rem;white-space:nowrap}}
.hint{font-size:.8rem;color:var(--ink-soft);margin-top:.9rem;text-align:right}

.card{perspective:1400px;cursor:pointer;min-height:15rem}
.card-inner{position:relative;min-height:15rem;transition:transform .45s;transform-style:preserve-3d}
.card.flipped .card-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:12px;padding:1.1rem;display:flex;flex-direction:column;justify-content:center;overflow:auto}
.front{background:var(--accent-tint)}
.back{background:var(--parchment);transform:rotateY(180deg)}
.face .q2{font-family:var(--display);font-size:clamp(1.15rem,3.2vw,1.35rem);line-height:1.3}
.face .ans-text{font-weight:600;color:var(--ok);font-size:1.08rem;margin-bottom:.5rem}
.face .ex{font-size:.95rem;color:var(--ink-soft)}
.tap{font-size:.8rem;color:var(--ink-soft);margin-top:.9rem}
@media (prefers-reduced-motion:reduce){.card-inner{transition:none}}

.open-a{margin-top:1rem;padding:.9rem 1rem;background:var(--parchment);border-radius:10px;font-size:.98rem}
textarea{width:100%;min-height:6rem;font:inherit;font-size:.97rem;border:1px solid var(--rule);border-radius:10px;padding:.7rem;background:var(--paper);color:var(--ink);resize:vertical}

.summary h2{font-family:var(--display);font-weight:700;font-size:2rem;margin:0 0 .2rem}
.summary .big{font-family:var(--display);font-size:3.2rem;color:var(--accent-deep);line-height:1;margin:.2rem 0 .3rem}
.miss{border-top:1px solid var(--rule);padding:.7rem 0;font-size:.95rem}
.miss p{margin:0}
.miss .c{color:var(--ok);font-weight:600}
.empty{color:var(--ink-soft);text-align:center;padding:3rem 1rem}

footer{margin-top:2rem;font-size:.82rem;color:var(--ink-soft);display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap}
footer button{border:0;background:none;color:var(--bad);text-decoration:underline;padding:0;font-size:.82rem}
</style>
<meta content="noindex, nofollow" name="robots"/><link href="../assets/icon-180.png" rel="apple-touch-icon"/><link href="../assets/overlay.css?v=f2b5777c" rel="stylesheet"/><style>:root{--st-h:209;--st-s:33%;--st-l:56%}</style></head>
<body>
<div class="wrap">
<header>
<h1>Powtórka z psychologii poznawczej</h1>
<p>Test jednokrotnego wyboru (jak na egzaminie), fiszki i pytania otwarte. Postęp zapisuje się w tej przeglądarce.</p>
</header>
<p class="label">Tematy — zaznacz jeden lub kilka</p>
<div class="topics" id="topics"></div>
<div aria-label="Tryb nauki" class="modes" role="tablist">
<button aria-selected="true" data-mode="test" role="tab">Test</button>
<button aria-selected="false" data-mode="cards" role="tab">Fiszki</button>
<button aria-selected="false" data-mode="open" role="tab">Pytania otwarte</button>
</div>
<div class="opts">
<label>Liczba pytań
    <select id="size"><option value="10">10</option><option selected="" value="20">20</option><option value="0">wszystkie</option></select>
</label>
<label><input id="onlyWeak" type="checkbox"/> tylko do powtórki (błędne i nieznane)</label>
</div>
<main aria-live="polite" class="stage" id="stage"></main>
<footer>
<span>Skróty: 1–4 wybór odpowiedzi · Enter dalej · Spacja odwraca fiszkę</span>
<button id="reset" type="button">Wyzeruj postęp</button>
</footer>
</div>
<script>
var BANK = [{"t": "c1", "s": "Sternberg, s. 23", "q": "Czym według Sternberga jest teoria?", "a": ["Zorganizowanym zbiorem twierdzeń wyjaśniających dotyczących danego zjawiska", "Wstępnym twierdzeniem o oczekiwanych konsekwencjach empirycznych", "Informacją o prawdopodobieństwie, że wyniki nie są przypadkowe", "Opisem danych zebranych w badaniu"], "e": "Teoria to zorganizowany zbiór twierdzeń wyjaśniających. Hipoteza to wstępne twierdzenie o oczekiwanych konsekwencjach empirycznych teorii."}, {"t": "c1", "s": "Sternberg, s. 23", "q": "Hipoteza to:", "a": ["Wstępne twierdzenie o oczekiwanych konsekwencjach empirycznych teorii", "Zorganizowany zbiór twierdzeń wyjaśniających", "Statystyczny związek między dwiema cechami", "Ostateczny wniosek z serii eksperymentów"], "e": "Schemat hipotezy: „Jeśli teoria jest prawdziwa, to zawsze gdy wystąpi X, rezultatem powinno być Y”."}, {"t": "c1", "s": "Sternberg, s. 23", "q": "Istotność statystyczna informuje o:", "a": ["Prawdopodobieństwie, że wyniki nie są jedynie efektem przypadkowej zmienności danych", "Sile związku przyczynowego między zmiennymi", "Stopniu, w jakim wyniki dają się uogólnić na życie codzienne", "Liczbie osób potrzebnych do badania"], "e": "Nawet gdy wyniki wyglądają na zgodne z hipotezą, trzeba je poddać analizie statystycznej."}, {"t": "c1", "s": "Sternberg, tab. 1-1", "q": "Która metoda według tabeli 1-1 Sternberga zwykle pozwala na losowy przydział badanych do grup?", "a": ["Kontrolowany eksperyment laboratoryjny", "Studium przypadku", "Obserwacja naturalistyczna", "Technika samoopisowa"], "e": "Losowy przydział i kontrola zmiennych niezależnych to zwykle cechy eksperymentu laboratoryjnego, więc umożliwia on wnioskowanie przyczynowe."}, {"t": "c1", "s": "Sternberg, tab. 1-1", "q": "Która metoda daje pełną kontrolę zmiennych, ale kryterium wielkości i reprezentatywności prób „nie ma zastosowania”?", "a": ["Symulacje komputerowe i sztuczna inteligencja", "Badania psychobiologiczne", "Studia przypadków", "Techniki samoopisowe"], "e": "Przy symulacjach nie ma badanych, więc kryteria prób nie mają zastosowania, a badacz kontroluje wszystkie zmienne."}, {"t": "c1", "s": "Sternberg, tab. 1-1", "q": "Słaba strona badań psychobiologicznych według Sternberga to:", "a": ["Mała dostępność, kosztowne wyposażenie i trudność uogólniania wyników z uszkodzonych mózgów na zdrowe", "Brak jakichkolwiek „twardych” wskaźników funkcji poznawczych", "Wpływ obecności obserwatora na zachowanie badanego", "Konieczność opierania się wyłącznie na introspekcji"], "e": "Zaletą są „twarde” wskaźniki powiązane z aktywnością fizjologiczną. Wpływ obserwatora to słabość obserwacji naturalistycznej."}, {"t": "c1", "s": "Sternberg, s. 24", "q": "Warrington i Shallice wykazali, że lezje lewego płata ciemieniowego prowadzą do:", "a": ["Poważnych deficytów pamięci krótkotrwałej przy zachowanej długotrwałej", "Poważnych deficytów pamięci długotrwałej przy zachowanej krótkotrwałej", "Utraty zdolności rozpoznawania twarzy", "Deficytów obu rodzajów pamięci w równym stopniu"], "e": "Lezje w środkowych regionach skroniowych dają odwrotny obraz: STM działa dobrze, LTM ma znaczne deficyty."}, {"t": "c1", "s": "Sternberg, s. 24", "q": "Studenci przez tydzień zapisywali w dziennikach wszystkie swoje wyobrażenia (Kosslyn i in., 1990). To przykład:", "a": ["Techniki samoopisowej", "Obserwacji naturalistycznej", "Studium przypadku", "Eksperymentu laboratoryjnego"], "e": "Dzienniki, protokoły werbalne i samooceny to techniki samoopisowe."}, {"t": "c1", "s": "Sternberg, s. 24", "q": "Analiza psychologicznego kontekstu twórczości Karola Darwina (Gruber) to przykład:", "a": ["Studium przypadku", "Obserwacji naturalistycznej", "Symulacji komputerowej", "Techniki samoopisowej"], "e": "Studium przypadku to intensywne badanie pojedynczej osoby w celu wyprowadzenia ogólnych wniosków."}, {"t": "c1", "s": "Sternberg, s. 25", "q": "Badanie Michaela Cole’a nad rozumieniem inteligencji u plemienia Kepellów to przykład:", "a": ["Obserwacji naturalistycznej", "Eksperymentu laboratoryjnego", "Badania psychobiologicznego", "Symulacji komputerowej"], "e": "Obserwacja naturalistyczna dotyczy rzeczywistych sytuacji życiowych i daje bogate informacje o środowisku."}, {"t": "c1", "s": "Sternberg, s. 25", "q": "Kogo Sternberg podaje jako przykład symulacji komputerowej percepcji wzrokowej?", "a": ["Davida Marra (1982)", "Howarda Grubera", "Michaela Cole’a", "Meyera i Schvaneveldta"], "e": "Marr stworzył szczegółową teorię percepcji wzrokowej opartą na modelach komputerowych."}, {"t": "c1", "s": "Sternberg, s. 24", "q": "Meyer i Schvaneveldt (1971) prezentowali bardzo krótko szeregi liter, a badani oceniali, czy tworzą wyraz. To przykład:", "a": ["Kontrolowanego eksperymentu laboratoryjnego", "Techniki samoopisowej", "Studium przypadku", "Obserwacji naturalistycznej"], "e": "To typowe zadanie laboratoryjne z precyzyjną kontrolą warunków."}, {"t": "c1", "s": "Sternberg, s. 26", "q": "Co jest najczęściej zmienną zależną w eksperymentach psychologii poznawczej?", "a": ["Miary poprawności i czas reakcji", "Wiek i wykształcenie badanych", "Obecność wskazówek w zadaniu", "Modalność prezentacji materiału"], "e": "Wiek, wykształcenie, wskazówki czy modalność to zmienne niezależne (właściwości osób, sytuacji, zadania)."}, {"t": "c1", "s": "Sternberg, s. 26", "q": "Dlaczego wpływ starzenia się bada się zwykle metodą korelacyjną, a nie eksperymentalną?", "a": ["Bo wieku nie da się losowo przydzielić badanym", "Bo korelacja pozwala wnioskować o przyczynach", "Bo eksperymenty wymagają zbyt dużych prób", "Bo wiek nie wpływa na procesy poznawcze"], "e": "Właściwościami sytuacji i zadania można manipulować, ale właściwości osób nie da się losowo przydzielić."}, {"t": "c1", "s": "Sternberg, s. 26", "q": "Jaki rodzaj korelacji Sternberg podaje dla zmęczenia i czujności?", "a": ["Ujemną", "Dodatnią", "Zerową (brak związku)", "Krzywoliniową"], "e": "Brak związku: inteligencja a długość płatków uszu. Dodatnia: zasób słownika a rozumienie czytanego tekstu."}, {"t": "c1", "s": "Sternberg, s. 26", "q": "Główne ograniczenie badań korelacyjnych to:", "a": ["Nie dają podstaw do wnioskowania o związkach przyczynowych", "Wymagają losowego przydziału do grup", "Nie pozwalają obliczyć istotności statystycznej", "Można je prowadzić tylko w laboratorium"], "e": "Zaletą jest giętkość (nie wymagają losowego przydziału), wadą — brak wnioskowania przyczynowego."}, {"t": "c1", "s": "Sternberg, s. 27", "q": "Do czego według Sternberga najlepiej służą samoopisy, studia przypadków i obserwacja naturalistyczna?", "a": ["Do formułowania hipotez", "Do weryfikowania hipotez", "Do ustalania związków przyczynowych", "Do zastępowania analizy statystycznej"], "e": "Eksperymenty są najbardziej użyteczne przy weryfikowaniu hipotez, pozostałe metody — przy ich formułowaniu."}, {"t": "c1", "s": "Sternberg, s. 27", "q": "Protokół werbalny polega na tym, że badany:", "a": ["Głośno opisuje swoje rozumowanie i myśli w trakcie wykonywania zadania", "Po badaniu wypełnia kwestionariusz o swoich strategiach", "Prowadzi dziennik przez kilka tygodni", "Ocenia odpowiedzi innych badanych"], "e": "Relacje zbierane w trakcie procesu są rzetelniejsze niż przypomnienia, ale samo relacjonowanie może zmieniać proces."}, {"t": "c1", "s": "Sternberg, s. 27", "q": "Które dane samoopisowe są według Sternberga najmniej rzetelne?", "a": ["Oparte na przypomnieniach (dzienniki, opisy retrospektywne, kwestionariusze)", "Zbierane na bieżąco w trakcie zadania", "Liczbowe oceny bliskości rozwiązania co 15 sekund", "Wszystkie samoopisy są równie rzetelne"], "e": "Nawet przy pełnej prawdomówności ludzie zapominają, co robili."}, {"t": "c1", "s": "Sternberg, s. 28", "q": "Większa trafność ekologiczna studiów przypadków i obserwacji naturalistycznej oznacza, że:", "a": ["Lepiej oddają funkcjonowanie w interakcji z rzeczywistym środowiskiem", "Pozwalają na pełną kontrolę zmiennych", "Opierają się na dużych i reprezentatywnych próbach", "Pozwalają wnioskować o przyczynach"], "e": "Ekologia to badanie interakcji organizmu ze środowiskiem; procesy w laboratorium nie zawsze są takie same jak w klasie czy wieży kontroli lotów."}, {"t": "c1", "s": "Sternberg, s. 28", "q": "Które zadanie według Sternberga jest łatwe dla człowieka, a bardzo trudne dla komputera?", "a": ["Rozpoznanie twarzy przyjaciela", "Pomnożenie 123456789 × 987654321", "Zapamiętanie listy tysiąca liczb", "Wykonanie tysiąca obliczeń na sekundę"], "e": "Wiele zadań łatwych dla komputerów jest trudnych dla ludzi i odwrotnie."}, {"t": "c1", "s": "Sternberg, s. 29", "q": "Kwestia „racjonalizm czy empiryzm” dotyczy tego, czy:", "a": ["Prawdę odkrywa się logicznym rozumowaniem, czy obserwacją zmysłową", "Badać struktury umysłu, czy procesy", "Prowadzić badania podstawowe, czy stosowane", "Procesy poznawcze są ogólne, czy specyficzne dla dziedziny"], "e": "To jeden z pięciu problemów związanych z metodami, obok struktur/procesów, ogólności/specyficzności, trafności przyczynowej/ekologicznej i badań stosowanych/podstawowych."}, {"t": "c1", "s": "Sternberg, s. 29", "q": "Który problem Sternberg nazywa najbardziej podstawowym dla psychologii poznawczej?", "a": ["Dziedziczność czy wychowanie", "Badania stosowane czy podstawowe", "Struktury czy procesy", "Ogólność czy specyficzność"], "e": "Jeśli ważniejsze są cechy wrodzone — badamy je; jeśli środowisko — badamy jego wpływ."}, {"t": "c1", "s": "Sternberg, s. 31", "q": "Kogo Sternberg łączy ze strukturalizmem?", "a": ["Wundta", "Jamesa i Deweya", "Ebbinghausa i Thorndike’a", "Watsona i Skinnera"], "e": "James i Dewey — funkcjonalizm; Ebbinghaus i Thorndike — asocjacjonizm; Watson i Skinner — behawioryzm."}, {"t": "c1", "s": "Sternberg, s. 31", "q": "Kto według Sternberga dokonał syntezy racjonalizmu i empiryzmu?", "a": ["Kant", "Hegel", "Locke", "Descartes"], "e": "Descartes rozwinął racjonalizm, Locke — empiryzm, Hegel wskazał dialektyczny charakter rozwoju idei."}, {"t": "c1", "s": "Sternberg, s. 28–29", "q": "Nauka poznawcza według Sternberga łączy idee i metody kilku dziedzin. Której NIE wymienia?", "a": ["Ekonomii", "Lingwistyki", "Antropologii", "Filozofii"], "e": "Sternberg wymienia: psychologię poznawczą, psychobiologię, sztuczną inteligencję, filozofię, lingwistykę i antropologię."}, {"t": "c1", "s": "Nęcka, s. 34", "q": "Które pojęcia Piageta uczyniły go prekursorem podejścia poznawczego?", "a": ["Asymilacja i akomodacja schematów, aktywność podmiotu, konstruktywistyczna natura poznania", "Warunkowanie klasyczne i instrumentalne", "Filtr uwagowy i ograniczona przepustowość kanału", "Mapy poznawcze i uczenie się utajone"], "e": "Mapy poznawcze to Tolman; filtr to Broadbent; warunkowanie to behawioryzm."}, {"t": "c1", "s": "Nęcka, s. 34", "q": "Autor koncepcji człowieka jako „badacza z ulicy” to:", "a": ["George Kelly", "Jean Piaget", "Noam Chomsky", "Daniel Dennett"], "e": "Nęcka przywołuje Kelly’ego obok Piageta, by podkreślić aktywność podmiotu."}, {"t": "c1", "s": "Nęcka, s. 34", "q": "Teorię informacji stworzyli:", "a": ["Shannon i Weaver (1949)", "Wiener (1948)", "Fodor i Dennett", "Newell i Simon"], "e": "Wiener (1948) to cybernetyka; Fodor i Dennett to filozofia umysłu."}, {"t": "c1", "s": "Nęcka, s. 35", "q": "Qualia to:", "a": ["Jakościowo swoiste, subiektywne stany świadomości", "Jednostki informacji w teorii Shannona", "Elementarne cechy rejestrowane przez detektory", "Moduły sztucznych sieci neuronowych"], "e": "Pytanie o funkcję i pochodzenie qualiów należy do problemu psychofizycznego w filozofii umysłu."}, {"t": "c1", "s": "Nęcka, s. 35", "q": "Sztuczna inteligencja „w wersji drugiej” według Nęcki to:", "a": ["Systemy udatnie naśladujące procesy poznawcze ludzi, przydatne w badaniach podstawowych", "Systemy inżynieryjne oceniane wyłącznie po praktycznej użyteczności", "Filozoficzna teoria poznania", "Neuroobrazowanie procesów poznawczych"], "e": "Wersja pierwsza to inżynieria (kryterium: użyteczność praktyczna). Wersja druga jest bliska modelowaniu komputerowemu."}, {"t": "c1", "s": "Nęcka, s. 35", "q": "Ile dyscyplin składa się na kognitywistykę według raportu Sloan’a (1978)?", "a": ["Sześć", "Cztery", "Pięć", "Osiem"], "e": "Filozofia, psychologia, językoznawstwo, informatyka, antropologia i neuronauka."}, {"t": "c1", "s": "Nęcka, ryc. 1.1", "q": "Która dyscyplina NIE należy do sześciokąta nauk kognitywnych?", "a": ["Socjologia", "Antropologia", "Informatyka", "Neuronauka"], "e": "Do sześciokąta należą: filozofia, psychologia, językoznawstwo, informatyka, antropologia, neuronauka."}, {"t": "c1", "s": "Nęcka, ryc. 1.1", "q": "Psycholingwistyka leży na styku:", "a": ["Psychologii i językoznawstwa", "Informatyki i neuronauki", "Psychologii i neuronauki", "Językoznawstwa i antropologii"], "e": "Informatyka–neuronauka: cybernetyka; psychologia–neuronauka: neuropsychologia; językoznawstwo–antropologia: lingwistyka antropologiczna."}, {"t": "c1", "s": "Nęcka, ryc. 1.1", "q": "Cybernetyka w sześciokącie kognitywistyki łączy:", "a": ["Informatykę i neuronaukę", "Psychologię i informatykę", "Filozofię i psychologię", "Neuronaukę i antropologię"], "e": "Psychologia–informatyka to komputerowe symulacje; filozofia–psychologia to filozofia psychologii; neuronauka–antropologia to badania nad ewolucją mózgu."}, {"t": "c1", "s": "Nęcka, s. 35", "q": "Który rodzaj antropologii jest głównie częścią kognitywistyki?", "a": ["Kulturowa", "Filozoficzna", "Fizyczna", "Teologiczna"], "e": "Liczą się też ustalenia antropologii biologicznej o ewolucji mózgu, ale główną częścią jest antropologia kulturowa."}, {"t": "c1", "s": "Nęcka, s. 37", "q": "Cztery podstawowe grupy metod według Allporta (1996) to:", "a": ["Obserwacja, eksperyment laboratoryjny, badania kliniczne, symulacja komputerowa", "Eksperyment, korelacja, ankieta, wywiad", "Obserwacja, samoopis, studium przypadku, eksperyment", "Eksperyment, badania kliniczne, symulacja, obrazowanie mózgu"], "e": "Obrazowanie pracy mózgu (PET, fMRI) to piąta grupa, którą dodają autorzy podręcznika."}, {"t": "c1", "s": "Nęcka, s. 37", "q": "Według Nęcki samoopis to raport z obserwacji sporządzony przez:", "a": ["Samego badanego", "Niezależnego badacza", "Grupę ekspertów", "Program komputerowy"], "e": "Raport niezależnego badacza o osobie lub grupie w warunkach naturalnych to studium przypadku."}, {"t": "c1", "s": "Nęcka, s. 37", "q": "Który z poniższych to wskaźnik chronometryczny?", "a": ["Indywidualna zmienność czasu reagowania", "Procent poprawnych odpowiedzi", "Liczba popełnionych błędów", "Rodzaj popełnianych błędów"], "e": "Wskaźniki chronometryczne dotyczą czasu: średni, minimalny, maksymalny czas reakcji i jego zmienność. Poprawność to drugi typ wskaźnika."}, {"t": "c1", "s": "Nęcka, s. 37–38", "q": "Główną zaletą eksperymentu laboratoryjnego według Nęcki jest:", "a": ["Dokładna kontrola przebiegu i precyzyjna rejestracja reakcji", "Naturalność warunków i zadań", "Badanie osób ze specjalistyczną wiedzą", "Brak potrzeby analizy statystycznej"], "e": "Ceną są sztuczne warunki oraz uproszczone i nienaturalne zadania."}, {"t": "c1", "s": "Nęcka, s. 38", "q": "Badania kliniczne nazywa się „eksperymentem natury”, ponieważ:", "a": ["Dotyczą skutków uszkodzeń mózgu, których nie można celowo wywołać u zdrowych osób", "Odbywają się w warunkach naturalnych, poza laboratorium", "Polegają na obserwacji zwierząt", "Nie wymagają zgody badanych"], "e": "Wylew, uraz czy operacja to niezaplanowany „eksperyment”, który pokazuje rolę uszkodzonych obszarów."}, {"t": "c1", "s": "Nęcka, s. 38", "q": "Co wykazały obserwacje kliniczne według Nęcki?", "a": ["Pamięć krótkotrwała przekazuje dane do długotrwałej z opóźnieniem, dzięki mechanizmowi w hipokampie", "Pamięć krótkotrwała i długotrwała to jeden i ten sam system", "Uszkodzenie hipokampa zaburza wyłącznie spostrzeganie", "Informacje trafiają do pamięci długotrwałej natychmiast"], "e": "Proces widać dopiero wtedy, gdy przestaje działać."}, {"t": "c1", "s": "Nęcka, s. 38–39", "q": "Dlaczego model komputerowy przyjmuje się tylko z pewnym prawdopodobieństwem?", "a": ["Podobieństwo wyników na wyjściu nie oznacza podobieństwa sposobu działania", "Komputery popełniają więcej błędów niż ludzie", "Symulacji nie da się porównać z zachowaniem człowieka", "Modele komputerowe nie dają się zaprogramować dokładnie"], "e": "Ten sam efekt można uzyskać na wiele sposobów. Klasyczne badania też dają jednak tylko wiedzę prawdopodobną."}, {"t": "c1", "s": "Nęcka, s. 39", "q": "Według Nęcki PET i fMRI rejestrują odpowiednio:", "a": ["Poziom ukrwienia i poziom zużycia tlenu", "Aktywność bioelektryczną i przepływ krwi", "Zużycie tlenu i aktywność bioelektryczną", "Potencjały wywołane i ukrwienie"], "e": "Uwaga: Maruszewski opisuje PET jako śledzenie metabolizmu związków znakowanych izotopami, a fMRI jako zmiany przepływu krwi."}, {"t": "c1", "s": "Nęcka, s. 39", "q": "Główna wada PET i fMRI według Nęcki to:", "a": ["Słaba rozdzielczość czasowa (sekundy w fMRI, ok. pół minuty w PET)", "Słaba lokalizacja funkcji w mózgu", "Brak możliwości badania osób zdrowych", "Niemożność porównywania osób starszych i młodszych"], "e": "Większość elementarnych procesów trwa poniżej sekundy, np. przeczytanie słowa ok. 500 ms."}, {"t": "c1", "s": "Nęcka, s. 39", "q": "Wspólny mianownik wszystkich metod badania poznania według Nęcki to:", "a": ["Skrupulatna analiza poziomu wykonania zadania", "Rejestracja aktywności mózgu", "Introspekcja badanego", "Losowy przydział do grup"], "e": "W modelowaniu i neuroobrazowaniu dane behawioralne też są niezbędnym elementem procedury."}, {"t": "w1", "s": "Maruszewski, s. 15", "q": "Psychologia poznawcza to dział psychologii zajmujący się:", "a": ["Procesami nabywania, przetwarzania i wykorzystywania informacji", "Wyłącznie świadomymi procesami dostępnymi w introspekcji", "Kształtowaniem nawyków między bodźcem a reakcją", "Wyłącznie procesami spostrzegania i pamięci"], "e": "Abstrakcyjnie: mechanizmami tworzenia wewnętrznych reprezentacji i operacjami na nich."}, {"t": "w1", "s": "Maruszewski, tab. 1.1", "q": "Tworzenie kopii spostrzeżeń pod nieobecność realnego przedmiotu to:", "a": ["Wyobraźnia", "Rozpoznawanie wzorców", "Pamięć krótkotrwała", "Myślenie"], "e": "Rozpoznawanie wzorców to integrowanie cech w całości; myślenie to tworzenie modelu sytuacji do sprawdzania hipotez."}, {"t": "w1", "s": "Maruszewski, s. 16", "q": "Dlaczego w tabeli 1.1 przy języku jest puste pole?", "a": ["Bo język nie jest procesem, lecz narzędziem poznania", "Bo język nie należy do psychologii poznawczej", "Bo nie ma zgody, czy język jest wrodzony", "Bo język bada wyłącznie lingwistyka"], "e": "Język traktuje się raczej jako strukturę odrębną od procesów."}, {"t": "w1", "s": "Maruszewski, s. 17–18", "q": "Szczury, które eksplorowały labirynt bez nagrody, po jej wprowadzeniu wykazały skokowy wzrost szybkości uczenia się. Tolman wyjaśnił to:", "a": ["Uczeniem się utajonym i mapą poznawczą", "Metodą prób i błędów", "Wglądem", "Warunkowaniem klasycznym"], "e": "Wgląd (nagłe rozwiązanie) to Köhler i szympansy."}, {"t": "w1", "s": "Maruszewski, s. 18", "q": "Za umowną datę wyodrębnienia się psychologii poznawczej uznaje się:", "a": ["Konferencję w MIT w 1956 r.", "Założenie laboratorium Wundta w 1879 r.", "Wydanie „Cognitive psychology” Neissera w 1967 r.", "Badania Ebbinghausa z 1885 r."], "e": "Uczestnikami konferencji byli m.in. Chomsky, Simon i Miller."}, {"t": "w1", "s": "Maruszewski, s. 19", "q": "George Miller (1956) uznał za wąskie gardło przetwarzania informacji:", "a": ["Pamięć krótkotrwałą, mieszczącą 7 ± 2 elementy", "Pamięć długotrwałą o ograniczonej pojemności", "Uwagę podzielną", "Szybkość przewodzenia nerwowego"], "e": "Pojemność wyrażał w „kęsach” (porcjach), nie w bitach. Cowan (2001) wskazuje, że jest jeszcze mniejsza."}, {"t": "w1", "s": "Maruszewski, s. 19", "q": "Chomsky w krytyce Skinnera wykazał, że język nie może być wyłącznie wynikiem warunkowania, ponieważ:", "a": ["Człowiek może tworzyć praktycznie nieskończenie wiele poprawnych zdań", "Dzieci uczą się języka wyłącznie od rodziców", "Języki świata nie mają wspólnych reguł", "Gramatyka jest zawsze wyuczona"], "e": "Chomsky zakładał wrodzony mechanizm nabywania języka (LAD) i uniwersalne reguły gramatyczne."}, {"t": "w1", "s": "Maruszewski, s. 20", "q": "Na jakiej heurystyce opierał się General Problem Solver (Newell, Shaw i Simon)?", "a": ["Analizy w kategoriach środków i celów", "Dostępności", "Reprezentatywności", "Prób i błędów"], "e": "Program sprawdzał, czy kolejny krok przybliża do celu."}, {"t": "w1", "s": "Maruszewski, s. 21", "q": "Bruner, Goodnow i Austin (1956) pokazali, że:", "a": ["Złożone procesy myślowe można badać bez introspekcji, a strategie tworzenia pojęć różnią się indywidualnie", "Pojemność pamięci krótkotrwałej wynosi 7 ± 2", "Szczury tworzą mapy poznawcze", "Język jest wrodzony"], "e": "Badani odgadywali pojęcie, o którym myślał badacz; z ich wyborów rekonstruowano strategie."}, {"t": "w1", "s": "Maruszewski, s. 22", "q": "Według Neissera („Multiple systems”) najmniej plastyczne są:", "a": ["Systemy bezpośredniej percepcji", "Systemy rozpoznawania i reprezentacji", "Systemy percepcji intersubiektywnej", "Wszystkie systemy są równie plastyczne"], "e": "Najbardziej plastyczne są systemy rozpoznawania i reprezentacji."}, {"t": "w1", "s": "Maruszewski, s. 24", "q": "Termin „neuronauka poznawcza” wymyślili:", "a": ["Gazzaniga i Miller", "Ellis i Young", "Rumelhart i McClelland", "Edelman i Mountcastle"], "e": "Wymyślili go podczas wspólnej jazdy nowojorską taksówką."}, {"t": "w1", "s": "Maruszewski, ramka 1.2", "q": "Potencjał N400 zmienia się w zależności od tego, czy:", "a": ["Słowo kończące zdanie było oczekiwane, czy zaskakujące", "Bodziec był wzrokowy, czy słuchowy", "Badany był trzeźwy, czy po alkoholu", "Słowo było nazwą koloru"], "e": "To ujemny potencjał pojawiający się ok. 400 ms po bodźcu (Kutas i Hillyard, 1984)."}, {"t": "w1", "s": "Maruszewski, ramka 1.4", "q": "Co zaskoczyło Baddeleya w badaniu płetwonurków po alkoholu?", "a": ["Rozumowanie logiczne nie pogorszyło się istotnie", "Pamięć poprawiła się po alkoholu", "Sprawność motoryczna wzrosła", "Nastrój pijących wyraźnie się poprawił"], "e": "Pogorszyły się pamięć, szybkość przetwarzania semantycznego i motoryka."}, {"t": "w1", "s": "Maruszewski, ramka 1.5", "q": "Według badań Brewera i Sandowa alkohol przede wszystkim:", "a": ["Zaburza wykonywanie zadań podwójnych", "Spowalnia reakcje motoryczne", "Pogarsza widzenie", "Zwiększa brawurę kierowców"], "e": "Pijani kierowcy częściej wykonywali tuż przed wypadkiem dodatkowe czynności. Motoryka odgrywa rolę drugoplanową."}, {"t": "w1", "s": "Maruszewski, ramka 1.6", "q": "Strayer i Johnston (2001) wykazali, że:", "a": ["Zestaw głośnomówiący przeszkadza w prowadzeniu tak samo jak zwykły telefon", "Zestaw głośnomówiący eliminuje zakłócenia", "Słuchanie radia przeszkadza tak samo jak rozmowa", "Rozmowa nie wpływa na czas reakcji"], "e": "Przeszkadza mówienie, które angażuje więcej zasobów uwagi niż słuchanie."}, {"t": "w1", "s": "Maruszewski, s. 34", "q": "Termin „imperializm poznawczy” ukuł:", "a": ["Robert Zajonc", "Richard Lazarus", "Ulric Neisser", "Thomas Kuhn"], "e": "Zajonc w sporze z Lazarusem bronił prymatu emocji."}, {"t": "w1", "s": "Maruszewski, s. 35", "q": "Według Maruszewskiego obecny stan psychologii poznawczej to raczej:", "a": ["Zbiór mikroparadygmatów", "Jeden spójny paradygmat w sensie Kuhna", "Dziedzina po zakończonej rewolucji poznawczej", "Gałąź behawioryzmu"], "e": "Psychologia poznawcza „nie znalazła swojego Newtona” (Nowakowska, 1980)."}, {"t": "w1", "s": "Maruszewski, s. 37–38", "q": "Które stwierdzenie NIE należy do założeń Reynoldsa i Flagga (1983)?", "a": ["Procesy poznawcze są biernym odzwierciedleniem rzeczywistości", "Umysł ma ograniczoną pojemność", "System poznawczy jest wielopoziomowy", "Przetwarzanie zależy od kontekstu"], "e": "Założenie 8 mówi, że procesy poznawcze są aktywne, a nie są rodzajem odzwierciedlenia."}, {"t": "w1", "s": "Maruszewski, s. 39–40", "q": "Która z cech poznania społecznego (Fiske i Taylor) opisuje sytuację, w której nasza nieufność wzbudza nieufność drugiej osoby?", "a": ["Zasada wzajemności", "Autoprezentacja", "Schematyzacja", "Kontrola otoczenia"], "e": "Nasz sposób poznawania innych zmienia ich zachowanie."}, {"t": "w1", "s": "Maruszewski, ramka 1.2", "q": "Tulving rozróżnił pamięć:", "a": ["Epizodyczną i semantyczną", "Krótkotrwałą i długotrwałą", "Jawną i utajoną", "Ikoniczną i echoiczną"], "e": "Neuroobrazowanie potwierdziło odmienny przepływ krwi w różnych okolicach mózgu dla obu typów zadań."}, {"t": "w2", "s": "Maruszewski, s. 45", "q": "Obraz siatkówkowy (odwrócony i pomniejszony) to przykład:", "a": ["Bodźca proksymalnego", "Bodźca dystalnego", "Spostrzeżenia", "Schematu"], "e": "Bodziec dystalny działa z odległości, a proksymalny powstaje w kontakcie z narządem zmysłu."}, {"t": "w2", "s": "Maruszewski, s. 47", "q": "Stałość spostrzegania polega na tym, że:", "a": ["Spostrzeżenie zmienia się mniej niż bodziec proksymalny", "Bodziec proksymalny zawsze odpowiada dystalnemu", "Wrażenia nie zależą od kontekstu", "Spostrzeżenie nie zależy od doświadczenia"], "e": "Przykłady: otwierane drzwi widzimy jako prostokąt, choć na siatkówce powstaje trapez."}, {"t": "w2", "s": "Maruszewski, s. 48", "q": "Jak można wyjaśnić stałość jasności bez odwoływania się do wiedzy?", "a": ["Układ wzrokowy reaguje na stosunki jasności, a nie na jasność bezwzględną", "Oko mierzy ilość odbitego światła", "Barwa oświetlenia rejestrowana jest w widzeniu centralnym", "Soczewka zmienia krzywiznę"], "e": "Węgiel w słońcu jest ciemniejszy od otoczenia, a kartka w piwnicy jaśniejsza."}, {"t": "w2", "s": "Maruszewski, s. 50–52", "q": "Prawidłowa kolejność faz spostrzegania to:", "a": ["Rejestracja sensoryczna → ocena emocjonalna → rozpoznanie treści → znaczenie metaforyczne", "Rozpoznanie treści → ocena emocjonalna → rejestracja sensoryczna → znaczenie metaforyczne", "Rejestracja sensoryczna → rozpoznanie treści → ocena emocjonalna → znaczenie metaforyczne", "Ocena emocjonalna → rejestracja sensoryczna → znaczenie metaforyczne → rozpoznanie treści"], "e": "Ocena emocjonalna poprzedza rozpoznanie treści — dlatego możliwa jest obronność percepcyjna."}, {"t": "w2", "s": "Maruszewski, s. 51", "q": "Pacjent po komisurotomii nie potrafił odczytać słów eksponowanych prawej półkuli, ale potrafił:", "a": ["Określić, czy były pozytywne, czy negatywne", "Je przepisać", "Podać ich liczbę liter", "Je powtórzyć"], "e": "To dowód, że faza oceny emocjonalnej jest niezależna od rozpoznania treści (LeDoux, 2000)."}, {"t": "w2", "s": "Maruszewski, s. 52", "q": "W badaniu Saula Sternberga (1969) każdy dodatkowy element zbioru wydłużał decyzję o ok.:", "a": ["38 ms", "80 ms", "400 ms", "2 s"], "e": "Efekt wielkości zbioru. 80 ms to różnica kod fizyczny–nominalny u Posnera, a 400 ms to N400."}, {"t": "w2", "s": "Maruszewski, tab. 2.1", "q": "Który pogląd należy do psychologii postaci?", "a": ["W polu percepcyjnym jest figura i tło", "Wrażenia są pierwotne, spostrzeżenia wtórne", "Elementy łączą się według praw kojarzenia", "Wszystkie części pola percepcyjnego są jednakowo ważne"], "e": "Pozostałe trzy to założenia asocjacjonizmu (atomizmu)."}, {"t": "w2", "s": "Maruszewski, s. 58", "q": "Która cecha figury według Rubina jest prawdziwa?", "a": ["Figura wydaje się wysunięta ku przodowi, a tło z tyłu", "Figura jest bezkształtna", "Tło łatwiej się zapamiętuje", "Tło wydaje się jaśniejsze od figury"], "e": "Figura ma kształt, charakter rzeczy, łatwiej się ją zapamiętuje i wydaje się jaśniejsza."}, {"t": "w2", "s": "Maruszewski, s. 56–57", "q": "Które z poniższych Wertheimer uznawał za czynnik drugoplanowy?", "a": ["Uprzednie doświadczenie", "Bliskość przestrzenną", "Podobieństwo", "Wspólną drogę"], "e": "Zasady Wertheimera mają charakter wrodzony; dlatego używał abstrakcyjnych układów kropek."}, {"t": "w2", "s": "Maruszewski, s. 59", "q": "Za błąd psychologii postaci uznaje się:", "a": ["Izomorfizm — przekonanie, że w mózgu powstają obrazy o kształcie przedmiotów", "Rozróżnienie figury i tła", "Zasady Wertheimera", "Badanie figur wieloznacznych"], "e": "Przy spostrzeganiu koła pobudzenie w mózgu nie ma kształtu koła."}, {"t": "w2", "s": "Maruszewski, s. 59–60", "q": "W której fazie spostrzegania „triumfuje atomizm”?", "a": ["Rejestracji sensorycznej", "Oceny emocjonalnej", "Oceny znaczenia metaforycznego", "W żadnej"], "e": "W ocenie emocjonalnej wygrywa całość, a w ocenie semantycznej są elementy obu podejść."}, {"t": "w2", "s": "Maruszewski, s. 60", "q": "Co było warunkiem koniecznym reakcji detektorów owadów u żaby?", "a": ["Ruch obiektu", "Barwa obiektu", "Zapach obiektu", "Duży rozmiar obiektu"], "e": "Martwe owady nie interesowały żaby, dopóki ich sztucznie nie poruszono (Lettvin i in., 1959)."}, {"t": "w2", "s": "Maruszewski, s. 62", "q": "Carey (1981) wykazała preferencję bodźców przypominających twarz u noworodków już:", "a": ["9 minut po urodzeniu", "9 dni po urodzeniu", "w 10. miesiącu życia", "po roku"], "e": "Przy losowym rozmieszczeniu tych samych elementów preferencji nie było."}, {"t": "w2", "s": "Maruszewski, s. 64", "q": "W badaniu Posnera i Keele’a prototypy, których badani nigdy nie widzieli, klasyfikowano poprawnie w ok.:", "a": ["85%", "67%", "50%", "98%"], "e": "Bodźce stare: 87%, nowe: 67%, prototypy: 85%. Badani stworzyli sumaryczną reprezentację kategorii."}, {"t": "w2", "s": "Maruszewski, ramka 2.1", "q": "Przy równoczesnej ekspozycji dwóch liter (Posner i in., 1969) najszybciej ocenia się identyczność:", "a": ["Fizyczną (np. AA)", "Nominalną (np. Aa)", "Opartą na regule (np. obie samogłoski)", "Wszystkie równie szybko"], "e": "Przy ekspozycji sekwencyjnej (co najmniej 2 s) przewaga się odwraca, bo pierwsza litera zostaje przekodowana werbalnie."}, {"t": "w2", "s": "Maruszewski, s. 68", "q": "Który czynnik gotowości percepcyjnej jest wewnętrzny?", "a": ["Monopol kategorii", "Częstość uprzednich doświadczeń", "Konsekwencje społeczne", "Torowanie"], "e": "Wewnętrzne: monopol, integracja poznawcza, konsekwencje motywacyjne."}, {"t": "w2", "s": "Maruszewski, s. 70", "q": "Lazarus i McCleary (1951) wykazali zjawisko:", "a": ["Subcepcji — różnicowania bodźców na poziomie reakcji autonomicznych bez udziału świadomości", "Obronności percepcyjnej przy słowach wulgarnych", "Efektu wielkości zbioru", "Uczenia się utajonego"], "e": "Sylaby wcześniej łączone z prądem wywoływały silniejsze pobudzenie, choć trafność zgadywania była taka sama."}, {"t": "w2", "s": "Maruszewski, s. 72", "q": "Badanie Yarbusa (1967) pokazało, że:", "a": ["Trajektoria ruchów oczu zależy od pytania postawionego obserwatorowi", "Ruchy oczu są zawsze takie same", "Spostrzeganie jest wyłącznie oddolne", "Obraz siatkówkowy jest odwrócony"], "e": "To ilustracja cyklu percepcyjnego Neissera: schemat kieruje eksploracją."}, {"t": "w2", "s": "Maruszewski, s. 79", "q": "Afordancje według Gibsona to:", "a": ["Akty lub zachowania, które umożliwiają obiekty, miejsca lub zdarzenia", "Stałe układy cech w zmiennych warunkach", "Schematy pamięciowe kierujące eksploracją", "Detektory cech w siatkówce"], "e": "Stałe układy cech to niezmienniki (inwarianty)."}, {"t": "w2", "s": "Maruszewski, s. 81–82", "q": "Emocje wtórne według Damasio wymagają:", "a": ["Aktywizacji kory przedczołowej, która generuje wyobrażenia", "Wyłącznie wrodzonej reakcji na bodziec", "Braku jakiegokolwiek doświadczenia", "Działania wyłącznie interoreceptorów"], "e": "Emocje pierwotne są wrodzone i automatyczne, spostrzegane głównie dzięki aferentacji wstecznej."}, {"t": "w3", "s": "Maruszewski, s. 88", "q": "Która z podanych NIE jest jedną z czterech funkcji uwagi według Maruszewskiego?", "a": ["Długotrwałe przechowywanie informacji", "Selekcjonowanie bodźców", "Ukierunkowanie procesów poznawczych", "Podtrzymywanie zaangażowania poznawczego"], "e": "Cztery funkcje: selekcja, ukierunkowanie, określanie wielkości zasobów, podtrzymywanie zaangażowania."}, {"t": "w3", "s": "Maruszewski, s. 88", "q": "Kto zdefiniował uwagę jako „obejmowanie w posiadanie przez umysł w jasnej i żywej postaci jednego z wielu możliwych obiektów”?", "a": ["William James", "Nęcka, Orzechowski i Szymura", "Daniel Kahneman", "Donald Broadbent"], "e": "Nęcka i in. (2006): uwaga to system odpowiedzialny za selekcję informacji i zapobieganie przeładowaniu."}, {"t": "w3", "s": "Maruszewski, s. 89", "q": "Ile fotoreceptorów i ile włókien nerwu wzrokowego ma ludzkie oko?", "a": ["Ok. 126 mln fotoreceptorów i ok. 1 mln włókien", "Ok. 1 mln fotoreceptorów i ok. 126 mln włókien", "Ok. 130 tys. fotoreceptorów i ok. 1 mln włókien", "Tyle samo fotoreceptorów co włókien"], "e": "To dowód selekcji już w samym narządzie zmysłu. 130 tys. to komórki dołka centralnego z bezpośrednią reprezentacją w korze."}, {"t": "w3", "s": "Maruszewski, s. 90", "q": "Co wykazał pamiętnik Wagenaara o zdarzeniach bardzo nieprzyjemnych?", "a": ["Początkowo pamiętał je gorzej, ale przez pierwsze 3 lata pamięć o nich się poprawiała", "Pamiętał je zawsze najlepiej", "Zapomniał je w ciągu tygodnia", "Pamiętał je tak samo jak neutralne"], "e": "Wyjaśnienie: bardzo wolne kodowanie zdarzeń nadzwyczaj nieprzyjemnych."}, {"t": "w3", "s": "Maruszewski, s. 91", "q": "Uwaga intensywna według Kolańczyk:", "a": ["Ma wąski zakres, ale pozwala na głębokie przetwarzanie", "Ma szeroki zakres i płytkie przetwarzanie", "Sprzyja twórczości w połączeniu z motywacją parateliczną", "Działa wyłącznie na peryferiach pola uwagi"], "e": "Ekstensywna ma szeroki zakres i płytkie przetwarzanie; z motywacją parateliczną może stymulować twórczość."}, {"t": "w3", "s": "Maruszewski, ramka 3.1", "q": "Mrugnięcie uwagi to niezdolność do wykrycia sondy, gdy pojawia się ona:", "a": ["Od 2. do 6. pozycji po literze-celu (ok. 100–450 ms)", "Natychmiast po literze-celu", "Przed literą-celem", "Po więcej niż 2 sekundach"], "e": "Sonda tuż po celu jest wykrywana bez trudu — brak wrażliwości pojawia się z opóźnieniem, jak refrakcja."}, {"t": "w3", "s": "Maruszewski, s. 94", "q": "W koncepcji Sokołowa odruch orientacyjny uruchamia się, gdy:", "a": ["Mechanizm modelujący z komparatorem wykryje niezgodność bodźca z wiedzą", "Bodziec jest nieprzyjemny", "Bodziec powtarza się wielokrotnie", "Pobudzenie jest rozlane"], "e": "Wtedy włącza się mechanizm wzmacniający. Reakcja orientacyjna jest przeciwstawiana reakcji obronnej."}, {"t": "w3", "s": "Maruszewski, s. 94", "q": "Według Laceya pobieraniu informacji z otoczenia (np. w zadaniach percepcyjnych) towarzyszy:", "a": ["Zwolnienie akcji serca", "Przyspieszenie akcji serca", "Wzrost ciśnienia", "Brak zmian fizjologicznych"], "e": "Przyspieszenie akcji serca towarzyszy odrzucaniu stymulacji zewnętrznej i skupieniu na bodźcach wewnętrznych."}, {"t": "w3", "s": "Maruszewski, s. 94–95", "q": "Zjawisko, w którym pobudzenie jednej okolicy kory hamuje okolice sąsiednie, to:", "a": ["Indukcja ujemna (Pawłow)", "Dominanta (Uchtomski)", "Generalizacja", "Habituacja"], "e": "Dominanta Uchtomskiego to skupienie na jednej reakcji przy zahamowaniu alternatywnych — mechanizm bardzo podobny, ale inna nazwa."}, {"t": "w3", "s": "Maruszewski, s. 95", "q": "W trójkącie aktywności uwagowej LaBerge’a mechanizm wzmacniania to:", "a": ["Neurony wzgórza", "Sieci w korze czołowej", "Przednie i tylne części kory", "Zwoje podstawy"], "e": "Kontrola to kora czołowa, ekspresja to przednie i tylne części kory."}, {"t": "w3", "s": "Maruszewski, s. 97", "q": "W badaniu Mackwortha po pół godzinie badani pomijali ok. 25% sygnałów. Główna przyczyna to:", "a": ["Wzrost wątpliwości co do własnych obserwacji", "Spadek wrażliwości wzroku", "Zbyt mała liczba sygnałów", "Brak motywacji finansowej"], "e": "Ilustracja tego, że błędy w detekcji mogą wynikać z kryterium decyzji, a nie z wrażliwości."}, {"t": "w3", "s": "Maruszewski, s. 97", "q": "Koelega i in. (1989) stwierdzili, że spadek czujności występuje tylko wtedy, gdy:", "a": ["Trzeba reagować na percepcyjne właściwości bodźców (jasność, szybkość ruchu)", "Zadanie wymaga kategoryzacji bodźców", "Bodźce pojawiają się rzadziej niż 24 na minutę", "Badany jest wypoczęty"], "e": "Spadku nie było w zadaniach „poznawczych” — np. pomijać cyfry, reagować na litery."}, {"t": "w3", "s": "Maruszewski, tab. 3.1", "q": "Operator radaru ogłasza alarm, choć samolotu wroga nie ma. To:", "a": ["Fałszywy alarm", "Pominięcie", "Prawidłowe odrzucenie", "Prawidłowa detekcja"], "e": "Pominięcie to brak reakcji, gdy samolot jest."}, {"t": "w3", "s": "Maruszewski, s. 98", "q": "Częstość fałszywych alarmów wynosi 0,2. Jaka jest częstość prawidłowych odrzuceń?", "a": ["0,8", "0,2", "0,7", "0,3"], "e": "Prawidłowe odrzucenia = 1 − częstość fałszywych alarmów."}, {"t": "w3", "s": "Maruszewski, s. 99", "q": "„Macierz wypłat” w teorii detekcji sygnałów to:", "a": ["Czynniki wpływające na motywacyjne konsekwencje decyzji", "Stosunek siły sygnału do siły szumu", "Oczekiwania co do częstości sygnału", "Krzywa charakterystyki obserwatora"], "e": "Przy czerniaku przeoczenie jest tak groźne, że lekarz akceptuje więcej fałszywych alarmów."}, {"t": "w3", "s": "Maruszewski, s. 101", "q": "Przeszukiwanie oparte na koniunkcji cech:", "a": ["Przebiega sekwencyjnie i wykazuje efekt wielkości zbioru", "Przebiega równolegle i automatycznie", "Nie zależy od liczby dystraktorów", "Jest zawsze łatwiejsze niż szukanie jednej cechy"], "e": "Równolegle, bez efektu wielkości zbioru, przebiega przeszukiwanie oparte na regułach dysjunkcyjnych („lub”)."}, {"t": "w3", "s": "Maruszewski, s. 101", "q": "Nakayama (1990) wykazał, że:", "a": ["Niektóre cechy łączymy łatwiej niż inne, np. barwę z wielkością", "Każda dodatkowa cecha zawsze wydłuża szukanie", "Ruch zawsze ułatwia szukanie", "Uwaga nie działa jak „klej”"], "e": "To słabość koncepcji Treisman, która zakładała, że łączenie dowolnych cech jest równie trudne."}, {"t": "w3", "s": "Maruszewski, s. 102–103", "q": "Filtr Broadbenta:", "a": ["Działa na zasadzie „wszystko albo nic” i uwzględnia tylko cechy fizyczne", "Selekcjonuje według znaczenia i priorytetów", "Osłabia komunikat nieśledzony, ale go nie blokuje", "Działa dopiero po analizie semantycznej"], "e": "Filtr według znaczenia i priorytetów to model Treisman."}, {"t": "w3", "s": "Maruszewski, s. 103", "q": "Ile czasu według badań z techniką cieniowania przechowywane są informacje, na które nie zwracamy uwagi?", "a": ["Ok. 20 sekund", "Ok. 2 sekund", "Ok. 2 minut", "Nie są przechowywane wcale"], "e": "Badani powtarzali tylko słowa z ucha nieśledzonego z ostatnich 20 sekund."}, {"t": "w3", "s": "Maruszewski, s. 103", "q": "Technikę cieniowania (słuchania dwuusznego) opracował:", "a": ["Colin Cherry (1953)", "Donald Broadbent (1958)", "Anne Treisman (1960)", "Neville Moray (1959)"], "e": "Moray ją zmodyfikował. Broadbent oparł na niej teorię filtra."}, {"t": "w3", "s": "Maruszewski, s. 104", "q": "Badani słyszeli „Dear Aunt Jane”, choć słowa docierały do różnych uszu. To badanie:", "a": ["Graya i Wedderburna", "Neissera i Becklena", "Johnstona i Heinza", "Corteena i Wooda"], "e": "Wynik pokazuje selekcję według znaczenia, a nie kierunku dźwięku."}, {"t": "w3", "s": "Maruszewski, s. 105–106", "q": "W modelu Treisman bodziec mało ważny dla priorytetów stałych i bieżących zostaje:", "a": ["Zignorowany", "Poddany pełnej analizie znaczenia", "Natychmiast przekazany do reakcji", "Zapamiętany w pamięci trwałej"], "e": "Pełną analizę znaczenia przechodzą bodźce ważne dla priorytetów bieżących."}, {"t": "w3", "s": "Maruszewski, s. 108", "q": "Neisser i Becklen (1975) użyli dwóch nałożonych nagrań. Badani śledzący jedno nagranie:", "a": ["Radzili sobie prawie tak dobrze jak przy jednym nagraniu, już w pierwszej próbie", "Popełniali ponad 50% błędów", "Uczyli się zadania dopiero po tygodniach", "Radzili sobie dobrze, śledząc oba nagrania naraz"], "e": "Śledzenie obu gier naraz znacznie pogarszało wynik. Nagrania różniły się wewnętrzną strukturą, nie modalnością."}, {"t": "w3", "s": "Maruszewski, s. 109", "q": "Który czynnik NIE wpływa według Kahnemana na politykę alokacji zasobów?", "a": ["Stosunek sygnału do szumu", "Trwałe dyspozycje", "Chwilowe intencje", "Ocena zapotrzebowania na zasoby"], "e": "Stosunek sygnału do szumu to czynnik z teorii detekcji sygnałów."}, {"t": "w3", "s": "Maruszewski, s. 110", "q": "Spelke, Hirst i Neisser (1976) wykazali, że po 6 tygodniach ćwiczeń badani:", "a": ["Pisali dyktando bez błędów i czytali ze zrozumieniem jednocześnie", "Nadal nie potrafili łączyć dwóch zadań", "Czytali szybciej, ale pisali z błędami", "Zapominali przeczytany tekst"], "e": "Ćwiczenie zmniejsza zapotrzebowanie na zasoby i znosi interferencję zadań."}, {"t": "w3", "s": "Maruszewski, s. 110–111", "q": "Dlaczego autor mógł dobrze zrozumieć dziennik radiowy przy pierwszym w życiu prasowaniu koszuli?", "a": ["Bo zadania angażowały różne modalności (teoria Gophera i Navona)", "Bo prasowanie było zautomatyzowane", "Bo dysponował jedną dużą pulą zasobów", "Bo słuchanie radia nie wymaga uwagi"], "e": "Prasowanie korzysta z zasobów wzrokowych i dotykowych, słuchanie — ze słuchowych."}, {"t": "w3", "s": "Maruszewski, ramka 3.2", "q": "Który proces kontroli myśli według Wegnera angażuje zasoby uwagowe?", "a": ["Wykonawczy — poszukujący treści zgodnych z zamiarem", "Monitorujący — poszukujący treści niezgodnych", "Oba w równym stopniu", "Żaden"], "e": "Przy niedoborze zasobów zawodzi proces wykonawczy, a monitorujący i tak znajduje niechciane myśli — efekt rykoszetu."}, {"t": "w3", "s": "Maruszewski, ramka 3.2", "q": "Co zmniejszyło częstość myśli o białych niedźwiedziach (Wegner i in., 1987)?", "a": ["Myślenie o czerwonym volkswagenie zawsze, gdy pojawi się niedźwiedź", "Mocniejsze tłumienie myśli", "Głośne relacjonowanie myśli", "Wydłużenie czasu do 10 minut"], "e": "To „autodystrakcja” — dlatego muzyka przy pracy może chronić przed myślami intruzywnymi."}, {"t": "w3", "s": "Maruszewski, s. 113", "q": "Barlow (1988) traktuje zjawiska intruzywne jako:", "a": ["Prymitywny system alarmowy, w którym lepszy jest fałszywy alarm niż pominięcie", "Przypadkowe mutacje bez funkcji", "Wyłącznie objaw zaburzenia", "Efekt przeuczenia"], "e": "Porównanie do mutacji genów to Tallis (1999)."}, {"t": "w3", "s": "Maruszewski, tab. 3.3", "q": "Która cecha dotyczy procesów automatycznych?", "a": ["Przebiegają równolegle", "Angażują świadomość", "Mają duże zapotrzebowanie na zasoby", "Dotyczą zadań nowych i trudnych"], "e": "Pozostałe trzy to cechy procesów kontrolowanych."}, {"t": "w3", "s": "Maruszewski, s. 116", "q": "Corteen i Wood (1972) zaobserwowali reakcję skórno-galwaniczną na nazwy miast w uchu nieśledzonym. Dowodzi to, że:", "a": ["Komunikaty nieuświadomione podlegają także analizie znaczenia", "Uwaga działa wyłącznie na cechach fizycznych", "Warunkowanie nie działa przy słuchaniu dwuusznym", "Badani świadomie słyszeli nazwy miast"], "e": "Reakcja pojawiała się też przy nazwach miast niewzmacnianych — to generalizacja semantyczna."}, {"t": "w3", "s": "Maruszewski, s. 116", "q": "Która NIE należy do czterech właściwości procesów automatycznych według Nęcki (2002)?", "a": ["Sekwencyjność", "Nieodwołalność", "Balistyczny charakter", "Bezwysiłkowość"], "e": "Czwarta to nieświadomość. Wszystkie są stopniowalne, a procesy automatyczne przebiegają raczej równolegle."}, {"t": "w3", "s": "Maruszewski, s. 117", "q": "Według teorii egzemplarzy Logana automatyzacja polega na:", "a": ["Wiązaniu modułów czynności ze specyficznymi bodźcami w kontekście, dzięki czemu automatyzmy mogą być elastyczne", "Stopniowym integrowaniu coraz większych procedur, jak przy nauce pisania", "Tłumieniu myśli intruzywnych", "Przenoszeniu informacji z pamięci operacyjnej do sensorycznej"], "e": "Integrowanie procedur to koncepcja Andersona oraz LaBerge’a i Samuelsa."}, {"t": "w3", "s": "Maruszewski, tab. 3.4", "q": "Ktoś odpowiada „Proszę wejść!”, gdy dzwoni telefon. To błąd:", "a": ["Asocjacyjny", "Ześlizg", "Perseweracja", "Ominięcie"], "e": "Silne skojarzenie wyzwala niewłaściwą czynność rutynową."}, {"t": "w3", "s": "Maruszewski, ramka 3.3", "q": "W badaniu Besnera i in. interferencja Stroopa była mniejsza, gdy:", "a": ["W słowie kolorowa była tylko jedna litera", "Całe słowo było kolorowe", "Słowo było wydrukowane na czarno", "Badani czytali słowa na głos"], "e": "To podważa klasyczną interpretację, że całe słowa są czytane automatycznie."}, {"t": "w3", "s": "Maruszewski, s. 122", "q": "Mathews i Sebastian (1993): u osób z lękiem przed wężami w obecności żywego węża interferencja w emocjonalnym teście Stroopa:", "a": ["Zniknęła", "Wyraźnie wzrosła", "Pozostała bez zmian", "Dotyczyła tylko słów neutralnych"], "e": "Realne zagrożenie liczy się w zachowaniu bardziej niż konflikt poznawczy."}, {"t": "w3", "s": "Maruszewski, s. 126", "q": "Czym bezrefleksyjność różni się od przetwarzania automatycznego?", "a": ["Bezrefleksyjność może wynikać z jednorazowej ekspozycji, a automatyzm — zwykle z przeuczenia", "Bezrefleksyjność zawsze oszczędza wysiłek", "Automatyzmy pojawiają się po jednym kontakcie z informacją", "Niczym — to synonimy"], "e": "Bezrefleksyjność nie oszczędza wysiłku tak jak automatyzmy: niepowodzenia i nuda pochłaniają energię."}, {"t": "w3", "s": "Maruszewski, ramka 3.5", "q": "W eksperymencie z kserokopiarką przy prośbie o skopiowanie 5 stron:", "a": ["Uzasadnienie tautologiczne działało prawie tak samo jak rzeczywiste", "Uzasadnienie rzeczywiste działało znacznie lepiej", "Prośba bez uzasadnienia była najskuteczniejsza", "Nikt nie wpuszczał do kolejki"], "e": "To przetwarzanie balistyczne, oparte na skrypcie. Przy 20 stronach ludzie zaczynali brać pod uwagę jakość uzasadnienia."}, {"t": "w3", "s": "Maruszewski, ramka 3.4", "q": "W eksperymencie Chanowitza i Langer wyraźne pogorszenie wyniku wystąpiło w grupie, która:", "a": ["Usłyszała, że zaburzenie jest rzadkie (10%), i nie była zachęcana do myślenia", "Usłyszała, że zaburzenie jest częste (80%)", "Była zachęcana do myślenia o zaburzeniu", "Była grupą kontrolną"], "e": "Tam zadziałało bezrefleksyjne przetwarzanie informacji."}, {"t": "w3", "s": "Maruszewski, s. 126", "q": "Doliński wiąże bezrefleksyjność z:", "a": ["Huśtawką emocjonalną i stanem „między programami”", "Przeuczeniem czynności", "Medytacją uważności", "Wysoką motywacją osobistą"], "e": "Nagłe ustanie źródła emocji sprawia, że dowolny bodziec może uruchomić bezrefleksyjne zachowanie."}, {"t": "w3", "s": "Maruszewski, s. 128", "q": "Ericsson i Simon (1980) wykazali, że:", "a": ["Uświadamianie sobie własnych procesów psychicznych może zmieniać ich przebieg", "Introspekcja jest bezpośrednim wglądem w psychikę", "Świadomość selekcjonuje bodźce", "Uwaga jest izolowaną funkcją"], "e": "Na przykład uświadomiona emocja słabnie albo przekształca się w inną."}, {"t": "w3", "s": "Maruszewski, s. 130", "q": "W teatrze umysłu Baarsa operator światła to:", "a": ["Proces sterowania uwagą", "Proces sterowania wrażeniem", "Pamięć operacyjna", "Systemy eksperckie"], "e": "Reżyser to procesy sterowania wrażeniem, a systemy eksperckie to „widownia”."}, {"t": "w3", "s": "Maruszewski, s. 131", "q": "Kto krytykował koncepcję Baarsa jako powrót do kartezjańskiego teatru umysłu?", "a": ["Daniel Dennett", "Ellen Langer", "Alina Kolańczyk", "Edward Nęcka"], "e": "U Kartezjusza informacje zbiegały się w szyszynce, jak na scenie u Baarsa."}, {"t": "w4", "s": "Maruszewski, s. 135", "q": "Jakimi dwiema metaforami Maruszewski opisuje pamięć?", "a": ["Encyklopedii i filmu", "Taśmy magnetofonowej i twardego dysku", "Magazynu i zwrotnicy", "Teatru i sceny"], "e": "Pamięć nie jest taśmą ani twardym dyskiem — te metafory nie wyjaśniają, co zapisujemy i co blokuje dostęp."}, {"t": "w4", "s": "Maruszewski, tab. 4.1", "q": "Które stwierdzenie dotyczy pamięci jako procesu, a nie jako zdolności?", "a": ["Składa się z uniwersalnych faz identycznych u wszystkich ludzi", "Jest w dużym stopniu zdeterminowana genetycznie", "Jest składnikiem inteligencji", "Wykazuje duże zróżnicowanie indywidualne"], "e": "Pozostałe opisują pamięć jako zdolność."}, {"t": "w4", "s": "Maruszewski, s. 137", "q": "Dlaczego Maruszewski woli termin „odtwarzanie” niż „wydobywanie”?", "a": ["Bo informacje z pamięci są przynajmniej częściowo tworzone na nowo", "Bo wydobywanie dotyczy tylko pamięci sensorycznej", "Bo odtwarzanie jest zawsze świadome", "Bo wydobywanie jest terminem behawiorystycznym"], "e": "„Wydobycie” sugeruje, że informacja się nie zmienia."}, {"t": "w4", "s": "Maruszewski, s. 141", "q": "Wzór t = k·l² opisuje:", "a": ["Prawo Foucault — czas opanowania jednego elementu rośnie z kwadratem długości szeregu", "Prawo częstości", "Pojemność pamięci krótkotrwałej w bitach", "Szybkość przenoszenia informacji do pamięci trwałej"], "e": "Prawo dotyczy szeregów elementów, nie zorganizowanego materiału."}, {"t": "w4", "s": "Maruszewski, s. 141", "q": "Duży cykl pamięciowy to sytuacja, w której:", "a": ["Zachowanie ujawniające zawartość pamięci staje się przedmiotem spostrzegania i ponownego kodowania", "Jednostka wielokrotnie odbiera informacje powiązane z wiedzą", "Informacja trafia z pamięci sensorycznej do krótkotrwałej", "Ślad pamięciowy ulega rekonsolidacji"], "e": "Opis drugiej odpowiedzi to mały cykl."}, {"t": "w4", "s": "Maruszewski, s. 141", "q": "Dlaczego dobrzy nauczyciele unikają podchwytliwych pytań?", "a": ["Bo błędne odpowiedzi również mogą się utrwalać", "Bo uruchamiają efekt świeżości", "Bo hamują pamięć proceduralną", "Bo zwiększają pojemność pamięci krótkotrwałej"], "e": "Duży cykl utrwala każdy materiał, także błędny."}, {"t": "w4", "s": "Maruszewski, ramka 4.2", "q": "Co sprawiało Szereszewskiemu kłopot?", "a": ["Zapamiętywanie i rozumienie słów abstrakcyjnych oraz spontaniczne zapominanie", "Zapamiętywanie długich ciągów liczb", "Odtwarzanie materiału po wielu latach", "Tworzenie obrazów zmysłowych"], "e": "Synestezja pomagała mu zapamiętywać, ale przeszkadzała w rozumieniu i zapominaniu."}, {"t": "w4", "s": "Maruszewski, ramka 4.3", "q": "W badaniu Sperlinga bodźcem wskaźnikowym był:", "a": ["Ton o różnej wysokości wskazujący wiersz", "Znacznik nad literą", "Czarne kółko w miejscu litery", "Kolor liter"], "e": "Znacznik nad literą stosowali Averbach i Coriell."}, {"t": "w4", "s": "Maruszewski, ramka 4.3", "q": "Jak długo według Sperlinga pamięć ikoniczna przechowuje informację?", "a": ["Nie dłużej niż ok. 500 ms", "Ok. 20 sekund", "Ok. 5,4 sekundy", "Ok. 2 sekund"], "e": "Do 20 s może sięgać pamięć echoiczna (Watkins i Watkins)."}, {"t": "w4", "s": "Maruszewski, s. 147", "q": "Termin „pamięć echoiczna” wprowadził:", "a": ["Neisser", "Sperling", "Broadbent", "Crowder"], "e": "Crowder ustalił, że ma ona nieco większą pojemność niż ikoniczna."}, {"t": "w4", "s": "Maruszewski, ramka 4.5", "q": "Maskowanie wsteczne polega na tym, że:", "a": ["Bodziec późniejszy hamuje odtworzenie bodźca wcześniejszego", "Bodziec wcześniejszy ułatwia rozpoznanie późniejszego", "Wcześniejszy materiał utrudnia zapamiętanie nowego", "Pamięć sensoryczna zanika od początku ekspozycji"], "e": "Druga odpowiedź to torowanie, trzecia — hamowanie proaktywne, czwarta — wynik Di Lollo."}, {"t": "w4", "s": "Maruszewski, s. 149", "q": "Di Lollo (1980) wykazał, że obraz ikoniczny:", "a": ["Zaczyna zanikać już w momencie pojawienia się bodźca", "Zaczyna zanikać po zniknięciu bodźca", "Utrzymuje się ok. 20 sekund", "Nie zależy od czasu ekspozycji"], "e": "Im dłuższa ekspozycja pierwszego zbioru kropek, tym więcej błędów."}, {"t": "w4", "s": "Maruszewski, s. 151", "q": "Które grupowanie cyfr jest według Wicklegrena (1964) najbardziej efektywne?", "a": ["Po trzy elementy", "Po dwa elementy", "Po cztery elementy", "Pojedyncze cyfry"], "e": "Stąd zalecenie dzielenia numerów telefonów na trójki."}, {"t": "w4", "s": "Maruszewski, s. 152", "q": "Lehrl i Fischer oszacowali pojemność pamięci krótkotrwałej na:", "a": ["80 bitów", "7 ± 2 bity", "18 elementów", "4 elementy"], "e": "80 bitów to 16 liter alfabetu po 5 bitów (log₂32 = 5)."}, {"t": "w4", "s": "Maruszewski, s. 152", "q": "Co wykazał Conrad (1964)?", "a": ["Pomyłki w STM dotyczą liter podobnie brzmiących, nie wyglądających — kodowanie jest akustyczne", "Pojemność STM wynosi 7 ± 2", "STM koduje wyłącznie znaczenie", "Zapominanie w STM wynika tylko z zanikania"], "e": "Litera P była mylona z T, a nie z R."}, {"t": "w4", "s": "Maruszewski, ramka 4.7", "q": "Co zrobili Petersonowie, aby zapobiec powtórkom w pamięci krótkotrwałej?", "a": ["Kazali odliczać wstecz trójkami lub czwórkami od liczby trzycyfrowej", "Pokazywali materiał podprogowo", "Stosowali słuchanie dwuuszne", "Zakazali badanym mówienia"], "e": "Ta technika wprowadza jednak hamowanie retroaktywne."}, {"t": "w4", "s": "Maruszewski, ryc. 4.7", "q": "Które informacje Murdock zapominał najwolniej w paradygmacie Browna–Petersonów?", "a": ["Jedno słowo", "Trzy słowa", "Trzy spółgłoski", "Trzy cyfry"], "e": "Trzy słowa i trzy spółgłoski zapominano niemal tak samo szybko — sensowność nie chroniła."}, {"t": "w4", "s": "Maruszewski, s. 154", "q": "Hamowanie proaktywne to:", "a": ["Utrudnienie zapamiętywania nowego materiału przez wcześniej zapamiętany podobny materiał", "Zakłócanie dawnego materiału przez nowy", "Zanikanie śladu z upływem czasu", "Blokowanie odtwarzania przez bodziec maskujący"], "e": "Druga odpowiedź to interferencja retroaktywna."}, {"t": "w4", "s": "Maruszewski, ramka 4.8", "q": "Co wykazały badania Wickensa i Loessa?", "a": ["Zmiana kategorii materiału znosi hamowanie proaktywne, więc w STM występuje kodowanie semantyczne", "STM koduje tylko akustycznie", "Hamowanie proaktywne nie zależy od rodzaju materiału", "Owoce zapamiętuje się lepiej niż zwierzęta"], "e": "Wyniki spadały w próbach 1–3 i poprawiały się po zmianie kategorii."}, {"t": "w4", "s": "Maruszewski, s. 155", "q": "Baddeley i Scott (1971) zastosowali tylko jedną próbę. Co wykazali?", "a": ["Że w pamięci krótkotrwałej występuje zanikanie niezależne od interferencji", "Że zapominanie wynika wyłącznie z interferencji", "Że STM ma pojemność 80 bitów", "Że ślady w STM są trwałe"], "e": "Po 36 s pamiętano 98% przy 3 cyfrach i 61% przy 7 cyfrach."}, {"t": "w4", "s": "Maruszewski, s. 157", "q": "Kto użył pojęcia „permastore” (magazyn pamięci stałej)?", "a": ["Bahrick", "Tulving", "Schacter", "Csikszentmihalyi"], "e": "Bahrick badał pamięć twarzy i nazwisk kolegów oraz języka hiszpańskiego po 50 latach."}, {"t": "w4", "s": "Maruszewski, ramka 4.11", "q": "W badaniu Bowera i in. (1969) badani, którym podano hierarchię minerałów, zapamiętali średnio:", "a": ["73 ze 112 nazw (bez hierarchii — 21)", "21 ze 112 nazw (bez hierarchii — 73)", "Tyle samo co grupa bez hierarchii", "Wszystkie 112 nazw"], "e": "Organizacja materiału dramatycznie poprawia zapamiętywanie."}, {"t": "w4", "s": "Maruszewski, ramka 4.12", "q": "Sachs (1967) wykazał, że przy dłuższym przechowaniu badani wykrywają:", "a": ["Niemal wyłącznie zmiany znaczenia zdania", "Niemal wyłącznie zmiany gramatyczne", "Zarówno zmiany znaczenia, jak i gramatyczne", "Żadnych zmian"], "e": "Przy krótkim przechowaniu wykrywano oba rodzaje zmian."}, {"t": "w4", "s": "Maruszewski, s. 162", "q": "Efekt świeżości przypisuje się:", "a": ["Pamięci krótkotrwałej", "Pamięci trwałej", "Pamięci sensorycznej", "Pamięci proceduralnej"], "e": "Efekt pierwszeństwa przypisuje się pamięci trwałej."}, {"t": "w4", "s": "Maruszewski, s. 163", "q": "Zadanie angażujące uwagę (np. odliczanie wstecz) bezpośrednio po prezentacji listy:", "a": ["Usuwa efekt świeżości", "Usuwa efekt pierwszeństwa", "Wzmacnia efekt świeżości", "Nie wpływa na krzywą pozycyjną"], "e": "Szybsze tempo prezentacji osłabia z kolei efekt pierwszeństwa."}, {"t": "w4", "s": "Maruszewski, s. 163", "q": "Bernbach (1975) pokazał, że krzywa pozycyjna w kształcie U:", "a": ["Zanika, gdy badani wiedzą, jak długi będzie szereg", "Występuje zawsze, niezależnie od strategii", "Dotyczy tylko materiału obrazowego", "Pojawia się tylko u osób z amnezją"], "e": "Liczą się strategie badanych."}, {"t": "w4", "s": "Maruszewski, tab. 4.3", "q": "Która cecha dotyczy pamięci semantycznej według Tulvinga?", "a": ["Organizacja pojęciowa i automatyczny dostęp", "Organizacja czasowa", "Odniesienie do Ja", "Wyraźna zależność od kontekstu"], "e": "Pozostałe to cechy pamięci epizodycznej."}, {"t": "w4", "s": "Maruszewski, tab. 4.3", "q": "Kryterium prawdziwości informacji w pamięci epizodycznej to według Tulvinga:", "a": ["Przekonanie osobiste", "Zgodność społeczna", "Zgodność z encyklopedią", "Liczba powtórzeń"], "e": "Zgodność społeczna dotyczy pamięci semantycznej."}, {"t": "w4", "s": "Maruszewski, s. 168", "q": "Pacjent K.C. po wypadku:", "a": ["Stracił pamięć epizodyczną przy zachowanej semantycznej", "Stracił pamięć semantyczną przy zachowanej epizodycznej", "Stracił pamięć proceduralną", "Stracił wszystkie rodzaje pamięci"], "e": "Uczył się nowych zdań, ale nie pamiętał, że uczył się ich w laboratorium."}, {"t": "w4", "s": "Maruszewski, s. 169", "q": "Jaki rodzaj świadomości przypisuje Tulving pamięci epizodycznej?", "a": ["Autonoetyczną", "Noetyczną", "Anoetyczną", "Metapoznawczą"], "e": "Noetyczna — semantyczna, anoetyczna — proceduralna."}, {"t": "w4", "s": "Maruszewski, s. 169", "q": "Baddeley porównał pamięć semantyczną i epizodyczną do lasu oglądanego z samolotu i od środka, by pokazać, że:", "a": ["Są to różne aspekty tego samego systemu", "Są to dwa całkowicie odrębne systemy", "Pamięć semantyczna jest wcześniejsza rozwojowo", "Pamięć epizodyczna nie istnieje"], "e": "To argument przeciw ostremu podziałowi Tulvinga."}, {"t": "w4", "s": "Maruszewski, s. 173", "q": "Według Squire’a pamięć niedeklaratywna angażuje — oprócz hipokampa —", "a": ["Korę motoryczną i móżdżek", "Korę płatów czołowych i skroniowych", "Wyłącznie ciało migdałowate", "Wzgórze i układ siatkowaty"], "e": "Kora czołowa i skroniowa to pamięć deklaratywna."}, {"t": "w4", "s": "Maruszewski, s. 174", "q": "Sprawa George’a Harrisona i piosenki „My Sweet Lord” ilustruje:", "a": ["Nieświadomy plagiat jako przejaw pamięci ukrytej", "Paramnezję", "Efekt świeżości", "Déjà vu"], "e": "Sąd uznał, że był „podświadomie” inspirowany."}, {"t": "w4", "s": "Maruszewski, s. 179", "q": "Która forma NIE należy do pamięci niedeklaratywnej według Squire’a?", "a": ["Pamięć epizodyczna", "Torowanie", "Warunkowanie", "Habituacja i sensytyzacja"], "e": "Czwartą formą jest pamięć proceduralna."}, {"t": "w4", "s": "Maruszewski, s. 182", "q": "Czym warunkowanie ewaluatywne różni się od klasycznego?", "a": ["Nie wygasa, nawet gdy bodźce przestają współwystępować", "Wymaga reakcji orientacyjnej", "Jego siła zależy od statystycznego związku bodźców", "Wymaga bodźca o znaczeniu biologicznym"], "e": "Efekty warunkowania ewaluatywnego są bardzo trwałe."}, {"t": "w4", "s": "Maruszewski, s. 184", "q": "Torowanie automatyczne charakteryzuje:", "a": ["Brak związku między bodźcem poprzedzającym a właściwym i bardzo krótki odstęp czasu", "Silny związek semantyczny między bodźcami", "Działanie nawet po roku", "Oparcie na oczekiwaniach"], "e": "Pozostałe cechy dotyczą torowania strategicznego."}, {"t": "w4", "s": "Maruszewski, s. 185", "q": "Od czego według Maruszewskiego zależy siła torowania?", "a": ["Od wieloznaczności bodźców", "Od pojemności pamięci krótkotrwałej", "Od częstości słów", "Od liczby powtórzeń"], "e": "Dlatego działają metody projekcyjne."}, {"t": "w4", "s": "Maruszewski, s. 186", "q": "Teoria ACT Andersona opisuje:", "a": ["Automatyzację wiedzy deklaratywnej w pamięć proceduralną", "Rozprzestrzenianie się pobudzenia w sieci", "Dwufazowe przypominanie", "Magazynowy model pamięci"], "e": "Przykład: nauka pisania na klawiaturze."}, {"t": "w4", "s": "Maruszewski, s. 186", "q": "Habituacja to:", "a": ["Zmniejszenie uwagi poświęcanej bodźcom znanym", "Zwiększenie uwagi wobec bodźców nowych", "Automatyczna adaptacja receptorów", "Utrwalanie śladu w pamięci trwałej"], "e": "Druga odpowiedź to sensytyzacja."}, {"t": "w4", "s": "Maruszewski, ramka 5.2", "q": "O ile według Collinsa i Quilliana wydłuża się decyzja przy przejściu o jeden poziom hierarchii?", "a": ["Ok. 75 ms", "Ok. 38 ms", "Ok. 400 ms", "Ok. 500 ms"], "e": "38 ms to efekt wielkości zbioru u Sternberga."}, {"t": "w4", "s": "Maruszewski, s. 188", "q": "Model sieci semantycznej Collinsa i Quilliana zapewnia ekonomię poznawczą, ponieważ:", "a": ["Cechę zapisuje się raz, na najwyższym pasującym poziomie ogólności", "Pojęcia nie mają cech", "Sieć ma interpretację neuropsychologiczną", "Każda cecha jest zapisana przy każdym pojęciu"], "e": "„Oddycha” zapisane jest przy „zwierzęciu”, nie przy każdym gatunku."}, {"t": "w4", "s": "Maruszewski, s. 189", "q": "Smith, Shoben i Rips (1974) zaproponowali, że decyzje semantyczne opierają się na:", "a": ["Porównywaniu zbiorów cech w wielowymiarowej przestrzeni", "Przechodzeniu przez poziomy hierarchii", "Rozprzestrzeniającym się pobudzeniu", "Prototypach z kropek"], "e": "W ich modelu nie ma hierarchii."}, {"t": "w4", "s": "Maruszewski, ramka 5.3", "q": "Meyer i Schvaneveldt wykazali, że decyzja leksykalna jest szybsza, gdy:", "a": ["Oba ciągi są słowami bliskimi semantycznie", "Jeden ciąg jest losowy", "Słowa są niepowiązane", "Słowa są długie"], "e": "To pierwsza demonstracja torowania."}, {"t": "w4", "s": "Maruszewski, s. 194", "q": "W reprezentacji zdarzenia „Grzegorz bił się z myślami” szczególne jest to, że:", "a": ["Sprawca jest zarazem adresatem, a czynność jest psychiczna", "Brakuje czynności", "Obiekt jest stały", "Zdarzenie nie ma struktury hierarchicznej"], "e": "James — Ja poznające i Ja poznawane."}, {"t": "w4", "s": "Maruszewski, s. 196", "q": "Według Maruszewskiego o zapamiętywaniu (w odróżnieniu od kodowania) mówimy w przypadku pamięci:", "a": ["Operacyjnej i trwałej", "Sensorycznej i krótkotrwałej", "Wyłącznie sensorycznej", "Wyłącznie proceduralnej"], "e": "To rodzaje pamięci podlegające kontroli jednostki."}, {"t": "w4", "s": "Maruszewski, ramka 5.4", "q": "Skotofobina według Ungara odpowiada za:", "a": ["Uczenie się lęku przed ciemnością", "Habituację reakcji zaskoczenia", "Długotrwałe wzmocnienie synaptyczne", "Konsolidację pamięci epizodycznej"], "e": "Dla habituacji wyizolowano inną substancję."}, {"t": "w4", "s": "Maruszewski, ramka 5.5", "q": "Co się stało w badaniu Baddeleya, gdy badani powtarzali na głos osiem cyfr i rozwiązywali test rozumowania?", "a": ["Rozumowanie zwolniło o ok. 35%, a liczba błędów się nie zmieniła", "System się załamał i błędy wzrosły", "Rozumowanie przyspieszyło", "Badani przestali powtarzać cyfry"], "e": "Stąd wniosek, że pamięć operacyjna ma wiele komponentów."}, {"t": "w4", "s": "Maruszewski, s. 199", "q": "Który komponent pamięci operacyjnej Baddeleya odpowiada za integrowanie informacji wzrokowych i słuchowych?", "a": ["Bufor epizodyczny", "Pętla fonologiczna", "Szkicownik wzrokowo-przestrzenny", "Magazyn fonologiczny"], "e": "Bufor epizodyczny przechowuje też krótko informacje o zdarzeniach."}, {"t": "w4", "s": "Maruszewski, s. 199", "q": "Ile czasu magazyn fonologiczny przechowuje cichą mowę bez powtórek?", "a": ["Ok. 1,5–2 s", "Ok. 0,5 s", "Ok. 15–18 s", "Ok. minuty"], "e": "Powtórki wewnętrzne wydłużają ten czas."}, {"t": "w4", "s": "Maruszewski, s. 201", "q": "Czym model Cowana różni się od modelu Baddeleya?", "a": ["Pamięć operacyjna jest aktywną częścią pamięci trwałej i nie ma odrębnych modułów", "Ma więcej modułów niż model Baddeleya", "Nie zawiera centralnego systemu wykonawczego", "Utożsamia pamięć operacyjną z sensoryczną"], "e": "Ognisko uwagi mieści u Cowana ok. 4 elementy."}, {"t": "w4", "s": "Maruszewski, ramka 5.6", "q": "W badaniu Simonsa i Levina zmianę osoby pytającej o drogę zauważyła:", "a": ["Tylko połowa badanych", "Zdecydowana większość badanych", "Żadna osoba", "Tylko osoby starsze"], "e": "Częściej zauważali ją rówieśnicy eksperymentatorów."}, {"t": "w4", "s": "Maruszewski, ramka 5.7", "q": "Które opisy osób badani najlepiej pamiętali po dwóch tygodniach?", "a": ["Umiarkowanie zgodne ze schematem", "Bardzo zgodne ze schematem", "Konfliktowe", "Wszystkie tak samo"], "e": "Bezpośrednio po badaniu opisy bardzo i umiarkowanie zgodne pamiętano tak samo."}, {"t": "w4", "s": "Maruszewski, s. 206", "q": "Cahill i McGaugh (1995) wykazali, że:", "a": ["Wersja emocjonalna tej samej historii jest lepiej zapamiętywana", "Materiał emocjonalny jest wypierany", "Emocje nie wpływają na pamięć", "Lepiej pamiętamy wersję neutralną"], "e": "Treść percepcyjna była stała, zmieniało się znaczenie emocjonalne."}, {"t": "w4", "s": "Maruszewski, s. 205", "q": "Pamięć tunelowa to:", "a": ["Zawężenie zapamiętywania do najbardziej zagrażających elementów sytuacji przy silnym pobudzeniu", "Pamięć ułożona chronologicznie", "Zdolność zapamiętania długiego szeregu", "Pamięć o tunelach i drogach"], "e": "Wielokrotne odtwarzanie szczegółów peryferyjnych może hamować pamięć elementów centralnych."}, {"t": "w4", "s": "Maruszewski, s. 210", "q": "Według Craika i Lockharta do pamięci trwałej przenoszą materiał:", "a": ["Powtórki elaboracyjne (strukturalizujące)", "Powtórki podtrzymujące", "Wyłącznie powtórki na głos", "Wszystkie powtórki w równym stopniu"], "e": "Glenberg i in.: dziewięć razy więcej powtórzeń dało tylko 1,5% poprawy."}, {"t": "w4", "s": "Maruszewski, s. 209", "q": "Rekonsolidacja oznacza, że:", "a": ["Przywołany, skonsolidowany ślad znów staje się podatny na zakłócenia", "Ślad nigdy nie jest trwały", "Konsolidacja trwa kilka lat", "Elektrowstrząs nie wpływa na pamięć"], "e": "Nader, Schafe i LeDoux (2000)."}, {"t": "w4", "s": "Maruszewski, ramka 5.8", "q": "Jaki ogólny kierunek zmian obserwował Bartlett w kolejnych odtworzeniach „Wojny duchów”?", "a": ["Skracanie i dopasowywanie do schematów własnej kultury", "Wzbogacanie o nowe szczegóły", "Dosłowne powtarzanie od pierwszej próby", "Wzmacnianie elementów animistycznych"], "e": "Po znacznym skróceniu historię powtarzano niemal dosłownie."}, {"t": "w4", "s": "Maruszewski, ramka 5.9", "q": "Kto badał zapominanie zdarzeń z własnego życia, zapisując po dwa zdarzenia dziennie?", "a": ["Linton", "Bahrick", "Ebbinghaus", "Wagenaar i Linton razem"], "e": "Linton zapominała tylko ok. 6% zdarzeń rocznie."}, {"t": "w4", "s": "Maruszewski, s. 215", "q": "Paramnezja to:", "a": ["Rozpoznanie bez przypominania — wiemy tylko, że kogoś znamy", "Przypominanie bez rozpoznania", "Poczucie, że znana sytuacja jest całkiem nowa", "Uznanie cudzego pomysłu za własny"], "e": "Trzecia to jamais vu, czwarta — nieświadomy plagiat."}, {"t": "w4", "s": "Maruszewski, s. 217", "q": "Które słowa łatwiej rozpoznajemy?", "a": ["Słowa o niskiej częstości", "Słowa o wysokiej częstości", "Słowa krótkie", "Wszystkie tak samo"], "e": "Przy przypominaniu jest odwrotnie — łatwiej słowa częste."}, {"t": "w4", "s": "Maruszewski, s. 218", "q": "Watkins (1974) wykazał, że:", "a": ["W pewnych sytuacjach rozpoznanie daje gorsze wyniki niż przypominanie", "Rozpoznanie jest zawsze łatwiejsze", "Przypominanie jest jednofazowe", "Rozpoznanie nie zależy od wskazówek"], "e": "Badani uczyli się par zgłosek tworzących słowo (met–ro)."}, {"t": "w4", "s": "Maruszewski, s. 218", "q": "Koncepcja synergistycznego uświadamiania Tulvinga głosi, że:", "a": ["Odtwarzanie integruje informację ze śladu z informacją ze wskazówki", "Przypominanie zawiera fazę rozpoznania", "Pamięć to sieć semantyczna", "Zapominanie wynika z interferencji"], "e": "Przypominanie i rozpoznanie różnią się według Tulvinga tylko wskazówkami."}, {"t": "w4", "s": "Maruszewski, s. 220", "q": "Zasada specyficzności kodowania (Tulving i Thomson, 1973) mówi, że:", "a": ["Odtwarzanie jest łatwiejsze, gdy sytuacja odtwarzania przypomina sytuację kodowania", "Każda informacja jest kodowana raz", "Kodowanie zależy wyłącznie od modalności", "Najlepiej pamiętamy informacje niezgodne ze schematem"], "e": "Berrios wyjaśnia nią też déjà vu."}];
var OPEN = [{"t": "w1", "s": "Pytanie kontrolne, rozdz. 1", "q": "Co odróżnia procesy poznawcze od innych procesów psychicznych?", "a": "Służą nabywaniu, przetwarzaniu i wykorzystywaniu informacji — tworzeniu wewnętrznych reprezentacji i operowaniu na nich. Brak jednej przyjętej definicji, więc definiuje się je przez enumerację (tabela 1.1). Granice są rozmyte: ocena bywa zaliczana do procesów emocjonalnych lub poznawczych, a autor uważa podział poznawcze/emocjonalne za sztuczny, stworzony przez język."}, {"t": "w1", "s": "Pytanie kontrolne, rozdz. 1", "q": "Na podstawie jakich wskaźników wnioskuje się o przebiegu procesów poznawczych?", "a": "Introspekcja już nie jest jedynym źródłem. Wskaźniki behawioralne: czas reakcji, liczba błędów/przeoczeń, poprawność odpowiedzi, wybory w zadaniach (np. strategie u Brunera). Wskaźniki neuronalne (nieinwazyjne): PET i fMRI (dobra lokalizacja, słaba rozdzielczość czasowa), EEG i potencjały wywołane, np. N400 (dobra rozdzielczość czasowa); metoda subtrakcji. Także analiza skutków uszkodzeń mózgu."}, {"t": "w1", "s": "Pytanie kontrolne, rozdz. 1", "q": "Podaj przykłady wykorzystania wiedzy o procesach poznawczych w analizie zachowania w warunkach naturalnych.", "a": "Baddeley (1991) — płetwonurkowie i alkohol; eksperyment z sherry w Cambridge; Brewer i Sandow (1980) — alkohol zaburza wykonywanie zadań podwójnych (zasoby uwagi), a nie głównie motorykę; Redelmeier i Tibshirani (1997) oraz Strayer i Johnston (2001) — rozmowa przez telefon (także głośnomówiący) pogarsza jazdę; ucieczka z drugiej wieży WTC dzięki interpretacji sytuacji; pamięć osób lustrowanych."}, {"t": "w1", "s": "Pytanie kontrolne, rozdz. 1", "q": "Jakie specyficzne właściwości charakteryzują procesy poznawcze w interakcjach społecznych?", "a": "Osiem punktów (Fiske i Taylor; Moskowitz): kontrola otoczenia społecznego; zasada wzajemności; poznanie obejmuje Ja; autoprezentacja obserwowanych; wnioskowanie o ukrytych cechach i zamiarach; ludzie zmieniają się szybciej
