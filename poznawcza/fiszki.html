"q": "Co odróżnia procesy poznawcze od innych procesów psychicznych?",
"a": "<p>Służą nabywaniu, przetwarzaniu i wykorzystywaniu informacji — tworzeniu wewnętrznych reprezentacji i operowaniu na nich. Brak jednej przyjętej definicji, więc definiuje się je przez enumerację (tabela 1.1). Granice są rozmyte: ocena bywa zaliczana do procesów emocjonalnych lub poznawczych, a autor uważa podział poznawcze/emocjonalne za sztuczny, stworzony przez język.<\/p>",
"src": "Pytania kontrolne",
"id": "poznawcza/fiszki:4d8e65b6",
"unit": "wyklad-1.html",
"sec": "r1-1"
},
{
"q": "Na podstawie jakich wskaźników wnioskuje się o przebiegu procesów poznawczych?",
"a": "<p>Introspekcja już nie jest jedynym źródłem. Wskaźniki behawioralne: czas reakcji, liczba błędów/przeoczeń, poprawność odpowiedzi, wybory w zadaniach (np. strategie u Brunera). Wskaźniki neuronalne (nieinwazyjne): PET i fMRI (dobra lokalizacja, słaba rozdzielczość czasowa), EEG i potencjały wywołane, np. N400 (dobra rozdzielczość czasowa); metoda subtrakcji. Także analiza skutków uszkodzeń mózgu.<\/p>",
"src": "Pytania kontrolne",
"id": "poznawcza/fiszki:f93c7677",
"unit": "wyklad-1.html",
"sec": "wstep"
},
{
"q": "Podaj przykłady wykorzystania wiedzy o procesach poznawczych w analizie zachowania w warunkach naturalnych.",
"a": "<p>Baddeley (1991) — płetwonurkowie i alkohol; eksperyment z sherry w Cambridge; Brewer i Sandow (1980) — alkohol zaburza wykonywanie zadań podwójnych (zasoby uwagi), a nie głównie motorykę; Redelmeier i Tibshirani (1997) oraz Strayer i Johnston (2001) — rozmowa przez telefon (także głośnomówiący) pogarsza jazdę; ucieczka z drugiej wieży WTC dzięki interpretacji sytuacji; pamięć osób lustrowanych.<\/p>",
"src": "Pytania kontrolne",
"id": "poznawcza/fiszki:22955a81",
"unit": "wyklad-1.html",
"sec": null
},
{
"q": "Jakie specyficzne właściwości charakteryzują procesy poznawcze w interakcjach społecznych?",
"a": "<p>Osiem punktów (Fiske i Taylor; Moskowitz): kontrola otoczenia społecznego; zasada wzajemności; poznanie obejmuje Ja; autoprezentacja obserwowanych; wnioskowanie o ukrytych cechach i zamiarach; ludzie zmieniają się szybciej niż obiekty (mniejsze znaczenie stałości spostrzegania); trudniej sprawdzić trafność wniosków; silniejsza schematyzacja, choć możliwe przejście do przetwarzania analitycznego.<\/p>",
"src": "Pytania kontrolne",
"id": "poznawcza/fiszki:d237de07",
"unit": "wyklad-1.html",
"sec": "r1-6"
},
{
"q": "Co rozumiemy przez paradygmat poznawczy?",
"a": "<p>Paradygmat wg Kuhna: fundamentalne osiągnięcie wyznaczające sposób uprawiania nauki normalnej — oryginalne i atrakcyjne, a zarazem otwarte na nowe problemy. Psychologia poznawcza raczej nie ma jednego paradygmatu (brak „Newtona”), lecz zbiór mikroparadygmatów (Nowakowska, 1980) z jądrami: pamięć operacyjna, uwaga, wiedza. Wspólne założenia wymieniają Reynolds i Flagg (1983).<\/p>",
"src": "Pytania kontrolne",
"id": "poznawcza/fiszki:1c3d3529",
"unit": "wyklad-1.html",
"sec": "r1-5"
},
{
"q": "Jak można odróżnić procesy poznawcze człowieka od procesów przetwarzania informacji w komputerach?",
"a": "<p>Test Turinga i jego trudności (Penrose). Metafora komputerowa ma ograniczenia: mózg i komputer się uzupełniają (Bolter, 1990). Człowiek stawia cele, realizuje pragnienia, szuka ideałów; procesy poznawcze są służebne wobec podmiotu (Ja robocze). Umysł nie działa sekwencyjnie jak klasyczny komputer — przetwarzanie równoległe i rozproszone; sieć neuronalna działa mimo uszkodzeń, komputer sekwencyjny nie. Neisser: świadomość nie jest oknem na fazę przetwarzania. Procesy ludzkie są aktywne, zależne od kontekstu, emocji i interpretacji.<\/p>",
"src": "Pytania kontrolne",
"id": "poznawcza/fiszki:2d65a947",
"unit": "wyklad-1.html",
"sec": "dylematy"
},
{
"q": "Jakie elementy stanowią wrodzony składnik procesów poznawczych, a jakie można uznać za efekt uczenia się?",
"a": "<p>Wrodzone: mechanizm nabywania języka (LAD) i uniwersalne reguły gramatyczne (Chomsky); systemy bezpośredniej percepcji wg Neissera — np. wykrywanie ruchu u noworodków, najmniej plastyczne. Wyuczone: mapy poznawcze (Tolman); systemy rozpoznawania i reprezentacji (najbardziej plastyczne, np. rozpoznanie „kursora”); stabilne struktury z wielokrotnego użycia strategii (ruchy oczu przy czytaniu). Język jako całość — interakcja wrodzonego mechanizmu i uczenia się.<\/p>",
"src": "Pytania kontrolne",
"id": "poznawcza/fiszki:eb73f5f3",
"unit": "wyklad-1.html",
"sec": "dylematy"
},
{
"q": "Wymień i scharakteryzuj kluczowe dylematy psychologii poznawczej. z sylabusa",
"a": "<p>Wrodzone vs wyuczone; szerokie vs wąskie ujęcie; umysł jako komputer; przetwarzanie sekwencyjne vs równoległe; umysł reaktywny vs aktywny; laboratorium vs trafność ekologiczna; poznanie vs emocje; kontrola świadoma vs automatyzm; umysł a mózg (redukcjonizm); jedna dyscyplina vs mikroparadygmaty; procesy uniwersalne vs zależne od przedmiotu. Szczegóły w sekcji <a href=\"#dylematy\">Kluczowe dylematy<\/a>.<\/p>",
"src": "Pytania kontrolne",
"id": "poznawcza/fiszki:6562b1e4",
"unit": "wyklad-1.html",
"sec": "dylematy"
},
{
"q": "Co różni bodźce dystalne od proksymalnych?",
"a": "<p>Bodziec dystalny to obiekt poza organizmem, działający na zmysły z odległości (kartka, muzyka z głośnika). Bodziec proksymalny powstaje w bezpośrednim kontakcie bodźca dystalnego z narządem zmysłu (obraz siatkówkowy — odwrócony i pomniejszony; drgania błony bębenkowej). Stałość spostrzegania pokazuje, że spostrzeżenie zmienia się mniej niż bodziec proksymalny.<\/p>",
"src": "Pytania kontrolne — rozdział 2",
"id": "poznawcza/fiszki:f18351b3",
"unit": "wyklad-2.html",
"sec": "r2-1"
},
{
"q": "W procesie spostrzegania dochodzi do konfrontacji dwojakiego rodzaju danych. O jakie dane chodzi?",
"a": "<p>Dane sensoryczne (dynamiczne, zmienne, bogate, standaryzowane przez detektory cech) i dane pamięciowe (schematy — uporządkowane, względnie stabilne, zwykle w postaci abstrakcyjnej, werbalnej). Idea pochodzi od Brunera (1978); proces dopasowania wymaga przeszukiwania pamięci i przekładu między kodami (Posner).<\/p>",
"src": "Pytania kontrolne — rozdział 2",
"id": "poznawcza/fiszki:5f2d2c02",
"unit": "wyklad-2.html",
"sec": null
},
{
"q": "Na czym polega gotowość i obronność percepcyjna?",
"a": "<p>Gotowość percepcyjna to łatwość użycia danej kategorii pamięciowej do materiału percepcyjnego. Zależy od czynników zewnętrznych (częstość doświadczeń, konsekwencje społeczne; torowanie) i wewnętrznych (monopol, integracja poznawcza, konsekwencje motywacyjne). Obronność percepcyjna to obniżona gotowość: podwyższony próg rozpoznawania materiału zagrażającego (Bruner i Postman, 1947). Pokazuje, że ocena emocjonalna poprzedza rozpoznanie treści; funkcja adaptacyjna — szybka, choć nieprecyzyjna orientacja emocjonalna.<\/p>",
"src": "Pytania kontrolne — rozdział 2",
"id": "poznawcza/fiszki:c549fa4e",
"unit": "wyklad-2.html",
"sec": null
},
{
"q": "Jakiego rodzaju kody wykorzystywano w eksperymentach Posnera i współpracowników?",
"a": "<p>Kod fizyczny (wzrokowy — wygląd litery, np. AA) i kod nominalny (werbalny — nazwa litery, np. Aa); dodatkowo kryterium oparte na regule (np. obie samogłoski). Przy ekspozycji równoczesnej porównanie fizyczne jest szybsze o ok. 80 ms; przy sekwencyjnej (≥ 2 s) przewaga się odwraca, bo pierwsza litera zostaje przekodowana na kod werbalny.<\/p>",
"src": "Pytania kontrolne — rozdział 2",
"id": "poznawcza/fiszki:a2eca840",
"unit": "wyklad-2.html",
"sec": "r2-4"
},
{
"q": "Jakie elementy wchodzą w skład cyklu percepcyjnego Neissera?",
"a": "<p>Schemat pamięciowy (kieruje eksploracją), eksploracja (pobiera próbki z otoczenia) i dostępna informacja w otoczeniu (modyfikuje schemat). Cykl nie ma wyraźnego początku ani końca; może zacząć się od odbioru informacji, od schematu albo od eksploracji. U niemowląt wrodzone są schematy eksploracyjne.<\/p>",
"src": "Pytania kontrolne — rozdział 2",
"id": "poznawcza/fiszki:e6a35230",
"unit": "wyklad-2.html",
"sec": null
},
{
"q": "Czym są niezmienniki percepcyjne i w jakiej koncepcji spostrzegania wykorzystywane jest to pojęcie?",
"a": "<p>To specyficzne układy cech, które pozostają stałe mimo zmiennych warunków spostrzegania (np. stosunek wielkości do odległości; układ światła i cienia wyznaczający wklęsłość/wypukłość; melodia w innej tonacji). Pojęcie należy do ekologicznej koncepcji percepcji bezpośredniej Gibsona.<\/p>",
"src": "Pytania kontrolne — rozdział 2",
"id": "poznawcza/fiszki:0acd61e2",
"unit": "wyklad-2.html",
"sec": "r2-5"
},
{
"q": "Jakie znaczenie w wyjaśnianiu relacji między wrażeniami i spostrzeżeniami mają zasady Wertheimera?",
"a": "<p>Pokazują, że całości wyodrębniamy według wrodzonych zasad organizacji (bliskość, podobieństwo, wspólna droga, dobra kontynuacja, niewielkie rozmiary, symetria, nastawienie; doświadczenie drugoplanowe), a nie przez kojarzenie wrażeń. To argument psychologii postaci za prymatem całości i pierwotnością spostrzeżeń — przeciw asocjacjonizmowi, który łączenie elementów tłumaczył prawami kojarzenia i uczeniem się.<\/p>",
"src": "Pytania kontrolne — rozdział 2",
"id": "poznawcza/fiszki:fd7f7879",
"unit": "wyklad-2.html",
"sec": "r2-3"
},
{
"q": "Dlaczego zasada figury i tła jest traktowana jako dowód przemawiający na rzecz jednej z klasycznych teorii spostrzegania?",
"a": "<p>Przemawia za psychologią postaci. Asocjacjonizm zakładał, że wszystkie elementy pola są jednakowo ważne, bo spostrzeżenie powstaje z kojarzenia równorzędnych wrażeń. Tymczasem pole percepcyjne od razu dzieli się na figurę (ważniejszą, ukształtowaną, wysuniętą, łatwiej zapamiętywaną) i tło — zróżnicowanie wagi elementów jest możliwe tylko wtedy, gdy spostrzeżenie jest pierwotne. Figury odwracalne (waza Rubina) pokazują też, że te same elementy dają różne całości.<\/p>",
"src": "Pytania kontrolne — rozdział 2",
"id": "poznawcza/fiszki:f6819be7",
"unit": "wyklad-2.html",
"sec": "r2-3"
},
{
"q": "Scharakteryzuj fazy procesu spostrzegania i podaj dowody na ich niezależność. z sylabusa",
"a": "<p>(1) rejestracja sensoryczna — detektory cech, pamięć sensoryczna, dane niedostępne świadomości; (2) ocena emocjonalna — kolaterale do wzgórza i ciała migdałowatego, ocena przyjemny/nieprzyjemny; (3) rozpoznanie treści — kategoryzacja przez dopasowanie do schematów; (4) ocena znaczenia metaforycznego. Dowody niezależności: obronność percepcyjna, subcepcja (Lazarus i McCleary), pacjenci po komisurotomii oceniający znak słów, których nie potrafią odczytać.<\/p>",
"src": "Pytania kontrolne — rozdział 2",
"id": "poznawcza/fiszki:ce416ee4",
"unit": "wyklad-2.html",
"sec": "r2-2"
},
{
"q": "Co różni teorie ścisłej selekcji od teorii osłabiania?",
"a": "<p>Ścisła selekcja (Broadbent, 1958): filtr wczesny, działający na zasadzie „wszystko albo nic” według cech fizycznych; komunikat nieśledzony jest blokowany (zostaje tylko ok. 20 s w STM i analiza fizyczna). Osłabianie (Treisman): komunikat nieśledzony jest osłabiany, a nie blokowany; selekcja jest wieloetapowa i oparta na priorytetach (stałych i bieżących), więc ważne treści — imię, sens zdania — mogą przejść dalej (cocktail party, „Dear Aunt Jane”, dwujęzyczni). Nazwa „teoria osłabiania” pochodzi spoza rozdziału.<\/p>",
"src": "Pytania kontrolne — rozdział 3",
"id": "poznawcza/fiszki:7caadc8a",
"unit": "wyklad-3.html",
"sec": "r3-3c"
},
{
"q": "Jakie czynniki wpływają na zachowanie w sytuacji detekcji sygnałów?",
"a": "<p>(1) Stosunek siły sygnału do siły szumu — łatwość różnicowania, silne sygnały przyciągają uwagę; (2) macierz wypłat — motywacyjne konsekwencje decyzji (czerniak: lepiej fałszywy alarm niż pominięcie); (3) oczekiwania — częstość sygnałów w danych warunkach albo same przekonania (psychoza strachu, lustracja). Czujność obniża też monotonia i duża częstość bodźców (ponad 24 na minutę) w zadaniach percepcyjnych.<\/p>",
"src": "Pytania kontrolne — rozdział 3",
"id": "poznawcza/fiszki:ec35e3a5",
"unit": "wyklad-3.html",
"sec": "r3-3a"
},
{
"q": "Kiedy kontrola sprawowana nad procesami psychicznymi prowadzi do paradoksalnych skutków?",
"a": "<p>Gdy próbujemy tłumić myśli: efekt rykoszetu (Wegner) — „nie myśl o białych niedźwiedziach” zwiększa częstość tych myśli. Proces wykonawczy (szuka treści zastępczych) wymaga zasobów, a monitorujący (szuka zakazanej treści) nie. Przy niedoborze zasobów (stres, zmęczenie) wygrywa monitorujący. Pomaga autodystrakcja („czerwony volkswagen”). Także uświadamianie sobie procesów zmienia ich przebieg (Ericsson i Simon).<\/p>",
"src": "Pytania kontrolne — rozdział 3",
"id": "poznawcza/fiszki:e0d5161b",
"unit": "wyklad-3.html",
"sec": "r3-4"
},
{
"q": "W jakich sytuacjach zachowanie wyznaczają procesy kontrolowane, w jakich automatyczne, a w jakich ich kombinacja?",
"a": "<p>Kontrolowane: zadania nowe, trudne, złożone, wymagające świadomości i sekwencyjnego przetwarzania. Automatyczne: zadania przeuczone, łatwe, dobrze znane, przetwarzanie przeduwagowe i torowanie. Kombinacja: większość czynności, bo podział jest ciągły (Logan, Nęcka) — np. wiązanie krawata czy prowadzenie auta przebiegają automatycznie, ale można je uświadomić i skorygować; w zadaniu Stroopa trzeba kontrolą hamować automatyczne czytanie.<\/p>",
"src": "Pytania kontrolne — rozdział 3",
"id": "poznawcza/fiszki:4fef2f81",
"unit": "wyklad-3.html",
"sec": "r3-5"
},
{
"q": "Czym są dystraktory i czy możliwe jest minimalizowanie ich oddziaływania?",
"a": "<p>Bodźce odwracające uwagę — zewnętrzne lub wewnętrzne, działające na czynność zewnętrzną lub wewnętrzną (tab. 3.2). Ograniczanie: przeuczenie zadania (mniej zasobów), zadania angażujące różne modalności (Gopher i Navon), autodystrakcja wobec myśli intruzywnych (muzyka, „czerwony volkswagen”), skupienie uwagi intensywnej. Pełne wyeliminowanie bywa niemożliwe, a tłumienie może dać efekt rykoszetu.<\/p>",
"src": "Pytania kontrolne — rozdział 3",
"id": "poznawcza/fiszki:f9bf3de6",
"unit": "wyklad-3.html",
"sec": "r3-4"
},
{
"q": "Jakie czynniki sprawiają, że bezrefleksyjność zaczyna ulegać refleksyjności?",
"a": "<p>Zaangażowanie osobistych interesów i wyższa stawka (prośba o skopiowanie 20, a nie 5 stron); zachęta do zastanowienia się (grupa „myślenie” u Chanowitza i Langer); nowe rozróżnienia i kategorie, możliwe na każdym etapie opanowania czynności; ćwiczenie uważności (pensjonariusze domu opieki). W przeciwną stronę działa huśtawka emocjonalna (Doliński).<\/p>",
"src": "Pytania kontrolne — rozdział 3",
"id": "poznawcza/fiszki:ceb8a5c7",
"unit": "wyklad-3.html",
"sec": "r3-6"
},
{
"q": "Jak reklamodawcy manipulują uwagą odbiorców?",
"a": "<p>Rozdział podaje przykłady manipulacji wieloznacznymi komunikatami społecznymi: eufemizmy i przeramowania (Reagan: „margines bezpieczeństwa” zamiast „wyścigu zbrojeń”), propaganda sukcesu, przekonanie, że „krowa jest koniem”. Wykorzystuje się też bodźce nowe i wyraziste (odruch orientacyjny), silne dystraktory oraz bezrefleksyjne reagowanie na samo „bo” (ksero). Z rozdziału 2: prawy górny róg strony, kierunek wzroku, pionowy napis „piwo bezalkoholowe” (<a href=\"#cykl\">2.4.4<\/a>).<\/p>",
"src": "Pytania kontrolne — rozdział 3",
"id": "poznawcza/fiszki:4e0328aa",
"unit": "wyklad-3.html",
"sec": null
},
{
"q": "Jakie elementy wchodzą w skład świadomości rozumianej jako teatr umysłu?",
"a": "<p>Scena — globalna przestrzeń robocza o ograniczonej pojemności, ze świadomością w centrum i peryferiami. Wejścia: zmysły zewnętrzne, zmysły wewnętrzne (wyobraźnia, mowa wewnętrzna, sny), idee. Konteksty za kulisami: reżyser (sterowanie wrażeniem), operator światła (sterowanie uwagą — wąski lub szeroki snop), konteksty lokalne. Widownia: wyspecjalizowane, nieświadome systemy eksperckie tworzące koalicje. Do tego pamięć operacyjna pod kontrolą wolicjonalną.<\/p>",
"src": "Pytania kontrolne — rozdział 3",
"id": "poznawcza/fiszki:93ebc327",
"unit": "wyklad-3.html",
"sec": "r3-7"
},
{
"q": "Opisz funkcje uwagi i poziomy selekcji. z sylabusa",
"a": "<p>Cztery funkcje: selekcja, ukierunkowanie, określanie wielkości zasobów, podtrzymywanie zaangażowania. Selekcja zachodzi w narządach zmysłów (126 mln fotoreceptorów → ok. 1 mln włókien), w procesach pamięciowych (STM → LTM: habituacja, informacje niezgodne z wiedzą, szybkość kodowania) i przy wyborze informacji z LTM do pamięci operacyjnej na potrzeby działania.<\/p>",
"src": "Pytania kontrolne — rozdział 3",
"id": "poznawcza/fiszki:c7ab7594",
"unit": "wyklad-3.html",
"sec": "r3-1"
},
{
"q": "Na czym polega paradygmat podwójnego zadania i co z niego wynika? z sylabusa",
"a": "<p>Badany wykonuje dwa zadania naraz; spadek sprawności względem zadań wykonywanych osobno pokazuje konkurencję o zasoby. Spelke, Hirst i Neisser (1976): po 6 tygodniach ćwiczeń czytanie ze zrozumieniem i dyktando bez błędów — ćwiczenie zmniejsza zapotrzebowanie na zasoby. Kahneman: jedna pula zasobów; Gopher i Navon: pule specyficzne dla modalności (prasowanie i radio).<\/p>",
"src": "Pytania kontrolne — rozdział 3",
"id": "poznawcza/fiszki:8dc50b56",
"unit": "wyklad-3.html",
"sec": "r3-3d"
},
{
"q": "Jakie są cele badań psychologii poznawczej?",
"a": "<p>Zbieranie danych, ich analiza, budowanie teorii, formułowanie i sprawdzanie hipotez, czasem stosowanie wyników poza sytuacją badania. Teoria to zorganizowany zbiór twierdzeń wyjaśniających; hipoteza — wstępne twierdzenie o oczekiwanych konsekwencjach empirycznych („jeśli X, to Y”). Wyniki uruchamiają kolejny cykl.<\/p>",
"src": "Pytania kontrolne — ćwiczenia 1",
"id": "poznawcza/fiszki:8909beae",
"unit": "cwiczenia-1.html",
"sec": "c1-cele"
},
{
"q": "Wymień metody badawcze psychologii poznawczej według Sternberga.",
"a": "<p>Kontrolowane eksperymenty laboratoryjne, badania psychobiologiczne, techniki samoopisowe, studia przypadków, obserwacje naturalistyczne, symulacje komputerowe i sztuczna inteligencja.<\/p>",
"src": "Pytania kontrolne — ćwiczenia 1",
"id": "poznawcza/fiszki:355c9c12",
"unit": "cwiczenia-1.html",
"sec": "c1-porownanie"
},
{
"q": "Jakie są mocne i słabe strony eksperymentu laboratoryjnego?",
"a": "<p>Mocne: kontrola zmiennych, losowy przydział do grup, wnioskowanie przyczynowe, łatwość rejestracji i analizy statystycznej, możliwość reprezentatywnych prób, precyzyjny pomiar czasu reakcji. Słabe: sztuczne warunki i uproszczone zadania, ograniczone uogólnianie na inne zadania, czas i miejsce, rozbieżność między zachowaniem w laboratorium i w życiu, lekceważenie różnic indywidualnych.<\/p>",
"src": "Pytania kontrolne — ćwiczenia 1",
"id": "poznawcza/fiszki:a9cd97ec",
"unit": "cwiczenia-1.html",
"sec": "c1-porownanie"
},
{
"q": "Czym różnią się badania eksperymentalne od korelacyjnych?",
"a": "<p>W eksperymencie badacz manipuluje zmienną niezależną i losowo przydziela badanych do grup, więc może wnosić o przyczynowości. Badania korelacyjne mierzą statystyczny związek cech (od −1 przez 0 do +1), stosuje się je, gdy właściwości nie można losowo przydzielić (np. wiek). Nie pozwalają wnioskować o przyczynach.<\/p>",
"src": "Pytania kontrolne — ćwiczenia 1",
"id": "poznawcza/fiszki:204fa856",
"unit": "cwiczenia-1.html",
"sec": "c1-eksperyment"
},
{
"q": "Do czego najlepiej służą samoopisy, studia przypadków i obserwacja naturalistyczna, a do czego eksperyment?",
"a": "<p>Samoopisy, studia przypadków i obserwacja — do formułowania hipotez, mają też większą trafność ekologiczną. Eksperymenty — do weryfikowania hipotez. Samoopisy z przypomnień są mniej rzetelne niż relacje w trakcie, a samo relacjonowanie może zmieniać proces.<\/p>",
"src": "Pytania kontrolne — ćwiczenia 1",
"id": "poznawcza/fiszki:d4681e01",
"unit": "cwiczenia-1.html",
"sec": "c1-samoopis"
},
{
"q": "Jakie są kluczowe problemy psychologii poznawczej według Sternberga?",
"a": "<p>Dziedziczność czy wychowanie; racjonalizm czy empiryzm; struktury czy procesy; ogólność czy specyficzność; trafność wnioskowania przyczynowego czy trafność ekologiczna; badania stosowane czy podstawowe. Często najbardziej użyteczna jest synteza stanowisk.<\/p>",
"src": "Pytania kontrolne — ćwiczenia 1",
"id": "poznawcza/fiszki:506dd9ed",
"unit": "cwiczenia-1.html",
"sec": "c1-problemy"
},
{
"q": "Wymień cztery grupy metod według Allporta (1996) i metodę, którą dodają Nęcka i współautorzy.",
"a": "<p>Obserwacja (z samoopisem i studium przypadku), eksperyment laboratoryjny, badania kliniczne, symulacja komputerowa. Uzupełnienie: obrazowanie pracy mózgu (PET, fMRI).<\/p>",
"src": "Pytania kontrolne — ćwiczenia 1",
"id": "poznawcza/fiszki:f57c872c",
"unit": "cwiczenia-1.html",
"sec": "c1-porownanie"
},
{
"q": "Jakie wskaźniki sprawności przetwarzania informacji stosuje się w eksperymencie?",
"a": "<p>Średni czas reakcji; inne wskaźniki chronometryczne (minimalny, maksymalny czas reakcji, indywidualna zmienność); poprawność odpowiedzi, zwykle w procentach maksymalnego wyniku (lub liczba i rodzaj błędów); coraz częściej dane neurobiologiczne, np. EEG.<\/p>",
"src": "Pytania kontrolne — ćwiczenia 1",
"id": "poznawcza/fiszki:a6c924bb",
"unit": "cwiczenia-1.html",
"sec": "c1-cr"
},
{
"q": "Czym jest kognitywistyka i z jakich dyscyplin się składa?",
"a": "<p>Interdyscyplinarna dziedzina badań nad poznaniem; według raportu Sloan’a (1978) synteza sześciu dyscyplin: filozofii, psychologii, językoznawstwa, informatyki, antropologii i neuronauki. Rozwija obszary na ich styku (np. psycholingwistyka, neuropsychologia, cybernetyka), choć każda dyscyplina wciąż ma swoją metodologię i język.<\/p>",
"src": "Pytania kontrolne — ćwiczenia 1",
"id": "poznawcza/fiszki:7d90898a",
"unit": "cwiczenia-1.html",
"sec": "c1-dziedziny"
},
{
"q": "Dlaczego wyniki symulacji komputerowej przyjmuje się tylko z pewnym prawdopodobieństwem?",
"a": "<p>Bo podobieństwo dwóch systemów na wyjściu (poziom wykonania, błędy) nie musi oznaczać podobieństwa sposobu działania — ten sam wynik można uzyskać na wiele sposobów. Mimo to prawdopodobna teoria jest lepsza niż żadna, a klasyczne badania empiryczne też dają wiedzę prawdopodobną.<\/p>",
"src": "Pytania kontrolne — ćwiczenia 1",
"id": "poznawcza/fiszki:2c0f581c",
"unit": "cwiczenia-1.html",
"sec": "c1-allport"
},
{
"q": "Jakie zalety i wady mają badania kliniczne i obrazowanie mózgu?",
"a": "<p>Badania kliniczne: „eksperyment natury” pokazuje rolę obszarów mózgu (np. hipokamp a przekazywanie z STM do LTM), ale grupy są małe i trudno dobrać grupę kontrolną. Obrazowanie: lokalizacja funkcji, porównania osób, weryfikacja modeli (pamięć nie jest jednolita), ale słaba rozdzielczość czasowa (sekundy w fMRI, ok. pół minuty w PET) przy procesach trwających poniżej sekundy.<\/p>",
"src": "Pytania kontrolne — ćwiczenia 1",
"id": "poznawcza/fiszki:28644821",
"unit": "cwiczenia-1.html",
"sec": "c1-allport"
},
{
"q": "Jakie idee Piageta uczyniły go prekursorem podejścia poznawczego?",
"a": "<p>Schemat poznawczy i rozwój jako ciąg asymilacji i akomodacji; aktywność podmiotu (człowiek jak badacz, por. Kelly); konstruktywistyczna natura poznania — reprezentacja świata jest samodzielną budowlą, zwykle tylko częściowo trafną.<\/p>",
"src": "Pytania kontrolne — ćwiczenia 1",
"id": "poznawcza/fiszki:c08943c7",
"unit": "cwiczenia-1.html",
"sec": "c1-zrodla"
},
{
"q": "Czy fazy procesu pamięciowego mają charakter liniowy, czy cykliczny?",
"a": "<p>Cykliczny. Tulving opisał dziewięć faz w porządku liniowym, ale Maruszewski wyróżnia dwa cykle. Mały cykl: wielokrotne odbieranie informacji powiązanych z wiedzą — rekodowanie, asymilacja lub akomodacja, zmiana walencji (efekt czystej ekspozycji); informacje zdobyte własną eksploracją zapamiętujemy szybciej i trwalej. Duży cykl: zachowanie ujawniające zawartość pamięci samo staje się przedmiotem spostrzegania i kodowania — to sytuacja powtarzania (prawo częstości, prawo Foucault t = k·l²); utrwala też błędy; może uruchamiać się automatycznie (myśli intruzywne, ruminacje).<\/p>",
"src": "Pytania kontrolne — rozdział 4",
"id": "poznawcza/fiszki:a49393ef",
"unit": "wyklad-4.html",
"sec": "r4-2"
},
{
"q": "Jak zmienia się pojemność różnych rodzajów pamięci wyróżnionych ze względu na czas przechowania?",
"a": "<p>Sensoryczna: duża, ok. 18 elementów (więcej niż STM), zależnie od procedury (Sperling ok. 12 liter, Averbach i Coriell więcej); czas ok. 0,5 s. Krótkotrwała: mała — 7 ± 2 kęsy (Miller) lub 80 bitów (Lehrl i Fischer); kilkanaście sekund (15–18 s Petersonowie, 5,4 s Lehrl i Fischer), dłużej dzięki powtórkom. Trwała: praktycznie nieograniczona (185 mld informacji wg Csikszentmihalyiego), czas praktycznie nieograniczony; ograniczeniem jest dostęp i tempo kodowania (0,1–1 bit/s).<\/p>",
"src": "Pytania kontrolne — rozdział 4",
"id": "poznawcza/fiszki:0da753be",
"unit": "wyklad-4.html",
"sec": "r4-3"
},
{
"q": "Jakim rodzajem pamięci posługuje się świadek zeznający przed sądem?",
"a": "<p>Pamięcią epizodyczną — świadek relacjonuje zdarzenia, z którymi miał bezpośredni kontakt, umiejscowione w czasie i przestrzeni (Tulving: świadectwo w sądzie dopuszczalne). Wiedza semantyczna jest w sądzie dopuszczalna tylko jako orzeczenie biegłego. Pamięć epizodyczna jest zależna od kontekstu, nasycona afektem i podatna na zmiany (rekodowanie, synergia z pytaniami, strategiczna kontrola — Koriat i Goldsmith; pamięć tunelowa przy silnym pobudzeniu).<\/p>",
"src": "Pytania kontrolne — rozdział 4",
"id": "poznawcza/fiszki:49410c0f",
"unit": "wyklad-4.html",
"sec": "r4-4"
},
{
"q": "W jaki sposób można pokonać ograniczenia pojemności pamięci?",
"a": "<p>Grupowanie elementów w kęsy — najlepiej po trzy (Wicklegren, 1964); wykorzystanie posiadanej wiedzy (PIN jako data; biegacz Ericssona kodujący cyfry jako czasy biegów — 80 cyfr, choć kosztem długiego treningu); powtórki wewnętrzne przedłużające życie informacji w STM; organizowanie materiału kategorialnie i hierarchicznie (Bousfield; Bower i in. — 73 vs 21 nazw minerałów); pamięć zewnętrzna (notatki, organizery).<\/p>",
"src": "Pytania kontrolne — rozdział 4",
"id": "poznawcza/fiszki:848a504b",
"unit": "wyklad-4.html",
"sec": null
},
{
"q": "Do jakiego rodzaju pamięci odnoszą się poradniki typu „Nauka tenisa w weekend” i co można powiedzieć o ich skuteczności?",
"a": "<p>Do pamięci proceduralnej (niedeklaratywnej) — umiejętności sensomotorycznych. Poradnik dostarcza wiedzy deklaratywnej; według teorii ACT Andersona musi ona dopiero zautomatyzować się w ćwiczeniu i przejść do pamięci proceduralnej, co wymaga długiego treningu. Ponadto pamięć proceduralna jest sztywna i zależna od kontekstu (mały transfer), a jej treści są niedostępne werbalnie — więc weekend z książką raczej nie wystarczy.<\/p>",
"src": "Pytania kontrolne — rozdział 4",
"id": "poznawcza/fiszki:bd2757e0",
"unit": "wyklad-4.html",
"sec": null
},
{
"q": "Jakie dane uzasadniają wyodrębnienie pamięci krótkotrwałej i trwałej?",
"a": "<p>(1) Krzywa pozycyjna: efekt pierwszeństwa (pamięć trwała) i efekt świeżości (pamięć krótkotrwała), wybiórczo wrażliwe na różne czynniki — zadanie angażujące uwagę po liście usuwa efekt świeżości, szybsze tempo osłabia pierwszeństwo (Glanzer). Zastrzeżenie: Bernbach — gdy badani znali długość listy, krzywa U znikała. (2) Badania neuropsychologiczne: wybiórcze zaburzenia STM przy zachowanej LTM (Shallice i Warrington — okolica ciemieniowa/potyliczna) i odwrotnie (uszkodzenia skroniowe, Clive Wearing); rola hipokampa w utrwalaniu.<\/p>",
"src": "Pytania kontrolne — rozdział 4",
"id": "poznawcza/fiszki:d9d56e2a",
"unit": "wyklad-4.html",
"sec": null
},
{
"q": "Na podstawie czego można wnioskować o pamięci ukrytej?",
"a": "<p>Na podstawie zachowania w zadaniach, w których badany nie wie, że korzysta z pamięci: torowanie (dokańczanie „pa…”, także po ekspozycji podprogowej), metoda zaoszczędzenia przy ponownym uczeniu się (Ebbinghaus), lepsze wyniki z podpowiedzią u pacjenta z amnezją (Warrington i McCarthy), nieświadomy plagiat (Harrison), wykonywanie wyuczonych umiejętności.<\/p>",
"src": "Pytania kontrolne — rozdział 4",
"id": "poznawcza/fiszki:c4279a6e",
"unit": "wyklad-4.html",
"sec": "r4-6"
},
{
"q": "Na czym polega efekt torowania? Podaj przykłady z życia codziennego.",
"a": "<p>Bodziec wcześniejszy modyfikuje (ułatwia lub utrudnia) rozpoznawanie i przetwarzanie bodźca późniejszego; efekt jest niedostępny świadomości. Torowanie automatyczne — bodźce niezwiązane, odstęp kilku sekund; strategiczne — bodźce związane, oparte na oczekiwaniach, efekt nawet po roku. Przykłady: „chleb” ułatwia rozpoznanie „bułka”; zmywanie naczyń przywołuje emocję złej wiadomości usłyszanej przy zmywaniu; projekcja w testach projekcyjnych; reklama.<\/p>",
"src": "Pytania kontrolne — rozdział 5",
"id": "poznawcza/fiszki:43a4d34e",
"unit": "wyklad-4.html",
"sec": "r5-1"
},
{
"q": "Jak powstają i automatyzują się zdolności proceduralne?",
"a": "<p>Według teorii ACT Andersona najpierw przyswajamy wiedzę deklaratywną (gdzie jest litera „b”, metoda „biblijna”), a w miarę treningu wiedza ta automatyzuje się i przechodzi do pamięci proceduralnej (palce „wiedzą” same, piszemy całymi słowami). Umiejętności proceduralne są sztywne, zależne od kontekstu, mają mały transfer i są bardzo odporne na amnezję (Clive Wearing grał na pianinie).<\/p>",
"src": "Pytania kontrolne — rozdział 5",
"id": "poznawcza/fiszki:2a31de9f",
"unit": "wyklad-4.html",
"sec": "r5-1"
},
{
"q": "Jak analiza czasu decyzji przy weryfikowaniu twierdzeń doprowadziła do modelu pamięci jako sieci semantycznej?",
"a": "<p>Collins i Quillian mierzyli czas weryfikacji zdań: „kanarek je” (1460 ms) > „kanarek lata” (1385 ms) > „kanarek jest żółty” (1310 ms). Każdy poziom hierarchii dodawał ok. 75 ms, co sugerowało hierarchiczną sieć węzłów (pojęć) i połączeń (przynależność, cechy) z ekonomicznym zapisem cech na najwyższym pasującym poziomie. Anomalie („pudel jest zwierzęciem” szybciej niż „pies jest ssakiem”) wyjaśnił model rozprzestrzeniającego się pobudzenia Collinsa i Loftus; alternatywa — porównywanie cech Smitha, Shobena i Ripsa.<\/p>",
"src": "Pytania kontrolne — rozdział 5",
"id": "poznawcza/fiszki:2431604b",
"unit": "wyklad-4.html",
"sec": "r5-2"
},
{
"q": "W jaki sposób buduje się sieci pamięciowe stanowiące reprezentację zdarzeń?",
"a": "<p>Centralnym elementem jest czynność łącząca sprawcę i adresata (Janek — pocałował — Marysię), czasem z obiektem (kwiaty). Elementy są zmienne. Reprezentacje są uporządkowane w czasie, zawierają relacje przyczynowo-skutkowe i mają strukturę hierarchiczną (epizody → „Randka” → „Chodzenie ze sobą” → „Relacje interpersonalne”); te same epizody mogą u różnych ludzi trafiać do różnych struktur. Szczególny przypadek: czynność psychiczna, w której sprawca jest adresatem („Grzegorz bił się z myślami”).<\/p>",
"src": "Pytania kontrolne — rozdział 5",
"id": "poznawcza/fiszki:d5d658ab",
"unit": "wyklad-4.html",
"sec": "r5-2"
},
{
"q": "Czym różni się zapamiętywanie w pamięci krótkotrwałej (operacyjnej) od zapamiętywania w pamięci trwałej?",
"a": "<p>Kodowanie w STM jest automatyczne, głównie akustyczne (też wzrokowo-przestrzenne, presemantyczne); w pamięci operacyjnej zapamiętywanie ogranicza pojemność i krótki czas, a zależy od centralnego systemu wykonawczego i powtórek. W pamięci trwałej zapamiętywanie opiera się na analizie znaczenia, kontrola jest dużo większa (strategie, czas), a wynik zależy od organizacji, sensowności, objętości i tempa materiału oraz od pobudzenia emocjonalnego i zgodności ze schematami.<\/p>",
"src": "Pytania kontrolne — rozdział 5",
"id": "poznawcza/fiszki:24dea611",
"unit": "wyklad-4.html",
"sec": "r5-3"
},
{
"q": "Jakie są główne funkcje pamięci operacyjnej i co odróżnia jej podstawowe modele?",
"a": "<p>Pamięć operacyjna to system, w którym wykonuje się bieżące operacje umysłowe — uczenie się, myślenie, rozumowanie („kuźnia myśli”). Model Baddeleya: odrębne komponenty — centralny system wykonawczy, pętla fonologiczna, szkicownik wzrokowo-przestrzenny, bufor epizodyczny; bliski pamięci krótkotrwałej. Model Cowana: pamięć operacyjna to aktywna część pamięci trwałej, bez modułów; ognisko uwagi (ok. 4 elementy) wybiera centralny system, a decyduje nowość i ważność bodźca. Kryterium: relacja do pamięci trwałej i istnienie odrębnych modułów.<\/p>",
"src": "Pytania kontrolne — rozdział 5",
"id": "poznawcza/fiszki:14b22d48",
"unit": "wyklad-4.html",
"sec": "r5-3"
},
{
"q": "W jaki sposób schematy poznawcze wpływają na pamięć trwałą?",
"a": "<p>Nowe informacje są asymilowane do schematów, a schematy akomodowane; system ma stabilizatory. Najlepiej zapamiętujemy informacje umiarkowanie niezgodne ze schematem (Maruszewski — po dwóch tygodniach); całkowicie zgodne nudzą, całkowicie sprzeczne w życiu wywołują silny konflikt afektywny. Hastie: sprzeczne i wyraziste zapamiętujemy najlepiej przy selektywnym zapamiętywaniu. W przekazie seryjnym (Bartlett) treść upraszcza się i dopasowuje do schematów kultury.<\/p>",
"src": "Pytania kontrolne — rozdział 5",
"id": "poznawcza/fiszki:86f1fb18",
"unit": "wyklad-4.html",
"sec": "r5-3"
},
{
"q": "Dlaczego przypominanie i rozpoznawanie są niejednakowo trudne?",
"a": "<p>Według Loftusów przypominanie jest dwufazowe (przeszukanie + rozpoznanie), wymaga więcej operacji i pełniejszej informacji, a przy rozpoznawaniu odpowiedzi są dane z góry — dlatego zwykle rozpoznanie jest łatwiejsze (Haber i Standing, Shepard). Procesy różnie reagują na częstość słów, uczenie zamierzone i strategie. Jednak rozpoznanie bywa trudniejsze (Watkins; Watkins i Tulving), więc Tulving uznaje oba procesy za jednofazowe; różnica leży we wskazówkach (synergistyczne uświadamianie) i w metodach badania.<\/p>",
"src": "Pytania kontrolne — rozdział 5",
"id": "poznawcza/fiszki:1113a02d",
"unit": "wyklad-4.html",
"sec": "r5-odtwarzanie"
},
{
"q": "Opisz cztery teorie zapominania.",
"a": "<p>Rozpad śladu — ślad słabnie z czasem (Waugh i Norman; Baddeley i Scott; Schacter). Interferencja — retroaktywna (nowy materiał zakłóca stary) i proaktywna (stary utrudnia nowy; uwolnienie przy zmianie kategorii — Wickens, Loess). Utrata dostępu — informacja jest w pamięci, ale brak wskazówki („na końcu języka”, specyficzność kodowania). Wyparcie — obrona przed informacjami przykrymi (psychoanaliza; Waldfogel), choć Wagenaar sugeruje raczej wolne kodowanie. Zapominanie jest adaptacyjne (Szereszewski).<\/p>",

"q": "Opisz badanie Sperlinga i jego wnioski.",
"a": "<p>Tachistoskopowa ekspozycja liter (ok. 50–100 ms). W odtwarzaniu całościowym badani podawali 4–5 liter. W technice odtworzenia częściowego ton (wysoki, średni, niski) po ekspozycji wskazywał wiersz do odtworzenia; badani odtwarzali go niemal bezbłędnie, jeśli ton pojawił się do 500 ms po planszy. Wniosek: istnieje pamięć ikoniczna o dużej pojemności i czasie przechowania do ok. 0,5 s; przechowuje cechy fizyczne (położenie, wielkość, barwę).<\/p>",
