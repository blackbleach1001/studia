"q": "Jak można odróżnić procesy poznawcze człowieka od procesów przetwarzania informacji w komputerach?",
"a": "<p>Test Turinga i jego trudności (Penrose). Metafora komputerowa ma ograniczenia: mózg i komputer się uzupełniają (Bolter, 1990). Człowiek stawia cele, realizuje pragnienia, szuka ideałów; procesy poznawcze są służebne wobec podmiotu (Ja robocze). Umysł nie działa sekwencyjnie jak klasyczny komputer — przetwarzanie równoległe i rozproszone; sieć neuronalna działa mimo uszkodzeń, komputer sekwencyjny nie. Neisser: świadomość nie jest oknem na fazę przetwarzania. Procesy ludzkie są aktywne, zależne od kontekstu, emocji i interpretacji.<\/p>",

"q": "Czy fazy procesu pamięciowego mają charakter liniowy, czy cykliczny?",
"a": "<p>Cykliczny. Tulving opisał dziewięć faz w porządku liniowym, ale Maruszewski wyróżnia dwa cykle. Mały cykl: wielokrotne odbieranie informacji powiązanych z wiedzą — rekodowanie, asymilacja lub akomodacja, zmiana walencji (efekt czystej ekspozycji); informacje zdobyte własną eksploracją zapamiętujemy szybciej i trwalej. Duży cykl: zachowanie ujawniające zawartość pamięci samo staje się przedmiotem spostrzegania i kodowania — to sytuacja powtarzania (prawo częstości, prawo Foucault t = k·l²); utrwala też błędy; może uruchamiać się automatycznie (myśli intruzywne, ruminacje).<\/p>",

"a": "<p>Sensoryczna: duża, ok. 18 elementów (więcej niż STM), zależnie od procedury (Sperling ok. 12 liter, Averbach i Coriell więcej); czas ok. 0,5 s. Krótkotrwała: mała — 7 ± 2 kęsy (Miller) lub 80 bitów (Lehrl i Fischer); kilkanaście sekund (15–18 s Petersonowie, 5,4 s Lehrl i Fischer), dłużej dzięki powtórkom. Trwała: praktycznie nieograniczona (185 mld informacji wg Csikszentmihalyiego), czas praktycznie nieograniczony; ograniczeniem jest dostęp i tempo kodowania (0,1–1 bit/s).<\/p>",

"q": "Na czym polega efekt torowania? Podaj przykłady z życia codziennego.",
"a": "<p>Bodziec wcześniejszy modyfikuje (ułatwia lub utrudnia) rozpoznawanie i przetwarzanie bodźca późniejszego; efekt jest niedostępny świadomości. Torowanie automatyczne — bodźce niezwiązane, odstęp kilku sekund; strategiczne — bodźce związane, oparte na oczekiwaniach, efekt nawet po roku. Przykłady: „chleb” ułatwia rozpoznanie „bułka”; zmywanie naczyń przywołuje emocję złej wiadomości usłyszanej przy zmywaniu; projekcja w testach projekcyjnych; reklama.<\/p>",

"src": "Pytania kontrolne — rozdział 5",
"id": "poznawcza/fiszki:2431604b",

"src": "Pytania kontrolne — ćwiczenia 2",

"src": "Pytania kontrolne — ćwiczenia 2",

"proksymalny: w narządzie zmysłu",

},

"src": "Pytania kontrolne — ćwiczenia 2",

"a": "<p>12 znaków w tachistoskopie. W raporcie całościowym badani podawali 4–5 znaków (ok. 35%). W raporcie częściowym (ton wskazuje rząd) — ok. 70%, więc magazyn przechowuje prawie wszystko. Wskazówka przestaje pomagać po ok. 500 ms; w naturalnych warunkach zapis trwa ok. 100 ms. Kod jest sensoryczny.<\/p>",

"a": "<p>Ikoniczny (wzrok): duża pojemność, krótki czas (ok. 100 ms naturalnie, do 1000 ms), przetwarzanie holistyczne i równoległe. Echoiczny (słuch): mniejsza pojemność, ale dłuższe przechowanie (do ok. 4 s; Glucksberg i Cowen), przetwarzanie szeregowe. Oba kodują wyłącznie cechy fizyczne.<\/p>",
"src": "Pytania kontrolne — ćwiczenia 2",

"sec": "c2-oddolne"

"q": "Czym jest przetarg między szybkością a poprawnością i jak wpływa na niego automatyzacja?",
"a": "<p>Pod presją czasu nie można mieć jednocześnie wysokiej szybkości i poprawności; przyspieszenie kosztuje głównie błędy ominięcia. Mechanizm: modele dyfuzyjne, wzrost bazowej aktywacji kory motorycznej (Bogacz). Automatyzacja redukuje przetarg (Szymura i Słabosz).<\/p>",
"src": "Pytania kontrolne — ćwiczenia 3",
"k": [
"presja czasu",
"błędy ominięcia",
"modele dyfuzyjne",
"automatyzacja go redukuje"
],

},
{
"q": "Jakie są stadia automatyzacji i czym jest transfer negatywny?",
"a": "<p>Stadia: poznawcze (zrozumienie instrukcji), asocjacyjne (proceduralizacja, trening jednorodny), autonomiczne (bezwysiłkowe wykonanie). Transfer negatywny: dobrze wyuczona czynność utrudnia podobną, ale nie tożsamą, bo wymaga deproceduralizacji (Woltz i in., 1996).<\/p>",
"src": "Pytania kontrolne — ćwiczenia 3",
"k": [
"poznawcze, asocjacyjne, autonomiczne",
"deproceduralizacja",
"transfer negatywny"
],
"id": "poznawcza/fiszki:dfc38db6",
"unit": "cwiczenia-3.html",
"sec": "c3-automatyzacja"
},
{
"q": "Czym jest hamowanie i dlaczego uważa się je za konstrukt niejednorodny?",
"a": "<p>Mechanizm kontrolny wspomagający selekcję: utrudnia dostęp do informacji irrelewantnych i powstrzymuje niepożądaną aktywność. Niejednorodność: różne wersje Stroopa korelują od 0,22 do −0,13. Przyczyny wg Friedman i Miyake: niska trafność, niska stabilność, brak czystej miary — albo istnieje rodzina mechanizmów. Mózgowo: prawy dolny zakręt czołowy i jądro niskowzgórzowe.<\/p>",
"src": "Pytania kontrolne — ćwiczenia 3",
"k": [
"blokowanie informacji irrelewantnych",
"słabe korelacje testów",
"trafność, stabilność, czystość miary",
"prawy IFG"
],
"id": "poznawcza/fiszki:4093febe",
"unit": "cwiczenia-3.html",
"sec": "c3-hamowanie"
},
{
"q": "Jak mierzy się czas reakcji na sygnał stopu (SSRT)?",
"a": "<p>W 20% prób po bodźcu pojawia się sygnał stopu; jego opóźnienie (start 250 ms) rośnie o 25 ms po udanym zahamowaniu i maleje o 25 ms po nieudanym, aż szansa wyniesie 50%. SSRT = średni czas reakcji w zwykłych próbach − to opóźnienie. Im krótszy, tym skuteczniejsze hamowanie.<\/p>",
"src": "Pytania kontrolne — ćwiczenia 3",
"k": [
"20% prób ze stopem",
"opóźnienie ±25 ms",
"SSRT = RT − opóźnienie",
"krótszy = lepsze hamowanie"
],
"id": "poznawcza/fiszki:b6ff5338",
"unit": "cwiczenia-3.html",
"sec": "c3-dominujaca"
},
{
"q": "Czym różnią się warunki stop-ogólny, stop-zmiana i stop-selektywny (De Jong i in., 1995)?",
"a": "<p>Stop-ogólny: tylko powstrzymać reakcję — wystarczy hamowanie peryferyczne (odcięcie energii ruchu). Stop-zmiana: zahamować i wykonać inną reakcję — o 46 ms dłużej. Stop-selektywny: zahamować tylko jedną rękę — najtrudniejszy (+99 ms). System centralny jest selektywny, peryferyczny nieselektywny.<\/p>",
"src": "Pytania kontrolne — ćwiczenia 3",
"k": [
"stop-ogólny: peryferyczne",
"stop-zmiana: +46 ms",
"stop-selektywny: +99 ms",
"centralne selektywne"
],
"id": "poznawcza/fiszki:c6a5576b",
"unit": "cwiczenia-3.html",
"sec": "c3-dominujaca"
},
{
"q": "Opisz Test flankerów i jego wyniki.",
"a": "<p>Badany reaguje na literę w środku, otoczoną flankerami. Czas reakcji rośnie przy flankerach niezgodnych, tym bardziej, im są podobniejsze do sygnału i bliżej niego; rozsunięcie zmniejsza efekt. Eriksenowie tłumaczą to hamowaniem reakcji na dystraktor (EMG pokazuje aktywację mięśni). Wskaźnik: ERIK.<\/p>",
"src": "Pytania kontrolne — ćwiczenia 3",
"k": [
"litera otoczona flankerami",
"podobieństwo i odległość",
"hamowanie reakcji na dystraktor",
"EMG"
],
"id": "poznawcza/fiszki:65569ffa",
"unit": "cwiczenia-3.html",
"sec": "c3-dystrakcja"
},

"q": "Czym jest poprzedzanie negatywne?",
"a": "<p>Utrudnienie przetwarzania bodźca docelowego wskutek wcześniejszej prymy: gdy to, co przed chwilą tłumiliśmy jako dystraktor, staje się sygnałem, reakcja jest wolniejsza lub bardziej błędna (Neill, Tipper). Efekt trwa ok. 1000–1500 ms, w szczególnych warunkach do 6000 ms.<\/p>",
"src": "Pytania kontrolne — ćwiczenia 3",

"Neill, Tipper"
],

"q": "Jakie rodzaje hamowania wyróżnili Friedman i Miyake (2004) i co z tego wyszło?",
"a": "<p>Hamowanie dominującej reakcji (Stroop), odporność na dystrakcję (flankery), odporność na interferencję proaktywną (Petersonowie, lepiej Tolan i Tehan). Dwa pierwsze korelowały 0,68, więc wyszły dwa czynniki: uwagowy i pamięciowy. Czynnik uwagowy wyjaśniał przerzutność niemal całkowicie (0,91), poprzedzanie negatywne słabo (0,19).<\/p>",
"src": "Pytania kontrolne — ćwiczenia 3",
"k": [
"dominująca reakcja: Stroop",
"dystrakcja: flankery",
"interferencja proaktywna",
"r = 0,68",
"czynnik uwagowy i pamięciowy"
],
"id": "poznawcza/fiszki:4aaedb7f",
"unit": "cwiczenia-3.html",
"sec": "c3-rodzaje"
},

"q": "Jakie dowody przemawiają za tym, że twarz jest bodźcem specyficznym?",
"a": "<p>Prozopagnozja: chorzy nie rozpoznają twarzy, choć rozpoznają inne obiekty i ludzi po głosie czy imieniu (DeRenzi: odróżniają nawet podobne monety). Większa aktywność mózgu dla twarzy i rola prawej półkuli (Sergent i in.), obszar percepcji twarzy w zakręcie wrzecionowatym (Kanwisher), u małp ponad 50 razy większa aktywność neuronów dla twarzy.<\/p>",
"src": "Pytania kontrolne — ćwiczenia 2",

],

"a": "<p>Analityczny — rozkłada obiekt na listę cech, rozpoznaje zwykłe obiekty (teoria cech). Holistyczny — zestawia obraz sensoryczny z umysłowym, rozpoznaje obiekty specjalne, jak twarze (koncepcja modeli).<\/p>",
"src": "Pytania kontrolne — ćwiczenia 2",
"k": [
"analityczny: cechy",
"holistyczny: obrazy",
"twarze — holistyczny"
],

"sec": "c2-twarze"
},
{
"q": "Porównaj koncepcję modeli i koncepcję cech w rozpoznawaniu twarzy.",
"a": "<p>Modele: twarz jako obraz o określonej rozdzielczości, porównywany z obrazem sensorycznym (Ellis); problem odległości i kąta rozwiązuje normalizacja, ale nie problem upływu czasu. Cechy: twarz jako lista cech opisywanych w stałym porządku (włosy, oczy…), najważniejsze oczy; ale za dużo informacji jak na szybki proces i problem zmian z wiekiem. Lepiej uzasadniona jest teoria modeli.<\/p>",
"src": "Pytania kontrolne — ćwiczenia 2",
"k": [
"modele: obraz, normalizacja",
"cechy: lista cech",
"problem czasu",
"modele lepiej uzasadnione"
],

"sec": "c2-twarze"
},
