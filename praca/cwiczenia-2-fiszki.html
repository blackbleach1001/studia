"src": "Schultz, rozdz. 12",
"q": "Jak Schultz definiuje stres i czym są zaburzenia psychosomatyczne?",
"a": "<p><strong>Stres<\/strong>: fizjologiczne i psychologiczne reakcje na niezwykłe, zwykle nieprzyjemne bodźce lub zagrażające wydarzenia w otoczeniu. <strong>Zaburzenia psychosomatyczne<\/strong>: rzeczywiste dolegliwości fizyczne wywołane czynnikami emocjonalnymi, np. stresem w pracy (wrzody, choroba wieńcowa, egzemy, alergie, bóle głowy).<\/p>",

"q": "Na czym polega model ASA Schneidera?",
"a": "<p>Cele założycieli kształtują kulturę i strukturę organizacji, a te decydują, kogo organizacja <strong>przyciąga<\/strong> (attraction), <strong>wybiera<\/strong> (selection) i kto w niej <strong>zostaje<\/strong> (attrition). Skutek: organizacja zachowuje unikalność, a pracownicy z czasem stają się coraz bardziej podobni (<strong>homogenizacja<\/strong>).<\/p>",

{
"src": "Czerw i Czarnota-Bojarska (2016)",
"q": "Jakie postawy wobec pracy wyróżnia się w literaturze i czym różni się praca jako robota, kariera i powołanie?",
"a": "<p>Postawy: <strong>instrumentalna<\/strong> (zaspokajanie potrzeb), <strong>autoteliczna<\/strong> (samorealizacja), <strong>punitywna<\/strong> (praca jako kara, trud), <strong>normatywna<\/strong> (obowiązek wobec społeczeństwa); także etyka pracy Webera. Wrzesniewski: <strong>robota<\/strong> – liczą się korzyści materialne; <strong>kariera<\/strong> – inwestowanie w awans i status; <strong>powołanie<\/strong> – praca nierozerwalna z życiem i wartościami, spełnienie.<\/p>",
"k": [
"instrumentalna, autoteliczna",
"punitywna, normatywna",
"robota, kariera, powołanie"
],

{
"src": "Czerw i Czarnota-Bojarska (2016)",
"q": "Jakie są konsekwencje dopasowania człowiek–organizacja?",
"a": "<p>Wyższa <strong>satysfakcja<\/strong> z pracy, większe <strong>zaangażowanie<\/strong> i <strong>przywiązanie<\/strong> do organizacji, mniejsza chęć odejścia, więcej <strong>zachowań obywatelskich<\/strong> (zwłaszcza przy dopasowaniu suplementarnym). Związek z <strong>wykonaniem pracy<\/strong> jest słaby lub niejednoznaczny. W Polsce ważniejsze jest dopasowanie norm i wartości niż potrzeb.<\/p>",
"k": [
"satysfakcja, zaangażowanie",
"przywiązanie, mniej odejść",
"zachowania obywatelskie",
"słaby związek z wykonaniem"

{
"src": "Czerw i Czarnota-Bojarska (2016)",
"q": "Czym jest job crafting i jakie trzy rodzaje zmian obejmuje?",
"a": "<p>„Przedefiniowanie pracy” (Wrzesniewski i Dutton): aktywne działania pracownika zmieniające sposób postrzegania pracy, by poprawić dopasowanie. Zmiany: <strong>zadań<\/strong> (nowe zadania), <strong>relacji<\/strong> (kontakty z inspirującymi osobami), <strong>postawy poznawczej<\/strong> (dostrzeganie wagi zadań). Skutki: większa satysfakcja i zaangażowanie, mniejsze wypalenie.<\/p>",
"k": [
"redefiniowanie pracy",
"zadania",
"relacje",
"postawa poznawcza"
],

"q": "Czym różni się hedonistyczny od eudajmonistycznego dobrostanu w pracy?",
"a": "<p><strong>Hedonistyczny<\/strong>: emocje w pracy i satysfakcja z pracy (przyjemność, zadowolenie). <strong>Eudajmonistyczny<\/strong>: praca <strong>wartościowa<\/strong> – <strong>ważna<\/strong> (służy osobistym celom) i <strong>sensowna<\/strong> (ma pozaosobisty, logiczny cel). Dobrostan to więcej niż brak stresu czy wypalenia.<\/p>",

"eudajmonistyczny: wartość pracy",

"więcej niż brak ill-being"

{
"src": "Czerw (2017), rozdz. 3",
"q": "Jak opisuje emocje w pracy model kołowy Warra?",
"a": "<p>Emocje opisuje się na dwóch wymiarach: <strong>nieprzyjemność–przyjemność<\/strong> i <strong>rozluźnienie–napięcie<\/strong> (32 emocje w kole). Uproszczona skala (12 emocji) mierzy osie <strong>zalękniony–spokojny<\/strong> i <strong>przygnębiony–entuzjastyczny<\/strong>; oś niezadowolony–zadowolony mierzą skale satysfakcji. Model pomija emocje złożone (duma, wstyd, wina).<\/p>",
"k": [
"przyjemność × napięcie",
"zalękniony–spokojny",
"przygnębiony–entuzjastyczny",
"brak emocji złożonych"
],

{
"src": "Czerw (2017), rozdz. 3",
"q": "Czym jest satysfakcja z pracy i od czego zależy?",
"a": "<p>Postawa wobec pracy z aspektem poznawczym (ocena) i emocjonalnym (nastrój) (Zalewska). Zależy od cech pracy – <strong>model Hackmana i Oldhama<\/strong>: różnorodność umiejętności, tożsamość zadań, znaczenie zadań, autonomia, informacje zwrotne – oraz od cech pracownika i kultury. Suma ocen aspektów słabo koreluje z oceną ogólną (różne wagi).<\/p>",
"k": [
"poznawcza + emocjonalna",
"Hackman i Oldham: 5 cech pracy",
"cechy pracownika, kultura",
"problem wag aspektów"
],

{
"src": "Czerw (2017), rozdz. 3",
"q": "Jak definiuje się zaangażowanie w pracę i od czego ono zależy?",
"a": "<p>Schaufeli i Bakker: pozytywny stan umysłu – <strong>wigor<\/strong>, <strong>oddanie<\/strong>, <strong>absorpcja<\/strong> (pomiar: UWES); ujemnie związany z wypaleniem, ale odrębny. Maslach i Leiter: przeciwieństwo wypalenia (energia, zaabsorbowanie, skuteczność). Kahn: identyfikacja z rolą. Zależy od zasobów osobistych (proaktywność, optymizm) i organizacyjnych – <strong>model JD-R<\/strong> (wymagania vs zasoby pracy).<\/p>",
"k": [
"wigor, oddanie, absorpcja",
"UWES",
"odrębne od wypalenia",
"JD-R: wymagania i zasoby"
],
