{
"src": "Schultz, rozdz. 12",
"q": "Jak Schultz definiuje stres i czym są zaburzenia psychosomatyczne?",
"a": "<p><strong>Stres<\/strong>: fizjologiczne i psychologiczne reakcje na niezwykłe, zwykle nieprzyjemne bodźce lub zagrażające wydarzenia w otoczeniu. <strong>Zaburzenia psychosomatyczne<\/strong>: rzeczywiste dolegliwości fizyczne wywołane czynnikami emocjonalnymi, np. stresem w pracy (wrzody, choroba wieńcowa, egzemy, alergie, bóle głowy).<\/p>",
"k": [
"reakcje fizjologiczne i psychologiczne",
"bodźce niezwykłe, zagrażające",
"psychosomatyka: realne uszkodzenia",
"podłoże emocjonalne"
],
"id": "praca/cwiczenia-2-fiszki:1d478e20",
"unit": "cwiczenia-2.html",
"sec": "s1"
},
{
"src": "Schultz, rozdz. 12",
"q": "Dlaczego kontrola nad pracą chroni przed skutkami stresu? Podaj przykłady badań.",
"a": "<p>Kontrola i satysfakcja buforują stres. Dyrektorzy mają o 40% mniej zawałów niż kadra średnia (autonomia). Karasek: praca o wysokim stresie i małej kontroli → zawał 2–3 razy częściej. U kontrolerów lotów szkody pojawiają się głównie u niezadowolonych z pracy. Utrata kontroli szkodzi bardziej niż jej brak od początku.<\/p>",
"k": [
"dyrektorzy: mniej zawałów",
"Karasek: wysokie wymagania + mała kontrola",
"satysfakcja chroni",
"utrata kontroli najgorsza"
],
"id": "praca/cwiczenia-2-fiszki:391a26b6",
"unit": "cwiczenia-2.html",
"sec": "s2"
},
{
"src": "Schultz, rozdz. 12",
"q": "Czym różni się typ osobowości A od typu B i co z nim wiąże się najsilniej?",
"a": "<p><strong>Typ A<\/strong>: rywalizacja, presja czasu, niecierpliwość, agresja, wrogość, potrzeba osiągnięć; większe ryzyko chorób serca. <strong>Typ B<\/strong>: może być równie ambitny, ale doświadcza mniej stresu. Metaanaliza 87 badań: z chorobami serca najsilniej wiążą się <strong>złość, wrogość i depresja<\/strong>. Złożona praca u typu A korelowała z chorobą wieńcową.<\/p>",
"k": [
"A: rywalizacja, presja czasu, wrogość",
"B: mniej stresu",
"kluczowa wrogość i negatywne emocje",
"złożona praca szkodzi typowi A"
],
"id": "praca/cwiczenia-2-fiszki:ee89d762",
"unit": "cwiczenia-2.html",
"sec": "s3"
},
{
"src": "Schultz, rozdz. 12",
"q": "Czym jest twardość psychiczna i jakie ma składniki?",
"a": "<p>Cecha osobowości (Kobasa) wyjaśniająca różnice w odporności na stres: przekonanie o panowaniu nad wydarzeniami. Składniki: <strong>kontrola, zaangażowanie, wyzwanie<\/strong> (zmiana jako coś ekscytującego, nie zagrażającego). Twardzi rzadziej chorują w stresie, lepiej tolerują frustrację.<\/p>",
"k": [
"kontrola",
"zaangażowanie",
"wyzwanie",
"mniej dolegliwości"
],
"id": "praca/cwiczenia-2-fiszki:20d2328a",
"unit": "cwiczenia-2.html",
"sec": "s3"
},
{
"src": "Schultz, rozdz. 12",
"q": "Jak umiejscowienie kontroli, samoocena oparta na organizacji i negatywny afekt wpływają na stres?",
"a": "<p><strong>Wewnętrzne umiejscowienie kontroli<\/strong> (wydarzenia zależą ode mnie) zmniejsza stres; zewnętrzne (szczęście, przypadek) go zwiększa. Wysoka <strong>samoocena oparta na organizacji<\/strong> (poczucie bycia odpowiednim i wartościowym w pracy) chroni. <strong>Negatywny afekt<\/strong> (uogólnione niezadowolenie, koncentracja na negatywach, bliski neurotyczności) zwiększa odczuwany stres.<\/p>",
"k": [
"wewnętrzne LOC chroni",
"samoocena oparta na organizacji",
"negatywny afekt ~ neurotyczność",
"wyższy stres"
],
"id": "praca/cwiczenia-2-fiszki:4219da9f",
"unit": "cwiczenia-2.html",
"sec": "s3"
},
{
"src": "Schultz, rozdz. 12",
"q": "Jak praca i życie rodzinne wpływają na siebie i jak organizacja może pomóc?",
"a": "<p>Konflikt praca–rodzina wiąże się z depresją, gorszym zdrowiem i alkoholem; zwykle praca bardziej utrudnia życie rodzinne niż odwrotnie; złe nastroje przenoszą się w obie strony. Kobiety częściej pracują na „dwa etaty”. Pomagają: <strong>elastyczna organizacja pracy i wsparcie przełożonego<\/strong> (więcej kontroli), opieka nad dziećmi w pracy, ruchomy czas, telepraca, niepełny etat.<\/p>",
"k": [
"konflikt ról → depresja, zdrowie",
"praca utrudnia rodzinę bardziej",
"elastyczność i wsparcie szefa",
"telepraca, niepełny etat"
],
"id": "praca/cwiczenia-2-fiszki:357b1f9e",
"unit": "cwiczenia-2.html",
"sec": "s4"
},
{
"src": "Schultz, rozdz. 12",
"q": "Czym różni się przeciążenie ilościowe, jakościowe i niedociążenie pracą?",
"a": "<p><strong>Przeciążenie ilościowe<\/strong>: za dużo pracy w danym czasie (ważna kontrola nad tempem). <strong>Jakościowe<\/strong>: praca zbyt trudna wobec kompetencji. <strong>Niedociążenie<\/strong>: praca zbyt prosta, niewypełniająca czasu, niewykorzystująca kompetencji – monotonia obniża satysfakcję i zwiększa zwolnienia. Istnieje optymalny poziom stresu.<\/p>",
"k": [
"ilościowe: za dużo",
"jakościowe: za trudne",
"niedociążenie: monotonia",
"optymalny poziom stresu"
],
"id": "praca/cwiczenia-2-fiszki:93da9818",
"unit": "cwiczenia-2.html",
"sec": "s5"
},
{
"src": "Schultz, rozdz. 12",
"q": "Czym jest niejednoznaczność roli i konflikt roli?",
"a": "<p><strong>Niejednoznaczność roli<\/strong>: obowiązki słabo ustrukturalizowane lub niezdefiniowane; składniki: niejednoznaczność kryteriów oceny, metod pracy i schematów (koordynacji zadań); szczególnie u młodych pracowników. <strong>Konflikt roli<\/strong>: niespójne wymagania wobec pracy albo wymagania sprzeczne z wartościami pracownika.<\/p>",
"k": [

"kryteria, metody, schematy",
"konflikt: niespójne wymagania",
"lub sprzeczne z wartościami"

"sec": "s5"

{
"src": "Schultz, rozdz. 12",
"q": "Czym są masowe dolegliwości o podłożu psychologicznym?",
"a": "<p>Potocznie „histeria taśmy produkcyjnej”: objawy fizyczne (zawroty głowy, nudności, duszności) gwałtownie rozprzestrzeniające się w grupie pracowników bez fizycznej przyczyny. Częściej u kobiet; wywołują je stresory fizyczne (hałas, tempo) i psychologiczne (presja, złe relacje z przełożonymi, izolacja społeczna).<\/p>",
"k": [
"histeria taśmy produkcyjnej",
"rozprzestrzeniają się w grupie",
"brak przyczyny fizycznej",
"presja i izolacja"
],

"unit": "cwiczenia-2.html",
"sec": "s6"

{
"src": "Schultz, rozdz. 12",
"q": "Czym różni się zdrowy pracoholizm od niezdrowego?",
"a": "<p>Pracoholizm to uzależnienie od pracy wywołane niepokojem, niepewnością lub atrakcyjnością pracy (ok. 5%). <strong>Zdrowi<\/strong> („entuzjaści”) są zaangażowani i czerpią dużo satysfakcji. <strong>Niezdrowi<\/strong> są zaangażowani bez satysfakcji, pod wewnętrznym przymusem; mają wyższy stres i gorsze zdrowie, szkodzą firmie (sztywność, nierealne standardy, problem z delegowaniem).<\/p>",
"k": [
"zdrowi: zaangażowanie + satysfakcja",
"niezdrowi: przymus, brak satysfakcji",
"wyższy stres",
"problem z delegowaniem"
],
"id": "praca/cwiczenia-2-fiszki:e9fc857f",
"unit": "cwiczenia-2.html",
"sec": "s6"
},
{
"src": "Schultz, rozdz. 12",
"q": "Jakie działania organizacji zmniejszają stres w pracy?",
"a": "<p>Kontrolowanie <strong>klimatu<\/strong> (udział w decyzjach przy zmianach), <strong>zapewnianie kontroli<\/strong> (wzbogacanie i rozszerzanie pracy), <strong>definiowanie ról<\/strong>, eliminowanie przeciążenia i niedociążenia (selekcja, szkolenia, podział pracy), <strong>EAP<\/strong> – programy wspierania pracowników, <strong>wsparcie społeczne<\/strong> (szczególnie przełożonych).<\/p>",
"k": [
"klimat i udział w decyzjach",
"kontrola, definiowanie ról",
"eliminacja przeciążenia",
"EAP, wsparcie społeczne"
],

"sec": "s7"

{
"src": "Schultz, rozdz. 12",
"q": "Na czym polegają trening relaksacyjny, biofeedback i modyfikacja zachowań?",
"a": "<p><strong>Trening relaksacyjny<\/strong>: koncentracja na relaksowaniu kolejnych części ciała (odmiany: trening autogenny, medytacja). <strong>Biofeedback<\/strong>: elektroniczne monitorowanie procesów fizjologicznych z sygnałem zwrotnym, by nauczyć się kontrolować napięcie mięśni, ciśnienie, fale mózgowe. <strong>Modyfikacja zachowań<\/strong>: wzmacnianie nagrodami zachowań pożądanych (np. u typu A).<\/p>",
"k": [
"relaksacja części ciała",
"biofeedback: sprzężenie zwrotne",
"modyfikacja: nagradzanie zachowań"

"q": "Jakie są trzy wymiary wypalenia zawodowego według Maslach?",

"q": "Jakie sześć obszarów niedopasowania człowieka i pracy prowadzi do wypalenia?",

"q": "Gdzie Maslach i Leiter widzą przyczynę wypalenia i jaką proponują receptę?",
"a": "<p>Przyczyna leży w <strong>otoczeniu społecznym pracy<\/strong> – strukturze i funkcjonowaniu miejsca pracy – a nie w słabości jednostki. Wypalenie to barometr dysfunkcji społecznej w organizacji. Recepta: zmiana <strong>organizacji<\/strong>, <strong>prewencja<\/strong> zamiast terapii, budowanie <strong>zaangażowania<\/strong> w pracę, model zdrowej organizacji.<\/p>",

"q": "Czego uczy przypadek Julii?",
"a": "<p>Znakomita nauczycielka odchodzi z zawodu: wypalenie zaczęło się z pozycji <strong>siły i sukcesu<\/strong>, nie słabości. Wystąpiło 6 obszarów niedopasowania (przeciążenie, brak kontroli nad polityką szkoły, niska płaca, niesprawiedliwość, konflikty w gronie, konflikt wartości). Najwyższy koszt wypalenia to utrata najlepszych pracowników.<\/p>",

{
"src": "Maslach i Leiter, rozdz. 2",
"q": "Dlaczego emocje są kluczem do zrozumienia wypalenia?",
"a": "<p>Emocje są <strong>wskaźnikiem i mediatorem<\/strong> przemiany zaangażowania w wypalenie. Frustracja i gniew prowadzą do cynizmu i szukania kozła ofiarnego, wrogość – do sabotażu, lęk – do gorszej pracy; brakuje emocji pozytywnych. Emocje są <strong>społeczne<\/strong>: wrogość rodzi wrogość, więc wypalenie jest zaraźliwe i tworzy spiralę.<\/p>",

{
"src": "Maslach i Leiter, rozdz. 2",
"q": "Dlaczego obwinianie jednostki za wypalenie jest według autorów błędem? Czym jest efekt kaskadowy?",
"a": "<p>Pogląd, że wypaleni są słabi, przewrażliwieni lub chorzy, ignoruje kontekst; przełożony przypisuje spadek wydajności lenistwu, a pracownik – okolicznościom. Wypalenie to <strong>problem zawodowy<\/strong>, nie wada charakteru. <strong>Efekt kaskadowy<\/strong>: cięcia na wyższych poziomach przenoszą presję w dół, aż do pracowników pierwszej linii, którzy są najbardziej narażeni.<\/p>",
