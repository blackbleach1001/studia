","n":4,"g":"z1","q":"Ile osób liczy koło jakości?","open":"5–10 osób."},{"id":"o5","n":5,"g":"z1","q":"Czym jest klimat organizacyjny wobec kultury według Lipińskiej-Grobelny: synonimem, antonimem czy składnikiem?","open":"Składnikiem kultury organizacyjnej."},{"id":"o6","n":6,"g":"z2","q":"Jaki odsetek badanych przez Morse’a i Weissa (1955) pracowałby dalej, gdyby nie musiał pracować dla pieniędzy?","open":"80%."},{"id":"o7","n":7,"g":"z2","q":"Jakie trzy składniki tworzą zaangażowanie w pracę według Schaufelego?","open":"Wigor, oddanie i absorpcja (zaabsorbowanie)."},{"id":"o8","n":8,"g":"z2","q":"Ile razy wzrastało ryzyko zgonu z powodu zawału po przejściu z pracy z kontrolą do pracy bez kontroli (badanie szwedzkie)?","open":"Trzykrotnie."},{"id":"o9","n":9,"g":"z2","q":"Jaki odsetek pracowników stanowią pracoholicy według Schultzów?","open":"Około 5%."},{"id":"o10","n":10,"g":"z2","q":"Który zawód okazał się najmniej stresujący w rankingu 130 zawodów?","open":"Profesor college’u."},{"id":"o11","n":11,"g":"z2","q":"Jakie dwie osie ma uproszczony kołowy model dobrostanu emocjonalnego Warra?","open":"Zalękniony–spokojny oraz entuzjastyczny–przygnębiony."},{"id":"p1","n":1,"g":"p1","q":"Znanym prekursorem psychologii pracy i organizacji był:","a":["Münsterberg H.","Stumpf C.","Brentano F.","Fechner G. T."],"c":0,"e":"Warianty: prekursorem jest też Scott W. D., Gilbreth L. M. oraz Berliner A. Pozostałe nazwiska (Stumpf, Brentano, Fechner, Wundt) to psychologia ogólna."},{"id":"p2","n":2,"g":"p1","q":"Wśród prekursorów psychologii pracy i organizacji wymienia się (wariant z Wundtem):","a":["Wundta W.","Berliner A.","Stumpfa C.","Fechnera G. T."],"c":1,"f":"niepewne"},{"id":"p3","n":3,"g":"p1","q":"Jedną z pierwszych selekcji i klasyfikacji poborowych dla armii w XX wieku prowadził zespół:","a":["Lillian M. Gilbreth","Waltera Dilla Scotta","Fredericka W. Taylora","Hugo Münsterberga"],"c":1,"f":"niepewne"},{"id":"p4","n":4,"g":"p1","q":"Jedno z pierwszych badań longitudinalnych (badania Hawthorne) prowadził na początku XX wieku zespół:","a":["Taylora F. w zakładach Forda","Gantta H. w zakładach Forda","Mayo E. w zakładach Western Electric","Maslowa A. w zakładach Western Electric"],"c":2},{"id":"p5","n":5,"g":"p1","q":"Badania pod kierunkiem Eltona Mayo (Hawthorne) obaliły główne założenia:","a":["paradygmatu psychologii stosunków międzyludzkich","paradygmatu klasycznego (klasycznej szkoły zarządzania)","paradygmatu dostosowania pracy do człowieka","żadna odpowiedź nie jest prawidłowa"],"c":1,"e":"Hawthorne podważyły szkołę klasyczną i stały się punktem wyjścia szkoły human relations."},{"id":"p6","n":6,"g":"p1","q":"Badania w Hawthorne stały się punktem wyjścia dla stworzenia:","a":["klasycznej szkoły zarządzania","szkoły behawioralnej","szkoły human relations","szkoły ilościowej"],"c":2},{"id":"p7","n":7,"g":"p1","q":"Zasady naukowej organizacji pracy obejmowały:","a":["zalecenia dla kierownictwa w zakresie szkolenia","zalecenia dla pracowników, jak adaptować się do pracy","opracowanie każdego elementu pracy, podział pracy i odpowiedzialności oraz instruktaż stanowiskowy","zalecenia dla projektantów pojedynczego stanowiska"],"c":2},{"id":"p8","n":8,"g":"p1","q":"Naukowe zarządzanie to pojęcie:","a":["o polskich korzeniach","podkreślające konieczność precyzyjnego pomiaru zachowań w pracy","tożsame z XIX-wieczną psychologią zarządzania","stawiające na równi zadania i relacje"],"c":1},{"id":"p9","n":9,"g":"p1","q":"Pojęcie „tayloryzmu” wiąże się z:","a":["postacią Eltona Mayo","stosowaniem testów i kwestionariuszy","szczególnym naciskiem na wydajność pracy","stosowaniem wywiadów w badaniach"],"c":2},{"id":"p10","n":10,"g":"p1","q":"Standaryzacja i wynagrodzenie finansowe to kluczowe wymiary:","a":["naukowego zarządzania","funkcjonalizmu w zarządzaniu","introspekcjonizmu w zarządzaniu","psychologii zarządzania"],"c":0},{"id":"p11","n":11,"g":"p1","q":"Karol Adamiecki w swoim ujęciu naukowego zarządzania (w odróżnieniu od klasycznego):","a":["stosował pomiar czasów czynności i ruchów","wprowadził pojęcie harmonizacji","kładł szczególny nacisk na wydajność","podkreślał konieczność tzw. zmiany społecznej"],"c":1},{"id":"p12","n":12,"g":"p1","q":"Józefa Joteyko zasłużyła się w obszarze:","a":["wszystkie odpowiedzi są prawidłowe","fizjologii pracy","propagowania metod psychotechnicznych","psychologii doświadczalnej"],"c":0},{"id":"p13","n":13,"g":"p1","q":"Wkładem funkcjonalizmu do psychologii biznesu jest wprowadzenie diagnozy przy pomocy:","a":["obserwacji","eksperymentu","testów","wszystkie odpowiedzi są prawdziwe"],"c":2},{"id":"p14","n":14,"g":"p1","q":"Zjawisko spowolnienia pracy to:","a":["konsekwencja metod naukowego zarządzania","negatywne obniżanie przez pracowników wydajności na skutek wadliwego zarządzania","pozytywny przejaw dostosowania pracy do pracownika","kompensowanie sobie niskich zarobków"],"c":1},{"id":"p15","n":15,"g":"p1","q":"W psychologii pracy (w przeciwieństwie do psychologii organizacji):","a":["wszystkie odpowiedzi są prawidłowe","przyjmuje się perspektywę doradztwa zawodowego","kluczowe jest dopasowanie człowiek–praca","analizuje się zjawiska dehumanizacji pracy"],"c":0,"f":"niepewne"},{"id":"p16","n":16,"g":"p1","q":"Wspólną cechą psychologii pracy i psychologii organizacji jest:","a":["perspektywa doradztwa zawodowego","pojęcie dopasowania człowiek–praca","skupienie się na patologiach","żadna odpowiedź nie jest prawidłowa"],"c":3,"e":"Spójne z pytaniem wyżej: te trzy cechy przypisuje się psychologii pracy, nie obu.","f":"niepewne"},{"id":"p17","n":17,"g":"p1","q":"Głównym przedmiotem zainteresowań psychologii pracy i organizacji jest:","a":["władza i sposoby jej osiągania","minimalizowanie kosztów osobistych","osiąganie celów osobistych","zachowanie człowieka w konkretnych warunkach aktywności zawodowej"],"c":3},{"id":"p18","n":18,"g":"p1","q":"Obszar wspólnych zainteresowań psychologów, architektów, inżynierów, lekarzy i socjologów w projektowaniu pracy dotyczy:","
