ostan hedonistyczny to emocje i satysfakcja z pracy. Ważność i sensowność to perspektywa eudajmonistyczna (Czerw, 2017)."},{"id":"o1","n":1,"g":"z1","q":"Z czyim nazwiskiem Hofstede wiąże zasadę relatywizmu kulturowego?","open":"Claude Lévi-Strauss."},{"id":"o2","n":2,"g":"z1","q":"Które trzy warstwy „cebuli” Hofstede łączy pod nazwą praktyk?","open":"Symbole, bohaterowie i rytuały."},{"id":"o3","n":3,"g":"z1","q":"Przez ile pierwszych lat życia, według Hofstedego, trwa okres szybkiego, w dużej mierze nieświadomego przyswajania wartości?","open":"Przez pierwsze 10–12 lat."},{"id":"o4","n":4,"g":"z1","q":"Ile osób liczy koło jakości?","open":"5–10 osób."},{"id":"o5","n":5,"g":"z1","q":"Czym jest klimat organizacyjny wobec kultury według Lipińskiej-Grobelny: synonimem, antonimem czy składnikiem?","open":"Składnikiem kultury organizacyjnej."},{"id":"o6","n":6,"g":"z2","q":"Jaki odsetek badanych przez Morse’a i Weissa (1955) pracowałby dalej, gdyby nie musiał pracować dla pieniędzy?","open":"80%."},{"id":"o7","n":7,"g":"z2","q":"Jakie trzy składniki tworzą zaangażowanie w pracę według Schaufelego?","open":"Wigor, oddanie i absorpcja (zaabsorbowanie)."},{"id":"o8","n":8,"g":"z2","q":"Ile razy wzrastało ryzyko zgonu z powodu zawału po przejściu z pracy z kontrolą do pracy bez kontroli (badanie szwedzkie)?","open":"Trzykrotnie."},{"id":"o9","n":9,"g":"z2","q":"Jaki odsetek pracowników stanowią pracoholicy według Schultzów?","open":"Około 5%."},{"id":"o10","n":10,"g":"z2","q":"Który zawód okazał się najmniej stresujący w rankingu 130 zawodów?","open":"Profesor college’u."},{"id":"o11","n":11,"g":"z2","q":"Jakie dwie osie ma uproszczony kołowy model dobrostanu emocjonalnego Warra?","open":"Zalękniony–spokojny oraz entuzjastyczny–przygnębiony."}],"dir":"praca"}</script>
