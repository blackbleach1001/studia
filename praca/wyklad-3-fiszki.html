"id": "praca/wyklad-3-fiszki:bf75ee6b",
"unit": "wyklad-3.html",
"sec": "s7"
},
{
"q": "Jakie dwa mechanizmy podtrzymują iluzję odporności na reklamy?",
"a": "<p><strong>Racjonalizacja<\/strong> („ona kupuje pod wpływem reklamy, a ja na spróbowanie”) i <strong>pamięć źródła informacji<\/strong>: pamiętamy treść, ale nie to, że pochodzi z reklamy (Johnson i in., 1993).<\/p>",
"src": "Wykład 3: mechanizmy reklamy",
"k": [
"racjonalizacja",
"pamięć źródła (source monitoring)"
],
"id": "praca/wyklad-3-fiszki:4744120a",
"unit": "wyklad-3.html",
"sec": "s7"
},
{
"q": "Jak Aaker (1991) definiuje wartość marki?",
"a": "<p>Zestaw <strong>aktywów i zobowiązań<\/strong> (cech) powiązanych z marką, jej nazwą i symbolem, które <strong>dodają lub odejmują wartość<\/strong> produktu lub usługi.<\/p>",
"src": "Wykład 3: mechanizmy reklamy",
"k": [
"aktywa i zobowiązania marki",
"powiązane z nazwą i symbolem",
"dodają lub odejmują wartość"
],
"id": "praca/wyklad-3-fiszki:5daabc20",
"unit": "wyklad-3.html",
"sec": "s8"
},
{
"q": "Wymień platformy współpracy marek tworzące wspólną wartość marki.",
"a": "<p>Sponsoring, udział <strong>celebrytów<\/strong>, udział <strong>influencerów<\/strong>, <strong>lokowanie produktu<\/strong>, <strong>co-branding<\/strong>, człowiek jako marka, marketing terytorialny (Cornwell i in., 2022).<\/p>",
"src": "Wykład 3: mechanizmy reklamy",
"k": [
"sponsoring",
"celebryci i influencerzy",
"lokowanie produktu",
"co-branding",
"human branding i place branding"
],
"id": "praca/wyklad-3-fiszki:1b4aaa81",
"unit": "wyklad-3.html",
"sec": "s8"
},
{
"q": "Czym jest współdzielona wartość marki?",
"a": "<p>Stopniem, w jakim <strong>wiedza semantyczna i skojarzeniowa<\/strong> między markami jest powiązana, <strong>szeroko reprezentowana w społeczności językowej<\/strong> i wpływa na reakcje na markę (oczekiwania, poglądy, decyzje).<\/p>",
"src": "Wykład 3: mechanizmy reklamy",
"k": [
"powiązana wiedza skojarzeniowa marek",
"reprezentowana w społeczności",
"wpływa na reakcje na markę"
],
"id": "praca/wyklad-3-fiszki:918f335c",
"unit": "wyklad-3.html",
"sec": "s8"
},
{
"q": "Jakie fazy ma model budowania współdzielonej wartości marki (Cornwell i in.)?",
"a": "<p>(1) <strong>Rozpoczęcie partnerstwa<\/strong>: nakładające się skojarzenia partnerów; (2) <strong>rozwój wspólnej wartości<\/strong>: działania budujące i osłabiające, moderowane czasem trwania i zdarzeniami afektywnymi; (3) <strong>kontynuacja albo zakończenie<\/strong>, po którym zostaje <strong>rezydualna<\/strong> wspólna wartość.<\/p>",
"src": "Wykład 3: mechanizmy reklamy",
"k": [
"rozpoczęcie: nakładające się skojarzenia",
"rozwój: działania budujące i osłabiające",
"zakończenie: wartość rezydualna"
],
"id": "praca/wyklad-3-fiszki:aa2db965",
"unit": "wyklad-3.html",
"sec": "s8"
},
{
"q": "Co zakłada sieciowy model pamięci Andersona (1983)?",
"a": "<p>Jednostki poznawcze (<strong>węzły<\/strong>) tworzą <strong>sieć<\/strong>, a połączenia między nimi mają <strong>różną siłę<\/strong>.<\/p>",
"src": "Wykład 3: mechanizmy reklamy",
"k": [
"węzły tworzą sieć",
"połączenia o różnej sile"
],
"id": "praca/wyklad-3-fiszki:812f1d5b",
"unit": "wyklad-3.html",
"sec": "s9"
},
{
"q": "Kiedy według modeli sieciowych marka jest silna?",
"a": "<p>Gdy ma <strong>silne, liczne i pozytywne<\/strong> skojarzenia.<\/p>",
"src": "Wykład 3: mechanizmy reklamy",
"k": [
"silne",
"liczne",
"pozytywne"
],
"id": "praca/wyklad-3-fiszki:ead12a8e",
"unit": "wyklad-3.html",
"sec": "s9"
},
{
"q": "Jakie znaczenie dla reklamy mają przenoszenie i wspólne skojarzenia?",
"a": "<p><strong>Przenoszenie skojarzeń<\/strong> może służyć <strong>nieuczciwej konkurencji<\/strong>; <strong>wspólne skojarzenia<\/strong> dają <strong>wzajemne wzmacnianie<\/strong> marek współpracujących; rozbudowa sieci w kampaniach wpływa na świadomość konsumencką.<\/p>",
"src": "Wykład 3: mechanizmy reklamy",
"k": [
"przenoszenie: nieuczciwa konkurencja",
"wspólne: wzajemne wzmacnianie",
"rozbudowa sieci a świadomość konsumencka"
],
"id": "praca/wyklad-3-fiszki:eabb70e4",
"unit": "wyklad-3.html",
"sec": "s9"
},
{
"q": "Co pokazuje przykład sieci skojarzeń z Coca-Colą?",
"a": "<p>Marka ma węzły <strong>negatywne<\/strong> (niezdrowa, chemia, choroba) i <strong>pozytywne<\/strong> (radość, ekscytacja, rodzina, święta, Mikołaj). Kampanie <strong>wzmacniają pozytywne węzły<\/strong> i ich połączenia z marką.<\/p>",
"src": "Wykład 3: mechanizmy reklamy",
"k": [
"węzły negatywne",
"węzły pozytywne (radość, święta)",
"kampanie wzmacniają pozytywne"
],
"id": "praca/wyklad-3-fiszki:087ea61f",
"unit": "wyklad-3.html",
"sec": "s9"
},
{
"q": "Czym różni się co-branding od co-marketingu?",
"a": "<p><strong>Co-branding<\/strong>: marki łączą potencjał i tworzą <strong>wspólny produkt<\/strong> (np. ONLYBIO × E.Wedel). <strong>Co-marketing<\/strong>: wspólne działania marketingowe <strong>bez nowego produktu<\/strong> (np. Disney i Delta).<\/p>",
"src": "Wykład 3: mechanizmy reklamy",
"k": [
"co-branding: wspólny produkt",
"co-marketing: wspólne działania bez produktu"
],
"id": "praca/wyklad-3-fiszki:6b4d5171",
"unit": "wyklad-3.html",
"sec": "s10"
},
{
"q": "Jak w badaniu spójności marek mierzono siłę i podobieństwo skojarzeń?",
"a": "<p>Siła zależy od <strong>pozycji skojarzenia<\/strong> (pierwsze najsilniejsze; Szalay i Deese). Podobieństwo liczono <strong>modelem proporcji Tverskiego<\/strong>: siła wspólnych skojarzeń przez sumę sił skojarzeń obu marek (Iga i Oshee: 264 / (431 + 391) = 0,32).<\/p>",
"src": "Wykład 3: mechanizmy reklamy",
"k": [
"siła wg pozycji skojarzenia",
"model proporcji Tverskiego",
"wspólne przez sumę obu marek"
],
"id": "praca/wyklad-3-fiszki:c392e4c1",
"unit": "wyklad-3.html",
"sec": "s10"
},
{
"q": "Jakie wnioski płyną z badań reklam łączących markę z osobą znaną lub inną marką?",
"a": "<p>Marki <strong>przenoszą skojarzenia<\/strong> (i afekt) między sobą; trzeba <strong>kontrolować siłę i rodzaj<\/strong> skojarzeń; wspólna reklama nie zawsze służy obu markom (np. Semilac z Wedlem oceniany jako mniej stabilny).<\/p>",
"src": "Wykład 3: mechanizmy reklamy",
"k": [
"przenoszenie skojarzeń i afektu",
"kontrola siły i rodzaju skojarzeń",
"nie zawsze korzystne dla obu"
],
"id": "praca/wyklad-3-fiszki:7e7e380d",
"unit": "wyklad-3.html",
"sec": "s10"
},
{
"q": "Czym jest reklama natywna?",
"a": "<p>Płatna reklama <strong>wtopiona w treść<\/strong> platformy: spójna z jej treścią, układem i stylem, przez co odbiorca uważa, że do niej <strong>należy<\/strong>; nie jest inwazyjna.<\/p>",
"src": "Wykład 3: mechanizmy reklamy",
"k": [
"płatna reklama wtopiona w treść",
"wygląda jak część platformy",
"nieinwazyjna"
],
"id": "praca/wyklad-3-fiszki:0faa1f77",
"unit": "wyklad-3.html",
"sec": "s11"
},
{
"q": "Co dzieje się, gdy konsument rozpozna reklamę natywną?",
"a": "<p>Uruchamia się <strong>wiedza o perswazji<\/strong>; spada <strong>wiarygodność<\/strong> i nastawienie do marki, ale rośnie <strong>chęć podzielenia się<\/strong> treścią. Wraz ze wzrostem wiedzy o reklamie natywnej jej <strong>efektywność spada<\/strong>.<\/p>",
"src": "Wykład 3: mechanizmy reklamy",
"k": [
"model wiedzy o perswazji",
"spadek wiarygodności",
"większa chęć dzielenia się",
"skuteczność spada z wiedzą"
],
"id": "praca/wyklad-3-fiszki:c04a7ca9",
"unit": "wyklad-3.html",
"sec": "s11"
},
{
