"q": "Jak Hofstede definiuje kulturę i skąd się ona bierze?",

"q": "Czym są wartości według Hofstedego i jak się je bada?",

{

"q": "Czym różni się kultura organizacyjna od klimatu organizacyjnego?",
"a": "<p>Według Grzywacza kultura jest <strong>głęboka, podświadoma, abstrakcyjna, zbiorowa<\/strong>, istnieje przez symbole, historie i mity, które spajają organizację. Klimat jest <strong>powierzchowny, świadomy, konkretny, indywidualny<\/strong> – to sposób postrzegania przez pracownika dążeń, procedur i wzorów zachowań. Klimat nie jest ani synonimem, ani antonimem kultury, tylko jednym z jej składników.<\/p>",

{

"q": "Jak klimat organizacyjny definiują Kolb, Borucki i Paluchowski?",
"a": "<p><strong>Kolb<\/strong>: zbiór subiektywnie spostrzeganych cech sytuacji, które kształtują motywy zachowań. <strong>Borucki<\/strong>: indywidualna mapa percepcyjno-poznawcza sytuacji organizacyjnej. <strong>Paluchowski<\/strong>: zespół zjawisk kształtowanych przez czynniki rynkowe (zewnętrzne) oraz kulturowe i organizacyjne (wewnętrzne), które blokują lub ułatwiają działania pracowników.<\/p>",

{

"q": "Jak wymiary Hofstedego przekładają się na organizację?",
"a": "<p><strong>Dystans władzy<\/strong>: na ile pracownicy akceptują formalną hierarchię. <strong>Indywidualizm–kolektywizm<\/strong>: przewaga interesów jednostki czy grupy. <strong>Męskość–kobiecość<\/strong>: wartości ekonomiczne (awans, płaca, sukces) czy społeczne (atmosfera, zaufanie, opieka). <strong>Unikanie niepewności<\/strong>: gotowość działania przy zmianach i bez procedur. <strong>Konfucjański dynamizm<\/strong>: orientacja długoterminowa (upór, oszczędność, relacje według statusu) czy krótkoterminowa (zachowanie twarzy, tradycja, zobowiązania).<\/p>",

"interes jednostki vs grupy",

"sec": "s5"
},
{

"q": "Jakie cztery typy kultury organizacyjnej wyróżnia Hofstede (2000)?",

"q": "Jak klimat organizacyjny wiąże się ze stylem władzy?",
"a": "<p>Centralizacja sprzyja unikaniu niepewności i dużemu dystansowi władzy. Menedżerowie z Europy Środkowo-Wschodniej akceptują większe nierówności i skłaniają się do autorytaryzmu (Mączyński i Witkowski). Łoboda-Świątczak: jakość klimatu wyznacza styl kooperacyjny lub autokratyczny; w firmach państwowych częściej autokratyczny, zwłaszcza przy ograniczonym dostępie do informacji. Dostęp do informacji pozwala wpływać bez przymusu.<\/p>",

{
"src": "Kożusznik, rozdz. 10",
"q": "Jak Schein definiuje kulturę organizacyjną i jakie wyróżnia jej poziomy?",
"a": "<p>Kultura to <strong>wzorzec podstawowych założeń<\/strong>, wypracowanych przez grupę przy rozwiązywaniu problemów <strong>zewnętrznej adaptacji i wewnętrznej integracji<\/strong>, działających na tyle dobrze, by przekazywać je nowym członkom. Poziomy: <strong>podstawowe założenia<\/strong> (rdzeń: egzystencja, natura ludzka, prawda), <strong>normy i wartości<\/strong> (poglądy, postawy), <strong>artefakty<\/strong> (struktura, procedury, zachowania, rytuały, mity).<\/p>",

"q": "Jakie elementy kultury organizacyjnej wymienia Kożusznik?",
"a": "<p><strong>Symbole<\/strong> (żargon, ubiór, logo), <strong>mity<\/strong> (ubarwione wydarzenia z przeszłości, rola wychowawcza), <strong>rytuały<\/strong> (powitania, ceremonie, negocjacje), <strong>wartości<\/strong> (przekonania o cenionym zachowaniu) i <strong>normy<\/strong> (praktyczna realizacja wartości). Pojęcie kultury organizacyjnej wprowadził Pettigrew (1979).<\/p>",

{
"src": "Kożusznik, rozdz. 10",
"q": "Jakie cztery typy kultury wyróżnia Handy?",
"a": "<p><strong>Władzy<\/strong> – centralna postać założyciela, szybka reakcja, ryzyko upadku po jego odejściu. <strong>Roli<\/strong> – biurokratyczna „grecka świątynia” z wyspecjalizowanymi działami, liczy się stanowisko. <strong>Zadania<\/strong> – praca projektowa, struktura sieci, liczy się specjalizacja. <strong>Jednostki<\/strong> – osoba w centrum, partnerstwa specjalistów, kontrola tylko za zgodą.<\/p>",
"k": [
"władzy: centralna postać",
"roli: grecka świątynia",
"zadania: sieć, projekty",
"jednostki: partnerstwa"
],

"src": "Kożusznik, rozdz. 10",
"q": "Jakie cztery klimaty organizacyjne wyróżnia Dobrzyński i który układ jest optymalny?",
"a": "<p><strong>Autorytarny<\/strong> (presja władzy, mistrz i lojalny uczeń), <strong>biurokratyczny<\/strong> (reguły, formalizacja, asekuracja), <strong>towarzyski<\/strong> (dobre stosunki, cele drugorzędne), <strong>innowacyjny<\/strong> (wpływ zależy od kwalifikacji, zespoły projektowe). Optymalny: <strong>innowacyjny z domieszką autorytarnego i towarzyskiego<\/strong>.<\/p>",
"k": [
"autorytarny, biurokratyczny",
"towarzyski, innowacyjny",
"optimum: innowacyjny + domieszka"
],

"q": "Jakie wymiary obejmuje diagnoza klimatu organizacyjnego wg Kolba?",
"a": "<p>Siedem wymiarów na skali 1–10, oceniane jako stan obecny (A) i idealny (I): <strong>konformizm, odpowiedzialność, wymagania (standardy), nagrody, zorganizowanie, poczucie ciepła i poparcia, kierowanie<\/strong>. Klimat ma źródło w teorii pola Lewina i jest „powierzchnią kultury”.<\/p>",
"k": [
"konformizm, odpowiedzialność",
"wymagania, nagrody",
"zorganizowanie, ciepło i poparcie",
"kierowanie; A vs I"
],

{
"src": "Kożusznik, rozdz. 10",
"q": "Jak dystans władzy i unikanie niepewności przejawiają się w organizacji?",
"a": "<p><strong>Duży dystans władzy<\/strong>: centralizacja, kontrola zewnętrzna, duży dystans przełożony–podwładny; mały – decentralizacja, płaskie struktury. Polscy menedżerowie najbardziej autokratyczni (Mączyński). <strong>Wysokie unikanie niepewności<\/strong>: przepisy, standaryzacja, eksperci, zmiany tylko planowane; niskie – mniej przepisów, akceptacja różnic, nieformalna komunikacja, zmienne struktury.<\/p>",
"k": [
"duży dystans: centralizacja",
"Polacy: autokratyczni",
"wysokie unikanie: przepisy, standaryzacja",
"niskie: elastyczność"
],
"id": "praca/cwiczenia-1-fiszki:786243fd",
"unit": "cwiczenia-1.html",
"sec": "s11"
},
{

"q": "Jakie składniki inteligencji emocjonalnej kierownika wymienia Goleman?",
"a": "<p><strong>Samoświadomość<\/strong> (realistyczna samoocena), <strong>samoregulacja<\/strong> (kontrola impulsów, tolerancja niepewności), <strong>motywacja<\/strong> (zaangażowanie poza pieniądze i status, optymizm), <strong>empatia<\/strong> (rozumienie emocji innych, wrażliwość międzykulturowa), <strong>umiejętności społeczne<\/strong> (kierowanie zmianą, budowanie zespołów). Kompetencje społeczne kierowników zwiększają tolerancję pracowników na zmiany.<\/p>",
"k": [
"samoświadomość, samoregulacja",
"motywacja",
"empatia",
"umiejętności społeczne"
],

"q": "Czym różnią się organizacje o wartościach męskich i kobiecych?",
"a": "<p><strong>Męskie<\/strong>: nastawienie na karierę i rywalizację, indywidualne cele, przedsiębiorczość, raczej autokratyczny styl. <strong>Kobiece<\/strong>: relacje, styl partycypacyjny, słaba rywalizacja, integracja. Zbyt silne wartości męskie: ośrodki nacisku, postawa „zrób to sam”, mniejsza tolerancja, hamowanie eksperymentów i uczenia się.<\/p>",
"k": [

"kobiece: relacje, partycypacja",
"koszty nadmiaru męskości"
],

{
"src": "Kożusznik, rozdz. 10",
"q": "Jak kultura wpływa na skuteczność ZPC, benchmarkingu, struktur sieciowych i kół jakości?",
"a": "<p><strong>ZPC<\/strong> wymaga negocjacji, więc słabo działa przy dużym dystansie władzy. <strong>Benchmarking<\/strong> bywa trudny tam, gdzie ocena przy innych zagraża godności. <strong>Struktury sieciowe<\/strong> wymagają akceptacji niepewności (najłatwiej Szwedom i Holendrom). <strong>Koła jakości<\/strong> (dobrowolne, bottom up, 5–10 osób) w Polsce przyjmują się słabo z powodu formalnych relacji przełożony–podwładny.<\/p>",
"k": [
"ZPC a dystans władzy",
"benchmarking a godność",
"sieci a unikanie niepewności",
"koła jakości w Polsce"
],
