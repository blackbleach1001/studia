"src": "Engel-Bernatowicz",
"q": "Jakie są trzy składniki kontaktu według Tickle-Degnen i Rosenthala i jak zmienia się ich znaczenie w trakcie rozmowy?",
"a": "<p>Składniki: <strong>wzajemna uwaga<\/strong> (zwrócenie się ku sobie, zainteresowanie), <strong>autentyczność / pozytywne nastawienie<\/strong> (ciepło, przyjazny nastrój) i <strong>koordynacja<\/strong> (równowaga, harmonia, synchronizacja, porządek rozmowy).<\/p><p>Na początku najważniejsze są autentyczność i pozytywne sygnały, bo rozmówcy oceniają klimat i decydują, czy rozwijać relację. Później rośnie znaczenie koordynacji, a pozytywne nastawienie traci wagę. Uwaga jest ważna przez cały czas.<\/p>",
"k": [

"uwaga ważna cały czas"
],

"q": "Czym różni się ocena kontaktu z perspektywy uczestnika i obserwatora? Podaj przykłady wskaźników.",
"a": "<p>Uczestnik ocenia kontakt <strong>liniowo<\/strong>, przez historię relacji, i opisuje przeżycia: poczucie wzajemnego zainteresowania, harmonii, ciepła. Obserwator ocenia <strong>punktowo<\/strong> (jak w podstawowym błędzie atrybucji) i widzi zachowania: zwrócenie się ku sobie, dopasowanie postawy, synchronizację ruchów, kolejność mówienia, dostosowanie mimiki i intonacji (Hendrick).<\/p><p>Według Altmana obie oceny mogą być prawdziwe. Obserwator nie ma danych intrapsychicznych, ale jego perspektywa przydaje się w szkoleniu.<\/p>",

"q": "Czym jest kontakt pozorny i po czym diagnosta może go rozpoznać?",
"a": "<p><strong>Kontakt pozorny<\/strong> to rozmowa formalnie poprawna, w której rozmówca przestaje szczerze mówić o tym, co najistotniejsze.<\/p><p>Wskaźniki introspekcyjne diagnosty (Geller i Król): trudność z koncentracją, znudzenie, brak zainteresowania, wrażenie fasadowości, poczucie „wiem, co powie”, trudność w zbieraniu danych, chęć przerwania. W zachowaniu rozmówcy: lakoniczne odpowiedzi nawet na prośby o rozwinięcie, konwencjonalność, forma nieadekwatna do treści. Także nadmierna swoboda i „świetny”, rozluźniony kontakt bywają powierzchowne (Goudy i Potter).<\/p>",

{

"q": "Omów rolę kontaktu wzrokowego, postawy ciała i synchronizacji niewerbalnej w budowaniu kontaktu.",
"a": "<p><strong>Synchronizacja<\/strong> (LaFrance) jest najważniejsza; Sharpley podkreśla, że to elastyczność, nie mechaniczne naśladowanie. Odzwierciedlanie postawy (szczególnie tułowia) zwiększa poczucie podobieństwa, ale stosuje się je w 2. i 3. fazie; na początku jest parodystyczne, przy lęku wywołuje złość.<\/p><p><strong>Kontakt wzrokowy<\/strong> (Sharpley i Sagris): w pierwszych 15 min sprzyja rzadki, później (konfrontacja z uczuciami, decyzje) częstszy wzmacnia porozumienie; przy lęku bywa zagrażający. <strong>Postawa<\/strong>: naprzeciw, otwarta, lekko nachylona, rozluźniona (Egan).<\/p>",

{
"src": "Engel-Bernatowicz",
"q": "Jak pytać i jak dużo mówić, żeby pogłębiać kontakt? Odwołaj się do badań.",
"a": "<p><strong>Sharpley i McNally<\/strong>: doświadczeni diagności mówią 4 razy częściej, ale krótko, i zadają więcej pytań otwartych – to przeczy stereotypowi psychologa, który „tylko słucha”. <strong>Sharpley (2000)<\/strong>: aktywność werbalna i przejście od perspektywy intelektualnej do doświadczeniowej pogłębia kontakt.<\/p><p><strong>Rubini i Kruglanski<\/strong>: pytania konkretne o działanie podmiotu dają osobiste odpowiedzi i głęboki kontakt; pytania abstrakcyjne prowadzą do intelektualizacji, „nie wiem” i kontaktu fasadowego.<\/p>",

{
"src": "Engel-Bernatowicz",
"q": "Porównaj technikę swobodną, dyrektywną i mieszaną prowadzenia wywiadu.",
"a": "<p><strong>Swobodna<\/strong>: badany decyduje o tematach; dla zmotywowanych i niedygresyjnych. <strong>Dyrektywna<\/strong>: diagnosta steruje; dla nieśmiałych, niepewnych, obronnie dygresyjnych. <strong>Mieszana<\/strong>: uniwersalna i optymalna – <strong>lejek<\/strong> (od ogółu do szczegółu) lub <strong>lejek odwrócony<\/strong> (od konkretnych, zamkniętych pytań do ogólnych, przy pobudzeniu, ubogim słownictwie, trudności z abstrakcją).<\/p><p>Technika to nie postawa: styl swobodny ≠ uległość, dyrektywny ≠ dominacja. Kontrola na początku rozmowy sprzyja kontaktowi (Sharpley i Heyne).<\/p>",

"q": "Zdefiniuj opór i omów dwa wybrane ujęcia teoretyczne oporu.",
"a": "<p><strong>Opór<\/strong> to świadoma lub nieświadoma niechęć osoby do eksploracji pewnych obszarów treści (Geller i Król).<\/p><p>Przykładowe ujęcia: <strong>psychoanaliza<\/strong> – wszystko, co utrudnia postęp, obrona status quo; Messer porównuje opór do układu immunologicznego i podkreśla jego funkcję informacyjną; Mahalik opisuje 5 obszarów (ekspresja bolesnych emocji, przypominanie, terapeuta, zmiana, wgląd). <strong>Reaktancja<\/strong> (Brehm) – reakcja na zagrożenie wolności, próba odzyskania kontroli. <strong>Wywiad motywacyjny<\/strong> – opór jako produkt interakcji. <strong>Integracyjne<\/strong> (Arkowitz) – ambiwalencja.<\/p>",
"k": [

"sec": "s7"

"q": "Jakie są źródła i przejawy oporu w wywiadzie?",
"a": "<p><strong>Źródła<\/strong>: lęk, wstyd, poczucie winy; błędy diagnosty – zbyt wczesne trudne pytania, pytania oceniające, konfrontujące, sugerujące, naciskające.<\/p><p><strong>Przejawy<\/strong>: poza spotkaniem (spóźnianie, przekładanie), z ciała (rumieniec, zamknięta postawa, brak kontaktu wzrokowego), brak odpowiedzi („nie wiem”, milczenie, zmiana tematu, nadmiar szczegółów, intelektualizacja), niespójność emocji z treścią (śmiech przy smutnej treści), nagła zmiana sposobu mówienia, zachowania wobec diagnosty (wrogość, krytyka, próba relacji towarzyskiej, łamanie kontraktu), mechanizmy obronne.<\/p>",

"q": "Jak diagnosta może radzić sobie z oporem osoby badanej?",
"a": "<p>Przy oporze <strong>mniej dyrektywności<\/strong> (Bischoff i Tracey: strukturyzowanie, konfrontowanie i interpretowanie wzmagają opór). Techniki: <strong>nazwanie uczuć<\/strong> i trudności (Messer), jasna informacja, <strong>możliwość wyboru<\/strong> i delikatna zachęta (Newman), odzwierciedlanie i podkreślanie wyboru (wywiad motywacyjny), <strong>milczenie<\/strong>, <strong>przeformułowanie pytania<\/strong> (uszczegółowić lub „uprojekcyjnić”), zmiana tematu z powrotem później, pytanie „co się teraz w panu dzieje?”, parafraza, <strong>konkretyzacja<\/strong>. Przy ataku: nie brać do siebie, skupić się na uczuciach tu i teraz. Nie udzielać rad, unikać „dlaczego”.<\/p>",

"q": "Na czym polega informacyjna funkcja oporu i jak opór wpływa na diagnostę?",
"a": "<p>Opór informuje o <strong>osobie<\/strong> (np. wysoka reaktancja u osób defensywnych, dominujących), o <strong>relacji<\/strong> (może świadczyć o zdrowych granicach) i o <strong>planowaniu interwencji<\/strong> (przy wysokim oporze techniki niedyrektywne). Badania: opór wiąże się negatywnie z wynikiem terapii, ale najlepiej, gdy rośnie i zostaje przepracowany (Stoolmiller).<\/p><p>U diagnosty opór wywołuje przeciwprzeniesienie, znudzenie, irytację, sprzeczki; trzeba go nie brać do siebie. Istnieje też opór diagnosty – omijanie tematów z własnego lęku.<\/p>",
