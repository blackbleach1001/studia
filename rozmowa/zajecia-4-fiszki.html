"src": "Stemplewska-Żakowicz",
"q": "Wymień i omów pięć kroków planowania wywiadu według Szustrowej.",
"a": "<p>1. <strong>Cel<\/strong>: problem badawczy, czemu posłużą informacje, rola wywiadu, oczekiwania innych, cele dodatkowe. 2. <strong>Orientacja teoretyczna<\/strong>: świadomy wybór teorii, żeby pojęcia miały jasne znaczenie. 3. <strong>Pytania i hipotezy diagnostyczne<\/strong>, stawiane sobie, nie badanemu. 4. <strong>Wskaźniki<\/strong>: obserwowalne przejawy, po których poznamy odpowiedź. 5. <strong>Operacjonalizacja<\/strong>: konkretne sposoby zdobycia informacji w rozmowie, z myślą o celu poznawczym i relacyjnym.<\/p><p>Analiza przebiega w <strong>odwrotnej<\/strong> kolejności: od wypowiedzi przez wskaźniki do hipotez, teorii i celu.<\/p>",

"q": "Czym różni się pytanie diagnostyczne od hipotezy diagnostycznej?",
"a": "<p><strong>Pytanie diagnostyczne<\/strong> stawiamy, gdy nie mamy jeszcze konkretnej wiedzy („Jaki jest stosunek badanej do syna?”). <strong>Hipotezę<\/strong> formułujemy, gdy mamy przesłanki i przypuszczenie do sprawdzenia („Badana przenosi na syna niespełnione aspiracje”). Oba są bardziej szczegółowe niż cel i stawiamy je <strong>sobie<\/strong>, nie osobie badanej. Każde pytanie można traktować jak zestaw hipotez alternatywnych (np. „ma motywację” / „nie ma”). Hipotezy formułuje się w języku wybranej teorii.<\/p>",

{
"src": "Stemplewska-Żakowicz",
"q": "Po co planować wywiad? Wymień kryteria poprawności metodologicznej badania opartego na wywiadzie.",
"a": "<p>Plan daje pewność w trakcie rozmowy (wiadomo, dokąd zmierzać i kiedy temat jest wyczerpany), ułatwia analizę i przede wszystkim nadaje wywiadowi <strong>strukturę<\/strong> – warunek konieczny, choć niewystarczający, trafności i rzetelności.<\/p><p>Kryteria: terminy psychologiczne, nie potoczne; poprawne, falsyfikowalne hipotezy; spójna operacjonalizacja; odróżnianie danych od interpretacji oraz interpretacji od recypatii; wnioskowanie tylko z posiadanych informacji; uzasadnianie wniosków; dystans do własnych emocji i wartości; standardy etyczne.<\/p>",

{
"src": "Stemplewska-Żakowicz",
"q": "Na czym polega klasyczne i postmodernistyczne rozumienie celu wywiadu i założeń badacza?",
"a": "<p><strong>Klasycznie<\/strong>: problem badawczy trzeba opisać pojęciami o precyzyjnym znaczeniu, najlepiej z jednej teorii („Ja realne” znaczy co innego u Freuda, Horney, Rogersa).<\/p><p><strong>Postmodernistycznie<\/strong> (Holstein i Gubrium): wywiad nie jest „rurociągiem”, tylko interakcją, w której znaczenia powstają na bieżąco. Badacz musi opisać swoją <strong>perspektywę<\/strong>: założenia, pozycję społeczną, wartości i ukryte <strong>cele pragmatyczne<\/strong> (np. konieczność postawienia diagnozy do refundacji). Samoświadomość jest cnotą metodologiczną; trafność to wierność subiektywnej rzeczywistości badanego.<\/p>",

{
"src": "Stemplewska-Żakowicz",
"q": "Jakie cechy powinna mieć dobra hipoteza? Podaj przykład złej i lepszej hipotezy.",
"a": "<p>Dobra hipoteza ma <strong>jasne znaczenie<\/strong>, <strong>ograniczony zakres<\/strong> i jest <strong>sprawdzalna (falsyfikowalna)<\/strong>: wiadomo, jakie stany rzeczy jej przeczą.<\/p><p>„Osoba dąży do rozwoju” – zła, bo pojęcie wieloznaczne. „Osoba ma potrzebę samorealizacji” – zła, bo niefalsyfikowalna (każdy organizm do niej dąży). „Osoba jest osobą samorealizującą się” – lepsza, bo Maslow precyzuje pojęcie i podsuwa wskaźniki, choć jest szeroka. Hipotez nie zmienia się w trakcie weryfikacji; hipoteza ad hoc wymaga dalszego badania.<\/p>",

{
"src": "Stemplewska-Żakowicz",
"q": "Omów rodzaje wskaźników według Nowaka i pojęcie mocy rozdzielczej wskaźnika.",
"a": "<p><strong>Definicyjne<\/strong> wchodzą w skład definicji zjawiska (płynne wypowiedzi – fluencja słowna). <strong>Inferencyjne<\/strong> pozwalają wnioskować o zjawisku nieobserwowalnym (dym – ogień; odroczenie gratyfikacji – silne ego). <strong>Empiryczne<\/strong> mają ze zjawiskiem związek stwierdzony w badaniach (agresja – frustracja).<\/p><p><strong>Moc rozdzielcza<\/strong> = <strong>moc zawierania<\/strong> (wykrywa wszystkie przypadki zjawiska) + <strong>moc odrzucania<\/strong> (nie wskazuje innych zjawisk). Agresja jako wskaźnik frustracji ma niską moc, dlatego dla każdej zmiennej dobiera się kilka wskaźników.<\/p>",

"q": "Jakie pięć kategorii danych można uzyskać w wywiadzie? Zilustruj przykładem.",
"a": "<p><strong>Treść<\/strong> wypowiedzi, <strong>forma<\/strong> wypowiedzi (płynność, kategorie, środki językowe), <strong>dane obserwacyjne<\/strong> (zachowanie), <strong>recypatia<\/strong> (subiektywne wrażenia diagnosty), <strong>dane kontekstowe<\/strong> (związki między nimi i z sytuacją).<\/p><p>Przykład: chłopak pytany o relacje z rodzicami spuszcza wzrok i mówi „Nigdy nie było źle, naprawdę, nigdy nie było źle, było wręcz w porządku”. Treść: relacje dobre. Forma: podwójne zaprzeczenie, „nigdy”, perswazja, czas przeszły, brak konkretów. Obserwacja: spuszczony wzrok. Recypatia: poczucie zadania niestosownego pytania. Kontekst: odpowiedź o przeszłości na pytanie o teraźniejszość. Tylko jedna z 14 przesłanek opiera się na treści.<\/p>",

{
"src": "Stemplewska-Żakowicz",
"q": "Czym różnią się wskaźniki bezpośrednie od pośrednich i do czego służą?",
"a": "<p><strong>Bezpośrednie<\/strong>: polegamy na deklaracji badanego – służą do ustalania obiektywnych faktów (dane biograficzne, sytuacja życiowa) i jawnych poglądów, wartości i ocen.<\/p><p><strong>Pośrednie<\/strong>: szukamy w wypowiedzi czegoś innego niż jej treść – służą do określenia stanów, których badany nie relacjonuje (trudności z zasypianiem jako wskaźnik lęku), utajonych postaw i potrzeb (urywana wypowiedź jako konflikt), emocjonalnego znaczenia faktów, procesów wewnętrznych i ukrywanych okoliczności (zmiana tematu jako unikanie). Przy emocjach i przeżyciach wskaźniki bezpośrednie są nieodpowiednie.<\/p>",

{
"src": "Stemplewska-Żakowicz",
"q": "Jakich błędów należy unikać przy operacjonalizacji wskaźników w wywiadzie?",
"a": "<p>Nie zadaje się badanemu <strong>pytań badawczych wprost<\/strong> („Czy różne aspekty życia stanowią dla ciebie zagrożenie?”, „Jakie emocje wywołują w tobie spotkania z ludźmi?”) – zakładają gotową, świadomą odpowiedź i mówią najwyżej, co osoba myśli o sobie. Unika się pytań „Czy często…?”, które wymagają liczenia i porównań, wprowadzają tryb zadaniowy i niszczą kontakt, oraz pytań oceniających Ja. Nie naciska się przy oporze. Nie odczytuje się pytań po kolei: operacjonalizuje się na bieżąco, elastycznie.<\/p>",

{
"src": "Stemplewska-Żakowicz",
"q": "Jak planować pytania, żeby dotrzeć do doświadczenia, a nie tylko deklaracji? Omów też znaczenie kolejności tematów.",
"a": "<p>Dla każdego pytania warto przewidzieć odpowiedzi <strong>diagnostyczne (+)<\/strong> i <strong>niediagnostyczne (−)<\/strong>; liczą się kategorie i uzasadnienia, a nie stanowisko. Trzeba wybrać <strong>adresata<\/strong> pytania (aktywny wywiad): głos kolektywny, osobisty, perspektywę odzwierciedloną („Co by powiedziała matka?”); pytania „do głowy” dają poglądy, pytania „do doświadczenia” eksplorują konkretne epizody i pokazują, jak osoba czuje i przeżywa.<\/p><p><strong>Kolejność<\/strong>: wcześniejsze tematy działają jak priming, emocje „rozlewają się” na dalsze wypowiedzi – trzeba to uwzględnić w interpretacji. Kończy się tematami lżejszymi; osoba ma wyjść w stanie nie gorszym.<\/p>",
