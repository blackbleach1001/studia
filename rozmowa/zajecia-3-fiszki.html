"src": "Ustjan, Instrumenty",
"q": "Czym są sposoby reagowania werbalnego (interwencje) i czym różni się diagnozowanie od pomagania?",
"a": "<p>Sposoby reagowania werbalnego to akty werbalne psychologa; nazywa się je <strong>interwencjami<\/strong>, bo każda wpływa na kierunek myślenia rozmówcy i zakres treści, a <strong>instrumentami konwersacyjnymi<\/strong>, bo są świadomie stosowanym narzędziem. Rozmowę opisuje się w czterech aspektach: zawartość, działanie, sposób, jakość.<\/p><p><strong>Diagnozowanie<\/strong> to aktywne poszukiwanie danych do decyzji – celem jest <strong>opis<\/strong> funkcjonowania. <strong>Pomaganie<\/strong> umożliwia rozwój w wybranym kierunku – celem jest <strong>zmiana<\/strong>. W obu potrzebny jest kontakt, więc część interwencji jest wspólna.<\/p>",
"k": [

"cztery aspekty: zawartość, działanie, sposób, jakość",

"wspólny warunek: kontakt"
],

{

"q": "Porównaj klasyfikacje sposobów reagowania werbalnego Hill i Stilesa.",
"a": "<p><strong>Hill<\/strong>: system do opisu wypowiedzi konsultanta, w wersji zrewidowanej 9 kategorii – potwierdzanie, informowanie, bezpośrednie zalecenia, pytania zamknięte i otwarte, parafraza, interpretacja, konfrontacja, ujawnianie siebie.<\/p><p><strong>Stiles (VRM)<\/strong>: nadaje się do wszelkich rozmów, opisuje <strong>obie strony<\/strong> tymi samymi kategoriami i każdą wypowiedź dwukrotnie: przez <strong>formę i intencję<\/strong>. 8 podstawowych kategorii (ujawnianie, podawanie do wiadomości, rady, potwierdzanie, pytanie, oznaki uwagi, interpretowanie, odzwierciedlanie), a z kategoriami mieszanymi 64 typy („Czy możesz przestać…?” – forma pytania, intencja rady).<\/p>",

"a": "<p><strong>Elliott i in.<\/strong> porównali sześć systemów i znaleźli sześć uniwersalnych kategorii: <strong>pytanie, informowanie, dawanie rad, interpretowanie, odzwierciedlanie, ujawnianie siebie<\/strong> (w czterech systemach także konfrontacja i uspokajanie).<\/p><p><strong>Układ Wymiany Werbalnej<\/strong> (Stiles i Shapiro) analizuje <strong>sekwencje<\/strong> wypowiedzi terapeuty i klienta, np. opowiadanie historii, dowiadywanie się, interpretowanie, zalecanie. Część wymian jest wspólna dla terapii psychodynamicznej i poznawczo-behawioralnej, część specyficzna. Podejście jest bliższe praktyce, bo uwzględnia intencję i kontekst.<\/p>",

"q": "Od jakich czynników zależy dobór interwencji przez psychologa? Podaj przykłady badań.",
"a": "<p><strong>Doświadczenie<\/strong> (początkujący więcej pytają i radzą), <strong>orientacja teoretyczna<\/strong> (Rogers – głównie parafraza, Ellis – informowanie, Perls – zalecenia; ci sami terapeuci w różnych nurtach stosują różne interwencje), <strong>cel<\/strong> fragmentu rozmowy (w wywiadzie lekarskim pytania przy zbieraniu danych, rady przy wnioskach), <strong>czas<\/strong> (w trakcie sesji rośnie liczba minimalnych reakcji i informowania), <strong>płeć<\/strong> uczestników, <strong>problem klienta<\/strong> (depresja – więcej pytań zamkniętych, problem intrapersonalny – więcej odzwierciedlania).<\/p>",

"src": "Ustjan, Instrumenty",
"q": "Jakie podziały interwencji pomagają uzyskać pełny obraz osoby w wywiadzie diagnostycznym?",
"a": "<p>Trzy <strong>poziomy funkcjonowania<\/strong>: poznawczy (co myśli), emocjonalno-motywacyjny (co czuje, co go napędza), behawioralny (co robi). Dwa <strong>systemy<\/strong>: analityczny (intelektualna interpretacja, opinie) i doświadczeniowy (przeżycie konkretnego zdarzenia) – np. „Co pan sądzi o zachowaniu żony?” vs „Proszę przypomnieć sobie ostatnią kłótnię…”. Doświadczenia <strong>pozytywne i negatywne<\/strong>, bo ludzie i psychologowie skupiają się na negatywnych.<\/p>",

{
"src": "Ustjan, Instrumenty",
"q": "Czym różnią się interwencje „ja” od bezosobowych i dlaczego te pierwsze są korzystniejsze?",
"a": "<p>W interwencji <strong>„ja”<\/strong> diagnosta zaznacza własną, subiektywną perspektywę czasownikiem w 1. osobie („Odnoszę wrażenie, że jest pan zdenerwowany”), w bezosobowej formułuje sąd orzekający („Jest pan zdenerwowany”).<\/p><p>Interwencja „ja” zostawia miejsce na <strong>niezgodę<\/strong> (diagnosta bywa autorytetem), czyni relację <strong>dwupodmiotową<\/strong>, pokazuje tok rozumowania i granice wiedzy diagnosty, daje poczucie kontroli i może zastąpić pytanie, chroniąc przed wrażeniem przesłuchania. Ma też uzasadnienie etyczne.<\/p>",

"sec": "s5"

{
"src": "Ustjan, Instrumenty",
"q": "Wyjaśnij różnicę między pytaniami z perspektywy aktora i obserwatora i podaj przykład.",
"a": "<p>Ludzie tłumaczą własne zachowanie sytuacją, a cudze dyspozycjami (asymetria aktor–obserwator, Jones i Nisbett; podstawowy błąd atrybucji). Pytanie z perspektywy <strong>obserwatora<\/strong> zawiera ukryty przekaz, że odpowiada badany: „Dlaczego pokłóciła się pani z mężem?”. Pytanie z perspektywy <strong>aktora<\/strong> dopuszcza wyjaśnienia sytuacyjne: „Co takiego się stało, że doszło do kłótni między panią a mężem?”. Pytania z perspektywy obserwatora są bardziej <strong>zagrażające<\/strong> i łatwiej wywołują obronę.<\/p>",

],

"unit": "zajecia-3.html",
"sec": "s5"
},
{
"src": "Ustjan, Pytania",
"q": "Kiedy warto stosować pytania zamknięte w wywiadzie, a jakie mają ograniczenia?",
"a": "<p>Pytania zamknięte ograniczają odpowiedź do możliwości w pytaniu; krótka odpowiedź nie jest oporem. Są <strong>mało zagrażające<\/strong> i nie wymagają wysiłku. Przydają się, gdy lęk jest wysoki lub motywacja niska, gdy potrzeba konkretnej, obiektywnej informacji, do uzupełnienia wiedzy, przy braku czasu, do sprawdzenia zgodności treści z sytuacją badanego i do kontroli rozmowy z osobą wielomówną.<\/p><p>Ograniczenia: nie pozwalają poznać subiektywnego świata; ciąg pytań o uczucia („czy był pan zły? czy ma pan żal?”) mówi tylko, czego badany nie czuł, i nuży. Forma grzecznościowa („czy może pan powiedzieć…”) zamienia pytanie w zamknięte.<\/p>",

"wysoki lęk / niska motywacja",
"konkretne dane, uzupełnienie, brak czasu",
"kontrola przy wielomówności",
"ograniczenia: brak subiektywnego świata"
],
"id": "rozmowa/zajecia-3-fiszki:f8a5afd9",
"unit": "zajecia-3.html",
"sec": "s6"
},
{
"src": "Ustjan, Pytania",
"q": "Jakie zastrzeżenia budzą pytania zaczynające się od „dlaczego”?",
"a": "<p>Zawierają <strong>ukrytą ocenę lub sugestię<\/strong> („Dlaczego nie zmieni pani pracy?”), są formułowane z <strong>perspektywy obserwatora<\/strong>, więc obarczają badanego odpowiedzialnością, zakładają, że badany <strong>zna odpowiedź<\/strong> i analizował swoje zachowanie, oraz sugerują, że przeżycia da się wyjaśnić <strong>przyczynowo-skutkowo<\/strong> („Dlaczego kocha pani męża?”), co prowadzi do „nie wiem” lub sztucznych odpowiedzi. Bywają przydatne, gdy interesuje nas świadomość zależności lub subiektywne poglądy na przyczyny.<\/p>",

{
"src": "Ustjan, Pytania",
"q": "Omów pytania projekcyjne i hipotetyczne: na czym polegają, kiedy je stosować i jakie mają ograniczenia?",
"a": "<p><strong>Projekcyjne<\/strong> pytają o innych ludzi, zakładając rzutowanie własnych doświadczeń („O jakich sprawach ludziom najtrudniej rozmawiać z bliskimi?”). Nie wywołują oporu i dobrze wprowadzają w temat; ograniczenie: nie wiadomo, czy badany się utożsamia, więc odpowiedzi to <strong>hipotezy<\/strong> do sprawdzenia pytaniami wprost (pomaga pytanie o osoby podobne do badanego).<\/p><p><strong>Hipotetyczne<\/strong> dotyczą sytuacji „na niby” („Gdyby jeszcze raz wybierała pani zawód…”); osłabiają obronę i pokazują motywy, pragnienia, rozbieżność marzeń i rzeczywistości. Oba typy przydają się przy tematach trudnych lub nasyconych aprobatą społeczną.<\/p>",

{
"src": "Ustjan, Pytania",
"q": "Czym są pytania tendencyjne i kiedy ich użycie może być uzasadnione?",
"a": "<p>Pytania tendencyjne zawierają ukrytą sugestię odpowiedzi lub założenie o doświadczeniu badanego. <strong>Sugerujące<\/strong> („Jesteś najlepszy, bo lubisz się uczyć, prawda?”) narzucają kategorie, odsłaniają intencje diagnosty i prowadzą do odpowiedzi „pod diagnostę”, czyli fałszują diagnozę. <strong>Alternatywne<\/strong> („z rodziną czy ze znajomymi?”) dają wybór mniej nietrafnej odpowiedzi.<\/p><p>Uzasadnione: sugerujące – przy badaniu <strong>podatności na sugestię<\/strong> i przy pytaniach nasyconych aprobatą społeczną („Jak często upija się pan na przyjęciach?” daje przyzwolenie); alternatywne – przy rozstrzyganiu sprzecznych informacji.<\/p>",

"unit": "zajecia-3.html",
"sec": "s6"
},
{
"src": "Ustjan, Pytania",
"q": "Czym różni się pytanie uwikłane od progresji i kiedy stosuje się pytania odroczone?",
"a": "<p><strong>Pytanie uwikłane<\/strong>: ważne pytanie ukryte <strong>wśród<\/strong> serii mniej zagrażających pytań z tego samego tematu (np. o przemoc wśród pytań o kłótnie). <strong>Progresja<\/strong>: stopniowe przechodzenie <strong>od pytań odległych do właściwego<\/strong> (o wagary: stosunek do szkoły → co lubisz → co robisz, gdy nie jesteś przygotowany → wagary). Obie pomagają przy oporze i aprobacie społecznej.<\/p><p><strong>Pytanie odroczone<\/strong> przenosi się do lepszego momentu, gdy kontakt jest za płytki, gdy pytanie zdradziłoby hipotezę albo przerwałoby wypowiedź.<\/p>",

"q": "Porównaj konstrukcję lejka i lejka odwróconego.",
"a": "<p><strong>Lejek<\/strong>: od pytań otwartych i ogólnych do szczegółowych. Daje spontaniczne informacje, nie narzuca treści, daje podmiotowość i bezpieczeństwo; ograniczenia – zagraża przy wysokim lęku i nie sprawdza się u osób wielomównych.<\/p><p><strong>Lejek odwrócony<\/strong>: od pytań konkretnych, czasem zamkniętych, do ogólnych. Pomaga przy ubogim słownictwie, trudności z myśleniem abstrakcyjnym, wysokim lęku i gdy badany nie ma przemyślanych poglądów (Gerstmann).<\/p>",

{

"q": "Czym różni się parafraza od klaryfikacji? Podaj przykłady.",
"a": "<p><strong>Parafraza<\/strong> oddaje własnymi słowami treść wypowiedzi i <strong>sprawdza poprawność rozumienia<\/strong>; zakłada sens wypowiedzi i zostawia miejsce na korektę („Jeżeli dobrze rozumiem, kłopoty finansowe zmieniły pana kontakty z rodziną, czy tak?”). Nie powinna być dłuższa od oryginału.<\/p><p><strong>Klaryfikacja<\/strong> stosowana jest, gdy wypowiedź jest niejasna lub wielowątkowa i diagnosta <strong>nie rozumie<\/strong> przekazu; <strong>nie zakłada sensu<\/strong> („Nie do końca zrozumiałam, czyje zachowanie było dla pani trudne”). Formułuje się ją komunikatem „ja”, biorąc odpowiedzialność za niezrozumienie na siebie.<\/p>",

{
"src": "Ustjan, Pytania",
"q": "Jak poprawnie odzwierciedlać uczucia rozmówcy?",
"a": "<p>Odzwierciedlenie nazywa uczucia rozmówcy (wyrażone werbalnie lub niewerbalnie, obecne lub z przeszłości) i pokazuje empatyczne rozumienie. Zasady: łączyć treść z sygnałami niewerbalnymi (ten sam tekst z innym tonem to inna emocja); przy kilku uczuciach nazwać <strong>wszystkie<\/strong>; przy niezgodności słów i zachowania mówić <strong>przypuszczeniem z furtką<\/strong> („odniosłam wrażenie… mogę się mylić”), by nie zamienić odzwierciedlenia w konfrontację; dobrać <strong>natężenie<\/strong> słowa; czasem raczej pomóc się zdystansować; nie odzwierciedlać pochopnie, bo może zerwać kontakt.<\/p>",

"ryzyko pochopnego odzwierciedlenia"

"sec": "s8"
},

"src": "Ustjan, Pytania",
"q": "Omów zasady formułowania interwencji w wywiadzie.",
"a": "<p><strong>Język<\/strong> dopasowany do rozmówcy, bez żargonu psychologicznego i bez udawania slangu. <strong>Złożoność<\/strong>: jedno pytanie naraz, bo przy kilku nie wiadomo, na co badany odpowiada; nie poprawiać nerwowo własnych pytań. <strong>Jednoznaczność<\/strong>: unikać słów wieloznacznych i nieostrych („ludzie”). <strong>Znajomość zagadnienia<\/strong>: nie pytać o to, czego badany nie może wiedzieć („Co spowodowało, że chłopak cię zostawił?”). <strong>Ciekawość<\/strong>: każde pytanie służy celowi; pytania z ciekawości naruszają prywatność.<\/p>",
