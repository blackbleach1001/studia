"src": "Grzesiak-Feldman",
"q": "Jak przebiega interpretacja danych z wywiadu w schemacie hipoteza–wskaźniki–operacjonalizacja?",
"a": "<p>Analiza idzie <strong>odwrotnie niż planowanie<\/strong>: od konkretnych wypowiedzi przez wskaźniki do hipotezy. Materiał podlega <strong>selekcji<\/strong> – interpretuje się tylko wypowiedzi i zachowania odnoszące się do wskaźników. Na tej podstawie decyduje się, czy dane hipotezę <strong>wzmacniają, osłabiają<\/strong>, czy są <strong>niekonkluzywne<\/strong>.<\/p><p>Przykład: hipoteza o niezaspokojonej potrzebie szacunku (Maslow), wskaźnik – myślenie w kategoriach ambicji; pasują deklaracje i nieadekwatne podkreślanie osiągnięć (wizytówka „mgr inż.” na drzwiach). Jedna wypowiedź może odpowiadać kilku wskaźnikom i hipotezom.<\/p>",
"k": [

"wzmacnia / osłabia / niekonkluzywne",
"przykład",
"jedna wypowiedź – kilka hipotez"
],

},
{
"src": "Grzesiak-Feldman",
"q": "Omów kategorie danych z wywiadu i ich znaczenie dla interpretacji.",
"a": "<p><strong>Treść<\/strong>: pozwala stwierdzić tylko, że badany to powiedział; nie musi odpowiadać świadomym przekonaniom, nieświadomym odczuciom ani stanowi faktycznemu. <strong>Kontekst<\/strong>: ta sama wypowiedź po różnych pytaniach znaczy co innego; odpowiedź na pytanie sugerujące jest bezwartościowa. <strong>Forma<\/strong>: liczy się związek z konkretnym doświadczeniem (opis śpiącego dziecka vs „macierzyństwo to radość”). <strong>Zachowania niewerbalne<\/strong>: ironia zmienia sens, spójność wzmacnia przesłankę, utrata płynności sygnalizuje trudność. <strong>Recypatia<\/strong>: przeżycia diagnosty, pomocne, ale najbardziej subiektywne. Kategorii nie analizuje się osobno.<\/p>",

"recypatia – uzupełniająco"

{
"src": "Grzesiak-Feldman",
"q": "Od czego zależy moc przesłanek diagnostycznych i dlaczego warto nagrywać wywiad?",
"a": "<p>Moc przesłanek maleje, gdy zachowanie badanego wywołała sytuacja badania lub sam diagnosta (np. uważniej słuchał przy jednym temacie, zadał pytanie sugerujące, neutralna wypowiedź została odebrana jako ocena). Rośnie przy <strong>dobrym, głębokim kontakcie<\/strong>, większym <strong>doświadczeniu<\/strong> diagnosty i <strong>spójności<\/strong> danych werbalnych i niewerbalnych (Szustrowa).<\/p><p><strong>Nagranie<\/strong> (za zgodą!) z notatkami obserwacyjnymi pozwala analizować treść i formę, wielokrotnie odsłuchiwać, dokładnie spisać rozmowę i ogranicza błędy z <strong>selektywności pamięci<\/strong>; notatki w trakcie szkodzą kontaktowi.<\/p>",

],

{
"src": "Grzesiak-Feldman",
"q": "Opisz cztery kroki analizy wywiadu (vademecum początkującego diagnosty).",
"a": "<p>1. <strong>Transkrypcja<\/strong>: wszystkie wypowiedzi obu stron, pauzy, zająknięcia, powtórzenia, plus notatki obserwacyjne; dydaktycznie w <strong>tabeli<\/strong> (treść / obserwacje i recypatia / interpretacja); system Jeffersona. 2. <strong>Przeszukanie danych<\/strong>: wyszukanie wypowiedzi odnoszących się do wskaźników i oznaczenie ich. 3. <strong>Sprawdzenie spójności<\/strong> danych różnych kategorii (kontekst, niewerbalne). 4. <strong>Wnioski<\/strong>: synteza wypowiedzi dla każdego wskaźnika, ewentualne ważenie wskaźników, decyzja o przyjęciu, odrzuceniu lub niekonkluzywności hipotezy.<\/p>",

"sec": "s5"
},
{
"src": "Grzesiak-Feldman",
"q": "Jakie błędy interpretacyjne są najczęstsze i jak ich unikać?",
"a": "<p><strong>Nadinterpretacja<\/strong> – przypisywanie wypowiedzi dodatkowego znaczenia („ubieram się na czarno” → „tendencje autodestrukcyjne”). Traktowanie <strong>jednego z wielu wyjaśnień jako jedynego<\/strong> („lubi czarny”, choć może to moda, subkultura, żałoba). Ukryte <strong>założenia<\/strong>, odwoływanie się do <strong>własnych doświadczeń<\/strong>, błędy logiczne, nadmierna generalizacja, wyolbrzymianie lub minimalizowanie, stereotypy.<\/p><p>Chronią: doświadczenie i samoświadomość diagnosty, trzymanie się teorii i schematu hipoteza–wskaźnik–operacjonalizacja.<\/p>",

{
"src": "Zalewski",
"q": "Jakie są cele udzielania informacji zwrotnych i jak kontekst badania wpływa na ich treść?",
"a": "<p>Cel: przekazać klientowi <strong>wszystkie istotne informacje o nim w sposób potencjalnie dla niego użyteczny<\/strong>; to obowiązek z kodeksu PTP i podstawa podmiotowego traktowania. Może pełnić funkcję terapeutyczną, bo zwiększa rozumienie siebie i możliwość decydowania.<\/p><p>Kontekst: w <strong>badaniach naukowych<\/strong> – co badano, wynik i jego znaczenie, bez utrwalania stereotypów; w <strong>poradnictwie<\/strong> – możliwości poradzenia sobie, problem jako wyzwanie; w <strong>ocenie pracowniczej<\/strong> – minimum oceniania, jasne zasady; w <strong>ekspertyzie sądowej<\/strong> – tylko wnioski związane z problemem, osobno dla sądu i badanego; w <strong>terapii<\/strong> – przez cały proces.<\/p>",

{
"src": "Zalewski",
"q": "Jak emocje i potrzeby psychologa mogą wpływać na informacje zwrotne i co z tym robić?",
"a": "<p>Klienci budzą emocje (złość, pogardę, zachwyt), które niewyrażone wpływają na treść: pozytywne wrażenie daje „wybitną osobowość”, negatywne – „zaburzenie” (samospełniające się proroctwo, wybiórcze spostrzeganie). Potrzeby psychologa krążą wokół <strong>zmieniania i kontrolowania<\/strong> ludzi; pośpiech w rozwiązywaniu problemu sprawia, że klient czuje się gorszy i bezsilny. Nacisk na zmianę może też wynikać z niepokoju o własne status quo.<\/p><p>Remedium: <strong>superwizja<\/strong> lub rozmowa z kimś, kto słucha; auto-superwizja – świadoma, egoistyczna ocena klienta, by ograniczyć jej wpływ. Wywiad nie jest terapią.<\/p>",

"sec": "s7"

{
"src": "Zalewski",
"q": "Jak należy udzielać informacji zwrotnych po wywiadzie? Omów formę i treść.",
"a": "<p>Istota: przekazać <strong>bez oceniania i doradzania<\/strong> obraz osoby, jaki stworzył sobie psycholog, i zapytać, czy jest trafny – to sprawozdanie z aktualnych hipotez. Forma: <strong>małe porcje<\/strong> z miejscem na reakcję; na początku i końcu treści pozytywne i mniej ważne dla tożsamości, trudne w <strong>środku<\/strong>, gdy kontakt jest najgłębszy; klient wychodzi w stanie nie gorszym.<\/p><p>Treść: głównie <strong>parafraza<\/strong> szerszych wątków (nie interpretacja), uporządkowana logicznie; sformułowania pozytywne; nawiązanie do zgłaszanego <strong>problemu<\/strong> i mocnych stron; otwarte powiedzenie, czego się nie dowiedzieliśmy; o czym rozmawialibyśmy, gdyby był czas.<\/p>",

{
"src": "Zalewski",
"q": "Czego nie należy mówić w informacjach zwrotnych i dlaczego?",
"a": "<p>Trzy naczelne zasady: <strong>nie radzić<\/strong> (rada daje etykietę bezradnego, służy potrzebom psychologa, wymagałaby odpowiedzialności za skutki), <strong>nie uświadamiać<\/strong> powiązań, których klient nie widzi (zmiana zachodzi w terapii; zbyt szybki wgląd może zaszkodzić), <strong>nie proponować zmian<\/strong>.<\/p><p>Ponadto: nie <strong>etykietować<\/strong> cechami („jesteś…”), nie „wysyłać” na terapię, gdy klient o niej nie myśli, nie <strong>tworzyć problemów<\/strong>, uważać na <strong>komplementy<\/strong> (ukryta ocena i oczekiwanie), nie używać żargonu.<\/p>",

"komplementy, tworzenie problemów"

"sec": "s9"
},
{
"src": "Zalewski",
"q": "Jak formułować informacje zwrotne? Podaj przykładowe sformułowania.",
"a": "<p>Jako <strong>osobiste spostrzeżenia<\/strong> („Odniosłem wrażenie, że…”, zamiast „Jest pani…”); w formie <strong>pytań i wątpliwości<\/strong> („czy dobrze to rozumiem?”); <strong>jasno<\/strong>, w języku klienta; o <strong>procesach, nie stanach<\/strong> („W tej chwili swojego życia przeżywa pan…”, „od jakiegoś czasu narasta…”); <strong>wyzwania zamiast problemów<\/strong> („samodzielność finansowa jest dla pana wyzwaniem”); odwołanie do <strong>stanów idealnych<\/strong> na koniec. Słowa „chyba, może, wydaje mi się” budują atmosferę. <strong>Ostatnie słowo należy do klienta<\/strong>: zapytać o opinię i przyjąć ją bez dyskusji.<\/p>",

"sec": "s9"

{
"src": "Zalewski",
"q": "Kiedy można zaproponować osobie badanej kontakt z terapeutą?",
"a": "<p>Diagnosta nie „wysyła” na terapię, jeśli klient o niej nie myśli – taka osoba szybko rezygnuje. Warunki (Rakowska): osoba stwierdza, że <strong>ma problem<\/strong>, <strong>próbowała sobie radzić<\/strong> bez skutku, <strong>chce zmiany<\/strong> i <strong>prosi o pomoc<\/strong>.<\/p><p>Gdy klient sam mówi o problemie, można podzielić się myślą, że psychologowie szkolą się w pomaganiu w takich sytuacjach (przykład z myciem rąk). Przy zagrożeniu zdrowia (podejrzenie anoreksji) przekazuje się informacje przemawiające do osoby (zdrowie, zęby, kariera).<\/p>",

"dzielenie się myślą zamiast rady",
"wyjątek: zagrożenie zdrowia"
],
