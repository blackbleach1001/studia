{"src":"Geller, Król","q":"Czym kontakt diagnostyczny różni się od pełnego kontaktu interpersonalnego?","a":"<p>Kontakt diagnostyczny to warunki, w których osoba badana <strong>może i chce</strong> mówić o ważnych, także intymnych sprawach. Różni się od pełnego kontaktu <strong>asymetrią komunikacji</strong>: uwaga obu osób skupia się głównie na osobie badanej, mniej na relacji, a tylko sporadycznie na diagnoście, i jest to wprowadzone celowo. Druga różnica to <strong>asymetria ról</strong>: badany mówi, diagnosta słucha, ukierunkowuje tok wypowiedzi i narzuca ramy tematyczne, podczas gdy w pełnym kontakcie tematy są dowolne.</p><p>Diagnosta jest nieobłudny, ale powściągliwy i nie dzieli się własnymi doświadczeniami. Działa „na usługach osoby badanej” i „na usługach celu wywiadu”.</p>"},
{"src":"Geller, Król","q":"Wymień introspekcyjne i behawioralne wskaźniki dobrego kontaktu diagnostycznego.","a":"<p><strong>Introspekcyjne:</strong> diagnosta jest autentycznie zainteresowany, chce zrozumieć, a nie ocenić, akceptuje każdą odpowiedź i czuje, że rozumie osobę poznawczo i emocjonalnie. Badany czuje akceptację i zainteresowanie, ufa, że informacje nie zostaną użyte wbrew niemu, czuje się rozumiany bez zniekształceń i może bezkarnie ujawnić kontrowersyjne treści.</p><p><strong>Behawioralne:</strong> brak wyraźnego oporu (badany nie odmawia, nie milczy, nie odpowiada zdawkowo), adekwatność emocji do treści, wiarygodność informacji i zrównoważona proporcja informacji spontanicznych do wypytywanych.</p>"},
{"src":"Geller, Król","q":"Czym różni się akceptacja diagnosty od aprobaty?","a":"<p>Akceptacja to przyjęcie, że skoro fakty, postawy i przeżycia wystąpiły, to <strong>mogły i miały prawo wystąpić</strong>, oraz próba zrozumienia ich znaczenia dla osoby, bez oceniania i zmieniania. Nie oznacza uznania ich za słuszne ani tego, że diagnosta postąpiłby tak samo. Może je uważać za moralnie niesłuszne lub patogenne. To akceptacja faktów, a nie poparcie ich słuszności.</p>"},
{"src":"Geller, Król","q":"Na czym polega zasada wrzeciona i jakie czynniki niezależne od diagnosty wpływają na dynamikę kontaktu?","a":"<p><strong>Zasada wrzeciona:</strong> kontakt powinien być najgłębszy w środkowej fazie rozmowy i spłycać się ku jej końcowi, by koniec nie zbiegł się z silnymi negatywnymi emocjami po ujawnieniu trudnych treści.</p><p>Czynniki niezależne od diagnosty: <strong>stopień intymności</strong> (ujawnianie rośnie, potem chwilowe wycofanie na płytszy poziom i cyklicznie coraz głębiej; Derlega, Chaiken), <strong>„stopa w drzwiach”</strong> (potrzeba spójności: po odpowiedzi na mało zagrażające pytanie trudniej odmówić odpowiedzi na bardziej zagrażające) oraz <strong>czas</strong> (optymalnie około 50 minut, potem kontakt słabnie).</p>"},
{"src":"Geller, Król","q":"Czym parafraza różni się od interpretacji i jakie funkcje pełni parafraza?","a":"<p><strong>Parafraza</strong> to powtórzenie własnymi słowami wypowiedzi rozmówcy, bez dodawania sensu. <strong>Interpretacja</strong> dodaje wyjaśnienia i przyczyny od psychologa. W wywiadzie diagnostycznym interpretacja bywa szkodliwa, bo wywiad ma dostarczać materiału o tym, co myśli badany, a nie o tym, co sądzi o nim psycholog.</p><p>Funkcje parafrazy: komunikuje uważne słuchanie i chęć zrozumienia, pozwala sprawdzić, czy informacje nie zostały zniekształcone przez obronną identyfikację lub projekcję, i daje badanemu szansę sprostowania. Może kończyć się zachętą do rozwinięcia albo sprawdzeniem, czy dobrze zrozumieliśmy.</p>"},
{"src":"Geller, Król","q":"Podaj wskaźniki kontaktu pozornego i jego źródła.","a":"<p>Kontakt pozorny jest formalnie poprawny, ale ważne treści nie padają. <strong>Wskaźniki:</strong> informacje konwencjonalne i stereotypowe, forma nieadekwatna do treści, rola diagnosty nadmierna (lakoniczne odpowiedzi) lub znikoma (badany mówi równie lekko o wszystkim), wspólny mianownik wypowiedzi (korzystne światło, aprobata, zbyt spójny system). Diagnosta może zauważyć u siebie znudzenie, poczucie, że wie, co badany powie, i brak całościowego obrazu.</p><p><strong>Źródła:</strong> relacja (stereotypy ról: koledzy, rodzic–dziecko, nauczyciel–uczeń, intelektualiści), diagnosta (brak kompetencji, lęk przed intymnością, sztywny model teoretyczny, brak zainteresowania) i osoba badana (dążenie do zatajenia, kierowanie wrażeniem, opór).</p>"},
{"src":"Geller, Król","q":"Czym jest opór, jak się przejawia i jakie ma źródła?","a":"<p><strong>Opór</strong> to świadome lub nieświadome unikanie penetracji pewnego obszaru treści. Przejawia się obroną (milczenie, zmiana tematu, intelektualizacja, spłycenie i mniejsza konkretność, zmiana sposobu mówienia, objawy somatyczne), atakiem (krytyka pytań, zarzuty wobec psychologa, przerzucanie uwagi na niego) albo, przy pełnej świadomości, kłamstwem lub odmową.</p><p><strong>Źródła wewnętrzne:</strong> lęk (tłumienie, lęk egzystencjalny o tożsamość, przed odkryciem czegoś nieznanego, przed manipulacją), wstyd (diagnosta jako lustro społeczne) i poczucie winy (ujawnianie spraw bliskich). <strong>Źródła w diagnoście:</strong> za szybkie pytania zagrażające, pytania sugerujące i zamknięte, oceny, wyłapywanie sprzeczności, nacisk wywołujący reaktancję, specjalistyczny język. Badany ma prawo do oporu.</p>"},
{"src":"Zalewski","q":"Podaj definicję kontraktu i jego trzy cechy.","a":"<p>Kontrakt to, podobnie jak umowa handlowa, umowa zawarta <strong>dobrowolnie</strong> przez dwie strony, ze <strong>świadomością</strong> wszystkich ważnych okoliczności, z uwzględnieniem <strong>interesów</strong> obu stron (kto co zyskuje i kto jakie ponosi koszty), określająca czytelnie <strong>zobowiązania i prawa</strong> partnerów.</p><p>Cechy: odnosi się do <strong>dostarczającego usługi i nabywcy</strong>; zawsze zawiera <strong>wymianę</strong>, bo psycholog dostaje wynagrodzenie i satysfakcję; jest <strong>negocjowalny</strong>, czyli można go zmieniać w trakcie za zgodą stron, częściej w terapii niż w diagnozie. Niewypowiedziane oczekiwania nie mogą być uzgodnione i prowadzą do rozczarowania.</p>"},
{"src":"Zalewski","q":"Skąd bierze się asymetria w relacji psycholog–klient i jaką rolę pełni wobec niej kontrakt?","a":"<p>Psycholog jest na swoim terytorium, ma wiedzę, której klient nadaje magiczne znaczenie, zadaje pytania, nie ujawniając nic o sobie, jest „zdrowym specjalistą” wobec klienta „z problemami”, a klient przypisuje mu moc etykietowania. Relacja przypomina relację rodzic–dziecko i sprzyja częściowej regresji oraz lękowym wyobrażeniom. Osoba bez korzyści z diagnozy nie będzie współpracować, więc pojawia się opór.</p><p>Kontrakt buduje <strong>podmiotową relację</strong>: jawnie ustala role, prawa i obowiązki, zostawia klientowi decyzję o udziale i zakresie ujawnień, czyni go współodpowiedzialnym, rewiduje oczekiwania i zmniejsza lęk.</p>"},
{"src":"Zalewski","q":"Co mówią kodeksy PTP i APA o świadomej zgodzie? Kiedy można od niej odstąpić?","a":"<p><strong>PTP:</strong> psycholog każdorazowo uzgadnia cel, zakres i sposoby postępowania, respektuje wartości i decyzje klienta, a osoby niezgłaszające się z własnej inicjatywy, także dzieci, informuje o celu, metodach, wynikach i ich udostępnieniu. W badaniach obowiązuje dobrowolność, prawo wycofania się i zgoda na nagrywanie.</p><p><strong>APA 3.10:</strong> świadoma zgoda po zrozumiałym poinformowaniu; przy nakazie sądu informacja o nakazie i granicach poufności; wobec osób niezdolnych do zgody wyjaśnienia, dążenie do akceptacji (<em>assent</em>), uwzględnienie interesów i zgoda osoby uprawnionej. APA 8.02 wylicza informacje dla uczestników badań, 8.03 dotyczy zgody na nagranie.</p><p><strong>Odstąpienie:</strong> APA 8.05, gdy badanie nie przysporzy stresu ani szkody i dotyczy ćwiczeń w naturalnym kształceniu albo anonimowych kwestionariuszy, obserwacji naturalnych lub badań archiwalnych. APA 9.03: ocena nakazana prawem, zgoda domyślna (rutyna organizacji, rekrutacja) lub ocena zdolności do podejmowania decyzji.</p>"},
{"src":"Zalewski","q":"Wyjaśnij hasła „psycholog nie jest wróżką” i „dwóch ekspertów w jednym pokoju”.","a":"<p>Klient przypisuje psychologowi magiczne zdolności: chce w nim widzieć wróżkę i jednocześnie się tego boi. Trzeba uświadomić mu, że psycholog nie przejrzy go na wylot i dowie się tylko tyle, ile klient sam powie. Klient ma prawo odmówić odpowiedzi bez podawania powodu. Informacje z innych źródeł ustala się z klientem, a w sprawy intymne wnika się tylko w zakresie celów pomocy, nie dla „fajerwerków”.</p><p><strong>Dwóch ekspertów:</strong> psycholog ma ogólną wiedzę o ludziach, klient jest ekspertem od siebie. Sesja to ich współpraca: pytamy, jak klient doświadcza siebie i świata, i mówimy, co zrozumieliśmy. Psycholog sprawdza też swoje kwalifikacje i motywację, a gdy ich brak, kieruje klienta do innego specjalisty.</p>"},
{"src":"Zalewski","q":"Porównaj kontrakt diagnostyczny i kontrakt na terapię.","a":"<p><strong>Diagnostyczny</strong> jest krótki (diagnoza trwa 1–3 spotkania, wystarczy kilka zdań), a jego celem jest poznanie bez zmieniania. Ustala cele i sposób rozmowy, czy problem wymaga terapii, jakiej i kto ma jej podlegać. Psycholog przedstawia uprawnienia, liczbę spotkań, opłaty, termin informacji zwrotnej i możliwe obciążenia emocjonalne.</p><p><strong>Terapeutyczny</strong> negocjuje się dłużej i sam jest częścią terapii. Celem jest aktywne wywołanie zmian. Określa cele i sposoby, role i warunki pomocy; zwykle to klient określa cel. W terapii krótkoterminowej jest zasadniczym etapem, a nierealne lub negatywne oczekiwania zmienia się przez pozytywne przeformułowania. Oba eliminują nieadekwatne oczekiwania i osoby niezmotywowane.</p>"},
{"src":"Zalewski","q":"Kiedy psycholog może ujawnić informacje objęte tajemnicą zawodową?","a":"<p>Według PTP tylko przy <strong>poważnym zagrożeniu bezpieczeństwa</strong> klienta lub innych osób; decyzję warto omówić z doświadczonym, bezstronnym kolegą. Rakowska podkreśla, że tajemnica jest drugorzędna wobec ochrony życia i zdrowia. Prawo wymaga przekazania informacji organom ścigania przy nadużyciach wobec dziecka lub osoby starszej; w Polsce m.in. przy maltretowaniu w rodzinie i nadużyciach seksualnych wobec dzieci.</p><p>Przy raporcie dla pracodawcy klienta informuje się wcześniej, jakie dane zostaną przekazane, a on decyduje, co powie.</p>"},
{"src":"Geller, Król","q":"Jak nawiązywać kontakt na początku rozmowy i czego unikać?","a":"<p>Zadania na początku to zmniejszyć lęk i wzbudzić motywację. Ze względu na <strong>efekt halo</strong> od pierwszej chwili okazuje się pełną, autentyczną uwagę, bez spóźniania się i każenia czekać. Dystans utrzymuje się w optymalnych granicach: partnerska postawa, przedstawienie się i swojej roli, bez siadania wyżej czy za biurkiem i bez wpatrywania się w rozmówcę. Pierwsze pytanie jest ogólne, otwarte, osobiste, ale niezagrażające. Przy przymusie buduje się zaufanie przez dyskrecję albo zapewnienie, że informacje nie zostaną użyte wbrew interesom.</p><p>Unikać trzeba łamania dynamiki (za szybko trudne pytania), ocen i dezaprobaty, przesadnej, nienaturalnej życzliwości i budowania obrazu „cudotwórcy”.</p>"}
]
