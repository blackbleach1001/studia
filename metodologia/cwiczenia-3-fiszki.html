"a": "<p>Phi – w układzie 2×2 (wtedy opisujemy też, na czym polega związek). V Cramera – w układach większych niż 2×2 (bez opisu charakteru związku). Dokładny test Fishera – gdy w którejś komórce liczebność oczekiwana jest mniejsza niż 5 (tylko 2×2). Przy wyniku nieistotnym nie podajemy siły związku.<\/p>",
"k": [
"phi: 2×2",
"V Cramera: większe tabele",
"Fisher: oczekiwana < 5",
"n.i. – bez siły"
],
