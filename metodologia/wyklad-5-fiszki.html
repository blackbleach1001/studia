"q": "Co trzeba ustalić, dobierając grupę badawczą?",
"a": "<p><strong>Jakich jednostek<\/strong> potrzeba (kryteria włączenia/wyłączenia), <strong>w jakiej liczbie<\/strong> (minimalna liczebność) i <strong>jak je zdobyć<\/strong> (ogólny sposób doboru). Zależy to od celu i problemu badawczego, oczekiwanych wniosków, możliwości organizacyjnych oraz pieniędzy i czasu.<\/p>",
"src": "Józefacka i in., t. 1",
"k": [
"jednostki",
"liczba",
"sposób doboru"
],
"id": "metodologia/wyklad-5-fiszki:57d6a605",
"unit": "wyklad-5.html",
"sec": "s1"
},
{
"q": "Czym są kryteria włączenia i wyłączenia? Podaj przykład.",
"a": "<p><strong>Włączenia<\/strong> to cechy, które badani muszą mieć (np. pilotki w wieku 20–40 lat, leworęczne). <strong>Wyłączenia<\/strong> to cechy wykluczające (np. palenie papierosów). Pozwalają kontrolować skład grupy.<\/p>",
"src": "Józefacka i in., t. 1",
"k": [
"muszą mieć",
"wykluczają"
],
"id": "metodologia/wyklad-5-fiszki:dd288731",
"unit": "wyklad-5.html",
"sec": "s1"
},
{
"q": "Czym różni się dobór losowy od nielosowego?",
"a": "<p>W <strong>losowym<\/strong> każdy ma <strong>równą szansę<\/strong> trafić do próby, więc można wnioskować o populacji. W <strong>nielosowym<\/strong> wybiera badacz (wiedza, dostępność), więc <strong>brak podstaw do wnioskowania statystycznego<\/strong>; wnioskujemy o próbie.<\/p>",
"src": "Józefacka i in., t. 1",
"k": [
"równa szansa",
"wnioskowanie o populacji"
],
"id": "metodologia/wyklad-5-fiszki:8505a6a7",
"unit": "wyklad-5.html",
"sec": "s2"
},
{
"q": "Wymień metody doboru losowego.",
"a": "<p><strong>Prosty<\/strong>, <strong>systematyczny<\/strong>, <strong>warstwowy<\/strong>; także grupowy i wielostopniowy.<\/p>",
"src": "Józefacka i in., t. 1",
"k": [
"prosty",
"systematyczny",
"warstwowy"
],
"id": "metodologia/wyklad-5-fiszki:2e59ed2a",
"unit": "wyklad-5.html",
"sec": "s2"
},
{
"q": "Co to jest operat losowania?",
"a": "<p>Sposób <strong>numerowania<\/strong> elementów populacji, z którego losujemy (kolejne numery, PESEL, numer indeksu, numer w dzienniku).<\/p>",
"src": "Józefacka i in., t. 1",
"k": [
"numeracja populacji"
],
"id": "metodologia/wyklad-5-fiszki:8560081a",
"unit": "wyklad-5.html",
"sec": "s2"
},
{
"q": "Na czym polega losowanie bezzwrotne a zwrotne?",
"a": "<p><strong>Bezzwrotne:<\/strong> element można wylosować tylko raz (w praktyce efektywniejsze). <strong>Zwrotne:<\/strong> po wylosowaniu wraca do puli i może wypaść ponownie; każdy ma przy każdym losowaniu tę samą szansę.<\/p>",
"src": "Józefacka i in., t. 1",
"k": [
"raz",
"wraca do puli"
],
"id": "metodologia/wyklad-5-fiszki:169a5c66",
"unit": "wyklad-5.html",
"sec": "s2"
},
{
"q": "Na czym polega losowanie systematyczne i na co uważać?",
"a": "<p>Losujemy <strong>co któryś element<\/strong> z wykazu (np. co 5.). Trzeba upewnić się, że kolejność wykazu jest przypadkowa, a nie np. uporządkowana według wynagrodzenia.<\/p>",
"src": "Józefacka i in., t. 1",
"k": [
"co n-ty",
"kolejność przypadkowa"
],
"id": "metodologia/wyklad-5-fiszki:fd82232c",
"unit": "wyklad-5.html",
"sec": "s2"
},
{
"q": "Na czym polega losowanie warstwowe?",
"a": "<p>Populację dzielimy według kryterium na rozłączne, wewnętrznie jednorodne <strong>warstwy<\/strong> (np. junior i senior) i losujemy z każdej osobno. To losowanie <strong>ograniczone<\/strong>, w odróżnieniu od <strong>nieograniczonego<\/strong> prostego.<\/p>",
"src": "Józefacka i in., t. 1",
"k": [
"warstwy",
"osobno z każdej"
],
"id": "metodologia/wyklad-5-fiszki:b6e69678",
"unit": "wyklad-5.html",
"sec": "s2"
},
{
"q": "Wymień metody doboru nielosowego.",
"a": "<p><strong>Kwotowy<\/strong>, <strong>jednostek typowych<\/strong>, <strong>przez eliminację<\/strong>, <strong>kula śnieżna<\/strong>, <strong>celowy<\/strong>, <strong>przypadkowy<\/strong>, <strong>ochotnicy<\/strong>.<\/p>",
"src": "Józefacka i in., t. 1",
"k": [
"kwotowy",
"kula śnieżna",
"celowy",
"przypadkowy"
],
"id": "metodologia/wyklad-5-fiszki:d1dc868d",
"unit": "wyklad-5.html",
"sec": "s2"
},
{
"q": "Na czym polega dobór kwotowy?",
"a": "<p>Znamy strukturę populacji i świadomie odtwarzamy ją w próbie (np. gdy w linii lotniczej jest 50% kobiet i 50% mężczyzn, dobieramy podobne proporcje).<\/p>",
"src": "Józefacka i in., t. 1",
"k": [
"struktura populacji",
"proporcje"
],
"id": "metodologia/wyklad-5-fiszki:8d4b2529",
"unit": "wyklad-5.html",
"sec": "s2"
},
{
"q": "Kiedy stosuje się metodę kuli śnieżnej?",
"a": "<p>Gdy populacja jest <strong>trudno dostępna<\/strong> (np. zarobki na czarnym rynku). Znajdujemy małą grupę i prosimy ją o przekazanie informacji o badaniu dalej.<\/p>",
"src": "Józefacka i in., t. 1",
"k": [
"trudno dostępna",
"polecenia"
],
"id": "metodologia/wyklad-5-fiszki:5283ad6b",
"unit": "wyklad-5.html",
"sec": "s2"
},
{
"q": "Czym różni się dobór jednostek typowych od doboru przez eliminację?",
"a": "<p>W <strong>typowych<\/strong> badacz wybiera jednostki uznane za typowe. W <strong>eliminacji<\/strong> usuwa z próby jednostki, które uważa za nietypowe.<\/p>",
"src": "Józefacka i in., t. 1",
"k": [
"typowe",
"nietypowe"
],
"id": "metodologia/wyklad-5-fiszki:2309f1d2",
"unit": "wyklad-5.html",
"sec": "s2"
},
{
"q": "Jaki problem niesie badanie ochotników?",
"a": "<p>Osoby, które się zgłaszają, mogą <strong>różnić się<\/strong> od tych, które tego nie zrobiły (np. do badania lęku przed lataniem z lotem na spadochronie zgłoszą się odważniejsi). Kontrolujemy to kryteriami włączenia/wyłączenia i informacją o badaniu.<\/p>",
"src": "Józefacka i in., t. 1",
"k": [
"różnią się od reszty"
],
"id": "metodologia/wyklad-5-fiszki:2a0d7771",
"unit": "wyklad-5.html",
"sec": "s2"
},
{
"q": "Jakie rodzaje trafności badania wyróżnia się w książce?",
"a": "<p><strong>Konstruktu<\/strong> (trafność pomiaru), <strong>wniosków<\/strong>, <strong>zewnętrzna<\/strong> i <strong>wewnętrzna<\/strong>. Konstruktu i wewnętrzna są kluczowe w fazie I, wniosków dotyczy fazy III (analiza).<\/p>",
"src": "Józefacka i in., t. 1",
"k": [
"konstruktu",
"wniosków",
"zewnętrzna",
"wewnętrzna"
],
"id": "metodologia/wyklad-5-fiszki:2d818789",
"unit": "wyklad-5.html",
"sec": "s3"
},
{
"q": "Co zaburza trafność wniosków?",
"a": "<p>Zamierzone decyzje (oszustwo) lub przypadkowe błędy, zwłaszcza <strong>niska rzetelność pomiaru<\/strong> (niedokładne, niewiarygodne, niespójne narzędzia) pogarszająca jakość analizy.<\/p>",
"src": "Józefacka i in., t. 1",
"k": [
"oszustwo",
"niska rzetelność"
],
"id": "metodologia/wyklad-5-fiszki:a421205a",
"unit": "wyklad-5.html",
"sec": "s3"
},
{
"q": "Co to jest trafność zewnętrzna i jakie ma rodzaje?",
"a": "<p>Stopień, w jakim wyniki można <strong>uogólnić<\/strong> na inne osoby, sytuacje i czasy. Rodzaje: dla <strong>populacji<\/strong>, <strong>środowiska<\/strong> (ekologiczna) i <strong>czasu<\/strong>.<\/p>",
"src": "Józefacka i in., t. 1",
"k": [
"populacja",
"środowisko",
"czas"
],
"id": "metodologia/wyklad-5-fiszki:3a558700",
"unit": "wyklad-5.html",
"sec": "s3"
},
{
"q": "Podaj przykłady zagrożeń trafności zewnętrznej.",
"a": "<p><strong>Populacja:<\/strong> szczury i studenci nie są „przeciętnym Kowalskim”. <strong>Środowisko:<\/strong> wyniki z Europejczyków mogą nie przenosić się na Azjatów, symulator na prawdziwy lot. <strong>Czas:<\/strong> wyniki sprzed dekad mogą się zdezaktualizować, dlatego replikuje się stare badania.<\/p>",
"src": "Józefacka i in., t. 1",
"k": [
"szczury i studenci",
"kultury",
"replikacje"
],
"id": "metodologia/wyklad-5-fiszki:bf7315bd",
"unit": "wyklad-5.html",
"sec": "s3"
},
{
"q": "Co to jest trafność wewnętrzna?",
"a": "<p>Przekonanie, że zmienna zależna wynika <strong>bezpośrednio z manipulacji zmienną niezależną<\/strong>, a nie z innego niekontrolowanego czynnika. W korelacji: że związek jest prawdziwy, a nie wynika z trzeciej zmiennej.<\/p>",
"src": "Józefacka i in., t. 1",
"k": [
"manipulacja",
"trzecia zmienna"
],
"id": "metodologia/wyklad-5-fiszki:a7600d8c",
"unit": "wyklad-5.html",
"sec": "s3"
},
{
"q": "Wymień zagrożenia trafności wewnętrznej.",
"a": "<p>Zmienna zakłócająca; efekty oczekiwań (Rosenthala/Pigmaliona, zachowanie „jak należy”); pora i warunki badania; <strong>brak grupy kontrolnej<\/strong>; brak lub niedokładna operacjonalizacja; złe narzędzia; zły dobór osób i brak dobrych kryteriów; złe przydzielenie do grup.<\/p>",
"src": "Józefacka i in., t. 1",
"k": [
"zmienna zakłócająca",
"brak grupy kontrolnej",
"operacjonalizacja"
],
"id": "metodologia/wyklad-5-fiszki:ce140dc3",
"unit": "wyklad-5.html",
"sec": "s3"
},
{
"q": "Czym jest populacja i dlaczego badamy próby?",
"a": "<p><strong>Populacja<\/strong> to wszystkie elementy interesującego nas zbioru. Opis całej populacji zwykle jest niemożliwy (koszty, czas, przestrzeń), więc <strong>badamy próby<\/strong> i wnioskujemy o populacji.<\/p>",
"src": "Józefacka i in., t. 1",
"k": [
"cały zbiór",
"próba"
],
"id": "metodologia/wyklad-5-fiszki:da030ba9",
"unit": "wyklad-5.html",
"sec": "s4"
},
{
"q": "Co oznaczają N i n?",
"a": "<p><strong>N<\/strong> (duże) to liczebność populacji, <strong>n<\/strong> (małe) to liczebność próby.<\/p>",
"src": "Józefacka i in., t. 1",
"k": [
"N populacja",
"n próba"
],
"id": "metodologia/wyklad-5-fiszki:34a1c32d",
"unit": "wyklad-5.html",
"sec": "s4"
},
{
"q": "Czym jest reprezentatywność próby i od czego zależy?",
"a": "<p>Próba jest <strong>reprezentatywna<\/strong>, gdy odzwierciedla charakterystykę populacji. Zależy od <strong>losowego doboru<\/strong> i <strong>liczebności<\/strong> próby. Pewności 100% nigdy nie ma.<\/p>",
"src": "Józefacka i in., t. 1",
"k": [
"odzwierciedla populację",
"losowość",
"liczebność"
],
"id": "metodologia/wyklad-5-fiszki:afcb25be",
"unit": "wyklad-5.html",
"sec": "s4"
},
{
"q": "Czym różni się populacja skończona od hipotetycznej?",
"a": "<p><strong>Skończona<\/strong> istnieje i ma określoną liczbę jednostek. <strong>Hipotetyczna<\/strong> obejmuje wszystkie jednostki danego typu, także te teraz niedostępne; jest nieskończona, a jej parametry zwykle nieznane. W większości badań wnioskujemy o hipotetycznej.<\/p>",
"src": "Józefacka i in., t. 1",
"k": [
"skończona",
"hipotetyczna"
],
"id": "metodologia/wyklad-5-fiszki:8342deb1",
"unit": "wyklad-5.html",
"sec": "s4"
},
{
"q": "Czym jest estymacja i jakie są jej rodzaje?",
"a": "<p>Szacowanie właściwości populacji na podstawie próby. <strong>Punktowa:<\/strong> jedna wartość (np. średnia). <strong>Przedziałowa:<\/strong> zakres (przedział ufności, najczęściej 95%).<\/p>",
"src": "Józefacka i in., t. 1",
"k": [
"punktowa",
"przedziałowa"
],
"id": "metodologia/wyklad-5-fiszki:b7bb1da0",
"unit": "wyklad-5.html",
"sec": "s5"
},
{
"q": "Czym różni się parametr od estymatora?",
"a": "<p><strong>Parametr<\/strong> to wartość charakteryzująca populację (np. średnia z 702 ofert: 5720,80 zł). <strong>Estymator<\/strong> to wartość z próby, którą ten parametr szacujemy (7000, 5200, 6000 zł).<\/p>",
"src": "Józefacka i in., t. 1",
"k": [
"parametr: populacja",
"estymator: próba"
],
"id": "metodologia/wyklad-5-fiszki:e8415ee7",
"unit": "wyklad-5.html",
"sec": "s5"
},
{
"q": "Co to jest błąd pomiaru, a co błąd standardowy?",
"a": "<p><strong>Błąd pomiaru:<\/strong> różnica między parametrem a estymatorem. <strong>Błąd standardowy:<\/strong> o ile średnio mylilibyśmy się, powtarzając badanie na próbach n-elementowych; pokazuje, jak statystyka różni się między próbami.<\/p>",
"src": "Józefacka i in., t. 1",
"k": [
"różnica",
"powtarzane badanie"
],
"id": "metodologia/wyklad-5-fiszki:c19db415",
"unit": "wyklad-5.html",
"sec": "s5"
},
{
"q": "Od czego zależy błąd standardowy?",
"a": "<p>Jest <strong>ujemnie związany z liczebnością próby<\/strong> (większa próba, mniejszy błąd) i <strong>dodatnio z rozrzutem<\/strong> wyników (większy rozrzut, większy błąd).<\/p>",
"src": "Józefacka i in., t. 1",
"k": [
"n w dół",
"rozrzut w górę"
],
"id": "metodologia/wyklad-5-fiszki:6c6c9e7f",
"unit": "wyklad-5.html",
"sec": "s5"
},
{
"q": "Co pokazał przykład z ogłoszeniami (n = 5, 10, 30)?",
"a": "<p>Średnie 7000, 5200 i 6000 zł przy prawdziwej 5720,80 zł; błędy pomiaru 1279,20, 520,80 i 279,20 zł. Po 30 losowaniach: średni błąd standardowy <strong>1062,50, 464,15 i 312,40 zł<\/strong>, czyli precyzja rośnie z wielkością próby.<\/p>",
"src": "Józefacka i in., t. 1",
"k": [
"1279,20",
"520,80",
"279,20"
],
"id": "metodologia/wyklad-5-fiszki:c8e0f5e9",
"unit": "wyklad-5.html",
"sec": "s5"
},
{
"q": "Na czym polega prawo wielkich liczb (Bernoulliego)?",
"a": "<p>Im większa liczebność n w kolejnych losowaniach, tym <strong>bardziej średnia ze średnich zbliża się do średniej w populacji<\/strong> (prawdopodobieństwo zgodności dąży do 1).<\/p>",
"src": "Józefacka i in., t. 1",
"k": [
"większe n",
"średnia zbliża się do populacji"
],
"id": "metodologia/wyklad-5-fiszki:997f90e8",
"unit": "wyklad-5.html",
"sec": "s6"
},
{
"q": "Skąd zasada minimum n = 30?",
"a": "<p>Błąd standardowy najszybciej spada przy małych próbach, a około n = 30 <strong>zwalnia<\/strong> (jak zjeżdżalnia). Dalej każda obserwacja daje coraz mniejszą poprawę.<\/p>",
"src": "Józefacka i in., t. 1",
"k": [
"zjeżdżalnia",
"zwalnia przy 30"
],
"id": "metodologia/wyklad-5-fiszki:feef7e8e",
"unit": "wyklad-5.html",
"sec": "s6"
},
{
"q": "Ile trzeba zwiększyć próbę, by błąd standardowy spadł dwukrotnie?",
"a": "<p><strong>Czterokrotnie.<\/strong> Przy n = 30 oznacza to 120 obserwacji (dobadać 90).<\/p>",
"src": "Józefacka i in., t. 1",
"k": [
"4×",
"30 → 120"
],
"id": "metodologia/wyklad-5-fiszki:23502c29",
"unit": "wyklad-5.html",
"sec": "s6"
},
{
"q": "Czy zasada n = 30 jest sztywna? Do czego się odnosi?",
"a": "<p>Nie, jest <strong>orientacyjna<\/strong> i zależy od zjawiska, celu, analizy i rozkładu zmiennej. Dotyczy <strong>każdej grupy<\/strong> w porównaniach (np. testy średnich); w regresji ok. 10 obserwacji więcej niż zmiennych.<\/p>",
"src": "Józefacka i in., t. 1",
"k": [
"orientacyjna",
"każda grupa"
],
"id": "metodologia/wyklad-5-fiszki:0fd8afbc",
"unit": "wyklad-5.html",
"sec": "s6"
},
{
"q": "Co zyskujemy przy większej próbie i co przy małych próbach?",
"a": "<p>Większa próba zwiększa <strong>moc testów<\/strong> i możliwości analizy. Przy małych próbach stosuje się np. <strong>test t-Studenta<\/strong> i <strong>dokładny test Fishera<\/strong>; minimalną liczebność można policzyć analizą mocy.<\/p>",
"src": "Józefacka i in., t. 1",
"k": [
"moc testów",
"t-Studenta",
"Fisher"
],
"id": "metodologia/wyklad-5-fiszki:0fc2cc0c",
"unit": "wyklad-5.html",
"sec": "s6"
}
]
