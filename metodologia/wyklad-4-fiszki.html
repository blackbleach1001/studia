"a": "<p><strong>Manipulowane<\/strong>: <strong>sytuacyjna<\/strong> (różne warunki: muzyka vs żarty w turbulencji), <strong>zadaniowa<\/strong> (różne zadania: nucenie vs oddychanie), <strong>instruktażowa<\/strong> (różne instrukcje: oddychać cały lot vs tylko w turbulencji). <strong>Podmiotowa<\/strong>: cecha osoby (płeć, wykształcenie) – nie da się nią manipulować ani randomizować; daje quasi-eksperyment.<\/p>",

"q": "Czym różni się model eksperymentalny od nieeksperymentalnego?",
"a": "<p><strong>Eksperymentalny<\/strong>: manipulacja ZN, randomizacja, grupy eksperymentalna i kontrolna, zwykle mniejsze, wnioski przyczynowe, wysoka trafność wewnętrzna kosztem zewnętrznej. <strong>Nieeksperymentalny<\/strong>: bez manipulacji, zmienne współtowarzyszące (predyktory, kryterialna), duże grupy, wnioski o współwystępowaniu i predykcji, nie o przyczynie.<\/p>",

"q": "Czym są predyktor i zmienna kryterialna w badaniu korelacyjnym?",
"a": "<p><strong>Predyktor<\/strong> (zmienna predykcyjna) to zmienna, na podstawie której przewidujemy wynik (np. poczucie humoru), <strong>zmienna kryterialna<\/strong> (objaśniana) – ta, którą przewidujemy (lęk w turbulencji). Kryterialna jest jedna, predyktorów może być wiele; nie wynika z tego przyczynowość.<\/p>",

{

"q": "Czym jest operacjonalizacja i czym różni się definicja teoretyczna od operacyjnej?",
"a": "<p><strong>Operacjonalizacja<\/strong> to łączenie pojęć (konstruktów) ze sposobami ich pomiaru – przeniesienie na grunt empiryczny. <strong>Definicja teoretyczna<\/strong> opisuje, czym jest konstrukt (co badamy), <strong>operacyjna<\/strong> – jak dokładnie go mierzymy (np. liczba trafnych procedur w symulowanej awarii albo punkty w teście). Jedna definicja teoretyczna może mieć różne definicje operacyjne.<\/p>",

{
"src": "Bedyńska i Cypryańska",
"q": "Czym różni się kowariancja od współczynnika r-Pearsona?",
"a": "<p><strong>Kowariancja<\/strong> (suma iloczynów odchyleń od średnich / N − 1) pokazuje tylko kierunek związku, jest niewystandaryzowana i zależy od jednostek. <strong>r-Pearsona<\/strong> to wystandaryzowana kowariancja (ΣZ<sub>x<\/sub>Z<sub>y<\/sub>/(N − 1)), pokazuje kierunek i siłę, nie zależy od jednostek, przyjmuje wartości od −1 do 1.<\/p>",

"kowariancja – tylko kierunek",
"zależy od jednostek",
"r – wystandaryzowana",
"od −1 do 1, siła i kierunek"
],

"unit": "wyklad-4.html",
"sec": "s8"
},
{
"src": "Bedyńska i Cypryańska",
"q": "Jak interpretować siłę i kierunek korelacji r-Pearsona?",
"a": "<p><strong>Siła<\/strong> (|r|): 0–0,30 brak lub bardzo słaba, 0,31–0,50 umiarkowana, 0,51–0,70 silna, 0,71–1 bardzo silna. <strong>Kierunek<\/strong>: dodatnia – wysokim wartościom jednej zmiennej towarzyszą wysokie drugiej; ujemna – wysokim towarzyszą niskie; zerowa – brak związku liniowego. Interpretuje się tylko korelacje istotne (p &lt; 0,05).<\/p>",
"k": [
"progi 0,3 / 0,5 / 0,7",
"dodatnia i ujemna",
"zerowa",
"tylko istotne"
],
"id": "metodologia/wyklad-4-fiszki:7f3f39f3",
"unit": "wyklad-4.html",
"sec": "s8"
},
{
"src": "Bedyńska i Cypryańska",
"q": "Do czego służy wykres rozrzutu i linia dopasowania?",
"a": "<p>Wykres rozrzutu pokazuje pary obserwacji jako punkty i pozwala ocenić <strong>kształt<\/strong> związku (liniowy czy nie, obserwacje odstające). Linię dopasowania wyznacza się <strong>metodą najmniejszych kwadratów<\/strong> (minimalna suma kwadratów odległości punktów od linii); im bliżej linii punkty, tym trafniejsza predykcja. Dodatnia: od lewego dolnego do prawego górnego rogu.<\/p>",
"k": [
"kształt związku",
"obserwacje odstające",
"metoda najmniejszych kwadratów",
"kierunek linii"
],
"id": "metodologia/wyklad-4-fiszki:490173d4",
"unit": "wyklad-4.html",
"sec": "s8"
},
{
"src": "Bedyńska i Cypryańska",
"q": "Dlaczego korelacji nie wolno interpretować przyczynowo? Czym jest korelacja pozorna?",
"a": "<p>Korelacja mówi tylko o <strong>współwystępowaniu<\/strong>: nie wiadomo, czy stres obniża wyniki, czy słabe wyniki zwiększają stres. <strong>Korelacja pozorna<\/strong> to związek, który istnieje dzięki <strong>trzeciej zmiennej<\/strong> (np. nici dentystyczne i golf – zamożność kraju; towarzyskość i zadowolenie – liczba znajomych).<\/p>",

"przykład"

},
{
"src": "Bedyńska i Cypryańska",
"q": "Czego uczy kwartet Anscombe'a i jakie inne pułapki ma korelacja?",
"a": "<p>Cztery zbiory mają niemal identyczne r ≈ 0,82, a tylko jeden przedstawia związek liniowy; inne to związek <strong>krzywoliniowy<\/strong>, związek zniekształcony przez <strong>obserwację odstającą<\/strong> i brak związku poza jednym punktem. Wniosek: zawsze robić <strong>wykres rozrzutu<\/strong>. Inna pułapka: <strong>ograniczony zakres<\/strong> – związek nie jest taki sam w całym zakresie zmiennej.<\/p>",
"k": [

"wykres rozrzutu",
"ograniczony zakres"
],

"q": "Jaki współczynnik korelacji zastosować w zależności od skali pomiaru?",
"a": "<p>Dwie zmienne ilościowe – <strong>r-Pearsona<\/strong>; porządkowe – <strong>rho Spearmana<\/strong> lub <strong>tau-b Kendalla<\/strong>; nominalne 2×2 – <strong>phi<\/strong>; nominalne o więcej kategoriach – <strong>V Cramera<\/strong> (0–1, bez kierunku); ilościowa z nominalną – <strong>eta<\/strong>.<\/p>",

{

"q": "Na czym polega test chi-kwadrat dla tabel krzyżowych?",

{
"src": "Bedyńska i Cypryańska",
"q": "Kiedy stosuje się poprawkę Yatesa, dokładny test Fishera i chi-kwadrat jako test założeń?",
"a": "<p><strong>Poprawka na ciągłość (Yates)<\/strong> – tylko tabele 2×2. <strong>Dokładny test Fishera<\/strong> – tabele 2×2, gdy N &lt; 30 lub liczebność oczekiwana w komórce &lt; 5. Chi-kwadrat służy też do sprawdzania <strong>równoliczności grup<\/strong> przed innymi testami – wtedy pożądany jest wynik nieistotny.<\/p>",
"k": [
"Yates – 2×2",
"Fisher – małe liczebności",
"test założeń: wynik nieistotny"
],
"id": "metodologia/wyklad-4-fiszki:4ae53c4e",
"unit": "wyklad-4.html",
"sec": "s10"
},
{
"src": "Bedyńska i Cypryańska",
"q": "Kiedy stosujemy testy t-Studenta i jakie są ich trzy rodzaje?",
"a": "<p>Gdy porównujemy <strong>dwie średnie<\/strong>, ZZ jest <strong>ilościowa<\/strong>, a ZN dwuwartościowa. <strong>Dla prób niezależnych<\/strong> – różne osoby w grupach; <strong>dla prób zależnych<\/strong> – te same osoby dwa razy (pomiar powtarzany); <strong>dla jednej próby<\/strong> – średnia z próby vs wartość teoretyczna lub empiryczna.<\/p>",
"k": [
"dwie średnie, ZZ ilościowa",
"próby niezależne",
"próby zależne",
"jedna próba vs wartość"
],
"id": "metodologia/wyklad-4-fiszki:47e91351",
"unit": "wyklad-4.html",
"sec": "s11"
},
{
"src": "Bedyńska i Cypryańska",
"q": "Jakie są zalety i wady pomiaru powtarzanego (prób zależnych)?",
"a": "<p>Zaleta: te same osoby w obu warunkach, więc mniej zakłóceń wynikających z <strong>różnic indywidualnych<\/strong>. Wady: <strong>efekt wprawy<\/strong>, wpływ pierwszego pomiaru na drugi, czasem absurdalność procedury dla badanego. Kontroluje się to m.in. <strong>zmianą kolejności<\/strong> warunków.<\/p>",
"k": [
"mniej różnic indywidualnych",
"efekt wprawy",
"wpływ pierwszego pomiaru",
"zmiana kolejności"
],

},
{
"src": "Bedyńska i Cypryańska",
"q": "Jakie są założenia testów t i jak radzić sobie z ich naruszeniem?",
"a": "<p>ZZ <strong>ilościowa<\/strong>, rozkład <strong>zbliżony do normalnego<\/strong>, dla prób niezależnych <strong>jednorodność wariancji<\/strong> (test Levene'a: nieistotny → jednorodne; istotny → wiersz z poprawką) i podobna <strong>liczebność<\/strong> grup. Testy t są dość odporne, zwłaszcza przy równych grupach i N &gt; 30. Przy poważnych naruszeniach: <strong>U Manna-Whitneya<\/strong> (niezależne) lub <strong>Wilcoxon<\/strong> (zależne) – oparte na rangach, ale bardziej konserwatywne.<\/p>",
"k": [
"skala ilościowa, normalność",
"Levene – jednorodność wariancji",
"równoliczność, odporność",
"U Manna-Whitneya, Wilcoxon"
],
"id": "metodologia/wyklad-4-fiszki:a4a8ecf0",
"unit": "wyklad-4.html",
"sec": "s11"
},
{
"src": "Bedyńska i Cypryańska",
"q": "Na czym polega testowanie hipotezy zerowej i co oznacza wynik istotny statystycznie?",
"a": "<p>Wnioskowanie jest <strong>indukcyjne<\/strong> (z próby o populacji) i <strong>pośrednie<\/strong>: zakładamy H₀ (brak różnicy) i szacujemy, jak prawdopodobny jest uzyskany wynik przy jej prawdziwości. Jeśli p &lt; 0,05 (umowny poziom), odrzucamy H₀ na rzecz H₁. <strong>Wynik istotny<\/strong> = taka różnica byłaby bardzo mało prawdopodobna, gdyby H₀ była prawdziwa. H₀ i H₁ muszą się wykluczać.<\/p>",
"k": [
"H₀ – brak różnicy",
"p < 0,05 – odrzucenie H₀",
"wnioskowanie pośrednie i indukcyjne",
"istotny = mało prawdopodobny przy H₀"
],
"id": "metodologia/wyklad-4-fiszki:cdd48b7d",
"unit": "wyklad-4.html",
"sec": "s11"
},
{
"src": "Bedyńska i Cypryańska",
"q": "Czym jest d Cohena i jak je interpretować?",
"a": "<p>To miara <strong>wielkości efektu<\/strong> dla różnicy dwóch średnich – istotność nie mówi o sile efektu (przy dużej próbie nawet mała różnica bywa istotna). Progi Cohena: <strong>0,20 mały, 0,50 średni, 0,80 duży<\/strong>. Dla prób zależnych d = średnia różnic / SD różnic.<\/p>",
"k": [
"wielkość efektu",
"istotność ≠ siła",
"0,2 / 0,5 / 0,8"
],
"id": "metodologia/wyklad-4-fiszki:bb48064a",
"unit": "wyklad-4.html",
"sec": "s11"
},
{

"q": "Jak poprawnie zapisać wynik testu t w raporcie?",

"k": [
"M i SD grup",
"t(df), p, d",
"bez wzmianki o H₀",
"p < 0,001 zamiast 0,000"
],

},
{

"q": "Czym różni się wariancja od odchylenia standardowego i do czego się ich używa?",
"a": "<p><strong>Wariancja<\/strong> to średnia kwadratów odległości wyników od średniej; używa się jej w obliczeniach testów (t-Studenta, analiza wariancji), a jednorodność wariancji to założenie testów parametrycznych. <strong>SD<\/strong> to pierwiastek z wariancji, w jednostkach pomiaru – podaje się je w raportach (np. M = 11,78; SD = 2,32).<\/p>",
"k": [
"wariancja: średnia kwadratów odległości",
"SD = pierwiastek",
"SD w raportach",
"wariancja w testach"

},
{

"q": "Jak prosto sprawdzić, czy wariancje w dwóch grupach są jednorodne?",
"a": "<p>Podziel <strong>większe SD przez mniejsze<\/strong>: wynik ≤ 2 – wariancje jednorodne, &gt; 2 – niejednorodne. Alternatywy: <strong>test Levene’a<\/strong> i <strong>test Bartletta<\/strong>. Istotny wynik tych testów (p &lt; 0,05) oznacza niejednorodność.<\/p>",
"k": [
"SD większe / SD mniejsze",
"≤ 2 jednorodne",
"Levene, Bartlett"
],

"sec": "w1"

"q": "Jak wyznaczyć przypadki odstające i skrajne z rozstępu ćwiartkowego?",
"a": "<p>IQR = Q3 − Q1. <strong>Odstające<\/strong>: poniżej Q1 − 1,5·IQR lub powyżej Q3 + 1,5·IQR. <strong>Skrajne<\/strong>: dalej niż 3·IQR. Przykład: Q1 = 36, Q3 = 42, IQR = 6 → odstające &lt; 27 i &gt; 51; 62 &gt; 60 jest skrajne.<\/p>",
"k": [
"IQR = Q3 − Q1",
"1,5·IQR: odstające",
"3·IQR: skrajne",
"granice 27 i 51"
],

"sec": "w2"
},
{
"src": "Slajdy W4",
"q": "Jakie są trzy kryteria uznania rozkładu za zbliżony do normalnego?",
"a": "<p>(1) <strong>Liberalne<\/strong>: skośność i kurtoza w przedziale &lt;−2; 2&gt;. (2) <strong>Umiarkowanie liberalne<\/strong>: skośność i kurtoza podzielone przez swoje błędy standardowe w &lt;−2; 2&gt;. (3) <strong>Konserwatywne<\/strong>: test Kołmogorowa-Smirnowa (n ≥ 100) lub Shapiro-Wilka (n &lt; 100), p &lt; 0,05 oznacza odejście od normalności. Coraz więcej autorów odradza test K-S.<\/p>",
"k": [
"<−2; 2>",
"podzielone przez błąd standardowy",
"K-S n ≥ 100, S-W n < 100",
"K-S budzi wątpliwości"
],

},
{

{

"q": "Jak działa rangowanie i jak traktuje się wyniki równe?",
"a": "<p>Wyniki porządkuje się rosnąco i nadaje im kolejne miejsca (rangi). Równe wartości dostają <strong>średnią<\/strong> z zajmowanych miejsc, np. dwa wyniki na miejscach 5 i 6 → 5,5; pięć wyników na miejscach 10–14 → 12. Rangowanie zmniejsza wpływ odstających i zbliża rozkład do normalnego; w raporcie podaje się średnią rangę (M<sub>rang<\/sub>).<\/p>",
"k": [

"M rang"

"q": "Które istotne różnice są pożądane, a które niepożądane?",
"a": "<p><strong>Pożądane<\/strong> (efekt z hipotezy): różnice między grupami, między pomiarami i między wymiarami. <strong>Niepożądane<\/strong>: istotna różnica między wariancjami w grupach i między rozkładem uzyskanym a normalnym – łamią założenia testów parametrycznych. Tu „dobrze”, gdy p ≥ 0,05.<\/p>",
