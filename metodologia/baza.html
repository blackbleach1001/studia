<script id="baza-data" type="application/json">{"title":"Baza egzaminacyjna","sub":"Podstawy metodologii i statystyki · test jednokrotnego wyboru","groups":[{"id":"baza","t":"Statystyka: pytania z bazy","s":"pytania 1–119"}],"items":[{"id":"1","n":1,"g":"baza","q":"Zgodnie z Kodeksem etyczno-zawodowym psychologa (PTP) ukrywanie przed osobami badanymi właściwego celu badania jest","a":["niedopuszczalne","dopuszczalne","dopuszczalne, lecz wymagające przede wszystkim debriefing'u czyli odkłamania","możliwe dla pewnych grup osób badanych (np. osoby pozbawione praw publicznych)"],"c":2,"e":"Kodeks dopuszcza ukrycie celu badania, gdy jest to konieczne, ale po badaniu trzeba wyjaśnić osobie prawdziwy cel (debriefing)."},{"id":"2","n":2,"g":"baza","q":"Zaletą obserwacji jest ich duża","a":["trafność wewnętrzna","trafność teoretyczna","trafność zewnętrzna","wszystkie pozostałe odpowiedzi na to pytanie są prawidłowe"],"c":2,"e":"Obserwacja w naturalnych warunkach dobrze oddaje rzeczywiste zachowanie, więc ma wysoką trafność zewnętrzną. Słabiej kontroluje przyczyny, więc trafność wewnętrzna jest niższa."},{"id":"3","n":3,"g":"baza","q":"Z kręgu jakiej kultury wywodzą się pionierzy nowoczesnej psychologii eksperymentalnej? Z kręgu kultury języka","a":["francuskiego","niemieckiego","angielskiego","hiszpańskiego"],"c":1,"e":"Pierwsze laboratorium psychologii eksperymentalnej założył Wundt w Lipsku (1879)."},{"id":"4","n":4,"g":"baza","q":"Z jakim niepożądanym zjawiskiem pozwala radzić sobie randomizacja w blokach?","a":["Z efektem wpływu historii","Z efektem manipulacji eksperymentalnej","Z efektem nieznaności instrumentu (aparatury pomiarowej)","Z efektem wprawy"],"c":3,"e":"Randomizacja w blokach rozkłada kolejność warunków tak, by każdy warunek pojawiał się w każdym bloku. Równoważy to efekt wprawy w pomiarach powtarzanych."},{"id":"5","n":5,"g":"baza","q":"Wynik wystandaryzowanego kwestionariusza (np. STAI Spielberger można traktować jako pomiar na skali","a":["stosunkowej","porządkowej","jakościowej","interwałowej"],"c":3,"e":"Sumy i średnie z wystandaryzowanych kwestionariuszy traktuje się w praktyce jak pomiar interwałowy."},{"id":"6","n":6,"g":"baza","q":"Wybranie osób badanych, ze względu na określone właściwości związane z tematem badania jest charakterystyczne dla doboru","a":["grupowego","warstwowego","kwotowego","celowego"],"c":3,"e":"W doborze celowym badacz wybiera osoby, bo mają cechy ważne dla tematu badania."},{"id":"7","n":7,"g":"baza","q":"Wybierz zdanie prawdziwe","a":["W ramach analizy regresji analiza wariancji porównuje wielkość wariancji wyjaśnianej zmiennej Y przez regresję z prostszym modelem, jakim jest skośność tej zmiennej","W ramach analizy regresji analiza wariancji porównuje wielkość wariancji wyjaśnianej zmiennej Y przez regresję z prostszym modelem, jakim jest kurtoza tej zmiennej","W ramach analizy regresji analiza wariancji porównuje wielkość wariancji wyjaśnianej zmiennej Y przez regresję z prostszym modelem, jakim jest średnia arytmetyczna tej zmiennej","W ramach analizy regresji analiza wariancji porównuje wielkość wariancji wyjaśnianej zmiennej Y przez regresję z prostszym modelem, jakim jest odchylenie standardowe tej zmiennej"],"c":2,"e":"Model regresji porównuje się z najprostszym modelem, czyli przewidywaniem każdemu średniej Y."},{"id":"8","n":8,"g":"baza","q":"Wybierz zdanie prawdziwe","a":["Regresja prosta uwzględnia jeden predyktor i kilka zmiennych zależnych","Regresja prosta uwzględnia kilka predyktorów i kilka zmiennych zależnych","Regresja prosta uwzględnia kilka predyktorów i jedną zmienną zależną","Regresja prosta uwzględnia jeden predyktor i jedną zmienną zależną"],"c":3,"e":"Regresja prosta ma jeden predyktor i jedną zmienną zależną. Kilka predyktorów to regresja wielokrotna.","z":1},{"id":"9","n":9,"g":"baza","q":"Wskaż zmienną mierzoną w skali porządkowej","a":["Pamięć mierzona za pomocą procedury rozpoznawania słów","Kolejność urodzeń dzieci w rodzinie mierzona ankietowo","Radość mierzona za pomocą miografu (aktywności elektrycznej mięśni mimicznych)","Uległość mierzona w ten sposób, że kieruje się do uczestników prośbę i sprawdza czy ją spełnią czy nie"],"c":1,"e":"Kolejność urodzeń (pierwsze, drugie, trzecie dziecko) to rangi, więc skala porządkowa."},{"id":"10","n":10,"g":"baza","q":"Wskaż wskaźnik zmiennej psychologicznej","a":["Miłość romantyczna","Czas reakcji","Poczucie winy","Uwaga ekstensywna"],"c":1,"e":"Czas reakcji jest obserwowalny i mierzalny, więc może być wskaźnikiem. Pozostałe to nieobserwowalne konstrukty."},{"id":"11","n":11,"g":"baza","q":"Wskaż poprawnie sformułowaną hipotezę","a":["Każdy człowiek ma swoje ograniczenia","W psychologii wszystkie zmienne są powiązane, ze wszystkimi innymi zmiennymi","Świadomość jest efektem procesów kwantowych zachodzących w mózgu","W porównaniu z muzyką neutralną, słuchanie nielubianej muzyki wywołuje stres fizjologiczny oraz emocje niepokoju."],"c":3,"e":"Dobra hipoteza jest konkretna i falsyfikowalna: wskazuje zmienne i przewidywany wynik."},{"id":"12","n":12,"g":"baza","q":"Wskaż najlepsze uzupełnienie zdania: Ze względu na swój charakter i miejsce w strukturze wyjaśniania naukowego pojęcia naukowe można przyrównać do","a":["kamieni milowych, które wyznaczają naszą drogę w poszukiwaniu ostatecznej prawdy","drzwi, które umożliwiają nam wejście do innego świata","klocków, z których zbudowane są teorie naukowe","młotków, które umożliwiają nam rozbijanie faktów na malutkie kawałeczki"],"c":2,"e":"Pojęcia są elementami, z których buduje się teorie: teoria to powiązania między pojęciami."},{"id":"13","n":13,"g":"baza","q":"Wartość d Cohena > 0,20 oznacza","a":["bardzo dużą różnicę między średnimi","małą różnicę między średnimi","średnią różnicę między średnimi","dużą różnicę między średnimi"],"c":1,"e":"Według progów Cohena d około 0,20 to mały efekt, 0,50 średni, 0,80 duży."},{"id":"14","n":14,"g":"baza","q":"W wyniku pewnego badania wyznaczono równanie regresji: y = 12,83 - 0,74x +/- 6,26. Zmienną y jest poczucie osamotnienia, a zmienną x jest gotowość do przebaczenia. Na podstawie równania regresji można wnioskować, że","a":["wzrost gotowości do przebaczenia nasila poczucie osamotnienia","wzrost gotowości do przebaczenia osłabia poczucie osamotnienia","wzrost poczucia osamotnienia nasila gotowość do przebaczenia","wzrost poczucia osamotnienia osłabia gotowość do przebaczenia"],"c":1,"e":"Współczynnik przy x jest ujemny (−0,74), więc wyższa gotowość do przebaczenia przewiduje niższe osamotnienie."},{"id":"15","n":15,"g":"baza","q":"W pewnym badaniu przeprowadzonym w układzie z powtarzanymi pomiarami do manipulacji w każdym z dwóch warunków eksperymentalnych użyto kalorymetru z bardzo zimną wodą. Przyjmując, że zaznajomienie z zimnem nie było tematem eksperymentu, można je z największym prawdopodobieństwem uznać za czynnik zakłócający... (wybierz najlepszą odpowiedź)","a":["wywołujący przejściową globalną amnezję (TGA)","wywołujący transfer różnicowy","wywołujący syndrom zimy","wywołujący efekt wprawy"],"c":3,"e":"W pomiarach powtarzanych oswojenie się z zimną wodą w pierwszym warunku zmienia reakcję w drugim, czyli działa jak efekt wprawy."},{"id":"16","n":16,"g":"baza","q":"W pewnym badaniu dokonywano pomiaru postaw do statystyki u 1000 osób za pomocą termometru uczuć. Rozkład wyników był normalny, średnia i mediana wyniosły 4, wartość minimalna 1, a maksymalna 7. Jakiej wartości odchylenia standardowego można się spodziewać?","a":["około 1","około 2","około 3","około 4"],"c":0,"e":"W rozkładzie normalnym prawie wszystkie wyniki mieszczą się w ±3 SD, czyli w 6 SD. Rozstęp 1–7 wynosi 6, więc SD ≈ 1.","u":1},{"id":"17","n":17,"g":"baza","q":"W latach 1999-2009 liczba utonięć (w danym roku) w amerykańskich basenach korelowała (r = 0,67) z liczbą filmów z Nicolasem Cage'em, które weszły w danym roku na ekrany kin. Jak zinterpretujesz tę prawdziwą korelację?","a":["Filmy z Nicolasem Cage'em były tak zapadające w pamięć, że ci którzy je obejrzeli nie mogli przestać o nich myśleć i zapominali zabezpieczyć swoje baseny","Załamani kinomani wykorzystywali baseny aby utopić w nich swoje rozczarowanie poziomem filmów z Nicolasem Cage'em","Aby uniknąć rozmów o filmach z Nicolasem Cage'em ludzie decydują się na naukę i doskonalenie pływania w nadziei, że uda im się uciec wpław na Kubę. Niestety pływanie długodystansowe jest trudne","To najpewniej zwykły zbieg okoliczności, choć nie można wykluczyć, że zarówno liczba utonięć, jak i liczba filmów z Cage'em w danym roku zależą od nieznanej zmiennej trzeciej."],"c":3,"e":"Korelacja nie dowodzi przyczynowości. Przy takich zestawieniach to zwykle przypadek albo wspólna trzecia zmienna."},{"id":"18","n":18,"g":"baza","q":"W której z odpowiedzi korelacje uporządkowane są od najsilniejszych do najsłabszych?","a":["r = 0,63; r = -0,13; r = -0,33; r = -0,53","r = -0,13; r = 0,63; r = -0,33; r = -0,53","r = -0,53; r = -0,33; r = -0,13; r = 0,63","r = -0,63; r = 0,53; r = -0,33; r = -0,13"],"c":3,"e":"Siłę korelacji ocenia się po wartości bezwzględnej: 0,63 > 0,53 > 0,33 > 0,13, niezależnie od znaku."},{"id":"19","n":19,"g":"baza","q":"W książce „Chatka Puchatka” pada takie zdanie: „Im bardziej Puchatek zaglądał do środka, tym bardziej Prosiaczka tam nie było”. Na poziomie metodologiczno- statystycznym zdanie to można potraktować jako","a":["dosłowne wyrażenie korelacji dodatniej między głębokością zaglądania do środka a nieobecnością Prosiaczka","dosłowne wyrażenie predykcji ujemnej między głębokością środka a brakiem Prosiaczka","metaforyczne wyrażenie korelacji dodatniej między częstością wspomnień o Prosiaczku a tęsknotą za nim","metaforyczne wyrażenie predykcji ujemnej między skupieniem na sobie a częstością zapominania o Prosiaczku"],"c":0,"e":"„Im bardziej X, tym bardziej Y” to opis korelacji dodatniej. Tu X to zaglądanie do środka, a Y to nieobecność Prosiaczka.","f":"niepewne","z":1},{"id":"20","n":20,"g":"baza","q":"W jakiej skali mierzona jest prospołeczność, jeśli jej wskaźnikiem jest to czy ktoś dał czy nie dał datku pieniężnego na cele charytatywne?","a":["W skali nominalnej","W skali porządkowej","W skali przedziałowej","W skali monetarnej"],"c":0,"e":"Dał albo nie dał to dwie kategorie bez porządku, czyli skala nominalna."},{"id":"21","n":21,"g":"baza","q":"W jakiej metryce należy interpretować współczynniki korelacji?","a":["W pierwiastkowej, po wyciągnięciu pierwiastka ze współczynnika korelacji","W oryginalnej - bezpośrednio wyliczony współczynnik korelacji","W kwadratowej, po podniesieniu korelacji do kwadratu","W sześciennej, po podniesieniu korelacji do sześcianu"],"c":1,"e":"Korelację interpretuje się w jej oryginalnej wartości (kierunek i siła). Jej kwadrat to już współczynnik determinacji."},{"id":"23","n":23,"g":"baza","q":"W badaniu eksperymentalnym losowo dobieramy próbę do badań (1) i losowo przydzielamy osoby do warunków eksperymentalnych (2). Która z tych dwóch procedur wpływa bezpośrednio na trafność wewnętrzną badania","a":["pierwsza","druga","obie","żadna"],"c":1,"e":"Losowy przydział do warunków wyrównuje grupy i chroni trafność wewnętrzną. Losowy dobór próby wpływa na trafność zewnętrzną."},{"id":"24","n":24,"g":"baza","q":"W badaniu sprawdzano wpływ rodzaju przekąsek na stole (rzodkiewki, winogrona, czekoladki) na poziom irytacji wywołanej nierozwiązaniem nierozwiązywalnej zagadki logicznej. Ten eksperyment wymaga","a":["losowego zróżnicowania trudności zagadki logicznej","grupy kontrolnej z rozwiązywalną zagadką logiczną","losowego przydziału rodzaju przekąsek na stole","grupy kontrolnej z wszystkimi rodzajami przekąsek na stole"],"c":2,"e":"Żeby wnioskować o wpływie rodzaju przekąsek, trzeba je losowo przydzielić osobom badanym."},{"id":"25","n":25,"g":"baza","q":"W badaniu sprawdzano jakie są predyktóry nasilenia depresji poporodowej u kobiet. Analiza regresji wykazała wartości istotności statystycznej dla zmiennych: wsparcie ze strony partnera (p = 0,009), idealizacja macierzyństwa przed porodem (p = 0,091), dostępność do poradników opieki nad dzieckiem (p = 0,109), pozytywność obrazu własnej matki (p = 0,319). Można wnioskować, że","a":["predyktorem depresji poporodowej jest wsparcie ze strony partnera","predyktorami depresji poporodowej są wsparcie ze strony partnera i idealizacja macierzyństwa przed porodem","predyktorem depresji poporodowej jest pozytywność obrazu własnej matki","predyktorami depresji poporodowej są pozytywność obrazu własnej matki i dostępność do poradników opieki nad dzieckiem"],"c":0,"e":"Istotne (p < 0,05) jest tylko wsparcie partnera. p = 0,091 nie przekracza progu."},{"id":"26","n":26,"g":"baza","q":"W analizie regresji błąd standardowy oszacowania wynika z tego, że","a":["rozrzut obserwacji nigdy nie tworzy linii idealnie prostej","kierunek związku liniowego jest przeciwny do przewidywanego","predyktóry mają niejednorodne wariancje w grupie","zmienna wyjaśniana i zmienna wyjaśniająca mają jednakową wartość stałej"],"c":0,"e":"Punkty nigdy nie leżą idealnie na prostej. Błąd standardowy oszacowania opisuje ich średnią odległość od linii regresji."},{"id":"27","n":27,"g":"baza","q":"Tabelę częstości można utworzyć","a":["wyłącznie dla zmiennych mierzonych na skalach nominalnych","wyłącznie dla zmiennych mierzonych na skalach interwałowych lub stosunkowych","wyłącznie dla zmiennych mierzonych na skalach nominalnych lub porządkowych","dla dowolnej zmiennej mierzonej na dowolnej skali"],"c":3,"e":"Tabelę częstości można zrobić dla każdej zmiennej. Przy zmiennych ciągłych wyniki grupuje się w przedziały."},{"id":"28","n":28,"g":"baza","q":"Standaryzowany współczynnik regresji pozwala na określenie","a":["stopnia ryzyka, że efekt predykcji jest przypadkowy, nie występuje w rzeczywistości","prawdopodobieństwa wpływu zmiennej zależnej na zmienną niezależną","wartości zmiennej objaśnianej przy wybranej wartości predyktora","siły i kierunku związku liniowego między zmienną wyjaśniającą a zmienną wyjaśnianą"],"c":3,"e":"Współczynnik standaryzowany (beta) mówi o sile i kierunku związku predyktora ze zmienną wyjaśnianą, w jednostkach SD."},{"id":"29","n":29,"g":"baza","q":"Sondaże uliczne przeprowadzane przez media - wywiady z osobami z ulicy, to przykład badań z doborem próby","a":["przypadkowym","losowym","kwotowym","celowym"],"c":0,"e":"Sonda uliczna bierze osoby, które akurat są pod ręką, czyli dobór przypadkowy (dogodny), a nie losowy."},{"id":"30","n":30,"g":"baza","q":"Skala pomiarowa rangowa to inaczej skala","a":["żadna z pozostałych odpowiedzi nie jest poprawna","interwałowa","nominalna","porządkowa"],"c":3,"e":"Skala rangowa to inna nazwa skali porządkowej."},{"id":"31","n":31,"g":"baza","q":"Relację a = k*b można orzekać","a":["wyłącznie dla skali przedziałowej","dla skali przedziałowej i nominalnej","dla skali stosunkowej i przedziałowej","wyłącznie dla skali stosunkowej"],"c":3,"e":"Stosunek „a jest k razy większe od b” wymaga zera absolutnego, czyli skali stosunkowej (ilorazowej)."},{"id":"32","n":32,"g":"baza","q":"Średnią liczymy dla","a":["zmiennych mierzonych na skalach co najmniej porządkowych","zmiennych mierzonych na skalach interwałowych lub stosunkowych","zmiennych mierzonych na skalach stosunkowych","dla dowolnych zmiennych mierzonych na dowolnych skalach"],"c":1,"e":"Średnia wymaga równych odstępów między wartościami, czyli skali co najmniej interwałowej."},{"id":"33","n":33,"g":"baza","q":"R2 (R-kwadrat) wyliczony ze współczynnika korelacji o wartości 0,5 wynosi","a":["0,30","0,50","0,02","0,25"],"c":3,"e":"R² = r² = 0,5² = 0,25."},{"id":"34","n":34,"g":"baza","q":"R2 (R-kwadrat) wyliczony ze współczynnika korelacji o wartości 0,3 wynosi","a":["0,05","0,06","0,07","0,09"],"c":3,"e":"R² = r² = 0,3² = 0,09."},{"id":"35","n":35,"g":"baza","q":"R2 (R-kwadrat) to inaczej","a":["współczynnik McDonalda","współczynnik indeterminacji","współczynnik determinacji","współczynnik Cronbacha"],"c":2,"e":"R² to współczynnik determinacji: odsetek wariancji Y wyjaśniony przez X."},{"id":"36","n":36,"g":"baza","q":"R kwadrat wynoszące 0,45 oznacza, że zmienna X wyjaśnia","a":["45% wariancji zmiennej Y","20% wariancji zmiennej Y","67% wariancji zmiennej Y","4,5% wariancji zmiennej Y"],"c":0,"e":"R² = 0,45 oznacza, że X wyjaśnia 45% wariancji (zmienności) Y.","f":"odpowiedzi odtworzone","u":1},{"id":"37","n":37,"g":"baza","q":"Płeć, preferencje polityczne, wyznanie to przykłady zmiennych, które najczęściej mierzy się na skali","a":["nominalnej (jakościowej)","stosunkowej","porządkowej","interwałowej"],"c":0,"e":"Płeć, poglądy polityczne i wyznanie to kategorie bez porządku, czyli skala nominalna."},{"id":"38","n":38,"g":"baza","q":"Przyporządkowanie cechom liczb w taki sposób, że stosunki równości/nierówności oraz większości/mniejszości między liczbami zostają odwzorowane na stosunki równości/nierówności i większości/mniejszości między cechami, to pomiar na skali","a":["nominalnej","porządkowej","przedziałowa","stosunkowej"],"c":1,"e":"Odwzorowanie równości i porządku (większe, mniejsze) bez równych odstępów to skala porządkowa.","u":1},{"id":"39","n":39,"g":"baza","q":"Poziom istotności (p) to prawdopodobieństwo popełnienia","a":["błędu czwartego rodzaju","błędu trzeciego rodzaju","błędu pierwszego rodzaju","błędu drugiego rodzaju"],"c":2,"e":"Poziom istotności to dopuszczalne ryzyko błędu I rodzaju: odrzucenia prawdziwej H0."},{"id":"40","n":40,"g":"baza","q":"Populacja statystyczna to","a":["grupa osób, w której przeprowadza się badanie","zbiór obiektów lub obserwacji, na który uogólnia się wyniki z badań","bardzo duża (>1000) grupa osób badanych","losowo wybrany podzbiór pewnego zbioru elementów"],"c":1,"e":"Populacja to zbiór, na który uogólniamy wyniki. Grupa faktycznie badana to próba."},{"id":"41","n":41,"g":"baza","q":"Plan eksperymentalny typu „0-1”","a":["to plan eksperymentalny zakładający dychotomiczny (0 albo 1) pomiar zmiennej zależnej","to plan eksperymentalny ZAWSZE z jedną grupą eksperymentalną („1”) i jedną kontrolną (0)","jest wariantem planów eksperym ":"52","n":52,"g":"baza","q":"Który ciąg kolejności realizacji warunków eksperymentalnych nie jest ciągiem otrzymanym w wyniku randomizacji w blokach dwóch warunków eksperymentalnych A i O","a":["AOOAAOOAOAOAOA","OAAOAOOAOAOAOA","AOAOAAOAOAOAOA","OAOAOAAOAOAOOA"],"c":2,"e":"W blokach dwóch prób każda para musi zawierać A i O. W ciągu c druga para to „AA”."},{"id":"53","n":53,"g":"baza","q":"Które ze źródeł wiedzy jest uważane za najbardziej wiarygodne w naukowej psychologii?","a":["Autorytety","Badania empiryczne (obserwacje)","Intuicja","Wnioskowania logiczne"],"c":1,"e":"W nauce empirycznej ostatecznym sprawdzianem są dane z obserwacji i badań."},{"id":"54","n":54,"g":"baza","q":"Które zdanie jest prawdziwe? Naukowcy preferują hipotezy..","a":["skomplikowane ponad te, które są proste","trudniejsze do udowodnienia ponad te, które są łatwe do udowodnienia","łatwe do udowodnienia, ponad te, które są trudne do udowodnienia","proste ponad te, które są skomplikowane"],"c":3,"e":"Zasada oszczędności (brzytwa Ockhama): przy równej mocy wyjaśniającej wybiera się hipotezę prostszą.","u":1},{"id":"55","n":55,"g":"baza","q":"Które z wymienionych pojęć nie pasuje do pozostałych trzech?","a":["warunek eksperymentalny","randomizacja","korelacja","kontrola eksperymentalna"],"c":2,"e":"Warunek, randomizacja i kontrola to elementy eksperymentu. Korelacja do nich nie należy.","u":1},{"id":"56","n":56,"g":"baza","q":"Które z poniższych zdań jest prawdziwe? W psychologii... (Fałszywy alarm = uznanie za istniejący efektu, którego nie ma; wyniki fałszywie ujemne = uznanie za nieistniejący w rzeczywistości istniejącego efektu)","a":["fałszywe alarmy są uznawane za równie niebezpieczne błędy jak wyniki fałszywie ujemne","fałszywe alarmy są uznawane za bardziej niebezpieczne błędy niż wyniki fałszywie ujemne","fałszywe alarmy są uznawane za mniej niebezpieczne błędy niż wyniki fałszywie ujemne","fałszywe alarmy oraz wyniki fałszywie ujemne nie są uznawane za błędy"],"c":1,"e":"W psychologii błąd I rodzaju (α = 0,05) uznaje się za groźniejszy niż błąd II rodzaju (zwykle akceptuje się β = 0,20).","u":1},{"id":"57","n":57,"g":"baza","q":"Które z opisanych badań będzie miało największą moc (prawdopodobieństwo odrzucenia w rzeczywistości fałszywej hipotezy zerowej)?","a":["Eksperyment w planie powtarzanych pomiarów, w którym N = 500","Eksperyment w planie grup niezależnych, w którym N = 500","Eksperyment w planie grup niezależnych, w którym N = 400","Eksperyment w planie powtarzanych pomiarów, w którym N = 400"],"c":0,"e":"Moc rośnie z liczebnością, a plan powtarzanych pomiarów usuwa różnice między osobami. Największą moc ma więc pomiar powtarzany z N = 500.","u":1},{"id":"58","n":58,"g":"baza","q":"Które uporządkowanie obserwacji jest uporządkowaniem od najmniej trafnej zewnętrznie do najbardziej trafnej zewnętrznie?","a":["obserwacja w warunkach naturalnych; obserwacja uczestnicząca, obserwacja ustrukturowana","obserwacja uczestnicząca; obserwacja ustrukturowana; obserwacja w warunkach naturalnych","obserwacja ustrukturowana; obserwacja uczestnicząca; obserwacja w warunkach naturalnych","obserwacja uczestnicząca; obserwacja w warunkach naturalnych; obserwacja ustrukturowana"],"c":2,"e":"Im bardziej sztuczna i ustrukturowana sytuacja, tym niższa trafność zewnętrzna. Najwyższą ma obserwacja w warunkach naturalnych.","u":1},{"id":"59","n":59,"g":"baza","q":"Które dokończenie zdania jest prawdziwe? W przypadku rozkładów lewoskośnych zwykle","a":["średnia i odchylenie standardowe są sobie równe","mediana jest mniejsza od średniej","średnia i mediana są sobie równe","średnia jest mniejsza od mediany"],"c":3,"e":"W rozkładzie lewoskośnym długi ogon ciągnie średnią w stronę niskich wartości, więc średnia jest mniejsza od mediany.","u":1},{"id":"60","n":60,"g":"baza","q":"Która/które z podanych cech DOTYCZĄ podejścia nomotetycznego do badań naukowych (UWAGA: WYBIERZ NAJLEPSZĄ ODPOWIEDŹ)?","a":["wszystkie odpowiedzi są poprawne","cel: wyjaśnianie","metoda analizy czonych i do rozwoju tzw. nauki instytucjonalnej","Do zwiększenia kreatywności badaczy i ich elastyczności w podejmowaniu decyzji dotyczących problemów badawczych","Do rozwoju nauki poprzez zmniejszenie instytucjonalnej kontroli i weryfikacji, co może prowadzić do powstawania nowych teorii i wyników badań"],"c":1,"e":"Nadmierne przywiązanie do autorytetów hamuje krytyczne myślenie i żywą działalność badaczy.","u":1},{"id":"97","n":97,"g":"baza","q":"Do czego prowadzi kodowanie danych zebranych w trakcie obserwacji?","a":["Do zmniejszenia szczegółowości opisu","Do obniżenia użyteczności zebranych danych","Do podwyższenia obiektywności obserwacji","Do wzbogacenia szczegółowości opisu"],"c":0,"e":"Kodowanie zamienia bogaty opis na kategorie i liczby, więc zmniejsza szczegółowość, w zamian umożliwiając analizę.","f":"niepewne","u":1},{"id":"98","n":98,"g":"baza","q":"Do czego jest wykorzystywana intuicja w procesie naukowym?","a":["Intuicja dostarcza inspiracji dla wyboru problemu badawczego","Intuicja ostatecznie potwierdza lub falsyfikuje hipotezy","Intuicja jest źródłem ocen jakości badań empirycznych","Intuicja jest głównym źródłem wiedzy naukowej"],"c":0,"e":"Intuicja podsuwa problemy i pomysły na hipotezy. Rozstrzygają je dane.","u":1},{"id":"99","n":99,"g":"baza","q":"Dla zmiennych mierzonych za pomocą jakich skal pomiaru można wykonywać analizy korelacyjne?","a":["Nominalnego","Porządkowego","Interwałowego","Wszystkie pozostałe odpowiedzi są poprawne"],"c":3,"e":"Korelacje liczy się na każdej skali: phi i V Cramera dla nominalnych, Spearman dla porządkowych, Pearson dla ilościowych.","u":1},{"id":"100","n":100,"g":"baza","q":"Dla danych z lat 2000-2009 na poziomie r = 0,992 liczba rozwodów (w danym roku) w stanie Maine, USA korelowała z ilością margaryny spożywanej w ciągu roku przez przeciętnego Amerykanina. Jak zinterpretujesz tę prawdziwą korelację?","a":["Osoby po rozwodzie biednieją i nie stać ich na kupowanie masła, więc jedzą margarynę","Gdy źle się dzieje w rodzinie przestaje ona używać masła, które jest drogie i zamienia je na margarynę. Zmiana masła na margarynę nie tylko wprowadza w rodzinie niezdrowe nawyki żywieniowe, ale także symbolicznie oznacza brak troski o siebie nawzajem. Rozwód jest tylko kwestią czasu","To najpewniej zwykły zbieg okoliczności, choć nie można wykluczyć, że zarówno liczba rozwodów, jak i spożycie margaryny w danym roku zależą od nieznanej zmiennej trzeciej","Spożywanie margaryny upośledza funkcjonowanie kory przedczołowej członków rodziny co prowadzi do konfliktów rodzinnych i rozwodów"],"c":2,"e":"Korelacja nie dowodzi przyczynowości. To najpewniej przypadek albo wspólna trzecia zmienna.","u":1},{"id":"102","n":102,"g":"baza","q":"Czym jest w istocie błąd standardowy średniej?","a":["Jest odchyleniem standardowym średniej w próbce","Jest odchyleniem standardowym średniej w populacji","Jest odchyleniem standardowym odchylenia standardowego w próbce","Jest odchyleniem standardowym rozkładu średnich z próbkowania"],"c":3,"e":"Błąd standardowy średniej to odchylenie standardowe rozkładu średnich z wielu prób.","u":1},{"id":"103","n":103,"g":"baza","q":"Czym jest tzw. hipoteza zerowa - H0?","a":["Najprostszą wywiedzioną z teorii hipotezą badawczą, którą badacz powinien poddać testowaniu","Pełnowartościową hipotezą przeciwstawioną hipotezie alternatywnej, która oznacza, że hipoteza zerowa jest prawdziwa","Technicznym założeniem procedury analizy statystycznej, jej NIEODRZUCENIE nie oznacza, że jest ona prawdziwa","Hipoteza zerowa to poziom wsparcia dla alternatywnej hipotezy, który jest badany podczas testów statystycznych"],"c":2,"e":"H0 to techniczne założenie testu. Jej nieodrzucenie nie dowodzi, że jest prawdziwa.","u":1},{"id":"104","n":104,"g":"baza","q":"Czym jest stwierdzenie: „Jeśli chodzi o cechy osobowości, psychiatrzy są zazwyczaj miłymi neurotykami.”?","a":["Wnioskiem z badania korelacyjnego","Wnioskiem z obserwacji ustrukturyzowanej","Wnioskiem z badania eksperymentalnego w planie powtarzanych pomiarów","Wnioskiem z badania eksperymentalnego w planie grup niezależnych"],"c":0,"e":"Zdanie opisuje współwystępowanie cech u psychiatrów bez manipulacji, więc to wniosek z badania korelacyjnego.","u":1},{"id":"105","n":105,"g":"baza","q":"Czy w psychologii można w pojedynczym badaniu tę samą zmienną manipulować i ją także mierzyć?","a":["Nie, w takim przypadku należy stosować inne metody, takie jak np. weryfikacja wtórna","Tak, w psychologii można w pojedynczym badaniu manipulować i mierzyć tę samą zmienną i bardzo często tak się robi","Tak, ale rzadko i należy to robić ze szczególną ostrożnością, aby uniknąć problemów związanych z autokorelacją i efektami wtórnymi","Nie, taka praktyka może prowadzić do błędnych wniosków i wątpliwych interpretacji"],"c":1,"e":"Tak, np. sprawdzenie manipulacji (manipulation check): badacz manipuluje zmienną i mierzy, czy manipulacja zadziałała.","f":"niepewne","u":1},{"id":"106","n":106,"g":"baza","q":"Czy w praktyce, w pomiarach z badań na dużych próbach, odchylenie standardowe może być równe zero?","a":["Tak, często się to zdarza we wszystkich naukach","Nie, to się nigdy nie zdarza","Tak, ale tylko w innych naukach niż psychologia","Tak, ale tylko w psychologii"],"c":1,"e":"SD = 0 oznacza, że wszyscy mają identyczny wynik. Przy dużej próbie w psychologii to się nie zdarza.","u":1},{"id":"107","n":107,"g":"baza","q":"Czy to, że udzielenie odpowiedzi na pytanie badawcze zwykle prowadzi do kolejnych pytań badawczych jest zaletą, czy wadą nauki?","a":["Wadą, bo nadmiar pytań badawczych może ponad miarę zwiększać koszt finansowy i czasowy badań","Wadą, bo może to wprowadzać zamieszanie i niejasność w interpretacji danych","Zaletą, bo stwarza to możliwość uzyskania bardziej precyzyjnej i kompleksowej wiedzy na dany temat","Wadą, bo może to prowadzić do bez końca trwającego procesu badawczego i braku postępu w naukowym opisie rzeczywistości"],"c":2,"e":"To zaleta: kolejne pytania prowadzą do pełniejszej i dokładniejszej wiedzy.","u":1},{"id":"108","n":108,"g":"baza","q":"Czego nazwami są słowa takie jak np.: „posłuszeństwo”, „pożądanie”, „dobrostan”, „zaufanie”, „motywacja”?","a":["Emocji","Zmiennych","Korozji","Wskaźników"],"c":1,"e":"To nazwy zmiennych (konstruktów), a nie ich wskaźników.","u":1},{"id":"109","n":109,"g":"baza","q":"Czego istotą jest dążenie do wiedzy i zrozumienia zgodnie z systematyczną metodologią?","a":["statystyki","nauki","polityki","metodologii"],"c":1,"e":"Dążenie do wiedzy i zrozumienia zgodnie z systematyczną metodologią to definicja nauki.","u":1},{"id":"110","n":110,"g":"baza","q":"Co oznacza termin „determinizm” w odniesieniu do teorii naukowych? Determinizm oznacza, że teorie tworzone są na fundamencie założenia, że","a":["opisywane zjawiska są losowe i przypadkowe","opisywane zjawiska są wywoływane przez chaos","opisywane zjawiska są wywoływane przez przyczyny naturalne, które można wskazać, nazwać i zmierzyć","opisywane zjawiska trzeba ująć w postać równań matematycznych"],"c":2,"e":"Determinizm zakłada, że zjawiska mają naturalne przyczyny, które można wskazać, nazwać i zmierzyć.","u":1},{"id":"111","n":111,"g":"baza","q":"Co nie jest procedurą kontroli eksperymentalnej?","a":["manipulowanie zmienną niezależną","utrzymywanie na stałym poziomie wszystkich innych zmiennych niż zmienna niezależna mogących wpłynąć na zmienną zależną","równoważenie wpływu zmiennych zakłócających, np. poprzez randomizację","manipulowanie zmiennymi zakłócającymi"],"c":3,"e":"Kontrola to manipulacja zmienną niezależną, stałość innych zmiennych i randomizacja. Zmiennymi zakłócającymi się nie manipuluje, tylko się je kontroluje.","f":"niepewne","u":1},{"id":"112","n":112,"g":"baza","q":"Badacz postawił hipotezę: Im osoby mieszkają dalej na wschód od Warszawy, tym mają większe poczucie zagrożenia wojną. Hipotezę tę można zweryfikować","a":["w schemacie korelacyjnym, traktując miejsce zamieszkania jako zmienną nominalną","w schemacie regresyjnym, traktując poczucie zagrożenia wojną jako zmienną zależną","w schemacie eksperymentalnym, traktując odległość od Warszawy na wschód jako zmienną manipulacyjną","w schemacie porównawczym, traktując bliskość dziejącej się wojny jako zmienną wyjaśnianą"],"c":1,"e":"Miejsca zamieszkania nie da się manipulować. Poczucie zagrożenia można przewidywać z odległości w regresji, jako zmienną zależną.","u":1},{"id":"113","n":113,"g":"baza","q":"Badacz bada wpływ alkoholu na koordynację ręka-oko. Połowa uczestników pije pół litra piwa, a połowa pół litra wody. Następnie wszyscy uczestnicy rzucają trzema strzałkami w tarczę do darta i ich wynik jest rejestrowany. Jak najlepiej opisać ten eksperyment?","a":["Eksperyment w planie powtarzanych pomiarów. Zmienna niezależna to koordynacja ręka-oko (wynik rzutów trzema strzałkami). Zmienna zależna to ilość wypitego alkoholu","Eksperyment w planie grup niezależnych. Zmienna niezależna to koordynacja ręka-oko (wynik rzutów trzema strzałkami). Zmienna zależna to ilość wypitego alkoholu","Eksperyment w planie powtarzanych pomiarów. Zmienna niezależna to ilość wypitego alkoholu. Zmienna zależna to koordynacja ręka-oko (wynik rzutów trzema strzałkami)","Eksperyment w planie grup niezależnych. Zmienna niezależna to ilość wypitego alkoholu. Zmienna zależna to koordynacja ręka-oko (wynik rzutów trzema strzałkami)"],"c":3,"e":"Różne osoby piją piwo albo wodę, więc to grupy niezależne. Manipulowany jest alkohol (ZN), mierzona koordynacja (ZZ).","u":1},{"id":"114","n":114,"g":"baza","q":"W pewnym badaniu średnia pomiaru tolerancji niepewności wyniosła 72. Badacz zastosował przedział ufności 95%, a tym samym średnia pomiaru tolerancji niepewności zawarła się w przedziale od 65 do 79. Jeśli w tym samym badaniu zastosuje przedział ufności 85%, możliwym przedziałem zawierania się średniej tolerancji niepewności będzie:","a":["Od 62 do 72","Od 67 do 77","Od 64 do 80","Od 68 do 82"],"c":1,"e":"Przedział 85% jest węższy niż 95% i ma ten sam środek (72), więc np. od 67 do 77.","u":1},{"id":"115","n":115,"g":"baza","q":"Spośród podanych poniżej zdań nieprawdziwe jest:","a":["jeśli badacz chce realizować cel prognostyczny w psychologii, może zastosować analizę korelacji","jeśli badacz chce realizować cel eksplanacyjny w psychologii, może zastosować analizę wariancji","jeśli badacz chce realizować cel deskryptywny w psychologii, może zastosować analizę regresji","jeśli badacz chce realizować cel aplikacyjny w psychologii, może zastosować analizę porównawczą dla dwóch prób."],"c":2,"e":"Regresja służy przewidywaniu, a nie opisowi. Pozostałe przyporządkowania są poprawne.","f":"niepewne","u":1},{"id":"116","n":116,"g":"baza","q":"Metody projekcyjne w psychologii:","a":["są konieczne do zaprojektowania skutecznych oddziaływań terapeutycznych","dostarczają znormalizowanych wskaźników obserwowalnych","polegają na przeniesieniu relacji między badaczem a osobą badaną na relację z osobą trzecią","mogą wywołać rzutowanie stanów psychicznych osoby badanej na jej wytwory"],"c":3,"e":"W metodach projekcyjnych osoba rzutuje swoje stany psychiczne na wytwory (rysunek, opowiadanie).","u":1},{"id":"117","n":117,"g":"baza","q":"Pośród podanych poniżej zdań prawdziwe jest:","a":["Występowanie interakcji płci i posiadania (vs. Nieposiadania)prawa jazdy w oddziaływaniu na preferowaną markę samochodu pozwala wnioskować o efekcie progresji","Występowanie interakcji płci i posiadania (vs. Nieposiadania)prawa jazdy w oddziaływaniu na preferowaną markę samochodu pozwala wnioskować o efekcie regresji","Występowanie interakcji płci i posiadania (vs. Nieposiadania)prawa jazdy w oddziaływaniu na preferowaną markę samochodu pozwala wnioskować o efekcie mediacji","Występowanie interakcji płci i posiadania (vs. Nieposiadania)prawa jazdy w oddziaływaniu na preferowaną markę samochodu pozwala wnioskować o efekcie moderacji"],"c":3,"e":"Gdy wpływ jednej zmiennej zależy od poziomu drugiej (interakcja), mówimy o moderacji.","u":1},{"id":"118","n":118,"g":"baza","q":"Spośród podanych poniżej zdań prawdziwe jest:","a":["W psychologii wnioskowanie dedukcyjne zawsze wyprzedza wnioskowanie indukcyjne, ponieważ pomiar standaryzowany (np. w warunkach eksperymentalnych) jest możliwy tylko w ramach jednego paradygmatu","W psychologii wnioskowanie indukcyjne zawsze wyprzedza wnioskowanie dedukcyjne, ponieważ operacjonalizacja zmiennych wymaga przyjęcia przesłanek o charakterze normatywnym","W psychologii wnioskowanie dedukcyjne może wyprzedzać wnioskowanie indukcyjne, gdy brakuje założeń teoretycznych do postawienia hipotez alternatywnych","W psychologii wnioskowanie indukcyjne może wyprzedzać wnioskowanie dedukcyjne gdy nowe zjawiska (np. uzależnienie od Internetu) nie mieszczą się w ramach dotychczasowych teorii psychologicznych"],"c":3,"e":"Gdy nowe zjawisko nie mieści się w teoriach, zaczyna się od obserwacji i uogólnień (indukcja), a dopiero potem dedukuje hipotezy.","u":1},{"id":"119","n":119,"g":"baza","q":"Spośród podanych poniżej definicji operacyjna zmiennej jest:","a":["ruminowanie można wyjaśnić poprzez uwzględnienie wpływu negatywnych wydarzeń i skłonność osoby do doświadczania wstydu","impostoryzm znaczy tyle co syndrom oszusta","responsywność osoby można zdefiniować poprzez pomiar czasu, jaki mija od momentu otrzymania przez nią e-maila do momentu, kiedy na niego odpowie","indyferentność osoby jest obojętnością, jaką przejawia ona względem ludzi próbujących nawiązać z nią kontakt"],"c":2,"e":"Definicja operacyjna mówi, jak zmienną zmierzyć: tu przez czas odpowiedzi na e-mail.","u":1}],"dir":"metodologia"}</script>
